<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<!-- R10 · pinch-zoom stays available: the reader this product is built for is 55 and often in
     poor light, and «user-scalable=no» took his last resort away. Nothing here needs a zoom lock. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A0F1E">
<link rel="manifest" href="manifest.json">
<title>ArmTrade — Prototype</title>
<!-- R16 · THE DISPLAY FONTS ARE SELF-HOSTED. They were two <link>s to fonts.googleapis.com, which
     the service worker deliberately does not cache (it caches same-origin only, and a stale
     third-party stylesheet is not a thing to serve from a basement). So the app a shopkeeper
     opened offline — the case the PWA exists for — silently rendered in system fallback fonts:
     different metrics, different digit widths, a different product from the one that was
     designed and reviewed. Now three woff2 files ship with the app, are precached by sw.js and
     render identically online and off.
     WHY THE VARIABLE CUT, not the four static weights the design system names (400/500/600/700):
     the four static weights of Inter (latin+cyrillic) plus Noto Sans Armenian (armenian) are
     162,684 bytes over twelve files; the weight-axis variable cut of the same three subsets is
     93,816 bytes over three — 43% less, one round trip per subset instead of four, and every
     weight is the real drawn weight rather than the nearest available one. On a cheap Android on
     a slow connection that is the whole argument. Files come from @fontsource-variable/inter and
     @fontsource-variable/noto-sans-armenian 5.3.0 (SIL OFL 1.1, licences beside them).
     SUBSETS: latin + cyrillic for Inter (hy/en/ru — the app's three languages; latin-ext, greek
     and vietnamese are dropped), armenian for Noto Sans Armenian. The dram sign ֏ (U+058F) lives
     in the armenian range, which is why every money figure needs that file even in English.
     The @font-face families are named 'Inter' and 'Noto Sans Armenian' — the names --font already
     asks for — so the type scale below is untouched and a browser that cannot load the files
     falls through the same system stack it always did. -->
<!-- the two files EVERY language needs: Inter latin carries the digits of every money figure and
     Noto Sans Armenian carries ֏ itself, so both are fetched on any screen in any language. The
     cyrillic file is left to unicode-range, i.e. to a Russian user only — 75,068 B on first
     paint in hy/en, 93,816 B in ru. R17 · that was true of the PAGE and false of the INSTALL:
     the service worker's SHELL listed all three, so an Armenian-only install downloaded and
     stored Cyrillic anyway. sw.js now precaches latin+armenian only and pulls Cyrillic in on
     first use (or on the {type:'shellfont'} message swWantCyrillic() posts when the language is
     ru), so the claim above now holds end to end. -->
<link rel="preload" href="vendor/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="vendor/fonts/noto-sans-armenian-armenian-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Inter';font-style:normal;font-display:swap;font-weight:100 900;
  src:url(vendor/fonts/inter-latin-wght-normal.woff2) format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Inter';font-style:normal;font-display:swap;font-weight:100 900;
  src:url(vendor/fonts/inter-cyrillic-wght-normal.woff2) format('woff2');
  unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Noto Sans Armenian';font-style:normal;font-display:swap;font-weight:100 900;
  src:url(vendor/fonts/noto-sans-armenian-armenian-wght-normal.woff2) format('woff2');
  unicode-range:U+0308,U+0530-058F,U+2010,U+2024,U+25CC,U+FB13-FB17}
/* ================= ArmTrade design system v5 "Aisle" =================
   Optimised for a 55-year-old shopkeeper reading a number correctly, first
   time, one-handed, in bad light, on a cheap Android. Budget goes to size,
   weight and whitespace; almost nothing to colour. */
:root{
  /* ---- surfaces & ink ---- */
  --bg:#0B0F17;
  --surface:#161C2A;          /* cards, sheets, nav, header */
  --surface-2:#1E2637;        /* inputs, steppers, quiet fills */
  --surface-3:#28324A;        /* pressed / hover */
  --ink:#E8EDF7;              /* 16.3:1 on --bg */
  --muted:#A3B0C7;            /* 8.8:1 on --bg  — body-secondary */
  --dim:#8B97AE;              /* 6.5:1 on --bg  — micro-labels only */
  /* was --sep:var(--sep) — a self-reference, so every hairline in the dark
     theme fell back to currentColor and drew a near-white line. */
  --sep:#242D40;              /* hairline inside a surface */
  --stroke:#242D40;           /* card border */
  --stroke2:#313C55;          /* control border */

  /* ---- the one accent ---- */
  --acc:#F0A93B;              /* 9.5:1 on --bg, 8.5:1 on --surface */
  --acc-ink:#1A1205;          /* text ON the accent */
  --acc-tint:#2A1F0C;         /* accent-tinted surface */
  --acc-line:#5A431A;         /* accent-tinted border */
  --acc-text:#F5C06A;         /* accent as text on a tint */

  /* legacy aliases — every existing rule keeps compiling */
  --gold:var(--acc); --gold2:var(--acc-text);

  /* ---- status (badges, rails, alerts — NEVER buttons) ---- */
  --danger:#FF9C9C;   --danger-tint:#2A1315; --danger-line:#5A2226;
  --success:#5AD79A;  --success-tint:#0E2A1E; --success-line:#1E5540;
  --info:#7DD3FC;     --info-tint:#0D2430;   --info-line:#1C4A5E;
  --note:#C4B5FD;     --note-tint:#1E1A33;   --note-line:#3B3161;
  /* legacy aliases */
  --rose:var(--danger); --green:var(--success); --cyan:var(--info);
  --violet:var(--note); --blue:var(--info);

  /* glass primitives retired — kept as flat surfaces so .glass/.card compile */
  --glass:var(--surface); --glass2:var(--surface-2);

  /* ---- type ---- */
  --font:'Inter','Noto Sans Armenian',-apple-system,'Segoe UI',Roboto,sans-serif;
  --display:var(--font);
  --mono:var(--font);         /* figures come from Inter tnum, not a mono face */

  /* R6 legibility floor: the reader is 55, in bad light, on a cheap phone. Nothing that
     carries meaning is allowed below 14px; the only exceptions are the bottom-nav label
     (11.5px, physically bounded by a 10-cell strip) and status pills (12px).
     The 41px of chrome this round reclaimed is spent here, on the content. */
  --fs-display-l:34px; --lh-display-l:1.05; --ls-display-l:-0.8px; --fw-display-l:700;
  --fs-display-m:26px; --lh-display-m:1.10; --ls-display-m:-0.5px; --fw-display-m:700;
  --fs-display-s:21px; --lh-display-s:1.15; --ls-display-s:-0.3px; --fw-display-s:700;
  --fs-title:17px;     --lh-title:1.25;     --ls-title:-0.2px;     --fw-title:700;
  --fs-body-l:16px;    --lh-body-l:1.35;    --ls-body-l:-0.1px;    --fw-body-l:600;
  --fs-body:15px;      --lh-body:1.45;      --ls-body:0;           --fw-body:400;
  --fs-label:14px;     --lh-label:1.25;     --ls-label:0;          --fw-label:600;
  --fs-micro:14px;     --lh-micro:1.40;     --ls-micro:0;          --fw-micro:500;
  /* R9 · legibility audit: the target reader is 55 and presbyopic, in a dim aisle. Nothing
     in the product may render below 14px, so the two sub-14 tokens are retired: the badge
     and the nav label carry the answers he opened the app for. */
  --fs-caps:14px;      --lh-caps:1.20;      --ls-caps:0.2px;       --fw-caps:700;
  --fs-nav:14px;       --lh-nav:1.15;

  /* ---- spacing: strict 4px grid ---- */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px; --s10:40px;

  /* ---- radii ---- */
  --r-xs:6px; --r-sm:10px; --r:14px; --r-lg:18px; --r-pill:999px;

  /* ---- borders ---- */
  --bw:1px; --bw-strong:1.5px;

  /* ---- elevation ---- */
  --sh-0:none;
  --sh-1:0 1px 2px rgba(0,0,0,.45);
  --sh-2:0 6px 20px rgba(0,0,0,.50);
  --sh-3:0 -8px 32px rgba(0,0,0,.55);
  --focus:0 0 0 3px rgba(240,169,59,.34);

  /* ---- motion ---- */
  --dur-1:120ms; --dur-2:180ms; --dur-3:260ms;
  --ease:cubic-bezier(.2,0,0,1);
  --ease-out:cubic-bezier(.16,1,.3,1);

  /* ---- chrome heights (single source of truth) ---- */
  --h-top:52px; --h-nav-row:44px; --h-nav:92px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* the canvas colour must come from BODY alone. html carrying its own background blocks CSS's
   background-propagation rule, so body.light's #F4F6F8 never painted the area below a short
   page and the dark :root --bg showed through as a black band on every empty screen. */
html{margin:0;padding:0}
body{
  margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:var(--font);
  font-size:var(--fs-body);line-height:var(--lh-body);
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum" 1,"lnum" 1;
}
body::before,body::after{display:none}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important}
}
button{font-family:var(--font)}

/* ---------- money & numerals (§4) ---------- */
/* .num appears ~90 times. This one rule fixes every one of them. */
.num{
  font-family:var(--font);
  font-variant-numeric:tabular-nums lining-nums;
  font-feature-settings:"tnum" 1,"lnum" 1;
  letter-spacing:-.1px;
  font-weight:600;
  white-space:nowrap;
}
/* the hero number: on-hand, at-risk value, basket total, KPI value */
.big{
  font-family:var(--font);
  font-size:var(--fs-display-m);font-weight:var(--fw-display-m);
  line-height:var(--lh-display-m);letter-spacing:var(--ls-display-m);
  font-variant-numeric:tabular-nums lining-nums;
  color:var(--ink);
}
/* the currency mark is quieter than the amount: smaller, lighter, one space of air */
/* .cur is ALWAYS nested inside the .num/.big it belongs to (see amd() and every call site),
   so .7em resolves against the amount, never against whatever container the pair landed in.
   max() puts a hard 14px floor under it: at 8px the dram sign read as a smudge on paper and
   on a dim screen, which is the one thing a money mark may never do. */
.cur{
  font-size:max(.7em,14px);font-weight:600;color:var(--muted);
  margin-left:.22em;letter-spacing:0;
  font-variant-numeric:normal;
}
/* inside a status pill the mark rides WITH the pill's own text — a 13px floor there would
   make the ֏ larger than the digits beside it */
.badge .cur{font-size:1em;font-weight:700;color:inherit;margin-left:.15em}
/* the caption OF a number: micro-label above, value below (§4 rule 3). Never body prose. */
.mlbl,.doclbl{
  font-size:var(--fs-caps);font-weight:var(--fw-caps);line-height:var(--lh-caps);
  letter-spacing:0;color:var(--dim);text-transform:none;
}
.doclbl{margin-bottom:2px}
.neg{color:var(--danger);font-weight:700}
.neg::before{content:"−";margin-right:.05em}
.pos{color:var(--success);font-weight:700}
.osum{font-weight:700;margin-top:var(--s2);font-size:var(--fs-body-l);color:var(--ink);
  font-variant-numeric:tabular-nums}

/* ---------- card ---------- */
.glass,.card{
  background:var(--surface);
  border:var(--bw) solid var(--stroke);
  border-radius:var(--r);
  box-shadow:var(--sh-1);
  backdrop-filter:none;-webkit-backdrop-filter:none;
}
.card{padding:var(--s4);margin-bottom:var(--s3)}
.card h3{
  margin:0 0 var(--s3);
  font-family:var(--font);
  font-size:var(--fs-title);font-weight:var(--fw-title);
  line-height:var(--lh-title);letter-spacing:var(--ls-title);
  display:flex;align-items:center;gap:var(--s2);
}
/* section heading above a card group. Armenian is NOT uppercased: at 11px with
   1.7px tracking, all-caps Armenian is the single least legible thing in the app. */
.sec{
  margin:var(--s5) var(--s1) var(--s2);
  font-size:15px;font-weight:700;line-height:1.3;letter-spacing:-.1px;
  color:var(--ink);text-transform:none;
  display:flex;align-items:center;gap:var(--s2);
}
.sec:first-child{margin-top:var(--s1)}
/* a row is a label and its value. When the pair genuinely cannot share a line — a long
   Armenian product name beside a status pill — the value drops to its own line rather than
   squeezing the pill into a three-line block taller than the row it annotates. */
.row{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);flex-wrap:wrap}
.row>*{min-width:0}
/* ...and when it DOES wrap, the value must stay on the value's edge. justify-content only
   distributes within a line, so a wrapped value block sat at the LEFT margin, indented by its own
   shrink-to-fit width — the Պարտքեր amounts floated in the middle of the card with nothing to
   align to. `margin-left:auto` on the trailing block pins it to the right edge on its own line
   and is a no-op when the pair fits. (.selloutfoot is the one .row with more than two children.) */
.row:not(.selloutfoot)>*:last-child:not(:only-child){margin-left:auto}
.muted{color:var(--muted);font-size:var(--fs-micro);line-height:var(--lh-micro)}

.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s2);margin-bottom:var(--s1)}
.kpi{
  background:var(--surface);border:var(--bw) solid var(--stroke);
  border-radius:var(--r);padding:var(--s3) var(--s3) var(--s4);
  position:relative;overflow:hidden;box-shadow:var(--sh-1);
  display:flex;flex-direction:column;gap:var(--s1);min-height:84px;justify-content:flex-end;
}
.kpi::before{display:none}                        /* the corner glow is gone */
.kpi .l{
  order:1;font-size:var(--fs-caps);font-weight:var(--fw-caps);
  line-height:var(--lh-caps);letter-spacing:var(--ls-caps);
  color:var(--dim);text-transform:none;
  display:flex;align-items:center;gap:var(--s1);
  min-height:2.3em;                               /* two-line HY labels stay aligned */
}
.kpi .v{
  order:2;font-family:var(--font);
  font-size:var(--fs-display-m);font-weight:var(--fw-display-m);
  line-height:var(--lh-display-m);letter-spacing:var(--ls-display-m);
  color:var(--ink);margin-top:0;
}
/* A 2x2 grid of peer metrics must share ONE value size or the four numbers stop scanning as
   one row. A money tile carries up to 9 digits, so instead of shrinking that ONE tile the whole
   grid steps down together at the widths where the digits stop fitting. */
.kpi .v.m{letter-spacing:-.4px}
@media (max-width:400px){ .kpi .v,.kpi .v.m{font-size:23px;line-height:1.15} }
@media (max-width:340px){ .kpi .v,.kpi .v.m{font-size:19px;line-height:1.15} }
/* R10 · a two-up tile on a 320px phone is 140px wide and «Շրջանառություն» is a single 130px
   word: there is no wrap that saves it and 14px is the type floor, so the BOX gives instead —
   one tile per row below 360px. Every label reads whole; the four values still step together. */
@media (max-width:359px){
  .kpis{grid-template-columns:1fr}
  /* one per row means no cross-tile baseline to hold and no two-line label to reserve for */
  .kpi{min-height:0;padding-bottom:var(--s3)}
  .kpi .l{min-height:0}
}
/* C2 · two tiles in one row ARE a comparison, so their figures must sit on one baseline. The
   generic 2.3em reserve is one line plus slack; a genuinely two-line label («Առաքման ժամկետ» in a
   half-width tile, «Срок поставки» in ru) is 2 × 1.20em and pushed its value down while the tile
   beside it did not move. This pair reserves both lines outright. */
.kpis.kpi2 .kpi .l{min-height:2.5em}
@media (max-width:359px){ .kpis.kpi2 .kpi .l{min-height:0} }
/* the ONE exception to "KPI numbers are always --ink": an actionable alert count */
.kpi-alert{border-color:var(--danger-line);background:var(--danger-tint)}
.kpi-alert .v{color:var(--danger)}
.kpi-alert .l{color:var(--danger)}

/* C3 · the supplier console's export block: six peer actions, none of them the accent. Two up on
   a phone, one up where an Armenian label cannot hold a 150px column. Labels wrap on the space
   between words — never mid-word — and the 52px box keeps the tap target above the floor even
   with a two-line label. */
.expgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s2)}
.expgrid .btn{width:100%;min-height:52px;padding:var(--s2) var(--s3);
  white-space:normal;text-align:center;overflow-wrap:normal;word-break:normal;overflow:visible}
@media (max-width:359px){ .expgrid{grid-template-columns:1fr} }

/* ---------- buttons: exactly four roles ---------- */
.btn{
  position:relative;
  border:var(--bw-strong) solid var(--stroke2);
  border-radius:var(--r-sm);
  background:var(--surface);color:var(--ink);
  font-family:var(--font);font-size:var(--fs-label);font-weight:var(--fw-label);
  line-height:1.25;letter-spacing:0;
  cursor:pointer;overflow:hidden;
  padding:0 var(--s4);min-height:44px;
  display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);
  backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none;
  transition:transform var(--dur-1) var(--ease),background var(--dur-1) var(--ease),border-color var(--dur-1) var(--ease);
}
.btn::after{display:none}                          /* the gloss overlay is gone */
.btn:active{transform:scale(.97);background:var(--surface-3)}
.btn:focus-visible{outline:none;box-shadow:var(--focus)}
.btn.full{width:100%}
/* the new-item sheet is the one sheet that must fit a 360×640 budget Android whole */
.mbody.nisheet{padding-bottom:8px}
.mbody.nisheet .grabber{margin-bottom:8px}
/* an accent-OUTLINE button at full width. `.full` is what turns .cyan/.green/.violet into an
   accent FILL (the PRIMARY rule below), so `.btn.cyan.full` is a second amber slab — which is
   exactly what the design system forbids on a sheet that already has one. `.wide` is the width
   without the fill. */
.btn.cyan.wide,.btn.green.wide,.btn.violet.wide{width:100%;min-height:52px;font-size:16px;font-weight:700}
/* R17 · min-WIDTH, not just min-height. `.btn` sets overflow:hidden, which makes a flex item's
   automatic minimum size 0 — so inside an h3 with justify-content:space-between the «CSV»
   button was squeezed to 40.4×44 at 320px in Armenian: the only tap target under 44×44 left in
   the build. min-width is a floor flexbox may not shrink past. */
.btn.small{padding:0 var(--s3);min-height:44px;min-width:44px;font-size:var(--fs-label);border-radius:var(--r-xs)}
/* the export buttons sit beside a heading that CAN wrap, and they cannot: a two-line «/ CSV»
   is not what «CSV» means. They keep their content width and the heading gives instead. */
.btn.small.noprint{flex:0 0 auto;white-space:nowrap}

/* PRIMARY — the one thing to do next. 52px, full-width, accent fill. */
.btn.primary,
.btn.full.cyan,.btn.full.green,.btn.full.violet{
  width:100%;min-height:52px;
  background:var(--acc);color:var(--acc-ink);
  border-color:var(--acc);
  font-size:16px;font-weight:700;letter-spacing:-.1px;
}
/* a primary that cannot be pressed yet must stop LOOKING like the primary. opacity:.35 on an
   amber fill composited a white label to ~1.7:1 on tan — an unreadable label on a slab that
   still read as the screen's next action. */
.btn.off{
  background:var(--surface-2) !important;color:var(--dim) !important;
  border-color:var(--stroke2) !important;pointer-events:none;opacity:1 !important;
  font-weight:600 !important;
}
.btn.primary:active,
.btn.full.cyan:active,.btn.full.green:active,.btn.full.violet:active{
  background:var(--acc-text);border-color:var(--acc-text);transform:scale(.985);
}
/* a "small primary" is a ROW action in a list — never the screen's one filled action.
   It keeps accent identity at a fraction of the weight, so a 12-row list is not 12 amber slabs. */
.btn.small.primary{min-height:44px;font-size:var(--fs-label);width:auto;
  background:var(--acc-tint);color:var(--acc-text);border-color:var(--acc-line)}
.btn.small.primary:active{background:var(--surface-3);border-color:var(--acc-line)}

/* SECONDARY — accent outline. All non-full hue variants land here. */
.btn.cyan,.btn.green,.btn.violet{
  background:var(--surface);color:var(--acc-text);
  border-color:var(--acc-line);border-width:var(--bw-strong);
}
.btn.cyan:active,.btn.green:active,.btn.violet:active{background:var(--acc-tint)}

/* GHOST — neutral. The default for "another thing you could do". */
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--stroke2)}
.btn.ghost:active{background:var(--surface-2)}

/* DANGER — outline only, never filled. */
.btn.danger{background:var(--surface);color:var(--danger);border-color:var(--danger-line);border-width:var(--bw-strong)}
.btn.danger:active{background:var(--danger-tint)}
/* the one committing action on a sheet must outweigh everything above it. Outlined-danger at
   the same weight as the «Փակել» below it meant nothing on the Դուրսգրում sheet read as
   "the button". Tint + 2px rule + 52px gives it that weight without a filled red slab. */
.btn.danger.full{
  min-height:52px;font-size:16px;font-weight:700;
  background:var(--danger-tint);border-width:2px;
}
.btn.danger.full:active{background:var(--danger);color:#fff;border-color:var(--danger)}

/* A ROW action, repeated 9-12 times down a list. It was amber-tinted, which meant the accent
   marked nine things per screen and therefore nothing. It is now a neutral raised control at
   the 44px floor; the screen's single amber primary is the only accent left. */
.addbtn{
  background:var(--surface-2);color:var(--ink);border:var(--bw-strong) solid var(--stroke2);
  border-radius:var(--r-xs);padding:0 var(--s3);min-height:44px;
  font-family:var(--font);font-weight:700;font-size:var(--fs-label);
  cursor:pointer;width:100%;box-shadow:none;
  transition:transform var(--dur-1) var(--ease),background var(--dur-1) var(--ease);
}
.addbtn:active{background:var(--surface-3)}
.addbtn:active{transform:scale(.96)}
.addbtn.added{background:var(--success-tint);color:var(--success);border-color:var(--success-line)}
/* R7 · one disabled grammar for the whole app. `opacity:.35` on a row action dropped its label
   to ~2:1 and still read as pressable; `.btn.off` already solved this for the primary, so the
   row button and the stepper now say "not now" the same way it does: quiet fill, dim label,
   full opacity, no press. */
.addbtn.off,.qtyctl button:disabled,.btn:disabled{
  opacity:1 !important;pointer-events:none;
  color:var(--dim) !important;font-weight:600 !important;
}
/* .btn is raised on --surface, so it says "off" exactly the way .btn.off does: it recedes to the
   quiet fill. */
.btn:disabled{background:var(--surface-2) !important;border-color:var(--stroke2) !important}
/* .addbtn and the stepper already SIT on the quiet fill, so that recipe would have changed nothing
   visible. They say "off" by losing the raised edge instead: no fill, no border, dim label. */
.addbtn.off,.qtyctl button:disabled{background:transparent !important;border-color:transparent !important}

.iconbtn{
  width:40px;height:40px;border-radius:var(--r-xs);
  border:var(--bw) solid var(--stroke2);background:var(--surface);color:var(--muted);
  font-size:17px;line-height:1;font-weight:600;cursor:pointer;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  transition:transform var(--dur-1) var(--ease),background var(--dur-1) var(--ease);
}
.iconbtn:active{transform:scale(.94);background:var(--surface-2)}

/* ---------- badges, chips, counts ---------- */
.chips{display:flex;gap:var(--s2);overflow-x:auto;padding-bottom:var(--s2);
  margin-bottom:var(--s1);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
/* a mandatory choice may never hide behind a scrollbar-less swipe: wrap onto as many rows as it takes */
.chips.wrap{flex-wrap:wrap;overflow-x:visible}
.chips button{
  white-space:nowrap;background:var(--surface);
  border:var(--bw) solid var(--stroke2);border-radius:var(--r-pill);
  padding:0 var(--s3);min-height:44px;
  font-family:var(--font);font-size:var(--fs-label);font-weight:var(--fw-label);
  color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:var(--s1);
  transition:background var(--dur-1) var(--ease),color var(--dur-1) var(--ease),border-color var(--dur-1) var(--ease);
}
.chips button.active{
  background:var(--acc-tint);color:var(--acc-text);
  border-color:var(--acc-line);border-width:var(--bw-strong);font-weight:700;
}
.chips button:active{transform:scale(.97)}

/* R12 · a badge is white-space:nowrap by design, so two of them on one line — «● Կապ չկա —
   պահվում է այս սարքում» beside «2 չուղարկված» — overflowed and clipped the second at 320px.
   The row wraps instead; the badges themselves still never break mid-phrase. */
.badgerow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
/* and «● Կապ չկա — պահվում է այս սարքում» is a whole sentence, not a figure: inside this row
   a badge may break between words rather than be clipped at 320px. */
.badgerow .badge{white-space:normal;text-align:left}
/* R14 · the sync sheet is a list of connections. Each row is one 56px tap target (well over the
   44px floor), the name on the left at 16px, the state badge on the right, a › affordance. The
   whole row is the button — nothing on it is smaller than the thumb. */
.roomrow{display:flex;align-items:center;gap:10px;min-height:56px;text-align:left;
  padding:10px 14px;margin-top:8px;font-size:16px;font-weight:600}
/* the name WRAPS rather than being clipped: «Ակվա Դիստրիբյուշն» must be readable at 320px, and a
   row of ellipses is exactly the kind of screen a 55-year-old in bad light cannot use. */
.roomrow .rrname{flex:1 1 auto;min-width:0;white-space:normal;line-height:1.3;overflow-wrap:anywhere}
.roomrow .rrstate{flex:0 0 auto;font-weight:400}
.roomrow .rrstate .badge{white-space:nowrap}
.roomrow .rrgo{flex:0 0 auto;color:var(--muted);font-size:20px;line-height:1}
/* R14 · the pairing string, read down a telephone. The code on its own line, the key in blocks
   of four. Tabular, selectable, and it wraps rather than being clipped at 320px. */
.paircode{font-family:var(--mono);font-size:24px;font-weight:700;letter-spacing:2px;
  user-select:all;word-break:break-all;white-space:normal;line-height:1.35;margin-top:4px}
.pairkey{font-family:var(--mono);font-size:20px;letter-spacing:1px;user-select:all;
  word-break:break-word;white-space:normal;line-height:1.5;margin-top:6px}
.badge{
  display:inline-flex;align-items:center;gap:var(--s1);
  padding:2px var(--s2);min-height:22px;border-radius:var(--r-xs);
  font-size:var(--fs-caps);font-weight:var(--fw-caps);line-height:1.2;
  white-space:nowrap;
  letter-spacing:0;border:var(--bw) solid transparent;
}
.b-cyan   {background:var(--info-tint);   color:var(--info);   border-color:var(--info-line)}
.b-gold   {background:var(--acc-tint);    color:var(--acc-text);border-color:var(--acc-line)}
.b-green  {background:var(--success-tint);color:var(--success);border-color:var(--success-line)}
.b-rose   {background:var(--danger-tint); color:var(--danger); border-color:var(--danger-line)}
.b-violet {background:var(--note-tint);   color:var(--note);   border-color:var(--note-line)}
.b-neutral{background:var(--surface-2);   color:var(--muted);  border-color:var(--stroke)}

/* counts. One shape only: a filled danger pill. */
.dot{display:inline-flex;align-items:center;justify-content:center;
  min-width:21px;height:21px;padding:0 5px;border-radius:var(--r-pill);
  background:var(--danger);color:#2A0710;font-size:14px;font-weight:700;line-height:1.1}
body.light .dot{background:var(--danger);color:#fff}
.navbadge{position:absolute;top:0;left:calc(50% + 4px);
  background:var(--danger);color:#fff;font-size:14px;font-weight:700;
  border-radius:var(--r-pill);padding:0 5px;line-height:1.35;min-width:20px;text-align:center}
body:not(.light) .navbadge{color:#2A0710}

/* ---------- product / list rows ---------- */
.sug{
  display:flex;gap:var(--s3);align-items:flex-start;
  padding:var(--s3) 0;border-bottom:var(--bw) solid var(--sep);
}
.sug:last-child{border-bottom:none;padding-bottom:var(--s1)}
.sug:first-child{padding-top:var(--s1)}
.sug .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--s1)}
/* the product/identity tile. Tier-1 emoji container (§6). */
.pav{
  width:44px;height:44px;border-radius:var(--r-sm);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;line-height:1;flex-shrink:0;
  background:var(--surface-2);border:var(--bw) solid var(--stroke);
}
/* the avatar doubles as the item-card button, so the product name keeps its full column */
button.pav{padding:0;position:relative;cursor:pointer;color:inherit;font-family:inherit;
  transition:transform var(--dur-1) var(--ease),background var(--dur-1) var(--ease)}
button.pav:active{transform:scale(.94);background:var(--surface-3)}
button.pav .pavdots{position:absolute;right:2px;bottom:0;font-size:14px;line-height:1;font-weight:700;color:var(--muted)}
/* Armenian product names run 150-190px; on a 320-412px phone the flex row can never give them
   that on ONE line, so they used to ellipsise down to «Ջ…». Wrap to two lines instead — the
   name is what identifies the SKU being counted, priced or sold. */
.sug .nm{
  font-size:var(--fs-body-l);font-weight:var(--fw-body-l);
  line-height:var(--lh-body-l);letter-spacing:var(--ls-body-l);color:var(--ink);
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow-wrap:break-word;
}
/* a row action must be able to give width back to the name */
.sug .rowact{flex:0 1 auto;min-width:0;white-space:normal}
/* at 320px the name column is only ~76px, so two lines are not enough for the longest names */
/* Russian product names («Масло сливочное 82% 200 г») need a third line well before 340px */
@media (max-width:400px){ .sug .nm{-webkit-line-clamp:3} }
@media (max-width:340px){ .sug .nm{-webkit-line-clamp:4} }
/* R4: at 320px in hy/ru the «Մնացորդ՝ 1 · Վերջանում է» badge — the only stockout warning on the
   selling screen — was drawn under the stepper. Below 360 the control column takes its own row. */
@media (max-width:360px){
  .posrow{flex-wrap:wrap}
  /* the control column takes its own row — the 44px product tile does NOT: basis 100% put
     the tile alone on line 1 and the name on line 2, costing ~56px a row. */
  .posrow .info{flex:1 1 0;min-width:0}
  .posrow .posact{flex:1 1 100% !important;min-width:0 !important;text-align:left !important;margin-top:9px;display:flex;gap:10px;align-items:center}
  .posrow .posact .addbtn{margin-top:0 !important;flex:1}
}
/* R4: the supplier «Առաջարկել պատվեր» button pushed the Խանութի մնացորդ tab 17px wide at
   320px in Russian. Let it take its own line instead of forcing a horizontal page scroll. */
@media (max-width:460px){
  .selloutfoot{flex-wrap:wrap}
  .selloutfoot .btn{flex:1 1 100%;margin-top:8px}
}
/* rows whose action carries a long sentence-length label (the promo toggle) squeezed the name
   column down to 31px at 320px. Below 460px the action drops onto its own full-width line. */
@media (max-width:460px){
  .sug.stack{flex-wrap:wrap}
  /* flex-basis:auto made the info column's hypothetical size its MAX-content width, so on a
     wrapping row the 44px tile was pushed onto a line of its own and every Ժամկետներ row
     grew ~56px. basis:0 keeps the tile and the name on one line, as every other list row. */
  .sug.stack .info{flex:1 1 0;min-width:0}
  .sug.stack .sugact{flex:1 1 100%;min-width:0 !important;text-align:left !important;margin-top:8px}
  .sug.stack .sugact .btn{width:100%}
}
.sug .sub{
  font-size:var(--fs-micro);font-weight:var(--fw-micro);line-height:var(--lh-micro);
  color:var(--muted);margin-top:0;
  display:flex;flex-wrap:wrap;gap:var(--s1) var(--s2);align-items:center;
}
/* inside a wrapping list row a pill may take a second line — the row is built to wrap. It is
   the non-wrapping label/value rows that must never squeeze a pill into a three-line block. */
.sug .sub .badge,.rline .badge,.chips .badge{white-space:normal}
.sug .sub b{font-weight:700;color:var(--ink)}     /* was gold — money is weight, not hue */
.sug .sub.muted{color:var(--dim)}

.shoprow{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s3);padding:var(--s3) 0;
  border-bottom:var(--bw) solid var(--sep);cursor:pointer}
.shoprow:last-child{border-bottom:none}
/* the shop's NAME is the row's identity. With a shrink-to-fit basis the badge cluster (up to
   three pills) held line 1 and squeezed «Խանութ «Նռան այգի»» into a 3-line, 110px column. A
   150px basis makes the badges wrap to their own line instead, exactly as .sug.stack does. */
.shoprow .info{min-width:0;flex:1 1 150px}
/* one row component, one name treatment: the two shop rows used inline 14px/600 and 15px/600
   where every other list row in the app uses .nm (16px/600, 2-line clamp). */
.shoprow .nm{font-size:var(--fs-body-l);font-weight:var(--fw-body-l);line-height:var(--lh-body-l);
  letter-spacing:var(--ls-body-l);color:var(--ink);overflow-wrap:break-word}
.shopav{width:40px;height:40px;border-radius:var(--r-sm);background:var(--acc-tint);
  border:var(--bw) solid var(--acc-line);display:flex;align-items:center;justify-content:center;
  font-weight:700;color:var(--acc-text);font-size:var(--fs-body-l);flex-shrink:0}

/* receiving discrepancy line */
.rline{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap;
  font-size:var(--fs-micro);color:var(--muted);margin:var(--s2) 0 0 56px}
/* one struck-through "was" treatment: the receiving discrepancy line and the two promo prices
   used to be a class and two inline styles respectively. */
.was,.rline .was{text-decoration:line-through;color:var(--dim);font-weight:500}
.rline .chips{margin:0;padding:0}
.rline .chips button{padding:var(--s1) var(--s2);font-size:var(--fs-micro);min-height:44px}

/* ---------- numeric stepper ---------- */
.qtyctl{
  display:flex;align-items:center;gap:0;
  background:var(--surface-2);border:var(--bw) solid var(--stroke2);
  border-radius:var(--r-sm);padding:2px;
}
.qtyctl button{
  width:44px;height:44px;border-radius:var(--r-xs);border:none;background:transparent;
  color:var(--ink);font-family:var(--font);font-size:22px;font-weight:700;line-height:1;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background var(--dur-1) var(--ease);
}
.qtyctl button:active{background:var(--acc-tint)}
.qtyctl span{
  min-width:38px;text-align:center;
  font-family:var(--font);font-variant-numeric:tabular-nums;
  font-weight:700;font-size:18px;color:var(--ink);
}
/* R8 · «Օրվա վաճառք»: a stepper is right for 1–3 units, a keypad is right for 40. Same box. */
.qtyctl .qtyin{
  width:52px;min-width:52px;height:40px;text-align:center;border:none;background:transparent;
  font-family:var(--font);font-variant-numeric:tabular-nums;
  font-weight:700;font-size:18px;color:var(--ink);outline:none;padding:0;
}
.qtyctl .qtyin:focus{background:var(--acc-tint);border-radius:var(--r-xs)}
/* mid-aisle, one-handed, after a mis-scan: this is the biggest control in the app */
.scantray .qtyctl button{width:48px;height:48px;font-size:24px}
.scantray .qtyctl span{min-width:44px;font-size:20px}

/* ---------- accordion ---------- */
.acc{margin:0 0 var(--s3)}
.acc>summary{list-style:none;cursor:pointer;padding:var(--s3) var(--s4);
  border:var(--bw) solid var(--stroke);border-radius:var(--r-sm);
  background:var(--surface);font-weight:700;font-size:var(--fs-body-l);
  display:flex;align-items:center;gap:var(--s2);min-height:48px}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary::after{content:'▾';margin-left:auto;color:var(--muted);font-size:15px}
.acc[open]>summary::after{content:'▴'}
body.light .acc>summary{background:var(--surface)}

/* ---------- barcode scanner ---------- */
/* the box always holds video, so it stays dark in both themes */
.scanbox{position:relative;margin-top:var(--s3);border-radius:var(--r);overflow:hidden;
  background:#000;aspect-ratio:4/3;min-height:200px}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanroi{position:absolute;left:6%;right:6%;top:35%;height:30%;
  border:2px solid #FFC46B;border-radius:var(--r-xs);box-shadow:0 0 0 2000px rgba(0,0,0,.42)}
.scanroi::after{content:"";position:absolute;left:6px;right:6px;top:50%;height:2px;background:#FF6B6B;opacity:.9}
.scanhint{position:absolute;left:0;right:0;bottom:var(--s2);text-align:center;color:#fff;
  font-size:var(--fs-micro);font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.9)}

/* ---------- inputs ---------- */
.search,input[type="text"],input[type="number"],input[type="password"],input[type="date"],textarea,select{
  width:100%;padding:0 var(--s3);min-height:48px;
  border:var(--bw-strong) solid var(--stroke2);border-radius:var(--r-sm);
  font-size:16px;                                  /* 16px prevents iOS zoom-on-focus */
  font-family:var(--font);font-weight:500;
  background:var(--surface);color:var(--ink);
  outline:none;box-shadow:none;backdrop-filter:none;
  transition:border-color var(--dur-1) var(--ease),box-shadow var(--dur-1) var(--ease);
}
textarea{padding:var(--s3);min-height:88px;line-height:1.5}
.search{margin-bottom:var(--s3)}
.search::placeholder,input::placeholder,textarea::placeholder{color:var(--dim);font-weight:400}
#roomInput::placeholder{text-transform:none;letter-spacing:0}
.search:focus,input:focus,textarea:focus,select:focus{
  border-color:var(--acc);box-shadow:var(--focus);
}
/* field label — micro-label ABOVE the field, never a sentence beside it */
.fieldlbl{
  display:block;font-size:var(--fs-caps);font-weight:var(--fw-caps);
  letter-spacing:var(--ls-caps);color:var(--dim);margin:0 0 var(--s1);
}
/* R7 · the app carried six "this field is required" messages in four different sizes (13px and
   13.5px) with four different hand-written margins, none of them on the 4px grid and all of them
   under the 14px legibility floor this system sets. They all render here now. */
.fielderr{display:block;font-size:var(--fs-micro);line-height:var(--lh-micro);
  font-weight:700;color:var(--danger);margin:var(--s1) 0 var(--s2)}
input.err,textarea.err{border-color:var(--danger)}

/* ---------- orders ---------- */
.order{
  border:var(--bw) solid var(--stroke);border-radius:var(--r);
  padding:var(--s4);margin-bottom:var(--s3);
  background:var(--surface);box-shadow:var(--sh-1);
  position:relative;overflow:hidden;
}
.order.st-new::before,.order.st-confirmed::before,.order.st-delivered::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
}
.order.st-new{border-color:var(--stroke)}          /* status lives in the rail + badge only */
.order.st-new::before{background:var(--info)}
.order.st-confirmed::before{background:var(--acc)}
.order.st-delivered::before{background:var(--success)}
.order .oh{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s2);margin-bottom:var(--s1)}
.order .oh b{font-size:var(--fs-body-l);font-weight:700}
.oid{font-size:var(--fs-micro);color:var(--dim);font-weight:500}
.oitems{font-size:var(--fs-micro);color:var(--muted);line-height:1.7;margin-top:var(--s2)}
.obtns{display:flex;gap:var(--s2);margin-top:var(--s3)}
.obtns button{flex:1}

/* order progress tracker (shop side) */
.otrack{display:flex;align-items:center;margin-top:var(--s3);padding:0 2px}
.onode{width:24px;height:24px;border-radius:var(--r-pill);
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;flex-shrink:0;
  background:var(--surface-2);border:var(--bw) solid var(--stroke2);color:var(--muted)}
.onode.done{background:var(--success);border-color:var(--success);color:var(--bg);box-shadow:none}
.onode.now{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);box-shadow:none;animation:none}
.oline{flex:1;height:3px;border-radius:var(--r-pill);background:var(--stroke);margin:0 var(--s1)}
.oline.done{background:var(--success)}
.olabels{display:flex;justify-content:space-between;margin-top:var(--s1);
  font-size:var(--fs-caps);font-weight:600;letter-spacing:0;text-transform:none;color:var(--dim)}
.olabels span.on{color:var(--ink);font-weight:700}

/* ---------- progress / meter ---------- */
.hbar{margin-bottom:var(--s3)}
.hbar .hl{display:flex;justify-content:space-between;align-items:baseline;
  font-size:var(--fs-micro);color:var(--muted);margin-bottom:var(--s1);gap:var(--s2)}
.hbar .hl b{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.hbar .track{height:8px;border-radius:var(--r-pill);background:var(--surface-2);
  overflow:hidden;border:var(--bw) solid var(--stroke)}
.hbar .fill{height:100%;border-radius:var(--r-pill);background:var(--acc);box-shadow:none;
  transition:width var(--dur-3) var(--ease)}
.hbar .fill.cy{background:var(--info)}
.spark{display:inline-flex;gap:2px;align-items:flex-end;height:20px;vertical-align:middle}
.spark i{width:4px;background:var(--acc);border-radius:1px;display:block;min-height:2px;opacity:.7}
.spark i:last-child{opacity:1}

/* ---------- alerts / notices / empty ---------- */
/* alert = a card with a 3px status rail, no gradient, no tint fill */
.alert{
  border:var(--bw) solid var(--acc-line);border-left:3px solid var(--acc);
  background:var(--surface);border-radius:var(--r);
  padding:var(--s3) var(--s4);margin-bottom:var(--s2);box-shadow:var(--sh-1);
}
.alert.bad{border-color:var(--danger-line);border-left-color:var(--danger)}
.alert .t{font-size:var(--fs-body-l);font-weight:600;line-height:1.4;color:var(--ink)}
.alert .d{font-size:var(--fs-micro);color:var(--muted);margin-top:var(--s1);line-height:var(--lh-micro)}
.alert .act{margin-top:var(--s3);display:flex;gap:var(--s2)}

/* the demo note and the privacy one-liner are context, not content: a rule, not a box */
.notice{
  background:transparent;border:none;border-left:3px solid var(--info-line);
  border-radius:0;padding:var(--s1) 0 var(--s1) var(--s3);
  margin:0 0 var(--s3);font-size:var(--fs-micro);line-height:1.5;color:var(--muted);
}
.notice.bad{border-left-color:var(--danger)}

.empty{
  color:var(--muted);text-align:center;
  padding:var(--s8) var(--s4);
  font-size:var(--fs-body);line-height:1.5;
  display:flex;flex-direction:column;align-items:center;gap:var(--s2);
}
.empty .em{
  font-size:28px;line-height:1;display:flex;align-items:center;justify-content:center;
  width:56px;height:56px;border-radius:var(--r-pill);
  background:var(--surface-2);margin:0 0 var(--s1);
  filter:grayscale(.35);opacity:.9;
}
.footer-note{text-align:center;color:var(--dim);font-size:var(--fs-caps);margin:var(--s5) 0 var(--s1)}

/* ---------- tables ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:var(--fs-micro);margin-top:var(--s2);min-width:100%}
.tbl th{
  text-align:left;color:var(--dim);
  font-size:var(--fs-caps);font-weight:var(--fw-caps);
  letter-spacing:var(--ls-caps);text-transform:none;
  padding:var(--s2) var(--s1);border-bottom:var(--bw) solid var(--stroke2);
  white-space:nowrap;
}
.tbl td{padding:var(--s3) var(--s1);border-bottom:var(--bw) solid var(--sep);color:var(--ink);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
/* every numeric column right-aligns and shares one figure width */
.tbl td.num,.tbl th.num,.tbl td:has(.num){text-align:right;font-variant-numeric:tabular-nums}
/* The last column — the Կարգավիճակ badge and the Փաստաթուղթ button, i.e. the one fact the
   Պարտքեր workflow turns on — was sliced by the card edge and read as rendering damage.
   Two fixes: cells may now WRAP (so at 390px the table fits and nothing is cut at all), and
   where a table is still wider than its box, a scroll shadow makes the motion visible.
   The shadow is the background-attachment:local trick — it appears only when there is
   actually something to scroll to, and costs no JS. */
.tbl td,.tbl th{overflow-wrap:break-word}
.tblsub{display:none}
.tfoldq{display:none}
.tbl .badge{white-space:normal;text-align:left;line-height:1.25}
/* On a phone a 5-column Armenian table can never be 324px wide by measuring its content, so it
   was cut at the right edge and the Կարգավիճակ badge — the one fact Պարտքեր turns on — was
   sliced mid-word. Fixed layout gives every column a guaranteed share of the width the phone
   actually has and lets the text wrap inside it: taller rows, nothing hidden, no sideways
   swipe to discover. The scroll shadow above stays as the safety net for wider tables. */
@media (max-width:520px){
  /* R9 · fixed shares plus ``overflow-wrap:anywhere`` guaranteed the opposite of what they were
     meant to guarantee: a 16%-wide column is 52px, «Մատակարար» is 96px, so the header was
     shredded into «Մատակար»/«ար» — which to a native reader is not tight layout, it is a
     broken program. Columns now size to their own longest word and the WRAPPER scrolls. */
  .tbl{font-size:var(--fs-micro);table-layout:auto;width:auto;min-width:100%}
  .tbl th,.tbl td{padding-left:5px;padding-right:5px;white-space:normal}
  .tbl th{font-size:var(--fs-caps);letter-spacing:0;line-height:1.25}
  .tbl td{padding-top:10px;padding-bottom:10px}
  /* Five Armenian columns cannot share 324px without chopping words. The date is the one
     field that reads perfectly well as a sub-line under the identity it belongs to — exactly
     the fold the գույքագրման ակտ already uses for its two reference columns. Print, CSV and
     desktop keep all five columns. */
  .tblsub{display:block;font-size:var(--fs-micro);font-weight:500;color:var(--dim);margin-top:2px;
          letter-spacing:0;white-space:normal;overflow-wrap:normal;word-break:normal}
  .tfold-b th:nth-child(2),.tfold-b td:nth-child(2),
  .tfold-h th:nth-child(1),.tfold-h td:nth-child(1){display:none}
  /* under 401px the counterparty folds into the same sub-line as the date, so the STATUS — the
     one fact the Պարտքեր workflow turns on — stays inside the card without a sideways swipe. */
  @media (max-width:400px){
    .tfold-b th:nth-child(3),.tfold-b td:nth-child(3){display:none}
    /* R10 · the SHOP's copy of the purchase history carries a «＋ Փաստաթուղթ չկա» button in the
       document column, and that button's own longest word made the column 134px — pushing the
       table 21px past its box, so «Փաստաթղթի համար» — the point of the table — was cut at the
       edge while the supplier's identical table fitted. The quantity takes the same fold the
       date already takes: into the sub-line under the product it belongs to. */
    .tfold-hs th:nth-child(3),.tfold-hs td:nth-child(3){display:none}
    .tfold-hs .tfoldq{display:inline}
    .tfold-hs .tblsub{white-space:nowrap}
  }
  /* shares chosen from measured Armenian word widths: the status pill and the document
     number are the two values that must never break, so they get the slack. */
  .tbl .num{white-space:nowrap;overflow-wrap:normal}
  .tbl .cur{font-size:var(--fs-micro);margin-left:.1em}
  /* a row-action button inside a table cell is a BLOCK under the status it acts on, not an
     inline pill that sizes the column by its own Armenian label */
  /* wrap at SPACES, never inside a word: the label may take two lines, but «Վճարված» is one
     word on one line and it is what sizes the column. */
  .tbl .btn{width:100%;display:flex;font-size:var(--fs-label);padding:0 var(--s2);min-height:44px;
            margin-top:5px;white-space:normal;overflow-wrap:normal;word-break:normal;line-height:1.15}
  /* an inline-FLEX pill can never be narrower than its longest word (flex items carry
     min-width:auto), which is what kept the status column 98px wide inside a 56px cell */
  /* a shrink-to-fit pill can never be narrower than its longest word even with break-word, so
     in a fixed column it overflowed. As a block it takes exactly the column and wraps inside it. */
  .tbl .badge{display:block;padding:3px var(--s2);font-size:var(--fs-caps);line-height:1.3;
              white-space:normal;overflow-wrap:normal;word-break:normal;text-align:center}
}
.tblwrap{max-height:340px;overflow-y:auto;overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:thin;scrollbar-color:var(--stroke2) transparent;
  background:
    linear-gradient(to right,var(--surface) 40%,rgba(255,255,255,0)) left center,
    linear-gradient(to left,var(--surface) 40%,rgba(255,255,255,0)) right center,
    linear-gradient(to right,rgba(14,23,38,.20),rgba(14,23,38,0)) left center,
    linear-gradient(to left,rgba(14,23,38,.20),rgba(14,23,38,0)) right center;
  background-repeat:no-repeat;
  background-size:34px 100%,34px 100%,14px 100%,14px 100%;
  background-attachment:local,local,scroll,scroll;}
.tblwrap::-webkit-scrollbar{width:6px}
.tblwrap::-webkit-scrollbar-thumb{background:var(--stroke2);border-radius:var(--r-pill)}
/* ---- գույքագրման ակտ ---- */
.actrule{border:none;border-top:var(--bw) solid var(--stroke2);margin:var(--s3) 0}
.actsep{border-top:var(--bw) solid var(--stroke2)}
.actsignline{border-bottom:var(--bw) solid var(--stroke2);height:26px;max-width:180px}
.acttbl .actsub{display:none}
/* On a phone the 7-column act is ~465px wide inside a 352px wrapper, so ՓԱՍՏԱՑԻ, Δ and ֏ —
   the whole point of the document — scrolled off with no cue. Below 560px the two reference
   columns (Ապրանքի կոդ, Չափման միավոր) fold into a sub-line under the product name instead;
   print and CSV always carry the full seven. */
@media screen and (max-width:560px){
  .acttbl th:nth-child(2),.acttbl td:nth-child(2),
  .acttbl th:nth-child(3),.acttbl td:nth-child(3){display:none}
  .acttbl .actsub{display:block;font-size:var(--fs-micro);margin-top:3px}
  .acttbl th,.acttbl td{padding-left:3px;padding-right:3px}
  .acttbl{font-size:var(--fs-micro)}
}

/* ---------- TOP BAR: one 52px row ---------- */
#top{
  position:sticky;top:0;z-index:60;
  display:flex;flex-wrap:nowrap;align-items:center;gap:var(--s2);
  /* 44px control + 6px above + 6px below + the 1px rule = a 57px row */
  padding:6px var(--s3);
  padding-top:calc(6px + env(safe-area-inset-top));
  min-height:calc(var(--h-top) + env(safe-area-inset-top));
  background:var(--surface);
  border-bottom:var(--bw) solid var(--stroke);
  backdrop-filter:none;-webkit-backdrop-filter:none;
  transition:transform var(--dur-2) var(--ease);
  will-change:transform;
}
.logo{display:flex;align-items:center;gap:var(--s2);min-width:0;
  font-family:var(--font);font-weight:700;font-size:var(--fs-body-l);letter-spacing:-.2px}
.logo>div{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logo small{display:block;font-weight:500;font-size:14px;color:var(--dim);margin-top:0}
.logomark{width:30px;height:30px;border-radius:var(--r-xs);
  background:var(--acc);display:flex;align-items:center;justify-content:center;
  color:var(--acc-ink);font-size:15px;box-shadow:none;flex:0 0 auto}
#top .spacer{flex:1 1 0;min-width:0}
/* R7 fix — the cause, not the shrink order. R6's predecessor let the split toggle lose letters
   («Մեկ կ»); R6 inverted the priority and the date was squeezed to 0px instead (390/ru). Both are
   symptoms of ONE fact: seven controls plus a date want ~420px and the phone has 390. So below
   461px the header carries FIVE controls, not seven — theme, sync and language fold into one 
   that opens them as a sheet. That buys ~90px: at 390/ru, the worst of the nine width×language
   cases, the row now measures ~341px with the date rendered in full. Nothing shrinks any more,
   so nothing can truncate. The chip drops the YEAR (kept in title=, and every printed document
   still prints it): a 12-day simulation never crosses a year boundary. */
.datechip{
  font-weight:600;font-size:var(--fs-micro);color:var(--muted);
  font-variant-numeric:tabular-nums;white-space:nowrap;
  flex:0 0 auto;min-width:0;
}
/* every global control is one 38px square; a control that carries words widens, nothing else does */
/* R9 · 38×38 was under the 44px tap floor on the three controls he uses most, including the
   daily . The header row grows to fit — legibility and reach beat a 52px chrome budget. */
.tbtn{
  width:44px;height:44px;min-width:44px;min-height:44px;padding:0;flex:0 0 auto;position:relative;
  border:var(--bw) solid var(--stroke2);border-radius:var(--r-xs);
  background:var(--surface);color:var(--ink);
  font-family:var(--font);font-size:17px;line-height:1;font-weight:600;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:var(--s1);
  backdrop-filter:none;
  transition:transform var(--dur-1) var(--ease),background var(--dur-1) var(--ease);
}
/* R7: an inline count made «5» 5px wider than its own 38px button at 320px. A badge is a
   corner mark, not a second word — it leaves the glyph centred and costs the row no width. */
.tbtn .dot,.tbtn .okdot{
  position:absolute;top:-6px;right:-6px;z-index:1;
  border:2px solid var(--surface);
}
/* the app's standard count size (.dot is 12px everywhere); the corner position is what changed,
   not the legibility of the number */
.tbtn .dot{min-width:22px;height:22px;padding:0 5px;font-size:14px;line-height:20px}
.tbtn .okdot{width:12px;height:12px;top:-4px;right:-4px;border-radius:var(--r-pill);
  background:var(--success);font-size:0;display:block}
/* R8: green only ever means "the last handshake succeeded" */
.tbtn .okdot.bad{background:var(--danger)}
.tbtn .okdot.idle{background:var(--muted)}
/* amber = written down here, not yet acknowledged by the other device */
.tbtn .okdot.pend{background:var(--acc)}
/* the phone header: one stands in for theme + sync + language */
.tbtn.hdr-sm{display:none}
@media (max-width:460px){
  .tbtn.hdr-lg{display:none}
  .tbtn.hdr-sm{display:flex}
}
a.tbtn{text-decoration:none}   /* the header's is a link out of the app, not a control */
.tbtn:active{transform:scale(.94);background:var(--surface-2)}
.tbtn.wide{width:auto;min-width:44px;padding:0 var(--s3);font-size:var(--fs-label);
  flex:0 0 auto;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tbtn.on{background:var(--acc-tint);color:var(--acc-text);border-color:var(--acc-line)}
.tbtn.day{background:var(--acc-tint);color:var(--acc-text);border-color:var(--acc-line);border-width:var(--bw-strong);box-shadow:none}

/* on a phone the brand is not worth a header row */
@media (max-width:460px){
  #top .logo{display:none}
  #top{gap:6px}
  .tbtn.wide{padding:0 var(--s2)}
}
@media (max-width:360px){
  #top{gap:4px;padding-left:6px;padding-right:6px}
  /* narrow, not short: the horizontal budget is what binds at 320px, so the header controls
     give width and keep their 38px height. */
  /* even at 320px the tap floor holds: width comes out of the gaps, never out of the target */
  .tbtn{width:44px;font-size:16px}
  .tbtn.wide{padding:0 5px;font-size:var(--fs-label);min-width:44px}
}
/* R7: with five controls instead of seven, 320px has ~40px of slack in every language. These
   last few px come out of gaps and padding — never out of a label and never out of a hit height. */
@media (max-width:340px){
  #top{gap:3px;padding-left:5px;padding-right:5px}
  .tbtn.wide{padding:0 4px}
  /* R16 · the DEMO header carries two controls the real one does not — the split toggle and —
     and at 320px the split toggle's Russian label «Две стороны» is 119px of the 320. The row
     measured 327 and the page scrolled sideways: 5px of it arrived with the self-hosted fonts,
     the rest was there before and unmeasured, because the a11y sweep signs in. Same remedy the
     row already uses below 461px, where theme + sync + language fold into one : at this width
     the toggle keeps its 44px target and its ▚/▙, and its words move to title=/aria-label. The
     three shipped labels are untouched — this hides one, it does not rewrite it. */
  .tbtn.wide.splitbtn .lbl{display:none}
  .tbtn.wide.splitbtn{width:44px;min-width:44px;padding:0}
}
/* hidden-on-scroll state */
#top.hid{transform:translateY(-100%)}

/* ---------- SPLIT layout ---------- */
#app{position:relative}
.split{display:grid;grid-template-columns:1fr;gap:var(--s3);padding:var(--s3);max-width:720px;margin:0 auto}
.pane{display:flex;flex-direction:column;min-height:0;overflow:hidden;
  background:var(--surface);border:var(--bw) solid var(--stroke);
  border-radius:var(--r);box-shadow:var(--sh-1)}
.panehead{position:sticky;top:0;z-index:5;padding:var(--s3) var(--s4) var(--s2);
  background:var(--surface);backdrop-filter:none;border-bottom:var(--bw) solid var(--stroke)}
.panetitle{font-family:var(--font);font-size:var(--fs-title);font-weight:var(--fw-title);
  letter-spacing:var(--ls-title);display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s3)}
.panetitle .tag{margin-left:auto;font-weight:600;font-size:var(--fs-caps);color:var(--dim);
  text-transform:none;letter-spacing:0}
.panetabs{margin-bottom:0}
.panetabs button{padding:0 var(--s3);min-height:44px;font-size:var(--fs-micro)}
.panebody{padding:var(--s4)}
.pane.flash{animation:flashPane .9s var(--ease)}
@keyframes flashPane{
  0%{box-shadow:var(--sh-1)}
  25%{box-shadow:0 0 0 2px var(--acc), var(--sh-2)}
  100%{box-shadow:var(--sh-1)}
}
.flowmark{display:none}

/* ---------- SINGLE layout (mobile bottom nav) ---------- */
/* R4: this animation used to run on EVERY renderAll(), so each ± tap on a replenishment or
   receiving stepper faded the whole pane out for ~150 ms and the number being adjusted was
   unreadable. It now plays only when the view actually changes (see VIEWKEY in renderAll). */
/* R10 · the bottom nav is fixed and ~49px tall (44px row + 2+2 padding + the rule); a 16px
   bottom padding left the last row of a long screen inside its swipe area. The reserve is now
   the nav row itself plus a gutter plus the home-indicator inset, so the final control on any
   tab is fully clear of the strip. */
main{padding:var(--s3) var(--s4) calc(var(--h-nav-row) + var(--s4) + env(safe-area-inset-bottom));max-width:680px;margin:0 auto}
main.anim{animation:fadeUp var(--dur-3) var(--ease-out) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}

.roleswitch{display:flex;background:var(--surface-2);border:var(--bw) solid var(--stroke);
  border-radius:var(--r-sm);padding:2px;margin:var(--s2) auto var(--s1);max-width:680px}
.roleswitch button{flex:1;min-height:44px;border:none;background:transparent;color:var(--muted);
  padding:0;border-radius:var(--r-xs);font-family:var(--font);
  font-size:var(--fs-label);font-weight:600;cursor:pointer;
  transition:background var(--dur-2) var(--ease),color var(--dur-2) var(--ease)}
.roleswitch button.active{background:var(--surface);color:var(--acc-text);font-weight:700;box-shadow:var(--sh-1)}
/* a real account cannot switch roles, so the strip is not a control — it is the caption that
   tells the shopkeeper which shop he is logged in as. As a 50px pill it cost 62px of every
   screen for a line of text; as a caption it costs 24px and says exactly the same thing. */
.acctline{max-width:680px;margin:var(--s2) auto 0;text-align:center;
  font-size:var(--fs-label);font-weight:700;color:var(--muted);line-height:1.25}

nav{
  position:fixed;bottom:0;left:0;right:0;z-index:60;
  display:flex;flex-wrap:wrap;
  background:var(--surface);
  border-top:var(--bw) solid var(--stroke);
  box-shadow:var(--sh-3);
  backdrop-filter:none;-webkit-backdrop-filter:none;
  padding:2px var(--s1) calc(2px + env(safe-area-inset-bottom));
}
nav button{
  flex:1;min-width:0;border:none;background:none;cursor:pointer;
  height:var(--h-nav-row);padding:0 1px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  position:relative;overflow:hidden;white-space:nowrap;
  font-family:var(--font);font-size:var(--fs-nav);font-weight:600;line-height:var(--lh-nav);
  color:var(--dim);
  transition:color var(--dur-1) var(--ease);
}
nav button>span:last-child{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis}
nav .icw{
  width:26px;height:20px;border-radius:var(--r-xs);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;line-height:1;
  transition:background var(--dur-1) var(--ease);
}
/* The active marker must be UNAMBIGUOUS on a two-row strip. A 3px rule at the top edge of a
   row-2 cell sits 6px under a row-1 LABEL, so it read as underlining the tab above it — for 8
   of 17 destinations the strongest cue in the nav pointed at the wrong screen. The marker is
   now the cell itself: a tinted, outlined slab that starts and ends where the tab does, with
   the accent rule drawn inside it. */
nav button.active{
  color:var(--acc-text);font-weight:700;
  background:var(--acc-tint);border-radius:var(--r-xs);
  box-shadow:inset 0 0 0 1.5px var(--acc-line);
}
nav button.active .icw{background:transparent}
nav button.active::before{
  content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:var(--acc);
}
/* the reserve now lives on <main> (the last element of every single-role screen), so the body
   no longer adds a second one on top of it. */
body.single-mobile{padding-bottom:0}

/* R9 · the permanent navigation of the whole product used to be the smallest type in it: ten
   Armenian labels wrapped onto two rows and were still shrunk to 10–11px to fit. Type has a
   floor of 14px now, so the STRIP has to give instead of the letters: renderNav() measures the
   real labels in the real font and shows as many destinations as fit whole, one row, with the
   rest behind «Ավելին». Nothing is ellipsised and nothing is shrunk. */
nav{flex-wrap:nowrap}
nav button{flex:1 1 0;max-width:none}
/* the «Ավելին» sheet: one destination per row, at list-row size, thumb-height */
.morerow{
  display:flex;align-items:center;gap:var(--s3);width:100%;
  min-height:56px;padding:0 var(--s2);
  background:none;border:none;border-bottom:var(--bw) solid var(--sep);
  font-family:var(--font);color:var(--ink);cursor:pointer;text-align:left;
  text-decoration:none;              /* the two link rows at the foot of the sheet are <a> */
}
.morerow:last-of-type{border-bottom:none}
.morerow:active{background:var(--surface-2)}
.morerow .mrico{
  width:44px;height:44px;flex:0 0 auto;border-radius:var(--r-sm);
  display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1;
  background:var(--surface-2);border:var(--bw) solid var(--stroke);
}
.morerow .mrnm{flex:1;min-width:0;font-size:var(--fs-body-l);font-weight:var(--fw-body-l);
  line-height:var(--lh-body-l);overflow-wrap:break-word}
.morerow.active .mrnm{color:var(--acc-text);font-weight:700}
.morerow.active .mrico{background:var(--acc-tint);border-color:var(--acc-line)}
@media (max-width:460px){
  nav{padding-left:0;padding-right:0}
  nav button{padding:0}
}

/* a row that carries two actions must be allowed to wrap them; flex-basis beats the
   width:100% the .sug.stack rule gives a stacked action button */
.expcard .obtns,.rptrow .obtns{flex-wrap:wrap;gap:var(--s2)}
.expcard .obtns .btn,.rptrow .obtns .btn{flex:1 1 44%;min-width:0;overflow-wrap:break-word}
/* ...and the action column must be BOUNDED, or two long Armenian labels size it by their own
   content and squeeze the product name to one character per line in the 600px split pane.
   Below 460px the .sug.stack rule (higher specificity) still drops it onto its own full row. */
.expcard .sugact,.rptrow .sugact{flex:0 1 210px;min-width:0}
/* in that bounded column 44% is ~90px — narrower than «Վերադարձնել մատակարարին» can ever be.
   Full-width stacked there; side by side only on the phone, where the column IS the row. */
@media (min-width:461px){ .expcard .obtns .btn,.rptrow .obtns .btn{flex:1 1 100%} }
/* R10 · ...and at the OTHER end the same thing happens: on a 320px phone the row is 254px, so
   44% is 121px and «Վերադարձնել մատակարարին» — a 135px word — was cut inside its own button.
   Below 361px each action takes the whole row instead of half of it. The label is not shortened. */
@media (max-width:360px){ .expcard .obtns .btn,.rptrow .obtns .btn{flex:1 1 100%} }

/* ---------- toast & modal ---------- */
#toast{
  position:fixed;left:50%;transform:translateX(-50%) translateY(8px);
  bottom:calc(var(--h-nav) + var(--s3) + env(safe-area-inset-bottom));
  background:var(--ink);color:var(--bg);
  padding:var(--s3) var(--s5);border-radius:var(--r-sm);
  font-family:var(--font);font-size:var(--fs-body);font-weight:600;line-height:1.35;
  z-index:100;opacity:0;pointer-events:none;
  max-width:calc(100% - var(--s8));text-align:center;
  box-shadow:var(--sh-2);
  transition:opacity var(--dur-2) var(--ease),transform var(--dur-2) var(--ease-out);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* docked mode: a sheet is open, so the toast sits under the header, never over the action row */
#toast.top{bottom:auto;top:calc(var(--h-top) + env(safe-area-inset-top) + var(--s2));
  transform:translateX(-50%) translateY(-8px)}
#toast.top.show{transform:translateX(-50%) translateY(0)}
@media (min-width:461px){ #toast{bottom:calc(var(--s5) + env(safe-area-inset-bottom))} }

.modal{
  position:fixed;inset:0;z-index:90;
  background:rgba(6,10,18,.58);
  backdrop-filter:none;-webkit-backdrop-filter:none;
  display:flex;align-items:flex-end;justify-content:center;
  animation:fade var(--dur-2) var(--ease);
}
body.light .modal{background:rgba(14,23,38,.42)}
.mbody{
  background:var(--surface);color:var(--ink);
  border:none;border-top:var(--bw) solid var(--stroke);
  width:100%;max-width:680px;
  border-radius:var(--r-lg) var(--r-lg) 0 0;
  padding:var(--s2) var(--s4) calc(var(--s5) + env(safe-area-inset-bottom));
  max-height:88vh;overflow-y:auto;overscroll-behavior:contain;
  box-shadow:var(--sh-3);backdrop-filter:none;
  animation:slideUp var(--dur-3) var(--ease-out);
}
.grabber{width:36px;height:4px;border-radius:var(--r-pill);background:var(--stroke2);
  margin:var(--s2) auto var(--s4)}
.mbody h3{
  margin:0 0 var(--s1);font-family:var(--font);
  font-size:var(--fs-display-s);font-weight:var(--fw-display-s);
  line-height:var(--lh-display-s);letter-spacing:var(--ls-display-s);
}

/* grid inside single desktop */
.grid2{display:block}

/* ================= DESKTOP ================= */
@media (min-width:980px){
  .split{max-width:none;grid-template-columns:1fr 1fr;gap:var(--s5);height:calc(100vh - 53px);padding:var(--s4) var(--s6);align-items:stretch}
  .pane{height:100%}
  .panebody{overflow-y:auto;flex:1;scrollbar-width:thin;scrollbar-color:var(--stroke2) transparent}
  .panebody::-webkit-scrollbar{width:8px}
  .panebody::-webkit-scrollbar-thumb{background:var(--stroke2);border-radius:var(--r-pill)}
  .split.is-two .flowmark{display:flex;position:absolute;left:50%;top:50%;
    transform:translate(-50%,-50%);z-index:8;width:40px;height:40px;border-radius:var(--r-pill);
    align-items:center;justify-content:center;font-size:18px;
    background:var(--acc);color:var(--acc-ink);box-shadow:var(--sh-2);
    border:2px solid var(--surface);animation:none}
  /* wider details on big screens */
  .sug .nm{white-space:normal;overflow:visible;text-overflow:clip;font-size:15px;line-height:1.4}
  .panebody{padding:var(--s4) var(--s5)}
  /* single desktop */
  /* the type scale, the 44px controls and the 2-line clamp on a product name are all tuned
     for a narrow column; a 1400px measure ran .oitems to ~180 characters and put a row's
     stepper 1600px from its product name. */
  main.single-desk{max-width:1040px}
  .single-desk .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 30px;align-items:start}
  .single-desk .kpis{grid-template-columns:repeat(4,1fr)}
  .modal{align-items:center}
  .mbody{border-radius:var(--r-lg);max-width:560px}
}
@media (min-width:980px) and (max-width:1200px){
  .panetabs button{padding:0 var(--s2);font-size:var(--fs-micro)}
}

/* ---------- Tier-1 emoji containers: one shared centring rule (§6) ---------- */
nav .icw,.pav,.empty .em,.logomark,.shopav{
  line-height:1;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",var(--font);
  text-align:center;font-style:normal;
}

/* ================= MINIMAL LIGHT THEME (default) ================= */
body.light{
  --bg:#F4F6F8;
  --surface:#FFFFFF;
  --surface-2:#F1F4F8;
  --surface-3:#E6EBF2;
  --ink:#0E1726;              /* 16.6:1 on --bg */
  --muted:#54607A;            /* 5.8:1 on --bg, 6.3:1 on white */
  --dim:#5D6880;              /* 5.2:1 on --bg — never lighter than this */
  --sep:#E6EAF0;
  --stroke:#E1E6EE;
  --stroke2:#C9D2E0;

  --acc:#A85A07;              /* white-on-accent 5.08:1 */
  --acc-ink:#FFFFFF;
  --acc-tint:#FFF4E3;
  --acc-line:#EBCFA4;
  --acc-text:#8A4B00;         /* 6.8:1 on white, 6.25:1 on --acc-tint */
  --gold:var(--acc); --gold2:var(--acc-text);

  --danger:#B42318;   --danger-tint:#FEF1F1; --danger-line:#F5C9C4;
  --success:#0B6B3A;  --success-tint:#EEF9F2; --success-line:#B7E3C9;
  --info:#1F5FA8;     --info-tint:#EFF6FF;   --info-line:#BCD7F5;
  --note:#5B21B6;     --note-tint:#F5F2FF;   --note-line:#DDD5F8;
  --rose:var(--danger); --green:var(--success); --cyan:var(--info);
  --violet:var(--note); --blue:var(--info);

  --glass:var(--surface); --glass2:var(--surface-2);

  --sh-0:none;
  --sh-1:0 1px 2px rgba(14,23,38,.06);
  --sh-2:0 4px 16px rgba(14,23,38,.08);
  --sh-3:0 -8px 32px rgba(14,23,38,.14);
  --focus:0 0 0 3px rgba(168,90,7,.22);

  background:var(--bg);
}
body.light::before, body.light::after{display:none}
body.light .flowmark{background:var(--acc) !important;color:#fff !important;
  box-shadow:var(--sh-2) !important;animation:none !important}

@media (min-width:1500px){
  .kpis{grid-template-columns:repeat(4,1fr)}
  .split{gap:26px;padding:20px 32px}
}

/* ================= R6 · F1 — tappable notification rows =================
   A notification is a door, not a receipt. Three affordances stack: a trailing chevron, a
   press state, and one line of instruction above the list. */
.evrow{
  display:flex;gap:var(--s3);align-items:flex-start;width:100%;
  padding:var(--s3) var(--s2) var(--s3) var(--s3);
  background:transparent;border:none;border-bottom:var(--bw) solid var(--sep);
  border-left:3px solid transparent;border-radius:0;
  font-family:var(--font);color:var(--ink);text-align:left;cursor:pointer;
  min-height:56px;
  transition:background var(--dur-1) var(--ease);
}
.evrow:last-of-type{border-bottom:none}
.evrow:active{background:var(--surface-2)}
.evrow:focus-visible{outline:none;box-shadow:var(--focus)}
.evrow.unread{border-left-color:var(--acc);background:var(--acc-tint)}
.evrow .evtx{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--s1)}
.evrow .evt{
  font-size:var(--fs-body-l);font-weight:var(--fw-body-l);
  line-height:var(--lh-body-l);letter-spacing:var(--ls-body-l);
  overflow-wrap:break-word;
}
.evrow.unread .evt{font-weight:700}
.evrow .evd{font-size:var(--fs-micro);color:var(--muted);line-height:var(--lh-micro)}
/* the "this goes somewhere" mark. Not scoped to .evrow: the same chevron closes the tappable
   .sug rows in pcAskCard() and pcShopSection(), which are the same affordance. */
.evgo{flex:0 0 auto;align-self:center;color:var(--dim);font-size:18px;line-height:1;padding-left:var(--s1)}
/* a row whose target no longer exists is rendered dead rather than deleted: deleting it would
   rewrite history he might be looking for. */
.evrow.dead{opacity:.5;cursor:default;pointer-events:none}
.evrow.dead .evgo{visibility:hidden}
/* the feed's 38px icon tile, promoted from inline styles to a real Tier-1 emoji container */
.pav.pav-sm{width:38px;height:38px;font-size:18px;border-radius:var(--r-xs)}

/* ================= R6 · F1 — highlight the thing you were sent to ================= */
@keyframes hlPulse{
  0%{box-shadow:0 0 0 0 var(--acc)}
  20%{box-shadow:0 0 0 3px var(--acc)}
  100%{box-shadow:0 0 0 0 rgba(0,0,0,0)}
}
/* NOT `.hl` — that class already exists inside `.hbar` as the meter's label row. */
.hlflash{animation:hlPulse 1.6s var(--ease) 1}
tr.hlflash{animation:none;background:var(--acc-tint)}
/* the global reduced-motion rule collapses every animation to 0.001ms, which would make the
   ring invisible. Reduced motion must not mean "no feedback". */
@media (prefers-reduced-motion:reduce){ .hlflash{animation:none;background:var(--acc-tint)} }

/* ================= R6 · F1 — the actionable toast ================= */
#toast.tappable{
  display:flex;align-items:center;gap:var(--s3);
  text-align:left;pointer-events:auto;padding-right:var(--s2);
  /* #toast is a fixed box at left:50% with auto width, so its shrink-to-fit budget is only HALF
     the viewport — plain toasts have always wrapped inside that. A row that must hold a message
     AND a target needs the real width, so the tappable variant takes a definite one. */
  width:min(calc(100vw - var(--s8)), 520px);
}
#toast .tgo{
  /* R7 · 44px like every other primary target in the app, not 36 */
  flex:0 0 auto;min-height:44px;padding:0 var(--s3);
  border:none;border-radius:var(--r-pill);
  background:var(--bg);color:var(--ink);
  font-family:var(--font);font-size:var(--fs-label);font-weight:700;line-height:1;
  cursor:pointer;display:inline-flex;align-items:center;gap:var(--s1);white-space:nowrap;
}
/* a tap already in flight when the toast appeared must not be able to land on it */
#toast.arming .tgo{opacity:.45;pointer-events:none}
/* break-word, not anywhere: toastGo() only ever carries evText() output (never user text), so
   word boundaries are safe to respect — and a mid-word break is exactly what this reader loses. */
#toast .tmsg{flex:1;min-width:0;overflow-wrap:break-word}

/* ================= R6 · F2 — the product-chat chip on a product row =================
   R7 · the chip and the preview no longer live inside the .info column. In split/demo mode that
   column collapses to ~124px, which clipped the chip's own unread count in half (overflow:hidden
   sliced the .dot) and left the preview a 98px box that could not finish the word «Մատակարարը»,
   let alone show any of the message. They now sit on their own full-row line, so both get the
   whole row width on every surface and at every width. */
.pcline{
  flex:1 1 100%;min-width:0;width:100%;
  display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;
  margin-top:var(--s2);
}
.sug.pcw{flex-wrap:wrap}
.pcchip{
  display:inline-flex;align-items:center;gap:var(--s1);
  /* 44px, not 36: this is the only entry point to the feature on a product row, and the reader
     is 55 and one-handed in a narrow aisle (design system §3.4). */
  min-height:44px;padding:0 var(--s3);max-width:100%;
  border:var(--bw) solid var(--stroke2);border-radius:var(--r-pill);
  background:var(--surface);color:var(--muted);
  font-family:var(--font);font-size:var(--fs-micro);font-weight:600;line-height:1.2;
  cursor:pointer;white-space:nowrap;flex:0 0 auto;
  transition:background var(--dur-1) var(--ease),border-color var(--dur-1) var(--ease);
}
.pcchip:active{background:var(--surface-2)}
.pcchip:focus-visible{outline:none;box-shadow:var(--focus)}
.pcchip.has{background:var(--acc-tint);color:var(--acc-text);border-color:var(--acc-line)}
/* the count is the chip's whole point; it is never the thing that gets cut */
.pcchip .dot{flex:0 0 auto}
.pcprev{
  min-width:0;
  font-size:var(--fs-micro);color:var(--muted);line-height:var(--lh-micro);
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow-wrap:break-word;
}
/* only INSIDE the row does the preview flex — .sug .info is a COLUMN flex container, where a
   flex-basis is a HEIGHT, and 200px there gave the supplier's ask card a 200px-tall blank line. */
.pcline>.pcprev{flex:1 1 200px}
.pcprev b{font-weight:600;color:var(--dim)}
/* three demo-days of silence is the one thing in this app worth reddening */
/* R7 · §3.1 — a card that must stand apart from its neighbours carries the same mark an .alert
   carries: a tinted 1px border plus a 3px status rail on a normal surface. The app had four
   versions of this idea — a rail (.pcurgent), a green tint fill (the privacy gate), a violet tint
   fill (the supplier's proposal) and a bare blue border (route, forecast, a shop in trouble) —
   so four cards that mean "look here" looked like four unrelated components. */
.card.rail{border-left-width:3px;border-left-style:solid}
.card.rail-note{border-color:var(--note-line);border-left-color:var(--note)}
.card.rail-ok  {border-color:var(--success-line);border-left-color:var(--success)}
.card.rail-info{border-color:var(--info-line);border-left-color:var(--info)}
.card.rail-bad {border-color:var(--danger-line);border-left-color:var(--danger)}
/* the WARN state was written into two cards (docCoverCard, docCoverStrip) and never into this
   sheet, so the one card that means "you are below the line" drew the NEUTRAL card border and
   was indistinguishable from a card that means nothing — in exactly the state a demo shows.
   Amber: the same accent the coverage bar already fills with below 80 %. */
.card.rail-warn{border-color:var(--acc-line);border-left-color:var(--acc)}
.card.pcurgent{border-left-width:3px;border-left-style:solid;
  border-color:var(--danger-line);border-left-color:var(--danger)}

/* ================= R6 · F2 — the thread sheet ================= */
.pcctx{
  display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;
  margin:var(--s2) 0 0;padding:var(--s2) var(--s3);
  background:var(--surface-2);border:var(--bw) solid var(--stroke);border-radius:var(--r-sm);
  font-size:var(--fs-micro);color:var(--muted);overflow-wrap:break-word;
}
.pcctx b{color:var(--ink);font-weight:700}
.msgs{margin:var(--s3) 0;max-height:44vh;overflow-y:auto;overscroll-behavior:contain}
.msg{display:flex;margin-bottom:var(--s2)}
.msg.mine{justify-content:flex-end}
.msg .bub{
  max-width:78%;padding:var(--s2) var(--s3);
  border:var(--bw) solid var(--stroke2);
  border-radius:var(--r) var(--r) var(--r) var(--r-xs);
  background:var(--surface-2);
  font-size:var(--fs-body);line-height:1.45;overflow-wrap:break-word;
}
.msg.mine .bub{border-radius:var(--r) var(--r) var(--r-xs) var(--r)}
/* keyed to the AUTHOR, not to "me": the same message is the same colour on both devices */
.msg.byshop .bub{background:var(--acc-tint);border-color:var(--acc-line)}
/* R7 · 14px, not the 12px --fs-caps token. These were the only two texts in the new UI under
   14px, and "who said this and when" is exactly what a 55-year-old reader checks in bad light. */
.msg .who{
  display:flex;align-items:center;gap:var(--s1);margin-bottom:2px;
  font-size:var(--fs-micro);font-weight:var(--fw-caps);letter-spacing:var(--ls-caps);color:var(--dim);
}
.msg .when{font-size:var(--fs-micro);color:var(--dim);margin-top:var(--s1);text-align:right}
.pccomp{display:flex;gap:var(--s2);align-items:stretch}
.pccomp .search{margin:0;flex:1;min-width:0}
.pccomp .btn{flex:0 0 auto}

/* ================= PRINT =================
   MUST be the last block in the sheet. Declared earlier it lost every property that a later
   same-specificity rule redeclared (.modal, .mbody), which pinned the գույքագրման ակտ to the
   bottom of the sheet on a dark canvas. !important covers the theme rules (body.light .mbody),
   which outrank a bare .mbody selector wherever they sit. */
@media print{
  @page{margin:14mm}
  html,body{background:#fff !important;color:#111 !important}
  body::before,body::after{display:none !important}
  #top,#app,nav,#toast,.noprint,.grabber{display:none !important}
  .modal{position:static !important;inset:auto !important;background:#fff !important;display:block !important;
         align-items:flex-start !important;backdrop-filter:none !important;-webkit-backdrop-filter:none !important;animation:none !important}
  .mbody{background:#fff !important;color:#111 !important;border:none !important;box-shadow:none !important;
