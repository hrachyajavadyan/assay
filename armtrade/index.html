<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A0F1E">
<title>ArmTrade — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+Armenian:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080C18; --ink:#EDF1FA; --muted:#93A0BD; --dim:#5E6D8C;
  --gold:#E39A3B; --gold2:#F7C572;
  --cyan:#22D3EE; --green:#34D399; --rose:#FB7185; --violet:#A78BFA; --blue:#60A5FA;
  --glass:rgba(255,255,255,.055); --glass2:rgba(255,255,255,.09);
  --stroke:rgba(255,255,255,.11); --stroke2:rgba(255,255,255,.18);
  --r:18px;
  --font:'Inter','Noto Sans Armenian',-apple-system,sans-serif;
  --display:'Space Grotesk','Noto Sans Armenian',sans-serif;
  --mono:'IBM Plex Mono',menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;-webkit-font-smoothing:antialiased}
/* bright ambient glows */
body::before{content:"";position:fixed;inset:0;z-index:-2;background:
  radial-gradient(60vw 50vh at 12% -8%, rgba(227,154,59,.22), transparent 60%),
  radial-gradient(55vw 50vh at 96% 4%, rgba(167,139,250,.20), transparent 60%),
  radial-gradient(70vw 60vh at 50% 118%, rgba(34,211,238,.16), transparent 60%),
  #080C18;}
body::after{content:"";position:fixed;inset:0;z-index:-1;background-image:radial-gradient(rgba(255,255,255,.035) 1px, transparent 1px);background-size:26px 26px;opacity:.5}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font-family:var(--font)}

/* ---------- glass primitives ---------- */
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(135%);-webkit-backdrop-filter:blur(18px) saturate(135%);border:1px solid var(--stroke);border-radius:var(--r)}
.card{background:var(--glass);backdrop-filter:blur(16px) saturate(130%);-webkit-backdrop-filter:blur(16px) saturate(130%);border:1px solid var(--stroke);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:0 8px 30px rgba(0,0,0,.22)}
.card h3{margin:0 0 12px;font-family:var(--display);font-size:15px;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
.sec{margin:20px 4px 11px;font-size:11px;font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:1.7px}
.sec:first-child{margin-top:2px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted);font-size:12.5px;line-height:1.55}
.big{font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:-.5px}

/* glassy buttons */
.btn{position:relative;border:1px solid var(--stroke2);border-radius:13px;background:linear-gradient(180deg,var(--glass2),rgba(255,255,255,.03));color:var(--ink);font-weight:700;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);overflow:hidden;transition:transform .14s,box-shadow .2s;padding:11px 15px;font-size:13.5px}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.22),transparent 42%);opacity:.7;pointer-events:none}
.btn:active{transform:scale(.96)}
.btn.primary{width:100%;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1205;border-color:rgba(255,255,255,.25);padding:16px;font-size:16px;font-weight:800;box-shadow:0 10px 34px rgba(227,154,59,.4)}
.btn.cyan{background:linear-gradient(135deg,#67E8F9,var(--cyan));color:#062a30;border-color:transparent;box-shadow:0 8px 26px rgba(34,211,238,.32)}
.btn.green{background:linear-gradient(135deg,#6EE7B7,var(--green));color:#052e1c;border-color:transparent;box-shadow:0 8px 26px rgba(52,211,153,.30)}
.btn.violet{background:linear-gradient(135deg,#C4B5FD,var(--violet));color:#1e1146;border-color:transparent;box-shadow:0 8px 26px rgba(167,139,250,.30)}
.btn.ghost{background:var(--glass);color:var(--ink)}
.btn.small{padding:8px 12px;font-size:12.5px;border-radius:10px}
.btn.danger{background:linear-gradient(180deg,rgba(251,113,133,.18),rgba(251,113,133,.06));color:var(--rose);border-color:rgba(251,113,133,.35)}
.btn.full{width:100%}

/* badges / pills */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:8px;font-size:10.5px;font-weight:800;letter-spacing:.3px;border:1px solid transparent}
.b-cyan{background:rgba(34,211,238,.14);color:#7DE9F7;border-color:rgba(34,211,238,.3)}
.b-gold{background:rgba(247,197,114,.14);color:var(--gold2);border-color:rgba(247,197,114,.3)}
.b-green{background:rgba(52,211,153,.14);color:#6EE7B7;border-color:rgba(52,211,153,.3)}
.b-rose{background:rgba(251,113,133,.15);color:#FDA4B4;border-color:rgba(251,113,133,.32)}
.b-violet{background:rgba(167,139,250,.15);color:#C4B5FD;border-color:rgba(167,139,250,.32)}
.b-neutral{background:rgba(147,160,189,.13);color:var(--muted);border-color:rgba(147,160,189,.22)}
.dot{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 5px;border-radius:99px;background:var(--rose);color:#2a0710;font-size:10px;font-weight:800}

.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-bottom:6px}
.kpi{background:var(--glass);border:1px solid var(--stroke);border-radius:15px;padding:14px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;top:-30px;right:-30px;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.09),transparent 70%)}
.kpi .v{font-family:var(--mono);font-size:22px;font-weight:600;margin-top:6px}
.kpi .l{font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.8px;display:flex;align-items:center;gap:5px}

/* product rows */
.sug{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.sug:last-child{border-bottom:none;padding-bottom:2px}
.sug:first-child{padding-top:2px}
.pav{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:23px;flex-shrink:0;background:var(--glass2);border:1px solid var(--stroke2)}
.sug .info{flex:1;min-width:0}
.sug .nm{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sug .sub{font-size:11.5px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.sug .sub b{font-family:var(--mono);color:var(--gold2);font-weight:600}
.qtyctl{display:flex;align-items:center;gap:2px;background:var(--glass2);border:1px solid var(--stroke2);border-radius:11px;padding:3px}
.qtyctl button{width:30px;height:30px;border-radius:9px;border:none;background:transparent;color:var(--gold2);font-size:18px;font-weight:800;cursor:pointer}
.qtyctl button:active{background:rgba(247,197,114,.18)}
.qtyctl span{min-width:26px;text-align:center;font-family:var(--mono);font-weight:600;font-size:15px}
.addbtn{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1205;border:none;border-radius:11px;padding:9px 13px;font-weight:800;font-size:12.5px;cursor:pointer;transition:.15s;width:100%;box-shadow:0 5px 16px rgba(227,154,59,.3)}
.addbtn:active{transform:scale(.95)}
.addbtn.added{background:linear-gradient(135deg,#6EE7B7,var(--green));color:#052e1c;box-shadow:0 5px 16px rgba(52,211,153,.3)}

/* search & chips */
.search{width:100%;padding:13px 16px;border:1px solid var(--stroke2);border-radius:13px;font-size:15px;font-family:var(--font);background:var(--glass);color:var(--ink);margin-bottom:12px;outline:none;transition:.15s;backdrop-filter:blur(10px)}
.search::placeholder{color:var(--dim)}
.search:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(227,154,59,.18)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{white-space:nowrap;background:var(--glass);border:1px solid var(--stroke2);border-radius:99px;padding:8px 14px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:6px}
.chips button.active{background:linear-gradient(135deg,rgba(247,197,114,.22),rgba(227,154,59,.12));color:var(--gold2);border-color:rgba(247,197,114,.5)}

/* orders */
.order{border:1px solid var(--stroke);border-radius:15px;padding:15px;margin-bottom:12px;background:var(--glass);position:relative;overflow:hidden}
.order.st-new{border-color:rgba(34,211,238,.28)}
.order.st-new::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cyan)}
.order.st-confirmed::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold)}
.order.st-delivered::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--green)}
.order .oh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;gap:8px}
.order .oh b{font-size:14px}
.oid{font-family:var(--mono);font-size:11.5px;color:var(--dim)}
.oitems{font-size:12.5px;color:var(--muted);line-height:1.75;margin-top:7px}
.osum{font-family:var(--mono);font-weight:600;margin-top:8px;font-size:15px;color:var(--gold2)}
.obtns{display:flex;gap:10px;margin-top:12px}
.obtns button{flex:1}
/* order progress tracker (shop side) */
.otrack{display:flex;align-items:center;margin-top:13px;padding:0 2px}
.onode{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;background:var(--glass2);border:1px solid var(--stroke2);color:var(--dim)}
.onode.done{background:linear-gradient(135deg,#6EE7B7,var(--green));border-color:transparent;color:#052e1c;box-shadow:0 0 12px rgba(52,211,153,.45)}
.onode.now{background:linear-gradient(135deg,#67E8F9,var(--cyan));border-color:transparent;color:#062a30;box-shadow:0 0 14px rgba(34,211,238,.55);animation:nowPulse 1.6s ease-in-out infinite}
@keyframes nowPulse{0%,100%{box-shadow:0 0 8px rgba(34,211,238,.35)}50%{box-shadow:0 0 18px rgba(34,211,238,.75)}}
.oline{flex:1;height:3px;border-radius:99px;background:var(--stroke);margin:0 5px}
.oline.done{background:linear-gradient(90deg,var(--green),var(--cyan))}
.olabels{display:flex;justify-content:space-between;margin-top:6px;font-size:9.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--dim)}
.olabels span.on{color:var(--ink)}

/* supplier shop list */
.shoprow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.07);cursor:pointer}
.shoprow:last-child{border-bottom:none}
.shopav{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,rgba(247,197,114,.22),rgba(167,139,250,.16));border:1px solid var(--stroke2);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--gold2);font-size:15px;flex-shrink:0}

/* alerts */
.alert{border:1px solid rgba(247,197,114,.3);background:linear-gradient(180deg,rgba(247,197,114,.10),rgba(247,197,114,.03));border-radius:15px;padding:14px 15px;margin-bottom:11px}
.alert.bad{border-color:rgba(251,113,133,.38);background:linear-gradient(180deg,rgba(251,113,133,.12),rgba(251,113,133,.03))}
.alert .t{font-weight:600;font-size:13.5px;line-height:1.5}
.alert .d{font-size:12px;color:var(--muted);margin-top:5px}
.alert .act{margin-top:10px;display:flex;gap:8px}

.empty{color:var(--muted);text-align:center;padding:30px 12px;font-size:13.5px}
.empty .em{font-size:34px;display:block;margin-bottom:8px}
.notice{background:linear-gradient(135deg,rgba(34,211,238,.12),rgba(167,139,250,.10));border:1px solid var(--stroke2);border-radius:15px;padding:13px 15px;margin-bottom:14px;font-size:12.5px;color:#CDE9F5;line-height:1.6}
.footer-note{text-align:center;color:var(--dim);font-size:11px;margin:18px 0 4px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px}
.tbl th{text-align:left;color:var(--dim);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;padding:7px 5px;border-bottom:1px solid var(--stroke2)}
.tbl td{padding:9px 5px;border-bottom:1px solid rgba(255,255,255,.07)}

/* ---------- TOP BAR (global controls) ---------- */
#top{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:10px;padding:calc(9px + env(safe-area-inset-top)) 14px 9px;background:rgba(9,13,26,.72);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border-bottom:1px solid var(--stroke)}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.3px}
.logomark{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--gold2),var(--gold));display:flex;align-items:center;justify-content:center;color:#1a1205;font-size:16px;box-shadow:0 5px 18px rgba(227,154,59,.45)}
.logo small{display:block;font-family:var(--font);font-weight:500;font-size:10.5px;color:var(--muted);margin-top:1px}
#top .spacer{flex:1}
.tbtn{border:1px solid var(--stroke2);background:var(--glass);color:var(--ink);border-radius:11px;padding:8px 12px;font-size:12.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;backdrop-filter:blur(10px)}
.tbtn:active{transform:scale(.95)}
.tbtn.on{background:linear-gradient(135deg,rgba(247,197,114,.24),rgba(227,154,59,.12));color:var(--gold2);border-color:rgba(247,197,114,.5)}
.tbtn.day{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1205;border-color:transparent;box-shadow:0 5px 16px rgba(227,154,59,.35)}
.datechip{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap}

/* ---------- SPLIT layout ---------- */
#app{position:relative}
.split{display:grid;grid-template-columns:1fr;gap:14px;padding:14px;max-width:720px;margin:0 auto}
.pane{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.panehead{position:sticky;top:0;z-index:5;padding:12px 14px 8px;background:rgba(255,255,255,.04);backdrop-filter:blur(14px);border-bottom:1px solid var(--stroke)}
.panetitle{font-family:var(--display);font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.panetitle .tag{margin-left:auto;font-family:var(--font);font-weight:700;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
.panetabs{margin-bottom:0}
.panetabs button{padding:7px 12px}
.panetabs button.active .dot,.chips button.active .dot{background:var(--gold2);color:#1a1205}
.panebody{padding:14px}
.pane.flash{animation:flashPane .9s ease}
@keyframes flashPane{0%{box-shadow:0 0 0 0 rgba(34,211,238,.0)}25%{box-shadow:0 0 0 3px rgba(34,211,238,.6),0 0 40px rgba(34,211,238,.35)}100%{box-shadow:0 0 0 0 rgba(34,211,238,0)}}
.flowmark{display:none}

/* ---------- SINGLE layout (mobile bottom nav) ---------- */
main{padding:14px;max-width:680px;margin:0 auto;animation:fadeUp .28s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.roleswitch{display:flex;background:var(--glass);border:1px solid var(--stroke);border-radius:13px;padding:3px;margin:0 auto 4px;max-width:680px}
.roleswitch button{flex:1;border:none;background:transparent;color:var(--muted);padding:9px 6px;border-radius:10px;font-size:13.5px;font-weight:700;cursor:pointer;transition:.18s}
.roleswitch button.active{background:linear-gradient(135deg,rgba(247,197,114,.24),rgba(227,154,59,.12));color:var(--gold2)}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(9,13,26,.85);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--stroke);display:flex;z-index:60;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;border:none;background:none;padding:7px 2px;font-size:10px;color:var(--dim);cursor:pointer;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
nav button.active{color:var(--gold2)}
nav button.active .icw{background:rgba(247,197,114,.18)}
nav .icw{width:44px;height:28px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-size:18px;transition:.15s}
.navbadge{position:absolute;top:0;left:calc(50% + 6px);background:var(--rose);color:#2a0710;font-size:9.5px;font-weight:800;border-radius:99px;padding:1.5px 6px}
body.single-mobile{padding-bottom:calc(84px + env(safe-area-inset-bottom))}

/* toast & modal */
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(8px);bottom:calc(96px + env(safe-area-inset-bottom));background:linear-gradient(135deg,#67E8F9,var(--cyan));color:#062a30;padding:12px 20px;border-radius:13px;font-size:13.5px;font-weight:800;z-index:100;opacity:0;transition:.28s;pointer-events:none;max-width:88%;text-align:center;box-shadow:0 10px 34px rgba(34,211,238,.45)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(4,7,14,.72);backdrop-filter:blur(6px);z-index:90;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.mbody{background:rgba(20,26,44,.92);backdrop-filter:blur(24px);border:1px solid var(--stroke2);width:100%;max-width:680px;border-radius:24px 24px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));max-height:84vh;overflow-y:auto;animation:slideUp .28s cubic-bezier(.2,.9,.3,1)}
@keyframes slideUp{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.grabber{width:40px;height:4px;border-radius:99px;background:var(--stroke2);margin:6px auto 14px}
.mbody h3{margin:0 0 4px;font-family:var(--display);font-size:18px}

/* grid inside single desktop */
.grid2{display:block}

/* ================= DESKTOP ================= */
@media (min-width:980px){
  .split{max-width:none;grid-template-columns:1fr 1fr;gap:20px;height:calc(100vh - 60px);padding:18px 24px;align-items:stretch}
  .pane{height:100%}
  .panebody{overflow-y:auto;flex:1;scrollbar-width:thin;scrollbar-color:var(--stroke2) transparent}
  .panebody::-webkit-scrollbar{width:8px}
  .panebody::-webkit-scrollbar-thumb{background:var(--stroke2);border-radius:99px}
  .split.is-two .flowmark{display:flex;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:8;width:46px;height:46px;border-radius:50%;align-items:center;justify-content:center;font-size:20px;background:linear-gradient(135deg,rgba(34,211,238,.9),rgba(167,139,250,.9));color:#04121a;box-shadow:0 8px 30px rgba(34,211,238,.5);border:2px solid rgba(255,255,255,.3);animation:pulseFlow 2.6s ease-in-out infinite}
  @keyframes pulseFlow{0%,100%{box-shadow:0 8px 30px rgba(34,211,238,.5)}50%{box-shadow:0 8px 44px rgba(167,139,250,.7)}}
  /* wider details on big screens */
  .sug .nm{white-space:normal;overflow:visible;text-overflow:clip;font-size:15px;line-height:1.4}
  .panebody{padding:16px 20px}
  /* single desktop */
  main.single-desk{max-width:1400px}
  .single-desk .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 30px;align-items:start}
  .single-desk .kpis{grid-template-columns:repeat(4,1fr)}
  .modal{align-items:center}
  .mbody{border-radius:20px;max-width:560px}
}
@media (min-width:980px) and (max-width:1200px){
  .panetabs button{padding:6px 9px;font-size:11.5px}
}
@media (min-width:1500px){
  .kpis{grid-template-columns:repeat(4,1fr)}
  .split{gap:26px;padding:20px 32px}
}
</style>
</head>
<body>
<div id="top"></div>
<div id="app"></div>
<nav id="nav" style="display:none"></nav>
<div id="toast"></div>
<div id="modalRoot"></div>

<script>
/* ArmTrade prototype v4 — live split view + cross-tab sync + glassmorphism */

const T = {
  hy: {

let S = null, U = null;
function freshState(){
  const st = {today: START, basket:{}, orders:[], history:[], debts:{}, reminded:{}, dismissed:{}, otherLast:{}, seq:1};
  PRODUCTS.forEach(p=>{
    let d = START - 62*DAY + Math.floor(Math.random()*p.cycle)*DAY;
    while(d < START - p.cycle*DAY*0.3){
      const qty = Math.max(1, p.qty + Math.floor(Math.random()*3)-1);
      st.history.push({date:d, productId:p.id, sup:p.sup, qty, price:p.price});
      d += (p.cycle + Math.floor(Math.random()*3)-1)*DAY;
    }
  });
  st.history = st.history.filter(h=>!(h.productId==='p7' && h.date > START-19*DAY));
  st.debts = {s1: 78500, s2: 42300, s3: 0};
  OTHER_SHOPS.forEach((o,i)=>{ st.otherLast[o.id] = START - (i===2? 12 : (1+i%4))*DAY; });
  return st;
}

/* ---------- helpers ---------- */
const P = id => PRODUCTS.find(p=>p.id===id);
const SUP = id => SUPPLIERS.find(s=>s.id===id);

const amd = n => `<span class="num">${n.toLocaleString('en-US')}</span> ֏`;
function fdate(ts){ const d = new Date(ts); const m = lang==='hy'
  ? ['հնվ','փտվ','մրտ','ապր','մյս','հնս','հլս','օգս','սեպ','հոկ','նոյ','դեկ']
  : ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return d.getDate() + ' ' + m[d.getMonth()]; }
function daysAgo(ts){ return Math.round((S.today - ts)/DAY); }
function toast(msg){ const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove('show'), 2200); }

function stats(pid){
  const h = S.history.filter(x=>x.productId===pid).sort((a,b)=>a.date-b.date);
  if(!h.length) return null;
  const gaps = []; for(let i=1;i<h.length;i++) gaps.push((h[i].date-h[i-1].date)/DAY);
  gaps.sort((a,b)=>a-b);
  const cycle = gaps.length ? Math.max(2, Math.round(gaps[Math.floor(gaps.length/2)])) : P(pid).cycle;
  const avgQty = Math.round(h.slice(-5).reduce((a,x)=>a+x.qty,0)/Math.min(5,h.length));
  const last = h[h.length-1].date;
  const due = last + cycle*DAY;
  const dueIn = Math.ceil((due - S.today)/DAY);
  return {cycle, avgQty, last, due, dueIn, count:h.length};
}
function suggestions(){
  return PRODUCTS.map(p=>({p, st:stats(p.id)}))
    .filter(x=>x.st && x.st.dueIn <= 1 && !S.dismissed[x.p.id])
    .sort((a,b)=>a.st.dueIn - b.st.dueIn);
}
function supAlerts(){
  const out = [];
  PRODUCTS.forEach(p=>{
    const st = stats(p.id); if(!st) return;
    const overdueDays = -st.dueIn;
    if(overdueDays >= st.cycle*2) out.push({type:'churn', p, st, shop:MY_SHOP});
    else if(overdueDays >= Math.max(2, Math.round(st.cycle*0.6))) out.push({type:'overdue', p, st, shop:MY_SHOP});
  });
  out.push({type:'churn', p:P('p2'), st:{cycle:4, dueIn:-9, avgQty:5, last:S.otherLast['o3']}, shop:OTHER_SHOPS[2], other:true});
  return out.filter(a=>!S.reminded[alertKey(a)]);
}
const alertKey = a => a.shop.id + '_' + a.p.id + '_' + a.type;

/* ---------- actions ---------- */
function paneTab(role, tb){ U.tab[role]=tb; saveU(); renderAll(); }

function addToBasket(pid, qty){ S.basket[pid] = (S.basket[pid]||0) + qty; saveD(); renderAll(); }
function setBasketQty(pid, qty){ if(qty<=0) delete S.basket[pid]; else S.basket[pid]=qty; saveD(); renderAll(); }
function dismissSug(pid){ S.dismissed[pid] = true; saveD(); renderAll(); }

function submitBasket(){
  const bySup = {};
  Object.entries(S.basket).forEach(([pid,qty])=>{ const p = P(pid); (bySup[p.sup] = bySup[p.sup]||[]).push({productId:pid, qty, price:p.price}); });
  const n = Object.keys(bySup).length; if(!n) return;
  Object.entries(bySup).forEach(([sup,items])=>{
    S.orders.unshift({id:'ORD-'+(S.seq++), date:S.today, shop:MY_SHOP, sup, items, status:'new'});
  });
  S.basket = {}; S.dismissed = {};
  U.tab.shop='orders'; if(!U.split) U.tab.supplier='inbox';
  saveD(); saveU(); toast(n + ' ' + t('order_placed')); renderAll();
}
function confirmOrder(oid){ const o = S.orders.find(x=>x.id===oid); if(o){ o.status='confirmed'; saveD(); toast(t('confirmed_msg')); renderAll(); } }
function deliverOrder(oid){
  const o = S.orders.find(x=>x.id===oid); if(!o) return;
  o.status='delivered';
  if(o.shop.id==='me'){
    o.items.forEach(it=>S.history.push({date:S.today, productId:it.productId, sup:o.sup, qty:it.qty, price:it.price}));
    const sum = o.items.reduce((a,x)=>a+x.qty*x.price,0);
    S.debts[o.sup] = (S.debts[o.sup]||0) + sum;
  }
  saveD(); toast(t('delivered_msg')); renderAll();
}
function remindFix(k){ S.reminded[k]=true; saveD(); toast(t('reminded')); renderAll(); }
function payDebt(sup){ S.debts[sup] = 0; saveD(); toast(t('paid')); renderAll(); }
function resetDemo(){ S = freshState(); saveD(); toast(t('reset_done')); renderAll(); }

function advanceDay(){
  S.today += DAY;
  if(Math.random() < 0.75){
    const shop = OTHER_SHOPS[Math.floor(Math.random()*OTHER_SHOPS.length)];
    if(shop.id!=='o3'){
      const sup = ['s1','s2','s3'][Math.floor(Math.random()*3)];
      const pool = PRODUCTS.filter(p=>p.sup===sup);
      const items = pool.slice(0, 1+Math.floor(Math.random()*pool.length)).map(p=>({productId:p.id, qty:Math.max(1,p.qty+Math.floor(Math.random()*3)-1), price:p.price}));
      S.orders.unshift({id:'ORD-'+(S.seq++), date:S.today, shop, sup, items, status:'new'});
      S.otherLast[shop.id] = S.today;
    }
  }
  saveD(); toast(t('day_advanced') + ' ' + fdate(S.today)); renderAll();
}

  document.getElementById('top').innerHTML = topBar();
  const desktop = window.innerWidth>=980;

    app.innerHTML = `<div class="roleswitch" style="margin-top:14px">
        <button class="${role==='shop'?'active':''}" onclick="setRole('shop')">🏪 ${t('shop')}</button>

      </div>
      <main class="${cls}">${viewFor(role,U.tab[role])}</main>`;
    renderNav(role);
    nav.style.display = desktop ? 'none' : 'flex';
  }

  // flash supplier pane when a new order arrives (the "flow")
  const inboxN = S.orders.filter(o=>o.status==='new').length;
  if(prevInboxN!==null && inboxN>prevInboxN){
    const sp=document.querySelector('[data-role="supplier"]');
    if(sp){ sp.classList.remove('flash'); void sp.offsetWidth; sp.classList.add('flash'); }
    if(fromSync) toast(t('new_order_in'));
  }
  prevInboxN = inboxN;
  // flash shop pane + notify when MY order gets confirmed/delivered
  const myConf = S.orders.filter(o=>o.shop.id==='me'&&o.status==='confirmed').length;
  const myDel  = S.orders.filter(o=>o.shop.id==='me'&&o.status==='delivered').length;
  if(prevMy){
    if(myDel>prevMy.del) notifyShop(t('you_delivered'));
    else if(myConf>prevMy.conf) notifyShop(t('you_confirmed'));
  }
  prevMy = {conf:myConf, del:myDel};
}
let prevMy = null;
function notifyShop(msg){
  const sp=document.querySelector('[data-role="shop"]');
  if(sp){ sp.classList.remove('flash'); void sp.offsetWidth; sp.classList.add('flash'); }
  toast(msg);
}
function renderNav(role){
  const basketN = Object.keys(S.basket).length;
  const inboxN = S.orders.filter(o=>o.status==='new').length;
  const alertsN = supAlerts().length;
  const myActiveN = S.orders.filter(o=>o.shop.id==='me'&&o.status!=='delivered').length;
  const items = role==='shop'
    ? [['home','📋'],['catalog','🛒'],['basket','🧺',basketN],['orders','📦',myActiveN],['debts','💳']]
    : [['dash','📊'],['inbox','📥',inboxN],['shops','🏪'],['alerts','🔔',alertsN],['catalog','🏷']];
  const labels = role==='shop' ? T[lang].tabs_shop : T[lang].tabs_sup;
  document.getElementById('nav').innerHTML = items.map(([k,ic,badge])=>`
    <button class="${U.tab[role]===k?'active':''}" onclick="paneTab('${role}','${k}')">
      ${badge?`<span class="navbadge">${badge}</span>`:''}
      <span class="icw">${ic}</span>${labels[k]}
    </button>`).join('');
}

/* ----- SHOP views ----- */
function sugCard(x){
  const {p, st} = x;
  const inB = S.basket[p.id];
  let badge = '';
  if(st){
    if(st.dueIn < 0) badge = `<span class="badge b-rose">${t('overdue')} ${-st.dueIn} ${lang==='hy'?'օր':'d'}</span>`;
    else if(st.dueIn === 0) badge = `<span class="badge b-gold">${t('due_today')}</span>`;
    else badge = `<span class="badge b-neutral">${st.dueIn} ${t('due_in')}</span>`;
  }
  const qty = inB || (st ? st.avgQty : p.qty);
  const sup = SUP(p.sup);
  return `<div class="sug">
    <div class="pav">${p.em}</div>
    <div class="info">
      <div class="nm">${nm(p)}</div>
      <div class="sub">${sup.em} ${nm(sup)} · <b>${p.price.toLocaleString('en-US')} ֏</b>${p.promo?` <span class="badge b-violet">${t('promo')} −10%</span>`:''}</div>
      <div class="sub">${st?`${t('every')} ${st.cycle} ${t('days')} · ${t('last_order')}՝ ${fdate(st.last)}`:''} ${badge}</div>
    </div>
    <div style="text-align:right;min-width:100px">
      <div class="qtyctl">
        <button onclick="setBasketQty('${p.id}', ${Math.max(0,qty-1)})">−</button><span>${qty}</span>
        <button onclick="setBasketQty('${p.id}', ${qty+1})">+</button>
      </div>
      <button class="addbtn ${inB?'added':''}" style="margin-top:7px" onclick="addToBasket('${p.id}', ${inB?0:qty})">${inB?t('added'):t('add')}</button>
    </div>
  </div>`;
}
function vShopHome(){
  const sugs = suggestions();
  const basketN = Object.keys(S.basket).length;
  return `
  <div class="notice">${t('demo_note')}</div>
  <div class="sec">${t('today_sug')} (${sugs.length})</div>
  <div class="card">
    ${sugs.length ? sugs.map(x=>sugCard(x)).join('') : `<div class="empty"><span class="em">✅</span>${t('all_ok')}</div>`}
  </div>
  ${basketN?`<button class="btn primary" onclick="paneTab('${curRole}','basket')">${t('basket')} (${basketN}) →</button>`:''}
  <div class="footer-note">ArmTrade · ${lang==='hy'?'ցուցադրական տվյալներ':'demo data'}</div>`;
}
let catFilter = 'all', catQ = '';
function vShopCatalog(){
  const list = PRODUCTS.filter(p=>(catFilter==='all'||p.sup===catFilter) && (nm(p).toLowerCase().includes(catQ.toLowerCase())));
  return `
  <input class="search" placeholder="${t('search')}" value="${catQ}" oninput="catQ=this.value;renderAll()">
  <div class="chips">
    <button class="${catFilter==='all'?'active':''}" onclick="catFilter='all';renderAll()">${t('all')}</button>
    ${SUPPLIERS.map(s=>`<button class="${catFilter===s.id?'active':''}" onclick="catFilter='${s.id}';renderAll()">${s.em} ${nm(s)}</button>`).join('')}
  </div>
  <div class="card">${list.map(p=>sugCard({p, st:stats(p.id)})).join('') || `<div class="empty">—</div>`}</div>`;
}
function vShopBasket(){
  const ids = Object.keys(S.basket);
  if(!ids.length) return `<div class="empty"><span class="em">🧺</span>${t('basket_empty')}</div>`;
  const bySup = {};
  ids.forEach(pid=>{ (bySup[P(pid).sup] = bySup[P(pid).sup]||[]).push(pid); });
  let total = 0;
  const html = Object.entries(bySup).map(([sup, pids])=>{
    const sum = pids.reduce((a,pid)=>a + S.basket[pid]*P(pid).price, 0); total += sum;
    return `<div class="card">
      <h3>${SUP(sup).em} ${nm(SUP(sup))}</h3>
      ${pids.map(pid=>{const p=P(pid);return `<div class="sug">
        <div class="pav">${p.em}</div>
        <div class="info"><div class="nm">${nm(p)}</div><div class="sub">${amd(p.price)}</div></div>
        <div class="qtyctl">
          <button onclick="setBasketQty('${pid}', ${S.basket[pid]-1})">−</button><span>${S.basket[pid]}</span>
          <button onclick="setBasketQty('${pid}', ${S.basket[pid]+1})">+</button>
        </div></div>`;}).join('')}
      <div class="osum">${t('sum')}՝ ${amd(sum)}</div>
    </div>`;
  }).join('');
  return `${html}
    <div class="card"><div class="row"><b>${t('sum')}</b><span class="big" style="color:var(--gold2)">${amd(total)}</span></div>
    <div class="muted" style="margin-top:5px">${Object.keys(bySup).length} ${t('orders_split')}</div></div>
    <button class="btn primary" onclick="submitBasket()">${t('submit_orders')} →</button>`;
}
function orderTracker(status){
  const steps=['new','confirmed','delivered'];
  const idx=steps.indexOf(status);
  const node=i=> i<idx ? 'done' : (i===idx ? (idx===2?'done':'now') : '');
  const icons=['📝','✓','🚚'];
  return `<div class="otrack">
    <div class="onode ${node(0)}">${idx>0?'✓':icons[0]}</div><div class="oline ${idx>=1?'done':''}"></div>
    <div class="onode ${node(1)}">${idx>1?'✓':icons[1]}</div><div class="oline ${idx>=2?'done':''}"></div>
    <div class="onode ${node(2)}">${icons[2]}</div>
  </div>
  <div class="olabels"><span class="${idx>=0?'on':''}">${t('st_new')}</span><span class="${idx>=1?'on':''}">${t('st_confirmed')}</span><span class="${idx>=2?'on':''}">${t('st_delivered')}</span></div>`;
}
function orderCard(o, side){
  const sum = o.items.reduce((a,x)=>a+x.qty*x.price,0);
  return `<div class="order st-${o.status}">
    <div class="oh">
      <b>${side==='shop' ? SUP(o.sup).em+' '+nm(SUP(o.sup)) : '🏪 '+nm(o.shop)}</b>
      ${statusBadge(o.status)}
    </div>
    <div class="oid">${o.id} · ${fdate(o.date)}</div>
    <div class="oitems">${o.items.map(it=>`${nm(P(it.productId))} <span class="num">× ${it.qty}</span>`).join('<br>')}</div>
    <div class="osum">${amd(sum)}</div>
    ${side==='shop' ? orderTracker(o.status) : ''}
    ${side==='sup' && o.status==='new' ? `<div class="obtns"><button class="btn cyan" onclick="confirmOrder('${o.id}')">✓ ${t('confirm')}</button></div>`:''}
    ${side==='sup' && o.status==='confirmed' ? `<div class="obtns"><button class="btn green" onclick="deliverOrder('${o.id}')">🚚 ${t('deliver')}</button></div>`:''}
  </div>`;
}
function vShopOrders(){
  const mine = S.orders.filter(o=>o.shop.id==='me');
  return `<div class="sec">${t('my_orders')}</div>` + (mine.length ? mine.map(o=>orderCard(o,'shop')).join('') : `<div class="empty"><span class="em">📦</span>${t('no_orders')}</div>`);
}
function vShopDebts(){
  const total = Object.values(S.debts).reduce((a,b)=>a+b,0);
  return `
  <div class="card"><div class="muted">${t('total_debt')}</div><div class="big" style="color:${total?'var(--rose)':'var(--green)'};margin-top:6px">${amd(total)}</div></div>
  ${SUPPLIERS.map(s=>`<div class="card"><div class="row">
    <div><b>${s.em} ${nm(s)}</b><div class="muted" style="margin-top:3px">${t('debts')}</div></div>
    <div style="text-align:right"><div class="num" style="font-weight:600;font-size:15px">${amd(S.debts[s.id]||0)}</div>
    ${S.debts[s.id]?`<button class="btn small" style="margin-top:7px" onclick="payDebt('${s.id}')">${t('pay')}</button>`:''}</div>
  </div></div>`).join('')}`;
}

/* ----- SUPPLIER views ----- */
function vSupDash(){
  const todayOrders = S.orders.filter(o=>o.date===S.today);
  const rev = todayOrders.reduce((a,o)=>a+o.items.reduce((x,i)=>x+i.qty*i.price,0),0);
  const alerts = supAlerts();
  return `
  <div class="sec">${t('dash')}</div>
  <div class="kpis">
    <div class="kpi"><div class="l">📥 ${t('orders_today')}</div><div class="v">${todayOrders.length}</div></div>
    <div class="kpi"><div class="l">💰 ${t('revenue_today')}</div><div class="v" style="font-size:16px;color:var(--gold2)">${amd(rev)}</div></div>
    <div class="kpi"><div class="l">🏪 ${t('active_shops')}</div><div class="v">${OTHER_SHOPS.length+1}</div></div>
    <div class="kpi"><div class="l">🔔 ${t('alerts_n')}</div><div class="v" style="color:${alerts.length?'var(--rose)':'var(--green)'}">${alerts.length}</div></div>
  </div>
  <div class="sec">${t('sup_orders_today')}</div>
  ${todayOrders.length ? todayOrders.map(o=>orderCard(o,'sup')).join('') : `<div class="card"><div class="empty">${t('inbox_empty')}</div></div>`}
  ${alerts.length?`<div class="sec">${t('alerts')}</div>`+alerts.slice(0,2).map(alertCard).join('')+`<button class="btn ghost full" onclick="paneTab('${curRole}','alerts')">${t('alerts')} →</button>`:''}
  <div style="margin-top:20px;text-align:center"><button class="btn small danger" onclick="resetDemo()">↺ ${t('reset')}</button></div>`;
}
function vSupInbox(){
  const list = S.orders.filter(o=>o.status!=='delivered');
  const done = S.orders.filter(o=>o.status==='delivered');
  return `<div class="sec">${t('inbox')} (${list.length})</div>`
    + (list.length ? list.map(o=>orderCard(o,'sup')).join('') : `<div class="card"><div class="empty">${t('inbox_empty')}</div></div>`)
    + (done.length?`<div class="sec">${t('st_delivered')}</div>`+done.slice(0,6).map(o=>orderCard(o,'sup')).join(''):'');
}
function shopRow(shop, sub, badge){
  return `<div class="shoprow" onclick="openShop('${shop.id}')">
    <div class="shopav">${nm(shop).replace(/[«»]/g,'').trim()[0]}</div>
    <div class="info" style="flex:1"><div style="font-weight:600;font-size:14px">${nm(shop)}</div><div class="muted" style="margin-top:2px">${sub}</div></div>
    ${badge}
  </div>`;
}
function vSupShops(){
  const myLast = Math.max(...S.history.map(h=>h.date), 0);
  const rows = [
    shopRow(MY_SHOP, `${t('last_order')}՝ ${fdate(myLast)}`, `<span class="badge b-green">${t('ok_status')}</span>`),
    ...OTHER_SHOPS.map((o)=>{
      const last = S.otherLast[o.id]; const ago = daysAgo(last);
      const b = o.id==='o3' ? `<span class="badge b-rose">${ago} ${lang==='hy'?'օր լռություն':'days silent'}</span>`
        : ago>3 ? `<span class="badge b-gold">${ago} ${lang==='hy'?'օր':'d'}</span>` : `<span class="badge b-green">${t('ok_status')}</span>`;
      return shopRow(o, `${t('last_order')}՝ ${fdate(last)}`, b);
    })
  ].join('');
  return `<div class="sec">${t('shops')} (${OTHER_SHOPS.length+1})</div><div class="card">${rows}</div>`;
}
function alertCard(a){
  const isChurn = a.type==='churn';
  const txt = isChurn
    ? `${nm(a.shop)} — ${nm(a.p)} · ${t('churn')} (${daysAgo(a.st.last)} ${lang==='hy'?'օր':'days'})`
    : `${nm(a.shop)} — ${nm(a.p)} · ${t('overdue_alert')} (${-a.st.dueIn} ${lang==='hy'?'օր':'days'})`;
  return `<div class="alert ${isChurn?'bad':''}">
    <div class="t">${isChurn?'🚨':'⏰'} ${txt}</div>
    <div class="d">${t('cycle')}՝ ${t('every')} ${a.st.cycle} ${t('days')} · ${t('avg_qty')}՝ ${a.st.avgQty}</div>
    <div class="act"><button class="btn small violet" onclick="remind('${a.shop.id}','${a.p.id}','${a.type}')">📨 ${t('remind')}</button></div>
  </div>`;
}
function vSupAlerts(){
  const alerts = supAlerts();
  return `<div class="sec">${t('alerts')} (${alerts.length})</div>` +
    (alerts.length ? alerts.map(alertCard).join('') : `<div class="card"><div class="empty"><span class="em">✅</span>${t('all_ok')}</div></div>`);
}
function vSupCatalog(){
  return `<div class="sec">${t('catalog_sup')}</div>` +
    SUPPLIERS.map(s=>`<div class="card"><h3>${s.em} ${nm(s)}</h3>` +
      PRODUCTS.filter(p=>p.sup===s.id).map(p=>`<div class="sug">
        <div class="pav">${p.em}</div>
        <div class="info"><div class="nm">${nm(p)}</div><div class="sub">${p.promo?`<span class="badge b-violet">${t('promo')}</span>`:''}</div></div>
        <b class="num" style="color:var(--gold2)">${p.price.toLocaleString('en-US')} ֏</b>
      </div>`).join('') + `</div>`
    ).join('');
}
function openShop(id){
  const shop = id==='me' ? MY_SHOP : OTHER_SHOPS.find(o=>o.id===id);
  let body = '';
  if(id==='me'){
    body = `<table class="tbl"><tr><th>${t('product')}</th><th>${t('cycle')}</th><th>${t('avg_qty')}</th><th>${t('next_due')}</th></tr>` +
      PRODUCTS.map(p=>{const st=stats(p.id); if(!st) return '';
        const cls = st.dueIn<0?'style="color:var(--rose);font-weight:700"':'';
        return `<tr><td>${nm(p)}</td><td class="num">${st.cycle} ${lang==='hy'?'օր':'d'}</td><td class="num">${st.avgQty}</td><td ${cls}>${st.dueIn<0?(t('overdue')+' '+(-st.dueIn)+(lang==='hy'?' օր':'d')):fdate(st.due)}</td></tr>`;}).join('') + '</table>';
  } else {
    body = `<div class="muted">${t('last_order')}՝ ${fdate(S.otherLast[id])} (${daysAgo(S.otherLast[id])} ${lang==='hy'?'օր առաջ':'days ago'})</div>
    <div class="muted" style="margin-top:8px">${lang==='hy'?'Դեմո խանութ — մանրամասն պատմությունը հասանելի է միայն ձեր խանութի համար։':'Demo shop — detailed history is available for your own shop only.'}</div>`;
  }
  document.getElementById('modalRoot').innerHTML = `<div class="modal" onclick="if(event.target===this)closeModal()">
    <div class="mbody"><div class="grabber"></div><h3>${nm(shop)}</h3><div class="muted">${t('shop_detail')}</div>${body}
    <button class="btn primary" style="margin-top:16px" onclick="closeModal()">${t('close')}</button></div></div>`;
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
window.remind = function(shopId, pId, type){ remindFix(shopId + '_' + pId + '_' + type); };

let rt=null;
window.addEventListener('resize', ()=>{ clearTimeout(rt); rt=setTimeout(renderAll,150); });
renderAll();
</script>
</body>
</html>
