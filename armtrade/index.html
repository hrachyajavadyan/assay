<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF">
<title>ArmTrade — Prototype</title>
<style>
:root{
  --bg:#F6F7F9; --card:#FFFFFF; --ink:#0F172A; --muted:#64748B; --line:#EAECF0;
  --brand:#4F46E5; --brand-soft:#EEF0FE; --brand-grad:linear-gradient(135deg,#4F46E5,#7C6FF2);
  --ok:#16A34A; --ok-soft:#E9F9EF; --warn:#B45309; --warn-soft:#FEF3E2; --bad:#DC2626; --bad-soft:#FDECEC;
  --info:#0284C7; --info-soft:#E7F4FB;
  --r:18px; --r-sm:12px;
  --sh:0 1px 2px rgba(15,23,42,.04), 0 4px 16px rgba(15,23,42,.06);
  --sh-lg:0 8px 30px rgba(79,70,229,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,"Noto Sans Armenian",sans-serif;font-size:16px;
  -webkit-font-smoothing:antialiased}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.86);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 16px 12px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:640px;margin:0 auto}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;letter-spacing:-.2px}
.logomark{width:34px;height:34px;border-radius:11px;background:var(--brand-grad);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;box-shadow:var(--sh-lg)}
.logo small{display:block;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:0;margin-top:1px}
.hbtns{display:flex;gap:8px;align-items:center}
.langsw{font-size:12px;font-weight:700;background:#fff;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:7px 10px;cursor:pointer;transition:.15s}
.daybtn{background:var(--brand-grad);border:none;color:#fff;border-radius:12px;padding:8px 13px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:var(--sh-lg);transition:transform .15s}
.daybtn:active{transform:scale(.94)}
.subrow{max-width:640px;margin:10px auto 0;display:flex;align-items:center;gap:10px}
.datechip{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.roleswitch{flex:1;display:flex;background:#EEF0F3;border-radius:13px;padding:3px}
.roleswitch button{flex:1;border:none;background:transparent;color:var(--muted);padding:9px 6px;border-radius:10px;font-size:13.5px;font-weight:700;cursor:pointer;transition:.18s}
.roleswitch button.active{background:#fff;color:var(--brand);box-shadow:0 1px 4px rgba(15,23,42,.10)}

/* ---------- layout ---------- */
main{padding:16px;max-width:640px;margin:0 auto;animation:fadeUp .28s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.card h3{margin:0 0 10px;font-size:15px;letter-spacing:-.2px}
.sec{margin:20px 4px 10px;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.9px}
.sec:first-child{margin-top:4px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted);font-size:12.5px;line-height:1.5}
.big{font-size:24px;font-weight:800;letter-spacing:-.5px}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;font-size:10.5px;font-weight:700;letter-spacing:.1px}
.b-ok{background:var(--ok-soft);color:var(--ok)} .b-warn{background:var(--warn-soft);color:var(--warn)}
.b-bad{background:var(--bad-soft);color:var(--bad)} .b-info{background:var(--info-soft);color:var(--info)}
.b-neutral{background:#F1F3F6;color:var(--muted)}
button.primary{width:100%;background:var(--brand-grad);color:#fff;border:none;border-radius:15px;padding:16px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:var(--sh-lg);transition:transform .15s;letter-spacing:-.2px}
button.primary:active{transform:scale(.98)}
button.ghost{background:var(--brand-soft);color:var(--brand);border:none;border-radius:12px;padding:11px 14px;font-size:13.5px;font-weight:700;cursor:pointer;transition:.15s}
button.ghost:active{transform:scale(.96)}
button.small{background:#F1F3F6;color:var(--ink);border:none;border-radius:10px;padding:8px 12px;font-size:12.5px;font-weight:700;cursor:pointer;transition:.15s}
button.small:active{transform:scale(.95)}
button.danger{background:var(--bad-soft);color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:6px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.kpi .v{font-size:23px;font-weight:800;margin-top:4px;letter-spacing:-.5px}
.kpi .l{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}

/* ---------- bottom nav ---------- */
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;z-index:60;padding:6px 8px calc(6px + env(safe-area-inset-bottom));max-width:100%}
nav button{flex:1;border:none;background:none;padding:7px 2px;font-size:10px;color:var(--muted);cursor:pointer;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:12px;transition:.15s;position:relative}
nav button.active{color:var(--brand)}
nav button.active .icw{background:var(--brand-soft)}
nav .icw{width:44px;height:28px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-size:18px;transition:.15s}
.navbadge{position:absolute;top:0;left:calc(50% + 6px);background:#F43F5E;color:#fff;font-size:9.5px;font-weight:800;border-radius:99px;padding:1.5px 6px;box-shadow:0 1px 4px rgba(244,63,94,.4)}

/* ---------- product rows ---------- */
.sug{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.sug:last-child{border-bottom:none;padding-bottom:4px}
.sug:first-child{padding-top:2px}
.pav{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:23px;flex-shrink:0;background:#F4F5F8;border:1px solid var(--line)}
.sug .info{flex:1;min-width:0}
.sug .nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.1px}
.sug .sub{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.qtyctl{display:flex;align-items:center;gap:2px;background:#F1F3F6;border-radius:11px;padding:3px}
.qtyctl button{width:30px;height:30px;border-radius:9px;border:none;background:transparent;color:var(--brand);font-size:18px;font-weight:800;cursor:pointer;transition:.12s}
.qtyctl button:active{background:#fff;transform:scale(.92)}
.qtyctl span{min-width:28px;text-align:center;font-weight:800;font-size:15px}
.addbtn{background:var(--brand);color:#fff;border:none;border-radius:11px;padding:9px 13px;font-weight:700;font-size:12.5px;cursor:pointer;transition:.15s;width:100%}
.addbtn:active{transform:scale(.95)}
.addbtn.added{background:var(--ok)}

/* ---------- search & chips ---------- */
.search{width:100%;padding:13px 16px;border:1px solid var(--line);border-radius:14px;font-size:15px;background:#fff;margin-bottom:12px;box-shadow:var(--sh);outline:none;transition:.15s}
.search:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{white-space:nowrap;background:#fff;border:1px solid var(--line);border-radius:99px;padding:8px 15px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;transition:.15s;box-shadow:var(--sh)}
.chips button.active{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:var(--sh-lg)}

/* ---------- orders ---------- */
.order{border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:12px;background:#fff;box-shadow:var(--sh)}
.order .oh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.oitems{font-size:12.5px;color:var(--muted);line-height:1.7}
.osum{font-weight:800;margin-top:8px;font-size:15px;letter-spacing:-.2px}
.obtns{display:flex;gap:10px;margin-top:12px}
.obtns button{flex:1}

/* ---------- supplier shop list ---------- */
.shoprow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}
.shoprow:last-child{border-bottom:none}
.shopav{width:42px;height:42px;border-radius:14px;background:var(--brand-soft);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--brand);font-size:15px;flex-shrink:0}

/* ---------- alerts ---------- */
.alert{border:1px solid #F3E3C3;background:linear-gradient(180deg,#FFFBF3,#FFF7E8);border-radius:var(--r);padding:14px 15px;margin-bottom:11px;box-shadow:var(--sh)}
.alert.bad{border-color:#F5CFCF;background:linear-gradient(180deg,#FFF5F5,#FDEDED)}
.alert .t{font-weight:700;font-size:13.5px;line-height:1.45}
.alert .d{font-size:12px;color:var(--muted);margin-top:4px}
.alert .act{margin-top:10px;display:flex;gap:8px}

/* ---------- toast & modal ---------- */
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(8px);bottom:calc(100px + env(safe-area-inset-bottom));background:#0F172A;color:#fff;padding:12px 20px;border-radius:14px;font-size:13.5px;font-weight:600;z-index:100;opacity:0;transition:.28s;pointer-events:none;max-width:88%;text-align:center;box-shadow:0 8px 30px rgba(15,23,42,.3)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.44);z-index:90;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.mbody{background:#fff;width:100%;max-width:640px;border-radius:24px 24px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));max-height:84vh;overflow-y:auto;animation:slideUp .28s cubic-bezier(.2,.9,.3,1)}
@keyframes slideUp{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.grabber{width:40px;height:4px;border-radius:99px;background:var(--line);margin:6px auto 14px}
.mbody h3{margin:0 0 4px;font-size:18px;letter-spacing:-.3px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px}
.tbl th{text-align:left;color:var(--muted);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:7px 5px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 5px;border-bottom:1px solid var(--line)}
.footer-note{text-align:center;color:#A6AFBB;font-size:11px;margin:20px 0 6px}
.empty{color:var(--muted);text-align:center;padding:32px 12px;font-size:13.5px}
.empty .em{font-size:34px;display:block;margin-bottom:8px}
.notice{background:var(--brand-soft);border:1px solid #DFE2FC;border-radius:var(--r);padding:13px 15px;margin-bottom:14px;font-size:12.5px;color:#4338CA;line-height:1.55}
hr.sep{border:none;border-top:1px solid var(--line);margin:12px 0}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="logo"><div class="logomark">🔄</div><div>ArmTrade<small id="roleTag"></small></div></div>
    <div class="hbtns">
      <button class="langsw" id="langBtn" onclick="toggleLang()">EN</button>
      <button class="daybtn" id="dayBtn" onclick="advanceDay()">⏭</button>
    </div>
  </div>
  <div class="subrow">
    <div class="roleswitch">
      <button id="rshop" onclick="setRole('shop')"></button>
      <button id="rsup" onclick="setRole('supplier')"></button>
    </div>
    <div class="datechip" id="dateChip"></div>
  </div>
</header>

<main id="main"></main>
<nav id="nav"></nav>
<div id="toast"></div>
<div id="modalRoot"></div>

<script>
/* ArmTrade prototype v2 — two-sided replenishment demo (clean light redesign) */

// ---------- i18n ----------

    suggested:'Առաջարկվում է', pcs:'հատ', reset:'Վերսկսել դեմոն', reset_done:'Դեմոն վերսկսվեց',
    delivered_msg:'Նշվեց առաքված — կմտնի պատմության մեջ',

  }
};
let lang = 'hy';
const t = k => T[lang][k];

// ---------- demo data ----------
const DAY = 86400000;
const START = new Date('2026-08-05T09:00:00').getTime();

const SUPPLIERS = [
  {id:'s1', name:'Ակվա Դիստրիբյուշն', nameEn:'Aqua Distribution', em:'💧', tint:'#E7F4FB'},
  {id:'s2', name:'Կաթնաղբյուր', nameEn:'Katnaghbyur Dairy', em:'🥛', tint:'#FEF3E2'},
  {id:'s3', name:'Շանթ Թրեյդ', nameEn:'Shant Trade', em:'🍫', tint:'#F2EBFE'},
];
const PRODUCTS = [
  {id:'p1', sup:'s1', name:'Ջերմուկ 0.5լ (12 հատ)', nameEn:'Jermuk 0.5L (12-pack)', price:1450, em:'💧', cycle:6,  qty:4},
  {id:'p2', sup:'s1', name:'Կոկա-Կոլա 1.5լ (6 հատ)', nameEn:'Coca-Cola 1.5L (6-pack)', price:3200, em:'🥤', cycle:5,  qty:3},
  {id:'p3', sup:'s1', name:'Հյութ Yan 1լ (8 հատ)', nameEn:'Yan Juice 1L (8-pack)', price:4800, em:'🧃', cycle:9,  qty:2},
  {id:'p4', sup:'s2', name:'Մածուն 1կգ', nameEn:'Matsun 1kg', price:750, em:'🥛', cycle:3,  qty:10, promo:true},
  {id:'p5', sup:'s2', name:'Պանիր Լոռի 1կգ', nameEn:'Lori Cheese 1kg', price:2900, em:'🧀', cycle:5,  qty:4},

  {id:'p9', sup:'s3', name:'Լվացող միջոց 1լ', nameEn:'Detergent 1L', price:1800, em:'🧴', cycle:14, qty:3},

const OTHER_SHOPS = [
  {id:'o1', name:'Մինի Մարկետ Կոմիտաս', nameEn:'Mini Market Komitas'},
  {id:'o2', name:'Խանութ Արաբկիր 23', nameEn:'Shop Arabkir 23'},
  {id:'o3', name:'Նուռ Մարկետ', nameEn:'Nur Market'},
  {id:'o4', name:'Սուպերմարկետ Էրեբունի', nameEn:'Supermarket Erebuni'},
  {id:'o5', name:'Խանութ Դավթաշեն', nameEn:'Shop Davtashen'},
];
const MY_SHOP = {id:'me', name:'Խանութ «Նռան այգի»', nameEn:'Shop "Nran Aygi"'};

// ---------- state ----------
let S = null;
function freshState(){
  const st = {today: START, role:'shop', tab:'home', basket:{}, orders:[], history:[], debts:{}, reminded:{}, dismissed:{}, otherLast:{}, seq:1};
  PRODUCTS.forEach(p=>{
    let d = START - 62*DAY + Math.floor(Math.random()*p.cycle)*DAY;
    while(d < START - p.cycle*DAY*0.3){
      const qty = Math.max(1, p.qty + Math.floor(Math.random()*3)-1);
      st.history.push({date:d, productId:p.id, sup:p.sup, qty, price:p.price});
      d += (p.cycle + Math.floor(Math.random()*3)-1)*DAY;
    }
  });
  st.history = st.history.filter(h=>!(h.productId==='p7' && h.date > START-19*DAY));
  st.debts = {s1: 78500, s2: 42300, s3: 0};
  OTHER_SHOPS.forEach((o,i)=>{ st.otherLast[o.id] = START - (i===2? 12 : (1+i%4))*DAY; });
  return st;
}
function save(){ try{ localStorage.setItem('armtrade_proto_v2', JSON.stringify(S)); }catch(e){} }
function load(){ try{ const x = localStorage.getItem('armtrade_proto_v2'); if(x) return JSON.parse(x); }catch(e){} return null; }
S = load() || freshState();

// ---------- helpers ----------
const P = id => PRODUCTS.find(p=>p.id===id);
const SUP = id => SUPPLIERS.find(s=>s.id===id);
const nm = o => lang==='hy' ? o.name : o.nameEn;
const amd = n => n.toLocaleString('en-US') + ' ֏';
function fdate(ts){ const d = new Date(ts); const m = lang==='hy'
  ? ['հնվ','փտվ','մրտ','ապր','մյս','հնս','հլս','օգս','սեպ','հոկ','նոյ','դեկ']
  : ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return d.getDate() + ' ' + m[d.getMonth()]; }
function daysAgo(ts){ return Math.round((S.today - ts)/DAY); }
function toast(msg){ const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove('show'), 2200); }

function stats(pid){
  const h = S.history.filter(x=>x.productId===pid).sort((a,b)=>a.date-b.date);
  if(!h.length) return null;
  const gaps = []; for(let i=1;i<h.length;i++) gaps.push((h[i].date-h[i-1].date)/DAY);
  gaps.sort((a,b)=>a-b);
  const cycle = gaps.length ? Math.max(2, Math.round(gaps[Math.floor(gaps.length/2)])) : P(pid).cycle;
  const avgQty = Math.round(h.slice(-5).reduce((a,x)=>a+x.qty,0)/Math.min(5,h.length));
  const last = h[h.length-1].date;
  const due = last + cycle*DAY;
  const dueIn = Math.ceil((due - S.today)/DAY);
  return {cycle, avgQty, last, due, dueIn, count:h.length};
}
function suggestions(){
  return PRODUCTS.map(p=>({p, st:stats(p.id)}))
    .filter(x=>x.st && x.st.dueIn <= 1 && !S.dismissed[x.p.id])
    .sort((a,b)=>a.st.dueIn - b.st.dueIn);
}
function supAlerts(){
  const out = [];
  PRODUCTS.forEach(p=>{
    const st = stats(p.id); if(!st) return;
    const overdueDays = -st.dueIn;
    if(overdueDays >= st.cycle*2) out.push({type:'churn', p, st, shop:MY_SHOP});
    else if(overdueDays >= Math.max(2, Math.round(st.cycle*0.6))) out.push({type:'overdue', p, st, shop:MY_SHOP});
  });
  out.push({type:'churn', p:P('p2'), st:{cycle:4, dueIn:-9, avgQty:5, last:S.otherLast['o3']}, shop:OTHER_SHOPS[2], other:true});
  return out.filter(a=>!S.reminded[alertKey(a)]);
}
const alertKey = a => a.shop.id + '_' + a.p.id + '_' + a.type;

// ---------- actions ----------
function setRole(r){ S.role = r; S.tab = r==='shop' ? 'home' : 'dash'; save(); render(); }
function setTab(tb){ S.tab = tb; save(); render(); window.scrollTo(0,0); }
function toggleLang(){ lang = lang==='hy' ? 'en' : 'hy'; document.getElementById('langBtn').textContent = lang==='hy' ? 'EN' : 'ՀԱՅ'; render(); }
function addToBasket(pid, qty){ S.basket[pid] = (S.basket[pid]||0) + qty; save(); render(); }
function setBasketQty(pid, qty){ if(qty<=0) delete S.basket[pid]; else S.basket[pid]=qty; save(); render(); }
function dismissSug(pid){ S.dismissed[pid] = true; save(); render(); }

function submitBasket(){
  const bySup = {};
  Object.entries(S.basket).forEach(([pid,qty])=>{ const p = P(pid); (bySup[p.sup] = bySup[p.sup]||[]).push({productId:pid, qty, price:p.price}); });
  const n = Object.keys(bySup).length; if(!n) return;
  Object.entries(bySup).forEach(([sup,items])=>{
    S.orders.unshift({id:'ORD-'+(S.seq++), date:S.today, shop:MY_SHOP, sup, items, status:'new'});
  });
  S.basket = {}; S.dismissed = {};
  save(); toast(n + ' ' + t('order_placed')); setTab('orders');
}
function confirmOrder(oid){ const o = S.orders.find(x=>x.id===oid); if(o){ o.status='confirmed'; save(); toast(t('confirmed_msg')); render(); } }
function deliverOrder(oid){
  const o = S.orders.find(x=>x.id===oid); if(!o) return;
  o.status='delivered';
  if(o.shop.id==='me'){
    o.items.forEach(it=>S.history.push({date:S.today, productId:it.productId, sup:o.sup, qty:it.qty, price:it.price}));
    const sum = o.items.reduce((a,x)=>a+x.qty*x.price,0);
    S.debts[o.sup] = (S.debts[o.sup]||0) + sum;
  }
  save(); toast(t('delivered_msg')); render();
}
function remindFix(k){ S.reminded[k]=true; save(); toast(t('reminded')); render(); }
function payDebt(sup){ S.debts[sup] = 0; save(); toast(t('paid')); render(); }
function resetDemo(){ S = freshState(); save(); toast(t('reset_done')); render(); }

function advanceDay(){
  S.today += DAY;
  if(Math.random() < 0.75){
    const shop = OTHER_SHOPS[Math.floor(Math.random()*OTHER_SHOPS.length)];
    if(shop.id!=='o3'){
      const sup = ['s1','s2','s3'][Math.floor(Math.random()*3)];
      const pool = PRODUCTS.filter(p=>p.sup===sup);
      const items = pool.slice(0, 1+Math.floor(Math.random()*pool.length)).map(p=>({productId:p.id, qty:Math.max(1,p.qty+Math.floor(Math.random()*3)-1), price:p.price}));
      S.orders.unshift({id:'ORD-'+(S.seq++), date:S.today, shop, sup, items, status:'new'});
      S.otherLast[shop.id] = S.today;
    }
  }
  save(); toast(t('day_advanced') + ' ' + fdate(S.today)); render();
}

function statusBadge(st){ const m = {new:['b-info',t('st_new')], confirmed:['b-warn',t('st_confirmed')], delivered:['b-ok',t('st_delivered')]}; return `<span class="badge ${m[st][0]}">${m[st][1]}</span>`; }

function render(){

  document.getElementById('dateChip').textContent = fdate(S.today) + ' 2026';

  el.style.animation='none'; void el.offsetWidth; el.style.animation='';

}

function renderNav(){
  const nav = document.getElementById('nav');

    ? [['home','📋'],['catalog','🛒'],['basket','🧺',basketN],['orders','📦'],['debts','💳']]

// ----- SHOP views -----
function sugCard(x){
  const {p, st} = x;
  const inB = S.basket[p.id];
  let badge = '';
  if(st){
    if(st.dueIn < 0) badge = `<span class="badge b-bad">${t('overdue')} ${-st.dueIn} ${lang==='hy'?'օր':'d'}</span>`;
    else if(st.dueIn === 0) badge = `<span class="badge b-warn">${t('due_today')}</span>`;
    else badge = `<span class="badge b-neutral">${st.dueIn} ${t('due_in')}</span>`;
  }
  const qty = inB || (st ? st.avgQty : p.qty);
  const sup = SUP(p.sup);
  return `<div class="sug">
    <div class="pav" style="background:${sup.tint}">${p.em}</div>
    <div class="info">
      <div class="nm">${nm(p)}</div>
      <div class="sub">${sup.em} ${nm(sup)} · <b>${amd(p.price)}</b>${p.promo?` <span class="badge b-warn">${t('promo')} −10%</span>`:''}</div>
      <div class="sub">${st?`${t('every')} ${st.cycle} ${t('days')} · ${t('last_order')}՝ ${fdate(st.last)}`:''} ${badge}</div>
    </div>
    <div style="text-align:right;min-width:96px">
      <div class="qtyctl">
        <button onclick="setBasketQty('${p.id}', ${Math.max(0,qty-1)})">−</button><span>${qty}</span>

      <button class="addbtn ${inB?'added':''}" style="margin-top:7px" onclick="addToBasket('${p.id}', ${inB?0:qty})">${inB?t('added'):t('add')}</button>

}

function vShopBasket(){
  const ids = Object.keys(S.basket);
  if(!ids.length) return `<div class="empty"><span class="em">🧺</span>${t('basket_empty')}</div>`;
  const bySup = {};
  ids.forEach(pid=>{ (bySup[P(pid).sup] = bySup[P(pid).sup]||[]).push(pid); });
  let total = 0;
  const html = Object.entries(bySup).map(([sup, pids])=>{
    const sum = pids.reduce((a,pid)=>a + S.basket[pid]*P(pid).price, 0); total += sum;
    return `<div class="card">
      <h3>${SUP(sup).em} ${nm(SUP(sup))}</h3>
      ${pids.map(pid=>{const p=P(pid);return `<div class="sug">

        <div class="info"><div class="nm">${nm(p)}</div><div class="sub">${amd(p.price)}</div></div>

          <button onclick="setBasketQty('${pid}', ${S.basket[pid]-1})">−</button><span>${S.basket[pid]}</span>

        </div></div>`;}).join('')}
      <div class="osum">${t('sum')}՝ ${amd(sum)}</div>
    </div>`;
  }).join('');
  return html + `

      PRODUCTS.filter(p=>p.sup===s.id).map(p=>`<div class="sug">
        <div class="pav" style="background:${s.tint}">${p.em}</div>
        <div class="info"><div class="nm">${nm(p)}</div><div class="sub">${p.promo?`<span class="badge b-warn">${t('promo')}</span>`:''}</div></div>
        <b>${amd(p.price)}</b>
      </div>`).join('')
    ).join('<hr class="sep">') + `</div>`;
}

function openShop(id){
  const shop = id==='me' ? MY_SHOP : OTHER_SHOPS.find(o=>o.id===id);
  let body = '';
  if(id==='me'){
    body = `<table class="tbl"><tr><th>${t('product')}</th><th>${t('cycle')}</th><th>${t('avg_qty')}</th><th>${t('next_due')}</th></tr>` +
      PRODUCTS.map(p=>{const st=stats(p.id); if(!st) return '';
        const cls = st.dueIn<0?'style="color:var(--bad);font-weight:700"':'';
        return `<tr><td>${nm(p)}</td><td>${st.cycle} ${lang==='hy'?'օր':'d'}</td><td>${st.avgQty}</td><td ${cls}>${st.dueIn<0?(t('overdue')+' '+(-st.dueIn)+(lang==='hy'?' օր':'d')):fdate(st.due)}</td></tr>`;}).join('') + '</table>';
  } else {
    body = `<div class="muted">${t('last_order')}՝ ${fdate(S.otherLast[id])} (${daysAgo(S.otherLast[id])} ${lang==='hy'?'օր առաջ':'days ago'})</div>
    <div class="muted" style="margin-top:8px">${lang==='hy'?'Դեմո խանութ — մանրամասն պատմությունը հասանելի է միայն ձեր խանութի համար։':'Demo shop — detailed history is available for your own shop only.'}</div>`;
  }
  document.getElementById('modalRoot').innerHTML = `<div class="modal" onclick="if(event.target===this)closeModal()">
    <div class="mbody"><div class="grabber"></div><h3>${nm(shop)}</h3><div class="muted">${t('shop_detail')}</div>${body}
    <button class="primary" style="margin-top:16px" onclick="closeModal()">${t('close')}</button></div></div>`;
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

window.remind = function(a){ remindFix(a.shop.id + '_' + a.p.id + '_' + a.type); };

render();
</script>
</body>
</html>
