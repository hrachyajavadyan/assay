    <button class="btn ghost full" style="margin-top:9px" onclick="closeModal()">${t('close')}</button></div></div>`;
}
function sendReq(){
  const pid = REQUI && REQUI.pid; if(!pid || !P(pid)) return;
  if(openReqs().some(r=>r.pid===pid)){ toast(t('req_dup')); return; }
  const have = Math.max(0, onHand(pid));
  if(have<=0){ toast(t('wo_nostock')); return; }
  const q = Math.max(1, Math.min(have, Math.floor(+REQUI.qty||1)));
  if(!Array.isArray(S.swapReqs)) S.swapReqs = [];
  S.swapSeq = (+S.swapSeq||0) + 1;
  const nb = nearestExpOf(pid);
  S.swapReqs.push({id:'REQ-'+S.swapSeq, pid, sup:(P(pid)||{}).sup||'s1', qty:q, kind:REQUI.kind,
                   days: nb ? expDaysLeft(nb) : null, date:S.today, status:'open', reply:'', rdate:0});
  logEv('req', {pid, qty:q, rid:'REQ-'+S.swapSeq});
  REQUI = {pid:null, kind:'exp', qty:1};
  closeModal(); toastSaved(saveD(), '📨 '+t('req_sent')); renderAll();
}
function supReply(reqId, reply){
  const r = (S.swapReqs||[]).find(x=>x && x.id===reqId); if(!r) return;
  if(['swap','back','no'].indexOf(reply) < 0) return;
  r.reply = reply; r.rdate = S.today;
  r.status = reply==='no' ? 'closed' : 'open';   // swap/back stay open: the SHOP still has to act
  logEv('req_reply', {pid:r.pid, reply, rid:r.id});
  toastSaved(saveD(), t('req_r_'+reply)); renderAll();
}
/* The only new stock-moving path in F3, and it reuses confirmReceipt()'s adjusting-invoice
   pattern exactly, so Պարտքեր and the Համեմատման ակտ stay reconciled to the dram. */
function shopReturnToSup(reqId){
  const r = (S.swapReqs||[]).find(x=>x && x.id===reqId); if(!r) return;
  if(r.reply!=='swap' && r.reply!=='back') return;
  const pid = r.pid;
  const q = Math.min(Math.max(0, Math.floor(+r.qty||0)), Math.max(0, onHand(pid)));
  if(q<=0){ r.status='closed'; toastSaved(saveD(), t('wo_nostock')); renderAll(); return; }
  const c = costOf(pid);
  postMove({pid, type:'return', dq:-q, cost:c, ref:r.id, actor:'shop'});
  const sum = q*c;
  S.bills.push({id:newId('ADJ-'), sup:r.sup, date:S.today, amount:-sum, adj:true, paid:true, paidDate:S.today,
                ref:r.id, items:[{productId:pid, qty:-q, price:c}]});
  r.status = 'closed';
  logEv('ret', {oid:r.id});
  checkStockouts();
  toastSaved(saveD(), '↩ '+t('ret_done')); renderAll();
}
/* R8 · THE trust tripwire, and it was half-installed. openShop('me') gates this exact data on an
   open «📨 Հարցնել մատակարարին» request, under a comment naming it as the thing that ends a
   pilot; this card — the more prominent of the two surfaces — rendered the five nearest-expiry
   batches unconditionally, INCLUDING batches already past their date. That contradicts req_privacy
   («Կուղարկվի… — when you ask»), contradicts the first-run card's enumeration of what the
   supplier sees, and hands a third party evidence that the shop is holding food it is prohibited
   from selling under the Food Safety Law art. 9. Now: only SKUs the shop itself asked about, only
   that request's supplier, and never an already-expired batch under any condition. */

  return expRows().all.filter(b=>asked[b.pid] && expDaysLeft(b)!=null && expDaysLeft(b) >= 0).slice()
    .sort((a,b)=>expDaysLeft(a) - expDaysLeft(b));
}

/* ================= R3 · F4 — explainable replenishment =================
   Min-stock + the app's existing velocity model + a light whole-day safety term + the supplier's
   LEARNED lead time. No smoothing, no Croston, no ML — every number here must be sayable out loud
   in one clause, and nothing is ever auto-ordered. */
const MAX_COVER = 21;
let REPQ = {};
function repMedian(a){
  const s = a.slice().sort((x,y)=>x-y);
  if(!s.length) return 0;
  const m = Math.floor(s.length/2);
  return s.length%2 ? s[m] : (s[m-1]+s[m])/2;
}
function leadStats(sup){
  const mine = (S.orders||[]).filter(o=>o && o.shop && o.shop.id==='me' && o.sup===sup && o.status==='delivered')
    .sort((a,b)=>(b.date||0)-(a.date||0)).slice(0,10);
  const ds = []; let ok = 0;
  mine.forEach(o=>{
    /* the DELIVERY, never the shopkeeper's Ընդունում tap: a shop that files its paperwork the
       next morning must not turn a punctual supplier into a late one (and inflate min stock).
       Older orders with no stamp fall back to the previous behaviour rather than crash. */
    const arr = (typeof o.deliveredTs==='number' && isFinite(o.deliveredTs)) ? o.deliveredTs
              : ((o.receipt && o.receipt.ts) ? o.receipt.ts : (o.deliveryDate||0));
    if(!arr || !o.date) return;
    const d = Math.max(1, Math.round((arr - o.date)/DAY));
    if(d > 60) return;
    ds.push(d);
    if(o.deliveryDate && arr <= o.deliveryDate) ok++;
  });
  if(ds.length < 3) return {lead:2, n:ds.length, ok:0, low:true};   // documented fallback
  return {lead: Math.max(1, Math.floor(repMedian(ds))), n:ds.length, ok, low:false};
}
function safetyDaysOf(sup){ const ls = leadStats(sup); return (!ls.low && ls.n && ls.ok/ls.n >= 0.8) ? 1 : 2; }
function orderCycleOf(sup){
  const dates = [...new Set((S.orders||[]).filter(o=>o && o.shop && o.shop.id==='me' && o.sup===sup).map(o=>o.date))].sort((a,b)=>a-b);
  const gaps = []; for(let i=1;i<dates.length;i++) gaps.push((dates[i]-dates[i-1])/DAY);
  if(gaps.length >= 2) return Math.max(2, Math.min(14, Math.round(repMedian(gaps))));
  const cy = PRODUCTS.filter(p=>p.sup===sup).map(p=>{ const s = stats(p.id); return s ? s.cycle : 0; }).filter(x=>x>0);
  if(cy.length) return Math.max(2, Math.min(14, Math.round(repMedian(cy))));
  return 7;
}
/* boxes that are on the way or on the floor but not yet in the ledger — counting them is what
   stops the same shortage being ordered twice */
function onOrderQty(pid){
  let s = 0;
  (S.orders||[]).forEach(o=>{
    if(!o || !o.shop || o.shop.id!=='me') return;
    if(!(o.status==='new' || o.status==='confirmed' || (o.status==='delivered' && !o.receipt))) return;
    (o.items||[]).forEach(it=>{
      if(it.productId!==pid) return;
      s += (o.status==='delivered' && it.delivered!=null) ? it.delivered : it.qty;
    });
  });
  return s;
}
function saleDays14(pid){
  const cut = S.today - 14*DAY;
  const d = {};
  (S.sales||[]).forEach(s=>{ if(s && s.productId===pid && s.date>=cut) d[s.date]=1; });
  return Object.keys(d).length;
}
function minStockOf(pid){
  const u = (S.minStock||{})[pid];
  if(typeof u==='number' && isFinite(u) && u>=0) return {v:Math.floor(u), auto:false};
  const p = P(pid) || {};
  const ls = leadStats(p.sup);
  return {v: Math.max(1, Math.ceil(velOf(pid) * (ls.lead + safetyDaysOf(p.sup)))), auto:true};
}
function setMinStock(pid, v){
  if(!P(pid)) return;
  if(!S.minStock || typeof S.minStock!=='object') S.minStock = {};
  S.minStock[pid] = Math.max(0, Math.min(9999, Math.floor(+v||0)));
  saveD(); renderAll();
  if(ITEMSHEET===pid) openItemSheet(pid);
}
function clearMinStock(pid){

  if(ITEMSHEET===pid) openItemSheet(pid);
}
function velTxt(v){ return v < 1 ? v.toFixed(1) : String(Math.round(v)); }
function replenish(){
  const out = [];
  PRODUCTS.forEach(p=>{
    const pid = p.id;
    if(mdActive(pid)) return;                       // never reorder what you are dumping
    const oo = onOrderQty(pid), oh = onHand(pid), pos = oh + oo;
    const ms = minStockOf(pid);
    if(pos > ms.v) return;                          // the trigger, and the only one
    const ls = leadStats(p.sup), safety = safetyDaysOf(p.sup), cyc = orderCycleOf(p.sup);
    const vel = velOf(pid);
    const cover = Math.min(ls.lead + safety + cyc, MAX_COVER);
    let target = Math.ceil(vel * cover), cap = '';
    const sl = shelfLifeOf(pid);
    if(itemMeta(pid).perishable && sl){
      const fresh = Math.floor(vel * sl * 0.70);    // never order more than can be sold fresh
      if(fresh < target){ target = fresh; cap = 'exp'; }
      else if(cover >= MAX_COVER) cap = 'cover';
    } else if(cover >= MAX_COVER) cap = 'cover';
    const need = target - pos;
    if(need <= 0) return;
    const pack = Math.max(1, +p.pack||1), moq = Math.max(1, +p.moq||1);
    const qty = Math.max(moq, Math.ceil(need/pack)*pack);
    /* pack/MOQ rounding happens AFTER the shelf-life cap and can push straight through it. We do
       not silently order past the cap: the row says so out loud (see repRow). */
    out.push({pid, sup:p.sup, vel, lead:ls.lead, safety, cycle:cyc, cover, target, pos, onHand:oh, onOrder:oo,
      min:ms.v, minAuto:ms.auto, need, qty, pack, moq, cap, shelf:sl,
      after: Math.round((pos+qty)/Math.max(vel, 0.01)),
      dcov: oh/Math.max(vel, 0.01),
      conf: velConf(pid)});
  });
  out.sort((a,b)=>a.dcov - b.dcov);
  /* a hand-edited quantity belongs to the suggestion it was made against — drop every edit whose
     row has left the list, so a stale number can never resurface days later */
  const live = {}; out.forEach(r=>live[r.pid]=1);
  Object.keys(REPQ).forEach(k=>{ if(!live[k]) delete REPQ[k]; });
  return out.slice(0,20);
}
/* the signature of the suggestion an edit was made against */
function repSig(r){ return [r.qty, r.pos, r.min, r.cover].join('|'); }
function repQtyOf(r){
  const e = REPQ[r.pid];
  return (e && typeof e==='object' && e.sig===repSig(r) && isFinite(+e.q)) ? Math.max(r.moq, +e.q) : r.qty;
}
function repAfter(r, q){ return Math.round((r.pos + q)/Math.max(r.vel, 0.01)); }
/* returns the shelf life (days) when the pack/MOQ quantity actually outruns it, else 0 */
function repOverExp(r, q){
  const sl = r.shelf || shelfLifeOf(r.pid);
  return (r.cap==='exp' && sl && repAfter(r, q) > sl) ? sl : 0;
}
/* the after-order cover is recomputed from the quantity CURRENTLY in the stepper — the reason
   line is the whole trust mechanism and must never explain a different number */
/* R4 · MD: four chained clauses wrapped to three lines beside the stepper on the primary daily
   screen. One line, consequence first; the rate and the after-order cover move behind the ⋯
   item card (repReasonFull). */
function repReason(r, q){
  const d = Math.max(0, Math.round(r.dcov));
  return d<=0 ? fmt('rep_why_now',{l:r.lead}) : fmt('rep_why_one',{d, l:r.lead});
}
function repReasonFull(r, q){
  const qq = q==null ? repQtyOf(r) : q;
  return [fmt('rep_why_vel',{v:velTxt(r.vel)}), fmt('rep_why_lead',{n:r.lead}),
          fmt('rep_why_left',{n:Math.max(0, Math.round(r.dcov))}),
          fmt('rep_after',{n:repAfter(r, qq)})].join(' · ');
}
function repQty(pid, d){
  const r = replenish().find(x=>x.pid===pid); if(!r) return;
  const cur = repQtyOf(r);
  REPQ[pid] = {q: Math.max(r.moq, cur + d*Math.max(1, r.pack)), sig: repSig(r)};
  renderAll();
}
function repAdd(pid){
  const r = replenish().find(x=>x.pid===pid);

}
function repAddAll(sup){

function catOf(pid){ return itemMeta(pid).cat || 'house'; }
function catLabel(code){ const k = 'cat_'+code; return T[lang][k] ? t(k) : String(code||''); }
function lastSaleTs(pid){
  let mx = 0;
  (S.sales||[]).forEach(s=>{ if(s && s.productId===pid && (+s.date||0) > mx) mx = +s.date||0; });
  if(!mx) (S.moves||[]).forEach(m=>{ if(m && m.pid===pid && m.type==='sale' && (+m.ts||0) > mx) mx = +m.ts||0; });
  return mx;
}
function daysSinceSale(pid){ const ts = lastSaleTs(pid); return ts ? Math.round((S.today - ts)/DAY) : 999; }
function deadStock(){
  return PRODUCTS.filter(p=>onHand(p.id)>0 && daysSinceSale(p.id)>=60)
    .map(p=>({pid:p.id, amd:onHand(p.id)*costOf(p.id), d:daysSinceSale(p.id), slow:false}))
    .sort((a,b)=>b.amd - a.amd);
}
function slowMovers(){
  return PRODUCTS.filter(p=>onHand(p.id)>0 && daysSinceSale(p.id)<60 && onHand(p.id)/velOf(p.id) > MAX_COVER)
    .map(p=>({pid:p.id, amd:onHand(p.id)*costOf(p.id), d:Math.round(onHand(p.id)/velOf(p.id)), slow:true}))

/* Ranked at PURCHASE price and labelled as such — the app holds no retail price and must never
   imply a margin it does not have. */
function abcRows(){
  const cut = S.today - 84*DAY, agg = {};
  (S.sales||[]).forEach(s=>{ if(!s || s.date < cut) return; agg[s.productId] = (agg[s.productId]||0) + (+s.qty||0); });
  const rows = PRODUCTS.map(p=>({pid:p.id, amd:(agg[p.id]||0)*costOf(p.id)})).sort((a,b)=>b.amd - a.amd);
  const total = rows.reduce((a,r)=>a + r.amd, 0);
  let cum = 0;
  rows.forEach(r=>{
    r.share = total ? r.amd/total*100 : 0;
    cum += r.share; r.cum = cum;
    // with zero turnover there is no A class — classifying the whole catalogue as A is exactly the
    // alert inflation that makes a targeted count worthless
    r.cls = !total ? 'C' : (cum <= 80 ? 'A' : cum <= 95 ? 'B' : 'C');
  });
  rows.total = total;
  return rows;
}
function lowStockRows(){
  return PRODUCTS.map(p=>({pid:p.id, oh:onHand(p.id), min:minStockOf(p.id).v}))
    .filter(r=>r.oh===0 || r.oh <= r.min)
    .map(r=>Object.assign(r, {risk: velOf(r.pid)*costOf(r.pid)}))
    .sort((a,b)=>b.risk - a.risk).slice(0,20);

function shrinkByCat(mk){
  mk = mk || monthKey(S.today);
  const out = {};
  (S.moves||[]).forEach(m=>{
    if(!m || m.type!=='writeoff' || monthKey(m.ts)!==mk) return;
    const c = catOf(m.pid), u = Math.abs(+m.dq||0);
    out[c] = out[c] || {units:0, amd:0, spend:0, pct:0};
    out[c].units += u; out[c].amd += u*(+m.cost||0);
  });
  (S.history||[]).forEach(h=>{
    if(!h || monthKey(h.date)!==mk) return;
    const c = catOf(h.productId);
    if(out[c]) out[c].spend += h.qty*h.price;

  Object.keys(out).forEach(c=>{ out[c].pct = out[c].spend ? out[c].amd/out[c].spend*100 : 0; });

}

/* ================= R2 · F3/F4 — «Գույքագրում»: blind, resumable, non-blocking =================
   MoF order N 102 makes a count a legal act, so it ends in a document, not a screen. Blind by
   default: showing the expected number first is how counts become confirmations of a wrong book. */
let COUNTUI = {review:false, cancelArm:false, q:'', entry:null};
function countScopePids(scope){
  scope = scope || {kind:'all'};
  if(scope.kind==='sup'){
    const ids = PRODUCTS.filter(p=>p.sup===scope.sup).map(p=>p.id);
    return ids.length ? ids : PRODUCTS.map(p=>p.id);   // supplier gone: fall back, never empty
  }
  if(scope.kind==='risk') return countRisk().map(r=>r.pid);
  if(scope.kind==='abc'){
    const ids = abcRows().filter(r=>r.cls==='A').map(r=>r.pid);
    return ids.length ? ids : PRODUCTS.map(p=>p.id);
  }
  if(scope.kind==='cat'){
    const ids = PRODUCTS.filter(p=>catOf(p.id)===scope.key).map(p=>p.id);
    return ids.length ? ids : PRODUCTS.map(p=>p.id);
  }
  return PRODUCTS.map(p=>p.id);
}
// the scope is frozen into the session at start, so progress can never move under the counter
function countScopeList(){
  if(!S.count) return [];
  if(Array.isArray(S.count.pids) && S.count.pids.length) return S.count.pids.filter(pid=>P(pid));
  return countScopePids(S.count.scope);
}
function lastCountTs(pid){
  let mx = 0;
  (S.moves||[]).forEach(m=>{ if(m && m.pid===pid && m.type==='count' && (+m.ts||0) > mx) mx = +m.ts||0; });
  return mx;
}
/* Anti-pattern 4: the daily list is capped at 20 and every row carries a human reason. */
function countRisk(){
  const cut = S.today - 30*DAY, rows = [];
  PRODUCTS.forEach(p=>{
    const pid = p.id; let sc = 0; const why = [];
    if(itemMeta(pid).perishable){ sc += 3; why.push(t('count_reason_perish')); }
    const lc = lastCountTs(pid);
    if(!lc){ sc += 2; why.push(t('count_reason_never')); }
    else { const d = Math.max(0, Math.round((S.today - lc)/DAY));
           if(d > 30){ sc += 2; why.push(d + ' ' + t('count_reason_old')); } }
    if((S.moves||[]).some(m=>m && m.pid===pid && m.type==='writeoff' && (+m.ts||0) >= cut)){ sc += 2; why.push(t('count_reason_wo')); }
    if(stockDays(pid) <= 3){ sc += 2; why.push(t('stockout')); }
    if(velOf(pid) >= 1){ sc += 1; why.push(t('count_reason_fast')); }
    if(sc > 0) rows.push({pid, score:sc, why: why.slice(0,2).join(' · ')});
  });
  rows.sort((a,b)=>b.score - a.score);
  return rows.slice(0,20);
}

function saveCountLine(){

  if(!/^\d+$/.test(s)){ e.err = true; e.errMsg = ''; renderCountEntry(); toast(t('count_qty_req')); return; }
  const n = parseInt(s,10);
  if(!isFinite(n) || n < 0){ e.err = true; renderCountEntry(); toast(t('count_qty_req')); return; }
  /* a գույքագրման ակտ is a legal document and an aisle mistype used to post a count move of
     1e21 straight into the ledger. 999 999 of one SKU is already far past any Armenian shop. */
  if(n > COUNT_QTY_MAX){ e.err = true; e.errMsg = t('count_qty_max'); renderCountEntry(); toast(t('count_qty_max')); return; }
  /* mn is S.moveSeq at the instant the shelf was counted: everything posted AFTER it is known to
     be later than the physical count. Wall-clock is deliberately not used — clocks drift across
     synced devices, S.moveSeq does not. */

     a chain and the code closed the sheet — 27+ taps and a scroll-and-find between every SKU.
     Chain to the next UNCOUNTED item in the current scope, keypad still up. */
  const nx = nextUncounted(cur);

function nextUncounted(afterPid){
  if(!S.count) return null;
  const pids = (S.count.pids && S.count.pids.length) ? S.count.pids : countScopePids(S.count.scope);
  const done = S.count.lines || {};
  const i = pids.indexOf(afterPid);
  const order = i>=0 ? pids.slice(i+1).concat(pids.slice(0, i+1)) : pids;
  return order.find(pid=>done[pid]==null && P(pid)) || null;
}
function skipCountLine(){ COUNTUI.entry = null; closeModal(); renderAll(); }
function movesSince(pid, mn){
  const m0 = +mn||0; let s = 0;
  (S.moves||[]).forEach(m=>{ if(m && m.pid===pid && (+m.n||0) > m0) s += (+m.dq||0); });
  return s;
}
/* Ընդունում / Դուրսգրում / Վաճառք are three distinct legal acts: a line on a signed
   գույքագրման ակտ may not call a goods receipt a sale, so the note names each type it sums. */
function movesSinceByType(pid, mn){
  const m0 = +mn||0, agg = {}, order = [];
  (S.moves||[]).forEach(m=>{
    if(!m || m.pid!==pid || (+m.n||0) <= m0 || !(+m.dq||0)) return;
    const ty = m.type || 'adjust';
    if(agg[ty]==null){ agg[ty]=0; order.push(ty); }
    agg[ty] += (+m.dq||0);
  });
  return order.map(ty=>({type:ty, dq:agg[ty]})).filter(x=>x.dq!==0);
}
function movesSinceLabel(pid, mn){
  const parts = movesSinceByType(pid, mn);
  if(!parts.length) return '';
  return escH(t('count_moved_after')) + VJ() + ' ' +
    parts.map(x=>`${escH(moveLabel(x.type))} ${x.dq>0?'+':''}${x.dq}`).join(' · ');
}
/* book = the on-hand AT THE MOMENT OF COUNTING — which is the figure the act must compare
   against, and what makes a mid-session sale apply ON TOP of the counted figure, not over it. */
function countRows(){
  if(!S.count) return [];
  const rows = [];
  Object.keys(S.count.lines||{}).forEach(pid=>{
    const l = S.count.lines[pid];
    if(!l || !P(pid)) return;
    const after = movesSince(pid, l.mn);
    const book = onHand(pid) - after;
    const counted = +l.counted||0;
    const diff = counted - book;
    const cost = costOf(pid);
    /* every other stock path already refuses to go negative (recordSale, confirmWriteoff, retMax,
       reconcileBatches); the count was the last one that could. The Պակասորդ line still shows the
       full book-vs-fact variance — only the posted move is floored at 0 on-hand. */
    const oh = Math.max(0, onHand(pid));
    const post = Math.max(diff, -oh);
    rows.push({pid, counted, after, book, diff, cost, amd: diff*cost, oh, post, clamped: post!==diff});
  });
  rows.sort((a,b)=>Math.abs(b.amd) - Math.abs(a.amd));
  return rows;
}

function confirmCount(){

  const rows = countRows();
  rows.filter(r=>r.post!==0).forEach(r=>postMove({pid:r.pid, type:'count', dq:r.post,
      cost:r.cost, ref:c.id, reason:'', actor:'shop', note:c.counter}));
  /* NEVER push to S.sales — a correction is not demand and must not move velOf() (same
     discipline as Դուրսգրում, and for the same reason). */
  const surplus = rows.reduce((a,r)=>a + (r.amd>0 ? r.amd : 0), 0);
  const short   = rows.reduce((a,r)=>a + (r.amd<0 ? r.amd : 0), 0);
  const net = surplus + short;
  const skipped = countScopeList().filter(pid=>!(c.lines||{})[pid]);
  const arch = {id:c.id, date:c.date, rts:Date.now(), counter:c.counter,
    scope:{kind:(c.scope||{}).kind||'all', sup:(c.scope||{}).sup||null, key:(c.scope||{}).key||''},
    n:rows.length, surplus:Math.round(surplus), short:Math.round(short), net:Math.round(net),
    lines: rows.map(r=>({pid:r.pid, book:r.book, counted:r.counted, diff:r.diff, cost:r.cost,
                         amd:Math.round(r.amd), after:r.after, posted:r.post})),
    skipped};
  if(!Array.isArray(S.counts)) S.counts = [];

  logEv('count', {id:c.id, n:rows.length, amd:Math.round(net)});

  toastSaved(saveD(), '🧮 '+t('count_done')); renderAll();

/* ================= R8 · sales capture that does not depend on 200 taps a day =================
   Everything downstream — on-hand, days of cover, velocity, min stock, every reason line, the
   expiry money-at-risk figure and the whole supplier console — was derived from ONE input: the
   shopkeeper tapping «Վաճառել» once per unit sold. A 55-year-old running his shop on a paper
   notebook will not do that, and when he stops, the app becomes confidently wrong, which is worse
   than the notebook. Three cheaper paths, in the order he will actually use them:
     1. «📋 Օրվա վաճառք» — one screen, one stepper per SKU, one save, thirty seconds at the till,
        and it can be filled in for YESTERDAY, which is when he will actually do it.
     2. «📥 ՀԴՄ / CSV» — Armenia mandates item-level ՀԴՄ receipts (Tax Code art. 379), so every
        shop with a cash register already produces this data. READING sales is not ISSUING them,
        so this stays clear of the fiscalisation ban and of the do-not-build list. Any file of
        `code,qty[,date]` lines works: an e-HDM export, an Excel sheet, a POS report.
     3. the per-unit «Վաճառել» button, which stays exactly as it was, for the scanner path.
   And when none of them happens, velSource() falls back to Ընդունում + Գույքագրում and every
   screen says so instead of quietly inventing a constant. */
let DAYSALE = null;
function openDaySale(when){
  const day = when==='yesterday' ? S.today - DAY : S.today;

function daySaleDay(which){ if(DAYSALE){ DAYSALE.day = which==='y' ? S.today-DAY : S.today; renderDaySale(); } }
function daySaleQ(pid, d){
  if(!DAYSALE) return;
  const cur = +DAYSALE.q[pid]||0;
  const next = Math.max(0, Math.min(999, cur + d));
  if(next) DAYSALE.q[pid] = next; else delete DAYSALE.q[pid];
  renderDaySale();
}
function daySaleSet(pid, v){
  if(!DAYSALE) return;
  const n = Math.max(0, Math.min(999, Math.floor(+v||0)));
  if(n) DAYSALE.q[pid] = n; else delete DAYSALE.q[pid];
}
function daySaleTotal(){ return Object.values((DAYSALE||{}).q||{}).reduce((a,b)=>a+(+b||0),0); }

function confirmDaySale(){
  const d = DAYSALE; if(!d) return;
  if(tapGuard('daysale')) return;
  let posted = 0, clipped = 0;
  Object.keys(d.q).forEach(pid=>{
    const want = Math.max(0, Math.floor(+d.q[pid]||0));
    if(!want) return;
    const have = onHand(pid);
    const qty = Math.min(want, Math.max(0, have));
    if(qty !== want) clipped++;
    if(qty <= 0) return;
    postMove({pid, type:'sale', dq:-qty, ts:d.day, actor:'shop', reason:'day'});
    S.sales.push({date:d.day, productId:pid, qty});
    posted += qty;
  });

  DAYSALE = null; closeModal();
  checkStockouts();
  toastSaved(saveD(), clipped ? '💵 '+fmt('ds_done_clip',{n:posted, c:clipped}) : '💵 '+fmt('ds_done',{n:posted}));

let SIMPORT = null;

function salesImportFile(input){
  const f = input && input.files && input.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{ try{ parseSalesFile(String(rd.result||''), f.name); }catch(e){ toast(t('si_bad')); } };
  rd.onerror = ()=>toast(t('si_bad'));
  rd.readAsText(f);
}
function parseSalesFile(text, name){
  const idx = eanIndex();
  const byCode = {};
  PRODUCTS.forEach(p=>{ const im = itemMeta(p.id);
    if(im.goodCode) byCode[String(im.goodCode).toUpperCase()] = p.id;
    byCode[p.id.toUpperCase()] = p.id; });
  const rows = [], unknown = [];
  String(text).split(/[\r\n]+/).forEach((line, i)=>{
    const raw = line.trim(); if(!raw) return;
    const parts = raw.split(/[;,\t]/).map(x=>x.trim().replace(/^"|"$/g,''));
    if(parts.length < 2) return;
    const code = safeStr(parts[0], 32);
    const qty = Math.floor(parseFloat(String(parts[1]).replace(',','.')) || 0);
    if(!code || qty <= 0) return;
    if(i===0 && !/\d/.test(String(parts[1]))) return;           // a header row
    const dt = parts[2] ? ymdToTs(String(parts[2]).slice(0,10)) : null;
    const pid = idx[normCode(code)] || byCode[code.toUpperCase()] || null;
    if(pid) rows.push({pid, qty, date: dt || S.today, code});
    else unknown.push({code, qty});
  });
  SIMPORT = {rows, unknown, name: safeStr(name, 40)};
  renderSalesImport();
}

/* ================= R8 · the supplier console as a PORTFOLIO, and one that exports =================
   A distributor asked to pay 25–60K AMD/month for "shop-level stock and sell-through" opened a
   screen with exactly one live shop, no per-SKU roll-up across his territory, and no export of
   any kind — the two CSV buttons on that side wrote the SHOP's purchase ledger. He cannot answer
   "how many of my shops are out of Կոկա-Կոլա right now", and he cannot get a single number into
   the system he actually runs his business on. Both are fixed here. */
const LIVE_SHOPS = ['me','o1','o2'];      // devices actually reporting; the rest are fixtures
const isLiveShop = id => LIVE_SHOPS.indexOf(id) >= 0;
function allShops(){ return [MY_SHOP].concat(OTHER_SHOPS); }
/* one row per SKU across every live shop: out-of-stock count, total cover, shops at risk */
function skuRollup(){
  const live = allShops().filter(sh=>isLiveShop(sh.id));
  return PRODUCTS.map(p=>{
    let units = 0, outN = 0, riskN = 0, vel = 0;
    const risk = [];
    live.forEach(sh=>{
      const q = shopStockOf(sh.id)[p.id]||0;
      const v = velOfShop(sh.id, p.id);
      const d = v>0 ? q/v : 99;
      units += q; vel += v;
      if(q<=0){ outN++; risk.push(sh); }
      else if(d<=2){ riskN++; risk.push(sh); }
    });
    return {p, units, outN, riskN, risk, shops:live.length, cover: vel>0 ? units/vel : 0};
  }).sort((a,b)=>(b.outN - a.outN) || (a.cover - b.cover));
}
function exportSelloutCSV(){
  const live = allShops().filter(sh=>isLiveShop(sh.id));
  const rows = [[t('date'), t('shop_col'), t('product'), t('item_code'), t('stock_lbl'),
                 t('velocity'), t('days_left'), t('status_col')]];
  const today = new Date(S.today).toISOString().slice(0,10);
  live.forEach(sh=>{
    PRODUCTS.forEach(p=>{
      const q = shopStockOf(sh.id)[p.id]||0, v = velOfShop(sh.id, p.id), d = v>0 ? q/v : 0;
      rows.push([today, nm(sh), nm(p), itemMeta(p.id).goodCode||'', q, v.toFixed(2),
        q===0 ? 0 : Math.floor(d), q===0 ? t('out_of_stock') : (d<=2 ? t('stockout') : t('ok_status'))]);
    });
  });
  downloadCSV('sellout-'+today+'.csv', rows);

/* R9 · «Համեմատման ակտ» names a document that both parties sign. It was a table with a print
   button: no ՀՎՀՀ for either side, no stated period, no opening balance, no amount in words and
   no signature blocks — so a distributor's accountant could not accept it and the feature read
   as decorative. It now carries the same furniture the գույքագրման ակտ twenty lines away has
   carried since R5. The amount in words is written in Armenian on every language of the UI,
   because that is the language the document is signed in. */
const AM_U=['','մեկ','երկու','երեք','չորս','հինգ','վեց','յոթ','ութ','ինը'];
const AM_TEEN=['տասը','տասնմեկ','տասներկու','տասներեք','տասնչորս','տասնհինգ','տասնվեց','տասնյոթ','տասնութ','տասնինը'];
const AM_TENS=['','','քսան','երեսուն','քառասուն','հիսուն','վաթսուն','յոթանասուն','ութսուն','իննսուն'];
function amWords3(x){
  const out=[], h=Math.floor(x/100), r=x%100;
  if(h) out.push((h>1?AM_U[h]+' ':'')+'հարյուր');
  if(r<10){ if(r) out.push(AM_U[r]); }
  else if(r<20) out.push(AM_TEEN[r-10]);
  else out.push(AM_TENS[Math.floor(r/10)] + (r%10?AM_U[r%10]:''));
  return out.join(' ');
}
function amWords(n){
  let v = Math.round(Math.abs(Number(n)||0));

  if(v===0) return 'զրո դրամ';
  const parts=[];
  const mil = Math.floor(v/1000000); v %= 1000000;
  const th  = Math.floor(v/1000);    v %= 1000;
  if(mil) parts.push((mil>1?amWords3(mil)+' ':'')+'միլիոն');
  if(th)  parts.push((th>1?amWords3(th)+' ':'')+'հազար');
  if(v)   parts.push(amWords3(v));
  return (neg?'մինուս ':'') + parts.join(' ') + ' դրամ';
}

function downloadCSV(name, rows){
  /* R8 · a cell beginning = + - or @ is executed as a formula by Excel and LibreOffice when the
     accountant opens the file. Counter names and chat text are free text and are exported. */
  const cell = c => { let v = String(c==null?'':c); if(/^[=+\-@\t\r]/.test(v)) v = "'" + v; return '"'+v.replace(/"/g,'""')+'"'; };
  const csv = (rows||[]).map(r=>r.map(cell).join(',')).join('\n');
  const blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8'});

/* ================= R8 · the invoice-capture rate, as a NUMBER =================
   The market brief's §0 says the software price is noise and the invoice-capture rate is the
   product: a shop on the turnover-tax regime pays 10 % of turnover, reducible by up to 9.5
   percentage points against DOCUMENTED purchase costs, with a 1 % floor — about 7.6 % of turnover
   for a grocery whose COGS is 80 %. The app stamped the document onto every receipt, exported
   every substantiating column, and shamed undocumented rows with a gold badge — and then never
   put a number on any of it. This is that number, and it is the reason the shop keeps using
   ArmTrade when nothing is broken. */
const TAX = {vatThreshold:115000000, turnoverRate:0.10, deductRate:0.095, floorRate:0.01, cogsShare:0.80};
function docCoverage(days){
  const cut = S.today - (days||30)*DAY;
  const rows = (S.history||[]).filter(h=>h && h.date >= cut);
  let tot = 0, doc = 0; const miss = [];
  rows.forEach(h=>{ const v = (+h.qty||0)*(+h.price||0); tot += v;
    if(h.doc && h.doc.no) doc += v; else if(v>0) miss.push(h); });
  miss.sort((a,b)=>(b.qty*b.price)-(a.qty*a.price));
  return {tot, doc, gap: Math.max(0, tot-doc), miss, pct: tot ? Math.round(doc/tot*100) : 0,
          saved: Math.round(doc * TAX.deductRate), lost: Math.round(Math.max(0, tot-doc) * TAX.deductRate)};
}
/* an ESTIMATE, and labelled as one: we hold purchases, never sales. Purchases over the observed
   window, annualised, divided by the brief's 80 % COGS assumption. Never presented as fact. */
function turnoverEstimate(){
  const rows = (S.history||[]).filter(h=>h && h.date >= S.today - 90*DAY);
  if(!rows.length) return 0;
  const oldest = rows.reduce((mn,h)=>Math.min(mn, h.date), S.today);
  const span = Math.max(14, Math.round((S.today - oldest)/DAY) + 1);
  const spend = rows.reduce((a,h)=>a + (+h.qty||0)*(+h.price||0), 0);
  return Math.round(spend / span * 365 / TAX.cogsShare);
}

function dcStats(){
  const mk=monthKey(S.today);
  const spendM = S.history.filter(h=>monthKey(h.date)===mk).reduce((a,h)=>a+h.qty*h.price,0);
  const paidAll = S.payments.reduce((a,p)=>a+p.amount,0);
  const out = Object.values(S.debts).reduce((a,b)=>a+b,0);
  const deliv = S.history.length;
  return {spendM, paidAll, out, deliv};
}
/* R4 · Σ onHand × cost. costOf() already exists, so the one figure a shopkeeper is actually asked
   for by an accountant is one line. Deliberately at COST — the app holds no selling price. */
function stockValue(){
  let total = 0; const byCat = {};
  PRODUCTS.forEach(p=>{
    const v = onHand(p.id) * costOf(p.id);
    if(!isFinite(v) || v<=0) return;
    total += v; const c = catOf(p.id); byCat[c] = (byCat[c]||0) + v;
  });
  return {total, byCat};
}

       քանակ և մնացած օրերը» — i.e. WHEN YOU ASK. Showing every batch unconditionally is exactly

/* R5 · the header yields to content while the shopkeeper scrolls, and comes back on any upward
   flick. It hides nothing: one small scroll up restores it, exactly like the browser he uses.
   It only ever runs in single-column mobile, it always restores in the top 64px of the page, and
   it never touches nav — the thumb lives there and it must be unconditionally present. */
(function autoHideTop(){
  var last = 0, ticking = false, top = null;
  function apply(){
    ticking = false;
    top = top || document.getElementById('top');
    if(!top) return;
    if(!document.body.classList.contains('single-mobile')){ top.classList.remove('hid'); last = 0; return; }
    var y = window.scrollY || 0;
    if(y < 64){ top.classList.remove('hid'); }
    else if(y > last + 6){ top.classList.add('hid'); }
    else if(y < last - 6){ top.classList.remove('hid'); }
    last = y;
  }
  window.addEventListener('scroll', function(){
    if(!ticking){ ticking = true; requestAnimationFrame(apply); }
  }, {passive:true});
  window.addEventListener('resize', function(){ if(top) top.classList.remove('hid'); }, {passive:true});
})();
