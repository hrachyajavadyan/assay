  ${scaleCfgCard()}
  <div class="card"><h3 style="justify-content:space-between">🧾 ${t('dc_bills')} <button class="btn small ghost noprint" onclick="exportCSV('bills')">⬇ CSV</button></h3><div class="muted" style="margin:-6px 0 8px">${t('tap_bill')}</div><div class="tblwrap"><table class="tbl">
    <tr><th>${t('bill_col')}</th><th>${t('date')}</th><th>${t('supplier_col')}</th><th>${t('amount_col')}</th><th>${t('status_col')}</th></tr>
    ${billRows(false)}</table></div></div>
  <div class="card"><h3>💸 ${t('dc_payments')}</h3><div class="tblwrap"><table class="tbl">
    <tr><th>${t('date')}</th><th>${t('supplier_col')}</th><th>${t('amount_col')}</th></tr>
    ${payRows() || `<tr><td colspan="3" class="muted">—</td></tr>`}</table></div></div>
  <div class="card"><h3 style="justify-content:space-between">🕘 ${t('dc_history')} <button class="btn small ghost noprint" onclick="exportCSV('history')">⬇ CSV</button></h3><div class="tblwrap"><table class="tbl">
    <tr><th>${t('date')}</th><th>${t('product')}</th><th>${t('qty')}</th><th>${t('amount_col')}</th></tr>
    ${histRows(40)}</table></div></div>`;
}
function vSupData(){
  const st=dcStats();
  const revAll = S.history.reduce((a,h)=>a+h.qty*h.price,0);
  return `<div class="sec">${t('dc_title')}</div>
  <div class="kpis">
    <div class="kpi"><div class="l">💰 ${t('dc_rev_m')}</div><div class="v" style="font-size:16px;color:var(--gold2)">${amd(st.spendM)}</div></div>
    <div class="kpi"><div class="l">📦 ${t('dc_deliv_all')}</div><div class="v">${st.deliv}</div></div>
    <div class="kpi"><div class="l">✅ ${t('dc_payments')}</div><div class="v" style="font-size:16px;color:var(--green)">${amd(st.paidAll)}</div></div>
    <div class="kpi"><div class="l">⏳ ${t('dc_receiv')}</div><div class="v" style="font-size:16px;color:${st.out?'var(--rose)':'var(--green)'}">${amd(st.out)}</div></div>
  </div>
  <div class="card"><h3>📊 ${t('dc_rev_by_month')}</h3>${monthBars('cy')}</div>
  <div class="card"><h3>⏳ ${t('dc_receiv')}</h3>
    ${SUPPLIERS.map(s=>`<div class="row" style="padding:9px 0;border-bottom:1px solid var(--sep)">
      <span>${s.em} ${nm(s)} ← ${nm(MY_SHOP)}</span>
      <span style="display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end">
        <b class="num" style="color:${(S.debts[s.id]||0)>0?'var(--rose)':'var(--green)'}">${(S.debts[s.id]||0).toLocaleString('en-US')} ֏</b>
        ${(S.debts[s.id]||0)>0?`<button class="btn small green" onclick="payDebt('${s.id}')">💰 ${t('receive_pay')}</button>`:''}
        <button class="btn small ghost" onclick="openStatement('${s.id}')">📄 ${t('statement')}</button>
      </span>
    </div>`).join('')}</div>
  <div class="card"><h3 style="justify-content:space-between">🧾 ${t('dc_bills')} <button class="btn small ghost noprint" onclick="exportCSV('bills')">⬇ CSV</button></h3><div class="muted" style="margin:-6px 0 8px">${t('tap_bill')}</div><div class="tblwrap"><table class="tbl">
    <tr><th>${t('bill_col')}</th><th>${t('date')}</th><th>${t('shop_col')}</th><th>${t('amount_col')}</th><th>${t('status_col')}</th></tr>
    ${billRows(true)}</table></div></div>
  <div class="card"><h3 style="justify-content:space-between">🕘 ${t('dc_sales')} <button class="btn small ghost noprint" onclick="exportCSV('history')">⬇ CSV</button></h3><div class="tblwrap"><table class="tbl">
    <tr><th>${t('date')}</th><th>${t('product')}</th><th>${t('qty')}</th><th>${t('amount_col')}</th></tr>
    ${histRows(40)}</table></div></div>`;
}

function openShop(id){
  const shop = id==='me' ? MY_SHOP : OTHER_SHOPS.find(o=>o.id===id);
  let body = '';
  if(id==='me'){
    body = `<table class="tbl"><tr><th>${t('product')}</th><th>${t('cycle')}</th><th>${t('avg_qty')}</th><th>${t('next_due')}</th></tr>` +
      PRODUCTS.map(p=>{const st=stats(p.id); if(!st) return '';
        const cls = st.dueIn<0?'style="color:var(--rose);font-weight:700"':'';
        return `<tr><td>${nm(p)}</td><td class="num">${st.cycle} ${dayW()}</td><td class="num">${st.avgQty}</td><td ${cls}>${st.dueIn<0?(t('overdue')+' '+(-st.dueIn)+(' '+dayW())):fdate(st.due)}</td></tr>`;}).join('') + '</table>';
  } else {
    body = `<div class="muted">${t('last_order')}${VJ()} ${fdate(S.otherLast[id])} (${daysAgo(S.otherLast[id])} ${lang==='hy'?'օր առաջ':(lang==='ru'?'дн. назад':'days ago')})</div>`;
  }
  // live stock table for every shop
  body += `<div class="sec" style="margin-top:16px">📦 ${t('stock_lbl')}</div>
  <table class="tbl"><tr><th>${t('product')}</th><th>${t('stock_lbl')}</th><th>${t('velocity')}</th><th>${t('days_left')}</th></tr>` +
    PRODUCTS.map(p=>{
      const q = shopStockOf(id)[p.id]||0;
      const d = daysLeftShop(id, p.id);
      const cls = q===0||d<=1 ? 'style="color:var(--rose);font-weight:700"' : d<=3 ? 'style="color:var(--gold2)"' : '';
      return `<tr><td>${p.em} ${nm(p)}</td><td class="num" ${cls}>${q}</td><td class="num">${velOfShop(id,p.id).toFixed(1)}</td><td class="num" ${cls}>${q===0?'—':'~'+Math.floor(d)}</td></tr>`;
    }).join('') + '</table>';
  document.getElementById('modalRoot').innerHTML = `<div class="modal" onclick="if(event.target===this)closeModal()">
    <div class="mbody"><div class="grabber"></div><h3>${nm(shop)}</h3><div class="muted">${t('shop_detail')}</div>${body}
    <button class="btn primary" style="margin-top:16px" onclick="closeModal()">${t('close')}</button></div></div>`;
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
function openInvoice(bid){
  const b = S.bills.find(x=>x.id===bid); if(!b) return;
  const sup = SUP(b.sup);
  const itemRows = b.items && b.items.length
    ? `<table class="tbl"><tr><th>${t('product')}</th><th>${t('qty')}</th><th>${t('price')}</th><th>${t('amount_col')}</th></tr>` +
      b.items.map(it=>`<tr><td>${nm(P(it.productId))}</td><td class="num">${it.qty}</td><td class="num">${it.price.toLocaleString('en-US')}</td><td class="num">${(it.qty*it.price).toLocaleString('en-US')}</td></tr>`).join('') + `</table>`
    : `<div class="muted" style="margin-top:10px">${t('amount_col')}${VJ()} <b class="num">${b.amount.toLocaleString('en-US')} ֏</b></div>`;
  document.getElementById('modalRoot').innerHTML = `<div class="modal" onclick="if(event.target===this)closeModal()">
    <div class="mbody" id="invoiceBody"><div class="grabber noprint"></div>
    <h3>🧾 ${b.adj ? t('adj_doc') : t('invoice')} ${b.id}</h3>
    <div class="muted">${fdate(b.date)} 2026</div>
    <hr class="sep" style="border:none;border-top:1px solid var(--stroke2);margin:12px 0">
    <div class="row" style="align-items:flex-start"><div>
      <div class="muted" style="font-size:10.5px;text-transform:uppercase;letter-spacing:1px">${t('seller')}</div>
      <b>${sup.em} ${nm(sup)}</b>
    </div><div style="text-align:right">
      <div class="muted" style="font-size:10.5px;text-transform:uppercase;letter-spacing:1px">${t('buyer')}</div>
      <b>🏪 ${nm(MY_SHOP)}</b>
    </div></div>
    ${itemRows}
    <div class="row" style="margin-top:14px"><b>${t('total_lbl')}</b><span class="big" style="color:var(--gold2)">${amd(b.amount)}</span></div>
    <div style="margin-top:8px">${b.paid?`<span class="badge b-green">${t('paid_st')}${b.paidDate?' · '+fdate(b.paidDate):''}</span>`:`<span class="badge b-rose">${t('unpaid_st')}</span>`}</div>
    <button class="btn primary noprint" style="margin-top:16px" onclick="window.print()">🖨 ${t('print')}</button>
    <button class="btn ghost full noprint" style="margin-top:9px" onclick="closeModal()">${t('close')}</button></div></div>`;
}
window.remind = function(shopId, pId, type){
  if(shopId==='me'){
    const st = stats(pId); const p = P(pId);
    if(!S.proposals.some(x=>x.productId===pId)){
      S.proposals.push({id:'PRP-'+(S.seq++), productId:pId, qty:(st?st.avgQty:p.qty), sup:p.sup, date:S.today});
      logEv('proposal',{pid:pId});
    }
  }
  remindFix(shopId + '_' + pId + '_' + type);
};
function acceptProposal(prid){
  const pr = S.proposals.find(x=>x.id===prid); if(!pr) return;
  const p = P(pr.productId);
  S.orders.unshift({id:'ORD-'+(S.seq++), date:S.today, shop:MY_SHOP, sup:pr.sup, items:[{productId:pr.productId, qty:pr.qty, price:effPrice(p)}], status:'new', fromProposal:true});
  S.proposals = S.proposals.filter(x=>x.id!==prid);
  U.tab.shop='orders'; saveU();
  saveD(); toast('1 ' + t('order_placed')); renderAll();
}
function dismissProposal(prid){ S.proposals = S.proposals.filter(x=>x.id!==prid); saveD(); renderAll(); }
function setPropQty(prid, q){ const pr=S.proposals.find(x=>x.id===prid); if(pr && q>0){ pr.qty=q; saveD(); renderAll(); } }

let rt=null;
window.addEventListener('resize', ()=>{ clearTimeout(rt); rt=setTimeout(renderAll,150); });
renderAll();
</script>
</body>
</html>
