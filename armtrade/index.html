   strings inside the rows, at the ONE place every adopted state passes through. escH() at the
   render sink is still used and still required — but ~200 innerHTML templates is far too many
   places for escaping to be the only line of defence, and six of them were provably missing it.
   Stripping (not escaping) is idempotent, so a string can survive any number of migrations. */
function safeStr(s, max){ return String(s==null?'':s).replace(/[<>"'`&\\]/g,'').replace(/[\u0000-\u001f\u007f]/g,' ').slice(0, max||120); }
function safeId(s, max){ return String(s==null?'':s).replace(/[^A-Za-z0-9._-]/g,'').slice(0, max||32); }
function safeNum(v, def){ const n = +v; return isFinite(n) ? n : (def===undefined ? 0 : def); }
function safeInt(v, def){ return Math.round(safeNum(v, def)); }
/* R8 · S.seq mints ORD-/INV-/ADJ-/PRP- from ONE counter with no device discriminator. That was
   invisible while the merge was last-write-wins (it destroyed one side anyway); the moment rows
   merge BY ID — which the data-loss fix requires — two devices, or even two tabs, minting the
   same «ORD-11» would silently fuse two different orders into one. Every minted id therefore
   carries three random base-31 characters. The seq is kept because it is what makes the number
   readable and orderable to the shopkeeper and his accountant. */
const IDABC = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
function idTag(n){ let r=''; for(let i=0;i<(n||3);i++) r += IDABC[Math.floor(Math.random()*IDABC.length)]; return r; }
function newId(prefix){ if(typeof S.seq!=='number' || !isFinite(S.seq)) S.seq = 1; return prefix + (S.seq++) + idTag(3); }
function rowId(prefix){ return (prefix||'r') + '-' + idTag(4) + Date.now().toString(36).slice(-4); }
/* ---------- state migration ----------
   Idempotent and STRICTLY ADDITIVE. Runs on load AND on every state adopted from the sync
   room, so a peer running an older build can never white-screen us. Never deletes or rewrites
   an existing key; never rebuilds S.stock from S.sales/S.history (that would double-count —
   the cached number IS the truth at migration time).
   NOTE: this runs before the `const` helpers below exist, so it may only use PRODUCTS /
   OTHER_SHOPS / START / DAY, never P(), SUP() or costOf().                                   */
function migrate(st){
  if(!st || typeof st!=='object') return st;
  if(!st.bills){ st.bills=[]; Object.entries(st.debts||{}).forEach(([sup,amt])=>{ if(amt>0) st.bills.push({id:'INV-'+sup.toUpperCase(), sup, date:st.today-14*DAY, amount:amt, paid:false}); }); }
  if(!st.payments) st.payments=[];
  if(!st.proposals) st.proposals=[];
  if(!st.promos) st.promos={p4:true};
  if(!st.creditLimit) st.creditLimit={s1:100000, s2:80000, s3:60000};
  if(!st.events){ st.events=[]; st.evCounter=0; }
  if(!st.stock){
    st.stock={}; st.sales=st.sales||[]; st.stockoutFlag={};
    PRODUCTS.forEach((p,i)=>{
      const vel = Math.max(0.5, p.qty / p.cycle);
      st.stock[p.id] = Math.max(1, Math.round(vel * (i%3===1 ? 1.5 : 3 + (i%4))));
      for(let d=10; d>=1; d--){
        const q = Math.round(vel * (0.5 + srnd()*0.9));
        if(q>0) st.sales.push({date: st.today - d*DAY, productId: p.id, qty: q});
      }
    });
  }
  if(!st.stockoutFlag) st.stockoutFlag={};
  if(!st.shopStock){
    st.shopStock={};
    OTHER_SHOPS.forEach((o,i)=>{
      st.shopStock[o.id]={};
      PRODUCTS.forEach((p,j)=>{
        const vel = Math.max(0.4, p.qty/p.cycle) * [1.3,0.8,0.5,1.6,1.0][i%5];
        st.shopStock[o.id][p.id] = o.id==='o3' ? Math.round(vel*(j%3)) : Math.max(1, Math.round(vel*(2+(i+j)%6)));
      });
    });
  }
  /* these keys are read with .filter/.forEach all over the app: a truncated or partially
     merged room payload must never white-screen us, so coerce them back to their shape */
  if(!Array.isArray(st.orders)) st.orders=[];
  if(!Array.isArray(st.history)) st.history=[];
  if(!Array.isArray(st.sales)) st.sales=[];
  if(!Array.isArray(st.bills)) st.bills=[];
  if(!Array.isArray(st.payments)) st.payments=[];
  if(!Array.isArray(st.proposals)) st.proposals=[];
  if(!Array.isArray(st.events)) st.events=[];
  if(!st.debts || typeof st.debts!=='object') st.debts={};
  if(!st.basket || typeof st.basket!=='object') st.basket={};
  if(!st.reminded || typeof st.reminded!=='object') st.reminded={};
  if(!st.dismissed || typeof st.dismissed!=='object') st.dismissed={};
  if(!st.promos || typeof st.promos!=='object') st.promos={p4:true};
  if(!st.stockoutFlag || typeof st.stockoutFlag!=='object') st.stockoutFlag={};
  if(typeof st.seq!=='number' || !isFinite(st.seq)) st.seq = 1;
  if(typeof st.today!=='number' || !isFinite(st.today)) st.today = START;
  /* ---- R8 · the ROWS of orders/history/bills/payments, not just the arrays ----
     batches, swapReqs, markdowns, minStock, pchats, counts and moves have had row validation
     since R3; these four never did, and one order row missing `.shop` arriving from the sync
     room threw inside every one of the seventeen screens that dereference it — permanently,
     because the poisoned state is written straight to localStorage. Same policy as everywhere
     else here: an unusable row is DROPPED, never guessed at, and never allowed to crash a render.
     Every row also gets a stable id, which is what lets the sync merge work by row identity
     instead of destroying whichever device wrote last. */
  const KNOWN_PID = {}; PRODUCTS.forEach(p=>{ KNOWN_PID[p.id]=1; });
  const KNOWN_SHOP = {}; KNOWN_SHOP[MY_SHOP.id]=MY_SHOP; OTHER_SHOPS.forEach(o=>{ KNOWN_SHOP[o.id]=o; });
  const okDate = (v, d) => (typeof v==='number' && isFinite(v)) ? v : d;
  const cleanLines = (arr, keep) => (Array.isArray(arr)?arr:[]).filter(x=>x && typeof x==='object' && KNOWN_PID[x.productId||x.pid])
      .map(x=>{ const o = {}; keep.forEach(k=>{ o[k] = (k==='productId'||k==='pid'||k==='reason') ? safeId(x[k], 24) : safeNum(x[k]); }); return o; });
  st.orders = st.orders.filter(o=>o && typeof o==='object' && KNOWN_SHOP[o && o.shop && o.shop.id]).map(o=>{
    /* the shop object is replaced by the CANONICAL record for that id: a name arriving from the
       room is attacker-controlled text that nm() interpolates raw into a dozen templates. */
    o.shop = KNOWN_SHOP[o.shop.id];
    o.id = safeId(o.id, 24) || rowId('ORD');
    o.sup = safeId(o.sup, 16);
    o.status = ['new','confirmed','delivered'].indexOf(o.status)>=0 ? o.status : 'new';
    o.date = okDate(o.date, st.today);
    o.deliveryDate = okDate(o.deliveryDate, o.date);
    if(o.deliveredTs!=null) o.deliveredTs = okDate(o.deliveredTs, undefined);
    if(o.deliveredTs===undefined) delete o.deliveredTs;
    o.items = (Array.isArray(o.items)?o.items:[]).filter(it=>it && typeof it==='object' && KNOWN_PID[it.productId])
      .map(it=>{ const r = {productId:safeId(it.productId,16), qty:Math.max(0,safeInt(it.qty)), price:Math.max(0,safeNum(it.price))};
                 if(it.delivered!=null) r.delivered = Math.max(0, safeInt(it.delivered)); return r; });
    if(o.receipt!=null){
      if(typeof o.receipt!=='object' || Array.isArray(o.receipt)) o.receipt = null;
      else {
        const rc = o.receipt;
        rc.ts = okDate(rc.ts, o.deliveryDate||o.date); rc.rts = safeNum(rc.rts, 0);
        rc.diff = safeNum(rc.diff, 0); rc.actor = safeId(rc.actor, 16) || 'shop';
        rc.lines = cleanLines(rc.lines, ['pid','shipped','received','diff','price','reason']);
        if(rc.doc!=null && typeof rc.doc==='object' && !Array.isArray(rc.doc)){
          rc.doc = {type:safeId(rc.doc.type,16)||'invoice', no:safeStr(rc.doc.no,30),
                    date:okDate(rc.doc.date, rc.ts), tin:safeId(rc.doc.tin,8).replace(/\D/g,''),
                    order:safeId(rc.doc.order,24), sup:safeId(rc.doc.sup,16)};
        } else rc.doc = null;
      }
    }
    return o;
  });
  st.history = st.history.filter(h=>h && typeof h==='object' && KNOWN_PID[h.productId]).map(h=>{
    const r = {id: safeId(h.id, 28) || rowId('h'), date: okDate(h.date, st.today),
               productId: safeId(h.productId,16), sup: safeId(h.sup,16),
               qty: Math.max(0, safeInt(h.qty)), price: Math.max(0, safeNum(h.price))};
    if(h.doc && typeof h.doc==='object' && !Array.isArray(h.doc)){
      r.doc = {no:safeStr(h.doc.no,30), date:okDate(h.doc.date, r.date),
               tin:safeId(h.doc.tin,8).replace(/\D/g,''), order:safeId(h.doc.order,24),
               type:safeId(h.doc.type,16)||'invoice'};
      if(!r.doc.no) delete r.doc;
    }
    return r;
  });
  st.bills = st.bills.filter(b=>b && typeof b==='object').map(b=>{
    const r = {id: safeId(b.id, 28) || rowId('INV'), sup: safeId(b.sup,16), date: okDate(b.date, st.today),
               amount: safeNum(b.amount), paid: !!b.paid, adj: !!b.adj};
    if(b.paidDate!=null) r.paidDate = okDate(b.paidDate, r.date);
    if(b.ref!=null) r.ref = safeStr(b.ref, 30);
    if(b.items!=null) r.items = cleanLines(b.items, ['productId','qty','price']);
    if(r.adj) r.paid = true;
    return r;
  });
  st.payments = st.payments.filter(p=>p && typeof p==='object').map(p=>({
    id: safeId(p.id, 28) || rowId('pay'), date: okDate(p.date, st.today),
    sup: safeId(p.sup,16), amount: safeNum(p.amount), bid: safeId(p.bid, 28)}));
  st.proposals = st.proposals.filter(p=>p && typeof p==='object' && KNOWN_PID[p.productId]).map(p=>({
    id: safeId(p.id,28) || rowId('PRP'), productId: safeId(p.productId,16), qty: Math.max(1, safeInt(p.qty,1)),
    sup: safeId(p.sup,16), date: okDate(p.date, st.today)}));
  st.sales = st.sales.filter(s=>s && typeof s==='object' && KNOWN_PID[s.productId])
    .map(s=>({date: okDate(s.date, st.today), productId: safeId(s.productId,16), qty: Math.max(0, safeInt(s.qty))}));
  /* --- R1: the stock ledger --- */
  // one malformed row must not be able to brick postMove / movesFor / costOf / shrinkSummary
  if(Array.isArray(st.moves)) st.moves = st.moves
    .filter(m=>m && typeof m==='object' && m.pid && m.type)
    .map(m=>{
      m.pid = safeId(m.pid, 16); m.type = safeId(m.type, 16);
      m.uuid = safeId(m.uuid, 40) || ('m-mig-'+idTag(6));
      m.n = safeNum(m.n, 0); m.ts = okDate(m.ts, st.today); m.rts = safeNum(m.rts, 0);
      m.dq = safeNum(m.dq, 0); m.cost = safeNum(m.cost, 0);
      m.ref = safeStr(m.ref, 30); m.reason = safeId(m.reason, 20);
      m.actor = safeId(m.actor, 16) || 'shop'; m.note = safeStr(m.note, 200);
      m.batch = safeId(m.batch, 20);
      return m;
    });
  /* R8 · the compaction watermark. compactMoves() collapses everything older than `cutoff` into
     one opening row per SKU and the collapsed uuids disappear — while mergeMoves() re-adds every
     LOCAL move the remote has not seen. A peer that had not compacted yet therefore re-injected
     the whole pre-compaction history on top of the opening balance and roughly DOUBLED on-hand,
     with verifyLedger() reporting clean. The cutoff travels with the state so the peer can drop
     exactly the rows that were already summed. postMove() always stamps ts = S.today and the
     cutoff is 90 days behind it, so a genuinely new move can never fall below the watermark. */
  st.compactCut = Math.max(0, safeNum(st.compactCut, 0));
  if(!Array.isArray(st.moves)){
    st.moves=[]; st.moveSeq=0;
    const base=(st.today||START)-30*DAY;
    Object.entries(st.stock||{}).forEach(([pid,q])=>{
      const pr = PRODUCTS.find(x=>x.id===pid);
      if(!pr) return;                       // unknown SKU from a future build: skip, don't crash
      st.moves.push({n:++st.moveSeq, uuid:'mig-'+pid, ts:base, rts:0, pid, type:'open',
                     dq:(+q||0), cost:pr.price, ref:'', reason:'migration', actor:'system', note:''});
    });
  } else {
    // a peer on the old build may have written S.stock directly; the cache stays the truth,
    // so close the gap with one signed adjust move instead of replaying anything.
    const reb={}; st.moves.forEach(m=>{ if(m&&m.pid) reb[m.pid]=(reb[m.pid]||0)+(+m.dq||0); });
    Object.entries(st.stock||{}).forEach(([pid,q])=>{
      const pr = PRODUCTS.find(x=>x.id===pid); if(!pr) return;
      const d = (+q||0) - (reb[pid]||0);
      if(!d) return;
      st.moveSeq = (st.moveSeq||st.moves.length);
      st.moves.push({n:++st.moveSeq, uuid:'fix-'+pid+'-'+st.moves.length, ts:st.today||START, rts:0, pid,
                     type:'adjust', dq:d, cost:pr.price, ref:'', reason:'migration', actor:'system', note:''});
    });
  }
  if(st.moveSeq==null) st.moveSeq=st.moves.length;
  if(!st.itemMeta) st.itemMeta={};
  /* ONE-TIME back-fill: deliveries made by a pre-ledger build already added their stock, so we
     stamp them as auto-received and never re-add it. Gated on ledgerV — migrate() runs on every
     adopted state (reload, sync poll, BroadcastChannel), and without this gate it would also
     swallow fresh deliveries of the CURRENT build and destroy their pending Ընդունում. */
  if(!st.ledgerV){
    (st.orders||[]).forEach(o=>{ if(o&&o.shop&&o.shop.id==='me'&&o.status==='delivered'&&!o.receipt)
      o.receipt={ts:o.deliveryDate||o.date, rts:0, auto:true, doc:null, lines:[], diff:0, actor:'system'}; });
  }
  /* --- R2: barcode scanner config + shopkeeper-linked codes (every branch is idempotent) --- */
  if(!st.scaleCfg || typeof st.scaleCfg!=='object') st.scaleCfg={valueIs:'grams'};
  if(st.scaleCfg.valueIs!=='amd') st.scaleCfg.valueIs='grams';
  if(!st.itemMeta || typeof st.itemMeta!=='object') st.itemMeta={};
  Object.keys(st.itemMeta).forEach(pid=>{
    const m=st.itemMeta[pid];
    if(!m || typeof m!=='object' || Array.isArray(m) || !KNOWN_PID[pid]){ delete st.itemMeta[pid]; return; }
    if(m.eans!=null && !Array.isArray(m.eans)) m.eans=[];
    if(Array.isArray(m.eans)) m.eans=m.eans.filter(x=>typeof x==='string' && /^\d{6,14}$/.test(x));
    if(m.scaleCode!=null && typeof m.scaleCode!=='string') delete m.scaleCode;
    /* R8 · these five reach ~50 innerHTML templates between them (goodNameOf, unitOf, atgOf,
       the item card, the receiving line, the count act and the accountant CSV). They are the
       one part of the item card the shopkeeper may override, which also makes them the one
       part a sync peer can write. */
    ['goodName','goodCode','unit','atg','adgCode','ean','scaleCode','cat'].forEach(k=>{
      if(m[k]!=null) m[k] = safeStr(m[k], k==='goodName'?50:20);
    });
  });
  /* --- R2: Գույքագրում — archived acts + the single open session --- */
  if(!Array.isArray(st.counts)) st.counts=[];
  st.counts = st.counts.filter(c=>c && typeof c==='object' && c.id)
                       .map(c=>{
                         c.id = safeId(c.id, 24); c.counter = safeStr(c.counter, 60);
                         c.date = okDate(c.date, st.today); c.rts = safeNum(c.rts, 0);
                         c.surplus = safeNum(c.surplus); c.short = safeNum(c.short); c.net = safeNum(c.net);
                         c.n = safeInt(c.n);
                         if(!c.scope || typeof c.scope!=='object' || Array.isArray(c.scope)) c.scope = {kind:'all', sup:null, key:''};
                         else c.scope = {kind:safeId(c.scope.kind,12)||'all', sup:safeId(c.scope.sup,16)||null, key:safeId(c.scope.key,24)||''};
                         c.lines = cleanLines(c.lines, ['pid','book','counted','diff','cost','amd','after','posted']);
                         c.skipped = (Array.isArray(c.skipped)?c.skipped:[]).filter(x=>KNOWN_PID[x]);
                         return c;
                       }).filter(c=>c.id);
  if(typeof st.countSeq!=='number') st.countSeq = st.counts.length;
  if(typeof st.counterName!=='string') st.counterName='';
  st.counterName = safeStr(st.counterName, 60);
  if(st.count && typeof st.count==='object'){
    st.count.id = safeId(st.count.id, 24);
    st.count.counter = safeStr(st.count.counter, 60);
    st.count.date = okDate(st.count.date, st.today);
    if(!st.count.lines || typeof st.count.lines!=='object') st.count.lines={};
    Object.keys(st.count.lines).forEach(pid=>{
      const l=st.count.lines[pid];
      if(!l || typeof l!=='object' || typeof l.counted!=='number' || !PRODUCTS.some(p=>p.id===pid)) delete st.count.lines[pid];
      else if(typeof l.mn!=='number') l.mn = 0;      // pre-mn line: treat everything as posted after it
    });
    if(!st.count.scope || typeof st.count.scope!=='object') st.count.scope={kind:'all', sup:null};
    if(Array.isArray(st.count.pids)) st.count.pids = st.count.pids.filter(x=>PRODUCTS.some(p=>p.id===x));
    else delete st.count.pids;
    /* R3 · F5: a report may hand the count a category / ABC scope. An unknown kind already falls
       through countScopePids() to all PRODUCTS, so a session from a newer build cannot crash us. */
    if(st.count.scope.key!=null && typeof st.count.scope.key!=='string') delete st.count.scope.key;
    if(!st.count.id) st.count=null;                  // half-written session: drop rather than guess
  } else st.count = null;   // null, undefined, or a string/number from a peer: all mean "no session"
  if(st.count===undefined) st.count=null;
  /* ---- R3 · F1: Խմբաքանակ / Պիտանիության ժամկետ (every branch idempotent on its own output) ---- */
  if(!Array.isArray(st.batches)) st.batches=[];
  st.batches = st.batches.filter(b=>b && typeof b==='object' && b.id && PRODUCTS.some(p=>p.id===b.pid)).map(b=>{
    b.id = safeId(b.id, 20); b.pid = safeId(b.pid, 16);
    b.qty  = Math.max(0, Math.floor(+b.qty||0));
    b.left = Math.max(0, Math.min(Math.floor(+b.left||0), b.qty));
    b.exp  = (typeof b.exp==='number' && isFinite(b.exp)) ? b.exp : null;
    b.cost = Math.max(0, +b.cost||0);
    b.date = (typeof b.date==='number' && isFinite(b.date)) ? b.date : (st.today||START);
    b.ref  = typeof b.ref==='string' ? b.ref : '';
    return b;
  });
  // never let a stale batch outlive its stock: clamp per SKU against the CACHE, FEFO
  const bsum={}; st.batches.forEach(b=>{ bsum[b.pid]=(bsum[b.pid]||0)+b.left; });
  Object.keys(bsum).forEach(pid=>{
    let over = bsum[pid] - Math.max(0, (st.stock||{})[pid]||0);
    if(over<=0) return;
    st.batches.filter(b=>b.pid===pid)
      .sort((a,b)=>((a.exp==null?Infinity:a.exp)-(b.exp==null?Infinity:b.exp)) || 0)
      .forEach(b=>{ if(over<=0) return; const take=Math.min(b.left, over); b.left-=take; over-=take; });
  });
  st.batches = st.batches.filter(b=>b.left>0);
  if(typeof st.batchSeq!=='number' || !isFinite(st.batchSeq)) st.batchSeq = st.batches.length;
  st.batchSeq = Math.max(st.batchSeq, st.batches.reduce((mx,b)=>Math.max(mx, parseInt(String(b.id).slice(2),10)||0), 0));
  /* ---- R3 · F2: the SHOP's own retail markdown. Deliberately NOT S.promos — that is the
     supplier's −10% on the PURCHASE price and crosses to the supplier console. ---- */
  if(!st.markdowns || typeof st.markdowns!=='object') st.markdowns={};
  Object.keys(st.markdowns).forEach(pid=>{
    const m = st.markdowns[pid];
    if(!m || typeof m!=='object' || !PRODUCTS.some(p=>p.id===pid)){ delete st.markdowns[pid]; return; }
    m.pct = [20,30,50].indexOf(+m.pct)>=0 ? +m.pct : 30;
    if(typeof m.ts!=='number' || !isFinite(m.ts)) m.ts = st.today||START;
    m.from = (m.from==='dead') ? 'dead' : 'exp';
  });
  if(!st.expFlag || typeof st.expFlag!=='object') st.expFlag={};
  /* R3 fix: actual-delivery stamp (leadStats) and the batch a move was attributed to. Both are
     optional — a state from an older build, or a peer that sent junk, just falls back. */
  (st.orders||[]).forEach(o=>{
    if(o && o.deliveredTs!=null && (typeof o.deliveredTs!=='number' || !isFinite(o.deliveredTs))) delete o.deliveredTs;
  });
  (st.moves||[]).forEach(m=>{ if(m && m.batch!=null && typeof m.batch!=='string') m.batch=''; });
  /* ---- R3 · F3: swap / return requests to the supplier ---- */
  if(!Array.isArray(st.swapReqs)) st.swapReqs=[];
  st.swapReqs = st.swapReqs.filter(r=>r && typeof r==='object' && r.id && PRODUCTS.some(p=>p.id===r.pid)).map(r=>{
    r.id = safeId(r.id, 20); r.pid = safeId(r.pid, 16);
    r.qty = Math.max(0, Math.floor(+r.qty||0));
    r.kind = r.kind==='dead' ? 'dead' : 'exp';
    r.status = r.status==='closed' ? 'closed' : 'open';
    r.reply = ['swap','back','no'].indexOf(r.reply)>=0 ? r.reply : '';
    r.days = (typeof r.days==='number' && isFinite(r.days)) ? r.days : null;
    r.date = (typeof r.date==='number' && isFinite(r.date)) ? r.date : (st.today||START);
    if(!r.sup || !SUPPLIERS_IDS[r.sup]) r.sup = (PRODUCTS.find(p=>p.id===r.pid)||{}).sup || 's1';
    return r;
  });
  if(typeof st.swapSeq!=='number' || !isFinite(st.swapSeq)) st.swapSeq = st.swapReqs.length;
  /* ---- R3 · F4: Նվազագույն մնացորդ, only ever written by the shopkeeper ---- */
  if(!st.minStock || typeof st.minStock!=='object') st.minStock={};
  Object.keys(st.minStock).forEach(pid=>{
    const v = +st.minStock[pid];
    if(!PRODUCTS.some(p=>p.id===pid) || !isFinite(v) || v<0 || v>9999) delete st.minStock[pid];
    else st.minStock[pid] = Math.floor(v);
  });
  /* ---- R4 · B1: supAlerts() dereferences st.otherLast directly. An older saved state, or a
     truncated payload adopted from the sync room, used to throw on EVERY render and leave the
     app with no nav and no recovery path. Heal it here like every other key. ---- */
  if(!st.otherLast || typeof st.otherLast!=='object') st.otherLast={};

function beep(){
  try{
    const ctx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if(ctx.state==='suspended') ctx.resume();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type='sine'; o.frequency.value=880; g.gain.value=0.08;
    o.start(); o.frequency.setValueAtTime(1175, ctx.currentTime+0.12);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.35);
    o.stop(ctx.currentTime+0.4);
  }catch(e){}
}

const roleLocked = ()=> AUTHD && (AUTHD.role==='shop' || AUTHD.role==='sup');

/* ---------- cross-device sync via room codes (Cloudflare Pages Functions + D1) ----------
   R8 · the room is now (code, key). The code addresses the row; the key authorises reading and
   writing it and is checked server-side. The key is minted on the device that creates the room,
   travels to the second device as part of the one string the two people exchange, and is never
   present in any served file. */
let ROOM = '', ROOMKEY = '';
try{ ROOM = localStorage.getItem('armtrade_room') || ''; }catch(e){}
try{ ROOMKEY = localStorage.getItem('armtrade_roomkey') || ''; }catch(e){}
/* a room without its key is not a room: every request would 401 while the chip claimed a pairing.
   This is also what neutralises a hand-written localStorage 'armtrade_room' (the old bypass). */
if(!/^[A-Za-z0-9_-]{10,64}$/.test(ROOMKEY)){ ROOM = ''; ROOMKEY = '';
  try{ localStorage.removeItem('armtrade_room'); localStorage.removeItem('armtrade_roomkey'); }catch(e){} }
const roomHeaders = extra => Object.assign({'X-Room-Key': ROOMKEY}, extra||{});
/* what actually leaves this device. The privacy card enumerates what the supplier may see —
   «ձեր պատվերները, մնացորդն ու վաճառքի արագությունը» — so a shop's device publishes exactly
   that and keeps the rest. Everything stripped here is preserved locally by keepPrivate(). */
function publishState(){
  if(!(roleLocked() && AUTHD.role==='shop')) return S;
  const out = {};
  Object.keys(S).forEach(k=>{ if(PRIVATE_KEYS.indexOf(k)<0) out[k] = S[k]; });
  out.moves = (S.moves||[]).map(m=>{
    if(!m || !m.note) return m;
    const c = Object.assign({}, m); c.note = ''; return c;    // «գողացել է վաճառողը» stays here
  });
  return out;
}
let syncPushTimer = null, syncErrShown = false, syncBusy = false;
/* R9 · a failed push used to wait for the NEXT mutation to be retried, and the UI said «done»
   with no way to tell that nothing had left the phone. This is the signalling layer the
   research's anti-pattern #5 asks for: a change counter that only a successful push clears, an
   honest line wherever sync is described, and 1s→2s→4s→8s→16s→30s retry so a basement that
   regains signal catches up on its own. The merge semantics underneath are unchanged. */
let syncPending = 0, syncBackoff = 0, syncRetryTimer = null;
function markPending(){ if(ROOM){ syncPending++; } }
let syncOk = null;      // null = not tried yet, true = last handshake succeeded, false = unreachable
function looksLikeState(d){ return d && typeof d==='object' && Array.isArray(d.orders) && Array.isArray(d.history) && Array.isArray(d.bills); }
function schedulePush(){
  if(!ROOM) return;
  markPending();
  clearTimeout(syncPushTimer);
  syncPushTimer = setTimeout(pushState, 400);
}
function scheduleRetry(){
  if(!ROOM) return;
  syncBackoff = syncBackoff ? Math.min(30000, syncBackoff*2) : 1000;
  clearTimeout(syncRetryTimer);
  syncRetryTimer = setTimeout(()=>{ pushState(); }, syncBackoff);
}
/* R8 · the merge is no longer allowed to be silent. A bare 🔄 was shown while a payment, an
   order or an open Գույքագրում was being destroyed; now the shopkeeper is told what happened. */
function mergeToast(){
  if(MERGE_FAILED){ MERGE_FAILED = false; toastSoft('⚠ '+t('sync_merge_fail')); return; }
  if(MERGE_RESCUED > 0) toastSoft('🔄 '+fmt('sync_merge_kept', {n: MERGE_RESCUED}));
  else toastSoft('🔄 '+t('sync_merged'));
}
async function pushState(){
  if(!ROOM || syncBusy) return;
  syncBusy = true;
  try{
    const r = await fetch('/api/room/'+encodeURIComponent(ROOM), {method:'POST',
      headers: roomHeaders({'Content-Type':'application/json'}), body:JSON.stringify({data:publishState(), base:S.v||0})});
    if(r.ok){ const j = await r.json(); S.v = j.v; try{ localStorage.setItem(DKEY, JSON.stringify(S)); }catch(e){} syncErrShown = false; syncOk = true;
      syncPending = 0; syncBackoff = 0; clearTimeout(syncRetryTimer); syncRetryTimer = null; syncDotPaint(); }
    else if(r.status===409){
      // someone else wrote first — adopt their state instead of overwriting it
      const j = await r.json();
      syncOk = true;
      if(looksLikeState(j.data)){ S = mergeAdopt(j.data); S.v = j.v; try{ localStorage.setItem(DKEY, JSON.stringify(S)); }catch(e){} mergeToast(); renderAll(true); }
    }
    else if(r.status===401 || r.status===403){ syncOk = false; if(!syncErrShown){ syncErrShown = true; toastSoft(t('sync_denied')); } }
    else throw new Error('http '+r.status);
  }catch(e){ syncOk = false; if(!syncErrShown){ syncErrShown = true; toastSoft(t('sync_err')); } scheduleRetry(); }
  syncBusy = false;
  syncDotPaint();
}
async function pollSync(){
  if(!ROOM || syncBusy) return;
  try{
    const r = await fetch('/api/room/'+encodeURIComponent(ROOM)+'?probe=1', {headers: roomHeaders()});
    if(!r.ok){ syncOk = false; return; }
    syncOk = true;
    const j = await r.json();
    if(j.v > (S.v||0)){
      const r2 = await fetch('/api/room/'+encodeURIComponent(ROOM), {headers: roomHeaders()});
      if(!r2.ok) return;
      const full = await r2.json();
      if(looksLikeState(full.data)){ S = mergeAdopt(full.data); S.v = full.v; try{ localStorage.setItem(DKEY, JSON.stringify(S)); }catch(e){} renderAll(true); }
    }
  }catch(e){ syncOk = false; }
}
/* R4 · MD#10: the app shipped a standalone PWA manifest but had no service worker, so a
   relaunch or a tab close in a basement gave net::ERR_INTERNET_DISCONNECTED. The worker caches
   only the shell and never /api/*, so sync still fails honestly instead of replaying a stale
   room. Registration is best-effort: file:// and blocked scopes degrade silently. */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){} });
}
setInterval(pollSync, 4000);
pollSync();
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') pollSync(); });
window.addEventListener('focus', pollSync);
window.addEventListener('pagehide', ()=>{
  /* flush a pending push so a quick app close doesn't lose the last action. keepalive:true
     rather than sendBeacon(): the beacon cannot carry the room key, and it discards the response
     so a 409 was a silent no-op anyway. The write is still local-first, so a failed flush loses
     nothing — the next launch pushes again. */
  if(ROOM && syncPushTimer){
    clearTimeout(syncPushTimer); syncPushTimer=null;
    try{ fetch('/api/room/'+encodeURIComponent(ROOM), {method:'POST', keepalive:true,
      headers: roomHeaders({'Content-Type':'application/json'}),
      body: JSON.stringify({data:publishState(), base:S.v||0})}).catch(()=>{}); }catch(e){}
  }
});
/* the badge reflects the LAST handshake, never the intention to sync: a shopkeeper in a basement
   whose pushes are all failing must not be told the data is safe elsewhere */
function syncBadgeHtml(){
  if(!ROOM) return `<span class="badge b-neutral">${t('sync_off')}</span>`;
  const pend = syncPending>0 ? ` <span class="badge b-gold">${fmt('sync_pending',{n:syncPending})}</span>` : '';
  if(syncOk===false) return `<span class="badge b-rose">● ${t('sync_unreach')}</span>`+pend;
  if(syncOk===true) return `<span class="badge b-green">● ${t('sync_on')}</span>`+pend;
  return `<span class="badge b-neutral">${t('sync_check')}</span>`+pend;
}
/* R7 · the phone header's ⚙. Below 461px seven controls plus a date do not fit 390px in any of
   the three languages, and the two previous rounds both "fixed" that by letting one control lose
   its letters. This holds the three set-once controls instead — appearance, language, sync — so
   the five that carry live information (date, bell, split, day) each keep their full width.
   Every row is a full-width 44px button: this is the one sheet the 55-year-old will open in bad
   light to make the screen readable in the first place. */
/* R8 · verifyLedger() only ever compared the cache to the sum of the moves — trivially true after
   any rebuildStock(), and it reported "0 problems" while on-hand was wrong by a whole delivery.
   The checks that matter are cross-model (every receipt move needs a receipt stamp and a purchase
   row; Σbills − Σpayments must equal the supplier balance), and they are worth nothing if nobody
   can see them. One honest line, in the sheet the shopkeeper opens when something feels wrong. */
function integrityBadge(){
  let bad = [];
  try{ bad = verifyLedger().map(x=>'stock:'+x.pid).concat(crossCheck().map(x=>x.kind)); }catch(e){ bad = ['error']; }
  if(!bad.length) return `<span class="badge b-green">● ${t('integ_ok')}</span>`;
  const uniq = [...new Set(bad)].slice(0,3).join(', ');
  return `<span class="badge b-rose">● ${fmt('integ_bad',{n:bad.length})}</span> <span class="muted">${escH(uniq)}</span>`;
}

function randCode(n){ let c=''; for(let i=0;i<n;i++) c += IDABC[Math.floor(Math.random()*IDABC.length)]; return c; }
function genRoom(){
  /* 6 addressing characters + a 16-character secret ≈ 79 bits. The old generator produced a
     6-character code and NOTHING else, and the server let anyone read or overwrite it. */
  const el = document.getElementById('roomInput'); if(!el) return;
  el.value = randCode(6) + '-' + randCode(16);
}
function parsePair(raw){
  const v = String(raw||'').trim().toUpperCase().replace(/[^A-Z0-9-]/g,'');
  const i = v.indexOf('-');
  if(i < 4) return null;
  const code = v.slice(0, i), key = v.slice(i+1).replace(/-/g,'');
  if(!/^[A-Z0-9]{4,24}$/.test(code) || key.length < 10) return null;
  return {code, key};
}
async function joinRoom(){
  const pair = parsePair(document.getElementById('roomInput').value);
  if(!pair){ toast(t('sync_bad_code')); return; }
  const prev = ROOM, prevKey = ROOMKEY;
  ROOM = pair.code; ROOMKEY = pair.key;
  try{ localStorage.setItem('armtrade_room', ROOM); localStorage.setItem('armtrade_roomkey', ROOMKEY); }catch(e){}
  try{
    const r = await fetch('/api/room/'+encodeURIComponent(ROOM), {headers: roomHeaders()});
    if(r.status===401 || r.status===403 || r.status===429) throw new Error('denied');
    if(r.status===404){
      /* the code is not bound to anything yet: the first write binds it to THIS key, which is
         what makes «create a room» and «join a room» one button for the shopkeeper. */
      S.v = 0; await pushState();
      if(syncOk===false) throw new Error('http 0');
      toast('🔗 ' + t('sync_on') + ' · ' + ROOM);
    }
    else if(r.ok){
      const j = await r.json();
      if(j.v > 0 && looksLikeState(j.data)){
        const local = S;
        const next = adopt(j.data);
        /* joining does not hand the room my markdowns, my min-stock policy or my open count */
        PRIVATE_KEYS.forEach(k=>{ if(local && local[k]!==undefined) next[k] = local[k]; });
        S = adopt(next); S.v = j.v;
        try{ localStorage.setItem(DKEY, JSON.stringify(S)); }catch(e){}
      }
      else { S.v = j.v||0; await pushState(); }
      toast('🔗 ' + t('sync_on') + ' · ' + ROOM);
    } else throw new Error('http '+r.status);
  }catch(e){
    /* the handshake failed, so the room was never joined: the chip must not claim otherwise */
    ROOM = prev; ROOMKEY = prevKey;
    try{ if(prev){ localStorage.setItem('armtrade_room', prev); localStorage.setItem('armtrade_roomkey', prevKey); }
         else { localStorage.removeItem('armtrade_room'); localStorage.removeItem('armtrade_roomkey'); } }catch(e2){}
    toast(String(e && e.message)==='denied' ? t('sync_denied') : t('sync_err'));
  }
  closeModal(); renderAll();
}
function leaveRoom(){
  ROOM = ''; ROOMKEY = '';
  try{ localStorage.removeItem('armtrade_room'); localStorage.removeItem('armtrade_roomkey'); }catch(e){}
  closeModal(); renderAll();
}

const P = id => PRODUCTS.find(p=>p.id===id);
const SUP = id => SUPPLIERS.find(s=>s.id===id);
/* R4: a bill or history row carrying an id from another build must not white-screen Տվյալներ
   or throw inside a CSV export. Same spirit as migrate()'s "unknown SKU: skip, don't crash". */
const SUPX = id => SUP(id) || {id:String(id||''), em:'🚚', name:String(id||'—'), nameEn:String(id||'—'), nameRu:String(id||'—')};
const PX  = id => P(id) || {id:String(id||''), em:'📦', name:String(id||'—'), nameEn:String(id||'—'), nameRu:String(id||'—'), price:0, sup:'', qty:1, cycle:7};
/* Russian is the brief's second language; falling back to the English name made every Russian
   screen read 'not for me'. nameRu is optional, so an object without one still degrades to en. */
const nm = o => !o ? '' : (lang==='ru' ? (o.nameRu || o.nameEn || o.name)
                        : lang==='hy' ? (o.name || o.nameEn) : (o.nameEn || o.name));
/* Armenian verjaket is script-specific: Latin and Cyrillic sentences take a plain colon. */
const VJ = () => lang==='hy' ? '՝' : ':';
const isPromo = p => !!S.promos[p.id];
const effPrice = p => isPromo(p) ? Math.round(p.price*0.9) : p.price;
function togglePromo(pid){
  const turningOn = !S.promos[pid];
  if(S.promos[pid]) delete S.promos[pid]; else S.promos[pid]=true;
  logEv(turningOn?'promo_on':'promo_off', {pid});

}
/* ---------- R6 · F1: a notification is a door, not a receipt ----------
   PCHAT  — the open product-chat thread ({key, side}); HILITE — the one-shot "flash this element
   when the page repaints" instruction; EVSEEN — the bell's pre-open unread watermark, so rows
   still render unread after openEvents() has advanced it; TOASTGO — the event key the actionable
   toast's pill would navigate to. */
let PCHAT = null, HILITE = null, EVSEEN = null, TOASTGO = null;
function logEv(type, data){
  S.evCounter = (S.evCounter||0)+1;
  /* uuid is the stable identity the merge and evGo() key on; rts is the real wall clock, which
     S.today (a simulated, rewindable clock) can never be. Both are additive: an event from an
     older peer simply has neither and falls back to the n-based watermark. */
  S.events.unshift({n:S.evCounter,
                    uuid:'e-'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4),
                    rts:Date.now(), type, data:data||{}, date:S.today});
  if(S.events.length>100) S.events.length = 100;
}
function evText(e){
  const d = e.data||{};
  const pn = d.pid ? nm(P(d.pid)) : '';
  const sn = d.sup ? nm(SUP(d.sup)) : '';
  const shn = d.shop ? (d.shop==='me' ? nm(MY_SHOP) : nm(OTHER_SHOPS.find(o=>o.id===d.shop)||MY_SHOP)) : '';
  const map = {

/* ---------- immutable stock ledger (R1 · G1) ----------
   S.moves is append-only: never edited, never re-ordered. On-hand is SUM(dq) and S.stock is
   only a cache of that sum. postMove() is the ONLY way stock is ever allowed to change. */
function uuid4(){ return 'm-'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }
function postMove(m){
  if(!m || !m.pid || !m.type) return false;
  if(!Array.isArray(S.moves)){ S.moves=[]; S.moveSeq=S.moveSeq||0; }
  const uuid = m.uuid || uuid4();
  if(S.moves.some(x=>x && x.uuid===uuid)) return false;   // replaying the same move is a no-op
  const mv = {
    n: ++S.moveSeq,
    uuid,
    ts: m.ts==null ? S.today : m.ts,
    rts: Date.now(),
    pid: m.pid,
    type: m.type,
    dq: +m.dq || 0,
    cost: m.cost==null ? costOf(m.pid) : m.cost,
    ref: m.ref || '',
    reason: m.reason || '',
    actor: m.actor || 'shop',
    note: m.note || '',
    batch: m.batch ? String(m.batch) : ''
  };
  S.moves.push(mv);
  S.stock[mv.pid] = (S.stock[mv.pid]||0) + mv.dq;    // cache, rebuildable at any time
  /* R3 · F1: the ONE choke point where batch quantities ever go down. Batches are a derived
     annotation, so a failure here must never be able to block a ledger move. */
  try{ reconcileBatches(mv.pid, mv.batch, mv.dq < 0 ? -mv.dq : 0); }catch(e){}
  compactMoves();
  return true;
}
function postMoves(arr){ let n=0; (arr||[]).forEach(m=>{ if(postMove(m)) n++; }); return n; }
function rebuildStock(){ const c={}; (S.moves||[]).forEach(m=>{ if(m&&m.pid) c[m.pid]=(c[m.pid]||0)+(+m.dq||0); }); return c; }
function verifyLedger(){
  const rb = rebuildStock(), out=[];
  const pids = {}; Object.keys(S.stock||{}).forEach(k=>pids[k]=1); Object.keys(rb).forEach(k=>pids[k]=1);
  Object.keys(pids).forEach(pid=>{
    const cached = (S.stock||{})[pid]||0, rebuilt = rb[pid]||0;
    if(cached!==rebuilt) out.push({pid, cached, rebuilt});
  });
  return out;
}
const onHand = pid => (S.stock||{})[pid]||0;
function movesFor(pid, limit){
  // oldest first: ts is the business date, n only breaks ties inside the same day. Sorting by ts
  // first is what keeps a collapsed opening balance (see compactMoves) at the top of the list.
  const all = (S.moves||[]).filter(m=>m && m.pid===pid).slice()
    .sort((a,b)=>((a.ts||0)-(b.ts||0)) || ((a.n||0)-(b.n||0)));
  let bal = 0;
  const rows = all.map(m=>{ bal += (+m.dq||0); return Object.assign({}, m, {bal}); });
  return rows.slice(-(limit||50)).reverse();
}

/* keeps localStorage and the D1 sync payload bounded: moves older than 90 days collapse into
   one opening balance per SKU. Totals are preserved exactly, so on-hand never changes. */
function compactMoves(){
  if(!Array.isArray(S.moves) || S.moves.length <= 1500) return;
  const cutoff = S.today - 90*DAY;
  const old = S.moves.filter(m=>m && m.ts < cutoff);
  if(old.length < 2) return;
  const keep = S.moves.filter(m=>m && !(m.ts < cutoff));
  const sums = {}, costs = {};
  old.forEach(m=>{ sums[m.pid] = (sums[m.pid]||0) + (+m.dq||0); if(costs[m.pid]==null) costs[m.pid]=m.cost||0; });
  const opens = [];
  // the collapsed opening balance IS the oldest event for its SKU, so it must sort BEFORE every
  // retained move: number it below the smallest kept n instead of taking a fresh ++S.moveSeq.
  let base = keep.reduce((mn,m)=>Math.min(mn, +m.n||0), 0);
  Object.keys(sums).forEach(pid=>{
    if(!sums[pid]) return;
    opens.push({n:--base, uuid:uuid4(), ts:cutoff, rts:0, pid, type:'open', dq:sums[pid],
                cost:costs[pid]||0, ref:'', reason:'compact', actor:'system', note:''});
  });
  S.moves = opens.concat(keep);
  /* R8 · compaction WAS a purely local act, and mergeMoves() re-adds every local move the remote
     has not seen. A peer that had not compacted therefore re-injected all 1,400 collapsed rows on
     top of the opening balance that already contained them: on-hand 2,992 instead of 1,600, with
     verifyLedger() clean because the cache genuinely equalled the sum of a corrupted union. The
     watermark travels with the state, so the peer can drop exactly the rows already summed. */
  S.compactCut = Math.max(+S.compactCut||0, cutoff);
}

/* preferId = the batch the shopkeeper physically acted on (a Դուրսգրում from the Ժամկետներ tab);
   want = how many units that move took. Those units come off THAT batch, up to what it holds —
   otherwise binning the freshest crate silently deletes the expired one still on the shelf.
   Everything else (sales above all) stays FEFO, which is the right default. */
function reconcileBatches(pid, preferId, want){
  if(!Array.isArray(S.batches) || !S.batches.length) return;
  const list = batchesOf(pid);
  if(preferId && want > 0){
    const b = list.find(x=>x && x.id===preferId);
    if(b) b.left -= Math.min(b.left, Math.floor(want));
  }
  // tracked units may never exceed on-hand: trim the remainder oldest-first
  const have = Math.max(0, onHand(pid));
  let over = list.reduce((a,b)=>a+b.left, 0) - have;
  if(over>0) for(const b of list){
    if(over<=0) break;

  }

/* ---------- VMI: store stock & sell-out ----------
   R8 · velocity used to be "the last 7 days of typed sales, else a static catalogue constant" —
   so the week a 55-year-old stops tapping «Վաճառել» (and he will), «Կվերջանա 1 օրից» quietly
   becomes a fixed guess and nobody is told. Four sources now, best first, and every consumer can
   ask WHICH one answered so the screen can say so out loud:
     typed   — sales recorded in the last 7 days
     recent  — sales recorded in the last 28 days (a shop that records once a week is fine)
     count   — consumption INFERRED from the ledger between the last two Գույքագրում corrections:
               receipts in the window, minus the change in on-hand, over the days elapsed. This is
               the "stop asking him to type sales" path: Ընդունում plus a periodic count is enough.
     book    — the catalogue's own cycle. A guess, and labelled one. */
function velSource(pid){
  const sales = (S.sales||[]).filter(s=>s && s.productId===pid);
  const w7 = sales.filter(s=>s.date >= S.today - 7*DAY).reduce((a,s)=>a+s.qty,0);
  if(w7 > 0) return {v: Math.max(0.2, w7/7), src:'typed'};
  const w28 = sales.filter(s=>s.date >= S.today - 28*DAY).reduce((a,s)=>a+s.qty,0);
  if(w28 > 0) return {v: Math.max(0.2, w28/28), src:'recent'};
  const inf = inferredVel(pid);
  if(inf) return {v: Math.max(0.2, inf.v), src:'count', from:inf.from, days:inf.days};
  const p = P(pid) || {qty:1, cycle:7};

/* consumption between the two most recent count corrections, read straight off the ledger */
function inferredVel(pid){
  const mv = (S.moves||[]).filter(m=>m && m.pid===pid).slice().sort((a,b)=>(a.ts||0)-(b.ts||0));
  const counts = mv.filter(m=>m.type==='count');
  if(!counts.length) return null;
  const last = counts[counts.length-1];
  const start = counts.length>1 ? counts[counts.length-2] : mv[0];
  if(!start || !last || last.ts <= start.ts) return null;
  const days = Math.max(1, Math.round((last.ts - start.ts)/DAY));
  let inflow = 0, outflow = 0;
  mv.forEach(m=>{
    if(m.ts <= start.ts || m.ts > last.ts) return;

  });

function stats(pid){
  const h = S.history.filter(x=>x.productId===pid).sort((a,b)=>a.date-b.date);
  if(!h.length) return null;
  const gaps = []; for(let i=1;i<h.length;i++) gaps.push((h[i].date-h[i-1].date)/DAY);
  gaps.sort((a,b)=>a-b);
  const cycle = gaps.length ? Math.max(2, Math.round(gaps[Math.floor(gaps.length/2)])) : P(pid).cycle;
  const avgQty = Math.round(h.slice(-5).reduce((a,x)=>a+x.qty,0)/Math.min(5,h.length));
  const last = h[h.length-1].date;
  const due = last + cycle*DAY;
  const dueIn = Math.ceil((due - S.today)/DAY);
  return {cycle, avgQty, last, due, dueIn, count:h.length};
}
function suggestions(){
  return PRODUCTS.map(p=>({p, st:stats(p.id)}))
    .filter(x=>x.st && x.st.dueIn <= 1 && !S.dismissed[x.p.id])

}

}
function supAlerts(){
  const out = [];
  PRODUCTS.forEach(p=>{
    const st = stats(p.id); if(!st) return;
    const overdueDays = -st.dueIn;
    if(overdueDays >= st.cycle*2) out.push({type:'churn', p, st, shop:MY_SHOP});
    else if(overdueDays >= Math.max(2, Math.round(st.cycle*0.6))) out.push({type:'overdue', p, st, shop:MY_SHOP});
  });
  out.push({type:'churn', p:P('p2'), st:{cycle:4, dueIn:-9, avgQty:5, last:(S.otherLast||{})['o3'] || (S.today - 12*DAY)}, shop:OTHER_SHOPS[2], other:true});
  return out.filter(a=>!S.reminded[alertKey(a)]);
}

     of one double-tap therefore hit two DIFFERENT actions, so the guard has to be shared: stamp
     the order here and refuse any further transition on it inside the double-tap window. */
  if(o && o.status==='new'){ o._tapTs = Date.now(); o.status='confirmed'; logEv('confirmed',{oid}); toastSaved(saveD(), t('confirmed_msg')); renderAll(); } }
function deliverOrder(oid, qtyMap){
  const o = S.orders.find(x=>x.id===oid); if(!o) return;
  /* R4 · B3: «🚚 Նշել առաքված» re-renders into the pixel box «✓ Հաստատել» just vacated, so on a
     laggy phone one double-tap used to run new→confirmed→delivered, issue the հաշիվ-ապրանքագիր
     and book the debt with no partial-delivery step and no undo. State only ever moves forward
     one step per gesture, and never within the double-tap window. */
  if(o.status==='delivered') return;
  const now = Date.now();
  if(o._tapTs && now - o._tapTs < 700) return;
  o._tapTs = now;
  o.status='delivered';
  o.deliveredTs = S.today;            // ACTUAL delivery — the only honest input to leadStats()
  o.items.forEach(it=>{ it.delivered = qtyMap ? Math.max(0, Math.min(it.qty, qtyMap[it.productId]??it.qty)) : it.qty; });
  if(o.shop.id==='me'){
    /* R1: shipping no longer moves the shop's stock — that would be phantom stock until the
       boxes are actually in the shop. Stock and the purchase-history record are created by
       confirmReceipt() («Ընդունում»). The supplier still issues the հաշիվ-ապրանքագիր here,
       which is how it works in practice; the receipt then matches it or raises a ճշգրտող հաշիվ. */
    const sum = o.items.reduce((a,x)=>a+x.delivered*x.price,0);
    if(sum>0){
      /* R8: the balance is derived from bills − payments (debtsFromBooks) — no running counter */
      S.bills.push({id:o.id.replace('ORD','INV'), sup:o.sup, date:S.today, amount:sum, paid:false,
        items:o.items.filter(x=>x.delivered>0).map(x=>({productId:x.productId, qty:x.delivered, price:x.price}))});
    }
  }
  logEv('delivered',{oid});
  toastSaved(saveD(), t('delivered_msg')); renderAll();
}

function advanceDay(){
  S.today += DAY;
  sweepMarkdowns();                 // a markdown that ran out must stop suppressing reorder
  // simulate the store's consumer sales for the new day
  PRODUCTS.forEach(p=>{
    const q = Math.min(onHand(p.id), Math.round(velOf(p.id) * (0.6 + Math.random()*0.8)));
    if(q>0){ postMove({pid:p.id, type:'sale', dq:-q, actor:'sim'}); S.sales.push({date:S.today, productId:p.id, qty:q}); }
  });
  if(S.sales.length>600) S.sales = S.sales.slice(-500);
  checkStockouts();
  checkExpiry();
  // nudge once, on day 2 — an unreceived delivery is the #1 source of phantom stock
  S.orders.forEach(o=>{ if(o.shop && o.shop.id==='me' && o.status==='delivered' && !o.receipt && recvAge(o)===2) logEv('recv_due',{oid:o.id}); });
  // other shops' shelves sell down too
  OTHER_SHOPS.forEach(o=>{
    const stk = S.shopStock[o.id]; if(!stk) return;
    PRODUCTS.forEach(p=>{
      const q = Math.min(stk[p.id]||0, Math.round(velOfShop(o.id, p.id) * (0.5 + Math.random()*0.9)));
      if(q>0) stk[p.id] -= q;
    });
  });
  if(Math.random() < 0.75){
    const shop = OTHER_SHOPS[Math.floor(Math.random()*OTHER_SHOPS.length)];
    if(shop.id!=='o3'){
      const sup = ['s1','s2','s3'][Math.floor(Math.random()*3)];
      const pool = PRODUCTS.filter(p=>p.sup===sup);
      const items = pool.slice(0, 1+Math.floor(Math.random()*pool.length)).map(p=>({productId:p.id, qty:Math.max(1,p.qty+Math.floor(Math.random()*3)-1), price:p.price}));
      const oid = newId('ORD-');
      S.orders.unshift({id:oid, date:S.today, shop, sup, items, status:'new', deliveryDate:S.today + (1+Math.floor(Math.random()*3))*DAY});
      logEv('order',{oid, shop:shop.id, sup});
      S.otherLast[shop.id] = S.today;
      // their shelf refills when the sim order arrives
      const stk = S.shopStock[shop.id];
      if(stk) items.forEach(it=>{ stk[it.productId] = (stk[it.productId]||0) + it.qty; });
    }
  }
  toastSaved(saveD(), t('day_advanced') + ' ' + fdate(S.today)); renderAll();
}

    <button class="btn ghost full" style="margin-top:9px" onclick="startFresh()">🗑 ${t('rec_fresh')}</button>
    <div class="muted" style="margin-top:12px;font-size:14px">${escH(String(err && err.message || err || ''))}</div>

function renderAllInner(fromSync){
  lang = U.lang;
  if(!AUTHD){ renderLogin(); return; }
  if(roleLocked()){ U.split = false; U.role = AUTHD.role==='sup' ? 'supplier' : 'shop'; }
  document.getElementById('top').innerHTML = topBar();
  const desktop = window.innerWidth>=980;
  document.body.classList.toggle('single-mobile', !U.split && !desktop);
  const app = document.getElementById('app');
  const nav = document.getElementById('nav');

  if(U.split){
    nav.style.display='none';
    app.innerHTML = notifBanner() + `<div class="split is-two">
      <section class="pane glass" data-role="shop">${paneHead('shop')}<div class="panebody">${viewFor('shop',U.tab.shop)}</div></section>
      <div class="flowmark">⇄</div>
      <section class="pane glass" data-role="supplier">${paneHead('supplier')}<div class="panebody">${viewFor('supplier',U.tab.supplier)}</div></section>
    </div>`;
  } else {
    const role=U.role;
    const cls = desktop ? 'single-desk' : '';
    app.innerHTML = notifBanner() + (roleLocked()
      ? `<div class="acctline">${role==='shop'?'🏪 '+nm(MY_SHOP):'🚚 '+t('supplier')}</div>`
      : `<div class="roleswitch">
        <button class="${role==='shop'?'active':''}" onclick="setRole('shop')">🏪 ${t('shop')}</button>
        <button class="${role==='supplier'?'active':''}" onclick="setRole('supplier')">🚚 ${t('supplier')}</button>
      </div>`)
      + (desktop ? singleTabs(role) : '')
      + `<main class="${cls}${(()=>{ const k = role+'|'+U.tab[role]+'|'+lang; const ch = k!==VIEWKEY; VIEWKEY=k; return ch?' anim':''; })()}">${viewFor(role,U.tab[role])}</main>`;
    renderNav(role);
    nav.style.display = desktop ? 'none' : 'flex';
  }

  // flash supplier pane when a new order arrives (the "flow")
  const inboxN = S.orders.filter(o=>o.status==='new').length;
  if(prevInboxN!==null && inboxN>prevInboxN){
    const sp=document.querySelector('[data-role="supplier"]');
    if(sp){ sp.classList.remove('flash'); void sp.offsetWidth; sp.classList.add('flash'); }
    if(fromSync) toast(t('new_order_in'));
  }
  prevInboxN = inboxN;
  // flash shop pane + notify when MY order gets confirmed/delivered
  const myConf = S.orders.filter(o=>o.shop.id==='me'&&o.status==='confirmed').length;
  const myDel  = S.orders.filter(o=>o.shop.id==='me'&&o.status==='delivered').length;
  if(prevMy){
    if(myDel>prevMy.del) notifyShop(t('you_delivered'));
    else if(myConf>prevMy.conf) notifyShop(t('you_confirmed'));
  }
  prevMy = {conf:myConf, del:myDel};
  // shop-side: new proposal or new promo arrived
  const propN = S.proposals.length;
  const promoN = Object.keys(S.promos).length;
  if(prevPP){
    if(propN>prevPP.prop) notifyShop(t('prop_new'));
    else if(promoN>prevPP.promo) notifyShop(t('promo_new'));
  }
  prevPP = {prop:propN, promo:promoN};
  // generic: anything new arrived from the other device → sound + OS notification
  const evN = S.evCounter||0;
  if(prevEvN!=null && evN>prevEvN && fromSync){
    beep();
    /* R7: the same visibility rule as the bell — a role-locked supplier must not be woken by an
       OS notification about a write-off he cannot open. */
    const fresh = S.events.filter(e=>e.n>prevEvN && evVisible(e)).slice(0,2);
    fresh.forEach(e=>{ const [ic,txt]=evText(e); osNotify(ic+' '+txt); if(document.hidden) return; });
    if(fresh.length && !document.hidden){
      const e0 = fresh[0], [ic,txt] = evText(e0), msg = ic+' '+txt;
      /* only offer the pill when the event actually has somewhere this user can go */
      if(evGoTarget(e0)) toastGo(msg, evKey(e0)); else toast(msg);
    }
  }
  prevEvN = evN;
  try{ applyHilite(); }catch(e){}
}
let prevPP = null, prevEvN = null;

function notifyShop(msg){
  const sp=document.querySelector('[data-role="shop"]');
  if(sp){ sp.classList.remove('flash'); void sp.offsetWidth; sp.classList.add('flash'); }
  toast(msg);
}
/* R9 · nav labels may never shrink below 14px, so the number of destinations in the strip is
   measured, not guessed: whatever fits WHOLE at 14px in the current language stays in the bar,
   everything else moves into the «Ավելին» sheet, which carries their badges too. */
let NAVMC = null;
function navTextW(txt){
  try{
    if(!NAVMC) NAVMC = document.createElement('canvas').getContext('2d');
    const cs = getComputedStyle(document.body);
    NAVMC.font = '600 14px ' + cs.fontFamily;
    return NAVMC.measureText(txt).width;
  }catch(e){ return txt.length * 8; }
}
/* order of surrender: the four screens of the daily loop are the last to leave the bar */
const NAV_PRIO = {
  shop:     ['home','recv','pos','basket','orders','exp','catalog','count','debts','data'],
  supplier: ['dash','inbox','sellout','alerts','shops','catalog','data']
};
function navItems(role){
  const basketN = Object.keys(S.basket).length;
  const inboxN = S.orders.filter(o=>o.status==='new').length;
  const myActiveN = S.orders.filter(o=>o.shop.id==='me'&&o.status!=='delivered').length;
  const alertsN = supAlertTotal();
  return role==='shop'
    ? [['home','📋',S.proposals.length],['recv','📥',pendingReceipts().length],['count','🧮',countNavBadge()],['exp','🗓',expActionCount()],['catalog','🛒',pcUnreadTotal('shop')],['pos','💵'],['basket','🧺',basketN],['orders','📦',myActiveN],['debts','💳'],['data','📈']]
    : [['dash','📊'],['sellout','📉',PRODUCTS.filter(p=>stockDays(p.id)<=2).length],['inbox','📥',inboxN],['shops','🏪'],['alerts','🔔',alertsN],['catalog','🏷'],['data','📈']];
}
function navPlan(role, items, labels, W){
  const prio = NAV_PRIO[role] || items.map(x=>x[0]);
  const act = U.tab[role];
  const moreW = navTextW(t('more_tab'));
  for(let k=items.length; k>=1; k--){
    let keys = prio.slice(0,k);
    /* "you are here" may never be hidden: the open tab buys its way in at the bottom's expense */
    if(keys.indexOf(act)<0 && prio.indexOf(act)>=0){ keys = keys.slice(0,Math.max(1,k-1)); keys.push(act); }
    const cells = k + (k<items.length ? 1 : 0);
    const cw = (W / cells) - 4;
    if(cw < 40) continue;
    const ok = keys.every(kk => navTextW(labels[kk]) <= cw) && (k>=items.length || moreW <= cw);
    if(ok) return keys;
  }
  return [prio[0]];
}
function renderNav(role){
  const items = navItems(role);
  const labels = role==='shop' ? T[lang].tabs_shop : T[lang].tabs_sup;
  const nv = document.getElementById('nav');
  const W = nv.clientWidth || window.innerWidth || 390;
  const keys = navPlan(role, items, labels, W);
  const shown = keys.map(k=>items.find(x=>x[0]===k)).filter(Boolean);
  const hidden = items.filter(x=>keys.indexOf(x[0])<0);
  NAV_MORE = {role, hidden};
  const hiddenBadge = hidden.reduce((a,x)=>a+(x[2]||0),0);
  nv.className = 'cols'+(shown.length + (hidden.length?1:0));
  nv.innerHTML = shown.map(([k,ic,badge])=>`
    <button class="${U.tab[role]===k?'active':''}" aria-label="${escH(labels[k])}" onclick="paneTab('${role}','${k}')">
      ${badge?`<span class="navbadge">${badge}</span>`:''}
      <span class="icw">${ic}</span><span>${labels[k]}</span>
    </button>`).join('')
    + (hidden.length ? `
    <button aria-label="${escH(t("menu_title"))}" onclick="openMoreNav()">
      ${hiddenBadge?`<span class="navbadge">${hiddenBadge}</span>`:''}
      <span class="icw">☰</span><span>${t('more_tab')}</span>
    </button>` : '');
}

/* R4 · the headline claim is that every suggested quantity shows a human reason. The supplier's
   proposal had none, and could contradict the app's own replenishment card on the same screen. */
function propWhy(pr){
  const st = stats(pr.productId);
  const cyc = st ? st.cycle : ((P(pr.productId)||{}).cycle || 7);
  let out = `<div class="sub muted">${fmt('prop_why',{c:cyc})}</div>`;
  const r = replenish().find(x=>x.pid===pr.productId);
  if(r){
    const mine = repQtyOf(r);
    out += `<div class="sub muted">${repReason(r)}${mine!==pr.qty
      ? ` · <button class="btn small ghost" style="width:auto;padding:2px 9px" onclick="setPropQty('${pr.id}',${mine})">${fmt('prop_mine',{n:mine})}</button>`
      : ''}</div>`;
  }
  return out;
}

function orderTracker(status){
  const steps=['new','confirmed','delivered'];
  const idx=steps.indexOf(status);
  const node=i=> i<idx ? 'done' : (i===idx ? (idx===2?'done':'now') : '');
  const icons=['📝','✓','🚚'];
  return `<div class="otrack">
    <div class="onode ${node(0)}">${idx>0?'✓':icons[0]}</div><div class="oline ${idx>=1?'done':''}"></div>
    <div class="onode ${node(1)}">${idx>1?'✓':icons[1]}</div><div class="oline ${idx>=2?'done':''}"></div>
    <div class="onode ${node(2)}">${icons[2]}</div>
  </div>
  <div class="olabels"><span class="${idx>=0?'on':''}">${t('st_new')}</span><span class="${idx>=1?'on':''}">${t('st_confirmed')}</span><span class="${idx>=2?'on':''}">${t('st_delivered')}</span></div>`;
}

     author line at weight 800 and opacity .7, and its own timestamp size. The product thread
     already had .msg / .bub / .who / .when for exactly this, so the two chats in one app rendered
     as two different chats. They are one component now. */
  const msgs = (o.messages||[]).map(m=>`
    <div class="msg ${m.from===CHAT.side?'mine':''} ${m.from==='shop'?'byshop':'bysup'}">
      <div class="bub">
        <div class="who">${m.from==='shop'?'🏪 '+t('shop'):'🚚 '+t('supplier')}</div>
        ${escH(m.text)}

function sendChat(){

     text — and cap it, like the write-off note (80) and the counter name (60). */
  const txt = (inp.value||'').trim().slice(0,400); if(!txt) return;
  const o = S.orders.find(x=>x.id===CHAT.oid); if(!o) return;
  (o.messages = o.messages||[]).push({from:CHAT.side==='sup'?'sup':'shop', text:txt, date:S.today});

/* ================= R6 · F2 — «Չատ ապրանքի մասին» (per-product chat) =================
   A thread is keyed (shop × product). It is entirely separate from o.messages: openChat(),
   renderChat() and sendChat() above are not modified in any way, not even to share CSS.

   INVARIANT A — the trust tripwire. The thread sheet is rendered by ONE function with no `side`
   branch in its header, its context line or its message list. There is therefore no code path
   that can show one side more than the other. The context line renders product name, unit and
   on-hand — all three already disclosed to the supplier by vSupSellout() — and NO ֏ figure of
   any kind: no effPrice(), no mdOf(), no expAmd(), no costOf().

   Threads exist only for shop 'me'. OTHER_SHOPS are simulation fixtures with no device and no
   operator; giving them threads would produce questions that can never be answered — the exact
   failure mode this feature exists to prevent. */
const pcKey = (shop, pid) => String(shop)+'|'+String(pid);
const pcThread = key => ((S && S.pchats) || {})[key] || null;
function pcEnsure(shop, pid){
  if(shop!=='me' || !P(pid)) return null;
  if(!S.pchats || typeof S.pchats!=='object' || Array.isArray(S.pchats)) S.pchats = {};
  const k = pcKey(shop, pid);
  if(!S.pchats[k] || typeof S.pchats[k]!=='object') S.pchats[k] = {shop:'me', pid, sup:(P(pid)||{}).sup||'s1', msgs:[]};
  if(!Array.isArray(S.pchats[k].msgs)) S.pchats[k].msgs = [];
  return S.pchats[k];
}
/* shallow copies carrying their own key: every consumer only reads, and nothing extra is ever
   written back into the synced state. */
function pcThreads(){
  const o = (S && S.pchats) || {};
  /* R7 · second layer. migrate() drops a foreign-shop thread on the way in; this drops it on the
     way out, so no surface can ever attribute another shop's question to «Նռան այգի» — not even
     between a hostile room payload landing and the next migrate(). */
  return Object.keys(o).map(k=>{ const th=o[k];
    return (th && Array.isArray(th.msgs) && th.msgs.length
            && String(k).split('|')[0]==='me' && th.shop==='me' && P(th.pid))
      ? {key:k, shop:'me', pid:th.pid, sup:th.sup, msgs:th.msgs} : null; }).filter(Boolean);
}
function pcLast(th){ const m = th && th.msgs; return (m && m.length) ? m[m.length-1] : null; }
function pcUnanswered(th){ const l = pcLast(th); return !!l && l.from==='shop'; }
/* oldest first — the question that has waited longest is what the one primary button opens */
function unansweredAsks(){
  return pcThreads().filter(pcUnanswered)
    .sort((a,b)=>{ const la=pcLast(a), lb=pcLast(b);
      return ((la.ts||0)-(lb.ts||0)) || ((la.rts||0)-(lb.rts||0)); });
}
function pcWaitDays(th){ const l = pcLast(th); return l ? Math.max(0, Math.round((S.today - (l.ts||S.today))/DAY)) : 0; }
const pcSeenKey = (side, key) => side+'|'+key;
function pcUnread(side, key){
  const th = pcThread(key); if(!th || !Array.isArray(th.msgs)) return 0;
  const other = side==='sup' ? 'shop' : 'sup';
  const w = ((U.pcSeen||{})[pcSeenKey(side, key)]) || 0;
  return th.msgs.filter(m=>m && m.from===other && (+m.rts||0) > w).length;
}
/* R7: iterates the FILTERED thread list, so a foreign-shop thread can no longer pin a red badge
   on the Կատալոգ / Ազդանշաններ tab that no sheet in the app is able to clear. */
function pcUnreadTotal(side){ return pcThreads().reduce((a,th)=>a+pcUnread(side,th.key), 0); }
function pcMarkRead(side, key){
  const th = pcThread(key); if(!th) return;
  if(!U.pcSeen || typeof U.pcSeen!=='object') U.pcSeen = {};
  const kk = pcSeenKey(side, key);
  const mx = (th.msgs||[]).reduce((m,x)=>Math.max(m, +x.rts||0), 0);
  U.pcSeen[kk] = Math.max(U.pcSeen[kk]||0, mx);

}

/* ----- returns ----- */
let RET = null;
function openReturn(oid){

/* You can only send back what you actually took in AND still have on the shelf: the ceiling is
   the RECEIVED quantity (o.receipt.lines) minus anything already returned, capped by on-hand. */
function retMax(o, it){
  const pid = it.productId;
  const shipped = it.delivered!=null ? it.delivered : it.qty;
  let got = shipped;
  const lines = o.receipt && Array.isArray(o.receipt.lines) ? o.receipt.lines : null;
  if(lines && lines.length){
    const l = lines.find(x=>x && x.pid===pid);
    got = l ? Math.max(0, +l.received||0) : 0;
  }
  const already = Math.max(0, +((o.returns||{})[pid]) || 0);
  return Math.max(0, Math.min(got - already, onHand(pid)));
}

function retQty(pid, d){

  const it = o.items.find(x=>x.productId===pid); if(!it) return;

  // re-clamp at confirm time: the sheet may have been open while another tab sold the stock

  o.items.forEach(it=>{ q[it.productId] = Math.max(0, Math.min(RET.q[it.productId]||0, retMax(o,it))); });

/* ----- Ընդունում · goods receipt from the delivered order (R1 · F2) ----- */
let RECV = null;
/* R8 · the LEDGER decides whether a delivery has been taken in, not a flag stored beside it.
   `o.receipt` used to be the only test, and it is the field a sync conflict could drop while the
   receipt's ledger move survived — which put the delivery back on this screen and let the
   shopkeeper receive the same ten cartons twice. */
function receiptMovesFor(oid, st){ return (((st||S)||{}).moves||[]).filter(m=>m && m.type==='receipt' && m.ref===oid); }
function pendingReceipts(){
  return S.orders.filter(o=>o && o.shop && o.shop.id==='me' && o.status==='delivered' && !o.receipt
                            && !receiptMovesFor(o.id).length)
    .sort((a,b)=>(a.deliveryDate||a.date)-(b.deliveryDate||b.date));
}
/* R8 · cross-model repair, run after every adopt/merge. verifyLedger() only ever compared the
   cache to the sum of the moves, which is trivially true after any rebuildStock() — it reported
   "0 problems" while on-hand was wrong by a whole delivery. This checks the invariant that
   actually matters: every receipt move belongs to an order that carries a receipt stamp and a
   purchase-history row. Where the stamp is missing it is rebuilt FROM the ledger rather than
   guessed at, so the document trail cannot be quietly lost by a merge. */
function healReceipts(st){
  st = st || S; if(!st) return 0;
  let fixed = 0;
  (st.orders||[]).forEach(o=>{
    if(!o || !o.shop || o.shop.id!=='me' || o.receipt) return;
    const mv = receiptMovesFor(o.id, st);
    if(!mv.length) return;
    const lines = mv.map(m=>{
      const it = (o.items||[]).find(x=>x.productId===m.pid) || {};
      const shipped = it.delivered!=null ? it.delivered : (it.qty||m.dq);
      return {pid:m.pid, shipped, received:m.dq, diff:m.dq-shipped, price:m.cost||it.price||0, reason:m.reason||''};
    });
    const h = (st.history||[]).find(x=>x && x.doc && x.doc.order===o.id);
    o.receipt = {ts: mv[0].ts||o.deliveryDate||o.date, rts: mv[0].rts||0,
                 doc: (h && h.doc) ? Object.assign({}, h.doc) : null,
                 lines, diff: lines.reduce((a,l)=>a+l.diff*l.price, 0), actor:'system', healed:true};
    fixed++;
  });
  return fixed;
}
/* the cross-model audit itself, surfaced in ⚙ and used by the tests: a receipt move with no
   history row is undocumented stock and the shopkeeper is entitled to know about it. */
function crossCheck(){

        <button onclick="recvQty('${pid}',1)">+</button>

  const docVal = (lbl, val) => `<div class="row" style="padding:7px 0"><span class="muted">${lbl}</span><b class="num">${escH(val)}</b></div>`;
  const docEdit = (lbl, val, key, numeric) => `<div class="row" style="padding:7px 0;gap:12px"><span class="muted" style="flex:0 0 auto">${lbl}</span>
    <input class="search" style="margin:0;flex:1;text-align:right" ${numeric?'inputmode="numeric"':''} maxlength="${key==='tin'?8:40}" value="${escH(val)}" oninput="recvDocSet('${key}',this.value)"></div>`;
  return `<div class="row" style="margin-bottom:12px">
    <button class="btn small ghost" onclick="closeReceipt()">← ${t('close')}</button>
    <span class="muted">${sup.em} ${nm(sup)} · <span class="num">${escH(o.id)}</span></span>
  </div>
  <div class="card">

/* ----- Դուրսգրում · write-off with mandatory reason codes (R1 · F3) ----- */
let WO = null;
const WO_CODES = ['expired','damaged','theft','own','fix'];
/* opts is optional, so every R1/R2 call site (openItemSheet) keeps working unchanged; R3's
   «Դուրսգրում (ժամկետանց)» pre-fills the batch quantity and the Ժամկետանց reason. */
/* R4 · MD: a batch-scoped sheet headed «Խմբաքանակ B-1 · 4 օգս» that then says «Մնացորդ 20 հատ»
   and steps to 20 invites writing off 20 kg of yogurt to bin one expired unit. */
function woBatch(){ return WO && WO.batch ? (S.batches||[]).find(x=>x && x.id===WO.batch && x.pid===WO.pid && x.left>0) : null; }
function woCap(){ const b = woBatch(); return Math.max(1, b ? b.left : onHand(WO.pid)); }
function openWriteoff(pid, opts){
  const b0 = (opts && opts.batch) ? (S.batches||[]).find(x=>x && x.id===String(opts.batch) && x.pid===pid && x.left>0) : null;
  const cap = Math.max(1, b0 ? b0.left : onHand(pid));
  const q = Math.max(1, Math.min(cap, Math.floor(+((opts&&opts.qty))||1)));
  WO = {pid, qty:q, reason:(opts && WO_CODES.indexOf(opts.reason)>=0) ? opts.reason : '', note:'', err:false,
        batch:(opts && opts.batch) ? String(opts.batch) : ''};
  renderWriteoff();
}
function renderWriteoff(){ MODAL_RE=()=>renderWriteoff(); armPushOverlay();
  if(!WO) return;
  const pid = WO.pid, p = P(pid); if(!p) return;
  const im = itemMeta(pid), have = onHand(pid);
  const body = have<=0
    ? `<div class="empty"><span class="em">📦</span>${t('wo_nostock')}</div>`
    : `<div class="row" style="margin:12px 0 2px"><span class="muted">${woBatch()?t('exp_batch_left'):t('onhand_lbl')}</span>
        <span><span class="big num">${woBatch()?woBatch().left:have}</span> <span class="muted">${unitOf(pid)}</span></span></div>
      <div class="qtyctl" style="transform:scale(1.15);margin:14px auto;width:max-content">
        <button onclick="woQty(-1)">−</button><span>${WO.qty}</span><button onclick="woQty(1)">+</button></div>
      <div class="sec">${t('wo_reason')}</div>
      ${WO.err?`<div class="fielderr">${t('wo_reason_req')}</div>`:''}
      <div class="chips wrap">${WO_CODES.map(c=>`<button class="${WO.reason===c?'active':''}" onclick="woReason('${c}')">${t(REASON_KEY[c])}</button>`).join('')}</div>
      <input id="woNote" class="search" style="margin-top:8px" maxlength="80" placeholder="${t('wo_note')}" value="${escH(WO.note||'')}" oninput="woNote(this.value)">
      <button class="btn danger full" style="margin-top:6px" onclick="confirmWriteoff()">✓ ${t('wo_confirm')}</button>`;
  // the note input is recreated on every render, so hand focus + caret back to it
  const ae = document.activeElement;
  const keepNote = !!(ae && ae.id==='woNote');
  const caret = keepNote ? ae.selectionStart : null;
  document.getElementById('modalRoot').innerHTML = `<div class="modal" onclick="if(event.target===this){WO=null;closeModal()}">
    <div class="mbody"><div class="grabber"></div><h3>📉 ${t('wo_title')}</h3>
    <div class="muted">${p.em} ${goodNameOf(pid)}${(()=>{ const b=(S.batches||[]).find(x=>x && x.id===WO.batch);
      return b ? ` · ${t('exp_batch')} ${escH(b.id)}${b.exp!=null?' · '+fdateY(b.exp):''}` : ''; })()}</div>
    ${body}
    <button class="btn ghost full" style="margin-top:9px" onclick="WO=null;closeModal()">${t('close')}</button></div></div>`;
  if(keepNote){ const el = document.getElementById('woNote');
    if(el){ el.focus(); try{ el.setSelectionRange(caret, caret); }catch(e){} } }
}
function woQty(d){ if(!WO) return; WO.qty = Math.max(1, Math.min(woCap(), WO.qty + d)); renderWriteoff(); }
function woReason(code){ if(!WO) return; WO.reason = code; WO.err = false; renderWriteoff(); }
function woNote(v){ if(WO) WO.note = v; }   // no re-render: keeps the caret where the user left it
function confirmWriteoff(){
  if(!WO) return;
  if(!WO.reason){ WO.err = true; toast(t('wo_reason_req')); renderWriteoff(); return; }
  const pid = WO.pid, have = onHand(pid);
  // another tab may have sold the last unit while this sheet sat open — refuse, never post −1
  if(have<=0){ WO = null; closeModal(); toast(t('wo_nostock')); renderAll(); return; }
  const qty = Math.max(1, Math.min(have, WO.qty));
  const wb = (S.batches||[]).find(b=>b && b.id===WO.batch && b.pid===pid && b.left>0);
  postMove({pid, type:'writeoff', dq:-qty, cost:(wb && wb.cost) ? wb.cost : costOf(pid), ref:'',
            reason:WO.reason, note:String(WO.note||'').slice(0,80), actor:'shop', batch:wb ? wb.id : ''});
  /* NEVER push to S.sales here. Spoilage is not demand — keeping it out of S.sales is what
     stops a broken bottle from inflating velOf() and every future order suggestion. */
  logEv('writeoff',{pid, qty, reason:WO.reason});
  checkStockouts();
  WO = null; closeModal(); toastSaved(saveD(), '−'+qty+' · '+t('wo_done')); renderAll();
}
function shrinkSummary(mk){
  mk = mk || monthKey(S.today);
  const byReason = {}; let units = 0, val = 0;
  (S.moves||[]).forEach(m=>{
    if(!m || m.type!=='writeoff' || monthKey(m.ts)!==mk) return;
    const u = Math.abs(+m.dq||0), a = u*(+m.cost||0), r = m.reason||'fix';
    byReason[r] = byReason[r] || {units:0, amd:0};
    byReason[r].units += u; byReason[r].amd += a;
    units += u; val += a;
  });
  const spend = (S.history||[]).filter(h=>monthKey(h.date)===mk).reduce((a,h)=>a+h.qty*h.price, 0);
  return {byReason, units, amd:val, pct: spend ? val/spend*100 : 0};
}
function writeoffCard(){
  const s = shrinkSummary();
  if(!s.units) return `<div class="card"><h3>📉 ${t('shrink_title')} · ${t('shrink_month')}</h3>
    <div class="empty"><span class="em">✅</span>${t('shrink_none')}</div></div>`;
  const rows = WO_CODES.filter(c=>s.byReason[c]).map(c=>`<div class="row" style="padding:7px 0">
    <span class="muted">${t(REASON_KEY[c])}</span>
    <span><b class="num">${s.byReason[c].units}</b> ${t('shrink_units')} · <b class="num">${Math.round(s.byReason[c].amd).toLocaleString('en-US')}<span class="cur">֏</span></b></span></div>`).join('');
  return `<div class="card"><h3>📉 ${t('shrink_title')} · ${t('shrink_month')}</h3>${rows}
    <div class="row" style="border-top:1px solid var(--stroke2);padding-top:10px;margin-top:8px">
      <b>${t('shrink_total')}</b>
      <span><b class="num">${s.units}</b> ${t('shrink_units')} · <b class="num">${Math.round(s.amd).toLocaleString('en-US')}<span class="cur">֏</span></b></span></div>
    <div class="muted" style="margin-top:7px">${t('shrink_cost')} · ${s.pct.toFixed(1)}% ${t('shrink_share')}</div></div>`;
}

/* ================= R3 · F2 — «Ժամկետներ»: the near-expiry ACTION screen =================
   A list you can only look at is worthless. Every row here ends in a markdown, a Դուրսգրում or a
   request to the supplier, and the whole screen collapses into ONE card on Այսօր — never one
   alert per item, which is the alert-inflation failure mode. */
let EXPUI = {batch:null, pct:30};
function expWarnDays(pid){ const sl = shelfLifeOf(pid); return sl ? Math.min(14, Math.max(2, Math.round(sl*0.30))) : 7; }
function expDaysLeft(b){ return (!b || b.exp==null) ? null : Math.floor((b.exp - S.today)/DAY); }
function expState(b){
  if(!b || b.exp==null) return 'none';
  const d = expDaysLeft(b);
  if(d < 0) return 'expired';
  if(d <= 1) return 'crit';
  if(d <= expWarnDays(b.pid)) return 'soon';
  return 'ok';
}
function expBadge(b){
  const st = expState(b);
  if(st==='none') return `<span class="badge b-neutral">${t('exp_unknown')}</span>`;
  const d = expDaysLeft(b);
  if(st==='expired') return `<span class="badge b-rose">${t('exp_group_over')}</span>`;
  if(d===0) return `<span class="badge b-rose">${t('exp_last_day')}</span>`;
  const cls = st==='crit' ? 'b-rose' : st==='soon' ? 'b-gold' : 'b-neutral';
  return `<span class="badge ${cls}">${fmt('exp_left',{n:d})}</span>`;
}
/* the batch already stores what was actually paid for it (addBatch); costOf() — the LAST receipt
   cost — is only the fallback for a batch that arrived without one */
function expAmd(b){
  if(!b || !(b.left>0)) return 0;
  const c = (typeof b.cost==='number' && isFinite(b.cost) && b.cost>0) ? b.cost : costOf(b.pid);
  return b.left * c;
}
const EXP_RANK = {expired:0, crit:1, soon:2};
function expRows(){
  const all = (S.batches||[]).filter(b=>b && b.left>0 && EXP_RANK[expState(b)]!=null)
    .sort((a,b)=>(EXP_RANK[expState(a)] - EXP_RANK[expState(b)]) || (expAmd(b) - expAmd(a)));
  return {all, rows: all.slice(0,20), total: all.length};
}
function expAmdAtRisk(){ return expRows().all.reduce((a,b)=>a + expAmd(b), 0); }
function expActionCount(){
  return (S.batches||[]).filter(b=>{ const s = b && b.left>0 ? expState(b) : 'ok'; return s==='expired' || s==='crit'; }).length;
}
function nearestExpOf(pid){ return batchesOf(pid).filter(b=>b.exp!=null)[0] || null; }
/* one event per batch, ever — an expiry that logged yesterday must not log again today */
function checkExpiry(){
  if(!S.expFlag || typeof S.expFlag!=='object') S.expFlag = {};
  const live = {};
  /* R9 · one event per BATCH meant «🗓 Ժամկետը մոտենում է՝ Մածուն 1կգ» three times on the same
     date in a feed he is meant to trust and act on. The shelf has one problem — Մածուն — so the
     feed gets one row, carrying the batch count and the soonest date. */
  const fresh = {};
  (S.batches||[]).forEach(b=>{
    if(!b || !(b.left>0)) return;
    live[b.id] = 1;
    const st = expState(b);
    if((st==='expired' || st==='crit') && !S.expFlag[b.id]){
      S.expFlag[b.id] = true;
      const d = expDaysLeft(b);
      const f = fresh[b.pid] || (fresh[b.pid] = {n:0, d:d, id:b.id});
      f.n++;
      if(d < f.d){ f.d = d; f.id = b.id; }
    }
  });
  Object.keys(fresh).forEach(pid=>{
    const f = fresh[pid];
    /* a single batch keeps its direct route into that batch's sheet; a group routes to the SKU */
    logEv('exp', f.n>1 ? {pid, d:f.d, nb:f.n} : {pid, id:f.id, d:f.d});
  });
  Object.keys(S.expFlag).forEach(k=>{ if(!live[k]) delete S.expFlag[k]; });
}
/* The SHOP's own retail markdown. NOT S.promos — that is the supplier's −10% on the purchase
   price and is rendered on the supplier console. A markdown is a shop pricing decision and
   deliberately logs NO event, because S.events renders on both sides. */
/* A markdown suppresses reorder, so it must never be a one-way door: it runs out on its own
   after MD_DAYS and can always be ended from the item card (R3 defect fix). */
const MD_DAYS = 14;
function mdDaysLeft(m){
  if(!m || typeof m!=='object') return 0;
  const ts = (typeof m.ts==='number' && isFinite(m.ts)) ? m.ts : S.today;
  return Math.max(0, MD_DAYS - Math.floor((S.today - ts)/DAY));
}
function mdOf(pid){
  const m = (S.markdowns||{})[pid];
  if(!m || typeof m!=='object') return null;
  return mdDaysLeft(m) > 0 ? m : null;     // expired markdowns read as absent; sweepMarkdowns() clears them
}
function mdActive(pid){ return !!mdOf(pid); }
function sweepMarkdowns(){
  if(!S.markdowns || typeof S.markdowns!=='object') return 0;
  let n = 0;
  Object.keys(S.markdowns).forEach(pid=>{ if(mdDaysLeft(S.markdowns[pid])<=0){ delete S.markdowns[pid]; n++; } });
  return n;
}
function setMarkdown(pid, pct){
  if(!P(pid)) return;
  if(!S.markdowns || typeof S.markdowns!=='object') S.markdowns = {};
  S.markdowns[pid] = {pct: [20,30,50].indexOf(+pct)>=0 ? +pct : 30, ts:S.today, from:'exp'};
  toastSaved(saveD(), '🏷 '+t('md_done')); renderAll();
}
function clearMarkdown(pid){
  if(S.markdowns) delete S.markdowns[pid];
  toastSaved(saveD(), t('md_off')); renderAll();
}

/* ================= R3 · F3 — the supplier half of the loop =================
   Hard boundary: the supplier sees product name, quantity and days-to-expiry. Never a selling
   price, never a margin, never an ֏ figure derived from the shop's stock. */
let REQUI = {pid:null, kind:'exp', qty:1};
function openReqs(){ return (S.swapReqs||[]).filter(r=>r && r.status==='open'); }
function reqFor(pid){ const l = (S.swapReqs||[]).filter(r=>r && r.pid===pid); return l.length ? l[l.length-1] : null; }
function reqBadge(pid){
  const r = reqFor(pid); if(!r) return '';
  if(r.reply==='swap') return ` <span class="badge b-green">${t('req_r_swap')}</span>`;
  if(r.reply==='back') return ` <span class="badge b-green">${t('req_r_back')}</span>`;
  if(r.reply==='no')   return ` <span class="badge b-neutral">${t('req_r_no')}</span>`;
  return r.status==='open' ? ` <span class="badge b-violet">📨 ${t('req_open_badge')}</span>` : '';
}
function openReqSheet(pid, kind){
  const p = P(pid); if(!p) return;
  const ex = openReqs().filter(r=>r.pid===pid)[0];
  if(ex){ toast(t('req_dup')); renderReqSheet(ex); return; }
  const k = kind==='dead' ? 'dead' : 'exp';
  const nb = nearestExpOf(pid);
  const want = k==='dead' ? onHand(pid) : ((nb && nb.left) || onHand(pid));
  REQUI = {pid, kind:k, qty: Math.max(1, Math.min(Math.max(1, onHand(pid)), want || 1))};
  renderReqSheet(null);
}
function reqQty(d){
  if(!REQUI || !REQUI.pid) return;
  REQUI.qty = Math.max(1, Math.min(Math.max(1, onHand(REQUI.pid)), (+REQUI.qty||1) + d));
  renderReqSheet(null);
}
function renderReqSheet(existing){ MODAL_RE=()=>renderReqSheet(existing); armPushOverlay();
  const pid = existing ? existing.pid : REQUI.pid;
  const p = P(pid); if(!p) return;

  const body = existing
    ? `<div class="row" style="margin:14px 0"><span class="muted">${existing.kind==='dead'?t('req_kind_dead'):t('req_kind_exp')}</span>

  document.getElementById('modalRoot').innerHTML = `<div class="modal" onclick="if(event.target===this)closeModal()">
    <div class="mbody"><div class="grabber"></div>
