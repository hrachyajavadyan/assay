<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A0F1E">
<link rel="manifest" href="manifest.json">
<title>ArmTrade — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+Armenian:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080C18; --ink:#EDF1FA; --muted:#93A0BD; --dim:#5E6D8C; --sep:var(--sep);
  --gold:#E39A3B; --gold2:#F7C572;
  --cyan:#22D3EE; --green:#34D399; --rose:#FB7185; --violet:#A78BFA; --blue:#60A5FA;
  --glass:rgba(255,255,255,.055); --glass2:rgba(255,255,255,.09);
  --stroke:rgba(255,255,255,.11); --stroke2:rgba(255,255,255,.18);
  --r:18px;
  --font:'Inter','Noto Sans Armenian',-apple-system,sans-serif;
  --display:'Space Grotesk','Noto Sans Armenian',sans-serif;
  --mono:'IBM Plex Mono',menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* the canvas colour must come from BODY alone. html carrying its own background blocks CSS's
   background-propagation rule, so body.light's #F5F6F8 never painted the area below a short
   page and the dark :root --bg showed through as a black band on every empty screen. */
html{margin:0;padding:0}
body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;-webkit-font-smoothing:antialiased}
/* bright ambient glows */
body::before{content:"";position:fixed;inset:0;z-index:-2;background:
  radial-gradient(60vw 50vh at 12% -8%, rgba(227,154,59,.22), transparent 60%),
  radial-gradient(55vw 50vh at 96% 4%, rgba(167,139,250,.20), transparent 60%),
  radial-gradient(70vw 60vh at 50% 118%, rgba(34,211,238,.16), transparent 60%),
  #080C18;}
body::after{content:"";position:fixed;inset:0;z-index:-1;background-image:radial-gradient(rgba(255,255,255,.035) 1px, transparent 1px);background-size:26px 26px;opacity:.5}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font-family:var(--font)}

/* ---------- glass primitives ---------- */
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(135%);-webkit-backdrop-filter:blur(18px) saturate(135%);border:1px solid var(--stroke);border-radius:var(--r)}
.card{background:var(--glass);backdrop-filter:blur(16px) saturate(130%);-webkit-backdrop-filter:blur(16px) saturate(130%);border:1px solid var(--stroke);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:0 8px 30px rgba(0,0,0,.22)}
.card h3{margin:0 0 12px;font-family:var(--display);font-size:15px;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
.sec{margin:20px 4px 11px;font-size:11px;font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:1.7px}
.sec:first-child{margin-top:2px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted);font-size:12.5px;line-height:1.55}
.big{font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:-.5px}

/* glassy buttons */
.btn{position:relative;border:1px solid var(--stroke2);border-radius:13px;background:linear-gradient(180deg,var(--glass2),rgba(255,255,255,.03));color:var(--ink);font-weight:700;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);overflow:hidden;transition:transform .14s,box-shadow .2s;padding:13px 15px;font-size:13.5px}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.22),transparent 42%);opacity:.7;pointer-events:none}
.btn:active{transform:scale(.96)}
.btn.primary{width:100%;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1205;border-color:rgba(255,255,255,.25);padding:16px;font-size:16px;font-weight:800;box-shadow:0 10px 34px rgba(227,154,59,.4)}
.btn.cyan{background:linear-gradient(135deg,#67E8F9,var(--cyan));color:#062a30;border-color:transparent;box-shadow:0 8px 26px rgba(34,211,238,.32)}
.btn.green{background:linear-gradient(135deg,#6EE7B7,var(--green));color:#052e1c;border-color:transparent;box-shadow:0 8px 26px rgba(52,211,153,.30)}
.btn.violet{background:linear-gradient(135deg,#C4B5FD,var(--violet));color:#1e1146;border-color:transparent;box-shadow:0 8px 26px rgba(167,139,250,.30)}
.btn.ghost{background:var(--glass);color:var(--ink)}
.btn.small{padding:10px 13px;font-size:12.5px;border-radius:10px}
.btn.danger{background:linear-gradient(180deg,rgba(251,113,133,.18),rgba(251,113,133,.06));color:var(--rose);border-color:rgba(251,113,133,.35)}
.btn.full{width:100%}

/* badges / pills */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:8px;font-size:10.5px;font-weight:800;letter-spacing:.3px;border:1px solid transparent}
.b-cyan{background:rgba(34,211,238,.14);color:#7DE9F7;border-color:rgba(34,211,238,.3)}
.b-gold{background:rgba(247,197,114,.14);color:var(--gold2);border-color:rgba(247,197,114,.3)}
.b-green{background:rgba(52,211,153,.14);color:#6EE7B7;border-color:rgba(52,211,153,.3)}
.b-rose{background:rgba(251,113,133,.15);color:#FDA4B4;border-color:rgba(251,113,133,.32)}
.b-violet{background:rgba(167,139,250,.15);color:#C4B5FD;border-color:rgba(167,139,250,.32)}
.b-neutral{background:rgba(147,160,189,.13);color:var(--muted);border-color:rgba(147,160,189,.22)}
.dot{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 5px;border-radius:99px;background:var(--rose);color:#2a0710;font-size:10px;font-weight:800}

.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-bottom:6px}
.kpi{background:var(--glass);border:1px solid var(--stroke);border-radius:15px;padding:14px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;top:-30px;right:-30px;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.09),transparent 70%)}
.kpi .v{font-family:var(--mono);font-size:22px;font-weight:600;margin-top:6px}
.kpi .l{font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.8px;display:flex;align-items:center;gap:5px}

/* product rows */
.sug{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--sep)}
.sug:last-child{border-bottom:none;padding-bottom:2px}
.sug:first-child{padding-top:2px}
.pav{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:23px;flex-shrink:0;background:var(--glass2);border:1px solid var(--stroke2)}
/* the 48x48 avatar doubles as the item-card button, so the product name keeps its full column */
button.pav{padding:0;position:relative;cursor:pointer;color:inherit;font-family:inherit}
button.pav:active{transform:scale(.93)}
button.pav .pavdots{position:absolute;right:3px;bottom:-1px;font-size:12px;line-height:1;font-weight:800;color:var(--muted)}
.sug .info{flex:1;min-width:0}
/* Armenian product names run 150-190px; on a 320-412px phone the flex row can never give them
   that on ONE line, so they used to ellipsise down to «Ջ…». Wrap to two lines instead — the
   name is what identifies the SKU being counted, priced or sold. */
.sug .nm{font-weight:600;font-size:14.5px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere;line-height:1.3}
/* a row action must be able to give width back to the name */
.sug .rowact{flex:0 1 auto;min-width:0;white-space:normal}
/* at 320px the name column is only ~76px, so two lines are not enough for the longest names */
/* Russian product names («Масло сливочное 82% 200 г») need a third line well before 340px */
@media (max-width:400px){ .sug .nm{-webkit-line-clamp:3} }
@media (max-width:340px){ .sug .nm{-webkit-line-clamp:4} }
/* R4: at 320px in hy/ru the «Մնացորդ՝ 1 · Վերջանում է» badge — the only stockout warning on the
   selling screen — was drawn under the stepper. Below 360 the control column takes its own row. */
@media (max-width:360px){
  .posrow{flex-wrap:wrap}
  .posrow .info{flex:1 1 100%;min-width:0}
  .posrow .posact{flex:1 1 100% !important;min-width:0 !important;text-align:left !important;margin-top:9px;display:flex;gap:10px;align-items:center}
  .posrow .posact .addbtn{margin-top:0 !important;flex:1}
}
/* R4: the supplier «📨 Առաջարկել պատվեր» button pushed the Խանութի մնացորդ tab 17px wide at
   320px in Russian. Let it take its own line instead of forcing a horizontal page scroll. */
@media (max-width:460px){
  .selloutfoot{flex-wrap:wrap}
  .selloutfoot .btn{flex:1 1 100%;margin-top:8px}
}
/* accordion groups on Տվյալներ */
.acc{margin:0 0 12px}
.acc>summary{list-style:none;cursor:pointer;padding:12px 14px;border:1px solid var(--stroke);border-radius:14px;background:var(--glass);font-weight:800;font-size:13.5px;display:flex;align-items:center;gap:8px}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary::after{content:'▾';margin-left:auto;color:var(--muted);font-size:12px}
.acc[open]>summary::after{content:'▴'}
body.light .acc>summary{background:#FFFFFF}
/* rows whose action carries a long sentence-length label (the promo toggle) squeezed the name
   column down to 31px at 320px. Below 460px the action drops onto its own full-width line. */
@media (max-width:460px){
  .sug.stack{flex-wrap:wrap}
  .sug.stack .info{flex:1 1 auto}
  .sug.stack .sugact{flex:1 1 100%;min-width:0 !important;text-align:left !important;margin-top:8px}
  .sug.stack .sugact .btn{width:100%}
}
.sug .sub{font-size:11.5px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.sug .sub b{font-family:var(--mono);color:var(--gold2);font-weight:600}
.qtyctl{display:flex;align-items:center;gap:2px;background:var(--glass2);border:1px solid var(--stroke2);border-radius:11px;padding:3px}
.qtyctl button{width:38px;height:38px;border-radius:9px;border:none;background:transparent;color:var(--gold2);font-size:18px;font-weight:800;cursor:pointer}
/* the scan tray's ± is the control reached for after a mis-scan, one-handed, mid-aisle */
.scantray .qtyctl button{width:44px;height:44px;font-size:21px}
.scantray .qtyctl span{min-width:30px}
.qtyctl button:active{background:rgba(247,197,114,.18)}
.qtyctl span{min-width:26px;text-align:center;font-family:var(--mono);font-weight:600;font-size:15px}
.addbtn{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1205;border:none;border-radius:11px;padding:9px 13px;font-weight:800;font-size:12.5px;cursor:pointer;transition:.15s;width:100%;box-shadow:0 5px 16px rgba(227,154,59,.3)}
.addbtn:active{transform:scale(.95)}
.addbtn.added{background:linear-gradient(135deg,#6EE7B7,var(--green));color:#052e1c;box-shadow:0 5px 16px rgba(52,211,153,.3)}
.iconbtn{width:32px;height:32px;border-radius:10px;border:1px solid var(--stroke2);background:var(--glass);color:var(--muted);font-size:16px;font-weight:700;cursor:pointer;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.iconbtn:active{transform:scale(.92)}
body.light .iconbtn{background:#FFFFFF}
/* receiving discrepancy line */
.rline{display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin:7px 0 0 60px}
.rline .was{text-decoration:line-through;color:var(--dim);font-family:var(--mono)}
.rline .chips{margin:0;padding:0}
.rline .chips button{padding:5px 10px;font-size:11px}
body.light .rline .chips button{background:#FFFFFF}
/* barcode scanner (R2): the box always holds video, so it stays dark in both themes */
.scanbox{position:relative;margin-top:12px;border-radius:15px;overflow:hidden;background:#000;aspect-ratio:4/3;min-height:190px}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanroi{position:absolute;left:6%;right:6%;top:35%;height:30%;border:2px solid var(--gold2);border-radius:10px;box-shadow:0 0 0 2000px rgba(0,0,0,.34)}
.scanroi::after{content:"";position:absolute;left:6px;right:6px;top:50%;height:2px;background:var(--rose);opacity:.85}
.scanhint{position:absolute;left:0;right:0;bottom:8px;text-align:center;color:#fff;font-size:11.5px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.8)}

/* search & chips */
.search{width:100%;padding:13px 16px;border:1px solid var(--stroke2);border-radius:13px;font-size:15px;font-family:var(--font);background:var(--glass);color:var(--ink);margin-bottom:12px;outline:none;transition:.15s;backdrop-filter:blur(10px)}
.search::placeholder{color:var(--dim)}
.search:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(227,154,59,.18)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
/* a mandatory choice may never hide behind a scrollbar-less swipe: wrap onto as many rows as it takes */
.chips.wrap{flex-wrap:wrap;overflow-x:visible}
.chips button{white-space:nowrap;background:var(--glass);border:1px solid var(--stroke2);border-radius:99px;padding:10px 14px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:6px}
.chips button.active{background:linear-gradient(135deg,rgba(247,197,114,.22),rgba(227,154,59,.12));color:var(--gold2);border-color:rgba(247,197,114,.5)}

/* orders */
.order{border:1px solid var(--stroke);border-radius:15px;padding:15px;margin-bottom:12px;background:var(--glass);position:relative;overflow:hidden}
.order.st-new{border-color:rgba(34,211,238,.28)}
.order.st-new::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cyan)}
.order.st-confirmed::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold)}
.order.st-delivered::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--green)}
.order .oh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;gap:8px}
.order .oh b{font-size:14px}
.oid{font-family:var(--mono);font-size:11.5px;color:var(--dim)}
.oitems{font-size:12.5px;color:var(--muted);line-height:1.75;margin-top:7px}
.osum{font-family:var(--mono);font-weight:600;margin-top:8px;font-size:15px;color:var(--gold2)}
.obtns{display:flex;gap:10px;margin-top:12px}
.obtns button{flex:1}
/* order progress tracker (shop side) */
.otrack{display:flex;align-items:center;margin-top:13px;padding:0 2px}
.onode{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;background:var(--glass2);border:1px solid var(--stroke2);color:var(--dim)}
.onode.done{background:linear-gradient(135deg,#6EE7B7,var(--green));border-color:transparent;color:#052e1c;box-shadow:0 0 12px rgba(52,211,153,.45)}
.onode.now{background:linear-gradient(135deg,#67E8F9,var(--cyan));border-color:transparent;color:#062a30;box-shadow:0 0 14px rgba(34,211,238,.55);animation:nowPulse 1.6s ease-in-out infinite}
@keyframes nowPulse{0%,100%{box-shadow:0 0 8px rgba(34,211,238,.35)}50%{box-shadow:0 0 18px rgba(34,211,238,.75)}}
.oline{flex:1;height:3px;border-radius:99px;background:var(--stroke);margin:0 5px}
.oline.done{background:linear-gradient(90deg,var(--green),var(--cyan))}
.olabels{display:flex;justify-content:space-between;margin-top:6px;font-size:9.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--dim)}
.olabels span.on{color:var(--ink)}
/* data centre */
.hbar{margin-bottom:11px}
.hbar .hl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-bottom:5px}
.hbar .hl b{font-family:var(--mono);color:var(--gold2);font-weight:600}
.hbar .track{height:11px;border-radius:99px;background:var(--glass2);overflow:hidden;border:1px solid var(--stroke)}
.hbar .fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold2),var(--gold));box-shadow:0 0 14px rgba(227,154,59,.45)}
.hbar .fill.cy{background:linear-gradient(90deg,#67E8F9,var(--violet));box-shadow:0 0 14px rgba(34,211,238,.4)}
.tblwrap{max-height:330px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--stroke2) transparent}
.tblwrap::-webkit-scrollbar{width:7px}
.tblwrap::-webkit-scrollbar-thumb{background:var(--stroke2);border-radius:99px}
.spark{display:inline-flex;gap:2px;align-items:flex-end;height:22px;vertical-align:middle}
.spark i{width:5px;background:linear-gradient(180deg,#67E8F9,var(--violet));border-radius:2px;display:block;min-height:2px}

/* supplier shop list */
.shoprow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--sep);cursor:pointer}
.shoprow:last-child{border-bottom:none}
.shopav{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,rgba(247,197,114,.22),rgba(167,139,250,.16));border:1px solid var(--stroke2);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--gold2);font-size:15px;flex-shrink:0}

/* alerts */
.alert{border:1px solid rgba(247,197,114,.3);background:linear-gradient(180deg,rgba(247,197,114,.10),rgba(247,197,114,.03));border-radius:15px;padding:14px 15px;margin-bottom:11px}
.alert.bad{border-color:rgba(251,113,133,.38);background:linear-gradient(180deg,rgba(251,113,133,.12),rgba(251,113,133,.03))}
.alert .t{font-weight:600;font-size:13.5px;line-height:1.5}
.alert .d{font-size:12px;color:var(--muted);margin-top:5px}
.alert .act{margin-top:10px;display:flex;gap:8px}

.empty{color:var(--muted);text-align:center;padding:30px 12px;font-size:13.5px}
.empty .em{font-size:34px;display:block;margin-bottom:8px}
.notice{background:linear-gradient(135deg,rgba(34,211,238,.12),rgba(167,139,250,.10));border:1px solid var(--stroke2);border-radius:15px;padding:13px 15px;margin-bottom:14px;font-size:12.5px;color:#CDE9F5;line-height:1.6}
.footer-note{text-align:center;color:var(--dim);font-size:11px;margin:18px 0 4px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px}
.tbl th{text-align:left;color:var(--dim);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;padding:7px 5px;border-bottom:1px solid var(--stroke2)}
.tbl td{padding:9px 5px;border-bottom:1px solid var(--sep)}
/* ---- գույքագրման ակտ ---- */
.actrule{border:none;border-top:1px solid var(--stroke2);margin:12px 0}
.actsep{border-top:1px solid var(--stroke2)}
.actsignline{border-bottom:1px solid var(--stroke2);height:26px;max-width:180px}
.acttbl .actsub{display:none}
/* On a phone the 7-column act is ~465px wide inside a 352px wrapper, so ՓԱՍՏԱՑԻ, Δ and ֏ —
   the whole point of the document — scrolled off with no cue. Below 560px the two reference
   columns (Ապրանքի կոդ, Չափման միավոր) fold into a sub-line under the product name instead;
   print and CSV always carry the full seven. */
@media screen and (max-width:560px){
  .acttbl th:nth-child(2),.acttbl td:nth-child(2),
  .acttbl th:nth-child(3),.acttbl td:nth-child(3){display:none}
  .acttbl .actsub{display:block;font-size:10px;margin-top:3px}
  .acttbl th,.acttbl td{padding-left:3px;padding-right:3px}
  .acttbl{font-size:11.5px}
}

/* ---------- TOP BAR (global controls) ---------- */
/* the six global controls + the logo cannot share one 390px row: without wrapping they pushed
   the bell, the split toggle, the language switch and ⏭ off-screen and made the WHOLE document
   scroll sideways. Wrap instead — every control stays reachable and nothing overflows. */
#top{position:sticky;top:0;z-index:60;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:calc(9px + env(safe-area-inset-top)) 14px 9px;background:rgba(9,13,26,.72);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border-bottom:1px solid var(--stroke)}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.3px}
.logomark{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--gold2),var(--gold));display:flex;align-items:center;justify-content:center;color:#1a1205;font-size:16px;box-shadow:0 5px 18px rgba(227,154,59,.45)}
.logo small{display:block;font-family:var(--font);font-weight:500;font-size:10.5px;color:var(--muted);margin-top:1px}
#top .spacer{flex:1 1 0;min-width:0}
.logo{min-width:0}
.logo>div{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbtn{border:1px solid var(--stroke2);background:var(--glass);color:var(--ink);border-radius:11px;padding:8px 12px;font-size:12.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;backdrop-filter:blur(10px)}
.tbtn:active{transform:scale(.95)}
.tbtn.on{background:linear-gradient(135deg,rgba(247,197,114,.24),rgba(227,154,59,.12));color:var(--gold2);border-color:rgba(247,197,114,.5)}
.tbtn.day{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1205;border-color:transparent;box-shadow:0 5px 16px rgba(227,154,59,.35)}
.datechip{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap}
/* R4: two header rows + two nav rows left less than half a 390px phone for content. */
@media (max-width:460px){
  #top{gap:5px 6px;padding:calc(7px + env(safe-area-inset-top)) 9px 7px}
  .tbtn{padding:6px 8px;font-size:11.5px;gap:4px}
  .datechip{font-size:10px}
  #top .logo small{display:none}
}

/* ---------- SPLIT layout ---------- */
#app{position:relative}
.split{display:grid;grid-template-columns:1fr;gap:14px;padding:14px;max-width:720px;margin:0 auto}
.pane{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.panehead{position:sticky;top:0;z-index:5;padding:12px 14px 8px;background:rgba(255,255,255,.04);backdrop-filter:blur(14px);border-bottom:1px solid var(--stroke)}
.panetitle{font-family:var(--display);font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.panetitle .tag{margin-left:auto;font-family:var(--font);font-weight:700;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
.panetabs{margin-bottom:0}
.panetabs button{padding:7px 12px}
.panetabs button.active .dot,.chips button.active .dot{background:var(--gold2);color:#1a1205}
.panebody{padding:14px}
.pane.flash{animation:flashPane .9s ease}
@keyframes flashPane{0%{box-shadow:0 0 0 0 rgba(34,211,238,.0)}25%{box-shadow:0 0 0 3px rgba(34,211,238,.6),0 0 40px rgba(34,211,238,.35)}100%{box-shadow:0 0 0 0 rgba(34,211,238,0)}}
.flowmark{display:none}

/* ---------- SINGLE layout (mobile bottom nav) ---------- */
/* R4: this animation used to run on EVERY renderAll(), so each ± tap on a replenishment or
   receiving stepper faded the whole pane out for ~150 ms and the number being adjusted was
   unreadable. It now plays only when the view actually changes (see VIEWKEY in renderAll). */
main{padding:14px;max-width:680px;margin:0 auto}
main.anim{animation:fadeUp .28s ease both}
@media (prefers-reduced-motion:reduce){ main.anim{animation:none} }
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.roleswitch{display:flex;background:var(--glass);border:1px solid var(--stroke);border-radius:13px;padding:3px;margin:0 auto 4px;max-width:680px}
.roleswitch button{flex:1;border:none;background:transparent;color:var(--muted);padding:9px 6px;border-radius:10px;font-size:13.5px;font-weight:700;cursor:pointer;transition:.18s}
.roleswitch button.active{background:linear-gradient(135deg,rgba(247,197,114,.24),rgba(227,154,59,.12));color:var(--gold2)}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(9,13,26,.85);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--stroke);display:flex;z-index:60;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;border:none;background:none;padding:7px 2px;font-size:10px;color:var(--dim);cursor:pointer;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
nav button.active{color:var(--gold2)}
nav button.active .icw{background:rgba(247,197,114,.18)}
nav .icw{width:44px;height:28px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-size:18px;transition:.15s}
.navbadge{position:absolute;top:0;left:calc(50% + 6px);background:var(--rose);color:#2a0710;font-size:9.5px;font-weight:800;border-radius:99px;padding:1.5px 6px}
/* 8 shop tabs must fit a one-thumb phone */
nav .icw{width:40px}
nav button{min-width:0;overflow:hidden;white-space:nowrap}
nav button>span:last-child{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
body.single-mobile{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
/* Below ~460px eight full Armenian labels cannot share one row without ellipsising into
   ambiguous stubs (Պատվ… / Պարտ…). Wrap the strip onto two rows of four instead: every
   destination keeps its whole name and every tab keeps a comfortable touch target. */
@media (max-width:460px){
  nav{flex-wrap:wrap;padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
  nav button{flex:0 0 25%;max-width:25%;font-size:10px;padding:5px 2px;gap:2px}
  nav .icw{width:34px;height:23px;font-size:15px}
  body.single-mobile{padding-bottom:calc(132px + env(safe-area-inset-bottom))}
  /* the shop grew a 9th tab (🧮 Գույքագրում): 5 + 4 across the same two rows, same height */
  nav.cols9 button{flex:0 0 20%;max-width:20%}
}
@media (max-width:400px){ nav.cols9 button{font-size:9px} nav.cols9 .icw{width:30px} }
@media (max-width:340px){ nav button{font-size:9px} }
/* at 320px a 9-tab strip gives each button ~58px of label room; «Գույքագրում» / «Ապրանքներ» /
   «Պատվերներ» only fit whole below 8.5px. Scoped to cols9, so the supplier nav is untouched. */
@media (max-width:340px){ nav.cols9 button{font-size:8px;letter-spacing:-.2px} }
/* R3: the shop grew a 10th tab (🗓 Ժամկետներ) — a clean 5+5 across the SAME two rows, so
   body.single-mobile padding (132px) and the #toast offset (144px) are unchanged. */
@media (max-width:460px){ nav.cols10 button{flex:0 0 20%;max-width:20%} }
@media (max-width:400px){ nav.cols10 button{font-size:9px} nav.cols10 .icw{width:30px} }
@media (max-width:340px){ nav.cols10 button{font-size:8px;letter-spacing:-.2px} }
@media (min-width:461px) and (max-width:700px){ nav.cols10 button{font-size:9px} nav.cols10 .icw{width:30px} }
/* a row that carries two actions must be allowed to wrap them; flex-basis beats the
   width:100% the .sug.stack rule gives a stacked action button */
.expcard .obtns,.rptrow .obtns{flex-wrap:wrap}
.expcard .obtns .btn,.rptrow .obtns .btn{flex:1 1 44%;min-width:0;overflow-wrap:anywhere}
/* ...and the action column must be BOUNDED, or two long Armenian labels size it by their own
   content and squeeze the product name to one character per line in the 600px split pane.
   Below 460px the .sug.stack rule (higher specificity) still drops it onto its own full row. */
.expcard .sugact,.rptrow .sugact{flex:0 1 210px;min-width:0}
/* in that bounded column 44% is ~90px — narrower than «Վերադարձնել մատակարարին» can ever be.
   Full-width stacked there; side by side only on the phone, where the column IS the row. */
@media (min-width:461px){ .expcard .obtns .btn,.rptrow .obtns .btn{flex:1 1 100%} }

#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(8px);bottom:calc(96px + env(safe-area-inset-bottom));background:linear-gradient(135deg,#67E8F9,var(--cyan));color:#062a30;padding:12px 20px;border-radius:13px;font-size:13.5px;font-weight:800;z-index:100;opacity:0;transition:.28s;pointer-events:none;max-width:88%;text-align:center;box-shadow:0 10px 34px rgba(34,211,238,.45)}

@keyframes fade{from{opacity:0}to{opacity:1}}
.mbody{background:rgba(20,26,44,.92);backdrop-filter:blur(24px);border:1px solid var(--stroke2);width:100%;max-width:680px;border-radius:24px 24px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));max-height:84vh;overflow-y:auto;animation:slideUp .28s cubic-bezier(.2,.9,.3,1)}
@keyframes slideUp{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.grabber{width:40px;height:4px;border-radius:99px;background:var(--stroke2);margin:6px auto 14px}

/* grid inside single desktop */
.grid2{display:block}

/* ================= DESKTOP ================= */
@media (min-width:980px){
  .split{max-width:none;grid-template-columns:1fr 1fr;gap:20px;height:calc(100vh - 60px);padding:18px 24px;align-items:stretch}
  .pane{height:100%}
  .panebody{overflow-y:auto;flex:1;scrollbar-width:thin;scrollbar-color:var(--stroke2) transparent}
  .panebody::-webkit-scrollbar{width:8px}

  @keyframes pulseFlow{0%,100%{box-shadow:0 8px 30px rgba(34,211,238,.5)}50%{box-shadow:0 8px 44px rgba(167,139,250,.7)}}
  /* wider details on big screens */
  .sug .nm{white-space:normal;overflow:visible;text-overflow:clip;font-size:15px;line-height:1.4}
  .panebody{padding:16px 20px}
  /* single desktop */
  main.single-desk{max-width:1400px}
  .single-desk .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 30px;align-items:start}
  .single-desk .kpis{grid-template-columns:repeat(4,1fr)}
  .modal{align-items:center}
  .mbody{border-radius:20px;max-width:560px}
}
@media (min-width:980px) and (max-width:1200px){
  .panetabs button{padding:6px 9px;font-size:11.5px}
}

/* ================= PRINT =================
   MUST be the last block in the sheet. Declared earlier it lost every property that a later
   same-specificity rule redeclared (.modal, .mbody), which pinned the գույքագրման ակտ to the
   bottom of the sheet on a dark canvas. !important covers the theme rules (body.light .mbody),
   which outrank a bare .mbody selector wherever they sit. */
@media print{
  @page{margin:14mm}
  html,body{background:#fff !important;color:#111 !important}
  body::before,body::after{display:none !important}
  #top,#app,nav,#toast,.noprint,.grabber{display:none !important}
  .modal{position:static !important;inset:auto !important;background:#fff !important;display:block !important;
         align-items:flex-start !important;backdrop-filter:none !important;-webkit-backdrop-filter:none !important;animation:none !important}
  .mbody{background:#fff !important;color:#111 !important;border:none !important;box-shadow:none !important;
         max-height:none !important;height:auto !important;overflow:visible !important;border-radius:0 !important;
         max-width:none !important;width:100% !important;padding:0 !important;backdrop-filter:none !important;
         -webkit-backdrop-filter:none !important;animation:none !important}
  .mbody .muted{color:#555 !important}
  .mbody .big,.mbody .osum{color:#111 !important}
  .tblwrap{max-height:none !important;overflow:visible !important}
  .tbl{page-break-inside:auto}
  .tbl tr{page-break-inside:avoid}
  .tbl th{color:#555 !important;border-color:#ccc !important}
  .tbl td{border-color:#ddd !important;color:#111 !important}
  .badge{border:1px solid #999 !important;color:#111 !important;background:none !important}
  /* rules and signature lines are drawn with the THEME stroke colour, which is a near-white
     translucent in dark mode and vanishes on paper: force ink for print. */
  .mbody hr,.actrule,.actsep{border-color:#bbb !important}
  .actsignline{border-bottom:1px solid #333 !important}
  /* the act keeps all seven columns on paper — the narrow-screen column hiding is screen-only */
  .acttbl th,.acttbl td{display:table-cell !important}
  .acttbl .actsub{display:none !important}
}

    r.reply = ['swap','back','no'].indexOf(r.reply)>=0 ? r.reply : '';
    r.days = (typeof r.days==='number' && isFinite(r.days)) ? r.days : null;
    r.date = (typeof r.date==='number' && isFinite(r.date)) ? r.date : (st.today||START);

    if(!PRODUCTS.some(p=>p.id===pid) || !isFinite(v) || v<0 || v>9999) delete st.minStock[pid];

     truncated payload adopted from the sync room, used to throw on EVERY render and leave the
     app with no nav and no recovery path. Heal it here like every other key. ---- */

    const v = +st.otherLast[o.id];
    if(!isFinite(v)) st.otherLast[o.id] = (st.today||START) - (i===2?12:(1+i%4))*DAY;

}

   wrong number, verifyLedger() reported clean and nothing surfaced the loss.

   move the incoming state has not seen, then rebuild the on-hand cache from the union. */
let MERGED_EXTRA = false;
function mergeAdopt(d){
  MERGED_EXTRA = false;
  const remote = adopt(d);
  try{
    const mine = (typeof S!=='undefined' && S && Array.isArray(S.moves)) ? S.moves : [];
    if(!mine.length || !Array.isArray(remote.moves)) return remote;
    const seen = {}; remote.moves.forEach(m=>{ if(m && m.uuid) seen[m.uuid]=1; });
    const missing = mine.filter(m=>m && m.uuid && !seen[m.uuid] &&
                                   m.type!=='open' && m.reason!=='migration');
    if(!missing.length) return remote;
    MERGED_EXTRA = true;
    let seq = +remote.moveSeq || remote.moves.length;
    remote.moves = remote.moves.concat(missing.map(m=>Object.assign({}, m, {n: ++seq})));
    remote.moveSeq = seq;
    remote.stock = {};
    remote.moves.forEach(m=>{ if(m && m.pid) remote.stock[m.pid] = (remote.stock[m.pid]||0) + (+m.dq||0); });
    /* re-run the migration so the batch annotation is re-clamped against the merged on-hand */
    return adopt(remote);

/* ---------- immutable stock ledger (R1 · G1) ----------
   S.moves is append-only: never edited, never re-ordered. On-hand is SUM(dq) and S.stock is
   only a cache of that sum. postMove() is the ONLY way stock is ever allowed to change. */
function uuid4(){ return 'm-'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }
function postMove(m){
  if(!m || !m.pid || !m.type) return false;
  if(!Array.isArray(S.moves)){ S.moves=[]; S.moveSeq=S.moveSeq||0; }
  const uuid = m.uuid || uuid4();
  if(S.moves.some(x=>x && x.uuid===uuid)) return false;   // replaying the same move is a no-op
  const mv = {
    n: ++S.moveSeq,
    uuid,
    ts: m.ts==null ? S.today : m.ts,
    rts: Date.now(),
    pid: m.pid,
    type: m.type,
    dq: +m.dq || 0,
    cost: m.cost==null ? costOf(m.pid) : m.cost,
    ref: m.ref || '',
    reason: m.reason || '',
    actor: m.actor || 'shop',
    note: m.note || '',
    batch: m.batch ? String(m.batch) : ''
  };
  S.moves.push(mv);
  S.stock[mv.pid] = (S.stock[mv.pid]||0) + mv.dq;    // cache, rebuildable at any time
  /* R3 · F1: the ONE choke point where batch quantities ever go down. Batches are a derived
     annotation, so a failure here must never be able to block a ledger move. */
  try{ reconcileBatches(mv.pid, mv.batch, mv.dq < 0 ? -mv.dq : 0); }catch(e){}
  compactMoves();
  return true;
}
function postMoves(arr){ let n=0; (arr||[]).forEach(m=>{ if(postMove(m)) n++; }); return n; }
function rebuildStock(){ const c={}; (S.moves||[]).forEach(m=>{ if(m&&m.pid) c[m.pid]=(c[m.pid]||0)+(+m.dq||0); }); return c; }
function verifyLedger(){
  const rb = rebuildStock(), out=[];
  const pids = {}; Object.keys(S.stock||{}).forEach(k=>pids[k]=1); Object.keys(rb).forEach(k=>pids[k]=1);
  Object.keys(pids).forEach(pid=>{
    const cached = (S.stock||{})[pid]||0, rebuilt = rb[pid]||0;
    if(cached!==rebuilt) out.push({pid, cached, rebuilt});
  });
  return out;
}
const onHand = pid => (S.stock||{})[pid]||0;
function movesFor(pid, limit){
  // oldest first: ts is the business date, n only breaks ties inside the same day. Sorting by ts
  // first is what keeps a collapsed opening balance (see compactMoves) at the top of the list.
  const all = (S.moves||[]).filter(m=>m && m.pid===pid).slice()
    .sort((a,b)=>((a.ts||0)-(b.ts||0)) || ((a.n||0)-(b.n||0)));
  let bal = 0;
  const rows = all.map(m=>{ bal += (+m.dq||0); return Object.assign({}, m, {bal}); });
  return rows.slice(-(limit||50)).reverse();
}

function costOf(pid){
  const rec = (S.moves||[]).filter(m=>m && m.pid===pid && m.type==='receipt');
  if(rec.length) return rec[rec.length-1].cost || 0;
  const h = (S.history||[]).filter(x=>x.productId===pid);

/* keeps localStorage and the D1 sync payload bounded: moves older than 90 days collapse into
   one opening balance per SKU. Totals are preserved exactly, so on-hand never changes. */
function compactMoves(){
  if(!Array.isArray(S.moves) || S.moves.length <= 1500) return;
  const cutoff = S.today - 90*DAY;
  const old = S.moves.filter(m=>m && m.ts < cutoff);
  if(old.length < 2) return;
  const keep = S.moves.filter(m=>m && !(m.ts < cutoff));
  const sums = {}, costs = {};
  old.forEach(m=>{ sums[m.pid] = (sums[m.pid]||0) + (+m.dq||0); if(costs[m.pid]==null) costs[m.pid]=m.cost||0; });
  const opens = [];
  // the collapsed opening balance IS the oldest event for its SKU, so it must sort BEFORE every
  // retained move: number it below the smallest kept n instead of taking a fresh ++S.moveSeq.
  let base = keep.reduce((mn,m)=>Math.min(mn, +m.n||0), 0);
  Object.keys(sums).forEach(pid=>{
    if(!sums[pid]) return;
    opens.push({n:--base, uuid:uuid4(), ts:cutoff, rts:0, pid, type:'open', dq:sums[pid],
                cost:costs[pid]||0, ref:'', reason:'compact', actor:'system', note:''});
  });
  S.moves = opens.concat(keep);
}

/* ================= R3 · F1 — Խմբաքանակ և Պիտանիության ժամկետ =================
   S.batches annotates the ledger; it never replaces it. The invariant is
   sum(batchesOf(pid).left) ≤ onHand(pid), and it is enforced in exactly ONE place —
   reconcileBatches(), called from postMove(). That makes every outflow (sale, POS batch sale,
   Դուրսգրում, վերադարձ, negative գույքագրում variance) FEFO automatically, with no call site
   needing to know batches exist. batch.cost is display-only: money at risk, never a cost layer. */
function fmt(key, vals){ return String(t(key)).replace(/\{(\w+)\}/g, (_,k)=> (vals && vals[k]!=null) ? vals[k] : ''); }
function tsToYmd(ts){
  const n = +ts; if(!isFinite(n)) return '';

  return isFinite(v) ? v : null;
}
const shelfLifeOf = pid => +itemMeta(pid).shelfLife || 0;
/* «Ռիսկի տակ» is a KPI heading; inside a sentence it needs its lower-case form. Works for
   Armenian and Cyrillic alike, and «At risk» → «at risk» in English. */
const lcFirst = s => String(s||'').charAt(0).toLowerCase() + String(s||'').slice(1);
function batchesOf(pid){
  return (S.batches||[]).filter(b=>b && b.pid===pid && b.left>0)
    .sort((a,b)=>((a.exp==null?Infinity:a.exp)-(b.exp==null?Infinity:b.exp)) || ((a.date||0)-(b.date||0)));

function addBatch(o){
  o = o || {};

  if(qty<=0 || !P(o.pid)) return null;

             exp:(typeof o.exp==='number' && isFinite(o.exp)) ? o.exp : null,
             qty, left:qty, cost:Math.max(0, +o.cost||0), ref:String(o.ref||''), date:S.today};

/* preferId = the batch the shopkeeper physically acted on (a Դուրսգրում from the Ժամկետներ tab);
   want = how many units that move took. Those units come off THAT batch, up to what it holds —
   otherwise binning the freshest crate silently deletes the expired one still on the shelf.
   Everything else (sales above all) stays FEFO, which is the right default. */
function reconcileBatches(pid, preferId, want){
  if(!Array.isArray(S.batches) || !S.batches.length) return;
  const list = batchesOf(pid);
  if(preferId && want > 0){
    const b = list.find(x=>x && x.id===preferId);
    if(b) b.left -= Math.min(b.left, Math.floor(want));
  }
  // tracked units may never exceed on-hand: trim the remainder oldest-first
  const have = Math.max(0, onHand(pid));
  let over = list.reduce((a,b)=>a+b.left, 0) - have;
  if(over>0) for(const b of list){
    if(over<=0) break;
    const take = Math.min(b.left, over); b.left -= take; over -= take;

  S.batches = S.batches.slice().sort((a,b)=>(b.date||0)-(a.date||0)).slice(0,300);
}

/* ---------- VMI: store stock & sell-out ---------- */
function velOf(pid){
  const cut = S.today - 7*DAY;
  const recent = S.sales.filter(s=>s.productId===pid && s.date>=cut);
  if(recent.length){ return Math.max(0.2, recent.reduce((a,s)=>a+s.qty,0)/7); }
  const p = P(pid); return Math.max(0.2, p.qty/p.cycle);
}
function stockDays(pid){ return onHand(pid) / velOf(pid); }
function todaySold(pid){ return S.sales.filter(s=>s.productId===pid && s.date===S.today).reduce((a,s)=>a+s.qty,0); }
function last7Bars(pid){
  const days = [];
  for(let d=6; d>=0; d--){
    const dt = S.today - d*DAY;
    days.push(S.sales.filter(s=>s.productId===pid && s.date===dt).reduce((a,s)=>a+s.qty,0));
  }
  const max = Math.max(...days, 1);
  return `<span class="spark">${days.map(q=>`<i style="height:${Math.max(2, Math.round(q/max*22))}px" title="${q}"></i>`).join('')}</span>`;
}
function shopStockOf(shopId){ return shopId==='me' ? S.stock : (S.shopStock[shopId]||{}); }
function velOfShop(shopId, pid){
  if(shopId==='me') return velOf(pid);
  const i = OTHER_SHOPS.findIndex(o=>o.id===shopId);
  const p = P(pid);
  return Math.max(0.3, p.qty/p.cycle) * [1.3,0.8,0.5,1.6,1.0][Math.max(0,i)%5];
}
function daysLeftShop(shopId, pid){ return (shopStockOf(shopId)[pid]||0) / velOfShop(shopId, pid); }
function critCount(shopId){ return PRODUCTS.filter(p=>daysLeftShop(shopId, p.id)<=2).length; }
/* R4 · B2: reconcileBatches() is FEFO, so the unit a sale removes is the OLDEST — i.e. the
   expired carton goes out FIRST. Selling food past its Պիտանիության ժամկետ is prohibited by
   the Food Safety Law art. 9, and the app was telling the shopkeeper that on the neighbouring
   tab while silently ringing it up here. One confirmation sheet, never a block. */
function expiredBatchOf(pid){
  const b = nearestExpOf(pid);
  const d = b ? expDaysLeft(b) : null;
  return (d!=null && d < 0) ? b : null;
}
function openExpiredSale(pid, qty){
  const b = expiredBatchOf(pid); if(!b){ recordSale(pid, qty, true); return; }
  const p = P(pid) || {};
  MODAL_RE = ()=>openExpiredSale(pid, qty); armPushOverlay();
  document.getElementById('modalRoot').innerHTML = `<div class="modal" onclick="if(event.target===this)closeModal()">
    <div class="mbody"><div class="grabber"></div><h3>⚠ ${t('sell_exp_title')}</h3>
    <div class="muted">${p.em||''} ${goodNameOf(pid)} · ${t('exp_batch')} ${escH(b.id)} · ${b.exp!=null?fdateY(b.exp):t('exp_unknown')}</div>
    <div class="notice" style="margin-top:12px;border-color:rgba(251,113,133,.5);background:rgba(251,113,133,.1)">${t('sell_exp_body')}</div>
    <button class="btn danger full" style="margin-top:14px" onclick="closeModal();openWriteoff('${pid}',{qty:${Math.max(1,b.left)},reason:'expired',batch:'${escH(b.id)}'})">📉 ${t('exp_writeoff')}</button>
    <button class="btn ghost full" style="margin-top:9px" onclick="closeModal();recordSale('${pid}',${+qty||1},true)">${t('sell_exp_anyway')}</button>
    <button class="btn ghost full" style="margin-top:9px" onclick="closeModal()">${t('close')}</button></div></div>`;
}
function recordSale(pid, qty, force){
  const have = onHand(pid);
  if(have<=0){ toast(t('out_of_stock')); return; }
  if(!force && expiredBatchOf(pid)){ openExpiredSale(pid, qty); return; }
  qty = Math.max(1, Math.min(isFinite(+qty) ? Math.floor(+qty) : 1, have));
  postMove({pid, type:'sale', dq:-qty, ref:'', actor:'shop'});
  S.sales.push({date:S.today, productId:pid, qty});
  if(S.sales.length>600) S.sales = S.sales.slice(-500);

  saveD(); toast(`💵 −${qty} · ${t('sale_done')}`); renderAll();
}
function checkStockouts(){
  PRODUCTS.forEach(p=>{
    const d = stockDays(p.id);

    else if(d > 3 && S.stockoutFlag[p.id]){ delete S.stockoutFlag[p.id]; }
  });
}
function proposeRestock(pid){
  if(S.proposals.some(x=>x.productId===pid)){ toast('📨 ✓'); return; }
  const p = P(pid);
  const qty = Math.max(1, Math.round(velOf(pid) * p.cycle));
  S.proposals.push({id:'PRP-'+(S.seq++), productId:pid, qty, sup:p.sup, date:S.today});
  logEv('proposal',{pid});
  saveD(); toast('📨 ' + t('ev_proposal')); renderAll();
}
function stats(pid){
  const h = S.history.filter(x=>x.productId===pid).sort((a,b)=>a.date-b.date);
  if(!h.length) return null;
  const gaps = []; for(let i=1;i<h.length;i++) gaps.push((h[i].date-h[i-1].date)/DAY);
  gaps.sort((a,b)=>a-b);
  const cycle = gaps.length ? Math.max(2, Math.round(gaps[Math.floor(gaps.length/2)])) : P(pid).cycle;
  const avgQty = Math.round(h.slice(-5).reduce((a,x)=>a+x.qty,0)/Math.min(5,h.length));
  const last = h[h.length-1].date;
  const due = last + cycle*DAY;
  const dueIn = Math.ceil((due - S.today)/DAY);
  return {cycle, avgQty, last, due, dueIn, count:h.length};
}

function confirmOrder(oid){ const o = S.orders.find(x=>x.id===oid);
  /* R4 · B3: «🚚 Նշել առաքված» re-renders into the box «✓ Հաստատել» just vacated. The two taps
     of one double-tap therefore hit two DIFFERENT actions, so the guard has to be shared: stamp
     the order here and refuse any further transition on it inside the double-tap window. */
  if(o && o.status==='new'){ o._tapTs = Date.now(); o.status='confirmed'; logEv('confirmed',{oid}); saveD(); toast(t('confirmed_msg')); renderAll(); } }
function deliverOrder(oid, qtyMap){
  const o = S.orders.find(x=>x.id===oid); if(!o) return;
  /* R4 · B3: «🚚 Նշել առաքված» re-renders into the pixel box «✓ Հաստատել» just vacated, so on a
     laggy phone one double-tap used to run new→confirmed→delivered, issue the հաշիվ-ապրանքագիր
     and book the debt with no partial-delivery step and no undo. State only ever moves forward
     one step per gesture, and never within the double-tap window. */
  if(o.status==='delivered') return;
  const now = Date.now();
  if(o._tapTs && now - o._tapTs < 700) return;
  o._tapTs = now;
  o.status='delivered';
  o.deliveredTs = S.today;            // ACTUAL delivery — the only honest input to leadStats()
  o.items.forEach(it=>{ it.delivered = qtyMap ? Math.max(0, Math.min(it.qty, qtyMap[it.productId]??it.qty)) : it.qty; });
  if(o.shop.id==='me'){
    /* R1: shipping no longer moves the shop's stock — that would be phantom stock until the
       boxes are actually in the shop. Stock and the purchase-history record are created by
       confirmReceipt() («Ընդունում»). The supplier still issues the հաշիվ-ապրանքագիր here,
       which is how it works in practice; the receipt then matches it or raises a ճշգրտող հաշիվ. */
    const sum = o.items.reduce((a,x)=>a+x.delivered*x.price,0);
    if(sum>0){
      S.debts[o.sup] = (S.debts[o.sup]||0) + sum;
      S.bills.push({id:o.id.replace('ORD','INV'), sup:o.sup, date:S.today, amount:sum, paid:false,
        items:o.items.filter(x=>x.delivered>0).map(x=>({productId:x.productId, qty:x.delivered, price:x.price}))});
    }
  }
  logEv('delivered',{oid});
  saveD(); toast(t('delivered_msg')); renderAll();
}

function advanceDay(){
  S.today += DAY;
  sweepMarkdowns();                 // a markdown that ran out must stop suppressing reorder
  // simulate the store's consumer sales for the new day
  PRODUCTS.forEach(p=>{
    const q = Math.min(onHand(p.id), Math.round(velOf(p.id) * (0.6 + Math.random()*0.8)));
    if(q>0){ postMove({pid:p.id, type:'sale', dq:-q, actor:'sim'}); S.sales.push({date:S.today, productId:p.id, qty:q}); }
  });
  if(S.sales.length>600) S.sales = S.sales.slice(-500);
  checkStockouts();
  checkExpiry();
  // nudge once, on day 2 — an unreceived delivery is the #1 source of phantom stock
  S.orders.forEach(o=>{ if(o.shop && o.shop.id==='me' && o.status==='delivered' && !o.receipt && recvAge(o)===2) logEv('recv_due',{oid:o.id}); });
  // other shops' shelves sell down too
  OTHER_SHOPS.forEach(o=>{
    const stk = S.shopStock[o.id]; if(!stk) return;
    PRODUCTS.forEach(p=>{
      const q = Math.min(stk[p.id]||0, Math.round(velOfShop(o.id, p.id) * (0.5 + Math.random()*0.9)));
      if(q>0) stk[p.id] -= q;
    });
  });
  if(Math.random() < 0.75){
    const shop = OTHER_SHOPS[Math.floor(Math.random()*OTHER_SHOPS.length)];
    if(shop.id!=='o3'){
      const sup = ['s1','s2','s3'][Math.floor(Math.random()*3)];
      const pool = PRODUCTS.filter(p=>p.sup===sup);
      const items = pool.slice(0, 1+Math.floor(Math.random()*pool.length)).map(p=>({productId:p.id, qty:Math.max(1,p.qty+Math.floor(Math.random()*3)-1), price:p.price}));
      const oid = 'ORD-'+(S.seq++);
      S.orders.unshift({id:oid, date:S.today, shop, sup, items, status:'new', deliveryDate:S.today + (1+Math.floor(Math.random()*3))*DAY});
      logEv('order',{oid, shop:shop.id, sup});
      S.otherLast[shop.id] = S.today;
      // their shelf refills when the sim order arrives
      const stk = S.shopStock[shop.id];
      if(stk) items.forEach(it=>{ stk[it.productId] = (stk[it.productId]||0) + it.qty; });
    }
  }
  saveD(); toast(t('day_advanced') + ' ' + fdate(S.today)); renderAll();
}

/* You can only send back what you actually took in AND still have on the shelf: the ceiling is
   the RECEIVED quantity (o.receipt.lines) minus anything already returned, capped by on-hand. */
function retMax(o, it){
  const pid = it.productId;
  const shipped = it.delivered!=null ? it.delivered : it.qty;
  let got = shipped;
  const lines = o.receipt && Array.isArray(o.receipt.lines) ? o.receipt.lines : null;
  if(lines && lines.length){
    const l = lines.find(x=>x && x.pid===pid);
    got = l ? Math.max(0, +l.received||0) : 0;
  }
  const already = Math.max(0, +((o.returns||{})[pid]) || 0);
  return Math.max(0, Math.min(got - already, onHand(pid)));
}

  const o = S.orders.find(x=>x.id===RET.oid); if(!o) return;

  document.getElementById('modalRoot').innerHTML = `<div class="modal" onclick="if(event.target===this){RET=null;closeModal()}">

function retQty(pid, d){

function confirmReturn(){

  // re-clamp at confirm time: the sheet may have been open while another tab sold the stock
  const q = {};
  o.items.forEach(it=>{ q[it.productId] = Math.max(0, Math.min(RET.q[it.productId]||0, retMax(o,it))); });
  const sum = o.items.reduce((a,it)=>a+q[it.productId]*it.price,0);
  if(sum<=0){ RET=null; closeModal(); toast(t('ret_none')); renderAll(); return; }
  const prev = o.returns||{};
  o.returns = {}; o.items.forEach(it=>{ o.returns[it.productId] = (+prev[it.productId]||0) + q[it.productId]; });

function pendingReceipts(){

function recvExpPaint(pid){

function recvExpSet(pid, ymd){
  if(!RECV) return;
  if(!RECV.exp) RECV.exp = {};
  const ts = ymdToTs(ymd);
  if(ts==null) return;                       // half-typed date: keep the previous value, never null
  RECV.exp[pid] = ts;

/* R4 · MD#10 (offline-tolerant capture): RECV was a plain in-memory global, so a browser
   backgrounding the tab lost every corrected quantity and the typed document number while the
   driver stood there waiting. Mirror it to sessionStorage like S.count already persists. */
const RKEY = 'armtrade_recv_v1';
function saveRecv(){ try{ if(RECV) sessionStorage.setItem(RKEY, JSON.stringify(RECV)); else sessionStorage.removeItem(RKEY); }catch(e){} }
function restoreRecv(){
  try{
    const raw = sessionStorage.getItem(RKEY); if(!raw) return;
    const r = JSON.parse(raw);
    if(!r || typeof r!=='object' || !r.oid) return;
    const o = S.orders.find(x=>x && x.id===r.oid);
    if(!o || o.receipt || o.status!=='delivered' || !o.shop || o.shop.id!=='me'){ sessionStorage.removeItem(RKEY); return; }
    if(!r.q || typeof r.q!=='object') r.q={};
    if(!r.r || typeof r.r!=='object') r.r={};
    if(!r.doc || typeof r.doc!=='object') r.doc={};
    RECV = r;
  }catch(e){ try{ sessionStorage.removeItem(RKEY); }catch(e2){} }
}
function recvQty(pid, d){ setTimeout(saveRecv,0);
  if(!RECV) return;
  const o = S.orders.find(x=>x.id===RECV.oid); if(!o) return;
  const it = o.items.find(x=>x.productId===pid); if(!it) return;
  const shipped = recvShipped(it);
  const v = Math.max(0, Math.min(recvCap(shipped), (RECV.q[pid]||0) + d));
  RECV.q[pid] = v;
  if(v < shipped){ if(!RECV.r[pid]) RECV.r[pid] = 'short'; }
  else delete RECV.r[pid];
  renderAll();
}
function recvReason(pid, code){ if(!RECV) return; RECV.r[pid] = code; saveRecv(); renderAll(); }
function recvEditDoc(){ if(!RECV) return; RECV.editDoc = !RECV.editDoc; renderAll(); }
/* R4 · B7: this is the field the whole documented-purchase story rests on. Sanitise on write
   (an Armenian ՀՎՀՀ is exactly 8 digits), escape on render. */
function recvDocSet(k, v){
  if(!RECV) return;
  setTimeout(saveRecv, 0);
  v = String(v==null?'':v);
  if(k==='tin') v = v.replace(/\D/g,'').slice(0,8);
  else if(k==='no') v = v.replace(/[<>"'&]/g,'').slice(0,30);
  else v = v.replace(/[<>"'&]/g,'').slice(0,40);
  RECV.doc[k] = v;
}
const recvTinOk = () => !RECV || !RECV.doc.tin || /^\d{8}$/.test(String(RECV.doc.tin));
const recvDocDate = d => typeof d === 'number' ? fdateY(d) : String(d||'');
function confirmReceipt(){
  if(!RECV) return;
  if(tapGuard('recv')) return;
  navGuard();                          // the confirm button sits right over the bottom nav
  const o = S.orders.find(x=>x.id===RECV.oid);
  if(!o || o.receipt){ RECV=null; toast(t('recv_already')); renderAll(); return; }
  const lines = o.items.map(it=>{
    const pid = it.productId, shipped = recvShipped(it);
    const received = Math.max(0, RECV.q[pid]!=null ? RECV.q[pid] : shipped);
    const diff = received - shipped;
    return {pid, shipped, received, diff, price:it.price,
      reason: diff<0 ? (RECV.r[pid]||'short') : diff>0 ? 'over' : ''};
  });
  lines.forEach(l=>{
    if(l.received > 0){
      // this is the moment a purchase becomes a DOCUMENTED purchase (market brief §0)
      /* R4 · the market brief's whole commercial case: a receipt is only worth anything if the
         settlement document that covers it can be produced later. Stamp it on the ledger row. */
      S.history.push({date:S.today, productId:l.pid, sup:o.sup, qty:l.received, price:l.price,
        doc:{no:(RECV.doc||{}).no||'', date:(RECV.doc||{}).date||S.today, tin:(RECV.doc||{}).tin||'', order:o.id}});
      postMove({pid:l.pid, type:'receipt', dq:l.received, cost:l.price, ref:o.id, reason:l.reason, actor:'shop'});
      /* AFTER postMove, never before: on-hand already includes the receipt, so reconcileBatches()
         cannot trim the batch we are about to create. */
      if(itemMeta(l.pid).perishable) addBatch({pid:l.pid,
        exp:(RECV.exp||{})[l.pid]!=null ? RECV.exp[l.pid] : null,
        qty:l.received, cost:l.price, ref:o.id});
    }
  });
  compactBatches(); checkExpiry();
  const diffAmd = lines.reduce((a,l)=>a + l.diff*l.price, 0);
  o.receipt = {ts:S.today, rts:Date.now(), doc:Object.assign({}, RECV.doc), lines, diff:diffAmd, actor:'shop'};
  if(diffAmd !== 0){
    S.bills.push({id:'ADJ-'+(S.seq++), sup:o.sup, date:S.today, amount:diffAmd, adj:true, paid:true, paidDate:S.today,
      ref:RECV.doc.no, items:lines.filter(l=>l.diff!==0).map(l=>({productId:l.pid, qty:l.diff, price:l.price}))});
    // never clamp at 0: on a fully-paid account a short receipt leaves a real credit, and the
    // Պարտքեր tab must agree with the Համեմատման ակտ down to the last dram
    S.debts[o.sup] = (S.debts[o.sup]||0) + diffAmd;
  }
  checkStockouts();
  logEv('recv',{oid:o.id});
  if(diffAmd) logEv('diff',{oid:o.id});
  RECV = null; saveRecv(); saveD(); toast('📥 '+t('recv_done')); renderAll();
}

/* ----- Դուրսգրում · write-off with mandatory reason codes (R1 · F3) ----- */
let WO = null;
const WO_CODES = ['expired','damaged','theft','own','fix'];
/* opts is optional, so every R1/R2 call site (openItemSheet) keeps working unchanged; R3's
   «Դուրսգրում (ժամկետանց)» pre-fills the batch quantity and the Ժամկետանց reason. */
/* R4 · MD: a batch-scoped sheet headed «Խմբաքանակ B-1 · 4 օգս» that then says «Մնացորդ 20 հատ»
   and steps to 20 invites writing off 20 kg of yogurt to bin one expired unit. */
function woBatch(){ return WO && WO.batch ? (S.batches||[]).find(x=>x && x.id===WO.batch && x.pid===WO.pid && x.left>0) : null; }
function woCap(){ const b = woBatch(); return Math.max(1, b ? b.left : onHand(WO.pid)); }
function openWriteoff(pid, opts){
  const b0 = (opts && opts.batch) ? (S.batches||[]).find(x=>x && x.id===String(opts.batch) && x.pid===pid && x.left>0) : null;
  const cap = Math.max(1, b0 ? b0.left : onHand(pid));
  const q = Math.max(1, Math.min(cap, Math.floor(+((opts&&opts.qty))||1)));
  WO = {pid, qty:q, reason:(opts && WO_CODES.indexOf(opts.reason)>=0) ? opts.reason : '', note:'', err:false,
        batch:(opts && opts.batch) ? String(opts.batch) : ''};
  renderWriteoff();
}
function renderWriteoff(){ MODAL_RE=()=>renderWriteoff(); armPushOverlay();
  if(!WO) return;
  const pid = WO.pid, p = P(pid); if(!p) return;
  const im = itemMeta(pid), have = onHand(pid);
  const body = have<=0
    ? `<div class="empty"><span class="em">📦</span>${t('wo_nostock')}</div>`
    : `<div class="row" style="margin:12px 0 2px"><span class="muted">${woBatch()?t('exp_batch_left'):t('onhand_lbl')}</span>
        <span><span class="big num">${woBatch()?woBatch().left:have}</span> <span class="muted">${unitOf(pid)}</span></span></div>
      <div class="qtyctl" style="transform:scale(1.15);margin:14px auto;width:max-content">
        <button onclick="woQty(-1)">−</button><span>${WO.qty}</span><button onclick="woQty(1)">+</button></div>
      <div class="sec">${t('wo_reason')}</div>
      ${WO.err?`<div style="color:var(--rose);font-size:12px;font-weight:700;margin:-6px 0 8px">${t('wo_reason_req')}</div>`:''}
      <div class="chips wrap">${WO_CODES.map(c=>`<button class="${WO.reason===c?'active':''}" onclick="woReason('${c}')">${t(REASON_KEY[c])}</button>`).join('')}</div>
      <input id="woNote" class="search" style="margin-top:8px" maxlength="80" placeholder="${t('wo_note')}" value="${String(WO.note||'').replace(/"/g,'&quot;')}" oninput="woNote(this.value)">
      <button class="btn danger full" style="margin-top:6px" onclick="confirmWriteoff()">✓ ${t('wo_confirm')}</button>`;
  // the note input is recreated on every render, so hand focus + caret back to it
  const ae = document.activeElement;
  const keepNote = !!(ae && ae.id==='woNote');
  const caret = keepNote ? ae.selectionStart : null;
  document.getElementById('modalRoot').innerHTML = `<div class="modal" onclick="if(event.target===this){WO=null;closeModal()}">
    <div class="mbody"><div class="grabber"></div><h3>📉 ${t('wo_title')}</h3>
    <div class="muted">${p.em} ${goodNameOf(pid)}${(()=>{ const b=(S.batches||[]).find(x=>x && x.id===WO.batch);
      return b ? ` · ${t('exp_batch')} ${escH(b.id)}${b.exp!=null?' · '+fdateY(b.exp):''}` : ''; })()}</div>
    ${body}
    <button class="btn ghost full" style="margin-top:9px" onclick="WO=null;closeModal()">${t('close')}</button></div></div>`;
  if(keepNote){ const el = document.getElementById('woNote');
    if(el){ el.focus(); try{ el.setSelectionRange(caret, caret); }catch(e){} } }
}
function woQty(d){ if(!WO) return; WO.qty = Math.max(1, Math.min(woCap(), WO.qty + d)); renderWriteoff(); }
function woReason(code){ if(!WO) return; WO.reason = code; WO.err = false; renderWriteoff(); }
function woNote(v){ if(WO) WO.note = v; }   // no re-render: keeps the caret where the user left it
function confirmWriteoff(){
  if(!WO) return;
  if(!WO.reason){ WO.err = true; toast(t('wo_reason_req')); renderWriteoff(); return; }
  const pid = WO.pid, have = onHand(pid);
  // another tab may have sold the last unit while this sheet sat open — refuse, never post −1
  if(have<=0){ WO = null; closeModal(); toast(t('wo_nostock')); renderAll(); return; }
  const qty = Math.max(1, Math.min(have, WO.qty));
  const wb = (S.batches||[]).find(b=>b && b.id===WO.batch && b.pid===pid && b.left>0);
  postMove({pid, type:'writeoff', dq:-qty, cost:(wb && wb.cost) ? wb.cost : costOf(pid), ref:'',
            reason:WO.reason, note:String(WO.note||'').slice(0,80), actor:'shop', batch:wb ? wb.id : ''});
  /* NEVER push to S.sales here. Spoilage is not demand — keeping it out of S.sales is what
     stops a broken bottle from inflating velOf() and every future order suggestion. */
  logEv('writeoff',{pid, qty, reason:WO.reason});
  checkStockouts();
  WO = null; closeModal(); saveD(); toast('−'+qty+' · '+t('wo_done')); renderAll();
}
function shrinkSummary(mk){
  mk = mk || monthKey(S.today);
  const byReason = {}; let units = 0, val = 0;
  (S.moves||[]).forEach(m=>{
    if(!m || m.type!=='writeoff' || monthKey(m.ts)!==mk) return;
    const u = Math.abs(+m.dq||0), a = u*(+m.cost||0), r = m.reason||'fix';
    byReason[r] = byReason[r] || {units:0, amd:0};
    byReason[r].units += u; byReason[r].amd += a;
    units += u; val += a;
  });
  const spend = (S.history||[]).filter(h=>monthKey(h.date)===mk).reduce((a,h)=>a+h.qty*h.price, 0);
  return {byReason, units, amd:val, pct: spend ? val/spend*100 : 0};
}

  return `<div class="card"><h3>📉 ${t('shrink_title')} · ${t('shrink_month')}</h3>${rows}
    <div class="row" style="border-top:1px solid var(--stroke2);padding-top:10px;margin-top:8px">

    <div class="muted" style="margin-top:7px">${t('shrink_cost')} · ${s.pct.toFixed(1)}% ${t('shrink_share')}</div></div>`;
}

/* ================= R3 · F2 — «Ժամկետներ»: the near-expiry ACTION screen =================
   A list you can only look at is worthless. Every row here ends in a markdown, a Դուրսգրում or a
   request to the supplier, and the whole screen collapses into ONE card on Այսօր — never one
   alert per item, which is the alert-inflation failure mode. */
let EXPUI = {batch:null, pct:30};
function expWarnDays(pid){ const sl = shelfLifeOf(pid); return sl ? Math.min(14, Math.max(2, Math.round(sl*0.30))) : 7; }
function expDaysLeft(b){ return (!b || b.exp==null) ? null : Math.floor((b.exp - S.today)/DAY); }
function expState(b){
  if(!b || b.exp==null) return 'none';
  const d = expDaysLeft(b);
  if(d < 0) return 'expired';
  if(d <= 1) return 'crit';
  if(d <= expWarnDays(b.pid)) return 'soon';
  return 'ok';
}
function expBadge(b){
  const st = expState(b);
  if(st==='none') return `<span class="badge b-neutral">${t('exp_unknown')}</span>`;
  const d = expDaysLeft(b);
  if(st==='expired') return `<span class="badge b-rose">${t('exp_group_over')}</span>`;
  if(d===0) return `<span class="badge b-rose">${t('exp_last_day')}</span>`;
  const cls = st==='crit' ? 'b-rose' : st==='soon' ? 'b-gold' : 'b-neutral';
  return `<span class="badge ${cls}">${fmt('exp_left',{n:d})}</span>`;
}
/* the batch already stores what was actually paid for it (addBatch); costOf() — the LAST receipt
   cost — is only the fallback for a batch that arrived without one */
function expAmd(b){
  if(!b || !(b.left>0)) return 0;
  const c = (typeof b.cost==='number' && isFinite(b.cost) && b.cost>0) ? b.cost : costOf(b.pid);
  return b.left * c;
}
const EXP_RANK = {expired:0, crit:1, soon:2};
function expRows(){
  const all = (S.batches||[]).filter(b=>b && b.left>0 && EXP_RANK[expState(b)]!=null)
    .sort((a,b)=>(EXP_RANK[expState(a)] - EXP_RANK[expState(b)]) || (expAmd(b) - expAmd(a)));
  return {all, rows: all.slice(0,20), total: all.length};
}
function expAmdAtRisk(){ return expRows().all.reduce((a,b)=>a + expAmd(b), 0); }
function expActionCount(){
  return (S.batches||[]).filter(b=>{ const s = b && b.left>0 ? expState(b) : 'ok'; return s==='expired' || s==='crit'; }).length;
}
function nearestExpOf(pid){ return batchesOf(pid).filter(b=>b.exp!=null)[0] || null; }
/* one event per batch, ever — an expiry that logged yesterday must not log again today */
function checkExpiry(){
  if(!S.expFlag || typeof S.expFlag!=='object') S.expFlag = {};
  const live = {};
  (S.batches||[]).forEach(b=>{
    if(!b || !(b.left>0)) return;
    live[b.id] = 1;
    const st = expState(b);
    if((st==='expired' || st==='crit') && !S.expFlag[b.id]){
      S.expFlag[b.id] = true;
      logEv('exp', {pid:b.pid, id:b.id, d:expDaysLeft(b)});
    }
  });
  Object.keys(S.expFlag).forEach(k=>{ if(!live[k]) delete S.expFlag[k]; });
}
/* The SHOP's own retail markdown. NOT S.promos — that is the supplier's −10% on the purchase
   price and is rendered on the supplier console. A markdown is a shop pricing decision and
   deliberately logs NO event, because S.events renders on both sides. */
/* A markdown suppresses reorder, so it must never be a one-way door: it runs out on its own
   after MD_DAYS and can always be ended from the item card (R3 defect fix). */
const MD_DAYS = 14;
function mdDaysLeft(m){
  if(!m || typeof m!=='object') return 0;
  const ts = (typeof m.ts==='number' && isFinite(m.ts)) ? m.ts : S.today;
  return Math.max(0, MD_DAYS - Math.floor((S.today - ts)/DAY));
}
function mdOf(pid){
  const m = (S.markdowns||{})[pid];
  if(!m || typeof m!=='object') return null;
  return mdDaysLeft(m) > 0 ? m : null;     // expired markdowns read as absent; sweepMarkdowns() clears them
}
function mdActive(pid){ return !!mdOf(pid); }
function sweepMarkdowns(){
  if(!S.markdowns || typeof S.markdowns!=='object') return 0;
  let n = 0;
  Object.keys(S.markdowns).forEach(pid=>{ if(mdDaysLeft(S.markdowns[pid])<=0){ delete S.markdowns[pid]; n++; } });
  return n;
}
function setMarkdown(pid, pct){
  if(!P(pid)) return;
  if(!S.markdowns || typeof S.markdowns!=='object') S.markdowns = {};
  S.markdowns[pid] = {pct: [20,30,50].indexOf(+pct)>=0 ? +pct : 30, ts:S.today, from:'exp'};
  saveD(); toast('🏷 '+t('md_done')); renderAll();
}
function clearMarkdown(pid){
  if(S.markdowns) delete S.markdowns[pid];
  saveD(); toast(t('md_off')); renderAll();
}
function openExpSheet(bid){

}
function expSheetPct(p){ if(!EXPUI) return; EXPUI.pct = [20,30,50].indexOf(+p)>=0 ? +p : 30; renderExpSheet(); }
function renderExpSheet(){ MODAL_RE=()=>renderExpSheet(); armPushOverlay();
  const b = (S.batches||[]).find(x=>x && x.id===(EXPUI||{}).batch);
  if(!b){ closeModal(); return; }

  document.getElementById('modalRoot').innerHTML = `<div class="modal" onclick="if(event.target===this){EXPUI.batch=null;closeModal()}">
    <div class="mbody"><div class="grabber"></div>

    <div style="margin-top:10px">${expBadge(b)} <span class="badge b-neutral">${Math.round(expAmd(b)).toLocaleString('en-US')} ֏ ${lcFirst(t('exp_at_risk'))}</span></div>
    <button class="btn danger full" style="margin-top:16px" onclick="EXPUI.batch=null;openWriteoff('${pid}',{qty:${b.left},reason:'expired',batch:'${b.id}'})">${t('wo_open_exp')}</button>
    <div class="sec">🏷 ${t('md_title')}</div>
    ${md
      ? `<div class="muted" style="margin-bottom:8px">${fmt('md_on',{n:md.pct})}</div>
         <button class="btn ghost full" onclick="EXPUI.batch=null;closeModal();clearMarkdown('${pid}')">${t('md_stop')}</button>`
      : `<div class="chips wrap">${[20,30,50].map(v=>`<button class="${EXPUI.pct===v?'active':''}" onclick="expSheetPct(${v})">−${v}%</button>`).join('')}</div>
         <button class="btn primary" onclick="EXPUI.batch=null;closeModal();setMarkdown('${pid}',${EXPUI.pct})">${t('md_btn')}</button>`}
    <div class="muted" style="font-size:11px;margin-top:8px">${t('md_hint')}</div>
    <button class="btn violet full" style="margin-top:16px" onclick="EXPUI.batch=null;openReqSheet('${pid}','exp')">${t('req_btn')}</button>
    <button class="btn ghost full" style="margin-top:9px" onclick="EXPUI.batch=null;openItemSheet('${pid}')">${t('item_card')}</button>
    <button class="btn ghost full" style="margin-top:9px" onclick="EXPUI.batch=null;closeModal()">${t('close')}</button>
    </div></div>`;

/* showReq is false on every batch row after the first for the same SKU: reqFor() keys on the

      <div class="sub">${t('exp_batch')} ${escH(b.id)} · ${b.exp!=null ? `<b>${t('exp_until')} ${fdateY(b.exp)}</b>` : t('exp_unknown')}</div>

/* ================= R3 · F3 — the supplier half of the loop =================
   Hard boundary: the supplier sees product name, quantity and days-to-expiry. Never a selling
   price, never a margin, never an ֏ figure derived from the shop's stock. */
let REQUI = {pid:null, kind:'exp', qty:1};
function openReqs(){ return (S.swapReqs||[]).filter(r=>r && r.status==='open'); }
function reqFor(pid){ const l = (S.swapReqs||[]).filter(r=>r && r.pid===pid); return l.length ? l[l.length-1] : null; }
function reqBadge(pid){
  const r = reqFor(pid); if(!r) return '';
  if(r.reply==='swap') return ` <span class="badge b-green">${t('req_r_swap')}</span>`;
  if(r.reply==='back') return ` <span class="badge b-green">${t('req_r_back')}</span>`;
  if(r.reply==='no')   return ` <span class="badge b-neutral">${t('req_r_no')}</span>`;
  return r.status==='open' ? ` <span class="badge b-violet">📨 ${t('req_open_badge')}</span>` : '';
}
function openReqSheet(pid, kind){
  const p = P(pid); if(!p) return;
  const ex = openReqs().filter(r=>r.pid===pid)[0];
  if(ex){ toast(t('req_dup')); renderReqSheet(ex); return; }
  const k = kind==='dead' ? 'dead' : 'exp';
  const nb = nearestExpOf(pid);
  const want = k==='dead' ? onHand(pid) : ((nb && nb.left) || onHand(pid));
  REQUI = {pid, kind:k, qty: Math.max(1, Math.min(Math.max(1, onHand(pid)), want || 1))};
  renderReqSheet(null);
}
function reqQty(d){
  if(!REQUI || !REQUI.pid) return;
  REQUI.qty = Math.max(1, Math.min(Math.max(1, onHand(REQUI.pid)), (+REQUI.qty||1) + d));
  renderReqSheet(null);
}
function renderReqSheet(existing){ MODAL_RE=()=>renderReqSheet(existing); armPushOverlay();
  const pid = existing ? existing.pid : REQUI.pid;
  const p = P(pid); if(!p) return;
  const sup = SUP(p.sup) || {};
  const body = existing
    ? `<div class="row" style="margin:14px 0"><span class="muted">${existing.kind==='dead'?t('req_kind_dead'):t('req_kind_exp')}</span>
        <span><b class="num">${existing.qty}</b> ${unitOf(pid)}</span></div>
       <div>${reqBadge(pid)}</div>
       ${(existing.reply==='swap'||existing.reply==='back')?`<button class="btn primary" style="margin-top:14px" onclick="closeModal();shopReturnToSup('${existing.id}')">${t('ret_to_sup')}</button>`:''}`
    : `<div class="row" style="margin:16px 0"><span class="muted">${t('qty')}</span>
        <span class="qtyctl"><button onclick="reqQty(-1)">−</button><span>${REQUI.qty}</span><button onclick="reqQty(1)">+</button></span></div>
       <div class="row" style="padding:6px 0"><span class="muted">${t('supplier_col')}</span><b>${sup.em||''} ${nm(sup)}</b></div>

/* ================= R3 · F4 — explainable replenishment =================
   Min-stock + the app's existing velocity model + a light whole-day safety term + the supplier's
   LEARNED lead time. No smoothing, no Croston, no ML — every number here must be sayable out loud
   in one clause, and nothing is ever auto-ordered. */
const MAX_COVER = 21;
let REPQ = {};
function repMedian(a){
  const s = a.slice().sort((x,y)=>x-y);
  if(!s.length) return 0;
  const m = Math.floor(s.length/2);
  return s.length%2 ? s[m] : (s[m-1]+s[m])/2;
}
function leadStats(sup){
  const mine = (S.orders||[]).filter(o=>o && o.shop && o.shop.id==='me' && o.sup===sup && o.status==='delivered')
    .sort((a,b)=>(b.date||0)-(a.date||0)).slice(0,10);
  const ds = []; let ok = 0;
  mine.forEach(o=>{
    /* the DELIVERY, never the shopkeeper's Ընդունում tap: a shop that files its paperwork the
       next morning must not turn a punctual supplier into a late one (and inflate min stock).
       Older orders with no stamp fall back to the previous behaviour rather than crash. */
    const arr = (typeof o.deliveredTs==='number' && isFinite(o.deliveredTs)) ? o.deliveredTs
              : ((o.receipt && o.receipt.ts) ? o.receipt.ts : (o.deliveryDate||0));
    if(!arr || !o.date) return;
    const d = Math.max(1, Math.round((arr - o.date)/DAY));
    if(d > 60) return;
    ds.push(d);
    if(o.deliveryDate && arr <= o.deliveryDate) ok++;
  });
  if(ds.length < 3) return {lead:2, n:ds.length, ok:0, low:true};   // documented fallback
  return {lead: Math.max(1, Math.floor(repMedian(ds))), n:ds.length, ok, low:false};
}
function safetyDaysOf(sup){ const ls = leadStats(sup); return (!ls.low && ls.n && ls.ok/ls.n >= 0.8) ? 1 : 2; }
function orderCycleOf(sup){
  const dates = [...new Set((S.orders||[]).filter(o=>o && o.shop && o.shop.id==='me' && o.sup===sup).map(o=>o.date))].sort((a,b)=>a-b);
  const gaps = []; for(let i=1;i<dates.length;i++) gaps.push((dates[i]-dates[i-1])/DAY);
  if(gaps.length >= 2) return Math.max(2, Math.min(14, Math.round(repMedian(gaps))));
  const cy = PRODUCTS.filter(p=>p.sup===sup).map(p=>{ const s = stats(p.id); return s ? s.cycle : 0; }).filter(x=>x>0);
  if(cy.length) return Math.max(2, Math.min(14, Math.round(repMedian(cy))));
  return 7;
}
/* boxes that are on the way or on the floor but not yet in the ledger — counting them is what
   stops the same shortage being ordered twice */
function onOrderQty(pid){
  let s = 0;
  (S.orders||[]).forEach(o=>{
    if(!o || !o.shop || o.shop.id!=='me') return;
    if(!(o.status==='new' || o.status==='confirmed' || (o.status==='delivered' && !o.receipt))) return;
    (o.items||[]).forEach(it=>{
      if(it.productId!==pid) return;
      s += (o.status==='delivered' && it.delivered!=null) ? it.delivered : it.qty;
    });
  });
  return s;
}
function saleDays14(pid){
  const cut = S.today - 14*DAY;
  const d = {};
  (S.sales||[]).forEach(s=>{ if(s && s.productId===pid && s.date>=cut) d[s.date]=1; });
  return Object.keys(d).length;
}
function minStockOf(pid){
  const u = (S.minStock||{})[pid];
  if(typeof u==='number' && isFinite(u) && u>=0) return {v:Math.floor(u), auto:false};
  const p = P(pid) || {};
  const ls = leadStats(p.sup);
  return {v: Math.max(1, Math.ceil(velOf(pid) * (ls.lead + safetyDaysOf(p.sup)))), auto:true};
}
function setMinStock(pid, v){
  if(!P(pid)) return;
  if(!S.minStock || typeof S.minStock!=='object') S.minStock = {};
  S.minStock[pid] = Math.max(0, Math.min(9999, Math.floor(+v||0)));
  saveD(); renderAll();
  if(ITEMSHEET===pid) openItemSheet(pid);
}
function clearMinStock(pid){
  if(S.minStock) delete S.minStock[pid];
  saveD(); renderAll();
  if(ITEMSHEET===pid) openItemSheet(pid);
}
function velTxt(v){ return v < 1 ? v.toFixed(1) : String(Math.round(v)); }
function replenish(){
  const out = [];
  PRODUCTS.forEach(p=>{
    const pid = p.id;
    if(mdActive(pid)) return;                       // never reorder what you are dumping
    const oo = onOrderQty(pid), oh = onHand(pid), pos = oh + oo;
    const ms = minStockOf(pid);
    if(pos > ms.v) return;                          // the trigger, and the only one
    const ls = leadStats(p.sup), safety = safetyDaysOf(p.sup), cyc = orderCycleOf(p.sup);
    const vel = velOf(pid);
    const cover = Math.min(ls.lead + safety + cyc, MAX_COVER);
    let target = Math.ceil(vel * cover), cap = '';
    const sl = shelfLifeOf(pid);
    if(itemMeta(pid).perishable && sl){
      const fresh = Math.floor(vel * sl * 0.70);    // never order more than can be sold fresh
      if(fresh < target){ target = fresh; cap = 'exp'; }
      else if(cover >= MAX_COVER) cap = 'cover';
    } else if(cover >= MAX_COVER) cap = 'cover';
    const need = target - pos;
    if(need <= 0) return;
    const pack = Math.max(1, +p.pack||1), moq = Math.max(1, +p.moq||1);
    const qty = Math.max(moq, Math.ceil(need/pack)*pack);
    /* pack/MOQ rounding happens AFTER the shelf-life cap and can push straight through it. We do
       not silently order past the cap: the row says so out loud (see repRow). */
    out.push({pid, sup:p.sup, vel, lead:ls.lead, safety, cycle:cyc, cover, target, pos, onHand:oh, onOrder:oo,
      min:ms.v, minAuto:ms.auto, need, qty, pack, moq, cap, shelf:sl,
      after: Math.round((pos+qty)/Math.max(vel, 0.01)),
      dcov: oh/Math.max(vel, 0.01),
      conf: saleDays14(pid) < 5 ? 'low' : 'ok'});
  });
  out.sort((a,b)=>a.dcov - b.dcov);
  /* a hand-edited quantity belongs to the suggestion it was made against — drop every edit whose
     row has left the list, so a stale number can never resurface days later */
  const live = {}; out.forEach(r=>live[r.pid]=1);
  Object.keys(REPQ).forEach(k=>{ if(!live[k]) delete REPQ[k]; });
  return out.slice(0,20);
}
/* the signature of the suggestion an edit was made against */
function repSig(r){ return [r.qty, r.pos, r.min, r.cover].join('|'); }
function repQtyOf(r){
  const e = REPQ[r.pid];
  return (e && typeof e==='object' && e.sig===repSig(r) && isFinite(+e.q)) ? Math.max(r.moq, +e.q) : r.qty;
}
function repAfter(r, q){ return Math.round((r.pos + q)/Math.max(r.vel, 0.01)); }
/* returns the shelf life (days) when the pack/MOQ quantity actually outruns it, else 0 */
function repOverExp(r, q){
  const sl = r.shelf || shelfLifeOf(r.pid);

}
/* the after-order cover is recomputed from the quantity CURRENTLY in the stepper — the reason
   line is the whole trust mechanism and must never explain a different number */
/* R4 · MD: four chained clauses wrapped to three lines beside the stepper on the primary daily
   screen. One line, consequence first; the rate and the after-order cover move behind the ⋯
   item card (repReasonFull). */
function repReason(r, q){
  const d = Math.max(0, Math.round(r.dcov));
  return d<=0 ? fmt('rep_why_now',{l:r.lead}) : fmt('rep_why_one',{d, l:r.lead});
}
function repReasonFull(r, q){
  const qq = q==null ? repQtyOf(r) : q;
  return [fmt('rep_why_vel',{v:velTxt(r.vel)}), fmt('rep_why_lead',{n:r.lead}),
          fmt('rep_why_left',{n:Math.max(0, Math.round(r.dcov))}),
          fmt('rep_after',{n:repAfter(r, qq)})].join(' · ');
}
function repQty(pid, d){
  const r = replenish().find(x=>x.pid===pid); if(!r) return;
  const cur = repQtyOf(r);
  REPQ[pid] = {q: Math.max(r.moq, cur + d*Math.max(1, r.pack)), sig: repSig(r)};
  renderAll();
}
function repAdd(pid){
  const r = replenish().find(x=>x.pid===pid);
  const q = r ? repQtyOf(r) : 1;
  addToBasket(pid, Math.max(1, q));
}
function repAddAll(sup){
  const rows = replenish().filter(r=>r.sup===sup);
  let n = 0;
  rows.forEach(r=>{
    if(S.basket[r.pid]) return;
    S.basket[r.pid] = Math.max(1, repQtyOf(r)); n++;
  });

function repRow(r){
