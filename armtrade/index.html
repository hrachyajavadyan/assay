  /* R11 · A2 — the «» beside the new-item sheet's barcode field: a code that already belongs to
     a SKU is not a new item, so the sheet is told and the existing SKU is named. */
  if(SCAN.mode==='newitem'){
    const code = (info && info.code) ? String(info.code) : '';
    if(NEWITEM){ NEWITEM.ean = ''; NEWITEM.err = 'ean'; }
    closeScanner();
    if(NEWITEM) renderNewItem();
    toast(fmt('ni_ean_dup',{name: goodNameRaw(pid)}));
    return;
  }
  const emb = info && info.emb ? info.emb : null;
  const el = emb ? embLabel(emb) : '';
  if(SCAN.mode==='recv'){
    if(!RECV){ closeScanner(); return; }
    const o = S.orders.find(x=>x.id===RECV.oid);
    if(!o || o.receipt){ closeScanner(); return; }
    if(!o.items.some(x=>x.productId===pid)){ toast(t('scan_not_in_order')); return; }
    recvQty(pid, 1);                       // renderAll() rewrites #app, never #modalRoot
    toast(`${goodNameRaw(pid)} · ${RECV.q[pid]}`);
    return;
  }
  /* R8 · scanning the cartons of an off-app delivery straight into «Ընդունել առանց պատվերի» */
  if(SCAN.mode==='mrecv'){
    if(!MRECV){ closeScanner(); return; }
    const pr = P(pid) || {};
    if(pr.sup !== MRECV.sup) MRECV.sup = pr.sup;      // follow the carton, not the chip
    MRECV.q[pid] = Math.max(0, Math.min(9999, (+MRECV.q[pid]||0) + 1));
    toast(`${goodNameRaw(pid)} · ${MRECV.q[pid]}`);
    return;
  }
  if(SCAN.mode==='count'){
    if(!S.count){ closeScanner(); return; }
    if(countScopeList().indexOf(pid) < 0){ toast(t('count_scope_out')); return; }
    closeScanner();
    openCountEntry(pid, true);
    return;
  }
  // POS: a mis-scan must never silently sell stock, so hits land in a tray and wait for a confirm
  if(onHand(pid) <= 0){ toast(t('out_of_stock')); return; }
  SCAN.tray[pid] = Math.min((SCAN.tray[pid]||0) + 1, onHand(pid));
  if(el) SCAN.trayEmb[pid] = el; 
  scanRenderTray();
  toast(`＋1 · ${goodNameRaw(pid)}${el?' · '+el:''}`);

   ZXing WASM reader (vendor/, 36 KB of glue + 824 KB of wasm) is fetched ON FIRST USE — never at
   boot, because the data plan is his — and cached by the service worker from then on. */
let ZX = null, zxLoading = null;
function zxSupported(){
  return typeof WebAssembly === 'object' && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
}
function scanCamPossible(){ return ('BarcodeDetector' in window) || zxSupported(); }
function zxLoad(){
  if(ZX) return Promise.resolve(ZX);
  if(zxLoading) return zxLoading;
  zxLoading = new Promise((res, rej)=>{
    const sc = document.createElement('script');
    sc.src = 'vendor/zxing-reader.js';
    sc.onload = ()=>{
      try{
        const M = window.ZXingWASM;
        if(!M) return rej(new Error('no ZXingWASM'));
        M.setZXingModuleOverrides({locateFile:(path, prefix)=>
          (String(path).slice(-5)==='.wasm') ? 'vendor/zxing_reader.wasm' : (prefix + path)});
        M.getZXingModule().then(()=>{ ZX = M; res(M); }).catch(rej);
      }catch(e){ rej(e); }
    };
    sc.onerror = ()=>rej(new Error('zxing script failed'));
    document.head.appendChild(sc);
  });
  zxLoading.catch(()=>{ zxLoading = null; });
  return zxLoading;
}
async function scanCamStart(){
  if(!SCAN) return;
  const native = ('BarcodeDetector' in window);
  if(!native){
    if(!zxSupported()) return;
    if(!ZX){
      SCAN.loading = true; SCAN.err=''; renderScanner();
      try{ await zxLoad(); }
      catch(e){ if(SCAN){ SCAN.loading=false; SCAN.err = t('scan_engine_fail'); renderScanner(); } return; }
      if(!SCAN) return;
      SCAN.loading = false;
    }
  }
  try{
    if(native && !scanDet){
      let formats = ['ean_13','ean_8','upc_a','upc_e','code_128','itf','qr_code'];
      try{
        const sup = await window.BarcodeDetector.getSupportedFormats();
        if(Array.isArray(sup) && sup.length){ const f = formats.filter(x=>sup.indexOf(x)>=0); if(f.length) formats = f; }
      }catch(e){}
      scanDet = new window.BarcodeDetector({formats});
    }
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('no getUserMedia');
    scanStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},
      width:{ideal:1920}, height:{ideal:1080}}});
    if(!SCAN){ try{ scanStream.getTracks().forEach(x=>x.stop()); }catch(e){} scanStream=null; return; }
    SCAN.cam = true; SCAN.err = '';
    renderScanner();
    scanLoop();
  }catch(e){
    try{ if(scanStream) scanStream.getTracks().forEach(x=>x.stop()); }catch(e2){}
    scanStream = null;
    if(SCAN){ SCAN.cam = false; SCAN.err = t('scan_cam_denied'); renderScanner(); }
  }
}
function scanCamStop(){
  clearTimeout(scanTimer); scanTimer = null;
  try{ if(scanStream) scanStream.getTracks().forEach(tr=>{ try{ tr.stop(); }catch(e){} }); }catch(e){}
  scanStream = null;
  if(SCAN){ SCAN.cam = false; }
}
/* ~10 fps setTimeout chain (NOT rAF) over the centre band only: ~6× less CPU than full frames,
   and the human aims at the band anyway. Every step is try/caught so one bad frame never stops it. */
const ZX_FORMATS = ['EAN-13','EAN-8','UPC-A','UPC-E','Code128','Code39','ITF','DataBar','QRCode'];
function scanLoop(){
  clearTimeout(scanTimer);
  const wasm = !scanDet && !!ZX;
  scanTimer = setTimeout(async ()=>{
    if(!SCAN || !SCAN.cam || !scanStream || (!scanDet && !ZX)) return;
    try{
      const v = document.getElementById('scanVideo');
      if(v && v.videoWidth > 0){
        const w = v.videoWidth, h = v.videoHeight;
        const y = Math.round(h*0.35), bh = Math.round(h*0.30);
        if(!scanCanvas) scanCanvas = document.createElement('canvas');
        if(scanCanvas.width!==w || scanCanvas.height!==bh){ scanCanvas.width = w; scanCanvas.height = bh; }
        const ctx = scanCanvas.getContext('2d', {willReadFrequently:true});
        ctx.drawImage(v, 0, y, w, bh, 0, 0, w, bh);
        if(scanDet){
          const res = await scanDet.detect(scanCanvas);
          if(res && res.length && res[0] && res[0].rawValue) onScanCode(res[0].rawValue, true);
        } else {
          const img = ctx.getImageData(0, 0, scanCanvas.width, scanCanvas.height);
          const res = await ZX.readBarcodesFromImageData(img, {formats:ZX_FORMATS, tryHarder:false, maxNumberOfSymbols:1});
          const hit = res && res.find(x=>x && x.text);
          if(hit) onScanCode(hit.text, true);
        }
      }
    }catch(e){}
    /* the wasm reader costs ~10× the native detector per frame, so it runs at ~3 fps on a cheap
       phone instead of 10 — still faster than a human can re-aim, and it keeps the UI alive. */
    if(SCAN && SCAN.cam && scanStream) scanLoop();
  }, wasm ? 320 : 100);
}

/* ================= R2 · F3/F4 — «Գույքագրում»: blind, resumable, non-blocking =================
   MoF order N 102 makes a count a legal act, so it ends in a document, not a screen. Blind by
   default: showing the expected number first is how counts become confirmations of a wrong book. */
let COUNTUI = {review:false, cancelArm:false, q:'', entry:null};
function countScopePids(scope){
  scope = scope || {kind:'all'};
  const ALL = catalogActive().map(p=>p.id);
  if(scope.kind==='sup'){
    const ids = catalogActive().filter(p=>p.sup===scope.sup).map(p=>p.id);
    return ids.length ? ids : ALL;                     // supplier gone: fall back, never empty
  }
  if(scope.kind==='risk') return countRisk().map(r=>r.pid);
  /* R11 · A2 — the shopkeeper's own SKUs are the shelf he is most likely to want counted alone */
  if(scope.kind==='own'){
    const ids = ownItems().map(x=>x.id);
    return ids.length ? ids : ALL;
  }
  if(scope.kind==='abc'){
    const ids = abcRows().filter(r=>r.cls==='A').map(r=>r.pid);
    return ids.length ? ids : ALL;
  }
  if(scope.kind==='cat'){
    const ids = catalogActive().filter(p=>catOf(p.id)===scope.key).map(p=>p.id);
    return ids.length ? ids : ALL;
  }
  return ALL;
}
/* R16 · ONE definition of what a count's scope is CALLED, because there were three and they
   disagreed. The session screen resolved all six kinds; the printed act resolved two and printed
   «Բոլորը» for the other four; and the CSV printed the raw key — `all`, `abc`, `cat` — in a
   column headed «Ի՞նչը հաշվենք», which is the same defect the four report CSVs had before round D
   (a machine-readable id where the screen beside it shows a human word, in a file the shop's
   accountant opens). A count act is a document a shop signs: the scope column is what says which
   shelf the ±variance was measured against, so an id there is not a cosmetic problem.
   No new strings — every branch reuses a key the screen already shows. */
function countScopeLabel(scope){
  const s = scope || {};
  if(s.kind==='risk') return t('count_scope_risk');
  if(s.kind==='own')  return t('cat_own');
  if(s.kind==='abc')  return t('rpt_scope_a');
  if(s.kind==='cat')  return catLabel(s.key);
  if(s.kind==='sup'){ const su = SUP(s.sup); return (su && su.name) ? nm(su) : t('count_scope_all'); }
  return t('count_scope_all');
}
// the scope is frozen into the session at start, so progress can never move under the counter
function countScopeList(){
  if(!S.count) return [];
  if(Array.isArray(S.count.pids) && S.count.pids.length) return S.count.pids.filter(pid=>P(pid));
  return countScopePids(S.count.scope);
}
function lastCountTs(pid){
  let mx = 0;
  (S.moves||[]).forEach(m=>{ if(m && m.pid===pid && m.type==='count' && (+m.ts||0) > mx) mx = +m.ts||0; });
  return mx;
}
/* Anti-pattern 4: the daily list is capped at 20 and every row carries a human reason. */
function countRisk(){
  const cut = S.today - 30*DAY, rows = [];
  catalogActive().forEach(p=>{
    const pid = p.id; let sc = 0; const why = [];
    if(itemMeta(pid).perishable){ sc += 3; why.push(t('count_reason_perish')); }
    const lc = lastCountTs(pid);
    if(!lc){ sc += 2; why.push(t('count_reason_never')); }
    else { const d = Math.max(0, Math.round((S.today - lc)/DAY));
           if(d > 30){ sc += 2; why.push(d + ' ' + t('count_reason_old')); } }
    if((S.moves||[]).some(m=>m && m.pid===pid && m.type==='writeoff' && (+m.ts||0) >= cut)){ sc += 2; why.push(t('count_reason_wo')); }
    if(stockDays(pid) <= 3){ sc += 2; why.push(t('stockout')); }
    if(velOf(pid) >= 1){ sc += 1; why.push(t('count_reason_fast')); }
    if(sc > 0) rows.push({pid, score:sc, why: why.slice(0,2).join(' · ')});
  });
  rows.sort((a,b)=>b.score - a.score);
  return rows.slice(0,20);
}
const countDocNo = id => String(id||'').replace(/^GG-/, t('count_doc_prefix')+'-');
const countedN = ()=> S.count ? Object.keys(S.count.lines||{}).length : 0;
// an open session with nothing counted yet still shows a mark, so it can never be forgotten
const countNavBadge = ()=> S.count ? (countedN() || '●') : 0;
function countSetName(v){ COUNTUI.name = v; }        // no re-render: keeps the caret, like woNote()
function countSetScope(kind, sup, key){ COUNTUI.scope = {kind, sup: sup||null, key: key==null?'':String(key)}; COUNTUI.nameErr=false; renderAll(); }
function countSetQ(v){ COUNTUI.q = v; renderAll(); }
function startCount(){
  const el = document.getElementById('cntName');
  const name = String((el ? el.value : (COUNTUI.name!=null?COUNTUI.name:S.counterName))||'').trim();
  if(!name){ COUNTUI.nameErr = true; renderAll(); toast(t('count_counter_req')); return; }
  const scope = COUNTUI.scope ? {kind:COUNTUI.scope.kind, sup:COUNTUI.scope.sup||null, key:COUNTUI.scope.key||''} : {kind:'all', sup:null, key:''};
  S.countSeq = (+S.countSeq||0) + 1;
  /* R14 · three random base-31 characters, exactly like every other minted id since R8. With the
     count session now syncing between the shop's own two devices, two devices that both started
     a count would otherwise mint «GG-4» twice and mergeCount() would fuse two physical counts
     into one — the very thing it exists to refuse. */
  S.count = {id:'GG-'+S.countSeq+idTag(3), date:S.today, rts:Date.now(), counter:name.slice(0,60),
             scope, pids:countScopePids(scope), lines:{}};

}
function cancelCount(){ COUNTUI.cancelArm = true; renderAll(); }
function confirmCancelCount(){

const COUNT_QTY_MAX = 999999;
function openCountEntry(pid, fromScan){

function renderCountEntry(){ MODAL_RE=()=>renderCountEntry(); armPushOverlay();
  const e = COUNTUI.entry; if(!e) return;

  document.getElementById('modalRoot').innerHTML = `<div class="modal" onclick="if(event.target===this)closeCountEntry()">

    <input id="cntQty" class="search${e.err?' err':''}" inputmode="numeric" autocomplete="off" maxlength="6"
      style="font-size:32px;text-align:center;font-family:var(--mono);margin-top:14px"

    <button class="btn primary" onclick="saveCountLine()">✓ ${(e.fromScan || nextUncounted(e.pid)) ? t('count_save_next') : t('count_save')}</button>

  const el = document.getElementById('cntQty');

function saveCountLine(){
  const e = COUNTUI.entry; if(!e || !S.count) return;
  const el = document.getElementById('cntQty');
  const s = String((el ? el.value : e.v)||'').trim();
  if(!/^\d+$/.test(s)){ e.err = true; e.errMsg = ''; renderCountEntry(); toast(t('count_qty_req')); return; }
  const n = parseInt(s,10);
  if(!isFinite(n) || n < 0){ e.err = true; renderCountEntry(); toast(t('count_qty_req')); return; }
  /* a գույքագրման ակտ is a legal document and an aisle mistype used to post a count move of
     1e21 straight into the ledger. 999 999 of one SKU is already far past any Armenian shop. */
  if(n > COUNT_QTY_MAX){ e.err = true; e.errMsg = t('count_qty_max'); renderCountEntry(); toast(t('count_qty_max')); return; }
  /* mn is S.moveSeq at the instant the shelf was counted: everything posted AFTER it is known to
     be later than the physical count. Wall-clock is deliberately not used — clocks drift across
     synced devices, S.moveSeq does not. */
  S.count.lines[e.pid] = {counted:n, mn:(+S.moveSeq||0), ts:Date.now()};
  const again = e.fromScan, cur = e.pid;
  COUNTUI.entry = null; closeModal(); saveD(); renderAll();
  if(again){ openScanner('count'); return; }   // the next item is one motion away
  /* R4 · MD: on a phone with no BarcodeDetector this manual path IS the count. The label promised
     a chain and the code closed the sheet — 27+ taps and a scroll-and-find between every SKU.
     Chain to the next UNCOUNTED item in the current scope, keypad still up. */
  const nx = nextUncounted(cur);
  if(nx) openCountEntry(nx);
  else { COUNTUI.review = true; renderAll(); }
}
function nextUncounted(afterPid){
  if(!S.count) return null;
  const pids = (S.count.pids && S.count.pids.length) ? S.count.pids : countScopePids(S.count.scope);
  const done = S.count.lines || {};
  const i = pids.indexOf(afterPid);
  const order = i>=0 ? pids.slice(i+1).concat(pids.slice(0, i+1)) : pids;
  return order.find(pid=>done[pid]==null && P(pid)) || null;
}
function skipCountLine(){ COUNTUI.entry = null; closeModal(); renderAll(); }
function movesSince(pid, mn){
  const m0 = +mn||0; let s = 0;
  (S.moves||[]).forEach(m=>{ if(m && m.pid===pid && (+m.n||0) > m0) s += (+m.dq||0); });
  return s;
}
/* Ընդունում / Դուրսգրում / Վաճառք are three distinct legal acts: a line on a signed
   գույքագրման ակտ may not call a goods receipt a sale, so the note names each type it sums. */
function movesSinceByType(pid, mn){
  const m0 = +mn||0, agg = {}, order = [];
  (S.moves||[]).forEach(m=>{
    if(!m || m.pid!==pid || (+m.n||0) <= m0 || !(+m.dq||0)) return;
    const ty = m.type || 'adjust';
    if(agg[ty]==null){ agg[ty]=0; order.push(ty); }
    agg[ty] += (+m.dq||0);
  });
  return order.map(ty=>({type:ty, dq:agg[ty]})).filter(x=>x.dq!==0);
}
function movesSinceLabel(pid, mn){
  const parts = movesSinceByType(pid, mn);
  if(!parts.length) return '';
  return escH(t('count_moved_after')) + VJ() + ' ' +
    parts.map(x=>`${escH(moveLabel(x.type))} ${x.dq>0?'+':''}${x.dq}`).join(' · ');
}
/* book = the on-hand AT THE MOMENT OF COUNTING — which is the figure the act must compare
   against, and what makes a mid-session sale apply ON TOP of the counted figure, not over it. */
function countRows(){
  if(!S.count) return [];
  const rows = [];
  Object.keys(S.count.lines||{}).forEach(pid=>{
    const l = S.count.lines[pid];
    if(!l || !P(pid)) return;
    const after = movesSince(pid, l.mn);
    const book = onHand(pid) - after;
    const counted = +l.counted||0;
    const diff = counted - book;
    const cost = costOf(pid);
    /* every other stock path already refuses to go negative (recordSale, confirmWriteoff, retMax,
       reconcileBatches); the count was the last one that could. The Պակասորդ line still shows the
       full book-vs-fact variance — only the posted move is floored at 0 on-hand. */
    const oh = Math.max(0, onHand(pid));
    const post = Math.max(diff, -oh);
    rows.push({pid, counted, after, book, diff, cost, amd: diff*cost, oh, post, clamped: post!==diff});
  });
  rows.sort((a,b)=>Math.abs(b.amd) - Math.abs(a.amd));
  return rows;
}
function openCountReview(){ COUNTUI.review = true; COUNTUI.cancelArm = false; renderAll(); }
function closeCountReview(){ COUNTUI.review = false; renderAll(); }
function confirmCount(){
  const c = S.count; if(!c) return;
  const rows = countRows();
  rows.filter(r=>r.post!==0).forEach(r=>postMove({pid:r.pid, type:'count', dq:r.post,
      cost:r.cost, ref:c.id, reason:'', actor:'shop', note:c.counter}));
  /* NEVER push to S.sales — a correction is not demand and must not move velOf() (same
     discipline as Դուրսգրում, and for the same reason). */
  const surplus = rows.reduce((a,r)=>a + (r.amd>0 ? r.amd : 0), 0);
  const short   = rows.reduce((a,r)=>a + (r.amd<0 ? r.amd : 0), 0);
  const net = surplus + short;

   shopkeeper tapping «Վաճառել» once per unit sold. A 55-year-old running his shop on a paper
   notebook will not do that, and when he stops, the app becomes confidently wrong, which is worse
   than the notebook. Three cheaper paths, in the order he will actually use them:
     1. «Օրվա վաճառք» — one screen, one stepper per SKU, one save, thirty seconds at the till,
        and it can be filled in for YESTERDAY, which is when he will actually do it.
     2. «ՀԴՄ / CSV» — Armenia mandates item-level ՀԴՄ receipts (Tax Code art. 379), so every
        shop with a cash register already produces this data. READING sales is not ISSUING them,
        so this stays clear of the fiscalisation ban and of the do-not-build list. Any file of

function salesImportFile(input){

function parseSalesFile(text, name){
  const idx = eanIndex();
  const byCode = {};
  catalogActive().forEach(p=>{ const im = itemMeta(p.id);
    if(im.goodCode) byCode[String(im.goodCode).toUpperCase()] = p.id;
    byCode[p.id.toUpperCase()] = p.id; });
  const rows = [], unknown = [];
  String(text).split(/[\r\n]+/).forEach((line, i)=>{
    const raw = line.trim(); if(!raw) return;
    const parts = raw.split(/[;,\t]/).map(x=>x.trim().replace(/^"|"$/g,''));
    if(parts.length < 2) return;
    const code = safeStr(parts[0], 32);
    const qty = Math.floor(parseFloat(String(parts[1]).replace(',','.')) || 0);
    if(!code || qty <= 0) return;
    if(i===0 && !/\d/.test(String(parts[1]))) return;           // a header row
    const dt = parts[2] ? ymdToTs(String(parts[2]).slice(0,10)) : null;
    const pid = idx[normCode(code)] || byCode[code.toUpperCase()] || null;
    if(pid) rows.push({pid, qty, date: dt || S.today, code});
    else unknown.push({code, qty});
  });
  SIMPORT = {rows, unknown, name: safeStr(name, 40)};
  renderSalesImport();
}

/* ================= R8 · the supplier console as a PORTFOLIO, and one that exports =================
   A distributor asked to pay 25–60K AMD/month for "shop-level stock and sell-through" opened a
   screen with exactly one live shop, no per-SKU roll-up across his territory, and no export of
   any kind — the two CSV buttons on that side wrote the SHOP's purchase ledger. He cannot answer
   "how many of my shops are out of Կոկա-Կոլա right now", and he cannot get a single number into
   the system he actually runs his business on. Both are fixed here. */
const LIVE_SHOPS = ['me','o1','o2'];      // devices actually reporting; the rest are fixtures
const isLiveShop = id => LIVE_SHOPS.indexOf(id) >= 0;

/* one row per SKU across every live shop: out-of-stock count, total cover, shops at risk */
function skuRollup(){
  const live = allShops().filter(sh=>isLiveShop(sh.id));
  return supPids().map(p=>{
    let units = 0, outN = 0, riskN = 0, vel = 0;
    const risk = [];
    live.forEach(sh=>{
      const q = shopStockOf(sh.id)[p.id]||0;
      const v = velOfShop(sh.id, p.id);
      const d = v>0 ? q/v : 99;
      units += q; vel += v;
      if(q<=0){ outN++; risk.push(sh); }
      else if(d<=2){ riskN++; risk.push(sh); }
    });
    return {p, units, outN, riskN, risk, shops:live.length, cover: vel>0 ? units/vel : 0};
  }).sort((a,b)=>(b.outN - a.outN) || (a.cover - b.cover));
}

/* ---- C3 · the distributor's own order book, as a file ----
   Everything the console shows about ITS trade with ITS shops, one row per order line, plus the
   two derived columns the app owns and a spreadsheet does not: the realised lead time and whether
   the promised day was met. Tenancy: ownsOrder() on the order and ownsPid() on the line, so a
   bound supplier session can only ever write its own rows; an unbound session (shop role, demo)
   keeps the pre-A1 "everything" behaviour, as every other supplier accessor does.
   Privacy: every ֏ here is the SUPPLIER'S OWN price to the shop. The shop's selling price and
   margin are not in this state at all on the supplier side, and nothing derived from them is
   computed here. */
function exportOrdersCSV(){
  const ymd = ts => ts ? new Date(ts).toISOString().slice(0,10) : '';
  const today = ymd(S.today);
  /* Round B · «Առաքման ամսաթիվ» carried the PROMISED day on an open order and the ACTUAL day on a
     closed one, under one header, so a manager could not tell which he was reading. Two columns
     now, each meaning one thing. */
  const rows = [[t('csv_order_id'), t('csv_ord_date'), t('shop_col'), t('status_col'),
                 t('csv_promised_date'), t('csv_actual_date'), t('csv_lead_days'), t('csv_ontime'),
                 t('product'), t('item_code'), t('qty'), t('csv_delivered_qty'),
                 t('price'), t('amount_col'), t('recv_doc_no')]];
  (S.orders||[]).filter(ownsOrder).slice().sort((a,b)=>(b.date||0)-(a.date||0)).forEach(o=>{
    /* the same arrival stamp and the same measurability test the console KPI uses, so the file
       and the dashboard cannot disagree. Round B · this used to fall back to o.receipt.ts, and
       every seeded other-shop receipt is AUTO with ts = the promised day — so four of nine rows
       printed «Ժամանակին Այո» off the promised day compared with itself, and the file said 89 %
       where the console said 80 %. An unobserved arrival now leaves both derived cells empty. */
    const arr = arrivalTs(o);
    /* the arrival is printed whenever it was observed — a receipt entered without an order is a
       real arrival — but the two DERIVED columns need an order date and a promised day, which a
       manual receipt does not have. Unmeasurable leaves the cell empty; it never guesses. */
    const done = ordMeasurable(o);
    const lead = done ? Math.max(1, Math.round((arr - o.date)/DAY)) : '';
    const onTime = (done && o.deliveryDate) ? (arr <= o.deliveryDate ? t('csv_yes') : t('csv_no')) : '';
    const doc = (o.receipt && o.receipt.doc && o.receipt.doc.no) ? o.receipt.doc.no : '';
    const stK = 'st_' + String(o.status||'');
    (o.items||[]).forEach(it=>{
      if(!ownsPid(it.productId)) return;
      const dq = it.delivered!=null ? it.delivered : '';
      rows.push([o.id, ymd(o.date), nm(o.shop||{}), (T[lang][stK] ? t(stK) : String(o.status||'')),
        ymd(o.deliveryDate), ymd(arr), lead, onTime,
        nm(PX(it.productId)), (itemMeta(it.productId)||{}).goodCode||'',
        it.qty, dq, it.price, (dq==='' ? it.qty : dq) * it.price, doc]);
    });
  });
  downloadCSV('orders-'+(supScoped()?SUPID()+'-':'')+today+'.csv', rows);
}

/* R9 · «Համեմատման ակտ» names a document that both parties sign. It was a table with a print
   button: no ՀՎՀՀ for either side, no stated period, no opening balance, no amount in words and
   no signature blocks — so a distributor's accountant could not accept it and the feature read
   as decorative. It now carries the same furniture the գույքագրման ակտ twenty lines away has
   carried since R5. The amount in words is written in Armenian on every language of the UI,
   because that is the language the document is signed in. */
const AM_U=['','մեկ','երկու','երեք','չորս','հինգ','վեց','յոթ','ութ','ինը'];
const AM_TEEN=['տասը','տասնմեկ','տասներկու','տասներեք','տասնչորս','տասնհինգ','տասնվեց','տասնյոթ','տասնութ','տասնինը'];
const AM_TENS=['','','քսան','երեսուն','քառասուն','հիսուն','վաթսուն','յոթանասուն','ութսուն','իննսուն'];
function amWords3(x){
  const out=[], h=Math.floor(x/100), r=x%100;
  if(h) out.push((h>1?AM_U[h]+' ':'')+'հարյուր');
  if(r<10){ if(r) out.push(AM_U[r]); }
  else if(r<20) out.push(AM_TEEN[r-10]);
  else out.push(AM_TENS[Math.floor(r/10)] + (r%10?AM_U[r%10]:''));
  return out.join(' ');
}
function amWords(n){
  let v = Math.round(Math.abs(Number(n)||0));
  const neg = (Number(n)||0) < 0;
  if(v===0) return 'զրո դրամ';
  const parts=[];
  const mil = Math.floor(v/1000000); v %= 1000000;
  const th  = Math.floor(v/1000);    v %= 1000;
  if(mil) parts.push((mil>1?amWords3(mil)+' ':'')+'միլիոն');
  if(th)  parts.push((th>1?amWords3(th)+' ':'')+'հազար');
  if(v)   parts.push(amWords3(v));
  return (neg?'մինուս ':'') + parts.join(' ') + ' դրամ';
}

/* Round B · these two files were SHOP-shaped wherever they were pressed. On the distributor's
   console the counterparty on a bill or a sales line is the SHOP — the console's own bills TABLE
   already prints a «Խանութ» column — yet the export headed the counterparty column «Մատակարար»
   and filled it, and the ՀՎՀՀ beside it, with the distributor's OWN name and tax number. The file
   behind the «Ստացվելիք գումարներ» card could not say who owed. The sales file additionally
   carried the two shop-accountant columns (ԱՏԳ ԱԱ, փաստաթղթի ամսաթիվ), which are the shop's
   substantiation of ITS deduction and mean nothing on a distributor's desk.
   `side==='sup'` is passed by the supplier surfaces so demo mode — where supScoped() is false and
   both panes are on one screen — writes the same distributor-shaped file it will write in the
   bound session a prospect signs up for. */
function exportCSV(kind, side){
  const asSup = side==='sup' || supScoped();
  const ymd = ts => ts ? new Date(ts).toISOString().slice(0,10) : '';
  let rows;
  if(kind==='bills'){
    if(asSup){
      /* one column per fact: WHO owes (the shop, with the shop's ՀՎՀՀ), and — only where it
         carries information, i.e. an unbound multi-distributor session — which distributor. */
      const head = [t('csv_doc_id'), t('date'), t('shop_col'), t('recv_tin')];
      if(!supScoped()) head.push(t('supplier'));
      rows = [head.concat([t('amount_col'), t('status_col'), t('csv_paid_date')])]
        .concat(S.bills.filter(b=>ownsSup(b && b.sup)).sort((a,b)=>b.date-a.date).map(b=>{
          const r = [b.id, ymd(b.date), nm(MY_SHOP), MY_SHOP.tin||''];
          if(!supScoped()) r.push(nm(SUPX(b.sup)));
          return r.concat([b.amount, b.adj?t('adj_badge'):(b.paid?t('paid_st'):t('unpaid_st')), ymd(b.paidDate)]);
        }));
    } else {
      rows = [[t('csv_doc_id'), t('date'), t('supplier'), t('amount_col'), t('status_col'), t('csv_paid_date'), t('recv_tin')]]
        .concat(S.bills.filter(b=>ownsSup(b && b.sup)).map(b=>[b.id, ymd(b.date), nm(SUPX(b.sup)), b.amount,
          b.adj?t('adj_badge'):(b.paid?t('paid_st'):t('unpaid_st')), ymd(b.paidDate), (SUPX(b.sup).tin||'')]));
    }
  } else if(asSup){
    /* the distributor's outbound deliveries: counterparty = the shop, document = HIS document.
       The shop's «Փաստաթուղթ չկա» flag is a statement about the shop's own bookkeeping and is
       never printed against a delivery he made — the same rule supSaleRows() follows on screen. */
    const supDoc = h => {
      if(h.doc && h.doc.no) return h.doc.no;
      const b = S.bills.find(x=>!x.adj && x.sup===h.sup && Math.abs(x.date-h.date) <= 2*DAY);
      return b ? b.id : '';
    };
    const head = [t('date'), t('shop_col'), t('recv_tin')];
    if(!supScoped()) head.push(t('supplier'));
    rows = [head.concat([t('product'), t('item_code'), t('qty'), t('price'), t('amount_col'), t('recv_doc_no')])]
      .concat(S.history.filter(h=>ownsSup(h && h.sup)).sort((a,b)=>b.date-a.date).map(h=>{
        const im = itemMeta(h.productId)||{};
        const r = [ymd(h.date), nm(MY_SHOP), MY_SHOP.tin||''];
        if(!supScoped()) r.push(nm(SUPX(h.sup)));
        return r.concat([nm(PX(h.productId)), im.goodCode||'', h.qty, h.price, h.qty*h.price, supDoc(h)]);
      }));
  } else {
    /* the accountant substantiates the 9.5pp turnover-tax deduction from THIS file, so it carries
       the settlement document number, its date and the supplier's ՀՎՀՀ on every line. */
    rows = [[t('date'), t('product'), t('item_code'), t('item_atg_short'), t('supplier'), t('recv_tin'),
             t('recv_doc_no'), t('recv_doc_date'), t('qty'), t('price'), t('amount_col')]]
      .concat(S.history.filter(h=>ownsSup(h && h.sup)).sort((a,b)=>b.date-a.date).map(h=>{
        const d = h.doc||{}, im = itemMeta(h.productId)||{};
        return [ymd(h.date), nm(PX(h.productId)), im.goodCode||'', im.atg||'',
          nm(SUPX(h.sup)), d.tin || (SUPX(h.sup).tin||''), d.no||'',
          ymd(d.date), h.qty, h.price, h.qty*h.price];
      }));
  }
  /* C3 · a distributor exporting from three accounts on one laptop used to get bills.csv,
     bills (1).csv, bills (2).csv and no way to tell them apart. The distributor's outbound file
     is named for what it is, so it never lands beside the shop's purchase history under one name. */
  const base = (asSup && kind==='history') ? 'sales' : kind;
  downloadCSV(base + (supScoped() ? '-'+SUPID() : '') + '-' + ymd(S.today) + '.csv', rows);
}
/* the app's single CSV writer: UTF-8 BOM (so Excel on the accountant's Windows machine opens
   Armenian text correctly), quoted cells, LF rows. */
function downloadCSV(name, rows){
  /* R8 · a cell beginning = + - or @ is executed as a formula by Excel and LibreOffice when the
     accountant opens the file. Counter names and chat text are free text and are exported. */
  const cell = c => { let v = String(c==null?'':c); if(/^[=+\-@\t\r]/.test(v)) v = "'" + v; return '"'+v.replace(/"/g,'""')+'"'; };
  const csv = (rows||[]).map(r=>r.map(cell).join(',')).join('\n');
  const blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}
/* ================= R8 · the invoice-capture rate, as a NUMBER =================
   The market brief's §0 says the software price is noise and the invoice-capture rate is the
   product: a shop on the turnover-tax regime pays 10 % of turnover, reducible by up to 9.5
   percentage points against DOCUMENTED purchase costs, with a 1 % floor — about 7.6 % of turnover
   for a grocery whose COGS is 80 %. The app stamped the document onto every receipt, exported
   every substantiating column, and shamed undocumented rows with a gold badge — and then never
   put a number on any of it. This is that number, and it is the reason the shop keeps using
   ArmTrade when nothing is broken. */
const TAX = {vatThreshold:115000000, turnoverRate:0.10, deductRate:0.095, floorRate:0.01, cogsShare:0.80};
function docCoverage(days){
  const cut = S.today - (days||30)*DAY;
  const rows = (S.history||[]).filter(h=>h && h.date >= cut);
  let tot = 0, doc = 0, totN = 0, docN = 0; const miss = [];
  rows.forEach(h=>{ const v = (+h.qty||0)*(+h.price||0); tot += v; if(v>0) totN++;
    if(h.doc && h.doc.no){ doc += v; if(v>0) docN++; } else if(v>0) miss.push(h); });
  miss.sort((a,b)=>(b.qty*b.price)-(a.qty*a.price));
  /* totN/docN count the ROWS, not the dram: «33 գնում առանց փաստաթղթի» is the sentence a
     shopkeeper can act on, and it is the number the ＋Փաստաթուղթ button repeats. */
  const gap = Math.max(0, tot - doc);
  /* THE FLOOR. TAX.floorRate is not decoration: the turnover tax is reducible from 10 % down to
     1 % of turnover and no further, so the whole reduction over this window is capped at
     (10 % − 1 %) × turnover for the same window. Uncapped, an uncapped 9.5 % of documented
     purchases overstates as soon as documented purchases pass ~94.7 % of turnover — a thin-margin
     shop, or any shop after a big stocking month. turnoverEstimate() is annual, so it is scaled to
     the window; when there is no history to estimate from, there is nothing to cap against. */
  const to = turnoverEstimate();
  const cap = to ? Math.round(to * (TAX.turnoverRate - TAX.floorRate) * (days||30) / 365) : Infinity;
  const saved = Math.min(Math.round(doc * TAX.deductRate), cap);
  const lost  = Math.min(Math.round(gap * TAX.deductRate), Math.max(0, cap - saved));
  return {tot, doc, totN, docN, gap, miss, pct: tot ? Math.round(doc/tot*100) : 0,
          pctN: totN ? Math.round(docN/totN*100) : 0, cap, saved, lost};
}
/* an ESTIMATE, and labelled as one: we hold purchases, never sales. Purchases over the observed
   window, annualised, divided by the brief's 80 % COGS assumption. Never presented as fact. */
function turnoverEstimate(){
  const rows = (S.history||[]).filter(h=>h && h.date >= S.today - 90*DAY);
  if(!rows.length) return 0;
  const oldest = rows.reduce((mn,h)=>Math.min(mn, h.date), S.today);
  const span = Math.max(14, Math.round((S.today - oldest)/DAY) + 1);
  const spend = rows.reduce((a,h)=>a + (+h.qty||0)*(+h.price||0), 0);
  return Math.round(spend / span * 365 / TAX.cogsShare);
}

function dcStats(){
  /* R11 · A1 · R20 — inside a bound supplier session every total is his own book */
  const mk=monthKey(S.today);
  const hist = S.history.filter(h=>ownsSup(h && h.sup));
  const spendM = hist.filter(h=>monthKey(h.date)===mk).reduce((a,h)=>a+h.qty*h.price,0);
  const paidAll = S.payments.filter(p=>ownsSup(p && p.sup)).reduce((a,p)=>a+p.amount,0);
  const out = Object.keys(S.debts).filter(ownsSup).reduce((a,k)=>a+(+S.debts[k]||0),0);
  const deliv = hist.length;
  return {spendM, paidAll, out, deliv};
}
/* R4 · Σ onHand × cost. costOf() already exists, so the one figure a shopkeeper is actually asked
   for by an accountant is one line. Deliberately at COST — the app holds no selling price. */
function stockValue(){
  let total = 0; const byCat = {};
  catalogActive().forEach(p=>{
    const v = onHand(p.id) * costOf(p.id);
    if(!isFinite(v) || v<=0) return;
    total += v; const c = catOf(p.id); byCat[c] = (byCat[c]||0) + v;
  });
  return {total, byCat};
}

/* R5 · the header yields to content while the shopkeeper scrolls, and comes back on any upward
   flick. It hides nothing: one small scroll up restores it, exactly like the browser he uses.
   It only ever runs in single-column mobile, it always restores in the top 64px of the page, and
   it never touches nav — the thumb lives there and it must be unconditionally present. */
(function autoHideTop(){
  var last = 0, ticking = false, top = null;
  function apply(){
    ticking = false;
    top = top || document.getElementById('top');
    if(!top) return;
    if(!document.body.classList.contains('single-mobile')){ top.classList.remove('hid'); last = 0; return; }
    var y = window.scrollY || 0;
    if(y < 64){ top.classList.remove('hid'); }
    else if(y > last + 6){ top.classList.add('hid'); }
    else if(y < last - 6){ top.classList.remove('hid'); }
    last = y;
  }
  window.addEventListener('scroll', function(){
    if(!ticking){ ticking = true; requestAnimationFrame(apply); }
  }, {passive:true});
  window.addEventListener('resize', function(){ if(top) top.classList.remove('hid'); }, {passive:true});
})();
