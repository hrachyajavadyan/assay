<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F7F9">
<title>Hrachya's Apps</title>
<style>
:root{
  --bg:#F6F7F9; --ink:#0F172A; --muted:#64748B; --line:#EAECF0;
  --sh:0 1px 2px rgba(15,23,42,.04), 0 6px 24px rgba(15,23,42,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,"Noto Sans Armenian",sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{max-width:480px;margin:0 auto;padding:12vh 20px 40px;animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
h1{font-size:26px;letter-spacing:-.6px;margin:0 0 6px}
.sub{color:var(--muted);font-size:14px;margin:0 0 30px;line-height:1.5}
a.app{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid var(--line);
  border-radius:22px;padding:20px;margin-bottom:16px;text-decoration:none;color:var(--ink);
  box-shadow:var(--sh);transition:transform .18s, box-shadow .18s}
a.app:active{transform:scale(.98)}
.icon{width:58px;height:58px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0;color:#fff}
.gold{background:linear-gradient(135deg,#D9A441,#B8811F);box-shadow:0 8px 24px rgba(217,164,65,.35)}
.trade{background:linear-gradient(135deg,#4F46E5,#7C6FF2);box-shadow:0 8px 24px rgba(79,70,229,.3)}
.info{flex:1;min-width:0}
.nm{font-weight:800;font-size:17px;letter-spacing:-.3px}
.ds{color:var(--muted);font-size:12.5px;margin-top:3px;line-height:1.5}
.tag{display:inline-block;margin-top:7px;font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
  padding:3px 9px;border-radius:99px}
.t-live{background:#E9F9EF;color:#16A34A}
.t-demo{background:#EEF0FE;color:#4F46E5}
.arrow{color:#C3CAD4;font-size:20px;flex-shrink:0}
.foot{text-align:center;color:#A6AFBB;font-size:11px;margin-top:34px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Իմ հավելվածները</h1>
  <p class="sub">My apps</p>

  <a class="app" href="/armgold/">
    <div class="icon gold">💍</div>
    <div class="info">
      <div class="nm">ARMGOLD</div>
      <div class="ds">Ոսկերիչների գնի հաշվիչ և վաճառքի հաշվառում · Jewelry price calculator & sales</div>
      <span class="tag t-live">Live</span>
    </div>
    <div class="arrow">›</div>
  </a>

  <a class="app" href="/armtrade/">
    <div class="icon trade">🔄</div>
    <div class="info">
      <div class="nm">ArmTrade</div>
      <div class="ds">Խանութ–մատակարար պատվերների հարթակ · Shop–supplier ordering & replenishment</div>
      <span class="tag t-demo">Prototype</span>
    </div>
    <div class="arrow">›</div>
  </a>

  <div class="foot">assay-9e6.pages.dev</div>
</div>
</body>
</html>
