function saveRate(){
  const v = safeAmd(document.getElementById('rateIn').value, 0);
  const a = safeAmd(document.getElementById('rateAg').value, 0);
  /* A RATE OF NOTHING IS NOT A RATE. safeAmd('') is 0, so a cleared field used to be stored with
     src:'manual' and at:now — which made rateStale() false and the card read «հենց նոր», while
     every price in the shop silently lost its metal component: a 168,972 ֏ ring priced at 59,320
     and sold at it, on a piece whose own acquisition cost was 129,000. Spec 2.1 says a failed
     rate is ASKED FOR BY HAND, never worked around, so this is refused at the door rather than
     absorbed. The silver rate is a different case and may legitimately be unset (spec 11: v1
     enters it by hand), which is why only the 999 gold anchor is guarded here — the sell sheet
     guards the metal it is actually selling. */
  if(!(v > 0)){
    const w = document.getElementById('rateWarn');
    if(w) w.innerHTML = '<div class="alert bad" style="margin-top:10px"><div class="t">'
      + escH(t('rate_zero')) + '</div><div class="d">' + escH(t('rate_zero_d')) + '</div></div>';
    try{ document.getElementById('rateIn').focus(); }catch(e){}
    return;
  }
  S.rate.base999 = v; S.rate.silver999 = a;
  S.rate.at = Math.max(Date.now(), S.today); S.rate.src = 'manual'; S.rate.by = 'shop';
  saveState(); closeModal(); renderAll(); toast(t('rate_saved'));
}

/* =====================================================================================
   THE DAY'S BOOKS
   S.sales and S.buys are what the two counter flows write, and until now NOTHING on the shop's
   first screen read either of them: a jeweller could sell a ring and buy in a chain and Այսօր was
   byte-for-byte the same afterwards. These four helpers are the whole of what the home screen
   needs, and they are here rather than inline so the ՀԴՄ coverage figure has exactly one
   definition (spec 5.3: what share of THIS MONTH'S sales carry a fiscal receipt number).
   ===================================================================================== */
const sameDay = (a,b) => safeInt(a,0) === safeInt(b,0);
function sameMonth(ts, ref){
  const a = new Date(safeInt(ts,0)), b = new Date(safeInt(ref,0));
  return a.getUTCFullYear() === b.getUTCFullYear() && a.getUTCMonth() === b.getUTCMonth();
}
const salesToday = () => (S.sales||[]).filter(x => sameDay(x.ts, S.today));
const buysToday  = () => (S.buys ||[]).filter(x => sameDay(x.ts, S.today));
/* THE PRODUCT IS NOT A ՀԴՄ AND TRANSMITS NOTHING (spec 5.3). This is a coverage figure the
   shopkeeper can act on — how many of his own sales carry the number he typed off the fiscal
   printer — and it computes no tax consequence from it, because the rates are unverified. */
function hdmCoverage(){
  const ms = (S.sales||[]).filter(x => sameMonth(x.ts, S.today));
  const ok = ms.filter(x => String(x.hdmRef||'').trim() !== '').length;
  return { n: ms.length, ok: ok, miss: ms.length - ok,
           pct: ms.length ? Math.floor(ok*100/ms.length) : 100 };
}

/* ---- Այսօր ---- */
function viewHome(){
  const pm = pureByMetal();
  const val = valuation();
  const noCost = (S.pieces||[]).filter(p => onHand(pieceSubj(p.id)) > EPS && (!p.acq.known || !p.acq.costAmd)).length;
  const atAssay = (S.pieces||[]).filter(p => p.location === 'assay' && onHand(pieceSubj(p.id)) > EPS).length;
  const sales = salesToday(), buys = buysToday();
  const takings = sales.reduce((a,x) => a + safeAmd(x.price,0), 0);
  const payouts = buys.reduce((a,x) => a + safeAmd(x.paid,0), 0);
  const cov = hdmCoverage();
  const alerts = [];
  /* A MISSING RATE IS LOUDER THAN A STALE ONE: with no rate every price in the shop is the
     making charge and the stones alone, and nothing else on this screen says so. */
  const noRate = METALS.filter(m => !(metalRate999(m) > 0) && pureByMetal()[m] > EPS);
  if(!(base999() > 0)) alerts.push({ bad:true, t: t('al_norate'), d: t('rate_zero_d') });
  else if(noRate.length) alerts.push({ bad:true, t: fmt('al_norate_m', { m: noRate.map(metalLabel).join(', ') }),
                                       d: t('rate_zero_d') });
  if(rateStale()) alerts.push({ bad:true, t: t('al_rate'), d: rateAgeTxt() });
  if(cov.miss) alerts.push({ bad:true, t: fmt('al_hdm', { n: cov.miss }), d: t('al_hdm_d') });
  if(noCost) alerts.push({ bad:true, t: fmt('al_nocost', { n: noCost }), d: t('acq_unknown') });
  const late = hmLateCount();
  /* A PIECE THAT HAS BEEN AT THE ASSAY OFFICE PAST THE SHOP'S OWN THRESHOLD. The threshold is the
     jeweller's own, not a promise about the office — no assay-office turnaround could be sourced. */
  if(late) alerts.push({ bad:true, t: fmt('al_hm_late', { n: late, d: safeInt(S.cfg.hmDays,14) }),
                         d: t('hm_days_note') });
  if(atAssay) alerts.push({ bad:false, t: fmt('al_assay', { n: atAssay }), d: t('hm_title') });

  return '<main class="anim">'
    + '<div class="sec">' + escH(t('home_title')) + '</div>'
    + rateCard()
    + '<div class="kpis kpi2">'
      + '<div class="kpi"><div class="l">' + escH(t('home_pieces')) + '</div><div class="v">'
        + pieceCount() + '</div></div>'
      + '<div class="kpi"><div class="l">' + escH(t('home_val')) + '</div><div class="v m">'
        + val.toLocaleString('en-US') + '<span class="cur">֏</span></div></div>'
    + '</div>'
    + valBreakdown(Object.keys(pm).map(m => ({ pure: pm[m], rate: metalRate999(m), metal: m })))

    /* ---- THE DAY (spec 6.1): what the shop sold and what it bought, today. ---- */
    + '<div class="sec">' + escH(t('home_day')) + '</div>'
    + '<div class="kpis kpi2">'
      + '<div class="kpi"><div class="l">' + escH(t('home_takings')) + ' · '
        + escH(fmt('tray_sub', { n: sales.length })) + '</div><div class="v m">'
        + takings.toLocaleString('en-US') + '<span class="cur">֏</span></div></div>'
      + '<div class="kpi"><div class="l">' + escH(t('home_payouts')) + ' · '
        + escH(fmt('tray_sub', { n: buys.length })) + '</div><div class="v m">'
        + payouts.toLocaleString('en-US') + '<span class="cur">֏</span></div></div>'
    + '</div>'
    + '<div class="card"><h3>' + escH(t('home_sales_n')) + '</h3>'
      + (sales.length
          ? '<div class="tblwrap"><table class="tbl"><thead><tr>'
            + '<th>' + escH(t('w_piece')) + '</th>'
            + '<th class="num">' + escH(t('sl_sold_price')) + '</th>'
            + '<th>' + escH(t('sl_hdm')) + '</th></tr></thead><tbody>'
            + sales.slice().reverse().map(x => { const nm = x.name || x.code || '—';
                const sub = [ (x.code && x.code !== nm) ? x.code : '', safeInt(x.fineness,0) ]
                  .filter(Boolean).join(' · ');
                return '<tr><td>' + escH(nm) + '<span class="tblsub">' + escH(sub) + '</span></td>'
                  + '<td class="num">' + safeAmd(x.price,0).toLocaleString('en-US')
                  + (x.warn ? ' <span class="badge b-rose">' + safeInt(x.warn.pct,0) + '%</span>' : '') + '</td>'
                  /* THE MISSING NUMBER IS NAMED ON THE ROW, not only counted in the alert block. */
                  + '<td>' + (String(x.hdmRef||'').trim()
                      ? escH(x.hdmRef)
                      : '<span class="badge b-rose">' + escH(t('none')) + '</span>') + '</td></tr>'; }).join('')
            + '</tbody></table></div>'
          : '<div class="muted">' + escH(t('home_no_sales')) + '</div>')
    + '</div>'
    + '<div class="card"><h3>' + escH(t('home_buys_n')) + '</h3>'
      + (buys.length
          ? buys.slice().reverse().map(b => '<button class="prow" onclick="openBuyAct(' + jsArg(b.id) + ')">'
              + '<div class="pi"><div class="pnm">' + escH(b.id) + '</div>'
              + '<div class="psub"><span>' + escH(metalLabel(b.metal)) + ' ' + safeInt(b.fineness,0) + '</span>'
              + '<span class="badge b-neutral">' + escH(b.dest === 'resale' ? t('by_dest_resale') : t('by_dest_scrap')) + '</span></div></div>'
              + '<div class="pw"><div class="a">' + safeAmd(b.paid,0).toLocaleString('en-US')
              + '<span class="cur">֏</span></div>'
              + '<div class="b">' + gramTxt(b.netG,3) + escH(t('u_g')) + '</div></div></button>').join('')
          : '<div class="muted">' + escH(t('home_no_buys')) + '</div>')
    + '</div>'
    /* ---- ՀԴՄ coverage (spec 5.3). A share the shopkeeper can act on, and NOTHING computed
       from it: no tax consequence, and nothing transmitted anywhere, ever. ---- */
    + '<div class="card' + (cov.n && cov.miss ? ' rail rail-bad' : '') + '"><h3>' + escH(t('home_hdm')) + '</h3>'
      + '<div class="row"><span class="mlbl">' + escH(t('home_hdm')) + '</span>'
        + '<span class="big">' + (cov.n ? cov.pct + '%' : '—') + '</span></div>'
      + '<div class="muted" style="margin-top:6px">' + escH(cov.n
          ? fmt('home_hdm_sub', { n: cov.n, k: cov.ok }) : t('home_hdm_none')) + '</div>'
      + '<div class="notice">' + escH(t('sl_hdm_note')) + '</div>'
    + '</div>'

    + '<div class="card"><h3>' + escH(t('home_pure')) + '</h3>'
      + Object.keys(pm).map(m => '<div class="row"><span>' + escH(metalLabel(m)) + ' 999</span>'
          + '<span>' + gram(pm[m], 3) + '</span></div>').join('')
      + (Object.keys(pm).length ? '' : '<div class="muted">' + escH(t('tray_empty')) + '</div>')
      + '<div class="notice" style="margin-top:12px">' + escH(t('tray_no_total')) + '</div>'
    + '</div>'
    + '<div class="sec">' + escH(t('home_alerts')) + '</div>'
    + (alerts.length
        ? alerts.map(a => '<div class="alert' + (a.bad ? ' bad' : '') + '"><div class="t">' + escH(a.t) + '</div>'
            + '<div class="d">' + escH(a.d) + '</div></div>').join('')
        : '<div class="card"><div class="muted">' + escH(t('home_ok')) + '</div></div>')
    + '</main>';
}

/* ---- Դարակ (spec 6.1 tray) ----
   Stock grouped by fineness, per-fineness subtotals, a pure-metal total per metal, and a
   valuation at today's rate. NO BARE GRAM TOTAL CROSSES A FINENESS BOUNDARY. */
function viewTray(){
  const groups = trayGroups();
  const pm = pureByMetal();
  if(!groups.length){
    return '<main class="anim"><div class="sec">' + escH(t('tray_title')) + '</div>'
      + '<div class="empty"><div class="em"></div><div>' + escH(t('tray_empty')) + '</div></div>'
      + '<button class="btn primary" onclick="openNewItem()">+ ' + escH(t('ni_title')) + '</button></main>';
  }
  const body = groups.map(g => {
    const r999 = metalRate999(g.metal);
    const gp = pureG(g.grams, g.fineness);
    const rows = g.pieces.map(x => {
      const p = x.p;
      const nm = modelName(p);
      const bits = [];
      /* the code is only repeated under the name when the name is NOT the code — a one-off piece
         has no model, so its name already IS its tag code and printing it twice reads as damage */
      if(p.code && p.code !== nm) bits.push('<span>' + escH(p.code) + '</span>');
      bits.push('<span>' + escH(catLabel(p.cat)) + '</span>');
      if(p.location !== 'tray') bits.push('<span class="badge b-neutral">' + escH(locLabel(p.location)) + '</span>');
      if(!p.acq.known || !p.acq.costAmd) bits.push('<span class="badge b-rose">' + escH(t('badge_nocost')) + '</span>');
      if(p.acq.preJul26) bits.push('<span class="badge b-neutral">&lt; 01.07.26</span>');
      return '<button class="prow" onclick="openPiece(' + jsArg(p.id) + ')">'
        + '<div class="pi"><div class="pnm">' + escH(nm) + '</div>'
        + '<div class="psub">' + bits.join('') + '</div></div>'
        /* WEIGHT AND PURE METAL ONLY. The piece's PRICE is computed money and no computed money
           appears in this product without the formula beside it — so the price lives on the item
           card, one tap away, where breakdown() renders it with the numbers substituted. */
      /* EVERY WEIGHT THE JEWELLER CAN PUT ON A SCALE SAYS WHICH ONE IT IS. This figure is NET,
         and on a stoned piece it differs from what the scale reads by the stone weight — a bare
         «5.42 գ» on a piece the scale calls 5.800 g is the app and the counter disagreeing with
         nothing on screen to explain it. The short label already exists in all three languages
         and the piece card, the sell sheet and the buy form already use it. */
        + '<div class="pw"><div class="a"><span class="wlbl">' + escH(t('w_net_s')) + '</span> '
        + gramTxt(x.on) + '<span class="g">' + escH(t('u_g')) + '</span></div>'
        + '<div class="b">' + escH(t('w_pure_s')) + ' ' + gramTxt(pureG(x.on, p.fineness),3) + escH(t('u_g')) + '</div></div></button>';
    }).join('');
    const pools = g.pools.map(x => {
      const nlots = lotsFor(x.b.id).length;
      return '<button class="prow" onclick="openPool(' + jsArg(x.b.id) + ')">'
      + '<div class="pi"><div class="pnm">' + escH(t('w_scrap')) + ' · ' + escH(metalLabel(x.b.metal)) + '</div>'
      + '<div class="psub"><span>' + escH(t('w_pool')) + '</span>'
        + (nlots ? '<span>' + escH(fmt('w_acqn', { n: nlots })) + '</span>' : '') + '</div></div>'
      + '<div class="pw"><div class="a"><span class="wlbl">' + escH(t('w_net_s')) + '</span> '
      + gramTxt(x.on) + '<span class="g">' + escH(t('u_g')) + '</span></div>'
      + '<div class="b">' + escH(t('w_pure_s')) + ' ' + gramTxt(pureG(x.on, x.b.fineness),3) + escH(t('u_g')) + '</div></div></button>';
    }).join('');
    return '<div class="fgrp"><div class="fhead">'
      + '<div class="frow">'
        + '<span class="harg ' + g.metal + '">' + g.fineness + '</span>'
        + '<span class="mlbl">' + escH(metalLabel(g.metal)) + (g.pcs ? ' · ' + fmt('tray_sub', { n: g.pcs }) : '') + '</span>'
        + '<span class="w">' + gramTxt(g.grams) + '<span class="g">' + escH(t('u_g')) + '</span></span>'
      + '</div>'
      /* the group's valuation, with its arithmetic on the line beneath it */
      + valBreakdown([{ pure: gp, rate: r999 }])
      + '</div><div class="fbody">' + rows + pools + '</div></div>';
  }).join('');

  return '<main class="anim">'
    + '<div class="sec">' + escH(t('tray_title')) + '</div>'
    /* the tray's ONE accent-filled action: putting a piece in it. Everything else on this screen
       is a row you read or tap through. */
    + '<button class="btn primary" style="margin-bottom:12px" onclick="openNewItem()">+ '
      + escH(t('ni_title')) + '</button>'
    + '<div class="puretot"><div class="l">' + escH(t('tray_pure_lbl')) + '</div>'
      + Object.keys(pm).map(m => '<div class="v">' + gramTxt(pm[m],3) + '<span class="g">'
          + escH(t('u_g')) + '</span> <span class="mlbl">' + escH(metalLabel(m)) + ' 999</span></div>').join('')
      + '<div class="row" style="margin-top:12px"><span class="mlbl">' + escH(t('tray_val_lbl')) + '</span>'
        + '<span class="num" style="font-size:17px;font-weight:700">'
        + valuation().toLocaleString('en-US') + '<span class="cur">֏</span></span></div>'
      + valBreakdown(Object.keys(pm).map(m => ({ pure: pm[m], rate: metalRate999(m), metal: m })))
      + '<div class="notice" style="margin-top:12px">' + escH(t('tray_no_total')) + '</div>'
    + '</div>'
    + body
    + '</main>';
}
function modelName(p){
  const m = (S.models||[]).find(x => x && x.id === p.model);
  return m && m.name ? m.name : (p.code || catLabel(p.cat));
}

/* ---- the item card: where a piece's price and its breakdown live ---- */
function openPiece(id){
  const p = pieceById(id);
  if(!p) return;
  const on = onHand(pieceSubj(p.id));
  const price = p.priceManual || priceOf(p);
  const warn = p.priceManual ? fairValueWarn(priceOf(p), p.priceManual) : null;
  const hist = movesFor(pieceSubj(p.id), 12);
  const hm = p.hallmark.origin;
  const exemptWhy = hm === 'exempt_weight'
    ? fmt('hm_why_weight', { g: (HM_EXEMPT_G[p.metal] || 1.5) + ' ' + t('u_g') }) : '';

  openModal(
    '<h3>' + escH(t('pc_title')) + '</h3>'
    + '<div class="row"><span style="font-size:17px;font-weight:700">' + escH(modelName(p)) + '</span>'
      + '<span class="harg ' + p.metal + '">' + safeInt(p.fineness,0) + '</span></div>'
    + '<div class="muted" style="margin-top:4px">' + escH([p.code, catLabel(p.cat), metalLabel(p.metal)].filter(Boolean).join(' · ')) + '</div>'

    /* the three weights, with the derived one named as derived — the jeweller must be able to see
       which two numbers came off the scale */
    + '<div class="dl">'
      + '<div><div class="l">' + escH(t('w_gross_s')) + (p.weighedAs==='net' ? ' (' + escH(t('pc_derived')) + ')' : '')
        + '</div><div class="v">' + gramTxt(p.grossG,3) + escH(t('u_g')) + '</div></div>'
      + '<div><div class="l">' + escH(t('w_stone_s')) + '</div><div class="v">'
        + gramTxt(p.stoneG,3) + escH(t('u_g')) + '</div></div>'
      + '<div><div class="l">' + escH(t('w_net_s')) + (p.weighedAs==='gross' ? ' (' + escH(t('pc_derived')) + ')' : '')
        + '</div><div class="v">' + gramTxt(p.netG,3) + escH(t('u_g')) + '</div></div>'
      + '<div><div class="l">' + escH(t('w_pure')) + '</div><div class="v">'
        + gramTxt(pureG(p.netG, p.fineness),3) + escH(t('u_g')) + '</div></div>'
    + '</div>'
    + '<div class="muted">' + escH(p.weighedAs==='net' ? t('pc_weighed_net') : t('pc_weighed_gross')) + '</div>'

    /* THE PRICE, AND ITS BREAKDOWN. Never one without the other. */
    + '<div class="sec">' + escH(t('pr_title')) + '</div>'
    + '<div class="row"><span class="mlbl">' + escH(p.priceManual ? t('pr_manual') : t('pr_computed')) + '</span>'
      + '<span class="big">' + price.toLocaleString('en-US') + '<span class="cur">֏</span></span></div>'
    + breakdown(p)
    + (warn ? '<div class="alert bad" style="margin-top:12px"><div class="t">'
        + escH(fmt('pr_warn80', { p: warn.pct })) + '</div><div class="d">'
        + escH(fmt('pr_warn80_sub', { a: warn.computed.toLocaleString('en-US') + ' ֏',
            b: warn.floor.toLocaleString('en-US') + ' ֏', c: warn.manual.toLocaleString('en-US') + ' ֏' }))
        + '</div></div>' : '')

    /* acquisition: immutable, and the pre/post 1 July 2026 flag is shown because it is the tax
       treatment, not trivia */
    + '<div class="sec">' + escH(t('acq_title')) + '</div>'
    + (p.acq.known && p.acq.costAmd
        ? '<div class="dl">'
          + '<div><div class="l">' + escH(t('acq_cost')) + '</div><div class="v">'
            + p.acq.costAmd.toLocaleString('en-US') + ' ֏</div></div>'
          + '<div><div class="l">' + escH(t('acq_date')) + '</div><div class="v">' + escH(fdate(p.acq.date)) + '</div></div>'
          + '<div><div class="l">' + escH(t('acq_doc')) + '</div><div class="v" style="font-size:15px">'
            + escH(docLabel(p.acq.docType)) + '</div></div>'
          + '<div><div class="l">' + escH(t('acq_ref')) + '</div><div class="v" style="font-size:15px">'
            + escH(p.acq.docRef || '—') + '</div></div>'
          + '</div>'
          + '<div class="notice">' + escH(p.acq.preJul26 ? t('acq_pre') : t('acq_post')) + '</div>'
          + '<div class="notice">' + escH(t('acq_locked')) + '</div>'
        : '<div class="alert bad"><div class="t">' + escH(t('acq_unknown')) + '</div>'
          + '<div class="d">' + escH(t('acq_date') + ': ' + fdate(p.acq.date)) + '</div></div>')

    /* hallmark: a status and a send-out cycle, never an assay result the shopkeeper produced */

    + (p.hallmark.sentTs ? '<div class="notice">' + escH(t('loc_assay') + ' · ' + fdate(p.hallmark.sentTs)) + '</div>' : '')
    + '<div class="row"><span class="mlbl">' + escH(t('w_loc')) + '</span><span>' + escH(locLabel(p.location)) + '</span></div>'

    /* the ledger, for this subject */

    + '<div class="row"><span class="mlbl">' + escH(t('pc_onhand')) + '</span><span>' + gram(on,3) + '</span></div>'
    + (hist.length ? histTable(hist) : '<div class="muted">' + escH(t('pc_hist_empty')) + '</div>')
    + '<button class="btn ghost full" style="margin-top:16px" onclick="closeModal()">' + escH(t('close')) + '</button>'
  );
}

function cfgSet(k, v){
  if(k==='buyDiscPct') S.cfg[k] = (String(v).trim()==='' ? null : num(v));
  else if(k==='marginPct') S.cfg[k] = num(v);
  else if(k==='gramDp') S.cfg[k] = safeInt(v,2)===3 ? 3 : 2;
  else if(k==='hmDays') S.cfg[k] = Math.max(1, Math.min(365, safeInt(v,14)));
  else S.cfg[k] = v;
  migrate(S); saveState();
  if(k==='makingBase' || k==='gramDp') renderAll();
  else if(k==='buyDiscPct'){
    const n = document.getElementById('bdNote');
    if(n) n.innerHTML = buyDiscSet() ? '' : '<div class="notice">' + escH(t('buydisc_unset_f')) + '</div>';
  }
}
function doVerify(){
  const bad = verifyLedger();
  toast(bad.length ? fmt('led_verify_bad', { n: bad.length })
        : fmt('led_verify_ok', { n: (S.moves||[]).length, m: Object.keys(S.stock||{}).length }));
  renderAll();
}
function doRebuild(){ healLedger(); saveState(); renderAll(); doVerify(); }

/* =====================================================================================
   ADDING A PIECE (spec 1.5, 1.6)
   The one form in the foundation, and it exists because two rules in the item model are only
   real if you can see them working:

   1. THE JEWELLER TYPES TWO OF THE THREE WEIGHTS AND THE THIRD IS DERIVED AND LOCKED. The
      derived field is genuinely disabled — not merely recalculated — so there is never a moment
      where three mutually inconsistent numbers are on screen and the app has to guess which two
      the scale produced. `weighedAs` records which pair it was, because a later dispute turns on
      exactly that.
   2. `acq.preJul26` IS STORED AT CREATION, not derived at read time. It is computed here, once,
      from the acquisition date the jeweller gives, and thereafter it is what the record says it
      is — a device clock change or a later legal change cannot silently reclassify old stock into
      the other tax treatment.

   The draft lives outside S: nothing enters the ledger until the jeweller commits, and the
   commit goes through postMove() like every other gram in the shop.
   ===================================================================================== */
let NI = null;
function niFresh(){
  return {
    code:'', metal:'au', fineness:585, cat:'ring', finBy:{ au:585, ag:925 },
    weighedAs:'gross', grossG:'', stoneG:'', netG:'',
    stonesAmd:'', makingG:'',
    costAmd:'', costKnown:true, docType:'invoice', docRef:'', acqDate: S.today,
    note:''
  };
}
/* the derived third field, computed from whichever two the jeweller is typing */
function niWeights(){
  const stone = Math.max(0, round3(num(NI.stoneG)));
  if(NI.weighedAs === 'net'){
    const net = round3(num(NI.netG));
    return { weighedAs:'net', stoneG:stone, netG:net, grossG: round3(net + stone) };
  }
  const gross = round3(num(NI.grossG));
  return { weighedAs:'gross', stoneG:stone, grossG:gross, netG: round3(gross - stone) };
}
function niPiece(){
  const w = niWeights();
  return {
    id:'draft', model:null, code:NI.code, metal:NI.metal, fineness:safeInt(NI.fineness,585),
    grossG:w.grossG, stoneG:w.stoneG, netG:w.netG, weighedAs:w.weighedAs,
    stonesAmd:safeAmd(NI.stonesAmd,0), makingG:safeAmd(NI.makingG,0), cat:NI.cat
  };
}
function openNewItem(){
  NI = niFresh();
  niRender();
}
function niSet(k, v){
  if(!NI) return;
  /* the metal chip carries the fineness with it. Falling back to FINENESS[v][0] landed the form
     on 375 on the way back from silver — the rarest fineness in the trade, and (before the row
     wrapped) at the left of a row whose right half was off-screen. */
  if(k === 'metal' && v !== NI.metal){
    NI.fineness = finSwitch(NI.finBy, NI.metal, v, NI.fineness);
    NI.metal = v;
  } else NI[k] = v;
  niRender();
}
/* typing must not re-render — that would move the caret. The numeric fields update the draft and
   repaint only the derived readout and the price. */
function niNum(k, v){
  if(!NI) return;
  NI[k] = v;
  niPaint();
}
function niPaint(){
  const w = niWeights(), p = niPiece();
  const el = id => document.getElementById(id);
  try{
    const d = el('niDerived');
    if(d) d.value = gramTxt(NI.weighedAs === 'net' ? w.grossG : w.netG, 3);
    const pv = el('niPreview');
    if(pv) pv.innerHTML = niPreviewHtml(p);
    const sv = el('niSave');
    if(sv) sv.className = 'btn primary' + (niValid(p) ? '' : ' off');
  }catch(e){}
}
function niValid(p){
  return weightsValid(p) && (!NI.costKnown || safeAmd(NI.costAmd,0) > 0);
}
function niPreviewHtml(p){
  if(!weightsValid(p))
    return '<div class="notice bad">' + escH(lang==='hy'
      ? 'Համախառն ≥ քարեր ≥ 0, զուտը՝ 0-ից մեծ։'
      : (lang==='ru' ? 'Брутто ≥ камни ≥ 0, нетто больше нуля.'
                     : 'Gross ≥ stones ≥ 0, and net must be above zero.')) + '</div>';
  const hm = suggestHallmark(p);
  const pre = safeInt(NI.acqDate, S.today) < JUL26;
  return '<div class="row"><span class="mlbl">' + escH(t('pr_computed')) + '</span>'
    + '<span class="big">' + priceOf(p).toLocaleString('en-US') + '<span class="cur">֏</span></span></div>'
    + breakdown(p)
    + '<div class="row" style="margin-top:10px"><span class="mlbl">' + escH(t('w_pure')) + '</span>'
      + '<span>' + gram(pureG(p.netG, p.fineness), 3) + '</span></div>'
    /* the app knows the hallmark exemption and says why, rather than flagging a legitimate item */
    + '<div class="notice">' + escH(hmLabel(hm))
      + (hm === 'exempt_weight' ? ' — ' + fmt('hm_why_weight', { g: (HM_EXEMPT_G[p.metal]||1.5) + ' ' + t('u_g') }) : '')
      + '</div>'
    + '<div class="notice">' + escH(pre ? t('acq_pre') : t('acq_post')) + '</div>';
}
function niRender(){
  if(!NI) return;
  const p = niPiece(), w = niWeights();
  const chip = (on, fn, label) => '<button class="tbtn wide' + (on ? ' on' : '') + '" onclick="' + fn + '">'
    + escH(label) + '</button>';
  const gLbl = NI.weighedAs === 'net' ? t('w_net') : t('w_gross');
  const dLbl = NI.weighedAs === 'net' ? t('w_gross') : t('w_net');
  openModal(
    '<h3>' + escH(t('ni_title')) + '</h3>'

    + '<label class="fieldlbl" for="niCode">' + escH(t('w_code')) + '</label>'
    + '<input id="niCode" type="text" maxlength="24" value="' + escH(NI.code) + '" oninput="niNum(\'code\',this.value)">'

    + '<div class="fieldlbl" style="margin-top:12px">' + escH(t('w_metal')) + '</div>'
    + '<div class="chips">' + METALS.map(m => chip(NI.metal===m, 'niSet(' + jsArg('metal') + ',' + jsArg(m) + ')', metalLabel(m))).join('') + '</div>'

    /* 583 sits beside 585 in this list, distinct and never normalised away */
    /* WRAP. This row's own CSS carries the rule — a mandatory choice may never hide behind a
       scrollbar-less swipe — and հարգ is the most consequential choice on the form: it multiplies
       the price. On a plain .chips row at 320px, 750/916/958/999 sat past the right edge with no
       fade, no partial chip and no scrollbar, so the list read as ending at 585. */
    + '<div class="fieldlbl">' + escH(t('w_harg')) + '</div>'
    + '<div class="chips wrap">' + FINENESS[NI.metal].map(f =>
        chip(safeInt(NI.fineness,0)===f, 'niSet(' + jsArg('fineness') + ',' + f + ')', String(f))).join('') + '</div>'

    + '<div class="fieldlbl">' + escH(t('w_cat')) + '</div>'
    + '<div class="chips wrap">' + CATS.map(c =>
        chip(NI.cat===c, 'niSet(' + jsArg('cat') + ',' + jsArg(c) + ')', catLabel(c))).join('') + '</div>'

    /* WHICH TWO CAME OFF THE SCALE. This is `weighedAs`, and it is a choice the jeweller makes,
       not something the app infers from which box happens to be filled. */
    + '<div class="fieldlbl" style="margin-top:12px">' + escH(t('ni_weighed')) + '</div>'
    + '<div class="chips">'
      + chip(NI.weighedAs==='gross', 'niSet(' + jsArg('weighedAs') + ',' + jsArg('gross') + ')', t('w_gross'))
      + chip(NI.weighedAs==='net',   'niSet(' + jsArg('weighedAs') + ',' + jsArg('net') + ')',   t('w_net'))
    + '</div>'
    + '<label class="fieldlbl" for="niW">' + escH(gLbl) + ' (' + escH(t('u_g')) + ')</label>'
    + '<input id="niW" type="number" inputmode="decimal" min="0" step="0.001" value="'
      + escH(NI.weighedAs==='net' ? NI.netG : NI.grossG) + '" oninput="niNum(' + jsArg(NI.weighedAs==='net'?'netG':'grossG') + ',this.value)">'
    + '<label class="fieldlbl" for="niS" style="margin-top:12px">' + escH(t('w_stone')) + ' (' + escH(t('u_g')) + ')</label>'
    + '<input id="niS" type="number" inputmode="decimal" min="0" step="0.001" value="'
      + escH(NI.stoneG) + '" oninput="niNum(' + jsArg('stoneG') + ',this.value)">'
    /* THE DERIVED FIELD IS DISABLED, not merely recomputed. Three editable weights would be
       three chances to disagree with the scale. */
    + '<label class="fieldlbl" for="niDerived" style="margin-top:12px">' + escH(dLbl)
      + ' (' + escH(t('pc_derived')) + ')</label>'
    + '<input id="niDerived" type="text" disabled value="' + gramTxt(NI.weighedAs==='net' ? w.grossG : w.netG, 3) + '">'

    + '<label class="fieldlbl" for="niSt" style="margin-top:12px">' + escH(t('w_stones_amd')) + '</label>'
    + '<input id="niSt" type="number" inputmode="numeric" min="0" step="1" value="' + escH(NI.stonesAmd) + '" oninput="niNum(' + jsArg('stonesAmd') + ',this.value)">'
    + '<label class="fieldlbl" for="niMk" style="margin-top:12px">' + escH(t('w_making')) + '</label>'
    + '<input id="niMk" type="number" inputmode="numeric" min="0" step="1" value="' + escH(NI.makingG) + '" oninput="niNum(' + jsArg('makingG') + ',this.value)">'

    + '<div class="sec">' + escH(t('acq_title')) + '</div>'
    /* A MISSING COST NEVER BLOCKS THE PIECE. It is allowed, and it is stated, because under the
       margin scheme the tax is then computed on the whole price. */
    + '<div class="chips">'
      + chip(NI.costKnown,  'niSet(' + jsArg('costKnown') + ',true)',  t('yes'))
      + chip(!NI.costKnown, 'niSet(' + jsArg('costKnown') + ',false)', t('acq_nodoc'))
    + '</div>'
    + (NI.costKnown
        ? '<label class="fieldlbl" for="niCost">' + escH(t('acq_cost')) + ' (֏)</label>'
          + '<input id="niCost" type="number" inputmode="numeric" min="0" step="1" value="' + escH(NI.costAmd) + '" oninput="niNum(' + jsArg('costAmd') + ',this.value)">'
          + '<div class="fieldlbl" style="margin-top:12px">' + escH(t('acq_doc')) + '</div>'
          + '<div class="chips">' + ['invoice','buyact','customs','opening'].map(d =>
              chip(NI.docType===d, 'niSet(' + jsArg('docType') + ',' + jsArg(d) + ')', docLabel(d))).join('') + '</div>'
          + '<label class="fieldlbl" for="niRef">' + escH(t('acq_ref')) + '</label>'
          + '<input id="niRef" type="text" maxlength="40" value="' + escH(NI.docRef) + '" oninput="niNum(' + jsArg('docRef') + ',this.value)">'
        : '<div class="alert bad"><div class="t">' + escH(t('acq_unknown')) + '</div></div>')
    + '<label class="fieldlbl" for="niDate" style="margin-top:12px">' + escH(t('acq_date')) + '</label>'
    + '<input id="niDate" type="date" value="' + isoDate(NI.acqDate) + '" oninput="niSetDate(this.value)">'

    + '<div class="sec">' + escH(t('pr_title')) + '</div>'
    + '<div id="niPreview">' + niPreviewHtml(p) + '</div>'

    + '<button id="niSave" class="btn primary' + (niValid(p) ? '' : ' off') + '" style="margin-top:16px" onclick="niSave()">'
      + escH(t('ni_save')) + '</button>'
    + '<button class="btn ghost full" style="margin-top:9px" onclick="NI=null;closeModal()">' + escH(t('cancel')) + '</button>'
  );
}
function isoDate(ts){
  const d = new Date(safeInt(ts, Date.now())); const p = n => (n<10?'0':'') + n;
  return d.getUTCFullYear() + '-' + p(d.getUTCMonth()+1) + '-' + p(d.getUTCDate());
}
function niSetDate(v){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v||''));
  if(m) NI.acqDate = Date.UTC(+m[1], +m[2]-1, +m[3]);
  niPaint();
  /* the pre/post 1 July 2026 line lives in the preview, so it repaints with the date */
  try{ document.getElementById('niPreview').innerHTML = niPreviewHtml(niPiece()); }catch(e){}
}
function niSave(){
  const p = niPiece();
  if(!niValid(p)) return;
  const acqDate = safeInt(NI.acqDate, S.today);
  const id = contentId('i', [NI.code, NI.metal, NI.fineness, p.grossG, p.stoneG, acqDate].join(KSEP),
                       (S.pieces||[]).length);
  const piece = {
    id, model:null, code:NI.code, metal:NI.metal, fineness:safeInt(NI.fineness,585),
    grossG:p.grossG, stoneG:p.stoneG, netG:p.netG, weighedAs:p.weighedAs,
    stonesAmd:safeAmd(NI.stonesAmd,0), makingG:safeAmd(NI.makingG,0), priceManual:0,
    acq:{
      costAmd: NI.costKnown ? safeAmd(NI.costAmd,0) : 0,
      stoneCost:0, date: acqDate,
      /* STORED HERE, ONCE, AT THE MOVEMENT THAT BRINGS THE METAL IN. */
      preJul26: acqDate < JUL26,
      docType: NI.costKnown ? NI.docType : 'none',
      docRef: NI.costKnown ? NI.docRef : '',
      source: NI.docType === 'buyact' ? 'public' : 'sup:manual',
      known: !!NI.costKnown
    },
    hallmark:{ origin: suggestHallmark(p), makerMark:false, sentTs:0, backTs:0, docRef:'', office:'' },
    location:'tray', cat:NI.cat, atg:'', note:NI.note, addedTs: S.today
  };
  S.pieces.push(piece);
  migrate(S);
  const ok = postMove({
    subject: pieceSubj(id),
    type: NI.docType === 'buyact' && NI.costKnown ? 'buyin' : (NI.costKnown ? 'receipt' : 'open'),
    dq: piece.netG, ts: acqDate, cost: piece.acq.costAmd, ref: piece.acq.docRef, actor:'shop'
  });
  if(!ok){
    /* the ledger refused, so the piece does not exist. Never leave a record the log disagrees
       with — that is the one state this product may not be in. */
    S.pieces = S.pieces.filter(x => x.id !== id);
    const last = LEDGER_REJECTS[LEDGER_REJECTS.length-1];
    toast(fmt('led_rejected', { r: last ? t(REJ_KEY[last.reason] || 'rej_nosubject') : '' }));
    return;
  }
  NI = null; saveState(); closeModal(); U.tab = 'tray'; renderAll(); toast(t('ni_done'));
}

/* =====================================================================================
   THE AMOUNT IN WORDS (spec 5.2)
   ArmTrade's amWords, carried over verbatim, and for the reason ArmTrade states in its own
   comment: the amount is written in Armenian ON EVERY LANGUAGE OF THE UI, because Armenian is
   the language the document is signed in. A Russian-speaking jeweller still signs an Armenian
   գնման ակտ, and a document whose figure and whose words are in different languages is not a
   document an accountant will accept.
   ===================================================================================== */
const AM_U   = ['','մեկ','երկու','երեք','չորս','հինգ','վեց','յոթ','ութ','ինը'];
const AM_TEEN= ['տասը','տասնմեկ','տասներկու','տասներեք','տասնչորս','տասնհինգ','տասնվեց','տասնյոթ','տասնութ','տասնինը'];
const AM_TENS= ['','','քսան','երեսուն','քառասուն','հիսուն','վաթսուն','յոթանասուն','ութսուն','իննսուն'];
function amWords3(x){
  const out = [], h = Math.floor(x/100), r = x%100;
  if(h) out.push((h>1 ? AM_U[h]+' ' : '') + 'հարյուր');
  if(r < 10){ if(r) out.push(AM_U[r]); }
  else if(r < 20) out.push(AM_TEEN[r-10]);
  else out.push(AM_TENS[Math.floor(r/10)] + (r%10 ? AM_U[r%10] : ''));
  return out.join(' ');
}
function amWords(n){
  let v = Math.round(Math.abs(Number(n)||0));
  const neg = (Number(n)||0) < 0;
  if(v === 0) return 'զրո դրամ';
  const parts = [];
  const mil = Math.floor(v/1000000); v %= 1000000;
  const th  = Math.floor(v/1000);    v %= 1000;
  if(mil) parts.push((mil>1 ? amWords3(mil)+' ' : '') + 'միլիոն');
  if(th)  parts.push((th>1  ? amWords3(th)+' '  : '') + 'հազար');
  if(v)   parts.push(amWords3(v));
  return (neg ? 'մինուս ' : '') + parts.join(' ') + ' դրամ';
}

/* =====================================================================================
   ՎԱՃԱՌՔ — selling a finished piece (spec 2.2, 2.3, 5.3)
   Search by code or model, open the piece, read the price WITH ITS BREAKDOWN, override it if
   the jeweller has a reason, see the 80%-of-fair-value warning if the override crosses it,
   record the ՀԴՄ number, confirm. The movement is a `sale` of the piece's WHOLE net weight —
   the piece-integrity guard refuses anything else, and rightly: a ring cannot be half sold.
   ===================================================================================== */
let SELLQ = '';
function sellSet(q){
  SELLQ = String(q == null ? '' : q).slice(0,40);
  /* typing repaints THE LIST ONLY. A full render would rebuild the input and take the caret
     with it — the same rule niNum() follows in the new-item form. */
  const el = document.getElementById('sellList');
  if(el) el.innerHTML = sellListHtml();
}
function sellCandidates(){
  const q = SELLQ.trim().toLowerCase();
  const rows = pieceRows().filter(x => {
    if(!q) return true;
    const p = x.p;
    return String(p.code||'').toLowerCase().indexOf(q) >= 0
        || String(modelName(p)).toLowerCase().indexOf(q) >= 0
        || String(catLabel(p.cat)).toLowerCase().indexOf(q) >= 0
        || String(p.fineness).indexOf(q) >= 0;
  });
  /* what is in the tray is what the hand can reach. A piece out at the assay office is still
     the shop's stock (custody is not a movement) so it is still sellable — it just sorts last
     and carries its location, because promising a customer a ring that is across town is the
     kind of thing a counter screen must not let happen quietly. */
  return rows.sort((a,b) =>
    ((a.p.location === 'tray' ? 0 : 1) - (b.p.location === 'tray' ? 0 : 1))
    || ((b.p.addedTs||0) - (a.p.addedTs||0)));
}
function sellListHtml(){
  const rows = sellCandidates();
  if(!rows.length)
    return '<div class="empty"><div class="em"></div><div>'
      + escH(SELLQ.trim() ? t('sl_noresult') : t('tray_empty')) + '</div></div>';
  return '<div class="fgrp"><div class="fbody">' + rows.map(x => {
    const p = x.p, nm = modelName(p), bits = [];
    if(p.code && p.code !== nm) bits.push('<span>' + escH(p.code) + '</span>');
    bits.push('<span>' + escH(catLabel(p.cat)) + '</span>');
    if(p.location !== 'tray') bits.push('<span class="badge b-neutral">' + escH(locLabel(p.location)) + '</span>');
    if(!p.acq.known || !p.acq.costAmd) bits.push('<span class="badge b-rose">' + escH(t('badge_nocost')) + '</span>');
    return '<button class="prow" onclick="openSell(' + jsArg(p.id) + ')">'
      + '<div class="pi"><div class="pnm">' + escH(nm) + '</div>'
      + '<div class="psub">' + bits.join('') + '</div></div>'
      /* WEIGHT AND FINENESS ONLY. The price is computed money and no computed money appears in
         this product without the formula beside it, so it lives one tap away on the sheet where
         breakdown() renders it with the numbers substituted. */
      + '<div class="pw"><div class="a"><span class="wlbl">' + escH(t('w_net_s')) + '</span> '
      + gramTxt(x.on) + '<span class="g">' + escH(t('u_g')) + '</span></div>'
      + '<div class="b"><span class="harg ' + p.metal + '">' + safeInt(p.fineness,0) + '</span></div></div></button>';
  }).join('') + '</div></div>';
}
function viewSell(){
  const n = pieceRows().length;
  const recent = (S.sales||[]).slice(-6).reverse();
  return '<main class="anim">'
    + '<div class="sec">' + escH(t('tab_sell')) + '</div>'
    + '<input class="search" id="sellQ" type="text" maxlength="40" autocomplete="off"'
      + ' placeholder="' + escH(t('sl_search')) + '" aria-label="' + escH(t('sl_search')) + '"'
      + ' value="' + escH(SELLQ) + '" oninput="sellSet(this.value)">'
    + '<div class="muted" style="margin-bottom:10px">' + escH(fmt('sl_avail', { n: n })) + '</div>'
    + '<div id="sellList">' + sellListHtml() + '</div>'
    + '<div class="sec">' + escH(t('sl_recent')) + '</div>'
    + (recent.length
        ? '<div class="tblwrap"><table class="tbl"><thead><tr>'
          + '<th>' + escH(t('w_date')) + '</th><th>' + escH(t('w_piece')) + '</th>'
          + '<th class="num">' + escH(t('sl_sold_price')) + '</th><th>' + escH(t('sl_hdm')) + '</th>'
          + '</tr></thead><tbody>'
          + recent.map(s => { const nm = s.name || s.code || '—';
            /* the code goes on the sub-line ONLY when it is not already the name. A piece with no
               model has no name but its tag code, so `s.name || s.code` and a sub-line beginning
               with the code resolved to the same string twice in one 44px row. */
            const sub = [ (s.code && s.code !== nm) ? s.code : '', safeInt(s.fineness,0) ]
              .filter(Boolean).join(' · ');
            return '<tr><td>' + escH(fdate(s.ts)) + '</td>'
            + '<td>' + escH(nm)
              + '<span class="tblsub">' + escH(sub) + '</span></td>'
            + '<td class="num">' + safeAmd(s.price,0).toLocaleString('en-US')
              + (s.warn ? ' <span class="badge b-rose">' + safeInt(s.warn.pct,0) + '%</span>' : '') + '</td>'
            + '<td>' + escH(s.hdmRef || '—') + '</td></tr>'; }).join('')
          + '</tbody></table></div>'
        : '<div class="card"><div class="muted">' + escH(t('sl_none')) + '</div></div>')
    + '</main>';
}

let SL = null;
function openSell(id){
  const p = pieceById(id);
  if(!p) return;
  /* the price starts AT the computed figure and the app stops touching it the moment the
     jeweller types — ARMGOLD's aPriceTouched behaviour, and the trade will not accept anything
     else. `touched` is what makes the override respected rather than fought. */
  SL = { id: id, price: String(priceOf(p)), touched:false, hdm:'' };
  slRender();
}
function slAmount(){
  const p = pieceById(SL && SL.id);
  const computed = p ? priceOf(p) : 0;
  if(!SL || !SL.touched) return { computed: computed, manual: 0, price: computed };
  const m = safeAmd(SL.price, 0);
  return { computed: computed, manual: m, price: m };
}
function slWarnHtml(w){
  if(!w) return '';
  return '<div class="alert bad" style="margin-top:12px"><div class="t">'
    + escH(fmt('pr_warn80', { p: w.pct })) + '</div><div class="d">'
    + escH(fmt('pr_warn80_sub', { a: w.computed.toLocaleString('en-US') + ' ֏',
        b: w.floor.toLocaleString('en-US') + ' ֏',
        c: w.manual.toLocaleString('en-US') + ' ֏' }))
    + '</div><div class="d">' + escH(t('sl_warn_ok')) + '</div></div>';
}
/* what will actually be recorded, shown only once it differs from the computed figure — a row
   that repeated the same number back at the jeweller would be noise. */
function slFinalHtml(a){
  if(!a.manual || a.manual === a.computed) return '';
  return '<div class="row" style="margin-top:12px"><span class="mlbl">' + escH(t('pr_manual')) + '</span>'
    + '<span class="big">' + a.manual.toLocaleString('en-US') + '<span class="cur">֏</span></span></div>';
}
/* the reset control's own html, so the ONE place that decides whether it exists is shared by the
   first paint and every repaint. It used to be inlined in slRender() alone — and slRender() runs
   only from openSell() (where `touched` is always false) and from slReset() itself, so the button
   could never appear, slReset() was dead code, and three translated strings shipped for a control
   that could not be reached. */
function slResetHtml(){
  if(!SL || !SL.touched) return '';
  return '<button class="btn ghost full" style="margin-top:9px" onclick="slReset()">'
    + escH(t('sl_reset')) + '</button>';
}
function slPrice(v){
  if(!SL) return;
  SL.price = v; SL.touched = true;
  slPaint();
}
function slHdm(v){ if(SL) SL.hdm = String(v == null ? '' : v).slice(0,40); }
function slReset(){
  if(!SL) return;
  const p = pieceById(SL.id);
  SL.price = String(p ? priceOf(p) : 0); SL.touched = false;
  slRender();
}
function slPaint(){
  const a = slAmount();
  const el = id => document.getElementById(id);
  try{
    const w = a.manual ? fairValueWarn(a.computed, a.manual) : null;
    const wa = el('slWarn'); if(wa) wa.innerHTML = slWarnHtml(w);
    const fi = el('slFinal'); if(fi) fi.innerHTML = slFinalHtml(a);
    const pp = pieceById(SL.id);
    const nr = !pp || !(metalRate999(pp.metal) > 0);
    const go = el('slGo'); if(go) go.className = 'btn primary' + (a.price > 0 && !nr ? '' : ' off');
    const rs = el('slResetWrap'); if(rs) rs.innerHTML = slResetHtml();
  }catch(e){}
}
function slRender(){
  if(!SL) return;
  const p = pieceById(SL.id);
  if(!p) return;
  const a = slAmount();
  const w = a.manual ? fairValueWarn(a.computed, a.manual) : null;
  const noRate = !(metalRate999(p.metal) > 0);
  openModal(
    '<h3>' + escH(t('sl_sheet')) + '</h3>'
    + '<div class="row"><span style="font-size:17px;font-weight:700">' + escH(modelName(p)) + '</span>'
      + '<span class="harg ' + p.metal + '">' + safeInt(p.fineness,0) + '</span></div>'
    + '<div class="muted" style="margin-top:4px">'
      + escH([p.code, catLabel(p.cat), metalLabel(p.metal)].filter(Boolean).join(' · ')) + '</div>'
    + (p.location !== 'tray'
        ? '<div class="notice">' + escH(fmt('sl_out', { l: locLabel(p.location) })) + '</div>' : '')

    + '<div class="dl">'
      + '<div><div class="l">' + escH(t('w_net_s')) + '</div><div class="v">'
        + gramTxt(p.netG,3) + escH(t('u_g')) + '</div></div>'
      + '<div><div class="l">' + escH(t('w_gross_s')) + '</div><div class="v">'
        + gramTxt(p.grossG,3) + escH(t('u_g')) + '</div></div>'
    + '</div>'

    /* NO RATE, NO SALE. Buy already refuses to proceed without a buy-in discount, with a red
       rail and «Վճարել և կազմել ակտը» switched off; sell was not guarded at all, so a cleared
       metal rate let the sheet print «3.480գ × 0 × 585/999 + 38,000 + 5,200 × 4.100գ = 59,320 ֏»
       with the button fully enabled and fairValueWarn() silent (manual == computed). The metal
       checked is THIS PIECE'S metal — a shop with no silver rate can still sell gold. */
    + (noRate ? '<div class="card rail rail-bad" style="margin-top:12px"><h3>'
        + escH(t('w_rate999')) + '</h3><div class="notice bad">'
        + escH(fmt('sl_norate', { m: metalLabel(p.metal) })) + '</div>'
        + '<button class="btn primary" style="margin-top:12px" onclick="openRate()">'
        + escH(t('rate_edit')) + '</button></div>' : '')

    /* THE COMPUTED PRICE AND ITS BREAKDOWN. Never one without the other. */
    + '<div class="sec">' + escH(t('pr_title')) + '</div>'
    /* THE COMPUTED FIGURE AND ITS LINE STAY PUT WHEN THE JEWELLER OVERRIDES. Repainting this
       box with the manual number left a formula ending «= 303,197 ֏» sitting under a heading
       that said 181,918 — the one promise the breakdown line makes is that its own operands
       give its own answer, and moving the answer out from under it breaks exactly that. The
       override gets its own figure, below, where the warning can sit beside it. */
    /* NO RATE, NO COMPUTED PRICE. buyBreakdown already refuses to print a line without a rate —
       «x 0 =» in front of a customer is worse than saying the setting is missing — and the sell
       sheet must hold the same line: a price box reading «59,320 ֏» over a formula containing
       «× 0» is a number the jeweller can act on and should not. */
    + (noRate ? ''
      : '<div class="pricebox">'
        + '<div class="l">' + escH(t('pr_computed')) + '</div>'
        + '<div class="v">' + a.computed.toLocaleString('en-US') + '<span class="cur">֏</span></div>'
        + breakdown(p)
      + '</div>')

    /* THE OVERRIDE IS RESPECTED, NOT FOUGHT: the field is rendered once and nothing in this
       sheet ever writes back into it. */
    + '<label class="fieldlbl" for="slP">' + escH(t('sl_yourprice')) + '</label>'
    + '<input id="slP" type="number" inputmode="numeric" min="0" step="1" value="' + escH(SL.price)
      + '" oninput="slPrice(this.value)">'
    + '<div id="slResetWrap">' + slResetHtml() + '</div>'
    + '<div id="slFinal">' + slFinalHtml(a) + '</div>'
    + '<div id="slWarn">' + slWarnHtml(w) + '</div>'

    /* a missing cost NEVER blocks a sale — it is stated, plainly, and the sale proceeds */
    + (p.acq.known && p.acq.costAmd ? ''
        : '<div class="alert bad" style="margin-top:12px"><div class="t">' + escH(t('acq_unknown'))
          + '</div><div class="d">' + escH(t('sl_nocost')) + '</div></div>')

    /* ՀԴՄ: A REFERENCE FIELD AND NOTHING MORE. This product is not a fiscal device and never
       transmits: same posture ArmTrade holds and states in its own privacy copy. */
    + '<div class="sec">' + escH(t('sl_hdm')) + '</div>'
    + '<input id="slH" type="text" maxlength="40" value="' + escH(SL.hdm) + '" oninput="slHdm(this.value)">'
    + '<div class="notice">' + escH(t('sl_hdm_note')) + '</div>'

    + '<button id="slGo" class="btn primary' + (a.price > 0 && !noRate ? '' : ' off') + '" style="margin-top:16px" onclick="slConfirm()">'
      + escH(t('sl_confirm')) + '</button>'
    + '<button class="btn ghost full" style="margin-top:9px" onclick="SL=null;closeModal()">'
      + escH(t('cancel')) + '</button>'
  );
}
function slConfirm(){
  if(!SL) return;
  const p = pieceById(SL.id);
  if(!p) return;
  const a = slAmount();
  if(!(metalRate999(p.metal) > 0)) return toast(fmt('sl_norate', { m: metalLabel(p.metal) }));
  if(!(a.price > 0)) return toast(t('sl_price_needed'));
  const sub = pieceSubj(p.id);
  const on = round3(onHand(sub));
  if(!(on > EPS)) return;
  const warn = a.manual ? fairValueWarn(a.computed, a.manual) : null;
  const hdm = String(SL.hdm || '').slice(0,40);
  /* THE WHOLE NET WEIGHT, taken from the LEDGER rather than from the record — after a re-weigh
     the two are reconciled by syncPieceWeight, and posting the record's figure when they ever
     disagreed would be refused by the piece-integrity guard for a reason nobody could see. */
  const ok = postMove({ subject: sub, type:'sale', dq: -on, ts: S.today,
                        cost: p.acq.costAmd, ref: hdm, actor:'shop' });
  if(!ok){
    const last = LEDGER_REJECTS[LEDGER_REJECTS.length-1];
    toast(fmt('led_rejected', { r: last ? t(REJ_KEY[last.reason] || 'rej_nosubject') : '' }));
    return;
  }
  p.priceManual = a.manual ? a.manual : 0;
  S.sales.push({
    id: contentId('s', [p.id, hdm, a.price, S.today].join(KSEP), (S.sales||[]).length),
    ts: S.today, pieceId: p.id, code: p.code, name: modelName(p),
    metal: p.metal, fineness: safeInt(p.fineness,0), netG: on,
    price: a.price, computed: a.computed, manual: a.manual,
    /* BOTH FIGURES ARE STORED so the accountant sees later what the counter saw at the time. */
    warn: warn ? { computed: warn.computed, floor: warn.floor, manual: warn.manual, pct: warn.pct } : null,
    hdmRef: hdm,
    acqKnown: !!(p.acq.known && p.acq.costAmd), acqCost: safeAmd(p.acq.costAmd,0)
  });
  SL = null; saveState(); closeModal(); renderAll(); toast(t('sl_done'));
}

/* =====================================================================================
   ԳՆՈՒՄ ԲՆԱԿՉՈՒԹՅՈՒՆԻՑ — the walk-in buy-in (spec 2.4, 5.2)
   The flow ArmTrade has no equivalent of, and the trade's other half. Weigh, pick the հարգ,
   show the customer the arithmetic, pay, draw up the գնման ակտ — and THE PRICE PAID BECOMES THE
   ACQUISITION COST, because under the margin scheme that document IS the cost basis.
   ===================================================================================== */
let BY = null;
function byFresh(){
  return { metal:'au', fineness:585, weighedAs:'gross', grossG:'', stoneG:'', netG:'',
           finBy:{ au:585, ag:925 },
           stonesAmd:'', stonesSell:'', pay:'cash', name:'', passport:'', ssn:'',
           dest:'scrap', code:'', cat:'ring', makingG:'', hmOrigin:'none', disc:'' };
}
function byWeights(){
  const stone = Math.max(0, round3(num(BY.stoneG)));
  if(BY.weighedAs === 'net'){
    const net = round3(num(BY.netG));
    return { weighedAs:'net', stoneG:stone, netG:net, grossG: round3(net + stone) };
  }
  const gross = round3(num(BY.grossG));
  return { weighedAs:'gross', stoneG:stone, grossG:gross, netG: round3(gross - stone) };
}
/* NO MAKING CHARGE — the shop is buying metal, not workmanship. Stones default to zero and the
   sheet says so; the field exists for the case where the shop does pay for them. */
function byPaid(){
  const w = byWeights();
  return buyPriceOf(w.netG, BY.fineness, BY.metal) + safeAmd(BY.stonesAmd, 0);
}
function byWeightsOk(){
  const w = byWeights();
  return weightsValid({ grossG:w.grossG, stoneG:w.stoneG, netG:w.netG });
}
function byValid(){ return buyDiscSet() && byWeightsOk() && byPaid() > 0; }
function byCalcHtml(){
  if(!buyDiscSet())
    return '<div class="notice bad">' + escH(t('by_needrate')) + '</div>';
  if(!byWeightsOk()){
    /* AN UNTOUCHED FORM IS NOT AN ERROR. A red rail on a form nobody has typed into yet reads
       as a mistake the jeweller has already made; it is only a constraint once he has put a
       number in one of the two boxes. */
    const typed = String(BY.grossG||'').trim() !== '' || String(BY.netG||'').trim() !== ''
               || String(BY.stoneG||'').trim() !== '';
    return '<div class="notice' + (typed ? ' bad' : '') + '">' + escH(
      typed
        ? (lang==='hy' ? 'Համախառն ≥ քարեր ≥ 0, զուտը՝ 0-ից մեծ։'
          : (lang==='ru' ? 'Брутто ≥ камни ≥ 0, нетто больше нуля.'
                         : 'Gross ≥ stones ≥ 0, and net must be above zero.'))
        : (lang==='hy' ? 'Դրեք իրը կշեռքին և մուտքագրեք քաշը՝ գինը կհաշվարկվի։'
          : (lang==='ru' ? 'Положите изделие на весы и введите вес — цена рассчитается.'
                         : 'Put the item on the scale and type the weight; the price follows.'))) + '</div>';
  }
  const w = byWeights();
  return '<div class="pricebox">'
    + '<div class="l">' + escH(t('by_paid')) + '</div>'
    + '<div class="v">' + byPaid().toLocaleString('en-US') + '<span class="cur">֏</span></div>'
    /* THE LINE THE CUSTOMER READS ACROSS THE COUNTER. It is the flow's whole selling point:
       the rate, the purity, the weight and the arithmetic, on the phone, in his own language. */
    + buyBreakdown(w.netG, BY.fineness, BY.metal, safeAmd(BY.stonesAmd,0))
    + '<div class="notice">' + escH(t('by_show')) + '</div>'
    + '<div class="notice">' + escH(t('w_pure') + ': ' + gramTxt(pureG(w.netG, BY.fineness),3) + ' ' + t('u_g')) + '</div>'
    + '</div>';
}
function bySet(k, v){
  if(!BY) BY = byFresh();
  /* see niSet: the metal chip carries the fineness with it. */
  if(k === 'metal' && v !== BY.metal){
    BY.fineness = finSwitch(BY.finBy, BY.metal, v, BY.fineness);
    BY.metal = v;
  } else BY[k] = v;
  renderAll();
}
function byNum(k, v){
  if(!BY) BY = byFresh();
  BY[k] = v;
  byPaint();
}
function byPaint(){
  const w = byWeights();
  try{
    const d = document.getElementById('byDerived');
    if(d) d.value = gramTxt(BY.weighedAs === 'net' ? w.grossG : w.netG, 3);
    const c = document.getElementById('byCalc');
    if(c) c.innerHTML = byCalcHtml();
    const g = document.getElementById('byGo');
    if(g) g.className = 'btn primary' + (byValid() ? '' : ' off');
  }catch(e){}
}
function bySaveDisc(){
  const v = String((BY && BY.disc) || '').trim();
  if(v === '') return;
  /* THE DISCOUNT IS NEVER INVENTED. It ships unset, and the only way it acquires a value is a
     jeweller typing one — here or on the Data screen. cfgSet holds the null-is-not-zero rule. */
  cfgSet('buyDiscPct', v);
  renderAll();
}
function viewBuy(){
  if(!BY) BY = byFresh();
  const w = byWeights();
  const chip = (on, fn, label) => '<button class="tbtn wide' + (on ? ' on' : '') + '" onclick="' + fn + '">'
    + escH(label) + '</button>';
  const gLbl = BY.weighedAs === 'net' ? t('w_net') : t('w_gross');

/* the act number. Scanned off every document reference the shop already holds — its own acts,
   its pieces' and its lots' — so a shop seeded or synced with acts numbered to 41 issues 42 and
   never re-uses a number that is already printed on paper somewhere. */
function nextActNo(){
  const y = new Date(safeInt(S.today, Date.now())).getUTCFullYear();
  const re = /^ԳԱ-(\d{4})-(\d+)$/;
  let max = 0;
  const scan = v => { const m = re.exec(String(v == null ? '' : v)); if(m && +m[1] === y) max = Math.max(max, +m[2]); };
  (S.buys||[]).forEach(b => scan(b && b.id));
  (S.pieces||[]).forEach(p => scan(p && p.acq && p.acq.docRef));
  (S.lots||[]).forEach(l => scan(l && l.acq && l.acq.docRef));
  return 'ԳԱ-' + y + '-' + ('0000' + (max + 1)).slice(-4);
}

function byConfirm(){
  if(!BY || !byValid()) return;
  const w = byWeights();
  const paid = byPaid();
  const ref = nextActNo();
  const metal = BY.metal, fineness = safeInt(BY.fineness, 585);
  /* THE PRICE PAID IS THE ACQUISITION COST. Under the margin scheme this document IS the cost
     basis, which is why the buy-in flow and the tax position are the same flow. */
  const acq = () => ({ costAmd: paid, stoneCost: safeAmd(BY.stonesAmd,0), date: S.today,
                       preJul26: S.today < JUL26, docType:'buyact', docRef: ref,
                       source:'public', known:true });
  let subject = '', pieceId = '', lotId = '', dq = w.netG;

  if(BY.dest === 'resale'){
    /* blank means «the same as I paid for them» — never zero. Zero is a legitimate answer the
       jeweller can type, and it is not the same as not having answered. */
    const stonesSell = String(BY.stonesSell || '').trim() === ''
      ? safeAmd(BY.stonesAmd, 0) : safeAmd(BY.stonesSell, 0);
    const sug = suggestHallmark({ metal, netG:w.netG, cat:BY.cat });
    const origin = (BY.hmOrigin === 'none' && sug !== 'none') ? sug : BY.hmOrigin;
    pieceId = contentId('i', [ref, BY.code, metal, fineness, w.grossG, w.stoneG].join(KSEP),
                        (S.pieces||[]).length);
    S.pieces.push({
      id: pieceId, model:null, code: BY.code || ref, metal: metal, fineness: fineness,
      grossG:w.grossG, stoneG:w.stoneG, netG:w.netG, weighedAs:w.weighedAs,
      stonesAmd: stonesSell, makingG: safeAmd(BY.makingG,0), priceManual:0,
      acq: acq(),
      hallmark:{ origin: origin, makerMark:false, sentTs:0, backTs:0, docRef:'', office:'' },
      location:'tray', cat: BY.cat, atg:'', note:'', addedTs: S.today
    });
    migrate(S);
    const made = pieceById(pieceId);
    if(!made){ toast(t('sl_price_needed')); return; }
    subject = pieceSubj(pieceId); dq = num(made.netG);
  } else {
    subject = poolSubj(metal, fineness);
    if(!(S.pools||[]).some(b => b && b.id === subject))
      S.pools.push({ id: subject, metal: metal, fineness: fineness, cat:'scrap', note:'' });
    /* the lot is the cost basis layered on the pool, consumed FIFO BY ACQUISITION DATE. */
    lotId = contentId('l', [ref, subject, w.netG].join(KSEP), (S.lots||[]).length);
    S.lots.push({ id: lotId, subject: subject, inG: w.netG, leftG: w.netG, acq: acq() });
  }

  /* ONE `buyin` MOVEMENT EITHER WAY, with `ref` linking the act to the metal permanently. */
  const ok = postMove({ subject: subject, type:'buyin', dq: dq, ts: S.today, cost: paid,
                        ref: ref, lot: lotId, actor:'shop' });
  if(!ok){
    /* the ledger refused, so neither the piece nor the lot exists. Never leave a record the log
       disagrees with — that is the one state this product may not be in. */
    if(pieceId) S.pieces = (S.pieces||[]).filter(x => x.id !== pieceId);
    if(lotId)   S.lots   = (S.lots||[]).filter(x => x.id !== lotId);
    const last = LEDGER_REJECTS[LEDGER_REJECTS.length-1];
    toast(fmt('led_rejected', { r: last ? t(REJ_KEY[last.reason] || 'rej_nosubject') : '' }));
    return;
  }

  S.buys.push({
    id: ref, ts: S.today, metal: metal, fineness: fineness,
    grossG: w.grossG, stoneG: w.stoneG, netG: dq, weighedAs: w.weighedAs,
    rate: buyRate(metal), fineRate: buyFineRate(fineness, metal),
    metalAmd: buyPriceOf(w.netG, fineness, metal), stonesAmd: safeAmd(BY.stonesAmd,0),
    paid: paid, pay: BY.pay === 'bank' ? 'bank' : 'cash',
    dest: BY.dest === 'resale' ? 'resale' : 'scrap',
    subject: subject, pieceId: pieceId, lotId: lotId,
    seller: { name: String(BY.name||'').slice(0,80),
              passport: String(BY.passport||'').slice(0,40),
              ssn: String(BY.ssn||'').slice(0,20) }
  });
  BY = byFresh();
  /* NO TOAST OVER A DOCUMENT — the act opens in the same tick and its own header names the
     number, so the toast added nothing and covered the rows it was announcing. */
  saveState(); renderAll();
  openBuyAct(ref);
}

/* =====================================================================================

   The same furniture as ArmTrade's statement: two parties with ՀՎՀՀ, a line table, a total, the
   amount in words in Armenian, the payment method, two signature rules and a footnote.

function openBuyAct(ref){
  const a = (S.buys||[]).find(x => x && x.id === ref);
  if(!a) return;

    + '<b>' + escH(name || '—') + '</b>'
    + '<div class="muted">' + sub + '</div></div>';
  const sl = a.seller || {};
  const sellerSub = [
    sl.passport ? t('by_passport') + ' ' + escH(sl.passport) : '',
    sl.ssn ? t('by_ssn') + ' ' + escH(sl.ssn) : ''
  ].filter(Boolean).join(' · ');
  const rows = ['<tr>'
    + '<td>1<span class="actsub">' + escH(metalLabel(a.metal) + ' · ' + safeInt(a.fineness,0)
        + ' · ' + t('w_gross_s') + ' ' + gramTxt(a.grossG,3) + t('u_g')) + '</span></td>'

    + '<td class="num">' + safeAmd(a.metalAmd,0).toLocaleString('en-US') + '</td></tr>'];
  /* THE VALUATION LINE CARRIES THE AMOUNT, NOT THE MASS AGAIN. The stone weight is already on
     row 1, where it is subtracted to give net; repeating it here made the «Քարեր, գ» column of a
     signed document sum to twice the stones actually weighed. On paper a column of grams must be
     summable, so row 2 leaves every weight column empty and carries only the money. */
  if(safeAmd(a.stonesAmd,0)) rows.push('<tr>'

  openModal(
    '<h3>' + escH(t('act_title')) + ' № ' + escH(a.id) + '</h3>'

    + '</div>'
    + '<div class="tblwrap" style="max-height:none"><table class="tbl acttbl buyact"><thead><tr>'
      + '<th>' + escH(t('act_col_n')) + '</th><th>' + escH(t('act_col_metal')) + '</th>'

      + '<th class="num">' + escH(t('act_col_net')) + '</th>'
      + '<th class="num">' + escH(t('act_col_rate')) + '</th>'
      + '<th class="num">' + escH(t('act_col_sum')) + '</th>'
      + '</tr></thead><tbody>' + rows.join('') + '</tbody></table></div>'
    + '<div class="row actsep" style="margin-top:12px;padding-top:10px"><b>' + escH(t('act_total')) + '</b>'
      + '<span class="big">' + gramTxt(a.netG,3) + '<span class="g">' + escH(t('u_g')) + '</span>'
      + ' · ' + safeAmd(a.paid,0).toLocaleString('en-US') + '<span class="cur">֏</span></span></div>'
    /* IN ARMENIAN ON EVERY LANGUAGE OF THE UI — that is the language the document is signed in. */
    + '<div class="muted" style="margin-top:6px">' + escH(t('act_words')) + '՝ <b>' + escH(amWords(a.paid)) + '</b></div>'
    + '<div class="muted" style="margin-top:6px">' + escH(t('act_pay') + '՝ '
        + (a.pay === 'bank' ? t('by_bank') : t('by_cash'))) + '</div>'
    + '<div style="display:flex;gap:20px;margin-top:22px;flex-wrap:wrap">'
      + sign(t('act_seller')) + sign(t('act_buyer')) + '</div>'
