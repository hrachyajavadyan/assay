/* =====================================================================================
   ԳՈՒՅՔԱԳՐՈՒՄ — the stock count (spec 5.4)

   ArmTrade's act is the right skeleton — date, հաշվառող, նյութական պատասխանատու անձ, book against
   actual, ավելցուկ և պակասորդ, the basis line and the signature block — but a jewellery count
   happens on three axes at once and an act showing one of them is not a count.

   FOUR RULES THIS SCREEN IS BUILT ON, each of which is a way the naive version is wrong:

   1. SCOPE IS BY LOCATION, NOT BY SUPPLIER. A jeweller counts a display case, a safe, a drawer of
      unhallmarked work or the scrap tin. `Բոլորը · Ցուցափեղկ · Պահարան · Չհարգադրոշմված · Ջարդոն`.
   2. A PIECE IS CONFIRMED WITH ONE TAP. Its weight is already known and re-weighing every ring is
      not what a count is; the re-weigh is an affordance for a spot check and it records an
      adjustment with a reason. A BULK POOL, having no weight of its own, is put on the scale.
   3. PIECES OUT OF THE SHOP ARE OUT OF SCOPE AND LISTED SEPARATELY. Custody is not a movement
      (spec 1.3), so a ring at the assay office is still on-hand — and without this rule a
      hallmark send-out reads as a shortage on the act somebody signs.
   4. THE ACT MUST SAY WHAT THE DIFFERENCE IS WORTH IN DRAM. A 0.4 g shortage of 750 is about
      15,500 ֏. Surplus and shortage are reported in BOTH grams and pieces, subtotalled by
      fineness, with a pure-metal grand total valued at the day's 999 rate — neither figure alone
      is a count.

   The session lives in S.count rather than in a module variable because a count is a person
   walking round a cabinet with a phone: the phone will lock, the tab will be reloaded and the
   jeweller will step away to serve a customer. IT DOES NOT BLOCK SELLING — the nav is untouched,
   the sell screen keeps working, and the book figures are snapshotted at the moment the act is
   drawn up rather than at the moment the session opened.
   ===================================================================================== */
const CN_SCOPES = ['all','tray','safe','unmarked','scrap'];
/* the two locations that mean «physically here». Everything else is custody elsewhere. */
const CN_IN_SHOP = ['tray','safe'];
let CN_SHEET = null;                                  /* the subject whose re-weigh sheet is open */
let CNQ = '';                                         /* the count list's search box */
let CNNEW = { scope:'all', counter:'', mrp:'' };      /* the pre-start form, before a session exists */

/* the session, defaulted and clamped like everything else that survives a reload */
function cnMigrateSession(c, st){
  if(!c || typeof c !== 'object') return null;
  const lines = {}, src = (c.lines && typeof c.lines === 'object') ? c.lines : {};
  Object.keys(src).slice(0,4000).forEach(k => {
    const v = src[k];
    if(!v || typeof v !== 'object') return;
    lines[String(k).slice(0,40)] = {
      found: v.found !== false,
      /* null is «confirmed present, not re-weighed» and is NOT zero — zero grams on the scale is
         a different (and legitimate) answer for a pool. */
      g: (v.g == null || !isFinite(+v.g)) ? null : Math.max(0, LEDGER.clamp(v.g)),
      /* THE BOOK FIGURE AT THE MOMENT OF THE OBSERVATION. A count session deliberately survives
         a sale and a buy-in, so the books move under it; `at` is what makes the difference the
         act posts a difference between two facts of the SAME instant. Absent on a session
         written by an older build — cnBuildAct falls back to the current on-hand, which is what
         that build compared against anyway. */
      at: (v.at == null || !isFinite(+v.at)) ? null : LEDGER.clamp(v.at)
    };
  });
  return {
    startedTs: safeInt(c.startedTs, st.today),
    scope: CN_SCOPES.indexOf(c.scope) >= 0 ? c.scope : 'all',
    counter: String(c.counter || '').slice(0,80),
    mrp: String(c.mrp || '').slice(0,80),
    lines: lines
  };
}

/* ---- what is in scope, and what is deliberately not ---- */
function cnInScope(scope){
  const out = [];
  pieceRows().forEach(x => {
    /* RULE 3. A piece at the assay office, on a workshop bench or with a customer is still the
       shop's stock and still on-hand — it is simply not here to be counted. */
    if(CN_IN_SHOP.indexOf(x.p.location) < 0) return;
    if(scope === 'scrap') return;
    if(scope === 'tray' && x.p.location !== 'tray') return;
    if(scope === 'safe' && x.p.location !== 'safe') return;
    /* hmState() is documented as THE ONE PLACE that decides whether a stamp is wanted, and this
       scope must use it: filtering on the raw `origin` enum pulled in every piece whose stored
       origin happened to be 'none' even when the app itself rules it exempt by weight or as
       scrap — a 1.2 g gold earring is not «չհարգադրոշմված», it is exempt, and the screen that
       says so and the count scope that contradicts it cannot both be right. */
    if(scope === 'unmarked' && !hmNeeds(x.p)) return;
    out.push({ kind:'piece', subject:x.subject, p:x.p, on:x.on,
               metal:x.p.metal, fineness:safeInt(x.p.fineness,0) });
  });
  if(scope === 'all' || scope === 'scrap'){
    poolRows().forEach(x => out.push({ kind:'pool', subject:x.subject, b:x.b, on:x.on,
      metal:x.b.metal, fineness:safeInt(x.b.fineness,0) }));
  }
  return out.sort((a,b) => (a.metal === b.metal ? b.fineness - a.fineness : (a.metal === 'au' ? -1 : 1))
    || String(cnName(a)).localeCompare(String(cnName(b))));
}
const cnName = r => r.kind === 'pool' ? (t('w_scrap') + ' · ' + metalLabel(r.metal)) : modelName(r.p);
const cnDays = ts => safeInt(ts,0) ? Math.max(0, Math.floor((safeInt(S.today,0) - safeInt(ts,0)) / DAY)) : -1;
function cnOutOfShop(){
  return pieceRows().filter(x => CN_IN_SHOP.indexOf(x.p.location) < 0)
    .map(x => ({ p:x.p, on:x.on, days: cnDays(x.p.locTs) }));
}
/* THE CUSTOMER'S METAL, listed on the act and in NO total on it (spec 8). */
const repairsInShop = () => (S.repairs||[]).filter(r => r && r.status !== 'out');

/* ---- the session ---- */
function cnNew(k, v){ CNNEW[k] = v; renderAll(); }
function cnNewText(k, v){ CNNEW[k] = String(v == null ? '' : v).slice(0,80); }
function cnStart(){
  if(S.count) return;
  S.count = { startedTs: S.today, scope: CN_SCOPES.indexOf(CNNEW.scope) >= 0 ? CNNEW.scope : 'all',
              counter: CNNEW.counter, mrp: CNNEW.mrp, lines:{} };
  CNQ = ''; saveState(); renderAll();
}
function cnAbandon(){
  if(!S.count) return;
  openModal('<h3>' + escH(t('cn_abandon')) + '</h3>'
    + '<div class="alert bad"><div class="t">' + escH(t('cn_abandon_q')) + '</div></div>'
    + '<button class="btn danger full" style="margin-top:16px" onclick="cnAbandonGo()">'
      + escH(t('cn_abandon')) + '</button>'
    + '<button class="btn ghost full" style="margin-top:9px" onclick="closeModal()">'
      + escH(t('cancel')) + '</button>');
}
function cnAbandonGo(){ S.count = null; saveState(); closeModal(); renderAll(); }
function cnCountedN(){
  if(!S.count) return { k:0, n:0 };
  const rows = cnInScope(S.count.scope);
  return { k: rows.filter(r => S.count.lines[r.subject]).length, n: rows.length };
}
/* ONE TAP, AND THE SAME TAP AGAIN UNDOES IT. A mis-tap on a 44px target next to another 44px
   target is the single likeliest thing to happen during a count, and it must not need a sheet. */
/* every write of a line stamps the book figure it was taken against — see cnBuildAct. */
const cnAt = subject => round3(onHand(subject));
function cnMark(subject, found){
  if(!S.count) return;
  const cur = S.count.lines[subject];
  if(cur && cur.found === !!found && cur.g == null) delete S.count.lines[subject];
  else S.count.lines[subject] = { found: !!found, g: (found && cur) ? cur.g : null, at: cnAt(subject) };
  saveState(); cnRepaint(subject);
}
function cnPoolW(subject, v){
  if(!S.count) return;
  const sv = String(v == null ? '' : v).trim();
  /* typing must not re-render — that would move the caret. Only the progress strip repaints. */
  if(sv === '') delete S.count.lines[subject];
  else S.count.lines[subject] = { found:true, g: Math.max(0, round3(num(sv))), at: cnAt(subject) };
  saveState(); cnPaintProg();
}
function cnRepaint(subject){
  const rows = cnInScope(S.count.scope);
  const r = rows.find(x => x.subject === subject);
  const el = document.getElementById('cnr-' + subject);
  if(el && r) el.outerHTML = cnRowHtml(r);
  cnPaintProg();
}
function cnPaintProg(){
  const p = cnCountedN();
  const e = document.getElementById('cnProg'); if(e) e.innerHTML = cnProgInner(p);
  /* «{n} դեռ չհաշվառված» is the ONLY «am I finished?» signal on a screen that deliberately
     hides the book figures, and it is a SIBLING of #cnProg — so a partial repaint that touched
     only the bar left it frozen at the session's opening total for the whole count: the bar
     read «13 / 13» with «13 դեռ չհաշվառված» directly beneath it. It counts down with the bar
     and disappears at k === n. */
  const l = document.getElementById('cnLeft');
  if(l) l.innerHTML = (p.n - p.k) ? '<div class="notice">' + escH(fmt('cn_left', { n: p.n - p.k })) + '</div>' : '';
  const f = document.getElementById('cnFin'); if(f) f.className = 'btn primary' + (p.k ? '' : ' off');
}
function cnSearch(v){
  CNQ = String(v == null ? '' : v).slice(0,40);
  const el = document.getElementById('cnList');
  if(el) el.innerHTML = cnListHtml();
}

/* ---- the optional re-weigh (spec 5.4) ---- */
function cnReweigh(subject){
  if(!S.count) return;
  const rows = cnInScope(S.count.scope);
  const r = rows.find(x => x.subject === subject);
  if(!r) return;
  CN_SHEET = subject;
  const ln = S.count.lines[subject];
  /* WHAT THE SCALE CAN ACTUALLY GIVE. A shop scale reads the whole object; on a stoned piece
     there is no instrument in the shop that reads net. Asking for «Փաստացի զուտ քաշը» and then
     taking the answer literally turned a correct 5.800 g gross reading on a 5.420 g net piece
     into a +0.380 g surplus AND rewrote the piece to netG 5.800 / grossG 6.180 — a phantom
     surplus and a corrupted record, produced by following the label. So a stoned piece is asked
     for GROSS and the net is derived from the piece's own stored stoneG, exactly as the buy form
     does it, with the derived figure shown locked beside it. stoneG is not the book on-hand, so
     printing it does not break the blind rule. */
  const stone = (r.kind === 'piece') ? round3(r.p.stoneG) : 0;
  const asGross = stone > EPS;
  const shown = ln && ln.g != null ? (asGross ? round3(ln.g + stone) : round3(ln.g)) : null;
  openModal('<h3>' + escH(t('cn_reweigh_t')) + '</h3>'
    + '<div class="row"><span style="font-size:17px;font-weight:700">' + escH(cnName(r)) + '</span>'
      + '<span class="harg ' + r.metal + '">' + r.fineness + '</span></div>'
    /* BLIND: the book weight is NOT shown here either. A re-weigh that told you the answer first
       is not a re-weigh. */
    + '<div class="notice">' + escH(t('cn_blind_note')) + '</div>'
    + '<label class="fieldlbl" for="cnRw" style="margin-top:12px">'
      + escH(asGross ? t('cn_reweigh_lbl_g') : t('cn_reweigh_lbl')) + '</label>'
    + '<input id="cnRw" type="number" inputmode="decimal" min="0" step="0.001" value="'
      + escH(shown == null ? '' : gramTxt(shown,3)) + '" ' + (asGross ? 'oninput="cnRwPaint()"' : '') + '>'
    + (asGross
        ? '<div class="row" style="margin-top:8px"><span class="mlbl">' + escH(t('w_stone')) + '</span>'
            + '<span>' + gram(stone,3) + '</span></div>'
          + '<label class="fieldlbl" for="cnRwNet" style="margin-top:8px">' + escH(t('w_net'))
            + ' (' + escH(t('pc_derived')) + ')</label>'
          + '<input id="cnRwNet" type="text" disabled value="'
            + escH(shown == null ? '' : gramTxt(Math.max(0, round3(shown - stone)),3)) + '">'
        : '')
    + '<div class="notice">' + escH(t('cn_reweigh_note')) + '</div>'
    + '<button class="btn primary" style="margin-top:16px" onclick="cnReweighSave()">'
      + escH(t('cn_reweigh_save')) + '</button>'
    + (ln && ln.g != null ? '<button class="btn ghost full" style="margin-top:9px" onclick="cnReweighClear()">'
        + escH(t('cn_reweigh_clear')) + '</button>' : '')
    + '<button class="btn ghost full" style="margin-top:9px" onclick="CN_SHEET=null;closeModal()">'
      + escH(t('cancel')) + '</button>');
  setTimeout(() => { try{ document.getElementById('cnRw').focus(); }catch(e){} }, 60);
}
/* the derived net, from the piece's own stored stone weight. One definition, used by the
   sheet's locked field and by the save, so the two can never disagree. */
function cnReweighNet(subject, typed){
  const p = subject && String(subject).slice(0,2) === 'i:' ? pieceById(String(subject).slice(2)) : null;
  const stone = p ? round3(p.stoneG) : 0;
  return stone > EPS ? Math.max(0, round3(num(typed) - stone)) : Math.max(0, round3(num(typed)));
}
function cnRwPaint(){
  if(!CN_SHEET) return;
  const i = document.getElementById('cnRw'), o = document.getElementById('cnRwNet');
  if(!i || !o) return;
  const raw = String(i.value || '').trim();
  o.value = raw === '' ? '' : gramTxt(cnReweighNet(CN_SHEET, num(raw)), 3);
}
function cnReweighSave(){
  if(!S.count || !CN_SHEET) return;
  const raw = String((document.getElementById('cnRw')||{}).value || '').trim();
  if(raw === '') return;
  const g = Math.max(0, round3(num(raw)));
  S.count.lines[CN_SHEET] = { found:true, g: cnReweighNet(CN_SHEET, g), at: cnAt(CN_SHEET) };
  const sub = CN_SHEET; CN_SHEET = null;
  saveState(); closeModal(); cnRepaint(sub);
}
function cnReweighClear(){
  if(!S.count || !CN_SHEET) return;
  S.count.lines[CN_SHEET] = { found:true, g:null, at: cnAt(CN_SHEET) };
  const sub = CN_SHEET; CN_SHEET = null;
  saveState(); closeModal(); cnRepaint(sub);
}

/* ---- the act number, scanned off the acts the shop already holds so a number printed on paper
   is never re-used (the same rule nextActNo() follows for the գնման ակտ) ---- */
function nextCountNo(){
  const y = new Date(safeInt(S.today, Date.now())).getUTCFullYear();
  const re = /^ԳԱԿ-(\d{4})-(\d+)$/;
  let max = 0;
  (S.counts||[]).forEach(c => { const m = re.exec(String(c && c.id || '')); if(m && +m[1] === y) max = Math.max(max, +m[2]); });
  return 'ԳԱԿ-' + y + '-' + ('0000' + (max + 1)).slice(-4);
}

/* ---- THE SNAPSHOT. Built from on-hand AT THIS MOMENT, before a single movement is posted, so
   the act's «book» column is what the books said when the act was drawn up. ---- */
function cnBuildAct(){
  const c = S.count;
  const rows = cnInScope(c.scope);
  const g = {}, skipped = [], posts = [], moved = [];
  const grp = r => {
    const k = r.metal + ':' + r.fineness;
    if(!g[k]) g[k] = { metal:r.metal, fineness:r.fineness, bookPcs:0, actPcs:0, bookG:0, actG:0,
                       uncPcs:0, uncG:0, seen:0 };
    return g[k];
  };
  rows.forEach(r => {
    const q = grp(r), on = round3(r.on), ln = c.lines[r.subject];
    if(!ln){
      /* NOT REACHED IS NOT COUNTED — AND A SIGNED ACT MAY NOT ASSERT A PHYSICAL FACT NOBODY
         OBSERVED. An unvisited subject contributes to NEITHER actual column, to NO difference
         and to NO movement. It is carried whole into the act's own «Չհաշվառված» table with its
         metal, its հարգ, its piece count and its book weight, so the two halves of the document
         add back up to the books and the person signing can see exactly what was not looked at.
         Letting it inherit its own book figure into «Փաստ.» — which is what this branch used to
         do — made «not looked at» and «verified present» the same two columns and printed
         «Տարբերություն չկա» for a count in which 13 of 14 subjects were never touched. */
      if(r.kind === 'piece') q.uncPcs++;
      q.uncG = round3(q.uncG + on);
      skipped.push({ code: r.kind === 'pool' ? '' : String(r.p.code||''), name: cnName(r),
                     kind: r.kind, metal: r.metal, fineness: r.fineness, bookG: on });
      return;
    }
    /* THE BOOK FIGURE THIS OBSERVATION WAS MADE AGAINST — not the one the books hold at the
       moment «Ավարտել» is pressed. The screen itself invites the jeweller to leave the count and
       trade («Գույքագրումը վաճառքին չի խանգարում»), so metal legitimately arrives and leaves
       between the weighing and the act. Comparing a weight observed at 10:15 against a book
       figure read at 17:40 turned 10 g BOUGHT during the session into a 10 g shortage and posted
       a `count` movement that destroyed it — on an append-only log, with the գնման ակտ and the
       lot left pointing at metal that no longer existed. Pieces were immune only by accident (a
       sold piece leaves scope); pools were not. */
    const book = round3(ln.at == null ? on : ln.at);
    q.seen = 1;
    if(r.kind === 'piece') q.bookPcs++;
    q.bookG = round3(q.bookG + book);
    let act;
    if(r.kind === 'piece' && !ln.found) act = 0;
    else { act = ln.g == null ? book : round3(ln.g); if(r.kind === 'piece') q.actPcs++; }
    q.actG = round3(q.actG + act);
    const dq = round3(act - book);
    /* the books moved under this observation. The correction is still correct — it is a
       difference between two facts of the same instant — but the act must SAY the subject moved,
       because its «Հաշվապ.» cell is then the weighing-time figure and not today's closing one. */
    const mv = !eqG(book, on)
      ? { code: r.kind === 'pool' ? '' : String(r.p.code||''), name: cnName(r), metal: r.metal,
          fineness: r.fineness, atG: book, nowG: on, refused: 0 } : null;
    if(!eqG(dq, 0)){
      /* a correction may never drive a subject negative: a piece sold mid-session is already off
         the books and a second deduction would invent a debt in metal. */
      if(round3(on + dq) < -EPS){ if(mv) mv.refused = 1; else moved.push({ code:'', name: cnName(r),
          metal:r.metal, fineness:r.fineness, atG:book, nowG:on, refused:1 }); }
      else posts.push({ subject:r.subject, dq: dq, reason: dq > 0 ? 'surplus' : 'short' });
    }
    if(mv) moved.push(mv);
  });
  const all = Object.keys(g).map(k => g[k]).sort((a,b) =>
    (a.metal === b.metal ? b.fineness - a.fineness : (a.metal === 'au' ? -1 : 1)));
  const outRows = all.filter(q => q.seen).map(q => {
      const dG = round3(q.actG - q.bookG);
      return { metal:q.metal, fineness:q.fineness, bookPcs:q.bookPcs, actPcs:q.actPcs,
               bookG:q.bookG, actG:q.actG, dPcs: q.actPcs - q.bookPcs, dG: dG,
               /* WHAT THE DIFFERENCE IS WORTH — computed from THE ROW'S OWN PRINTED OPERANDS:
                  the difference in grams, the fineness in the row's first column, and the day's
                  999 rate named under the table. A 0.4 g shortage of 750 is about 15,500 ֏ and
                  the person signing has to see it in dram.
                  pureG()'s 3dp rounding is a DISPLAY convention for grams and is deliberately
                  NOT in this path: the act prints the difference in grams, not in pure grams, so
                  rounding the pure figure first would make a row an accountant recomputes by
                  hand disagree by up to ~26 ֏ — on a document whose whole job is to be checked. */
               amd: Math.round(num(dG) * q.fineness / 1000 * metalRate999(q.metal)) };
    });
  /* the uncounted half of the act, subtotalled the same way the counted half is */
  const unc = all.filter(q => q.uncPcs || q.uncG > EPS).map(q =>
    ({ metal:q.metal, fineness:q.fineness, pcs:q.uncPcs, g:q.uncG }));
  return { rows: outRows, posts: posts, skipped: skipped, unc: unc, moved: moved };
}

function cnFinish(){
  if(!S.count) return;
  const p = cnCountedN();
  if(!p.k) return;
  const c = S.count;
  const built = cnBuildAct();
  const ref = nextCountNo();
  /* THE MOVEMENTS. Type `count` — which is the one type, with `adjust`, that the piece-integrity
     guard exempts from the whole-piece rule, precisely so a re-weigh (a delta of 0.05 g, not of
     5.42 g) is not refused. syncPieceWeight() then makes the piece record follow the ledger. */
  let refused = 0;
  built.posts.forEach(m => {
    const ok = postMove({ subject:m.subject, type:'count', dq:m.dq, ts:S.today,
                          reason:m.reason, ref:ref, actor:'shop' });
    if(!ok) refused++;
  });
  const act = {
    id: ref, ts: S.today, scope: c.scope,
    counter: String(c.counter||'').slice(0,80), mrp: String(c.mrp||'').slice(0,80),
    rows: built.rows,
    /* RULE 3: out of scope, and SAID SO on the act. */
    out: cnOutOfShop().map(x => ({ code:String(x.p.code||''), name: modelName(x.p),
      location: x.p.location, days: Math.max(0, x.days), metal:x.p.metal,
      fineness: safeInt(x.p.fineness,0), netG: round3(x.on) })),
    /* the customer's metal, in no total on this document */
    cust: repairsInShop().map(r => ({ name: r.custName, descr: r.descr, grossG: r.grossG,
      fineness: safeInt(r.fineness,0), metal: r.metal })),
    skipped: built.skipped,
    /* the uncounted half, by metal and հարգ — see cnBuildAct */
    unc: built.unc,
    /* subjects whose books moved between the weighing and the act */
    moved: built.moved,
    rate: { au: base999(), ag: silver999() }
  };
  S.counts.push(act);
  S.count = null; CNQ = '';
  migrate(S); saveState(); renderAll();
  /* NO TOAST OVER A DOCUMENT. The act opens in the same tick and its own header names the
     number, so the toast added nothing and sat on top of the 750 and 585 rows for three seconds
     — the first thing the jeweller saw of a freshly drawn act was two of its rows obscured. A
     REFUSAL is different: nothing else says it, so that one still speaks. */
  if(refused) toast(fmt('led_rejected', { r: String(refused) }));
  openCountAct(ref);
}

/* ---- the screen ---- */
function cnProgInner(p){
  const pct = p.n ? Math.round(p.k*100/p.n) : 0;
  return '<div class="bar"><i style="width:' + pct + '%"></i></div>'
    + '<div class="n">' + escH(fmt('cn_progress', { k: p.k, n: p.n })) + '</div>';
}
function cnRowHtml(r){
  const ln = S.count.lines[r.subject];
  const bits = [];
  if(r.kind === 'piece'){
    if(r.p.code && r.p.code !== cnName(r)) bits.push('<span>' + escH(r.p.code) + '</span>');
    bits.push('<span>' + escH(catLabel(r.p.cat)) + '</span>');
  } else bits.push('<span>' + escH(t('cn_kind_pool')) + '</span>');
  bits.push('<span class="harg ' + r.metal + '">' + r.fineness + '</span>');
  /* THE MARK, NEVER THE BOOK FIGURE. «կշռված 5.420 գ» is what the jeweller himself just put on
     the scale, so showing it back is not a leak; the book weight stays hidden until the act.
     Only a PIECE carries it: a pool's weight is in the pool's own field, one column to the right,
     and a badge repeating it would be a second place for the same number to disagree from. */
  if(r.kind === 'piece' && ln && ln.g != null) bits.push('<span class="badge b-cyan">'
    + escH(t('cn_marked_w') + ' ' + t('w_net_s')) + ' ' + gramTxt(ln.g,3) + escH(t('u_g')) + '</span>');
  /* a stoned piece is re-weighed GROSS and the net is derived; the row says which one it holds */
  if(r.kind === 'piece' && round3(r.p.stoneG) > EPS) bits.push('<span class="mlbl">'
    + escH(t('w_stone_s') + ' ' + gramTxt(r.p.stoneG,3) + t('u_g')) + '</span>');
  const nm = '<div class="n">' + escH(cnName(r)) + '</div><div class="s">' + bits.join('') + '</div>';
  return '<div class="cnrow' + (ln ? ' done' : '') + '" id="cnr-' + escH(r.subject) + '">'
    /* the name is a tap target ONLY for a piece, where it opens the optional re-weigh. A pool is
       weighed in the field beside it, so its name is a label and nothing more. */
    + (r.kind === 'piece'
        ? '<button class="cnnm" onclick="cnReweigh(' + jsArg(r.subject) + ')">' + nm + '</button>'
        : '<div class="cnnm">' + nm + '</div>')
    + (r.kind === 'pool'
        /* A BULK POOL HAS NO WEIGHT OF ITS OWN — it goes on the scale. 2dp is what a shop scale
           reads for a tray of scrap; the field still stores to 3. */
        ? '<div class="cnw"><input type="number" inputmode="decimal" min="0" step="0.01" placeholder="'
            + escH(t('cn_pool_w')) + '" aria-label="' + escH(t('cn_pool_w')) + '" value="'
            + escH(ln && ln.g != null ? gramTxt(ln.g,2) : '') + '" oninput="cnPoolW('
            + jsArg(r.subject) + ',this.value)"></div>'
        : '<div class="cnact">'
          + '<button class="yes' + (ln && ln.found ? ' on' : '') + '" onclick="cnMark('
            + jsArg(r.subject) + ',true)">' + escH(t('cn_present')) + '</button>'
          + '<button class="no' + (ln && !ln.found ? ' on' : '') + '" onclick="cnMark('
            + jsArg(r.subject) + ',false)">' + escH(t('cn_absent')) + '</button>'
          + '</div>')
    + '</div>';
}
function cnListHtml(){

}

            + '<div class="pw"><div class="a">' + (diff < 0 ? '−' : '') + Math.abs(diff).toLocaleString('en-US')
              + '<span class="cur">֏</span></div></div></button>'; }).join('')

/* =====================================================================================
   ԳՈՒՅՔԱԳՐՄԱՆ ԱԿՏ — the count act (spec 5.4)
   ArmTrade's act furniture and signature block, with the three axes a jewellery count actually
   has: pieces AND grams, subtotalled by fineness; a pure-metal grand total; and the difference
   valued in dram at the day's 999 rate, because that is what makes the act matter to the person
   signing it.
   ===================================================================================== */
/* a header cell carrying both wordings — see the .thshort note in the stylesheet */
function th2(key, cls){
  return '<th' + (cls ? ' class="' + cls + '"' : '') + '>'
    + '<span class="thlong">' + escH(t(key)) + '</span>'
    + '<span class="thshort">' + escH(t(key + '_s')) + '</span></th>';
}
function openCountAct(id){
  const a = (S.counts||[]).find(x => x && x.id === id);
  if(!a) return;
  const sign = lbl => '<div style="flex:1;min-width:150px"><div class="doclbl">' + escH(lbl) + '</div>'
    + '<div class="actsignline"></div></div>';
  const r999 = m => safeAmd(m === 'ag' ? a.rate.ag : a.rate.au, 0);
  const unc = a.unc || [];
  const moved = a.moved || [];
  const uncN = (a.skipped||[]).length;
  /* SUMMED UNROUNDED, ROUNDED ONCE — same rule breakdown(), valBreakdown() and the act's own
     footing line already follow. Rounding each row's pure figure to 3 dp before adding them put
     the printed book and actual pure totals up to a milligram out, which at 51,738 ֏/g is a
     figure an accountant recomputing the act by hand cannot reconcile. The per-metal dram
     subtotal below is the SUM OF THAT METAL'S ROWS, printed with its own arithmetic, so nothing
     on the paper invites the reader to multiply the two pure figures by the rate instead. */
  const bookPure = {}, actPure = {}, metalAmd = {};
  a.rows.forEach(r => {
    bookPure[r.metal] = (bookPure[r.metal]||0) + num(r.bookG) * safeInt(r.fineness,0) / 1000;
    actPure[r.metal]  = (actPure[r.metal] ||0) + num(r.actG)  * safeInt(r.fineness,0) / 1000;
    metalAmd[r.metal] = (metalAmd[r.metal]||0) + safeInt(r.amd,0);
  });
  const metals = Object.keys(bookPure);
  const diffAmd = a.rows.reduce((s,r) => s + safeInt(r.amd,0), 0);
  const uncPure = {};
  unc.forEach(u => { uncPure[u.metal] = (uncPure[u.metal]||0) + num(u.g) * safeInt(u.fineness,0) / 1000; });

  /* THE METAL IS INK, NOT A SCREEN AFFORDANCE. Gold and silver share 999, so a printed row
     identified by fineness alone is not uniquely identifiable — the act carried «999 … 7.180»
     (gold) and «999 … 40.000» (silver) as two indistinguishable rows, because the metal lived in
     an `.actsub` the print rule hides. It now sits in the cell itself, on paper and on screen. */
  const body = a.rows.map(r => '<tr>'
    + '<td>' + escH(metalLabel(r.metal)) + ' ' + r.fineness
      + '<span class="actsub">' + escH((r.bookPcs || r.actPcs)
          ? r.bookPcs + '/' + r.actPcs + ' ' + t('u_pcs')
            + (r.dPcs ? ' · ' + (r.dPcs > 0 ? '+' + r.dPcs : '−' + Math.abs(r.dPcs)) : '')
          : '') + '</span></td>'
    + '<td class="num">' + r.bookPcs + '</td>'
    + '<td class="num">' + r.actPcs + '</td>'
    + '<td class="num">' + gramTxt(r.bookG,3) + '</td>'
    + '<td class="num">' + gramTxt(r.actG,3) + '</td>'
    /* `.neg` PRINTS ITS OWN MINUS SIGN (see the CSS), so these three columns carry the MAGNITUDE.
       Printing the signed number as well gave «− −1» in the pieces column of a signed act. */
    + '<td class="num' + (r.dPcs < 0 ? ' neg' : '') + '">'
      + (r.dPcs > 0 ? '+' + r.dPcs : (r.dPcs < 0 ? Math.abs(r.dPcs) : '0')) + '</td>'
    + '<td class="num' + (r.dG < -EPS ? ' neg' : '') + '">'
      + (eqG(r.dG,0) ? '0.000' : (r.dG > 0 ? '+' + gramTxt(r.dG,3) : gramTxt(Math.abs(r.dG),3))) + '</td>'
    + '<td class="num' + (r.amd < 0 ? ' neg' : '') + '">'
      + (r.amd > 0 ? '+' + r.amd.toLocaleString('en-US')
         : (r.amd < 0 ? Math.abs(r.amd).toLocaleString('en-US') : '0')) + '</td>'
    + '</tr>').join('');

  openModal(
    '<h3>' + escH(t('cn_act')) + ' № ' + escH(a.id) + '</h3>'
    + '<div class="muted">' + escH(fdate(a.ts) + ' · ' + t('cn_scope_lbl') + '՝ ' + t('cn_scope_' + a.scope)) + '</div>'
    + '<hr class="actrule">'
    + '<div class="row" style="align-items:flex-start;gap:14px;flex-wrap:wrap">'
      + '<div style="min-width:150px"><div class="doclbl">' + escH(t('data_shop')) + '</div>'
        + '<b>' + escH(S.cfg.shopName || t('app_name')) + '</b>'
        + '<div class="muted">' + escH(t('data_tin')) + ' <span class="num">' + escH(S.cfg.tin || '—') + '</span></div></div>'
      + '<div style="min-width:150px"><div class="doclbl">' + escH(t('cn_counter')) + '</div>'
        + '<b>' + escH(a.counter || '—') + '</b>'
        + '<div class="muted">' + escH(t('cn_mrp')) + '՝ ' + escH(a.mrp || '—') + '</div></div>'
    + '</div>'
    + '<div class="muted" style="margin-top:6px">' + escH(t('cn_act_basis')) + '</div>'

    + (uncN ? '<div class="sec">' + escH(t('cn_counted_t')) + '</div>' : '')
    + (a.rows.length ? '<div class="tblwrap" style="max-height:none"><table class="tbl acttbl"><thead><tr>'
      + th2('cn_col_harg', '') + th2('cn_col_bpcs', 'num') + th2('cn_col_apcs', 'num')
      + th2('cn_col_bg', 'num') + th2('cn_col_ag', 'num') + th2('cn_col_dpcs', 'num')
      + th2('cn_col_dg', 'num') + th2('cn_col_amd', 'num')
      + '</tr></thead><tbody>' + body + '</tbody></table></div>'
      : '<div class="muted">' + escH(t('cn_none')) + '</div>')

    /* THE GRAND TOTAL IS IN PURE METAL, per metal, because grams of different finenesses are
       never added together (spec 1.4). */
    + '<div class="sec">' + escH(t('cn_pure_diff') + (uncN ? ' · ' + t('cn_counted_only') : '')) + '</div>'
    + '<div class="dl">'
      + metals.map(m => '<div><div class="l">' + escH(t('cn_pure_book') + ' · ' + metalLabel(m))
          + '</div><div class="v">' + gramTxt(bookPure[m],3) + escH(t('u_g')) + '</div></div>'
        + '<div><div class="l">' + escH(t('cn_pure_act') + ' · ' + metalLabel(m))
          + '</div><div class="v">' + gramTxt(actPure[m],3) + escH(t('u_g')) + '</div></div>'
        + '<div><div class="l">' + escH(t('cn_pure_d') + ' · ' + metalLabel(m))
          + '</div><div class="v">' + (actPure[m] - bookPure[m] < -EPS ? '−' : '')
          + gramTxt(Math.abs(actPure[m] - bookPure[m]),3) + escH(t('u_g')) + '</div></div>'
        + '<div><div class="l">' + escH(t('cn_in_amd') + ' · ' + metalLabel(m))
          + '</div><div class="v">' + (metalAmd[m] < 0 ? '−' : '')
          + Math.abs(safeInt(metalAmd[m],0)).toLocaleString('en-US') + escH(' ֏') + '</div></div>').join('')
    + '</div>'
    + '<div class="notice">' + escH(t('cn_pure_note')) + '</div>'
    + '<div class="row actsep" style="margin-top:12px;padding-top:10px"><b>' + escH(t('cn_val_diff')) + '</b>'
      + '<span class="big">' + (diffAmd < 0 ? '−' : '') + Math.abs(diffAmd).toLocaleString('en-US')
      + '<span class="cur">֏</span></span></div>'
    /* THE TOTAL IS THE SUM OF THE COLUMN ABOVE IT, AND THE LINE SAYS SO BY ADDING THE COLUMN UP.
       It used to be a per-metal pure-grams line — round(Σ pure × rate) — while the column was
       per-fineness — Σ round(pure × rate). Two roundings, and on a real count they disagreed by
       51 ֏: the headline read −589,330 and the arithmetic printed directly beneath it ended
       «= −589,279». Same defect breakdown() and valBreakdown() were both already fixed for, on
       the one document that gets signed by two people. */
    + (a.rows.length ? '<div class="brk">'
        /* a run of «+ −7,753 + −571,074» is arithmetic nobody reads: the sign belongs to the
           OPERATOR between the terms, so a shortage subtracts and a surplus adds. */
        + a.rows.map((r,i) => (i === 0
              ? (r.amd < 0 ? '<span class="op">−</span>' : '')
              : '<span class="op">' + (r.amd < 0 ? '−' : '+') + '</span>')
            + '<b>' + Math.abs(safeInt(r.amd,0)).toLocaleString('en-US') + '</b>').join('')
        + '<span class="eq">=</span><b>' + (diffAmd < 0 ? '−' : '')
        + Math.abs(diffAmd).toLocaleString('en-US') + ' \u058F</b>'
        + '<span class="why">' + escH(t('cn_val_why')) + '</span></div>' : '')
    /* and the rates those amounts were built from, because no computed money appears in this
       product without saying where its numbers came from */
    + '<div class="muted" style="margin-top:6px">' + escH(metals.map(m =>
        metalLabel(m) + ' 999 · ' + r999(m).toLocaleString('en-US') + ' ֏/' + t('u_g')).join(' · ')) + '</div>'
    /* THE SUMMARY MAY NOT OVERSTATE WHAT WAS DONE. «Տարբերություն չկա» on an act where 13 of 14
       subjects were never looked at is the document telling the person signing it something
       nobody checked; when anything went uncounted the headline says so and the count of
       uncounted subjects sits with it, not below the total. */
    + '<div class="muted" style="margin-top:6px">' + escH(diffAmd === 0
        ? (uncN ? t('cn_nodiff_part') : t('cn_nodiff'))
        : (diffAmd < 0 ? t('cn_short') : t('cn_surplus'))
          + (uncN ? ' · ' + t('cn_counted_only') : '')) + '</div>'
    + (uncN ? '<div class="alert bad" style="margin-top:8px"><div class="t">'
        + escH(fmt('cn_unc_warn', { n: uncN })) + '</div></div>' : '')

    /* RULE 3, ON THE DOCUMENT: a hallmark send-out is not a shortage. */
    + (a.out.length ? '<div class="sec">' + escH(t('cn_out')) + '</div>'
        + '<div class="tblwrap"><table class="tbl"><thead><tr>'
        + '<th>' + escH(t('w_piece')) + '</th><th>' + escH(t('w_loc')) + '</th>'
        + '<th class="num">' + escH(t('w_net_s')) + '</th></tr></thead><tbody>'
        + a.out.map(o => '<tr><td>' + escH(o.name || o.code || '—')
            + '<span class="subkeep">' + escH([o.code && o.code !== o.name ? o.code : '', metalLabel(o.metal), o.fineness].filter(Boolean).join(' · ')) + '</span></td>'
          + '<td>' + escH(locLabel(o.location)) + (o.days ? '<span class="subkeep">'
              + escH(fmt('cn_days', { n: o.days })) + '</span>' : '') + '</td>'
          + '<td class="num">' + gramTxt(o.netG,3) + '</td></tr>').join('')
        + '</tbody></table></div>'
        + '<div class="notice">' + escH(t('cn_out_note')) + '</div>' : '')

    /* THE CUSTOMER'S METAL — physically in the shop, in no total on this act (spec 8). */
    + (a.cust.length ? '<div class="sec">' + escH(t('cn_cust')) + '</div>'
        + '<div class="row"><span class="mlbl">' + escH(fmt('cn_pcs', { n: a.cust.length })) + '</span>'
        + '<span>' + gram(a.cust.reduce((s,x) => round3(s + num(x.grossG)), 0), 3) + '</span></div>'
        + '<div class="tblwrap"><table class="tbl"><thead><tr>'
        + '<th>' + escH(t('by_name')) + '</th><th>' + escH(t('w_note')) + '</th>'
        + '<th class="num">' + escH(t('w_gross_s')) + '</th></tr></thead><tbody>'
        + a.cust.map(x => '<tr><td>' + escH(x.name || '—') + '</td><td>' + escH(x.descr || '—')
            + '<span class="subkeep">' + escH(x.fineness ? metalLabel(x.metal) + ' ' + x.fineness : metalLabel(x.metal)) + '</span></td>'
          + '<td class="num">' + gramTxt(x.grossG,3) + '</td></tr>').join('')
        + '</tbody></table></div>'
        + '<div class="notice">' + escH(t('cn_cust_note')) + '</div>' : '')

    /* THE BOOKS MOVED UNDER THE COUNT — said on the act, because the «Հաշվապ.» cells of the
       affected rows are then the weighing-time figures and not today's closing ones. */
    + (moved.length ? '<div class="sec">' + escH(t('cn_moved_t')) + '</div>'
        + '<div class="tblwrap"><table class="tbl"><thead><tr>'
        + '<th>' + escH(t('cn_col_harg')) + '</th>'
        + '<th class="num">' + escH(t('cn_col_atw')) + '</th>'
        + '<th class="num">' + escH(t('cn_col_now')) + '</th></tr></thead><tbody>'
        + moved.map(x => '<tr><td>' + escH(metalLabel(x.metal) + ' ' + x.fineness)
            + '<span class="subkeep">' + escH([x.name, x.code && x.code !== x.name ? x.code : '',
                x.refused ? t('cn_moved_refused') : ''].filter(Boolean).join(' · ')) + '</span></td>'
          + '<td class="num">' + gramTxt(x.atG,3) + '</td>'
          + '<td class="num">' + gramTxt(x.nowG,3) + '</td></tr>').join('')
        + '</tbody></table></div>'
        + '<div class="notice">' + escH(t('cn_moved_note')) + '</div>' : '')

    /* THE UNCOUNTED HALF OF THE DOCUMENT. It used to be a muted run of names truncated at 20
       with nothing saying so — «Ջարդոն · Ոսկի · Ջարդոն · Ոսկի · Ջարդոն · Ոսկի» for the 585, 750
       and 999 pools, three identical strings, and 17 further items silently dropped under a
       header that stated the true count. It is now a table on the same terms as the counted
       half: metal, հարգ, pieces and book weight, all of them, so the two halves add back up to
       the books. */
    + (unc.length ? '<div class="sec">' + escH(t('cn_uncounted')) + '</div>'
        + '<div class="tblwrap" style="max-height:none"><table class="tbl"><thead><tr>'
        + '<th>' + escH(t('cn_col_harg')) + '</th>'
        + '<th class="num">' + escH(t('cn_col_bpcs')) + '</th>'
        + '<th class="num">' + escH(t('cn_col_bg')) + '</th></tr></thead><tbody>'
        + unc.map(u => '<tr><td>' + escH(metalLabel(u.metal) + ' ' + u.fineness)
            /* the pool's own name already reads «Ջարդոն · Ոսկի», and inside a row that names the
               metal and the հարգ that repeats the metal twice and makes the separator ambiguous:
               within this row it is simply «Ջարդոն». */
            + '<span class="subkeep">' + escH((a.skipped||[]).filter(x =>
                x.metal === u.metal && x.fineness === u.fineness)
              .map(x => x.kind === 'pool' ? t('w_scrap')
                    : x.name + (x.code && x.code !== x.name ? ' ' + x.code : '')).join(' · ')) + '</span></td>'
          + '<td class="num">' + safeInt(u.pcs,0) + '</td>'
          + '<td class="num">' + gramTxt(u.g,3) + '</td></tr>').join('')
        + '</tbody></table></div>'
        + '<div class="row actsep" style="margin-top:10px;padding-top:10px">'
          + '<span class="mlbl">' + escH(fmt('cn_pcs', { n: uncN })) + '</span>'
          + '<span>' + escH(Object.keys(uncPure).map(m => metalLabel(m) + ' '
              + gramTxt(uncPure[m],3) + t('u_g')).join(' · ')) + '</span></div>'
        + '<div class="notice">' + escH(t('cn_uncounted_note')) + '</div>'
      : (a.skipped && a.skipped.length ? '<div class="sec">' + escH(t('cn_uncounted')) + '</div>'
        + '<div class="row"><span class="mlbl">' + escH(fmt('cn_pcs', { n: a.skipped.length })) + '</span></div>'

}

/* =====================================================================================
   ՀԱՐԳԱԴՐՈՇՄԱՎՈՐՈՒՄ — hallmarking (spec 5.1)

   THE ORDINARY JEWELLER IS NOT THE ASSAYER. Assaying (հարգորոշում) and hallmarking
   (հարգադրոշմավորում) may be performed only by licensed practitioners at licensed premises, so
   this screen records NO ASSAY RESULT. It tracks a STATUS and a SEND-OUT CYCLE, and — the useful
   part — it knows which items need no stamp at all and says why.

   THREE RULES:

   1. `origin` IS AN ENUM, NOT A BOOLEAN. An unstamped item is legitimate in six different ways
      (under weight, scrap, unfinished, EAEU-marked, RA-marked, or genuinely unstamped) and the UI
      must not treat any of them as an error. hmNeed() is the ONE place that decides whether an
      item is actually waiting for a stamp.
   2. SEND-OUT IS A LOCATION CHANGE, NOT A MOVEMENT (spec 1.3). The piece is still the shop's
      stock and still on-hand. Posting a movement for it would make a hand-over read as a sale in
      the books and as a shortage at the next count. NOTHING IN THIS SECTION CALLS postMove().
   3. THE APP COMPUTES THE EXEMPTION AND SAYS WHY, so it never asks a jeweller for a stamp that is
      not required — a 1.2 g gold earring is exempt by weight and the screen states the rule
      rather than flagging a legitimate item.

   Terminology, hard rule: հարգադրոշմ / հարգադրոշմավորում, never the bare դրոշմավորում — that
   word also names the track-and-trace regime and a stamp-duty concept. Three regimes, one root.
   ===================================================================================== */
let HMPICK = {};        /* the batch selection for a hand-over: pieceId -> 1 */
let HM_SHEET = null;    /* the piece whose status or return sheet is open */

/* THE ONE PLACE that decides whether a piece is waiting for a stamp. Returns '' when it is not,
   and the reason key when it is exempt or already marked. */
function hmState(p){
  const o = p.hallmark.origin;
  if(o === 'am_assay' || o === 'eaeu') return o;              /* already carries a stamp */
  if(o.indexOf('exempt_') === 0) return o;                    /* exempt, for a stated reason */
  const sug = suggestHallmark(p);                             /* the app's own computation */
  if(sug !== 'none') return sug;                              /* under weight, or scrap */
  return '';                                                  /* '' means: a stamp is wanted */
}
const hmNeeds = p => hmState(p) === '';
/* the human reason beside the state, so «Ազատված՝ քաշով» never appears without the rule it rests on */
function hmReason(p){
  const st = hmState(p);
  if(st === 'exempt_weight') return fmt('hm_why_weight', { g: (HM_EXEMPT_G[p.metal] || 1.5) + ' ' + t('u_g') });
  return '';
}
const hmDaysOut = p => cnDays(safeInt(p.hallmark.sentTs, 0) || safeInt(p.locTs, 0));
const hmLate = p => { const d = hmDaysOut(p); return d >= 0 && d > safeInt(S.cfg.hmDays, 14); };

function hmLists(){
  const on = pieceRows();
  const todo = [], office = [], back = [], fine = [];
  on.forEach(x => {
    const p = x.p;
    if(p.location === 'assay'){ office.push(x); return; }
    if(CN_IN_SHOP.indexOf(p.location) < 0) return;            /* workshop / customer: not this screen */
    if(hmNeeds(p)) todo.push(x); else fine.push(x);
  });
  /* ON-HAND, LIKE THE OTHER THREE LISTS. Built from S.pieces with no stock filter, this kept
     listing a piece that had been returned and then SOLD — a piece that has left the shop, still
     appearing on the shop's hallmarking screen. */
  on.forEach(x => { if(safeInt(x.p.hallmark.backTs,0)) back.push(x.p); });
  back.sort((a,b) => safeInt(b.hallmark.backTs,0) - safeInt(a.hallmark.backTs,0));
  office.sort((a,b) => hmDaysOut(b.p) - hmDaysOut(a.p));
  return { todo, office, back: back.slice(0,10), fine };
}
const hmLateCount = () => pieceRows().filter(x => x.p.location === 'assay' && hmLate(x.p)).length;

function hmPick(id){
  if(HMPICK[id]) delete HMPICK[id]; else HMPICK[id] = 1;
  renderAll();
}
function hmPickN(){ return Object.keys(HMPICK).filter(id => { const p = pieceById(id);
  return p && p.location !== 'assay' && onHand(pieceSubj(id)) > EPS; }).length; }

/* ---- the status sheet: the six legitimate ways an item can be unstamped ---- */
function hmStatusSheet(id){
  const p = pieceById(id);
  if(!p) return;
  HM_SHEET = id;
  const b = (fn, label) => '<button class="btn ghost full" style="margin-top:9px" onclick="' + fn + '">'
    + escH(label) + '</button>';

    + '<div class="row"><span style="font-size:17px;font-weight:700">' + escH(modelName(p)) + '</span>'
      + '<span class="harg ' + p.metal + '">' + safeInt(p.fineness,0) + '</span></div>'
    + '<div class="muted" style="margin-top:4px">' + escH([p.code, catLabel(p.cat),
        gramTxt(p.netG,3) + t('u_g')].filter(Boolean).join(' · ')) + '</div>'
    + '<div class="row" style="margin-top:12px"><span class="mlbl">' + escH(t('hm_title')) + '</span>'
      + '<span>' + escH(hmLabel(p.hallmark.origin)) + '</span></div>'
    + (hmReason(p) ? '<div class="notice">' + escH(hmReason(p)) + '</div>' : '')
    + '<div class="notice">' + escH(t('hm_custody')) + '</div>'
    + b('hmSetOrigin(' + jsArg('am_assay') + ')', t('hm_mark_am'))
    + b('hmSetOrigin(' + jsArg('eaeu') + ')', t('hm_mark_eaeu'))
    + b('hmSetOrigin(' + jsArg('exempt_other') + ')', t('hm_mark_exempt'))
    + (p.hallmark.origin !== 'none' ? b('hmSetOrigin(' + jsArg('none') + ')', t('hm_mark_none')) : '')
    + '<button class="btn ghost full" style="margin-top:16px" onclick="HM_SHEET=null;closeModal()">'
      + escH(t('close')) + '</button>');
}
function hmSetOrigin(o){
  const p = pieceById(HM_SHEET);
  if(!p) return;
  /* A STATUS, NOT AN ASSAY RESULT: this records what the item is known to carry, and it changes
     no weight, no price and NO LEDGER ENTRY. */
  p.hallmark.origin = ['am_assay','eaeu','exempt_weight','exempt_scrap','exempt_other','none'].indexOf(o) >= 0 ? o : 'none';
  HM_SHEET = null; saveState(); closeModal(); renderAll();
}

/* ---- the hand-over ---- */
function nextHmNo(){
  const y = new Date(safeInt(S.today, Date.now())).getUTCFullYear();
  const re = /^ՀՁ-(\d{4})-(\d+)$/;
  let max = 0;
  (S.hmSends||[]).forEach(h => { const m = re.exec(String(h && h.id || '')); if(m && +m[1] === y) max = Math.max(max, +m[2]); });
  return 'ՀՁ-' + y + '-' + ('0000' + (max + 1)).slice(-4);
}
function hmSendSheet(){
  if(!hmPickN()) return;
  const ids = Object.keys(HMPICK).filter(id => { const p = pieceById(id);
    return p && p.location !== 'assay' && onHand(pieceSubj(id)) > EPS; });
  const tot = ids.reduce((a,id) => round3(a + num(pieceById(id).netG)), 0);
  openModal('<h3>' + escH(t('hm_send_t')) + '</h3>'
    + '<div class="row"><span class="mlbl">' + escH(fmt('cn_pcs', { n: ids.length })) + '</span>'
      + '<span>' + gram(tot,3) + '</span></div>'
    + '<label class="fieldlbl" for="hmOf" style="margin-top:12px">' + escH(t('hm_office')) + '</label>'
    + '<input id="hmOf" type="text" maxlength="60" value="' + escH(S.cfg.hmOffice) + '">'
    /* SAID OUT LOUD ON THE SHEET THAT COMMITS IT, because this is the one rule a later reader is
       most likely to "fix" into a movement. */
    + '<div class="notice">' + escH(t('hm_custody')) + '</div>'
    + '<button class="btn primary" style="margin-top:16px" onclick="hmSendGo()">'
      + escH(t('hm_send_go')) + '</button>'
    + '<button class="btn ghost full" style="margin-top:9px" onclick="closeModal()">'
      + escH(t('cancel')) + '</button>');
}
function hmSendGo(){
  const office = String((document.getElementById('hmOf')||{}).value || '').slice(0,60);
  const ids = Object.keys(HMPICK).filter(id => { const p = pieceById(id);
    return p && p.location !== 'assay' && onHand(pieceSubj(id)) > EPS; });
  if(!ids.length) return;
  const ref = nextHmNo();
  const items = [];
  ids.forEach(id => {
    const p = pieceById(id);
    items.push({ id:p.id, code:p.code, name: modelName(p), metal:p.metal,
                 fineness: safeInt(p.fineness,0), netG: round3(num(p.netG)) });
    /* CUSTODY, NOT A MOVEMENT — the whole point of this screen. Three fields change and the
       ledger is not touched. */
    p.hallmark.from = ['tray','safe','workshop'].indexOf(p.location) >= 0 ? p.location : 'tray';
    p.location = 'assay';
    p.locTs = S.today;
    p.hallmark.sentTs = S.today;
    p.hallmark.backTs = 0;
    p.hallmark.office = office;
  });
  S.cfg.hmOffice = office;
  S.hmSends.push({ id: ref, ts: S.today, office: office, items: items });
  HMPICK = {};
  migrate(S); saveState(); closeModal(); renderAll();
  toast(fmt('hm_send_done', { r: ref }));
  openHmList(ref);
}

function hmRow(x, mode){

/* =====================================================================================
   ՎԵՐԱՆՈՐՈԳՈՒՄ — a custody register, not a quoting engine (spec 8)

   A REPAIR IS A CUSTODY PROBLEM, NOT AN INVENTORY PROBLEM: the customer's metal enters and
   leaves the shop WITHOUT EVER BECOMING STOCK. Getting this wrong inflates the jeweller's
   inventory — and, under the margin scheme, his tax position — with metal he does not own.

   So, stated as rules this file obeys and voskiSelfTest() asserts:

   1. NO REPAIR IS EVER A LEDGER SUBJECT. Nothing in this section calls postMove(), nothing here
      writes S.stock, no repair id is ever prefixed `i:` or `b:`, and a repair changes neither
      valuation() nor pieceCount(). The register is a list beside the ledger, not inside it.
   2. IT IS OUT OF EVERY COUNT — but ON the count act, in its own «Հաճախորդի իրեր» block with a
      count and a total weight, so the person signing knows what is physically in the shop that
      is not the shop's. (cnFinish() reads repairsInShop(); the act prints it in no total.)
   3. THERE IS NO QUOTING FORMULA. How repairs are priced in Armenian practice is unverified
      (register item 13), so the price is a free-form number the jeweller types. Building a
      formula on a guess would be exactly the confident nonsense the spec warns against.
   4. A SLIP PRINTS ON INTAKE AND ON RETURN, because a shop holding a stranger's gold and a
      customer handing it over both need the same piece of paper.
   ===================================================================================== */
let RP = null;          /* the intake draft, outside S until it is committed */
let RP_SHEET = null;    /* the repair whose sheet is open */

function nextRepairNo(){
  const y = new Date(safeInt(S.today, Date.now())).getUTCFullYear();
  const re = /^ՎՆ-(\d{4})-(\d+)$/;
  let max = 0;
  (S.repairs||[]).forEach(r => { const m = re.exec(String(r && r.id || '')); if(m && +m[1] === y) max = Math.max(max, +m[2]); });
  return 'ՎՆ-' + y + '-' + ('0000' + (max + 1)).slice(-4);
}
const repairById = id => (S.repairs||[]).find(r => r && r.id === id) || null;
/* the customer's metal that is physically here. `out` has gone home with its owner. */
const repairWeight = () => repairsInShop().reduce((a,r) => round3(a + num(r.grossG)), 0);
/* WHAT THE CUSTOMER STILL OWES — derived from the two numbers on the record, never a running
   counter. Same instinct as debtsFromBooks(). */
const repairDue = r => Math.max(0, safeAmd(r.priceAmd,0) - safeAmd(r.paid,0));
const repairsDue = () => (S.repairs||[]).reduce((a,r) => a + repairDue(r), 0);

/* THE ONE WRITER of the register. It returns the new id, and it posts NOTHING. */
function rpIntake(o){
  const id = nextRepairNo();
  const rec = {
    id: id,
    custName: String(o.custName||'').slice(0,80),
    custPhone: String(o.custPhone||'').slice(0,32),
    inTs: safeInt(o.inTs, S.today),
    dueTs: Math.max(0, safeInt(o.dueTs, 0)),
    outTs: 0,
    descr: String(o.descr||'').slice(0,200),
    metal: METALS.indexOf(o.metal) >= 0 ? o.metal : 'au',
    fineness: safeInt(o.fineness, 0),
    grossG: Math.max(0, round3(num(o.grossG))),
    photoNote: String(o.photoNote||'').slice(0,200),
    priceAmd: safeAmd(o.priceAmd, 0),
    paid: safeAmd(o.paid, 0),
    status: 'in'
  };
  S.repairs.push(rec);
  /* NO postMove, NO S.stock, NO lot, NO piece. If a later change adds one here, rule 1 is gone. */
  saveState();
  return id;
}

/* =====================================================================================
   ՊԱՐՏՔԵՐ — supplier balances (spec 6.1, 7)

   ArmTrade's `debtsFromBooks` pattern, transferred verbatim because the reason it exists is not
   domain-specific: A BALANCE IS DERIVED FROM TWO BOOKS, NEVER HELD AS A RUNNING COUNTER.

   There is no `balance` field anywhere in this product's state. A stored balance is a number that
   can disagree with the rows that produced it — and when it does, nobody can tell which of the
   two is wrong, because the disagreement itself is the only evidence. Recomputing from Σ bills −
   Σ payments on every read means the figure on the screen and the rows under it cannot drift
   apart: if a row is wrong you can see which one, and correcting it corrects the balance.

   Same rule as the ledger one level down (on-hand is the sum of the movements, never a stored
   quantity), and same rule as repairDue() one screen over. Three places, one discipline.

   This is the WHOLESALE side: what the shop owes a supplier it buys finished pieces or metal
   from. Buying from a walk-in is a counter flow that settles on the spot (Գնում) and does not
   appear here. What a repair customer still owes is on the repair record, for the same reason:
   it is a different counterparty and a different book.
   ===================================================================================== */
let DB_SHEET = null;   /* the supplier whose statement is open */
let DBF = null;        /* the bill / payment draft */

const supById = id => (S.sups||[]).find(x => x && x.id === id) || null;
const supName = id => { const s = supById(id); return s && s.name ? s.name : String(id||'—'); };

/* THE WHOLE OF IT. Nothing here reads a stored balance because there is not one to read. */
function debtsFromBooks(){
  const acc = {};
  const touch = id => { if(!acc[id]) acc[id] = { sup:id, billed:0, paid:0, nBills:0, nPays:0 }; return acc[id]; };
  (S.sups||[]).forEach(x => touch(x.id));
  (S.bills||[]).forEach(b => { const a = touch(b.sup); a.billed += safeAmd(b.amd,0); a.nBills++; });
  (S.pays ||[]).forEach(p => { const a = touch(p.sup); a.paid   += safeAmd(p.amd,0); a.nPays++;  });
  return Object.keys(acc).map(k => {
    const a = acc[k];
    /* DERIVED HERE AND NOWHERE ELSE. */
    a.balance = a.billed - a.paid;
    return a;
  }).sort((x,y) => y.balance - x.balance);
}
const debtsTotal = () => debtsFromBooks().reduce((a,x) => a + Math.max(0, x.balance), 0);
/* both books for one supplier, oldest first, with the balance rolled forward FOR DISPLAY ONLY —
   the roll is computed here, in the view, and is never written back to a record. */
function supBooks(id){
  const rows = [];
  (S.bills||[]).forEach(b => { if(b.sup === id) rows.push({ kind:'bill', ts:b.ts, amd:safeAmd(b.amd,0), ref:b.ref, note:b.note }); });
  (S.pays ||[]).forEach(p => { if(p.sup === id) rows.push({ kind:'pay',  ts:p.ts, amd:safeAmd(p.amd,0), ref:p.ref, note:p.note }); });
  rows.sort((a,b) => (a.ts - b.ts) || (a.kind === 'bill' ? -1 : 1));
  let bal = 0;
  rows.forEach(r => { bal += (r.kind === 'bill' ? r.amd : -r.amd); r.bal = bal; });
  return rows;
}

  const row = { id: contentId(DBF.kind === 'bill' ? 'bl' : 'py',
                  [DBF.sup, amd, DBF.ref, S.today].join(KSEP),
                  ((DBF.kind === 'bill' ? S.bills : S.pays)||[]).length),
                sup: DBF.sup, ts: S.today, amd: amd,
                ref: String(DBF.ref||'').slice(0,40), note: String(DBF.note||'').slice(0,200) };
  /* APPEND ONLY, AND NO BALANCE IS UPDATED — because there is no balance to update. */
  if(DBF.kind === 'bill') S.bills.push(row); else S.pays.push(row);
  const sup = DBF.sup;
  DBF = null;
  migrate(S); saveState(); closeModal(); renderAll();
  if(DB_SHEET) openSupplier(sup);
}

/* =====================================================================================
   RENDER + THE RECOVERY NET
   renderAll() is a try/catch around the whole paint. If a screen throws, the shopkeeper gets a
   card that offers him the last known-good state — never a white page, and never a lost shop.
   ===================================================================================== */
let RENDER_FAIL = 0;
function renderAll(){
  try{
    renderAllInner();
    RENDER_FAIL = 0;
    const now = Date.now();
    if(now - LKG_AT > 15000){ LKG_AT = now; try{ localStorage.setItem(K.lkg, JSON.stringify(S)); }catch(e){} }
  }catch(e){
    console.error('ArmVoski: render failed', e);
    RENDER_FAIL++;
    try{ renderRecovery(e); }catch(e2){}
  }
}
function renderAllInner(){
  lang = U.lang;
  document.documentElement.setAttribute('lang', lang);
  document.body.classList.toggle('light', U.theme === 'light');
  document.body.classList.add('single-mobile');
  document.getElementById('top').innerHTML = topBar();
  document.getElementById('app').innerHTML = viewFor(U.tab);
  renderNav();
}
function renderRecovery(err){
  try{ document.getElementById('nav').style.display = 'none'; }catch(e){}
  try{ document.getElementById('modalRoot').innerHTML = ''; }catch(e){}
  document.getElementById('top').innerHTML =
    '<div class="logo"><div class="logomark">Ո</div><div>' + escH(t('app_name')) + '</div></div>';
  document.getElementById('app').innerHTML =
    '<div style="max-width:460px;margin:8vh auto 0;padding:0 18px">'
    + '<div class="card rail rail-bad"><h3>' + escH(t('rec_title')) + '</h3>'
    + '<div class="muted" style="line-height:1.55">' + escH(t('rec_body')) + '</div>'
    + (hasLKG() ? '<button class="btn primary full" style="margin-top:14px" onclick="restoreLKG()">↺ '
        + escH(t('rec_restore')) + '</button>' : '')
    + '<button class="btn ghost full" style="margin-top:9px" onclick="startFresh()">'
      + escH(t('rec_fresh')) + '</button>'
    + '<div class="muted" style="margin-top:12px;font-size:14px">'
      + escH(String(err && err.message || err || '')) + '</div>'
    + '</div></div>';
}
function restoreLKG(){
  let d = null;
  try{ d = JSON.parse(localStorage.getItem(K.lkg) || 'null'); }catch(e){}
  S = d ? adopt(d) : adopt(seedState());     /* migrate() on EVERY adoption path */
  saveState(); RENDER_FAIL = 0; renderAll();
}
function startFresh(){
  S = adopt(seedState());
  try{ localStorage.setItem(K.state, JSON.stringify(S)); localStorage.removeItem(K.lkg); }catch(e){}
  RENDER_FAIL = 0; renderAll();
}

/* the Cyrillic face is behind a unicode-range, so an Armenian-only install never fetches it and
   sw.js deliberately does not precache it. A RUSSIAN user, though, needs it offline from the
   first run — so when the language IS ru the page asks the worker for it by name. One
   hard-coded subset, no path travels from here into the cache. */
function swWantCyrillic(){
  try{
    if(lang !== 'ru' || !navigator.serviceWorker) return;
    navigator.serviceWorker.ready.then(r => {
      if(r && r.active) r.active.postMessage({ type:'shellfont', subset:'cyrillic' });
    }).catch(() => {});
  }catch(e){}
}
function setLang(v){ U.lang = ['hy','en','ru'].indexOf(v) >= 0 ? v : 'hy'; lang = U.lang; saveU();
  swWantCyrillic(); renderAll(); repaintSheet(); }
/* the eleven sheet painters. Each is idempotent and reads its state from a module global, so the
   recorded call redraws exactly what is on screen. */
['openMoreNav','openRate','openPiece','openPool','niRender','slRender','openBuyAct','cnAbandon',
 'cnReweigh','openCountAct','hmStatusSheet','hmSendSheet','hmReturnSheet','openHmList','rpRender',
 'openRepair','openRepairSlip','dbNewSup','dbOpenEntry','openSupplier'].forEach(n => {
  const f = window[n];
  if(typeof f !== 'function') return;
  window[n] = function(){
    const args = [].slice.call(arguments);
    MODAL_RE = function(){ f.apply(null, args); };
    return f.apply(null, args);
  };
});
