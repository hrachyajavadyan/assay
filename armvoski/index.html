.pccomp .search{margin:0;flex:1;min-width:0}
.pccomp .btn{flex:0 0 auto}

/* ================= PRINT =================
   MUST be the last block in the sheet. Declared earlier it lost every property that a later
   same-specificity rule redeclared (.modal, .mbody), which pinned the գույքագրման ակտ to the
   bottom of the sheet on a dark canvas. !important covers the theme rules (body.light .mbody),
   which outrank a bare .mbody selector wherever they sit. */
@media print{
  @page{margin:14mm}
  html,body{background:#fff !important;color:#111 !important}
  body::before,body::after{display:none !important}
  #top,#app,nav,#toast,.noprint,.grabber{display:none !important}
  .modal{position:static !important;inset:auto !important;background:#fff !important;display:block !important;
         align-items:flex-start !important;backdrop-filter:none !important;-webkit-backdrop-filter:none !important;animation:none !important}
  .mbody{background:#fff !important;color:#111 !important;border:none !important;box-shadow:none !important;
         max-height:none !important;height:auto !important;overflow:visible !important;border-radius:0 !important;
         max-width:none !important;width:100% !important;padding:0 !important;backdrop-filter:none !important;
         -webkit-backdrop-filter:none !important;animation:none !important}
  .mbody .muted{color:#555 !important}
  .mbody .big,.mbody .osum{color:#111 !important}
  .tblwrap{max-height:none !important;overflow:visible !important;background:none !important}
  .tbl{table-layout:auto !important}
  .tbl th,.tbl td{width:auto !important;display:table-cell !important;white-space:normal !important}
  .tblsub{display:none !important}
  /* data, not a fold — see the .subkeep note above */
  .subkeep{display:block !important;color:#333 !important;font-size:11px !important}
  /* the dram sign is INSIDE the .num it belongs to, so the td colour rule never reached it and
     it printed 8px light-grey on both documents. On paper every mark is ink. */
  .cur{color:#111 !important;font-size:max(.72em,12px) !important;font-weight:600 !important}
  .doclbl,.mlbl{color:#333 !important;font-size:11px !important;letter-spacing:0 !important;
                text-transform:none !important}
  .tbl{page-break-inside:auto}
  .tbl tr{page-break-inside:avoid}
  .tbl th{color:#555 !important;border-color:#ccc !important}
  .tbl td{border-color:#ddd !important;color:#111 !important}
  .badge{border:1px solid #999 !important;color:#111 !important;background:none !important}
  /* rules and signature lines are drawn with the THEME stroke colour, which is a near-white
     translucent in dark mode and vanishes on paper: force ink for print. */
  .mbody hr,.actrule,.actsep{border-color:#bbb !important}
  .actsignline{border-bottom:1px solid #333 !important}
  /* the act keeps all seven columns on paper — the narrow-screen column hiding is screen-only */
  .acttbl th,.acttbl td{display:table-cell !important}
  .acttbl .actsub{display:none !important}
  .thlong{display:inline !important}
  .thshort{display:none !important}
}

/* ================= ArmVoski additions to the ArmTrade design system =================
   Everything above is ArmTrade's system verbatim, so the two products are siblings: same
   tokens, same components, same 4px rhythm, same 44px tap floor, same accent (--acc:#F0A93B,
   which is already gold). What follows is only what the gold trade needs and the shop system
   does not have a class for. Nothing here introduces a second accent or a size below 14px. */

/* ---------- weight ----------
   WEIGHT IS MONEY. At 51,738 ֏ per gram of 999, 0.01 g is 517 ֏ — more than a cup of coffee —
   so a gram figure gets exactly the treatment a dram figure gets: tabular lining figures, a
   quiet unit mark riding inside the number, never a mid-figure line break. `.g` is `.cur` for
   grams and inherits its 14px floor for the same reason: a unit mark that reads as a smudge is
   the one thing a unit mark may never do. */
.g{
  font-size:max(.7em,14px);font-weight:600;color:var(--muted);
  margin-left:.22em;letter-spacing:0;font-variant-numeric:normal;
}
.badge .g{font-size:1em;font-weight:700;color:inherit;margin-left:.15em}

/* ---------- the breakdown line ----------
   The single best thing in ARMGOLD: the whole formula with the actual numbers substituted, so
   the jeweller can check it against the number in his head. No computed money appears anywhere
   in this product without one. It wraps rather than scrolls — a formula the reader has to drag
   sideways is a formula he will not read — and its operators are dimmer than its operands so
   the shape of the arithmetic survives the wrap. */
.brk{
  margin-top:var(--s2);padding:var(--s2) var(--s3);
  background:var(--surface-2);border:var(--bw) solid var(--sep);border-radius:var(--r-xs);
  font-size:var(--fs-micro);line-height:1.7;color:var(--ink);
  font-variant-numeric:tabular-nums lining-nums;
  overflow-wrap:break-word;
}
/* the operands are atomic. `overflow-wrap:break-word` on the container is what lets a long
   formula wrap at all, and without this it happily split «6,523,251» across two lines — a money
   figure broken mid-figure is not a wrap, it is a misread number. */
.brk b{white-space:nowrap}
/* the metal an operand belongs to. The valuation line adds gold grams and silver grams in one
   sum under a single caption; without naming each metal beside its own rate the line cannot be
   re-done in the reader's head, which is the only job it has. */
.brk .mn{color:var(--dim);font-weight:600;margin-right:.3em;white-space:nowrap}
.brk .op{color:var(--dim);font-weight:600;padding:0 .15em}
.brk .eq{color:var(--dim);font-weight:600;padding:0 .2em}
.brk b{font-weight:700}
.brk .why{
  display:block;margin-top:var(--s1);
  font-size:var(--fs-micro);line-height:var(--lh-micro);color:var(--dim);font-weight:500;
  font-variant-numeric:normal;
}

/* ---------- the rate card ----------
   The 999 rate is the number every other number in the product is derived from, so it is never
   shown without its provenance and its age. A stale rate is stated, not hidden: hiding it would
   leave the jeweller quoting yesterday's gold at today's counter. */
.ratecard{
  background:var(--acc-tint);border:var(--bw-strong) solid var(--acc-line);
  border-radius:var(--r);padding:var(--s4);margin-bottom:var(--s3);
}
.ratecard .rv{
  font-size:var(--fs-display-m);font-weight:var(--fw-display-m);
  line-height:var(--lh-display-m);letter-spacing:var(--ls-display-m);
  color:var(--ink);font-variant-numeric:tabular-nums lining-nums;
}
.ratecard .rprov{
  margin-top:var(--s1);font-size:var(--fs-micro);line-height:var(--lh-micro);
  color:var(--acc-text);font-weight:600;
}
.ratecard .rprov.stale{color:var(--danger);font-weight:700}
.ratecard .rrow{display:flex;gap:var(--s3);flex-wrap:wrap;margin-top:var(--s3)}
.ratecard .rsub{flex:1 1 130px;min-width:0}
.ratecard .rsub .l{
  font-size:var(--fs-caps);font-weight:var(--fw-caps);line-height:var(--lh-caps);
  color:var(--dim);
}
.ratecard .rsub .v{font-size:var(--fs-body-l);font-weight:700;color:var(--ink);
  font-variant-numeric:tabular-nums lining-nums}

/* ---------- fineness chip ----------
   Հարգ is the dimension of the quantity, not a decoration, so it reads as a figure: tabular,
   bold, boxed, never smaller than the label beside it. 583 and 585 sit next to each other in a
   real shop's tray and must be distinguishable at a glance. */
.harg{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:46px;min-height:26px;padding:2px var(--s2);
  border-radius:var(--r-xs);border:var(--bw) solid var(--stroke2);
  background:var(--surface-2);color:var(--ink);
  font-size:var(--fs-label);font-weight:700;line-height:1.2;
  font-variant-numeric:tabular-nums lining-nums;flex:0 0 auto;
}
.harg.au{background:var(--acc-tint);border-color:var(--acc-line);color:var(--acc-text)}
.harg.ag{background:var(--info-tint);border-color:var(--info-line);color:var(--info)}

/* ---------- a fineness group in the tray ----------
   Grams are NEVER summed across finenesses (10 g of 585 and 10 g of 750 are not 20 g of
   anything), so the tray's arithmetic happens inside these groups and the only figure that
   crosses them is pure metal. The group header carries its own subtotal so the reader never has
   to hold one in his head while scrolling. */
.fgrp{margin-bottom:var(--s3)}
.fgrp>.fhead{
  display:block;
  padding:var(--s3);background:var(--surface-2);
  border:var(--bw) solid var(--stroke);border-radius:var(--r) var(--r) 0 0;
}
/* the identity of the group on one line, its weight on the same line's right edge. The two
   figures never run together: the weight is a block, so a wrap puts it on its own line rather
   than butting it against the label. */
.fgrp>.fhead .frow{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
.fgrp>.fhead .frow .w{
  margin-left:auto;font-size:var(--fs-body-l);font-weight:700;color:var(--ink);
  font-variant-numeric:tabular-nums lining-nums;white-space:nowrap;
}
.fgrp>.fhead .brk{margin-top:var(--s2);background:var(--surface);}
.fgrp>.fbody{
  border:var(--bw) solid var(--stroke);border-top:none;border-radius:0 0 var(--r) var(--r);
  background:var(--surface);overflow:hidden;
}

/* a piece row: tap target is the whole row, never an icon inside it */
.prow{
  display:flex;align-items:center;gap:var(--s3);width:100%;
  padding:var(--s3);min-height:56px;
  background:transparent;border:none;border-bottom:var(--bw) solid var(--sep);
  border-radius:0;font-family:var(--font);color:var(--ink);text-align:left;cursor:pointer;
  transition:background var(--dur-1) var(--ease);
}
.prow:last-child{border-bottom:none}
.prow:active{background:var(--surface-2)}
.prow:focus-visible{outline:none;box-shadow:var(--focus)}
.prow .pi{flex:1 1 auto;min-width:0}
/* Wrap to two lines, NOT ellipsis — the same call this file already makes for .sug .nm and for
   the same reason. At 320px «Կախազարդ քարով» clipped to «Կախազարդ քա…» and, worse, «Ջարդոն ·
   Արծաթ» clipped to «Ջարդոն · Արծ…», where the truncated word is the metal name and the metal
   name is the row's whole identity. */
.prow .pnm{font-size:var(--fs-body-l);font-weight:600;line-height:1.3;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow-wrap:break-word}
.prow .psub{font-size:var(--fs-micro);line-height:var(--lh-micro);color:var(--muted);
  margin-top:2px;display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center}
/* A LOCATION IS A PHRASE, NOT A FIGURE. «Հարգորոշման տեսչությունում» is one badge and badges are
   white-space:nowrap by design, so at 320px it ran 92px past the row's info column and was
   clipped — on the sell list, where «the ring is across town» is exactly the thing the row exists
   to say. Inside a row's sub-line a badge may break between words rather than be cut; the same
   call .badgerow already makes, for the same reason. Figures are untouched: only the sub-line's
   badges are affected, and nothing in a sub-line is a number. */
.prow .psub .badge,.cnrow .cnnm .s .badge{white-space:normal;text-align:left}
.prow .psub>span,.cnrow .cnnm .s>span{min-width:0;overflow-wrap:anywhere}
.prow .pw{flex:0 0 auto;text-align:right}
.prow .pw .a{font-size:var(--fs-body-l);font-weight:700;
  font-variant-numeric:tabular-nums lining-nums;white-space:nowrap}
.prow .pw .b{font-size:var(--fs-micro);color:var(--muted);white-space:nowrap;
  font-variant-numeric:tabular-nums lining-nums}

/* the pure-metal total. ONE honest single number for "how much gold is in this shop", and the
   only figure in the product allowed to cross a fineness boundary. */
.puretot{
  background:var(--surface);border:var(--bw-strong) solid var(--acc-line);
  border-radius:var(--r);padding:var(--s4);margin-bottom:var(--s3);
}
.puretot .l{font-size:var(--fs-caps);font-weight:var(--fw-caps);color:var(--dim);
  line-height:var(--lh-caps)}
.puretot .v{font-size:var(--fs-display-m);font-weight:var(--fw-display-m);
  line-height:var(--lh-display-m);letter-spacing:var(--ls-display-m);color:var(--ink);
  font-variant-numeric:tabular-nums lining-nums;margin-top:2px}

/* ArmTrade hides its wordmark below 461px because its demo header carries SEVEN controls and
   a 320px row cannot hold them plus a brand. This product's header carries three, so the brand
   stays down to 361px: without it a phone screen opens on a bare date chip and two icons, which
   reads as chrome that failed to load rather than as a product. Its DESCRIPTOR goes first (a
   clipped subtitle says less than no subtitle), and at 320px the wordmark itself goes rather
   than render as «ԱրմՈ…» — a truncated brand is worse than an absent one. */
@media (max-width:460px){ #top .logo{display:flex} #top .logo small{display:none} }
/* `>div` matched the logomark too — it is itself a div child of .logo — so .logo collapsed to
   0x0 and 320/360 got exactly the bare date chip and two icons the comment above says must not
   happen. 360dp is the most common Android width. Only the WORDMARK goes. */
@media (max-width:360px){ #top .logo>div:not(.logomark){display:none} }

/* A DERIVED FIELD MUST LOOK DERIVED. `disabled` alone renders almost identically to an editable
   input in this design system, so the jeweller reaching for the third weight finds a box that
   simply does not respond — which reads as a broken field, not as an answer the app computed.
   It gets the quiet fill, a dashed edge and a dimmer ink: visibly a readout, not an input.
   Contrast stays above AA because --muted is 5.8:1 on the light fill and 8.8:1 on the dark. */
input:disabled{
  background:var(--surface-2) !important;border-style:dashed !important;
  border-color:var(--stroke2) !important;color:var(--muted) !important;
  cursor:default;opacity:1;
}

/* a definition list inside a sheet: label above, figure below, on the 4px grid */
.dl{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin:var(--s3) 0}
.dl>div{min-width:0}
.dl .l{font-size:var(--fs-caps);font-weight:var(--fw-caps);line-height:var(--lh-caps);
  color:var(--dim)}
.dl .v{font-size:var(--fs-body-l);font-weight:700;color:var(--ink);margin-top:2px;
  font-variant-numeric:tabular-nums lining-nums;overflow-wrap:break-word}
@media (max-width:339px){ .dl{grid-template-columns:1fr} }

/* ---------- Գույքագրում — the count row (spec 5.4) ----------
   A piece is confirmed present or absent with ONE TAP: re-weighing every ring is not what a
   count is. So the row carries its own two 44px targets rather than opening a sheet, and the
   name itself is a third target for the optional re-weigh. Nothing on the row shows the book
   figure — the count is blind until the act. */
.cnrow{display:flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s3);
  border-bottom:var(--bw) solid var(--stroke);min-height:56px}
.cnrow:last-child{border-bottom:none}
.cnrow .cnnm{flex:1 1 auto;min-width:0;text-align:left;background:none;border:none;padding:0;
  font-family:var(--font);color:var(--ink);cursor:pointer;min-height:44px}
.cnrow .cnnm .n{font-size:var(--fs-body-l);font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.cnrow .cnnm .s{font-size:var(--fs-micro);color:var(--muted);margin-top:2px;
  display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cnact{display:flex;gap:6px;flex:0 0 auto}
.cnact button{min-width:48px;min-height:44px;padding:0 var(--s2);border-radius:var(--r-xs);
  border:var(--bw) solid var(--stroke2);background:var(--surface);color:var(--muted);
  font-family:var(--font);font-size:var(--fs-label);font-weight:var(--fw-label);cursor:pointer}
.cnact button:active{transform:scale(.96)}
.cnact button.on.yes{background:var(--success-tint);color:var(--success);
  border-color:var(--success-line);border-width:var(--bw-strong);font-weight:700}
.cnact button.on.no{background:var(--danger-tint);color:var(--danger);
  border-color:var(--danger-line);border-width:var(--bw-strong);font-weight:700}
.cnrow .cnw{flex:0 0 108px;min-width:0}
.cnrow .cnw input{margin:0;min-height:44px;text-align:right}
.cnprog{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s2)}
.cnprog .bar{flex:1 1 auto;height:8px;border-radius:var(--r-pill);background:var(--surface-2);
  overflow:hidden;border:var(--bw) solid var(--stroke)}
.cnprog .bar i{display:block;height:100%;background:var(--acc);border-radius:var(--r-pill)}
.cnprog .n{flex:0 0 auto;font-size:var(--fs-label);font-weight:700;color:var(--ink);
  font-variant-numeric:tabular-nums lining-nums}

/* «this screen is not built yet» — an honest empty state, never a fake one. It names what will
   be here and what to use instead, because a jeweller who taps a tab and gets a blank panel
   assumes the app is broken. */
.stub{
  border:var(--bw) dashed var(--stroke2);border-radius:var(--r);
  padding:var(--s6) var(--s4);text-align:center;background:var(--surface);
}
.stub .se{font-size:30px;line-height:1;margin-bottom:var(--s3)}
.stub h4{margin:0 0 var(--s2);font-size:var(--fs-title);font-weight:var(--fw-title)}
.stub p{margin:0;color:var(--muted);font-size:var(--fs-body);line-height:1.5}

/* ---------- the counter flows: sell and buy-in ----------
   Two screens where a figure is read ACROSS a counter, not down at arm's length, so the price
   and the arithmetic under it get the display size the rate card gets. Nothing here introduces
   a second accent: the one accent-filled button on each screen is the commit. */
.pricebox{
  background:var(--surface);border:var(--bw-strong) solid var(--acc-line);
  border-radius:var(--r);padding:var(--s4);margin:var(--s3) 0;
}
.pricebox .l{font-size:var(--fs-caps);font-weight:var(--fw-caps);line-height:var(--lh-caps);color:var(--dim)}
.pricebox .v{
  font-size:var(--fs-display-m);font-weight:var(--fw-display-m);
  line-height:var(--lh-display-m);letter-spacing:var(--ls-display-m);color:var(--ink);
  font-variant-numeric:tabular-nums lining-nums;margin-top:2px;
}
.pricebox .brk{background:var(--surface-2)}

/* the buy act's own column fold. The seven-column act is ~520px wide and a 390px phone is the
   normal case, so below 560px the four reference columns fold into a sub-line under the row
   number and the four figures the customer is looking at — zuyt, rate, sum — stay on screen.
   PRINT ALWAYS CARRIES ALL EIGHT: the @media print block forces every .acttbl cell back to
   table-cell with !important, which outranks these selectors however specific they are. */
@media screen and (max-width:560px){
  .acttbl.buyact th:nth-child(4),.acttbl.buyact td:nth-child(4),
  .acttbl.buyact th:nth-child(5),.acttbl.buyact td:nth-child(5){display:none}
}

/* ===== LEDGER SKIN ===== */
/* the marks sit in the text: one weight, currentColor, never filled */
.ic{
  width:21px; height:21px; flex:0 0 auto; display:inline-block; vertical-align:-4px;
  fill:none; stroke:currentColor; stroke-width:1.4;
  stroke-linecap:round; stroke-linejoin:round;
}
.tbtn .ic{width:22px; height:22px; vertical-align:0}
.btn .ic{width:19px; height:19px}

/* ═══════════════════════════════════════════════════════════════════════════
   LEDGER — the skin, appended last so it wins on equal specificity.

   The product replaces a paper notebook, so it is built like one: ruled blocks
   instead of cards, ink instead of a palette, and figures that align because a
   ledger's figures align. Two colours carry meaning and nothing else does —
   ink for what is normal and correction red for what is not. Everything here
   is token-level or a single component rule; deleting this block restores the
   previous skin exactly.
   ═══════════════════════════════════════════════════════════════════════════ */

/* ── tokens · dark (ink paper) ───────────────────────────────────────────── */
:root{
  --bg:#14161A;
  --surface:#14161A;          /* no card fill: a block sits on the page */
  --surface-2:#1C1F25;        /* inputs, steppers, quiet fills */
  --surface-3:#252931;
  --ink:#E9E7E2;
  --muted:#9BA1AB;
  --dim:#8A9099;
  --sep:#2A2E35;
  --stroke:#2A2E35;
  --stroke2:#3A3F48;

  --acc:#E0A867;              /* ballpoint blue */
  --acc-ink:#1A1206;
  --acc-tint:#2A2115;
  --acc-line:#4E3D22;
  --acc-text:#E8BA85;
  --gold:var(--acc); --gold2:var(--acc-text);

  /* correction red is the ONLY alert colour. Everything else is ink. */
  --danger:#E4897C;  --danger-tint:#241716; --danger-line:#4A2A26;
  --success:#E9E7E2; --success-tint:#1C1F25; --success-line:#2A2E35;
  --info:#9FC0E8;    --info-tint:#1A2130;   --info-line:#31405A;
  --note:#9BA1AB;    --note-tint:#1C1F25;   --note-line:#2A2E35;
  --rose:var(--danger); --green:var(--success); --cyan:var(--info);
  --violet:var(--note); --blue:var(--info);
  --glass:var(--surface); --glass2:var(--surface-2);

  --r-xs:0; --r-sm:0; --r:0; --r-lg:0;   /* --r-pill stays: a dot is round */

  --sh-0:none; --sh-1:none; --sh-2:none;
  --sh-3:0 -1px 0 var(--stroke);
  --focus:0 0 0 2px var(--bg), 0 0 0 4px var(--acc);

  /* a ledger is written, not shouted: the display weights come down */
  --fw-display-l:600; --fw-display-m:600; --fw-display-s:600;
  --fw-title:600; --fw-body-l:500; --fw-caps:600;
  --ls-caps:1.3px;
}

/* ── tokens · light (paper) ──────────────────────────────────────────────── */
body.light{
  --bg:#FFFEFC;
  --surface:#FFFEFC;
  --surface-2:#F5F3EE;
  --surface-3:#EBE8E1;
  --ink:#161A1F;              /* 16.9:1 on --bg */
  --muted:#5E646E;            /* 6.4:1 */
  --dim:#666C76;              /* 5.9:1 */
  --sep:#DFDBD2;
  --stroke:#DFDBD2;
  --stroke2:#C6C1B6;

  --acc:#8A4B0F;              /* white on it: 10.4:1 */
  --acc-ink:#FFFEFC;
  --acc-tint:#F7F1E8;
  --acc-line:#DCC7A8;
  --acc-text:#8A4B0F;
  --gold:var(--acc); --gold2:var(--acc-text);

  --danger:#9B2C1E;  --danger-tint:#FAF0EE; --danger-line:#E4C6C0;
  --success:#161A1F; --success-tint:#F5F3EE; --success-line:#DFDBD2;
  --info:#1E3A5F;    --info-tint:#EFF2F6;   --info-line:#C3CDDA;
  --note:#5E646E;    --note-tint:#F5F3EE;   --note-line:#DFDBD2;
  --rose:var(--danger); --green:var(--success); --cyan:var(--info);
  --violet:var(--note); --blue:var(--info);
  --glass:var(--surface); --glass2:var(--surface-2);

  --sh-0:none; --sh-1:none; --sh-2:none;
  --sh-3:0 -1px 0 var(--stroke);
  --focus:0 0 0 2px var(--bg), 0 0 0 4px var(--acc);
  background:var(--bg);
}

/* ── the figures line up ─────────────────────────────────────────────────── */
body{font-variant-numeric:tabular-nums lining-nums}

/* ── a card is a ruled block, not a box ──────────────────────────────────── */
.card{
  background:none; border:0; border-radius:0; box-shadow:none;
  border-bottom:var(--bw) solid var(--sep);
  padding:var(--s5) 0;
}
.card:last-child{border-bottom:0}
/* inside a sheet the page already has its own rules; a nested card would draw twice */
.mbody .card{border-bottom:var(--bw) solid var(--sep); padding:var(--s4) 0}

/* ── one filled button per screen; everything else is a written link ─────── */
.btn{border-radius:0}
.btn.primary,.btn.full.cyan,.btn.full.green,.btn.full.violet{
  background:var(--ink); color:var(--bg); border-color:var(--ink);
  font-weight:600; letter-spacing:0;
}
.btn.ghost.full{display:flex; width:100%}
.btn.ghost,.btn.ghost.full{
  background:none; border:0; border-radius:0;
  color:var(--acc-text); font-weight:600;
  min-height:44px; padding:0; width:auto; max-width:100%;
  display:inline-flex; justify-content:flex-start; text-align:left;
  box-shadow:none;
}
.btn.ghost>*{text-align:left}
/* the underline follows the text, not the box: pinned to the bottom of a wrapped
   two-line label it struck through the second line instead of underlining both. */
.btn.ghost{text-decoration:underline; text-decoration-thickness:1.5px; text-underline-offset:5px}
.btn.ghost::after{display:none}
.btn.ghost:active{background:none; transform:none; opacity:.6}
.btn.small{border-radius:0}

/* ── a badge is a written note, not a pill ──────────────────────────────── */
.badge{
  background:none !important; border:0 !important; border-radius:0 !important;
  padding:0 !important; font-weight:600; color:var(--muted);
}
.badge.b-rose,.badge.b-danger{color:var(--danger)}
.badge.b-gold,.badge.b-acc{color:var(--acc-text)}
.badge.b-green,.badge.b-cyan,.badge.b-violet,.badge.b-neutral{color:var(--muted)}

/* ── section labels are ledger column headings ──────────────────────────── */
.sec{
  font-size:var(--fs-label); font-weight:600; letter-spacing:var(--ls-caps);
  text-transform:uppercase; color:var(--muted);
  margin:var(--s6) 0 var(--s2);
}

/* ── a notice is an indented remark ─────────────────────────────────────── */
.notice{border-left-width:2px; border-left-color:var(--stroke2)}
.notice.bad{border-left-color:var(--danger)}

/* ── chrome ──────────────────────────────────────────────────────────────── */
#top{background:var(--bg); border-bottom:var(--bw) solid var(--ink); box-shadow:none}
.tbtn{border-radius:0; background:none; border:0; color:var(--ink)}
.tbtn.on{color:var(--acc-text)}
#nav,nav{background:var(--bg); border-top:var(--bw) solid var(--ink); box-shadow:none}
#nav button,nav button{border-radius:0; font-weight:500; color:var(--muted)}
#nav button.active,nav button.active{
  color:var(--ink); font-weight:600;
  background:none; border-radius:0; box-shadow:none;
}
#nav button.active::before,nav button.active::before{background:var(--acc); height:2px}
#nav .icw,nav .icw{display:none}             /* the label is the destination */
#nav button>span:last-child,nav button>span:last-child{font-size:var(--fs-nav)}
/* the count reads as a superscript ON the word, not as a number floating above the
   cell next door — which is what right-aligning it over a column flex produced. */
#nav button,nav button{flex-direction:row; align-items:baseline; justify-content:center; gap:0}
.navbadge{
  position:static; background:none; color:var(--danger); border:0; box-shadow:none;
  border-radius:0; padding:0 0 0 2px; min-width:0; width:auto; height:auto;
  font-size:var(--fs-label); font-weight:700; line-height:1;
  align-self:flex-start; margin-top:2px;
  order:2;             /* ArmTrade prints the badge before the label, ArmEstate after */
}
body:not(.light) .navbadge{color:var(--danger)}

/* ── an alert is an indented remark with a rule, not a boxed card ───────── */
.alert{
  background:none; border:0; border-radius:0; box-shadow:none;
  border-left:2px solid var(--stroke2);
  padding:var(--s2) 0 var(--s2) var(--s3);
}
.alert.bad{border-left-color:var(--danger)}

/* ── sheets ──────────────────────────────────────────────────────────────── */
.mbody{border-radius:0; border-top:var(--bw-strong) solid var(--ink)}
.grabber{background:var(--stroke2); border-radius:0; height:2px}

/* ── the item mark is its initial, in a ruled square ────────────────────── */
.pav,.mrico{
  border-radius:0; background:none;
  border:var(--bw) solid var(--stroke);
  font-size:var(--fs-body-l); font-weight:600; color:var(--muted);
}

/* ── controls ────────────────────────────────────────────────────────────── */
.search,input,select,textarea{border-radius:0}
.qtyctl,.stepper{border-radius:0}
.qtyctl button{border-radius:0}
.chip,.chips button{border-radius:0}
.roleswitch,.roleswitch button,.seg,.seg button{border-radius:0}
.morerow{border-radius:0}
.bar,.track,.meter,.hbar .track{border-radius:0}
.fill,.bar i,.track .fill{border-radius:0}

/* ── the rails go ────────────────────────────────────────────────────────── */
.card[style*="border-left"],.rail,.railcard{border-left:0 !important}

/* ── the last round shapes ───────────────────────────────────────────────── */
.chips button,.tblwrap::-webkit-scrollbar-thumb,.hbar .track,.hbar .fill,
.oline,.fab,.grabber{border-radius:0}
.onode,.tbtn .okdot,.dot{border-radius:var(--r-pill)}   /* a dot stays a dot */
button.pav{position:relative}
button.pav .pavdots{display:none}                        /* the box is the affordance */
.chips button.active,.chips button[aria-pressed="true"]{

   pack count, priced off a daily 999 rate, with the acquisition cost of every gram carried
   as a tax record rather than a convenience.

   THIS FILE IS THE FOUNDATION, not the finished product. What is here is the shell, the item
   model, the ledger, pricing with its mandatory breakdown line, the tray, and seed data a
   jeweller would recognise. Sell, buy-in, receipt, count, hallmarking, repairs, debts and sync
   are named honestly as not-yet-built (see stubView()) rather than faked.

   THREE INVARIANTS, stated here because everything below depends on them:

   1. WEIGHT IS DECIMAL. Grams store to three decimal places and NOTHING rounds a weight with an
      integer function. `safeInt` exists in this file and may never touch a gram. Float equality
      on a weight is done with eqG(), never with ===.
   2. THE LEDGER IS THE TRUTH. S.moves is append-only; postMove() is the only writer of the
      S.stock cache; on-hand is the sum of the movements and is finite. rebuildStock() re-derives
      the cache from the log and verifyLedger() asserts the two agree, both at boot.
   3. CUSTODY IS NOT A MOVEMENT. A ring at the assay office or on a workshop bench is still the
      shop's stock and still on-hand. Sending it out sets `location`. Posting a movement for it
      would make a hallmark send-out read as a sale.
   ===================================================================================== */

const DOMAIN = { id:'armvoski', name:'ArmVoski' };

   ArmTrade uses its own. A key collision would corrupt a real user's data, so every key this
   product touches is listed here and every one begins `voski_`. Nothing in this file reads or
   writes a key that is not in this object. */
const K = {
  state:'voski_state', ui:'voski_ui', rooms:'voski_rooms', lkg:'voski_lkg',
  lang:'voski_lang', theme:'voski_theme', auth:'voski_auth'
};

/* ---------- the legal fineness lists ----------

   post-Soviet one; BOTH are legal and an old ring IS 583 and its owner knows it, so 583 is a
   distinct value here and is never silently normalised to 585. Platinum (900/950) and palladium
   (500/850) are legal too but out of scope for v1 — the field is a dimension, not an assumption,
   so adding them later is a line in this object. */

   for gold, the rarest fineness in the trade, and a jeweller who taps a metal chip by accident
   must not end up quoting it. 585 and 925 are the ordinary standards. */
const FIN_DEFAULT = { au:585, ag:925 };

function finSwitch(mem, from, to, cur){
  mem[from] = safeInt(cur, 0);
  const want = safeInt(mem[to], 0);
  return FINENESS[to].indexOf(want) >= 0 ? want : FIN_DEFAULT[to];
}

let lang = 'hy';
/* the lookup falls back hy -> en rather than returning the raw key: a missing key must degrade to
   a real word in a language the reader may still know, never to `tray_pure_lbl` on the screen. */
const t = k => { const v = T[lang][k]; return v!=null ? v : (T.hy[k]!=null ? T.hy[k] : (T.en[k]!=null ? T.en[k] : '')); };
/* PLURALS. Every {n}-bearing string used to be one hard-coded form, so English read
   «1 items with no documented acquisition cost» and Russian «1 изделий …» — on the home screen,
   the first thing a non-Armenian user sees. Armenian has no count inflection here, so the defect
   was invisible in the language the build is reviewed in. A T value may now carry its forms
   separated by «|» and fmt picks by the active language's own rule: Armenian one form, English
   two (1 / other), Russian three (1 / 2–4 / 5+, with 11–14 taking the many form). A key with no
   «|» is unaffected, which is every other string in the table. */
const PLURAL = {
  hy: () => 0,
  en: n => (Math.abs(n) === 1 ? 0 : 1),
  ru: n => { const a = Math.abs(Math.round(n)) % 100, b = a % 10;
             if(a >= 11 && a <= 14) return 2;
             if(b === 1) return 0;
             if(b >= 2 && b <= 4) return 1;
             return 2; }
};
const fmt = (k, vals) => {
  let str = String(t(k));
  if(str.indexOf('|') >= 0){
    const forms = str.split('|');
    const n = (vals && vals.n != null) ? num(vals.n) : 0;
    const i = (PLURAL[lang] || PLURAL.hy)(n);
    str = forms[Math.min(Math.max(0,i), forms.length - 1)];
  }
  return str.replace(/\{(\w+)\}/g, (_,x)=> (vals && vals[x]!=null) ? vals[x] : '');
};
/* the movement label reads straight out of the table, exactly as ArmTrade's moveLabel() does */
const moveLabel = type => T[lang]['mv_'+type] ? t('mv_'+type) : String(type||'');
const catLabel = c => T[lang]['cat_'+c] ? t('cat_'+c) : String(c||'');
const locLabel = l => T[lang]['loc_'+l] ? t('loc_'+l) : String(l||'');
const metalLabel = m => t(m==='ag' ? 'w_ag' : 'w_au');
const hmLabel = o => T[lang]['hm_'+o] ? t('hm_'+o) : t('hm_none');
const docLabel = d => T[lang]['doc_'+d] ? t('doc_'+d) : t('doc_none');

/* =====================================================================================
   THE ITEM MODEL (spec 1)
   Three record types, and only one of them ever appears in the ledger.

   MODEL (Մոդել) — a catalogue row. Category, metal, fineness, style name and code, default
     making charge. A MODEL HAS NO QUANTITY. It is a template for creating pieces and a grouping
     for the catalogue. It is ArmTrade's PRODUCTS row with the quantity semantics removed.
   PIECE (Իր) — one physical finished object, the unit the customer buys and the unit the tax is
     computed on. Enters the ledger at +netG and leaves at -netG, so its on-hand is either its
     net weight or zero and THE PIECE COUNT IS A PROJECTION, NOT A SECOND LEDGER.
   BULK POOL (Կուտակ) — metal with no piece identity: scrap, findings, castings, offcuts. It has
     no weight field of its own. ITS WEIGHT IS WHAT THE LEDGER SAYS IT IS.
   ===================================================================================== */

/* the ledger's subject keys. `i:` a piece, `b:` a bulk pool of one metal at one fineness. */
const pieceSubj = id => 'i:' + id;
const poolSubj = (metal, fineness) => 'b:' + metal + ':' + safeInt(fineness,0);
const isPieceSubj = s => String(s||'').slice(0,2) === 'i:';
const isPoolSubj  = s => String(s||'').slice(0,2) === 'b:';
const subjPieceId = s => String(s||'').slice(2);
function subjPool(s){
  const p = String(s||'').split(':');
  return { metal: p[1]||'au', fineness: safeInt(p[2],0) };
}

/* ---- gross / stone / net (spec 1.5) ----
   The jeweller types TWO of the three and the third is derived and LOCKED. `weighedAs` records
   which of the two came off the scale, because a later dispute turns on exactly that — the same
   instinct as ArmTrade's velSource: never hold a number without being able to say where it came
   from. Metal value computes on NET, because charging the stone's mass at the gold rate while
   also charging stonesAmd bills the customer twice for the same stone, and the customer can
   check it: the state metrology body weighs items free of charge precisely because weight
   misstatement is a live consumer complaint. */
function deriveWeights(w){
  const gross = round3(num(w.grossG)), stone = round3(Math.max(0, num(w.stoneG)));
  const net = round3(num(w.netG));
  if(w.weighedAs === 'net') return { weighedAs:'net', stoneG:stone, netG:net, grossG:round3(net + stone) };
  return { weighedAs:'gross', stoneG:stone, grossG:gross, netG:round3(gross - stone) };
}
/* constraints, stated once: gross >= stone >= 0 and net > 0. A piece that fails these is not a
   piece the ledger can carry, so it is refused at the edge rather than stored and worked around. */
function weightsValid(p){
  return isFinite(p.grossG) && isFinite(p.stoneG) && isFinite(p.netG) &&
         p.stoneG >= -EPS && p.grossG >= p.stoneG - EPS && p.netG > EPS;
}
const pureG = (netG, fineness) => round3(num(netG) * safeInt(fineness,0) / 1000);

/* ---- the hallmark exemption the app knows and the jeweller would otherwise have to remember ----
   Cheap expertise: a 1.2 g gold earring needs no stamp and the app says so and says why, rather
   than showing a red flag for a legitimate item. `origin` is an ENUM, not a boolean, because an
   unstamped item is legitimate in six different ways. */
function suggestHallmark(p){
  if(p.cat === 'scrap') return 'exempt_scrap';
  const lim = HM_EXEMPT_G[p.metal] || HM_EXEMPT_G.au;
  if(num(p.netG) < lim) return 'exempt_weight';
  return 'none';
}
