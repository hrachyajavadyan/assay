   which is already gold). What follows is only what the gold trade needs and the shop system
   does not have a class for. Nothing here introduces a second accent or a size below 14px. */

/* ---------- weight ----------
   WEIGHT IS MONEY. At 51,738 ֏ per gram of 999, 0.01 g is 517 ֏ — more than a cup of coffee —
   so a gram figure gets exactly the treatment a dram figure gets: tabular lining figures, a
   quiet unit mark riding inside the number, never a mid-figure line break. `.g` is `.cur` for
   grams and inherits its 14px floor for the same reason: a unit mark that reads as a smudge is
   the one thing a unit mark may never do. */
.g{
  font-size:max(.7em,14px);font-weight:600;color:var(--muted);
  margin-left:.22em;letter-spacing:0;font-variant-numeric:normal;
}
.badge .g{font-size:1em;font-weight:700;color:inherit;margin-left:.15em}

/* ---------- the breakdown line ----------
   The single best thing in ARMGOLD: the whole formula with the actual numbers substituted, so
   the jeweller can check it against the number in his head. No computed money appears anywhere
   in this product without one. It wraps rather than scrolls — a formula the reader has to drag
   sideways is a formula he will not read — and its operators are dimmer than its operands so
   the shape of the arithmetic survives the wrap. */
.brk{
  margin-top:var(--s2);padding:var(--s2) var(--s3);
  background:var(--surface-2);border:var(--bw) solid var(--sep);border-radius:var(--r-xs);
  font-size:var(--fs-micro);line-height:1.7;color:var(--ink);
  font-variant-numeric:tabular-nums lining-nums;
  overflow-wrap:break-word;
}
/* the operands are atomic. `overflow-wrap:break-word` on the container is what lets a long
   formula wrap at all, and without this it happily split «6,523,251» across two lines — a money
   figure broken mid-figure is not a wrap, it is a misread number. */
.brk b{white-space:nowrap}
/* the metal an operand belongs to. The valuation line adds gold grams and silver grams in one
   sum under a single caption; without naming each metal beside its own rate the line cannot be
   re-done in the reader's head, which is the only job it has. */
.brk .mn{color:var(--dim);font-weight:600;margin-right:.3em;white-space:nowrap}
.brk .op{color:var(--dim);font-weight:600;padding:0 .15em}
.brk .eq{color:var(--dim);font-weight:600;padding:0 .2em}
.brk b{font-weight:700}
.brk .why{
  display:block;margin-top:var(--s1);
  font-size:var(--fs-micro);line-height:var(--lh-micro);color:var(--dim);font-weight:500;
  font-variant-numeric:normal;
}

/* ---------- the rate card ----------
   The 999 rate is the number every other number in the product is derived from, so it is never
   shown without its provenance and its age. A stale rate is stated, not hidden: hiding it would
   leave the jeweller quoting yesterday's gold at today's counter. */
.ratecard{
  background:var(--acc-tint);border:var(--bw-strong) solid var(--acc-line);
  border-radius:var(--r);padding:var(--s4);margin-bottom:var(--s3);
}
.ratecard .rv{
  font-size:var(--fs-display-m);font-weight:var(--fw-display-m);
  line-height:var(--lh-display-m);letter-spacing:var(--ls-display-m);
  color:var(--ink);font-variant-numeric:tabular-nums lining-nums;
}
.ratecard .rprov{
  margin-top:var(--s1);font-size:var(--fs-micro);line-height:var(--lh-micro);
  color:var(--acc-text);font-weight:600;
}
.ratecard .rprov.stale{color:var(--danger);font-weight:700}
.ratecard .rrow{display:flex;gap:var(--s3);flex-wrap:wrap;margin-top:var(--s3)}
.ratecard .rsub{flex:1 1 130px;min-width:0}
.ratecard .rsub .l{
  font-size:var(--fs-caps);font-weight:var(--fw-caps);line-height:var(--lh-caps);
  color:var(--dim);
}
.ratecard .rsub .v{font-size:var(--fs-body-l);font-weight:700;color:var(--ink);
  font-variant-numeric:tabular-nums lining-nums}

/* ---------- fineness chip ----------
   Հարգ is the dimension of the quantity, not a decoration, so it reads as a figure: tabular,
   bold, boxed, never smaller than the label beside it. 583 and 585 sit next to each other in a
   real shop's tray and must be distinguishable at a glance. */
.harg{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:46px;min-height:26px;padding:2px var(--s2);
  border-radius:var(--r-xs);border:var(--bw) solid var(--stroke2);
  background:var(--surface-2);color:var(--ink);
  font-size:var(--fs-label);font-weight:700;line-height:1.2;
  font-variant-numeric:tabular-nums lining-nums;flex:0 0 auto;
}
.harg.au{background:var(--acc-tint);border-color:var(--acc-line);color:var(--acc-text)}
.harg.ag{background:var(--info-tint);border-color:var(--info-line);color:var(--info)}

/* ---------- a fineness group in the tray ----------
   Grams are NEVER summed across finenesses (10 g of 585 and 10 g of 750 are not 20 g of
   anything), so the tray's arithmetic happens inside these groups and the only figure that
   crosses them is pure metal. The group header carries its own subtotal so the reader never has
   to hold one in his head while scrolling. */
.fgrp{margin-bottom:var(--s3)}
.fgrp>.fhead{
  display:block;
  padding:var(--s3);background:var(--surface-2);
  border:var(--bw) solid var(--stroke);border-radius:var(--r) var(--r) 0 0;
}
/* the identity of the group on one line, its weight on the same line's right edge. The two
   figures never run together: the weight is a block, so a wrap puts it on its own line rather
   than butting it against the label. */
.fgrp>.fhead .frow{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
.fgrp>.fhead .frow .w{
  margin-left:auto;font-size:var(--fs-body-l);font-weight:700;color:var(--ink);
  font-variant-numeric:tabular-nums lining-nums;white-space:nowrap;
}
.fgrp>.fhead .brk{margin-top:var(--s2);background:var(--surface);}
.fgrp>.fbody{
  border:var(--bw) solid var(--stroke);border-top:none;border-radius:0 0 var(--r) var(--r);
  background:var(--surface);overflow:hidden;
}

/* a piece row: tap target is the whole row, never an icon inside it */
.prow{
  display:flex;align-items:center;gap:var(--s3);width:100%;
  padding:var(--s3);min-height:56px;

   the same reason. At 320px «Կախազարդ քարով» clipped to «Կախազարդ քա…» and, worse, «Ջարդոն ·
   Արծաթ» clipped to «Ջարդոն · Արծ…», where the truncated word is the metal name and the metal
   name is the row's whole identity. */

  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;

  margin-top:2px;display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center}
.prow .pw{flex:0 0 auto;text-align:right}
.prow .pw .a{font-size:var(--fs-body-l);font-weight:700;
  font-variant-numeric:tabular-nums lining-nums;white-space:nowrap}
.prow .pw .b{font-size:var(--fs-micro);color:var(--muted);white-space:nowrap;
  font-variant-numeric:tabular-nums lining-nums}

   only figure in the product allowed to cross a fineness boundary. */
.puretot{
  background:var(--surface);border:var(--bw-strong) solid var(--acc-line);
  border-radius:var(--r);padding:var(--s4);margin-bottom:var(--s3);
}
.puretot .l{font-size:var(--fs-caps);font-weight:var(--fw-caps);color:var(--dim);
  line-height:var(--lh-caps)}
.puretot .v{font-size:var(--fs-display-m);font-weight:var(--fw-display-m);
  line-height:var(--lh-display-m);letter-spacing:var(--ls-display-m);color:var(--ink);
  font-variant-numeric:tabular-nums lining-nums;margin-top:2px}

/* ArmTrade hides its wordmark below 461px because its demo header carries SEVEN controls and
   a 320px row cannot hold them plus a brand. This product's header carries three, so the brand
   stays down to 361px: without it a phone screen opens on a bare date chip and two icons, which
   reads as chrome that failed to load rather than as a product. Its DESCRIPTOR goes first (a
   clipped subtitle says less than no subtitle), and at 320px the wordmark itself goes rather
   than render as «ԱրմՈ…» — a truncated brand is worse than an absent one. */
@media (max-width:460px){ #top .logo{display:flex} #top .logo small{display:none} }
/* `>div` matched the logomark too — it is itself a div child of .logo — so .logo collapsed to
   0x0 and 320/360 got exactly the bare date chip and two icons the comment above says must not
   happen. 360dp is the most common Android width. Only the WORDMARK goes. */
@media (max-width:360px){ #top .logo>div:not(.logomark){display:none} }

/* A DERIVED FIELD MUST LOOK DERIVED. `disabled` alone renders almost identically to an editable
   input in this design system, so the jeweller reaching for the third weight finds a box that
   simply does not respond — which reads as a broken field, not as an answer the app computed.
   It gets the quiet fill, a dashed edge and a dimmer ink: visibly a readout, not an input.
   Contrast stays above AA because --muted is 5.8:1 on the light fill and 8.8:1 on the dark. */
input:disabled{
  background:var(--surface-2) !important;border-style:dashed !important;
  border-color:var(--stroke2) !important;color:var(--muted) !important;
  cursor:default;opacity:1;
}

/* a definition list inside a sheet: label above, figure below, on the 4px grid */

@media (max-width:339px){ .dl{grid-template-columns:1fr} }

/* «this screen is not built yet» — an honest empty state, never a fake one. It names what will
   be here and what to use instead, because a jeweller who taps a tab and gets a blank panel
   assumes the app is broken. */
.stub{
  border:var(--bw) dashed var(--stroke2);border-radius:var(--r);
  padding:var(--s6) var(--s4);text-align:center;background:var(--surface);
}
.stub .se{font-size:30px;line-height:1;margin-bottom:var(--s3)}
.stub h4{margin:0 0 var(--s2);font-size:var(--fs-title);font-weight:var(--fw-title)}
.stub p{margin:0;color:var(--muted);font-size:var(--fs-body);line-height:1.5}

<script>
/* =====================================================================================
   ԱրմՈսկի / ArmVoski — a jeweller's trade product for the Armenian market.
   The ArmTrade engine reconfigured for gold: stock held by weight and purity instead of
   pack count, priced off a daily 999 rate, with the acquisition cost of every gram carried
   as a tax record rather than a convenience.

   THIS FILE IS THE FOUNDATION, not the finished product. What is here is the shell, the item
   model, the ledger, pricing with its mandatory breakdown line, the tray, and seed data a
   jeweller would recognise. Sell, buy-in, receipt, count, hallmarking, repairs, debts and sync
   are named honestly as not-yet-built (see stubView()) rather than faked.

   THREE INVARIANTS, stated here because everything below depends on them:

   1. WEIGHT IS DECIMAL. Grams store to three decimal places and NOTHING rounds a weight with an
      integer function. `safeInt` exists in this file and may never touch a gram. Float equality
      on a weight is done with eqG(), never with ===.
   2. THE LEDGER IS THE TRUTH. S.moves is append-only; postMove() is the only writer of the
      S.stock cache; on-hand is the sum of the movements and is finite. rebuildStock() re-derives
      the cache from the log and verifyLedger() asserts the two agree, both at boot.
   3. CUSTODY IS NOT A MOVEMENT. A ring at the assay office or on a workshop bench is still the
      shop's stock and still on-hand. Sending it out sets `location`. Posting a movement for it
      would make a hallmark send-out read as a sale.
   ===================================================================================== */

const DOMAIN = { id:'armvoski', name:'ArmVoski' };

/* ---------- storage namespace ----------
   ARMGOLD is LIVE at /armgold/ on this same origin and uses `assay_lang` and `assay_cfg`.
   ArmTrade uses its own. A key collision would corrupt a real user's data, so every key this
   product touches is listed here and every one begins `voski_`. Nothing in this file reads or
   writes a key that is not in this object. */
const K = {
  state:'voski_state', ui:'voski_ui', rooms:'voski_rooms', lkg:'voski_lkg',
  lang:'voski_lang', theme:'voski_theme', auth:'voski_auth'
};

/* ---------- the legal fineness lists ----------
   RA Law on Precious Metals, Art. 16 and Appendix. 583 is the Soviet standard and 585 the
   post-Soviet one; BOTH are legal and an old ring IS 583 and its owner knows it, so 583 is a
   distinct value here and is never silently normalised to 585. Platinum (900/950) and palladium
   (500/850) are legal too but out of scope for v1 — the field is a dimension, not an assumption,
   so adding them later is a line in this object. */
const FINENESS = { au:[375,416,500,583,585,750,916,958,999], ag:[800,830,875,925,960,999] };
const METALS = ['au','ag'];

/* the exemption thresholds (research §3.3): gold under 1.5 g, silver under 3 g, need no stamp */
const HM_EXEMPT_G = { au:1.5, ag:3 };

/* ARMGOLD's shipped category list, practitioner-chosen, reused whole. «Խաչ» as its own category
   rather than a kind of pendant is a specifically Armenian choice and is the best evidence the
   list came from the trade. `scrap` and `other` are added for the bulk and one-off cases. */
const CATS = ['ring','chain','bracelet','earring','pendant','cross','watch','scrap','other'];

/* 1 July 2026 — the day the VAT base for gold became a margin and input VAT stopped being
   deductible. Stock either side of it is taxed differently, jewellery turns slowly, and the two
   treatments will coexist in one cabinet for years. */
const JUL26 = Date.UTC(2026,6,1);
const DAY = 86400000;

/* ceilings. One movement may not exceed 99,999 g (99.999 kg of gold is not a shop) and no unit
   figure may exceed 9,999,999 dram — the same discipline ArmTrade applies for the same reason:
   no path may mint a figure the layout cannot hold. */
const MOVE_G_MAX = 99999;
const MAX_AMD = 9999999;

/* ================= numeric edge ================= */
/* safeInt is for COUNTS, IDS AND SETTINGS. It may never be applied to a gram — that is the
   ArmTrade migrate() defect (line 3349) that this product exists downstream of, and applying it
   to a weight loses 0.35 g of a 12.35 g pool on every load and every state adopted from a room. */
const safeInt = (v,d) => { const n = Math.round(+v); return isFinite(n) ? n : (d||0); };
/* round3 is the ONLY rounding a weight ever gets, and it is applied at the edge — when a number
   enters the ledger — not to the running total. Number.EPSILON nudges the half-way cases that
   binary floating point puts a hair below .0005. */
const round3 = v => { const n = +v; if(!isFinite(n)) return 0;
  return Math.round((n + (n<0?-1:1)*Number.EPSILON) * 1000) / 1000; };
/* float equality for grams. NEVER ===. Accumulated error over a thousand gram movements makes an
   exact comparison spuriously unequal, and an app that "heals" a ledger in a loop is worse than
   one that never checked. 1e-6 g is a microgram: a thousandth of the smallest weight this
   product stores, and far below any scale a shop owns. */
const EPS = 1e-6;
const eqG = (a,b) => Math.abs((+a||0) - (+b||0)) < EPS;
const clampG = v => Math.max(-MOVE_G_MAX, Math.min(MOVE_G_MAX, round3(v)));
const safeAmd = (v,d) => Math.max(0, Math.min(MAX_AMD, safeInt(v, d||0)));
const num = v => { const n = +v; return isFinite(n) ? n : 0; };

/* ================= html ================= */
/* every user-authored string that reaches a template goes through this. Piece codes, notes,
   shop names, document references — all of them are typed by a person. */
const escH = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* an id or a string going into an inline handler crosses TWO parsers: the HTML attribute parser
   decodes the entity references, and the JS parser then reads what is left. JSON.stringify() is
   the wrong tool for that — it emits DOUBLE quotes, which close the attribute itself, so
   `onclick="setTab("tray")"` parsed as `onclick="setTab("` and EVERY TAP IN THE PRODUCT was a
   syntax error. (Nothing caught it for a while because the tests drove the app through
   page.evaluate, which never goes near the attribute. A real tap is the only thing that finds
   this.) So: build the JS string literal first, then HTML-escape the whole literal. escH turns
   `'` into &#39;, which the HTML parser hands back to JS as a plain quote. */
function jsArg(v){
  const lit = "'" + String(v==null?'':v)
    .replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\r?\n/g,'\\n') + "'";
  return escH(lit);
}

   against the amount and never against whatever container the pair landed in. */
const amd = n => '<span class="num">' + safeInt(n,0).toLocaleString('en-US') + '<span class="cur">֏</span></span>';
/* grams: the same treatment money gets, because at 51,738 per gram weight IS money. Stored to
   3dp, displayed to the shop's setting (2 by default) — the display never changes the
   arithmetic, only what is shown, and the setting exists because a shop working in 0.001 g is
   real. */
function gramTxt(v, dp){
  const d = dp==null ? ((typeof S!=='undefined' && S && S.cfg) ? safeInt(S.cfg.gramDp,2) : 2) : dp;
  return round3(v).toFixed(Math.max(0,Math.min(3,d)));
}

const pctTxt = n => (Math.round(num(n)*10)/10).toLocaleString('en-US');

/* ================= content-addressed ids =================
   An id is derived from what the row IS, so two devices that recorded the same movement agree on
   its id and a replay of the same movement is a no-op rather than a duplicate. The ordinal is the
   count of movements already in the log carrying the same identity, so two genuinely distinct but
   identical-looking adjustments on the same day stay two rows. Derived from the log itself — no
   device-local counter to desynchronise. */
const KSEP = String.fromCharCode(31);
function h32(s, seed){
  let h = (seed>>>0) || 2166136261;
  for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;

function contentId(prefix, key, ord){
  const o = ord||0;
  return prefix + b36(h32(key,0)) + b36(h32(key+KSEP+o, 0x9e3779b1)) + (o ? 'x'+o.toString(36) : '');
}

   on. `rts` (when did THIS phone write it) and `n` (a per-device counter) are deliberately out. */
function moveKey(m){
  return [m.subject, m.type, round3(m.dq), m.ts, m.ref||'', m.reason||'', m.actor||'', m.note||'', m.lot||''].join(KSEP);
}

   Armenian is primary — it is written first, it is the default, and the other two are
   translations OF it, not the other way round. Full parity: every key exists in all three, and

   specification 6.3, which sources them to the RA Law on Precious Metals, to Armenian

   flag as unverified are marked here too, in the code, so that nobody later mistakes them for
   settled vocabulary:
     - «Իր» for a finished piece            (spec 6.3, flagged)
     - «Աշխատանք» for the making charge     (spec 6.3, flagged — this is ARMGOLD's own shipped
                                             word and the OWNER HAS SETTLED IT; kept)
     - «Դարակ» for the tray / display case  (spec 6.3, flagged)
   Two hard rules the copy below obeys:
     - «հարգադրոշմավորում» for the assay stamp, NEVER the bare «դրոշմավորում» — that word also
       names the track-and-trace regime and a third stamp-duty concept. Three regimes, one root.
     - KARAT IS NEVER A STORAGE UNIT and does not appear in this table at all. 583 and 585 both

   ===================================================================================== */

/* =====================================================================================
   THE ITEM MODEL (spec 1)
   Three record types, and only one of them ever appears in the ledger.

   MODEL (Մոդել) — a catalogue row. Category, metal, fineness, style name and code, default
     making charge. A MODEL HAS NO QUANTITY. It is a template for creating pieces and a grouping
     for the catalogue. It is ArmTrade's PRODUCTS row with the quantity semantics removed.
   PIECE (Իր) — one physical finished object, the unit the customer buys and the unit the tax is
     computed on. Enters the ledger at +netG and leaves at -netG, so its on-hand is either its
     net weight or zero and THE PIECE COUNT IS A PROJECTION, NOT A SECOND LEDGER.
   BULK POOL (Կուտակ) — metal with no piece identity: scrap, findings, castings, offcuts. It has
     no weight field of its own. ITS WEIGHT IS WHAT THE LEDGER SAYS IT IS.
   ===================================================================================== */

/* the ledger's subject keys. `i:` a piece, `b:` a bulk pool of one metal at one fineness. */
const pieceSubj = id => 'i:' + id;
const poolSubj = (metal, fineness) => 'b:' + metal + ':' + safeInt(fineness,0);
const isPieceSubj = s => String(s||'').slice(0,2) === 'i:';
const isPoolSubj  = s => String(s||'').slice(0,2) === 'b:';
const subjPieceId = s => String(s||'').slice(2);
function subjPool(s){
  const p = String(s||'').split(':');
  return { metal: p[1]||'au', fineness: safeInt(p[2],0) };
}

/* ---- gross / stone / net (spec 1.5) ----
   The jeweller types TWO of the three and the third is derived and LOCKED. `weighedAs` records
   which of the two came off the scale, because a later dispute turns on exactly that — the same
   instinct as ArmTrade's velSource: never hold a number without being able to say where it came
   from. Metal value computes on NET, because charging the stone's mass at the gold rate while
   also charging stonesAmd bills the customer twice for the same stone, and the customer can
   check it: the state metrology body weighs items free of charge precisely because weight
   misstatement is a live consumer complaint. */
function deriveWeights(w){
  const gross = round3(num(w.grossG)), stone = round3(Math.max(0, num(w.stoneG)));
  const net = round3(num(w.netG));
  if(w.weighedAs === 'net') return { weighedAs:'net', stoneG:stone, netG:net, grossG:round3(net + stone) };
  return { weighedAs:'gross', stoneG:stone, grossG:gross, netG:round3(gross - stone) };
}
/* constraints, stated once: gross >= stone >= 0 and net > 0. A piece that fails these is not a
   piece the ledger can carry, so it is refused at the edge rather than stored and worked around. */
function weightsValid(p){
  return isFinite(p.grossG) && isFinite(p.stoneG) && isFinite(p.netG) &&
         p.stoneG >= -EPS && p.grossG >= p.stoneG - EPS && p.netG > EPS;
}
const pureG = (netG, fineness) => round3(num(netG) * safeInt(fineness,0) / 1000);

/* ---- the hallmark exemption the app knows and the jeweller would otherwise have to remember ----
   Cheap expertise: a 1.2 g gold earring needs no stamp and the app says so and says why, rather
   than showing a red flag for a legitimate item. `origin` is an ENUM, not a boolean, because an
   unstamped item is legitimate in six different ways. */
function suggestHallmark(p){
  if(p.cat === 'scrap') return 'exempt_scrap';
  const lim = HM_EXEMPT_G[p.metal] || HM_EXEMPT_G.au;
  if(num(p.netG) < lim) return 'exempt_weight';
  return 'none';
}

let S = null;
let U = { lang:'hy', theme:'light', tab:'home' };
let LEDGER_REJECTS = [];   /* refused movements, kept so the UI can say WHY, never silently */

function freshCfg(){
  return {
    shopName:'', tin:'',
    /* THE MARGIN SITS ON THE METAL RATE, NOT ON THE FINISHED TOTAL. Owner decision, settled.
       The setting is one number and the breakdown line names it, so if a jeweller ever comes
       back with a different answer the change is one function. A REAL new shop starts at zero —
       the shop's own markup is not something this product is entitled to guess. */

    /* WHAT THE SHOP PAYS FOR SCRAP, as a discount off the 999 base. IT SHIPS UNSET, AND null IS
       NOT ZERO. The typical Yerevan discount off market is explicitly unverified in the research
       (register item 11) and the buy rate is a number a jeweller QUOTES ACROSS A COUNTER to a
       walk-in — an invented default here would put a made-up figure in front of a customer. Until
       the owner sets it, the rate card shows a dash and says the setting is missing. */
    buyDiscPct: null,
    /* the making charge multiplies GROSS. Owner decision, settled. The workmanship was done on
       the whole object. The breakdown line names which weight it used either way. */
    makingBase: 'gross',
    gramDp: 2,
    regime: '', taxRate: 0
  };
}

    models:[], pieces:[], pools:[], lots:[],

    sales:[], buys:[]
  };

/* =====================================================================================
   THE LEDGER (spec 1.3, 4)
   S.moves is append-only: never edited, never re-ordered. On-hand is SUM(dq) and S.stock is only
   a cache of that sum. postMove() is THE ONLY WAY on-hand is ever allowed to change.

   The domain registration, in the shape the core analysis specifies. It is a real object, not a
   comment: every rule below is read from it, so changing a rule is changing one line here.
   ===================================================================================== */
const LEDGER = {
  cacheKey: 'stock',
  subject: ev => ev.subject,
  delta:   ev => num(ev.dq),
  zero:    0,
  fold:    (a,d) => a + d,
  /* NOT ===. Accumulated float error over a thousand gram movements would make an exact
     comparison spuriously unequal and the app would "heal" the ledger in a loop. */
  eq:      (a,b) => Math.abs(a-b) < EPS,
  /* NOT safeInt. A shop with 12.35 g on hand must not lose 0.35 g on every migration. */
  clamp:   clampG,
  round:   round3,
  identity:['subject','type','dq','ts'],
  /* `+` is commutative, so the fold needs no sort and the log needs no order field. Do not add
     one: an order field would make two devices' merges depend on who wrote first. */
  order:   null,
  validate: pieceIntegrityGuard,
  types:   ['open','receipt','buyin','sale','return','writeoff','melt_out','melt_in','loss','count','adjust']
};
const UNITS = { default:'g', list:['g','pcs'], decimals:3, display:2 };

const onHand = subject => num((S.stock||{})[subject]);
const pieceById = id => (S.pieces||[]).find(p => p && p.id === id) || null;

/* ---- the piece-integrity guard (spec 1.3) ----
   A piece cannot be partially sold. It is a bulk pool of one: it enters at +netG and leaves at
   -netG, so after any movement its on-hand is either zero or its full net weight.

   THE ONE DOCUMENTED EXCEPTION is `adjust` and `count`. Spec 5.4 gives the jeweller a re-weigh
   affordance during a stock count that "records the new weight as an adjustment with a reason",
   and such an adjustment is a DELTA — 0.05 g, not 5.42 g — so the whole-piece rule would refuse
   the one movement the count act needs. For those two types the guard falls back to the rule
   that holds for every subject in the ledger: on-hand may not go negative.

   THE LOOP THAT EXCEPTION OPENS IS CLOSED BY syncPieceWeight() BELOW, and the two must be read
   together. On their own these two types let a piece's on-hand drift away from its recorded
   netG — the tray listing 5.37 g while the card priced 5.42 g, with nothing reconciling them —
   which breaks spec 1.3's rule that after any movement a piece's on-hand is either zero or its
   full net weight. It is not the guard that restores that rule (a re-weigh is legitimate and
   must not be refused); it is the piece record following the ledger. Do not remove either half
   without rewriting the other. */
function pieceIntegrityGuard(mv, cur){
  if(!mv.subject) return 'nosubject';
  const dq = num(mv.dq);
  if(!isFinite(dq)) return 'nonfinite';
  const after = cur + dq;
  if(after < -EPS) return 'negative';
  if(!isPieceSubj(mv.subject)) return '';
  if(mv.type === 'adjust' || mv.type === 'count') return '';
  const p = pieceById(subjPieceId(mv.subject));
  const net = p ? num(p.netG) : 0;
  if(!(eqG(after, 0) || eqG(after, net))) return 'piece_whole';
  return '';
}
const REJ_KEY = { piece_whole:'rej_piece_whole', negative:'rej_negative',
                  nonfinite:'rej_nonfinite', nosubject:'rej_nosubject', toobig:'rej_toobig' };

/* ---- the other half of the adjust/count exception (spec 5.4, 1.3) ----
   A re-weigh is the ONE movement that changes what a piece weighs, so it is the one movement
   that must also change the piece RECORD. Without this the ledger says 5.37 g, p.netG still
   says 5.42 g, priceOf() still charges for 5.42 g and the tray and the card contradict each
   other on the same screen. Stones are not re-weighed by an adjustment of the metal, so gross
   follows net and stoneG is left alone. A movement that takes the piece to zero is the piece
   LEAVING, not a re-weigh, so its recorded weight stands. */
function syncPieceWeight(mv){
  if(!isPieceSubj(mv.subject)) return;
  if(mv.type !== 'adjust' && mv.type !== 'count') return;
  const p = pieceById(subjPieceId(mv.subject));
  if(!p) return;
  const after = round3(onHand(mv.subject));
  if(after <= EPS) return;
  p.netG = after;
  p.grossG = round3(after + num(p.stoneG));
}

/* the content-addressed uuid. The ordinal counts movements ALREADY in the log carrying the same
   identity, so a replay of one movement is a no-op while two genuinely distinct identical-looking
   adjustments on the same day stay two rows. */
function moveUuid(mv){
  const key = moveKey(mv);
  let ord = 0;
  const ms = S.moves || [];
  for(let i=0;i<ms.length;i++){ if(ms[i] && moveKey(ms[i]) === key) ord++; }
  return contentId('m-', key, ord);
}

function postMove(m){
  if(!m || !m.subject || !m.type) return false;
  if(!Array.isArray(S.moves)){ S.moves = []; S.moveSeq = S.moveSeq || 0; }
  if(!S.stock || typeof S.stock !== 'object') S.stock = {};
  /* THE RAW NUMBER IS JUDGED BEFORE IT IS SANITISED. round3() turns NaN and Infinity into 0 and
     clampG() silently rewrites 1,000,000 to 99,999, so validating the sanitised value can never
     see either — a non-finite weight used to append a permanent 0-gram row and return true, and
     a fat-fingered million used to post 99,999 g of gold as a legitimate receipt with nothing
     anywhere saying the number had been changed. AN APPEND-ONLY LOG CANNOT BE CORRECTED
     AFTERWARDS, so a number the operator did not choose must never enter it in silence: both
     are REFUSED and reported. */
  const rawDq = +m.dq;
  const rawBad = !isFinite(rawDq) ? 'nonfinite'
               : (Math.abs(rawDq) > MOVE_G_MAX ? 'toobig' : '');
  if(rawBad){
    LEDGER_REJECTS.push({ subject:String(m.subject), type:String(m.type), dq:rawDq, reason:rawBad, at:Date.now() });
    if(LEDGER_REJECTS.length > 200) LEDGER_REJECTS = LEDGER_REJECTS.slice(-100);
    return false;
  }
  const mv = {
    n: 0,
    uuid: '',
    ts: m.ts == null ? S.today : safeInt(m.ts, S.today),
    rts: Date.now(),
    subject: String(m.subject),
    type: String(m.type),
    /* THE ONE PLACE A WEIGHT IS ROUNDED — at the edge, as it enters the log. The running total
       is never rounded; eqG() is what absorbs the drift. */
    dq: LEDGER.clamp(m.dq),
    /* the acquisition cost this movement carried, in whole dram. Money is an integer; only
       weight is decimal. */
    cost: m.cost == null ? 0 : safeAmd(m.cost, 0),
    ref: m.ref ? String(m.ref) : '',
    reason: m.reason ? String(m.reason) : '',
    actor: m.actor ? String(m.actor) : 'shop',
    note: m.note ? String(m.note) : '',
    lot: m.lot ? String(m.lot) : ''
  };
  const cur = onHand(mv.subject);
  const bad = LEDGER.validate(mv, cur);
  if(bad){
    /* diagnostic, not a record: the ledger itself is append-only, this is only what the UI
       needs to say WHY a movement was refused. Capped, because a tab a jeweller leaves open
       all day must not grow a list nobody reads. */
    LEDGER_REJECTS.push({ subject:mv.subject, type:mv.type, dq:mv.dq, reason:bad, at:Date.now() });
    if(LEDGER_REJECTS.length > 200) LEDGER_REJECTS = LEDGER_REJECTS.slice(-100);
    return false;
  }
  const uuid = m.uuid || moveUuid(mv);
  if(S.moves.some(x => x && x.uuid === uuid)) return false;   // replaying the same move is a no-op
  mv.uuid = uuid;
  mv.n = ++S.moveSeq;
  S.moves.push(mv);
  /* THE ONLY WRITE TO THE ON-HAND CACHE IN THE WHOLE PRODUCT. Not rounded: rebuildStock() folds
     the same numbers in the same order, and eqG() covers a cache that came back through
     migrate()'s clamp. */
  S.stock[mv.subject] = LEDGER.fold(onHand(mv.subject), LEDGER.delta(mv));
  /* the piece record follows the ledger, not the other way round: see syncPieceWeight. This is
     part of the write, not an annotation — leaving it out is what let on-hand and netG diverge. */
  syncPieceWeight(mv);
  /* lots are a derived annotation, so a failure here may never block a ledger move */
  try{ reconcileLots(mv); }catch(e){}
  return true;
}
function postMoves(arr){ let n = 0; (arr||[]).forEach(m => { if(postMove(m)) n++; }); return n; }

function rebuildStock(){
  const c = {};
  (S.moves||[]).forEach(m => { if(m && m.subject) c[m.subject] = (c[m.subject]||0) + num(m.dq); });
  return c;
}
/* the invariant is not "cache equals rebuild". It is "on-hand is a real number AND equals the sum
   of the movements", so it is stated that way: a NaN on both sides used to pass an === test in
   silence and report clean to every caller that only counts entries. */
function verifyLedger(){
  const rb = rebuildStock(), out = [], subs = {};
  Object.keys(S.stock||{}).forEach(k => subs[k] = 1);
  Object.keys(rb).forEach(k => subs[k] = 1);
  Object.keys(subs).forEach(sub => {
    /* NOT num(). num() coerces NaN and Infinity to 0, so running it first made the isFinite
       test below impossible to fail and `nonFinite` dead code: a cache holding NaN reported
       clean. A subject absent from one side is genuinely 0; a subject PRESENT and non-finite
       is the thing this branch exists to catch, and the two must not be conflated. */
    const cRaw = (S.stock||{})[sub], rRaw = rb[sub];
    const cached = cRaw === undefined || cRaw === null ? 0 : +cRaw;
    const rebuilt = rRaw === undefined || rRaw === null ? 0 : +rRaw;
    if(!isFinite(cached) || !isFinite(rebuilt)) out.push({ subject:sub, cached, rebuilt, nonFinite:true });
    else if(!LEDGER.eq(cached, rebuilt)) out.push({ subject:sub, cached, rebuilt });
  });
  return out;
}
/* re-derive the cache from the log. Called at boot, and offered on the Data screen because a
   shopkeeper who has been told the ledger disagrees needs a way to act on it. */
function healLedger(){ S.stock = rebuildStock(); }

function movesFor(subject, limit){
  const all = (S.moves||[]).filter(m => m && m.subject === subject).slice()
    .sort((a,b) => ((a.ts||0)-(b.ts||0)) || ((a.n||0)-(b.n||0)));
  let bal = 0;
  const rows = all.map(m => { bal = round3(bal + num(m.dq)); return Object.assign({}, m, { bal }); });
  return rows.slice(-(limit||50)).reverse();
}

/* ---- lots (spec 1.6) ----
   ArmTrade's batch mechanism, renamed and RE-MEANINGED. A batch annotates a SKU with EXPIRY and
   consumes FEFO. A lot annotates a bulk pool with ACQUISITION COST and consumes FIFO BY
   ACQUISITION DATE, because the margin scheme requires knowing which cost basis a sold gram
   consumed. Same code, same `sum(left) <= onHand` invariant enforced in the same single place,
   different ordering rule, completely different reason for existing.
   DO NOT "FIX" THIS BACK TO FEFO. Gold does not expire. */
function lotsFor(subject){
  return (S.lots||[]).filter(l => l && l.subject === subject && l.leftG > EPS)
    .sort((a,b) => (a.acq && a.acq.date || 0) - (b.acq && b.acq.date || 0));   /* FIFO by acquisition date */
}
function reconcileLots(mv){
  if(!isPoolSubj(mv.subject)) return;
  if(mv.dq < 0){
    let need = -mv.dq;
    lotsFor(mv.subject).forEach(l => {
      if(need <= EPS) return;
      const take = Math.min(l.leftG, need);
      l.leftG = round3(l.leftG - take);
      need = round3(need - take);
    });
  }
  /* the invariant, enforced in exactly one place: the lots may never claim more metal than the
     ledger says is there. */
  const oh = onHand(mv.subject);
  let sum = 0;
  (S.lots||[]).forEach(l => { if(l && l.subject === mv.subject) sum = round3(sum + num(l.leftG)); });
  if(sum > oh + EPS){
    let over = round3(sum - oh);
    lotsFor(mv.subject).reverse().forEach(l => {
      if(over <= EPS) return;
      const cut = Math.min(l.leftG, over);
      l.leftG = round3(l.leftG - cut); over = round3(over - cut);
    });
  }
}

/* =====================================================================================
   PRICING (spec 2)
   One number is maintained — the Central Bank's daily AMD price for one gram of 999 gold — and
   every other rate is DERIVED, never stored. This is exactly how the CB publishes and how the
   market derives, and it is what ARMGOLD already does.
   ===================================================================================== */
const base999 = () => safeAmd(S.rate && S.rate.base999, 0);
const silver999 = () => safeAmd(S.rate && S.rate.silver999, 0);
/* METAL IS A DIMENSION, NOT AN ASSUMPTION (spec 1.2). ARMGOLD, whose formula this product
   inherits, is gold-only, and every rate below used to be hardwired to the gold base — which
   priced a 14.2 g silver chain at the gold rate, a 34x overcharge. There is exactly ONE place
   that answers "what is a gram of this metal worth", and every rate is derived from it. */
const metalRate999 = m => m === 'ag' ? silver999() : base999();
const rateFor  = (f, metal) => Math.round(metalRate999(metal) * safeInt(f,0) / 999);
const sellRate = metal => Math.round(metalRate999(metal) * (1 + num(S.cfg.marginPct)/100));
const buyDiscSet = () => S.cfg.buyDiscPct != null;
/* 0 when the discount has never been set: there is no honest buy rate to show, and a caller that
   renders 0 renders a dash (see rateCard) rather than a number nobody chose. */
const buyRate  = metal => buyDiscSet() ? Math.round(metalRate999(metal) * (1 - num(S.cfg.buyDiscPct)/100)) : 0;

/* which weight the making charge multiplies. Owner decision: GROSS. The setting exists and the
   breakdown line names it, so the answer is visible rather than buried. */
const makingWeight = p => S.cfg.makingBase === 'net' ? num(p.netG) : num(p.grossG);

/* the finished-item sale price. ARMGOLD's formula with netG made explicit. It is the trade's own
   decomposition and it does not change. */
function priceOf(p){
  const metal = num(p.netG) * sellRate(p.metal) * safeInt(p.fineness,0) / 999;
  const stones = safeAmd(p.stonesAmd, 0);
  const making = safeAmd(p.makingG, 0) * makingWeight(p);
  return Math.round(metal + stones + making);
}
/* what the shop pays a walk-in for metal. NO MAKING CHARGE — the shop is buying metal, not
   workmanship — and stones default to zero because a shop buying scrap does not pay for them. */
function buyPriceOf(netG, fineness, metal){
  if(!buyDiscSet()) return 0;
  return Math.round(num(netG) * buyRate(metal) * safeInt(fineness,0) / 999);
}

/* ---- THE BREAKDOWN LINE — MANDATORY ----
   The whole formula with the actual numbers substituted, one line, under the figure. A jeweller
   checks it against the number in his head. This is the single best thing in ARMGOLD and NO
   COMPUTED MONEY MAY APPEAR ANYWHERE IN THIS PRODUCT WITHOUT ONE. If you are adding a screen
   that shows a price, you are adding a call to this function. */
function breakdown(p){
  const sr = sellRate(p.metal), f = safeInt(p.fineness,0);
  const metal = num(p.netG) * sr * f / 999;
  const stones = safeAmd(p.stonesAmd, 0);
  const mkRate = safeAmd(p.makingG, 0), mkW = makingWeight(p);
  const making = mkRate * mkW;
  const parts = [];
  /* THE BREAKDOWN LINE PRINTS WEIGHTS AT FULL STORED PRECISION (3dp), never at the shop's
     DISPLAY precision. The display setting exists so a tray of two-decimal figures scans
     cleanly; this line exists so the jeweller can reproduce the total in his head. Printing
     «3.81» beside a total computed from 3.813 makes the two disagree by 94 dram — small, and
     fatal, because the ONE promise this line makes is that its own numbers give its own answer. */
  parts.push('<b>' + gramTxt(p.netG, 3) + t('u_g') + '</b>'
    + '<span class="op">&times;</span>' + '<b>' + sr.toLocaleString('en-US') + '</b>'
    + '<span class="op">&times;</span>' + '<b>' + f + '/999</b>');
  if(stones) parts.push('<b>' + stones.toLocaleString('en-US') + '</b>');
  if(mkRate) parts.push('<b>' + mkRate.toLocaleString('en-US') + '</b><span class="op">&times;</span><b>'
    + gramTxt(mkW, 3) + t('u_g') + '</b>');
  const why = [];
  why.push(t(S.cfg.makingBase === 'net' ? 'pr_base_net' : 'pr_base_gross'));
  why.push(fmt('pr_margin_note', { p: pctTxt(S.cfg.marginPct) }));
  return '<div class="brk">' + parts.join('<span class="op">+</span>')
    /* ROUNDED ONCE, ON THE SUM — not per term. Rounding metal and making separately and then
       adding them made the line's own printed total disagree with the price printed directly
       above it by 1 ֏ on about a quarter of real 3dp weights. The one promise this line makes
       is that its own operands give its own answer AND that its answer is the price shown, so
       it must round exactly where priceOf() rounds. */
    + '<span class="eq">=</span><b>' + Math.round(metal + stones + making).toLocaleString('en-US') + ' ֏</b>'
    + '<span class="why">' + escH(why.join(' · ')) + '</span></div>';
}
function buyBreakdown(netG, fineness, metal){
  const br = buyRate(metal), f = safeInt(fineness,0);
  const paid = buyPriceOf(netG, fineness, metal);
  return '<div class="brk"><b>' + gramTxt(netG, 3) + t('u_g') + '</b>'
    + '<span class="op">&times;</span><b>' + br.toLocaleString('en-US') + '</b>'
    + '<span class="op">&times;</span><b>' + f + '/999</b>'
    + '<span class="eq">=</span><b>' + paid.toLocaleString('en-US') + ' ֏</b>'
    + '<span class="why">' + escH(t('pr_buy_nostones') + ' · ' + t('w_buydisc') + ' ' + pctTxt(S.cfg.buyDiscPct) + '%') + '</span></div>';
}

/* the valuation of a quantity of metal is computed money, so it gets a breakdown line too:
   pure grams, the 999 rate, the product. One helper, used by the tray group headers, the
   pure-metal total and the bulk pool sheet, so the three can never drift apart. */
function valBreakdown(terms){
  /* rounded once, on the sum — same rule as breakdown(), and the same reason: valuation()
     rounds once too, and a KPI that disagrees with the line under it by 1 ֏ is a KPI nobody
     trusts. */
  const total = Math.round(terms.reduce((a,x) => a + x.pure * x.rate, 0));
  return '<div class="brk">'
    /* each operand carries its metal: two metals' 999 rates appear in one sum and «999 գին»
       is singular, so without the label the line does not stand alone. */
    + terms.map(x => (x.metal ? '<span class="mn">' + escH(metalLabel(x.metal)) + '</span>' : '')
        + '<b>' + gramTxt(x.pure,3) + t('u_g') + '</b><span class="op">&times;</span><b>'
        + safeAmd(x.rate,0).toLocaleString('en-US') + '</b>').join('<span class="op">+</span>')
    + '<span class="eq">=</span><b>' + total.toLocaleString('en-US') + ' \u058F</b>'
    + '<span class="why">' + escH(t('brk_val')) + '</span></div>';
}

/* ---- the 80%-of-fair-value warning (spec 2.3) ----
   A sale at or below 80% of fair value is recalculated by the tax authority at 80% of fair value.
   So a discount deeper than 20% is not a commercial decision, it is a tax event. This is a
   WARNING, NEVER A BLOCK: blocking a customer at the counter over a tax rule is not acceptable
   behaviour in a shop, and the jeweller may have a reason. Both figures are returned so the sale
   record can carry them for the accountant. */
function fairValueWarn(computed, manual){
  const c = safeAmd(computed,0), m = safeAmd(manual,0);
  if(!c || !m || m >= c * 0.8) return null;
  return { computed:c, floor: Math.round(c*0.8), manual:m, pct: Math.round(m*100/c) };
}

/* =====================================================================================
   MIGRATION (spec 4, 9)
   Idempotent and STRICTLY ADDITIVE. It runs on EVERY adoption path — first boot, reload, a
   restored last-known-good, and (when sync lands) every state adopted from a room — so a device
   running an older build can never white-screen this one. It defaults and clamps every key.

   THE ONE THING IT MUST NOT DO is round a weight with an integer function. ArmTrade's migrate()
   does exactly that at line 3349 (`safeInt` on the on-hand cache) and a shop with 12.35 g on hand
   loses 0.35 g on every load; the ledger then disagrees with the cache for ever. Here the cache
   goes through LEDGER.clamp, which is round3.
   ===================================================================================== */
function migrate(st){
  if(!st || typeof st !== 'object') return freshState();

  st.v = Math.max(0, safeInt(st.v, 0));
  st.seq = Math.max(1, safeInt(st.seq, 1));
  st.today = safeInt(st.today, Date.UTC(2026,7,19));

  /* ---- settings ---- */
  const d = freshCfg();
  if(!st.cfg || typeof st.cfg !== 'object') st.cfg = {};
  st.cfg.shopName = String(st.cfg.shopName == null ? d.shopName : st.cfg.shopName).slice(0,80);
  st.cfg.tin = String(st.cfg.tin == null ? d.tin : st.cfg.tin).replace(/[^0-9]/g,'').slice(0,12);
  st.cfg.marginPct = Math.max(0, Math.min(200, num(st.cfg.marginPct != null ? st.cfg.marginPct : d.marginPct)));
  /* null means UNSET and must survive migration as null; 0 means "we pay spot", which is a
     different (and legitimate) answer. Collapsing the two would invent the number this setting
     exists to avoid inventing. */
  st.cfg.buyDiscPct = (st.cfg.buyDiscPct == null || st.cfg.buyDiscPct === '' || !isFinite(+st.cfg.buyDiscPct))
    ? null : Math.max(0, Math.min(90, num(st.cfg.buyDiscPct)));
  st.cfg.makingBase = st.cfg.makingBase === 'net' ? 'net' : 'gross';
  st.cfg.gramDp = st.cfg.gramDp === 3 ? 3 : 2;
  st.cfg.regime = ['micro','turnover','vat'].indexOf(st.cfg.regime) >= 0 ? st.cfg.regime : '';
  /* NO TAX RATE SHIPS. The retail turnover rate is single-sourced at 10% against a long-standing
     5%, and the producer VAT floor is a genuine conflict between two sources. The owner types a
     number his accountant gave him, or the reports say nothing. A wrong tax number would be far
     worse than none. */
  st.cfg.taxRate = Math.max(0, Math.min(100, num(st.cfg.taxRate)));

  /* ---- the rate ---- */
  if(!st.rate || typeof st.rate !== 'object') st.rate = {};
  st.rate.base999 = safeAmd(st.rate.base999, 0);
  st.rate.silver999 = safeAmd(st.rate.silver999, 0);
  st.rate.at = Math.max(0, safeInt(st.rate.at, 0));
  st.rate.src = st.rate.src === 'cb' ? 'cb' : 'manual';
  st.rate.by = String(st.rate.by || 'shop').slice(0,24);

  const arr = k => { if(!Array.isArray(st[k])) st[k] = []; };
  ['models','pieces','pools','lots','moves','sales','buys'].forEach(arr);

  /* ---- models: catalogue rows, no quantity, never in the ledger ---- */
  st.models = st.models.filter(m => m && m.id).map(m => ({
    id: String(m.id).slice(0,24),
    cat: CATS.indexOf(m.cat) >= 0 ? m.cat : 'other',
    metal: METALS.indexOf(m.metal) >= 0 ? m.metal : 'au',
    fineness: safeInt(m.fineness, 585),
    name: String(m.name || '').slice(0,60),
    code: String(m.code || '').slice(0,24),
    makingG: safeAmd(m.makingG, 0),
    note: String(m.note || '').slice(0,200)
  }));

  /* ---- pieces ---- */
  st.pieces = st.pieces.filter(p => p && p.id).map(p => {
    const metal = METALS.indexOf(p.metal) >= 0 ? p.metal : 'au';
    const w = deriveWeights({
      weighedAs: p.weighedAs === 'net' ? 'net' : 'gross',
      grossG: p.grossG, stoneG: p.stoneG, netG: p.netG
    });
    const acq = p.acq && typeof p.acq === 'object' ? p.acq : {};
    const hm = p.hallmark && typeof p.hallmark === 'object' ? p.hallmark : {};
    const date = Math.max(0, safeInt(acq.date, 0));
    return {
      id: String(p.id).slice(0,24),
      model: p.model ? String(p.model).slice(0,24) : null,
      code: String(p.code || '').slice(0,24),
      metal: metal,
      fineness: safeInt(p.fineness, 585),
      grossG: w.grossG, stoneG: w.stoneG, netG: w.netG, weighedAs: w.weighedAs,
      stonesAmd: safeAmd(p.stonesAmd, 0),
      makingG: safeAmd(p.makingG, 0),
      priceManual: p.priceManual ? safeAmd(p.priceManual, 0) : 0,
      acq: {
        costAmd: safeAmd(acq.costAmd, 0),
        stoneCost: safeAmd(acq.stoneCost, 0),
        date: date,
        /* STORED, NOT DERIVED. A device clock change, a timezone bug or a later legal change must
           not be able to silently reclassify old stock into the other tax treatment. It is
           back-filled from the date only when the flag is genuinely absent. */
        preJul26: acq.preJul26 === true || acq.preJul26 === false
                    ? !!acq.preJul26 : (date > 0 && date < JUL26),
        docType: ['invoice','buyact','customs','opening','none'].indexOf(acq.docType) >= 0 ? acq.docType : 'none',
        docRef: String(acq.docRef || '').slice(0,40),
        source: String(acq.source || 'opening').slice(0,32),
        known: acq.known !== false
      },
      hallmark: {
        origin: ['am_assay','eaeu','exempt_weight','exempt_scrap','exempt_other','none'].indexOf(hm.origin) >= 0 ? hm.origin : 'none',
        makerMark: !!hm.makerMark,
        sentTs: Math.max(0, safeInt(hm.sentTs, 0)),
        backTs: Math.max(0, safeInt(hm.backTs, 0)),
        docRef: String(hm.docRef || '').slice(0,40),
        office: String(hm.office || '').slice(0,60)
      },
      /* CUSTODY, NOT A MOVEMENT. Changing this never touches the ledger. */
      location: ['tray','safe','assay','workshop','out'].indexOf(p.location) >= 0 ? p.location : 'tray',
      cat: CATS.indexOf(p.cat) >= 0 ? p.cat : 'other',
      atg: String(p.atg || '').replace(/[^0-9]/g,'').slice(0,10),
      note: String(p.note || '').slice(0,200),
      addedTs: Math.max(0, safeInt(p.addedTs, 0))
    };
  }).filter(p => weightsValid(p));

  /* ---- bulk pools: a registry only. THEIR WEIGHT IS WHAT THE LEDGER SAYS IT IS. ---- */
  st.pools = st.pools.filter(b => b && b.id).map(b => ({
    id: String(b.id).slice(0,24),
    metal: METALS.indexOf(b.metal) >= 0 ? b.metal : 'au',
    fineness: safeInt(b.fineness, 585),
    cat: CATS.indexOf(b.cat) >= 0 ? b.cat : 'scrap',
    note: String(b.note || '').slice(0,200)
  }));

  /* ---- lots: cost basis layered on a pool, consumed FIFO by acquisition date ---- */
  st.lots = st.lots.filter(l => l && l.id && l.subject).map(l => {
    const acq = l.acq && typeof l.acq === 'object' ? l.acq : {};
    const date = Math.max(0, safeInt(acq.date, 0));
    return {
      id: String(l.id).slice(0,32),
      subject: String(l.subject).slice(0,40),
      inG: Math.max(0, LEDGER.clamp(l.inG)),
      leftG: Math.max(0, LEDGER.clamp(l.leftG)),
      acq: {
        costAmd: safeAmd(acq.costAmd, 0), stoneCost: safeAmd(acq.stoneCost, 0), date: date,
        preJul26: acq.preJul26 === true || acq.preJul26 === false ? !!acq.preJul26 : (date > 0 && date < JUL26),
        docType: ['invoice','buyact','customs','opening','none'].indexOf(acq.docType) >= 0 ? acq.docType : 'none',
        docRef: String(acq.docRef || '').slice(0,40),
        source: String(acq.source || 'opening').slice(0,32),
        known: acq.known !== false
      }
    };
  });

  /* ---- the log. Append-only, so migration MAY NOT drop a row it does not understand; it may
     only default and clamp the fields it knows. The dq clamp is round3 — never safeInt. ---- */
  st.moveSeq = Math.max(0, safeInt(st.moveSeq, 0));
  const seen = {};
  st.moves = st.moves.filter(m => m && m.subject && m.type && m.uuid && !seen[m.uuid] && (seen[m.uuid] = 1)).map(m => ({
    n: Math.max(0, safeInt(m.n, 0)),
    uuid: String(m.uuid).slice(0,48),
    ts: safeInt(m.ts, st.today),
    rts: Math.max(0, safeInt(m.rts, 0)),
    subject: String(m.subject).slice(0,40),
    type: LEDGER.types.indexOf(m.type) >= 0 ? m.type : 'adjust',
    dq: LEDGER.clamp(m.dq),
    cost: safeAmd(m.cost, 0),
    ref: String(m.ref || '').slice(0,40),
    reason: String(m.reason || '').slice(0,32),
    actor: String(m.actor || 'shop').slice(0,24),
    note: String(m.note || '').slice(0,200),
    lot: String(m.lot || '').slice(0,32)
  }));
  st.moves.forEach(m => { if(m.n > st.moveSeq) st.moveSeq = m.n; });

  /* ---- the on-hand cache. Clamped with round3, NEVER safeInt. ---- */
  if(!st.stock || typeof st.stock !== 'object' || Array.isArray(st.stock)) st.stock = {};
  Object.keys(st.stock).forEach(k => {
    const v = LEDGER.clamp(st.stock[k]);
    if(isFinite(v)) st.stock[k] = v; else delete st.stock[k];
  });

  st.sales = st.sales.slice(-500);
  st.buys = st.buys.slice(-500);
  return st;
}

/* every adoption path goes through here: migrate, then re-derive the cache from the log, because
   the log is the truth and the cache is only a cache. */
function adopt(st){
  const s = migrate(st);
  const prev = S; S = s;
  try{ healLedger(); } finally { if(!S) S = prev; }
  return s;
}

/* =====================================================================================

   A tray a jeweller would recognise: several finenesses INCLUDING 583 (the Soviet standard, which
   is legal, distinct, and sits next to 585 in a real cabinet), pieces with stones and pieces
   without, stock acquired either side of 1 July 2026, one piece with no documented cost, one
   piece out at the assay office, silver alongside gold, and a scrap pool with two lots at
   different cost bases.

   IT IS ENTERED THROUGH postMove(), not written into S.stock. Seed data that bypassed the ledger
   would be seed data whose invariant had never been tested.
   ===================================================================================== */

  /* the demo shop's own markup. It is named on EVERY breakdown line the product renders, so it
     is visible and adjustable rather than baked in — which is the whole reason the margin is a
     setting. The buy-in discount stays null even here: see freshCfg(). */

      hallmark:{ origin:'am_assay', makerMark:true, docRef:'ՀԴ-4210', office:'Երևան' },
      location:'tray', note:'', addedTs: D(2026,6,9) },

    /* OUT AT THE ASSAY OFFICE. Still the shop's stock, still on-hand, no movement posted — only
       `location` changed. Without this rule a hallmark send-out reads as a shortage at the next
       count and as a sale in the books. */
    { id:'i9', model:'m2', code:'Մ-7788', metal:'au', fineness:750, weighedAs:'gross',
      grossG:6.310, stoneG:0, netG:0, stonesAmd:0, makingG:5200, cat:'ring',
      acq: mkAcq(238000, D(2026,8,6), 'invoice', 'ՀԱ-2026-0351', 'sup:s1'),
      hallmark:{ origin:'none', makerMark:true, sentTs: D(2026,8,10), office:'Երևան' },
      location:'assay', note:'', addedTs: D(2026,8,6) },

    /* NO DOCUMENTED COST. Allowed — a missing cost never blocks a sale — but the piece, the sale
       record and the alerts all say so, because under the margin scheme the tax is then computed
       on the whole price and the jeweller must know that before he sets one. */
    { id:'i10', model:'m1', code:'Շ-0009', metal:'au', fineness:585, weighedAs:'gross',
      grossG:6.700, stoneG:0, netG:0, stonesAmd:0, makingG:4500, cat:'chain',
      acq: { costAmd:0, stoneCost:0, date: D(2025,11,3), preJul26:true,
             docType:'none', docRef:'', source:'opening', known:false },
      hallmark:{ origin:'am_assay', makerMark:false },
      location:'tray', note:'', addedTs: D(2025,11,3) }
  ];

  st.pools = [
    { id:'b:au:585', metal:'au', fineness:585, cat:'scrap', note:'' },
    { id:'b:au:750', metal:'au', fineness:750, cat:'scrap', note:'' },
    { id:'b:ag:925', metal:'ag', fineness:925, cat:'scrap', note:'' }
  ];

  /* ---- now build the ledger. Every gram in this shop arrives through postMove(). ---- */
  const prev = S; S = st;
  try{
    st.pieces.forEach(p => {
      const w = deriveWeights(p);
      p.grossG = w.grossG; p.stoneG = w.stoneG; p.netG = w.netG; p.weighedAs = w.weighedAs;
      postMove({
        subject: pieceSubj(p.id),
        type: p.acq.source === 'public' ? 'buyin' : (p.acq.docType === 'opening' || !p.acq.known ? 'open' : 'receipt'),
        dq: p.netG, ts: p.acq.date || st.today, cost: p.acq.costAmd,
        ref: p.acq.docRef, actor:'shop'
      });
    });

    /* the scrap pool, with two lots at different cost bases so FIFO-by-acquisition-date has
       something real to consume. Its weight is the sum of these movements and nothing else. */
    const lot = (id, subject, g, cost, date, docType, ref, source) => {
      st.lots.push({ id, subject, inG: round3(g), leftG: round3(g),
        acq:{ costAmd:cost, stoneCost:0, date, preJul26: date < JUL26, docType, docRef:ref, source, known:true } });
      postMove({ subject, type: source === 'public' ? 'buyin' : 'receipt', dq: g, ts: date,
                 cost, ref, lot: id, actor:'shop' });
    };
    lot('l1', 'b:au:585', 74.600, 1_880_000, D(2026,4,18), 'buyact', 'ԳԱ-2026-0016', 'public');
    lot('l2', 'b:au:585', 53.800, 1_452_000, D(2026,7,22), 'buyact', 'ԳԱ-2026-0033', 'public');
    lot('l3', 'b:au:750', 18.240, 632_000,   D(2026,8,4),  'buyact', 'ԳԱ-2026-0038', 'public');
    lot('l4', 'b:ag:925', 240.500, 128_000,  D(2026,6,30), 'buyact', 'ԳԱ-2026-0029', 'public');

    /* a real shop's log is not all receipts. One sale of a whole piece, one write-off of a few
       grams of scrap sent to melt, and one adjustment — so the invariant is exercised by the seed
       itself rather than only by the tests. */
    postMove({ subject:'b:au:585', type:'melt_out', dq:-12.400, ts: D(2026,8,14),
               reason:'melt', ref:'ՁՁ-2026-0004', actor:'shop' });
    postMove({ subject:'b:au:999', type:'melt_in', dq: 7.180, ts: D(2026,8,14),
               reason:'melt', ref:'ՁՁ-2026-0004', actor:'shop' });
    /* THE REFINING LOSS IS NOT A SECOND DEDUCTION (spec 2.5, whose worked example annotates this
       very row «-0.000  <- not a second deduction»). melt_out already removed the WHOLE physical
       weight from the source pool: 12.400 g left the shop for the melter and 12.400 g is what
       came off the pool. The loss is documented by the GAP between melt_out and melt_in —
       12.400 x 0.585 = 7.254 g of pure metal went out and 7.180 g of fine metal came back, so
       0.074 g did not — and it is posted as a zero-delta movement so the loss is visible and
       NAMED («Կորուստ») without the ledger removing metal a second time.
       Deducting it again understated the pool by 0.127 g, understated lot l1's remaining basis
       by the same, and verifyLedger() reported clean throughout — because cache-equals-log is
       not the invariant that catches it. The invariant that does is spec 1.3's: the sum of a
       subject's movements equals what is PHYSICALLY at that subject's location. */
    postMove({ subject:'b:au:585', type:'loss', dq:0, ts: D(2026,8,14),
               reason:'melt', ref:'ՁՁ-2026-0004', actor:'shop' });
    postMove({ subject:'b:ag:925', type:'adjust', dq:-0.350, ts: D(2026,8,17),
               reason:'short', note:'կշեռքի ճշգրտում', actor:'shop' });
  } finally { S = prev; }

  if(!st.pools.some(b => b.id === 'b:au:999'))
    st.pools.push({ id:'b:au:999', metal:'au', fineness:999, cat:'scrap', note:'' });
  return st;
}

/* =====================================================================================
   AGGREGATION
   Purity is never summed away. There are exactly TWO aggregate presentations and they are never
   mixed:
     - GRAMS BY FINENESS      the counting view (what a tray lists, what a count act reports)
     - PURE-METAL GRAMS       the valuation view, netG x fineness / 1000
   THERE IS NO THIRD AGGREGATE. A screen that shows a bare gram total across finenesses is a bug,
   not a shortcut — 10 g of 585 and 10 g of 750 are not 20 g of anything.
   ===================================================================================== */
function pieceRows(){
  return (S.pieces||[]).map(p => ({ p, subject: pieceSubj(p.id), on: onHand(pieceSubj(p.id)) }))
    .filter(x => x.on > EPS);
}
function poolRows(){
  return (S.pools||[]).map(b => ({ b, subject: b.id, on: onHand(b.id) }))
    .filter(x => x.on > EPS);
}
/* grouped by metal AND fineness — the key of the counting view */
function trayGroups(){
  const g = {};
  const put = (metal, fineness, k, v) => {
    const key = metal + ':' + fineness;
    if(!g[key]) g[key] = { metal, fineness: safeInt(fineness,0), pieces:[], pools:[], grams:0, stones:0, pcs:0 };
    g[key][k].push(v);
  };
  pieceRows().forEach(x => {
    put(x.p.metal, x.p.fineness, 'pieces', x);
    const key = x.p.metal + ':' + x.p.fineness;
    g[key].grams = round3(g[key].grams + x.on);
    g[key].stones = round3(g[key].stones + num(x.p.stoneG));
    g[key].pcs++;
  });
  poolRows().forEach(x => {
    put(x.b.metal, x.b.fineness, 'pools', x);
    const key = x.b.metal + ':' + x.b.fineness;
    g[key].grams = round3(g[key].grams + x.on);
  });
  return Object.keys(g).map(k => g[k]).sort((a,b) =>
    (a.metal === b.metal ? b.fineness - a.fineness : (a.metal === 'au' ? -1 : 1)));
}
/* pure metal, PER METAL. Gold and silver are not added together either — that would be the same
   mistake one level up. */
function pureByMetal(){
  const out = {};
  trayGroups().forEach(g => {
    out[g.metal] = round3((out[g.metal]||0) + pureG(g.grams, g.fineness));
  });
  return out;
}
function valuation(){
  const pm = pureByMetal(); let v = 0;
  Object.keys(pm).forEach(m => { v += pm[m] * metalRate999(m); });
  return Math.round(v);
}
const pieceCount = () => pieceRows().length;

/* =====================================================================================
   RATE PROVENANCE
   The 999 rate is never shown without saying where it came from and how old it is. A stale rate
   is STATED, not hidden: hiding it would leave the jeweller quoting yesterday's gold today.
   ===================================================================================== */
function rateAgeMs(){
  const at = safeInt(S.rate.at, 0);
  if(!at) return -1;
  const now = Math.max(Date.now(), S.today);
  return Math.max(0, now - at);
}
function rateAgeTxt(){
  const ms = rateAgeMs();
  if(ms < 0) return '';
  if(ms < 3600000) return t('rate_age_now');
  if(ms < DAY) return fmt('rate_age_h', { n: Math.floor(ms/3600000) });
  return fmt('rate_age_d', { n: Math.floor(ms/DAY) });
}
const rateStale = () => { const ms = rateAgeMs(); return ms < 0 || ms > DAY; };
function fdate(ts){
  const d = new Date(safeInt(ts,0));
  if(!safeInt(ts,0)) return '—';
  const p = n => (n<10?'0':'') + n;
  return p(d.getUTCDate()) + '.' + p(d.getUTCMonth()+1) + '.' + d.getUTCFullYear();
}
function ftime(ts){
  const d = new Date(safeInt(ts,0)); const p = n => (n<10?'0':'') + n;
  return p(d.getUTCHours()) + ':' + p(d.getUTCMinutes());
}

/* =====================================================================================
   NAVIGATION
   ArmTrade's navPlan(), unchanged in mechanism: it measures each label at 600 14px IN THE ACTIVE
   LANGUAGE and spills the remainder into «Ավելին». That is exactly why the Armenian labels are
   allowed to be as long as the trade's real words are — the bar adapts, the vocabulary does not
   get shortened to fit a grid.
   ===================================================================================== */
const NAV_KEYS = ['home','sell','buy','tray','count','recv','mark','debts','repair','data'];
/* order of surrender: the daily loop is the last to leave the bar */
const NAV_PRIO = ['home','sell','buy','tray','count','recv','mark','debts','repair','data'];
const NAV_ICON = { home:'☀', sell:'🏷', buy:'🤝', tray:'💍', recv:'📦', count:'📋',
                   mark:'🔖', repair:'🔧', debts:'💳', data:'⚙' };
let NAVMC = null;
function navTextW(txt){
  try{
    if(!NAVMC) NAVMC = document.createElement('canvas').getContext('2d');
    NAVMC.font = '600 14px ' + getComputedStyle(document.body).fontFamily;
    return NAVMC.measureText(String(txt)).width;
  }catch(e){ return String(txt).length * 8; }
}
function navPlan(W){
  const labels = {}; NAV_KEYS.forEach(k => labels[k] = t('tab_'+k));
  const moreW = navTextW(t('more_tab'));
  for(let k = NAV_KEYS.length; k >= 1; k--){
    let keys = NAV_PRIO.slice(0,k);
    /* "you are here" may never be hidden: the open tab buys its way in at the bottom's expense */
    if(keys.indexOf(U.tab) < 0 && NAV_PRIO.indexOf(U.tab) >= 0){
      keys = keys.slice(0, Math.max(1, k-1)); keys.push(U.tab);
    }
    const cells = k + (k < NAV_KEYS.length ? 1 : 0);
    const cw = (W / cells) - 4;
    if(cw < 40) continue;
    const ok = keys.every(kk => navTextW(labels[kk]) <= cw) && (k >= NAV_KEYS.length || moreW <= cw);
    if(ok) return keys;
  }
  return [NAV_PRIO[0]];
}
let NAV_HIDDEN = [];
function renderNav(){
  const nv = document.getElementById('nav');
  nv.style.display = 'flex';
  const W = nv.clientWidth || window.innerWidth || 390;
  const keys = navPlan(W);
  NAV_HIDDEN = NAV_KEYS.filter(k => keys.indexOf(k) < 0);
  nv.innerHTML = keys.map(k =>
    '<button class="' + (U.tab===k ? 'active' : '') + '" aria-label="' + escH(t('tab_'+k)) + '"'
    + ' onclick="setTab(' + jsArg(k) + ')">'
    + '<span class="icw">' + NAV_ICON[k] + '</span><span>' + escH(t('tab_'+k)) + '</span></button>').join('')
    + (NAV_HIDDEN.length ? '<button aria-label="' + escH(t('menu_title')) + '" onclick="openMoreNav()">'
        + '<span class="icw">☰</span><span>' + escH(t('more_tab')) + '</span></button>' : '');
}
function openMoreNav(){
  const rows = NAV_HIDDEN.map(k =>
    '<button class="morerow' + (U.tab===k ? ' active' : '') + '" onclick="closeModal();setTab(' + jsArg(k) + ')">'
    + '<span class="mrico">' + NAV_ICON[k] + '</span><span class="mrnm">' + escH(t('tab_'+k)) + '</span></button>').join('');
  openModal('<h3>☰ ' + escH(t('menu_title')) + '</h3>' + rows
    + '<button class="btn ghost full" style="margin-top:16px" onclick="closeModal()">' + escH(t('close')) + '</button>');
}
function setTab(k){
  if(NAV_KEYS.indexOf(k) < 0) return;
  U.tab = k; saveU(); renderAll();

}

/* ---- Դարակ (spec 6.1 tray) ----
   Stock grouped by fineness, per-fineness subtotals, a pure-metal total per metal, and a
   valuation at today's rate. NO BARE GRAM TOTAL CROSSES A FINENESS BOUNDARY. */
function viewTray(){
  const groups = trayGroups();
  const pm = pureByMetal();
  if(!groups.length){
    return '<main class="anim"><div class="sec">' + escH(t('tray_title')) + '</div>'
      + '<div class="empty"><div class="em">💍</div><div>' + escH(t('tray_empty')) + '</div></div>'
      + '<button class="btn primary" onclick="openNewItem()">+ ' + escH(t('ni_title')) + '</button></main>';
  }
  const body = groups.map(g => {
    const r999 = metalRate999(g.metal);
    const gp = pureG(g.grams, g.fineness);
    const rows = g.pieces.map(x => {
      const p = x.p;
      const nm = modelName(p);
      const bits = [];
      /* the code is only repeated under the name when the name is NOT the code — a one-off piece
         has no model, so its name already IS its tag code and printing it twice reads as damage */
      if(p.code && p.code !== nm) bits.push('<span>' + escH(p.code) + '</span>');
      bits.push('<span>' + escH(catLabel(p.cat)) + '</span>');
      if(p.location !== 'tray') bits.push('<span class="badge b-neutral">' + escH(locLabel(p.location)) + '</span>');
      if(!p.acq.known || !p.acq.costAmd) bits.push('<span class="badge b-rose">' + escH(t('badge_nocost')) + '</span>');
      if(p.acq.preJul26) bits.push('<span class="badge b-neutral">&lt; 01.07.26</span>');
      return '<button class="prow" onclick="openPiece(' + jsArg(p.id) + ')">'
        + '<div class="pi"><div class="pnm">' + escH(nm) + '</div>'
        + '<div class="psub">' + bits.join('') + '</div></div>'
        /* WEIGHT AND PURE METAL ONLY. The piece's PRICE is computed money and no computed money
           appears in this product without the formula beside it — so the price lives on the item

        + '<div class="pw"><div class="a">' + gramTxt(x.on) + '<span class="g">' + escH(t('u_g')) + '</span></div>'

    return '<div class="fgrp"><div class="fhead">'

        + '<span class="mlbl">' + escH(metalLabel(g.metal)) + (g.pcs ? ' · ' + fmt('tray_sub', { n: g.pcs }) : '') + '</span>'
        + '<span class="w">' + gramTxt(g.grams) + '<span class="g">' + escH(t('u_g')) + '</span></span>'
      + '</div>'
      /* the group's valuation, with its arithmetic on the line beneath it */
      + valBreakdown([{ pure: gp, rate: r999 }])
      + '</div><div class="fbody">' + rows + pools + '</div></div>';
  }).join('');

  return '<main class="anim">'
    + '<div class="sec">' + escH(t('tray_title')) + '</div>'
    /* the tray's ONE accent-filled action: putting a piece in it. Everything else on this screen
       is a row you read or tap through. */
    + '<button class="btn primary" style="margin-bottom:12px" onclick="openNewItem()">+ '
      + escH(t('ni_title')) + '</button>'
    + '<div class="puretot"><div class="l">' + escH(t('tray_pure_lbl')) + '</div>'
      + Object.keys(pm).map(m => '<div class="v">' + gramTxt(pm[m],3) + '<span class="g">'
          + escH(t('u_g')) + '</span> <span class="mlbl">' + escH(metalLabel(m)) + ' 999</span></div>').join('')
      + '<div class="row" style="margin-top:12px"><span class="mlbl">' + escH(t('tray_val_lbl')) + '</span>'
        + '<span class="num" style="font-size:17px;font-weight:700">'
        + valuation().toLocaleString('en-US') + '<span class="cur">֏</span></span></div>'
      + valBreakdown(Object.keys(pm).map(m => ({ pure: pm[m], rate: metalRate999(m), metal: m })))

    + '</div>'
    + body
    + '</main>';

function modelName(p){

function cfgSet(k, v){
  if(k==='buyDiscPct') S.cfg[k] = (String(v).trim()==='' ? null : num(v));

  else if(k==='gramDp') S.cfg[k] = safeInt(v,2)===3 ? 3 : 2;
  else S.cfg[k] = v;
  migrate(S); saveState();
  if(k==='makingBase' || k==='gramDp') renderAll();
  else if(k==='buyDiscPct'){
    const n = document.getElementById('bdNote');
    if(n) n.innerHTML = buyDiscSet() ? '' : '<div class="notice">' + escH(t('buydisc_unset_f')) + '</div>';

/* =====================================================================================
   ADDING A PIECE (spec 1.5, 1.6)
   The one form in the foundation, and it exists because two rules in the item model are only
   real if you can see them working:

   1. THE JEWELLER TYPES TWO OF THE THREE WEIGHTS AND THE THIRD IS DERIVED AND LOCKED. The
      derived field is genuinely disabled — not merely recalculated — so there is never a moment
      where three mutually inconsistent numbers are on screen and the app has to guess which two
      the scale produced. `weighedAs` records which pair it was, because a later dispute turns on
      exactly that.
   2. `acq.preJul26` IS STORED AT CREATION, not derived at read time. It is computed here, once,
      from the acquisition date the jeweller gives, and thereafter it is what the record says it
      is — a device clock change or a later legal change cannot silently reclassify old stock into
      the other tax treatment.

   The draft lives outside S: nothing enters the ledger until the jeweller commits, and the
   commit goes through postMove() like every other gram in the shop.
   ===================================================================================== */
let NI = null;
function niFresh(){
  return {
    code:'', metal:'au', fineness:585, cat:'ring',
    weighedAs:'gross', grossG:'', stoneG:'', netG:'',
    stonesAmd:'', makingG:'',
    costAmd:'', costKnown:true, docType:'invoice', docRef:'', acqDate: S.today,
    note:''
  };
}
/* the derived third field, computed from whichever two the jeweller is typing */
function niWeights(){
  const stone = Math.max(0, round3(num(NI.stoneG)));
  if(NI.weighedAs === 'net'){
    const net = round3(num(NI.netG));
    return { weighedAs:'net', stoneG:stone, netG:net, grossG: round3(net + stone) };
  }
  const gross = round3(num(NI.grossG));
  return { weighedAs:'gross', stoneG:stone, grossG:gross, netG: round3(gross - stone) };
}
function niPiece(){
  const w = niWeights();
  return {
    id:'draft', model:null, code:NI.code, metal:NI.metal, fineness:safeInt(NI.fineness,585),
    grossG:w.grossG, stoneG:w.stoneG, netG:w.netG, weighedAs:w.weighedAs,
    stonesAmd:safeAmd(NI.stonesAmd,0), makingG:safeAmd(NI.makingG,0), cat:NI.cat
  };
}
function openNewItem(){
  NI = niFresh();
  niRender();
}
function niSet(k, v){
  if(!NI) return;
  NI[k] = v;
  if(k === 'metal' && FINENESS[v].indexOf(safeInt(NI.fineness,0)) < 0) NI.fineness = FINENESS[v][0];
  niRender();
}
/* typing must not re-render — that would move the caret. The numeric fields update the draft and
   repaint only the derived readout and the price. */
function niNum(k, v){
  if(!NI) return;
  NI[k] = v;
  niPaint();
}
function niPaint(){
  const w = niWeights(), p = niPiece();
  const el = id => document.getElementById(id);
  try{
    const d = el('niDerived');
    if(d) d.value = gramTxt(NI.weighedAs === 'net' ? w.grossG : w.netG, 3);
    const pv = el('niPreview');
    if(pv) pv.innerHTML = niPreviewHtml(p);
    const sv = el('niSave');
    if(sv) sv.className = 'btn primary' + (niValid(p) ? '' : ' off');
  }catch(e){}
}
function niValid(p){
  return weightsValid(p) && (!NI.costKnown || safeAmd(NI.costAmd,0) > 0);
}
function niPreviewHtml(p){
  if(!weightsValid(p))
    return '<div class="notice bad">' + escH(lang==='hy'
      ? 'Համախառն ≥ քարեր ≥ 0, զուտը՝ 0-ից մեծ։'
      : (lang==='ru' ? 'Брутто ≥ камни ≥ 0, нетто больше нуля.'
                     : 'Gross ≥ stones ≥ 0, and net must be above zero.')) + '</div>';
  const hm = suggestHallmark(p);
  const pre = safeInt(NI.acqDate, S.today) < JUL26;
  return '<div class="row"><span class="mlbl">' + escH(t('pr_computed')) + '</span>'
    + '<span class="big">' + priceOf(p).toLocaleString('en-US') + '<span class="cur">֏</span></span></div>'
    + breakdown(p)
    + '<div class="row" style="margin-top:10px"><span class="mlbl">' + escH(t('w_pure')) + '</span>'
      + '<span>' + gram(pureG(p.netG, p.fineness), 3) + '</span></div>'
    /* the app knows the hallmark exemption and says why, rather than flagging a legitimate item */
    + '<div class="notice">' + escH(hmLabel(hm))
      + (hm === 'exempt_weight' ? ' — ' + fmt('hm_why_weight', { g: (HM_EXEMPT_G[p.metal]||1.5) + ' ' + t('u_g') }) : '')
      + '</div>'
    + '<div class="notice">' + escH(pre ? t('acq_pre') : t('acq_post')) + '</div>';
}
