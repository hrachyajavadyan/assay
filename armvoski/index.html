/* =====================================================================================
   SELF-TEST
   Run voskiSelfTest() from the console. It exercises the ledger the way the product will:
   a receipt, a sale, an adjustment, a partial-sale attempt, a decimal that would break an
   integer clamp, and full trilingual key parity. It runs on a CLONE — a test that could damage
   a jeweller's books is not a test anyone will run.
   ===================================================================================== */
function voskiSelfTest(){
  const out = []; let pass = 0, fail = 0;
  const ok = (name, cond, extra) => { if(cond){ pass++; out.push('ok   ' + name); }
    else { fail++; out.push('FAIL ' + name + (extra ? ' — ' + extra : '')); } };
  const real = S;
  try{
    S = adopt(JSON.parse(JSON.stringify(seedState())));

    ok('seed ledger verifies', verifyLedger().length === 0, JSON.stringify(verifyLedger()));
    ok('seed has 583 stock', trayGroups().some(g => g.fineness === 583));
    ok('seed has a stoned piece', (S.pieces||[]).some(p => p.stoneG > 0));
    ok('seed has pre-Jul26 stock', (S.pieces||[]).some(p => p.acq.preJul26));
    ok('seed has post-Jul26 stock', (S.pieces||[]).some(p => !p.acq.preJul26));
    ok('seed has a scrap pool', poolRows().length > 0);
    ok('seed has an undocumented cost', (S.pieces||[]).some(p => !p.acq.known));

    /* net is derived and locked */
    const i1 = pieceById('i1');
    ok('net = gross − stone', eqG(i1.netG, round3(i1.grossG - i1.stoneG)), i1.netG + ' vs ' + i1.grossG);

    /* a receipt of a decimal weight survives, to the milligram */
    const before = onHand('b:au:585');
    postMove({ subject:'b:au:585', type:'receipt', dq: 12.345, ts: S.today, ref:'T-1' });
    ok('decimal receipt keeps 3dp', eqG(onHand('b:au:585'), round3(before + 12.345)),
       onHand('b:au:585') + ' vs ' + round3(before + 12.345));
    ok('ledger verifies after receipt', verifyLedger().length === 0);

    /* a sale of a whole piece takes it to zero */
    const p2 = pieceById('i2');
    postMove({ subject: pieceSubj('i2'), type:'sale', dq: -p2.netG, ts: S.today, ref:'S-1' });
    ok('sale empties the piece', eqG(onHand(pieceSubj('i2')), 0), String(onHand(pieceSubj('i2'))));
    ok('piece count drops', !pieceRows().some(x => x.p.id === 'i2'));
    ok('ledger verifies after sale', verifyLedger().length === 0);

    /* THE PIECE-INTEGRITY GUARD: a piece cannot be partially sold */
    const p3 = pieceById('i3'), on3 = onHand(pieceSubj('i3'));
    const partial = postMove({ subject: pieceSubj('i3'), type:'sale', dq: -1.0, ts: S.today });
    ok('partial sale refused', partial === false && eqG(onHand(pieceSubj('i3')), on3));
    ok('refusal is reported', LEDGER_REJECTS.some(r => r.reason === 'piece_whole'));

    /* on-hand may never go negative, for any subject */
    const neg = postMove({ subject:'b:au:750', type:'sale', dq: -99999, ts: S.today });
    ok('negative on-hand refused', neg === false);

    /* an adjustment on a bulk pool */
    const b4 = onHand('b:ag:925');
    postMove({ subject:'b:ag:925', type:'adjust', dq:-0.125, ts: S.today, reason:'short' });
    ok('adjustment applies', eqG(onHand('b:ag:925'), round3(b4 - 0.125)));
    ok('ledger verifies after adjustment', verifyLedger().length === 0);

    /* migrate() must not round a weight away — the ArmTrade defect this product is downstream of */
    const snap = JSON.parse(JSON.stringify(S));
    const held = onHand('b:au:585');
    S = adopt(snap);
    ok('migrate keeps decimal grams', eqG(onHand('b:au:585'), held),
       onHand('b:au:585') + ' vs ' + held);
    ok('ledger verifies after migrate', verifyLedger().length === 0);

    /* the fold is commutative: shuffling the log may not change on-hand */
    const sums = rebuildStock();
    S.moves = S.moves.slice().reverse();
    const sums2 = rebuildStock();
    ok('fold is commutative', Object.keys(sums).every(k => eqG(sums[k], sums2[k])));

    /* pricing */
    ok('rateFor is pro rata', rateFor(585,'au') === Math.round(base999()*585/999));
    ok('sellRate applies the margin to the RATE', sellRate('au') === Math.round(base999()*(1+S.cfg.marginPct/100)));
    /* METAL IS A DIMENSION (spec 1.2). Every one of these used to be hardwired to the gold base,
       which priced the seeded 14.2 g silver chain at 720,256 ֏ instead of 21,261 ֏. Assert the
       silver side of every rate, and — the assertion that would actually have caught it — assert
       that a silver piece's price does NOT come off the gold rate. */
    ok('silver 999 rate is the silver one', metalRate999('ag') === safeAmd(S.rate.silver999,0)
       && metalRate999('ag') !== base999());
    ok('sellRate is metal-dimensioned', sellRate('ag') === Math.round(silver999()*(1+S.cfg.marginPct/100))
       && sellRate('ag') !== sellRate('au'), sellRate('ag') + ' vs ' + sellRate('au'));
    ok('rateFor is metal-dimensioned', rateFor(925,'ag') === Math.round(silver999()*925/999));
    /* the buy-in discount is UNSET on a fresh shop and must stay unset — a default here would be
       an invented figure quoted to a walk-in customer. */
    ok('buy discount ships unset', freshCfg().buyDiscPct === null);
    /* A RATE OF NOTHING IS NOT A RATE. Without this the sell sheet priced a 168,972 ֏ ring at
       59,320 ֏ — the making charge and the stones — and committed the sale. */
    ok('a zero metal rate blocks the sale rather than pricing the metal at nothing', (()=>{
      const keep = S.rate.base999;
      S.rate.base999 = 0;
      const p = (S.pieces||[]).find(x => x.metal === 'au' && onHand(pieceSubj(x.id)) > EPS);
      const before = (S.sales||[]).length;
      SL = { id: p.id, price: String(priceOf(p)), touched:false, hdm:'' };
      slConfirm();
      const blocked = (S.sales||[]).length === before;
      SL = null; S.rate.base999 = keep;
      return blocked && metalRate999('au') === keep;
    })());
    ok('unset buy rate is not a number to quote', (()=>{ const k=S.cfg.buyDiscPct; S.cfg.buyDiscPct=null;
        const r = buyRate('au')===0 && buyPriceOf(10,585,'au')===0; S.cfg.buyDiscPct=k; return r; })());
    ok('buyRate applies the discount once set', (()=>{ const k=S.cfg.buyDiscPct; S.cfg.buyDiscPct=12;
        const r = buyRate('au')===Math.round(base999()*0.88); S.cfg.buyDiscPct=k; return r; })());
    /* spelled out against the silver base, not recomputed with the functions under test: the
       weight times the per-gram price of THIS fineness of THIS metal — which is also the act's
       own two operands (see «every buy act row foots» below). */
    ok('buy-in quotes silver at the silver rate', (()=>{ const k=S.cfg.buyDiscPct; S.cfg.buyDiscPct=12;
        const r = buyRate('ag')===Math.round(silver999()*0.88)
               && buyPriceOf(10,925,'ag')===Math.round(10*Math.round(Math.round(silver999()*0.88)*925/999))
               && buyPriceOf(10,925,'ag')!==buyPriceOf(10,925,'au');
        S.cfg.buyDiscPct=k; return r; })());
    ok('null survives migrate', (()=>{ const snap=JSON.parse(JSON.stringify(S)); snap.cfg.buyDiscPct=null;
        return migrate(snap).cfg.buyDiscPct === null; })());
    const pi = pieceById('i1');
    const expect = Math.round(pi.netG*sellRate('au')*pi.fineness/999 + pi.stonesAmd + pi.makingG*pi.grossG);
    ok('price uses NET metal and GROSS making', priceOf(pi) === expect, priceOf(pi) + ' vs ' + expect);
    /* the assertion that fails on a gold-only sellRate. Written against the SILVER rate spelled
       out, not against sellRate(), because recomputing `expect` with the same function under
       test is what let the 34x silver overcharge ship. */
    ok('a silver piece prices off the SILVER rate', (()=>{
      const ag = (S.pieces||[]).filter(p => p.metal === 'ag');
      if(!ag.length) return false;
      return ag.every(p => priceOf(p) === Math.round(
        p.netG * Math.round(safeAmd(S.rate.silver999,0)*(1+num(S.cfg.marginPct)/100)) * p.fineness/999
        + safeAmd(p.stonesAmd,0) + safeAmd(p.makingG,0)*(S.cfg.makingBase==='net' ? p.netG : p.grossG)));
    })(), (()=>{ const p=(S.pieces||[]).find(x=>x.metal==='ag'); return p ? p.id+' -> '+priceOf(p) : 'no silver'; })());
    ok('breakdown renders the numbers', /5\.42|5\.420/.test(breakdown(pi)) && breakdown(pi).indexOf('750/999') > 0);
    ok('80% warning fires', !!fairValueWarn(100000, 70000) && fairValueWarn(100000, 90000) === null);
    /* AT OR BELOW (spec 2.3). A sale at exactly the floor is the case the rule exists for and it
       used to pass in silence; one dram above it is a normal sale. */
    ok('80% warning fires AT the floor and not above it',
       (fairValueWarn(100000, 80000)||{}).pct === 80 && fairValueWarn(100000, 80001) === null);
    /* THE WARNING'S OWN PRINTED FLOOR IS ITS TRIGGER. The sheet prints «80% = {floor}» and the
       jeweller types that figure; testing against the unrounded c*0.8 meant that on every price
       whose 80% rounds DOWN, the exact number the sheet had just named as the limit raised
       nothing at all. Swept over every computed price a piece in this shop can have. */
    ok('a price typed at the printed floor always warns', (()=>{
      for(let c = 1; c <= 400000; c += 7){
        const f = Math.round(c*0.8);
        const w = fairValueWarn(c, f);
        if(!w || w.floor !== f) return false;
        if(f + 1 <= c && fairValueWarn(c, f+1) !== null) return false;
      }
      return true;
    })());
    /* THE HEADLINE MAY NOT CONTRADICT ITS OWN REASON. Math.round put every price in
       [0.795c, 0.8c) at «80%» — a ~1,500 ֏ band on a 300,000 ֏ piece — so the sentence asserted
       that the figure it was warning about was not below the threshold. */
    ok('the warning never rounds its percentage up to the threshold', (()=>{
      for(let m = 1; m <= 80000; m++){
        const w = fairValueWarn(100000, m);
        if(!w) return false;
        if(m < 80000 && w.pct >= 80) return false;
        if(w.pct !== Math.floor(m/1000)) return false;
      }
      return true;
    })());
    /* THE LINE MUST REPRODUCE ITS OWN TOTAL. Re-run the arithmetic from the PRINTED operands
       alone: if the display precision ever creeps back into breakdown(), «3.81» beside a total
       computed from 3.813 disagrees by 94 dram and the one promise the line makes is broken. */
    ok('breakdown reproduces its own total', (S.pieces||[]).every(pc => {
      const nums = String(breakdown(pc)).match(/<b>([^<]+)<\/b>/g).map(x => x.replace(/<\/?b>/g,''));
      const G = x => parseFloat(String(x).replace(/[^0-9.]/g,''));
      const N = x => parseInt(String(x).replace(/[^0-9]/g,''),10);
      let i = 0;
      const netv = G(nums[i++]), rt = N(nums[i++]), fin = N(nums[i++].split('/')[0]);
      let tot = netv*rt*fin/999;
      if(pc.stonesAmd) tot += N(nums[i++]);
      if(pc.makingG){ const mr = N(nums[i++]), mw = G(nums[i++]); tot += mr*mw; }
      /* EXACTLY. It used to tolerate 1 ֏ of drift, which is precisely the defect: breakdown()
         rounded metal and making separately and then summed, while priceOf() rounds once at the
         end, so on roughly a quarter of real 3dp weights the line's own total disagreed with the
         price printed directly above it. Both promises are asserted here. */
      return Math.round(tot) === N(nums[nums.length-1]) && Math.round(tot) === priceOf(pc);
    }));
    /* and on weights a jeweller would actually type, not just on the seed — every seed piece
       happens to have an integral making charge, which is why the seed never showed it. */
    ok('breakdown total === priceOf on 3dp weights', (()=>{
      const F = [375,416,500,583,585,750,916,958,999];
      let seed = 12345;
      const rnd = () => (seed = (seed*1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
      for(let i=0;i<3000;i++){
        const gross = round3(1 + rnd()*20), stone = round3(gross * rnd() * 0.3);
        const p = { metal: rnd() < 0.2 ? 'ag' : 'au', fineness: F[Math.floor(rnd()*F.length)],
                    grossG: gross, stoneG: stone, netG: round3(gross - stone),
                    stonesAmd: Math.round(rnd()*80000), makingG: Math.round(rnd()*8000) };
        const html = String(breakdown(p));
        const nums = html.match(/<b>([^<]+)<\/b>/g).map(x => x.replace(/<\/?b>/g,''));
        const printed = parseInt(String(nums[nums.length-1]).replace(/[^0-9]/g,''),10);
        if(printed !== priceOf(p)) return false;
      }
      return true;
    })());
    /* the valuation pair drifted at the same rate and for the same reason */
    ok('valBreakdown total === valuation', (()=>{
      const pm = pureByMetal();
      const html = valBreakdown(Object.keys(pm).map(m => ({ pure: pm[m], rate: metalRate999(m), metal: m })));
      const nums = html.match(/<b>([^<]+)<\/b>/g).map(x => x.replace(/<\/?b>/g,''));
      return parseInt(String(nums[nums.length-1]).replace(/[^0-9]/g,''),10) === valuation();
    })());

    /* THE PHYSICAL INVARIANT (spec 1.3): the sum of a subject's movements equals what is
       physically at that subject's location. The refining loss is documented by the GAP between
       melt_out and melt_in, not by a third deduction on the source — deducting it twice took
       0.127 g off a pool that had only lost 12.400 g, and cache-equals-log reported clean
       because both sides were wrong together. */
    ok('melt does not deduct the loss twice', (()=>{
      const ms = (S.moves||[]).filter(m => m.subject === 'b:au:585'
        && ['open','receipt','buyin','melt_out'].indexOf(m.type) >= 0);
      const physical = ms.reduce((a,m) => round3(a + num(m.dq)), 0);
      return eqG(onHand('b:au:585'), physical);
    })(), onHand('b:au:585') + ' on hand');
    ok('the loss is still NAMED in the log', (S.moves||[]).some(m => m.type === 'loss'));
    ok('lot basis follows the physical weight', (()=>{
      const l1 = (S.lots||[]).find(l => l.id === 'l1');
      return l1 && eqG(l1.leftG, round3(74.600 - 12.400));
    })(), JSON.stringify(((S.lots||[]).find(l => l.id === 'l1')||{}).leftG));

    /* A RE-WEIGH REWRITES THE PIECE (spec 5.4 + 1.3). adjust/count are exempt from the
       whole-piece rule, and without the record following the ledger a piece's on-hand silently
       diverged from its netG and from its price: the tray listed 5.37 g while the card priced
       5.42 g and nothing reconciled them. */
    ok('a re-weigh keeps piece, ledger and price coherent', (()=>{
      const p = pieceById('i5'); if(!p) return false;
      const sub = pieceSubj(p.id), st = p.stoneG;
      for(let i=0;i<20;i++) postMove({ subject: sub, type:'adjust', dq: (i%2 ? 0.037 : -0.019),
                                       ts: S.today, reason:'reweigh', note:'t'+i });
      const on = onHand(sub), q = pieceById('i5');
      return eqG(on, q.netG) && eqG(q.grossG, round3(q.netG + st))
             && priceOf(q) === Math.round(q.netG*sellRate(q.metal)*q.fineness/999
                  + safeAmd(q.stonesAmd,0) + safeAmd(q.makingG,0)*(S.cfg.makingBase==='net'?q.netG:q.grossG));
    })());
    ok('every on-hand piece still matches its record', (S.pieces||[]).every(p => {
      const on = onHand(pieceSubj(p.id));
      return eqG(on, 0) || eqG(on, num(p.netG));
    }));
    ok('ledger verifies after the re-weighs', verifyLedger().length === 0);

    /* A NON-FINITE ON-HAND IS REPORTED, not coerced to 0 and passed. num() ran before the
       isFinite test, so `nonFinite` was dead code and a cache holding NaN reported clean. */
    ok('verifyLedger catches a NaN cache', (()=>{
      S.stock['b:au:999x'] = NaN;
      const bad = verifyLedger();
      const caught = bad.some(x => x.subject === 'b:au:999x' && x.nonFinite);
      delete S.stock['b:au:999x'];
      return caught;
    })());
    ok('a missing cache entry is 0, not NaN', (()=>{
      const k = 'b:au:585', keep = S.stock[k];
      delete S.stock[k];
      const bad = verifyLedger();
      S.stock[k] = keep;
      return bad.some(x => x.subject === k && !x.nonFinite);
    })());

    /* THE RAW dq IS JUDGED BEFORE IT IS SANITISED. round3() turned NaN and Infinity into 0 and
       clampG() rewrote 1,000,000 to 99,999, so both used to append a permanent row and return
       true. An append-only log cannot be corrected afterwards. */
    ok('NaN dq is refused, not logged as 0', (()=>{
      const n = (S.moves||[]).length;
      const r = postMove({ subject:'b:au:750', type:'receipt', dq: NaN, ts: S.today, ref:'N1' });
      return r === false && (S.moves||[]).length === n
             && LEDGER_REJECTS.some(x => x.reason === 'nonfinite');
    })());
    ok('Infinity dq is refused', (()=>{
      const n = (S.moves||[]).length;
      return postMove({ subject:'b:au:750', type:'receipt', dq: Infinity, ts: S.today, ref:'N2' }) === false
             && (S.moves||[]).length === n;
    })());
    ok('an out-of-range dq is refused, never silently clamped', (()=>{
      const on = onHand('b:au:750'), n = (S.moves||[]).length;
      const r = postMove({ subject:'b:au:750', type:'receipt', dq: 1000000, ts: S.today, ref:'CLAMP' });
      return r === false && (S.moves||[]).length === n && eqG(onHand('b:au:750'), on)
             && LEDGER_REJECTS.some(x => x.reason === 'toobig');
    })());
    ok('every refusal reason has a label', Object.keys(REJ_KEY).every(k =>
      T.hy[REJ_KEY[k]] && T.en[REJ_KEY[k]] && T.ru[REJ_KEY[k]]));
    ok('ledger verifies after the refusals', verifyLedger().length === 0);

    /* hallmark expertise */
    ok('under 1.5 g is exempt by weight', suggestHallmark({ metal:'au', netG:1.2, cat:'earring' }) === 'exempt_weight');
    ok('scrap is exempt as scrap', suggestHallmark({ metal:'au', netG:40, cat:'scrap' }) === 'exempt_scrap');

    /* ---- THE TWO COUNTER FLOWS ----
       The flows themselves are driven by taps, so what is asserted here is the arithmetic and
       the ledger effect they commit — the parts a click-through test cannot check to the
       milligram and the parts a later change is most likely to break. */

    /* the buy line must reproduce its own total, stones included, on weights a jeweller types */
    ok('buy breakdown reproduces its own total', (()=>{
      const keep = S.cfg.buyDiscPct; S.cfg.buyDiscPct = 12;
      const F = [375,416,500,583,585,750,916,958,999];
      let seed = 777, bad = 0;
      const rnd = () => (seed = (seed*1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
      for(let i=0;i<1500;i++){
        const net = round3(0.5 + rnd()*45), f = F[Math.floor(rnd()*F.length)];
        const metal = rnd() < 0.25 ? 'ag' : 'au';
        const st = rnd() < 0.4 ? Math.round(rnd()*60000) : 0;
        const nums = String(buyBreakdown(net, f, metal, st)).match(/<b>([^<]+)<\/b>/g)
          .map(x => x.replace(/<\/?b>/g,''));
        const printed = parseInt(String(nums[nums.length-1]).replace(/[^0-9]/g,''),10);
        if(printed !== buyPriceOf(net, f, metal) + st) bad++;
      }
      S.cfg.buyDiscPct = keep; return bad === 0;
    })());
    /* NO MAKING CHARGE ON THE BUY SIDE. The shop is buying metal, not workmanship. */
    ok('the buy price carries no making charge', (()=>{
      const keep = S.cfg.buyDiscPct; S.cfg.buyDiscPct = 12;
      const r = buyPriceOf(10, 585, 'au') === Math.round(10 * Math.round(buyRate('au') * 585/999));
      S.cfg.buyDiscPct = keep; return r;
    })());
    /* THE ԳՆՄԱՆ ԱԿՏ MUST FOOT. Its «1 գ գին» column times its «Զուտ, գ» column has to give its
       «Գումար, ֏» column EXACTLY — it is a signed two-party document that the customer and the
       accountant both check by hand. The old shape rounded the product while printing a rate
       rounded per gram, and 4,266 of 5,000 acts disagreed, by up to 188 dram. The sweep is over
       the record byConfirm() actually writes, not over the formula. */
    ok('every buy act row foots: rate x net = amount', (()=>{
      const keep = S.cfg.buyDiscPct;
      const F = { au:[375,416,500,583,585,750,916,958,999], ag:[800,830,875,925,960,999] };
      let seed = 424242, bad = 0;
      const rnd = () => (seed = (seed*1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
      for(let i=0;i<5000;i++){
        S.cfg.buyDiscPct = Math.round(rnd()*300)/10;
        const metal = rnd() < 0.3 ? 'ag' : 'au';
        const fl = F[metal], f = fl[Math.floor(rnd()*fl.length)];
        const net = round3(0.2 + rnd()*400);
        const fineRate = buyFineRate(f, metal);        /* what the act's rate column prints */
        const metalAmd = buyPriceOf(net, f, metal);    /* what the act's amount column prints */
        if(Math.round(net * fineRate) !== metalAmd) bad++;
      }
      S.cfg.buyDiscPct = keep; return bad === 0;
    })());
    /* and the customer-facing line is the same two operands, so the act cannot disagree with the
       screen the customer was shown across the counter */
    ok('the buy line and the act quote the same per-gram rate', (()=>{
      const keep = S.cfg.buyDiscPct; S.cfg.buyDiscPct = 12;
      const nums = String(buyBreakdown(12.4, 585, 'au', 0)).match(/<b>([^<]+)<\/b>/g)
        .map(x => x.replace(/<\/?b>/g,''));
      const fr = buyFineRate(585,'au');
      const r = nums.some(x => parseInt(String(x).replace(/[^0-9]/g,''),10) === fr)
        && parseInt(String(nums[nums.length-1]).replace(/[^0-9]/g,''),10) === Math.round(12.4*fr);
      S.cfg.buyDiscPct = keep; return r;
    })());
    /* the act number is never re-used: it is scanned off every reference the shop already holds */
    ok('the act number is fresh and well formed', (()=>{
      const n = nextActNo();
      return /^ԳԱ-\d{4}-\d{4}$/.test(n)
        && !(S.buys||[]).some(b => b && b.id === n)
        && !(S.lots||[]).some(l => l && l.acq && l.acq.docRef === n)
        && !(S.pieces||[]).some(p => p && p.acq && p.acq.docRef === n);
    })(), nextActNo());
    /* a buy-in into a pool: one movement, one lot, and the lots never claim more than the ledger */
    ok('a buy-in opens a lot without over-claiming the pool', (()=>{
      const sub = 'b:au:585', before = onHand(sub), n = (S.moves||[]).length;
      const lid = 'l-test-buyin';
      S.lots.push({ id:lid, subject:sub, inG:5.125, leftG:5.125,
        acq:{ costAmd:150000, stoneCost:0, date:S.today, preJul26:false,
              docType:'buyact', docRef:'ԳԱ-2026-9999', source:'public', known:true } });
      const r = postMove({ subject:sub, type:'buyin', dq:5.125, ts:S.today, cost:150000,
                           ref:'ԳԱ-2026-9999', lot:lid });
      let sum = 0;
      (S.lots||[]).forEach(l => { if(l && l.subject === sub) sum = round3(sum + num(l.leftG)); });
      return r && (S.moves||[]).length === n+1 && eqG(onHand(sub), round3(before + 5.125))
        && sum <= onHand(sub) + EPS && verifyLedger().length === 0;
    })());
    /* a sale takes the WHOLE net weight, and the 80% warning stores both figures */
    ok('a sale empties the piece and the override keeps both figures', (()=>{
      const p = pieceById('i6'); if(!p) return false;
      const sub = pieceSubj(p.id), on = round3(onHand(sub));
      const computed = priceOf(p), manual = Math.round(computed * 0.7);
      const w = fairValueWarn(computed, manual);
      const r = postMove({ subject:sub, type:'sale', dq:-on, ts:S.today,
                           cost:p.acq.costAmd, ref:'ՀԴՄ-TEST' });
      return r && eqG(onHand(sub), 0) && !pieceRows().some(x => x.p.id === 'i6')
        && w && (w.pct === 70 || w.pct === 69) && w.computed === computed && w.manual === manual
        && verifyLedger().length === 0;
    })());
    /* A RESALE BUY-IN MAY NOT THROW AWAY THE STONES IT PAID FOR. The resale branch hardcoded
       `stonesAmd:0`, so a piece created from a buy-in that valued the stones at 60,000 ֏ recorded
       that sum in acq.stoneCost and then priced BELOW its own acquisition cost, with no field
       anywhere in the product to correct it. */
    ok('a resale piece carries the stone value that was paid', (()=>{
      const keep = S.cfg.buyDiscPct; S.cfg.buyDiscPct = 10;
      BY = byFresh();
      BY.metal='au'; BY.fineness=585; BY.weighedAs='gross';
      BY.grossG='6.400'; BY.stoneG='0.900'; BY.stonesAmd='60000';
      BY.dest='resale'; BY.code='ՔԱՐ-TEST'; BY.makingG='5000';
      const paid = byPaid();
      const before = (S.pieces||[]).length;
      byConfirm();
      const made = (S.pieces||[])[ (S.pieces||[]).length - 1 ];
      const r = (S.pieces||[]).length === before + 1
        && made && safeAmd(made.stonesAmd,0) === 60000
        && made.acq.stoneCost === 60000
        && priceOf(made) >= made.acq.costAmd            /* recovers what the shop paid */
        && eqG(onHand(pieceSubj(made.id)), made.netG)
        && paid === made.acq.costAmd
        && verifyLedger().length === 0;
      BY = null; S.cfg.buyDiscPct = keep; closeModal(); return r;
    })());

    /* ՀԴՄ coverage: a share of THIS MONTH's sales, and nothing computed from it (spec 5.3) */
    ok('hdm coverage counts this month only', (()=>{
      const keep = S.sales.slice();
      const prevMonth = Date.UTC(2026,6,4);
      S.sales = [
        { id:'x1', ts:S.today, hdmRef:'A-1', price:1000, fineness:585, netG:1, metal:'au',
          pieceId:'', code:'', name:'', computed:1000, manual:0, warn:null, acqKnown:true, acqCost:0 },
        { id:'x2', ts:S.today, hdmRef:'',    price:1000, fineness:585, netG:1, metal:'au',
          pieceId:'', code:'', name:'', computed:1000, manual:0, warn:null, acqKnown:true, acqCost:0 },

    /* ---- ԳՈՒՅՔԱԳՐՈՒՄ (spec 5.4) ----

    ok('a piece out of the shop is out of scope and listed separately', (()=>{

    /* A COUNT POSTS `count`, WHICH THE PIECE-INTEGRITY GUARD EXEMPTS — that exemption exists so a
       re-weigh (a delta of 0.05 g) is not refused, and it is closed by syncPieceWeight(). */
    ok('a count records absence, a re-weigh and a pool weighing, and the ledger holds', (()=>{
      CNNEW = { scope:'all', counter:'Ա. Հ.', mrp:'Գ. Ս.' };

      const reweigh = rows.find(r => r.kind === 'piece' && r.p.id === 'i1');
      const pool    = rows.find(r => r.kind === 'pool' && r.subject === 'b:au:750');

    /* EVERY ROW OF THE ACT MUST FOOT: actual minus book is the difference, and the difference in

    ok('the count act foots row by row and values the difference in dram', (()=>{
      const a = (S.counts||[])[(S.counts||[]).length-1];
      if(!a || !a.rows.length) return false;

    /* AND THE GRAND TOTAL IS THE SUM OF THE COLUMN. The headline used to be built from per-metal
       pure grams while the column was built per fineness; two roundings, and on a real count the
       act's own printed arithmetic ended 51 ֏ away from the figure printed above it. */
    ok('the act\'s grand total is exactly the sum of its amount column', (()=>{
      const a = (S.counts||[])[(S.counts||[]).length-1];
      if(!a || !a.rows.length) return false;
      const sum = a.rows.reduce((x,r) => x + safeInt(r.amd,0), 0);
      /* the RENDERED line's own operands must give the RENDERED line's own answer */
      openCountAct(a.id);
      const brks = document.querySelectorAll('#modalRoot .brk');
      const brk = brks.length ? brks[brks.length-1] : null;
      /* READ THE LINE THE WAY A PERSON DOES: each term's sign is the operator printed before it. */
      const nums = brk ? [].slice.call(brk.childNodes).reduce((acc, node) => {
        const cls = node.className || '';
        const txt = String(node.textContent || '');
        if(cls === 'op'){ acc.sign = /\u2212/.test(txt) ? -1 : 1; return acc; }
        if(cls === 'eq'){ acc.sign = 1; return acc; }
        if(node.tagName === 'B'){
          const mag = parseInt(txt.replace(/[^0-9]/g,''), 10) || 0;
          acc.out.push((/^\u2212/.test(txt) ? -1 : acc.sign) * mag);
          acc.sign = 1;
        }
        return acc;
      }, { out:[], sign:1 }).out : [];
      closeModal();
      if(nums.length < 2) return false;
      const printedTotal = nums[nums.length-1];
      const printedTerms = nums.slice(0,-1).reduce((x,y) => x + y, 0);
      return sum === printedTotal && printedTerms === printedTotal;
    })());
    /* GRAMS OF DIFFERENT FINENESSES ARE NEVER ADDED TOGETHER (spec 1.4): the act's grand total is
       pure metal, per metal. */
    ok('the act carries a pure-metal grand total, per metal', (()=>{
      const a = (S.counts||[])[(S.counts||[]).length-1];
      const pure = {};
      a.rows.forEach(r => pure[r.metal] = round3((pure[r.metal]||0) + pureG(r.actG, r.fineness)));
      return Object.keys(pure).length > 0 && Object.keys(pure).every(m => isFinite(pure[m]));
    })());
    ok('the act lists the out-of-shop pieces it excluded', (()=>{
      const a = (S.counts||[])[(S.counts||[]).length-1];
      return a.out.length > 0 && a.out.every(o => o.netG > 0 && ['assay','workshop','out'].indexOf(o.location) >= 0);
    })());
    /* NOT REACHED IS NOT MISSING, AND NOT REACHED IS NOT FOUND EITHER. An unvisited subject must
       post nothing, show no difference, AND appear in neither actual column — it belongs to the
       act's own «Չհաշվառված» table, with its metal, its հարգ, its piece count and its book
       weight, so the two halves of the document add back up to the books. */
    ok('an uncounted row is neither surplus nor shortage', (()=>{
      const a = (S.counts||[])[(S.counts||[]).length-1];

      (S.moves||[]).forEach(m => { if(m.ref === a.id && m.type === 'count') subs[m.subject] = 1; });
      /* not one uncounted subject may carry a movement from this act */

    ok('an uncounted subject is in NO actual column, and the act says how many', (()=>{
      S.count = null; CNNEW = { scope:'all', counter:'X', mrp:'Y' };
      cnStart();
      const rows = cnInScope('all');
      const one = rows.find(r => r.kind === 'piece');
      cnMark(one.subject, true);                       /* exactly one subject looked at */
      const built = cnBuildAct();
      S.count = null;
      const uncPcs   = built.unc.reduce((n,u) => n + u.pcs, 0);
      const uncG     = round3(built.unc.reduce((n,u) => n + num(u.g), 0));
      const skipPcs  = built.skipped.filter(x => x.kind !== 'pool').length;
      const skipG    = round3(built.skipped.reduce((n,x) => n + num(x.bookG), 0));
      const bookPcs  = built.rows.reduce((n,r) => n + r.bookPcs, 0);
      const actPcs   = built.rows.reduce((n,r) => n + r.actPcs, 0);
      const bookG    = round3(built.rows.reduce((n,r) => n + num(r.bookG), 0));
      const scopeG   = round3(rows.reduce((n,r) => n + round3(r.on), 0));
      const scopePcs = rows.filter(r => r.kind === 'piece').length;
      /* THE TWO HALVES ADD BACK UP TO THE BOOKS, in pieces and in grams; the counted half holds
         exactly the one subject that was visited; and nothing was posted for the rest. */
      return uncPcs === skipPcs && eqG(uncG, skipG)
             && bookPcs === 1 && actPcs === 1 && (bookPcs + uncPcs) === scopePcs

    /* A MOVEMENT DURING THE SESSION IS NOT A SHORTAGE. The screen invites the jeweller to leave

    ok('a mid-session buy-in on a weighed pool is not a shortage', (()=>{

    /* ---- ՀԱՐԳԱԴՐՈՇՄԱՎՈՐՈՒՄ (spec 5.1) ----

    ok('the app computes the exemption rather than asking for a stamp it does not need', (()=>{

      const heavy = { metal:'au', netG:4.0, cat:'ring',    hallmark:{origin:'none'} };

        && hmState(scrap) === 'exempt_scrap'
        && hmState(heavy) === '' && hmNeeds(heavy)         /* '' means a stamp is wanted */
        && hmState({ metal:'au', netG:9, cat:'ring', hallmark:{origin:'eaeu'} }) === 'eaeu'
        && hmState({ metal:'au', netG:9, cat:'ring', hallmark:{origin:'am_assay'} }) === 'am_assay'

        && eqG(onHand(sub), on0)                            /* still on hand */

        && pieceCount() === pcs0                            /* still counted as stock */
        && q.location === 'assay' && q.hallmark.sentTs === S.today && q.locTs === S.today

      document.body.appendChild(el);

    /* ---- ՎԵՐԱՆՈՐՈԳՈՒՄ: the customer's metal is NEVER the shop's (spec 8) ----

    ok('a repair is in no ledger, no valuation and no count', (()=>{
      const val0 = valuation(), pcs0 = pieceCount(), moves0 = (S.moves||[]).length;
      const stock0 = Object.keys(S.stock||{}).length;
      const id = rpIntake({ custName:'Հ. Պետրոսյան', custPhone:'077', descr:'Կոտրված շղթա',
                            metal:'au', fineness:585, grossG:9.400, priceAmd:12000, dueTs:S.today });
      const r = !!id
        && valuation() === val0 && pieceCount() === pcs0
        && (S.moves||[]).length === moves0
        && Object.keys(S.stock||{}).length === stock0

        && !Object.keys(S.stock||{}).some(k => k.indexOf(id) >= 0)

    /* ---- ՊԱՐՏՔԵՐ: a balance derived from two books, NEVER a running counter ---- */
    ok('a supplier balance is bills minus payments, computed at read time', (()=>{
      const d = debtsFromBooks();
      if(!d.length) return false;
      return d.every(x => {
        const billed = (S.bills||[]).filter(b => b.sup === x.sup).reduce((a,b) => a + safeAmd(b.amd,0), 0);
        const paid   = (S.pays ||[]).filter(p => p.sup === x.sup).reduce((a,p) => a + safeAmd(p.amd,0), 0);
        return x.billed === billed && x.paid === paid && x.balance === billed - paid;

    /* THE ASSERTION THAT MATTERS: there is no stored balance anywhere for one to drift from. */
    ok('no record anywhere carries a stored balance', (()=>{
      const bad = k => k === 'balance' || k === 'bal' || k === 'owed' || k === 'due';
      return (S.sups||[]).every(x => !Object.keys(x).some(bad))
        && (S.bills||[]).every(x => !Object.keys(x).some(bad))
        && (S.pays ||[]).every(x => !Object.keys(x).some(bad));
    })());
    ok('adding a payment moves the balance by exactly that payment', (()=>{
      const sup = (S.sups||[])[0]; if(!sup) return false;
      const before = debtsFromBooks().find(x => x.sup === sup.id).balance;
      S.pays.push({ id:'py-test', sup:sup.id, ts:S.today, amd:50000, ref:'T', note:'' });
      const after = debtsFromBooks().find(x => x.sup === sup.id).balance;
      S.pays = S.pays.filter(x => x.id !== 'py-test');

      const sup = (S.sups||[]).find(x => (S.bills||[]).some(b => b.sup === x.id));
      if(!sup) return false;
      const rows = supBooks(sup.id);
      const d = debtsFromBooks().find(x => x.sup === sup.id);
      return rows.length > 1
        && rows.every((r,i) => i === 0 || rows[i-1].ts <= r.ts)
        && rows[rows.length-1].bal === d.balance;
    })());
    ok('supplier books survive migrate untouched', (()=>{
      const snap = JSON.parse(JSON.stringify(S));
      const before = JSON.stringify(debtsFromBooks());
      S = adopt(snap);
      return JSON.stringify(debtsFromBooks()) === before;
    })());
    /* a supplier debt is not a stock movement: the two books touch neither the ledger nor a gram */
    ok('the two books post no movement and hold no metal', (()=>{
      const n0 = (S.moves||[]).length, v0 = valuation();
      S.bills.push({ id:'bl-test', sup:(S.sups||[])[0].id, ts:S.today, amd:1234, ref:'T', note:'' });
      const r = (S.moves||[]).length === n0 && valuation() === v0 && verifyLedger().length === 0;
      S.bills = S.bills.filter(x => x.id !== 'bl-test');
      return r;
    })());

    /* trilingual parity */
    const hk = Object.keys(T.hy);
    const missEn = hk.filter(k => T.en[k] == null), missRu = hk.filter(k => T.ru[k] == null);
    const extraEn = Object.keys(T.en).filter(k => T.hy[k] == null);
    const extraRu = Object.keys(T.ru).filter(k => T.hy[k] == null);
    ok('EN parity', missEn.length === 0 && extraEn.length === 0, missEn.concat(extraEn).join(','));
    ok('RU parity', missRu.length === 0 && extraRu.length === 0, missRu.concat(extraRu).join(','));
    ok('every movement type has a label', LEDGER.types.every(x => T.hy['mv_'+x] && T.en['mv_'+x] && T.ru['mv_'+x]));

    /* the storage namespace: never an assay_* key */
    ok('no assay_* key', Object.keys(K).every(k => String(K[k]).indexOf('voski_') === 0));
  } finally { S = real; }
  out.push((fail ? 'FAILED ' : 'PASSED ') + pass + '/' + (pass+fail));
  console.log(out.join('\n'));
  return { pass, fail, lines: out };
}

/* =====================================================================================
   BOOT
   ===================================================================================== */
function boot(){
  loadU(); lang = U.lang;
  const stored = loadState();
  S = adopt(stored || seedState());        /* migrate() on EVERY adoption path */
  if(!stored) saveState();
  /* the invariant is asserted at boot, not assumed. If the cache and the log disagree the log
     wins, because the log is the truth and the cache is only a cache. */
  const bad = verifyLedger();
  if(bad.length){ console.warn('ArmVoski: ledger cache disagreed on', bad.length, 'subjects — rebuilding'); healLedger(); saveState(); }
  renderAll();
  swWantCyrillic();
  window.addEventListener('resize', () => { try{ renderNav(); }catch(e){} });
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape' || e.key === 'Esc'){ try{ if(escClose()) e.preventDefault(); }catch(err){} }
  });
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
}
try{ boot(); }catch(e){ try{ renderRecovery(e); }catch(e2){ console.error(e, e2); } }
</script>
