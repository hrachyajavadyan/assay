/* =====================================================================================
   THE LEDGER (spec 1.3, 4)
   S.moves is append-only: never edited, never re-ordered. On-hand is SUM(dq) and S.stock is only
   a cache of that sum. postMove() is THE ONLY WAY on-hand is ever allowed to change.

   The domain registration, in the shape the core analysis specifies. It is a real object, not a
   comment: every rule below is read from it, so changing a rule is changing one line here.
   ===================================================================================== */
const LEDGER = {
  cacheKey: 'stock',
  subject: ev => ev.subject,
  delta:   ev => num(ev.dq),
  zero:    0,
  fold:    (a,d) => a + d,
  /* NOT ===. Accumulated float error over a thousand gram movements would make an exact
     comparison spuriously unequal and the app would "heal" the ledger in a loop. */
  eq:      (a,b) => Math.abs(a-b) < EPS,
  /* NOT safeInt. A shop with 12.35 g on hand must not lose 0.35 g on every migration. */
  clamp:   clampG,
  round:   round3,
  identity:['subject','type','dq','ts'],
  /* `+` is commutative, so the fold needs no sort and the log needs no order field. Do not add
     one: an order field would make two devices' merges depend on who wrote first. */
  order:   null,
  validate: pieceIntegrityGuard,
  types:   ['open','receipt','buyin','sale','return','writeoff','melt_out','melt_in','loss','count','adjust']
};
const UNITS = { default:'g', list:['g','pcs'], decimals:3, display:2 };

const onHand = subject => num((S.stock||{})[subject]);
const pieceById = id => (S.pieces||[]).find(p => p && p.id === id) || null;

/* ---- the piece-integrity guard (spec 1.3) ----
   A piece cannot be partially sold. It is a bulk pool of one: it enters at +netG and leaves at
   -netG, so after any movement its on-hand is either zero or its full net weight.

   THE ONE DOCUMENTED EXCEPTION is `adjust` and `count`. Spec 5.4 gives the jeweller a re-weigh
   affordance during a stock count that "records the new weight as an adjustment with a reason",
   and such an adjustment is a DELTA — 0.05 g, not 5.42 g — so the whole-piece rule would refuse
   the one movement the count act needs. For those two types the guard falls back to the rule
   that holds for every subject in the ledger: on-hand may not go negative.

   THE LOOP THAT EXCEPTION OPENS IS CLOSED BY syncPieceWeight() BELOW, and the two must be read
   together. On their own these two types let a piece's on-hand drift away from its recorded
   netG — the tray listing 5.37 g while the card priced 5.42 g, with nothing reconciling them —
   which breaks spec 1.3's rule that after any movement a piece's on-hand is either zero or its
   full net weight. It is not the guard that restores that rule (a re-weigh is legitimate and
   must not be refused); it is the piece record following the ledger. Do not remove either half
   without rewriting the other. */
function pieceIntegrityGuard(mv, cur){
  if(!mv.subject) return 'nosubject';
  const dq = num(mv.dq);
  if(!isFinite(dq)) return 'nonfinite';
  const after = cur + dq;
  if(after < -EPS) return 'negative';
  if(!isPieceSubj(mv.subject)) return '';
  if(mv.type === 'adjust' || mv.type === 'count') return '';
  const p = pieceById(subjPieceId(mv.subject));
  const net = p ? num(p.netG) : 0;
  if(!(eqG(after, 0) || eqG(after, net))) return 'piece_whole';
  return '';
}
const REJ_KEY = { piece_whole:'rej_piece_whole', negative:'rej_negative',
                  nonfinite:'rej_nonfinite', nosubject:'rej_nosubject', toobig:'rej_toobig' };

/* ---- the other half of the adjust/count exception (spec 5.4, 1.3) ----
   A re-weigh is the ONE movement that changes what a piece weighs, so it is the one movement
   that must also change the piece RECORD. Without this the ledger says 5.37 g, p.netG still
   says 5.42 g, priceOf() still charges for 5.42 g and the tray and the card contradict each
   other on the same screen. Stones are not re-weighed by an adjustment of the metal, so gross
   follows net and stoneG is left alone. A movement that takes the piece to zero is the piece
   LEAVING, not a re-weigh, so its recorded weight stands. */
function syncPieceWeight(mv){
  if(!isPieceSubj(mv.subject)) return;
  if(mv.type !== 'adjust' && mv.type !== 'count') return;
  const p = pieceById(subjPieceId(mv.subject));
  if(!p) return;
  const after = round3(onHand(mv.subject));
  if(after <= EPS) return;
  p.netG = after;
  p.grossG = round3(after + num(p.stoneG));
}

/* the content-addressed uuid. The ordinal counts movements ALREADY in the log carrying the same
   identity, so a replay of one movement is a no-op while two genuinely distinct identical-looking
   adjustments on the same day stay two rows. */
function moveUuid(mv){
  const key = moveKey(mv);
  let ord = 0;
  const ms = S.moves || [];
  for(let i=0;i<ms.length;i++){ if(ms[i] && moveKey(ms[i]) === key) ord++; }
  return contentId('m-', key, ord);
}

function postMove(m){
  if(!m || !m.subject || !m.type) return false;
  if(!Array.isArray(S.moves)){ S.moves = []; S.moveSeq = S.moveSeq || 0; }
  if(!S.stock || typeof S.stock !== 'object') S.stock = {};
  /* THE RAW NUMBER IS JUDGED BEFORE IT IS SANITISED. round3() turns NaN and Infinity into 0 and
     clampG() silently rewrites 1,000,000 to 99,999, so validating the sanitised value can never
     see either — a non-finite weight used to append a permanent 0-gram row and return true, and
     a fat-fingered million used to post 99,999 g of gold as a legitimate receipt with nothing
     anywhere saying the number had been changed. AN APPEND-ONLY LOG CANNOT BE CORRECTED
     AFTERWARDS, so a number the operator did not choose must never enter it in silence: both
     are REFUSED and reported. */
  const rawDq = +m.dq;
  const rawBad = !isFinite(rawDq) ? 'nonfinite'
               : (Math.abs(rawDq) > MOVE_G_MAX ? 'toobig' : '');
  if(rawBad){
    LEDGER_REJECTS.push({ subject:String(m.subject), type:String(m.type), dq:rawDq, reason:rawBad, at:Date.now() });
    if(LEDGER_REJECTS.length > 200) LEDGER_REJECTS = LEDGER_REJECTS.slice(-100);
    return false;
  }
  const mv = {
    n: 0,
    uuid: '',
    ts: m.ts == null ? S.today : safeInt(m.ts, S.today),
    rts: Date.now(),
    subject: String(m.subject),
    type: String(m.type),
    /* THE ONE PLACE A WEIGHT IS ROUNDED — at the edge, as it enters the log. The running total
       is never rounded; eqG() is what absorbs the drift. */
    dq: LEDGER.clamp(m.dq),
    /* the acquisition cost this movement carried, in whole dram. Money is an integer; only
       weight is decimal. */
    cost: m.cost == null ? 0 : safeAmd(m.cost, 0),
    ref: m.ref ? String(m.ref) : '',
    reason: m.reason ? String(m.reason) : '',
    actor: m.actor ? String(m.actor) : 'shop',
    note: m.note ? String(m.note) : '',
    lot: m.lot ? String(m.lot) : ''
  };
  const cur = onHand(mv.subject);
  const bad = LEDGER.validate(mv, cur);
  if(bad){
    /* diagnostic, not a record: the ledger itself is append-only, this is only what the UI
       needs to say WHY a movement was refused. Capped, because a tab a jeweller leaves open
       all day must not grow a list nobody reads. */
    LEDGER_REJECTS.push({ subject:mv.subject, type:mv.type, dq:mv.dq, reason:bad, at:Date.now() });
    if(LEDGER_REJECTS.length > 200) LEDGER_REJECTS = LEDGER_REJECTS.slice(-100);
    return false;
  }
  const uuid = m.uuid || moveUuid(mv);
  if(S.moves.some(x => x && x.uuid === uuid)) return false;   // replaying the same move is a no-op
  mv.uuid = uuid;
  mv.n = ++S.moveSeq;
  S.moves.push(mv);
  /* THE ONLY WRITE TO THE ON-HAND CACHE IN THE WHOLE PRODUCT, and it goes through
     LEDGER.clamp — which spec 4 registers as round3 precisely so the persisted cache is decimal
     grams to 3 dp on every path. It used to fold raw floats, so `128.4` came back from a reload
     as `128.39999999999998`: verifyLedger()'s epsilon and pieceRows()' `on > EPS` hid it on the
     screen, but the cache is what gets PERSISTED and (spec 9) synced as an opaque blob, and two
     devices folding the same log in a different order then produce different bytes for the same
     shop. rebuildStock() clamps at every step for the same reason and in the same order, so the
     two writers agree exactly rather than within an epsilon. */
  S.stock[mv.subject] = LEDGER.clamp(LEDGER.fold(onHand(mv.subject), LEDGER.delta(mv)));
  /* the piece record follows the ledger, not the other way round: see syncPieceWeight. This is
     part of the write, not an annotation — leaving it out is what let on-hand and netG diverge. */
  syncPieceWeight(mv);
  /* lots are a derived annotation, so a failure here may never block a ledger move */
  try{ reconcileLots(mv); }catch(e){}
  return true;
}
function postMoves(arr){ let n = 0; (arr||[]).forEach(m => { if(postMove(m)) n++; }); return n; }

function rebuildStock(){
  const c = {};
  /* clamped at every step, exactly as postMove's incremental write is — see the note there. */
  (S.moves||[]).forEach(m => { if(m && m.subject)
    c[m.subject] = LEDGER.clamp(LEDGER.fold(c[m.subject]||LEDGER.zero, LEDGER.delta(m))); });
  return c;
}
/* the invariant is not "cache equals rebuild". It is "on-hand is a real number AND equals the sum
   of the movements", so it is stated that way: a NaN on both sides used to pass an === test in
   silence and report clean to every caller that only counts entries. */
function verifyLedger(){
  const rb = rebuildStock(), out = [], subs = {};
  Object.keys(S.stock||{}).forEach(k => subs[k] = 1);
  Object.keys(rb).forEach(k => subs[k] = 1);
  Object.keys(subs).forEach(sub => {
    /* NOT num(). num() coerces NaN and Infinity to 0, so running it first made the isFinite
       test below impossible to fail and `nonFinite` dead code: a cache holding NaN reported
       clean. A subject absent from one side is genuinely 0; a subject PRESENT and non-finite
       is the thing this branch exists to catch, and the two must not be conflated. */
    const cRaw = (S.stock||{})[sub], rRaw = rb[sub];
    const cached = cRaw === undefined || cRaw === null ? 0 : +cRaw;
    const rebuilt = rRaw === undefined || rRaw === null ? 0 : +rRaw;
    if(!isFinite(cached) || !isFinite(rebuilt)) out.push({ subject:sub, cached, rebuilt, nonFinite:true });
    else if(!LEDGER.eq(cached, rebuilt)) out.push({ subject:sub, cached, rebuilt });
  });
  return out;
}
/* re-derive the cache from the log. Called at boot, and offered on the Data screen because a
   shopkeeper who has been told the ledger disagrees needs a way to act on it. */
function healLedger(){ S.stock = rebuildStock(); }

function movesFor(subject, limit){
  const all = (S.moves||[]).filter(m => m && m.subject === subject).slice()
    .sort((a,b) => ((a.ts||0)-(b.ts||0)) || ((a.n||0)-(b.n||0)));
  let bal = 0;
  const rows = all.map(m => { bal = round3(bal + num(m.dq)); return Object.assign({}, m, { bal }); });
  return rows.slice(-(limit||50)).reverse();
}

/* ---- lots (spec 1.6) ----
   ArmTrade's batch mechanism, renamed and RE-MEANINGED. A batch annotates a SKU with EXPIRY and
   consumes FEFO. A lot annotates a bulk pool with ACQUISITION COST and consumes FIFO BY
   ACQUISITION DATE, because the margin scheme requires knowing which cost basis a sold gram
   consumed. Same code, same `sum(left) <= onHand` invariant enforced in the same single place,
   different ordering rule, completely different reason for existing.
   DO NOT "FIX" THIS BACK TO FEFO. Gold does not expire. */
function lotsFor(subject){
  return (S.lots||[]).filter(l => l && l.subject === subject && l.leftG > EPS)
    .sort((a,b) => (a.acq && a.acq.date || 0) - (b.acq && b.acq.date || 0));   /* FIFO by acquisition date */
}
function reconcileLots(mv){
  if(!isPoolSubj(mv.subject)) return;
  if(mv.dq < 0){
    let need = -mv.dq;
    lotsFor(mv.subject).forEach(l => {
      if(need <= EPS) return;
      const take = Math.min(l.leftG, need);
      l.leftG = round3(l.leftG - take);
      need = round3(need - take);
    });
  }
  /* the invariant, enforced in exactly one place: the lots may never claim more metal than the
     ledger says is there. */
  const oh = onHand(mv.subject);
  let sum = 0;
  (S.lots||[]).forEach(l => { if(l && l.subject === mv.subject) sum = round3(sum + num(l.leftG)); });
  if(sum > oh + EPS){
    let over = round3(sum - oh);
    lotsFor(mv.subject).reverse().forEach(l => {
      if(over <= EPS) return;
      const cut = Math.min(l.leftG, over);
      l.leftG = round3(l.leftG - cut); over = round3(over - cut);
    });
  }
}

/* =====================================================================================
   PRICING (spec 2)
   One number is maintained — the Central Bank's daily AMD price for one gram of 999 gold — and
   every other rate is DERIVED, never stored. This is exactly how the CB publishes and how the
   market derives, and it is what ARMGOLD already does.
   ===================================================================================== */
const base999 = () => safeAmd(S.rate && S.rate.base999, 0);
const silver999 = () => safeAmd(S.rate && S.rate.silver999, 0);
/* METAL IS A DIMENSION, NOT AN ASSUMPTION (spec 1.2). ARMGOLD, whose formula this product
   inherits, is gold-only, and every rate below used to be hardwired to the gold base — which
   priced a 14.2 g silver chain at the gold rate, a 34x overcharge. There is exactly ONE place
   that answers "what is a gram of this metal worth", and every rate is derived from it. */
const metalRate999 = m => m === 'ag' ? silver999() : base999();
const rateFor  = (f, metal) => Math.round(metalRate999(metal) * safeInt(f,0) / 999);
const sellRate = metal => Math.round(metalRate999(metal) * (1 + num(S.cfg.marginPct)/100));
const buyDiscSet = () => S.cfg.buyDiscPct != null;
/* 0 when the discount has never been set: there is no honest buy rate to show, and a caller that
   renders 0 renders a dash (see rateCard) rather than a number nobody chose. */
const buyRate  = metal => buyDiscSet() ? Math.round(metalRate999(metal) * (1 - num(S.cfg.buyDiscPct)/100)) : 0;

/* which weight the making charge multiplies. Owner decision: GROSS. The setting exists and the
   breakdown line names it, so the answer is visible rather than buried. */
const makingWeight = p => S.cfg.makingBase === 'net' ? num(p.netG) : num(p.grossG);

/* the finished-item sale price. ARMGOLD's formula with netG made explicit. It is the trade's own
   decomposition and it does not change. */
function priceOf(p){
  const metal = num(p.netG) * sellRate(p.metal) * safeInt(p.fineness,0) / 999;
  const stones = safeAmd(p.stonesAmd, 0);
  const making = safeAmd(p.makingG, 0) * makingWeight(p);
  return Math.round(metal + stones + making);
}
/* what the shop pays a walk-in for metal. NO MAKING CHARGE — the shop is buying metal, not
   workmanship — and stones default to zero because a shop buying scrap does not pay for them. */
/* THE PER-GRAM PRICE OF ONE FINENESS — the figure the shop quotes across the counter, the figure
   the buy screen's rate card already prints, and THE FIGURE THE ԳՆՄԱՆ ԱԿՏ'S «1 գ գին» COLUMN
   CARRIES. It is the primitive on the buy side and buyPriceOf multiplies it, because the act is a
   signed two-party document that a customer and an accountant both check by hand: ITS OWN
   OPERANDS MUST GIVE ITS OWN ANSWER — the same rule breakdown() obeys and the same rule the
   specification's own worked example follows (12.400 x 26,700 = 331,080).
   Rounding the product instead — round(net x buyRate x f/999) — while printing a per-gram rate
   rounded separately made 4,266 of 5,000 acts fail to foot, by up to 188 dram. */
const buyFineRate = (fineness, metal) => Math.round(buyRate(metal) * safeInt(fineness,0) / 999);
function buyPriceOf(netG, fineness, metal){
  if(!buyDiscSet()) return 0;
  return Math.round(num(netG) * buyFineRate(fineness, metal));
}

/* ---- THE BREAKDOWN LINE — MANDATORY ----
   The whole formula with the actual numbers substituted, one line, under the figure. A jeweller
   checks it against the number in his head. This is the single best thing in ARMGOLD and NO
   COMPUTED MONEY MAY APPEAR ANYWHERE IN THIS PRODUCT WITHOUT ONE. If you are adding a screen
   that shows a price, you are adding a call to this function. */
function breakdown(p){
  const sr = sellRate(p.metal), f = safeInt(p.fineness,0);
  const metal = num(p.netG) * sr * f / 999;
  const stones = safeAmd(p.stonesAmd, 0);
  const mkRate = safeAmd(p.makingG, 0), mkW = makingWeight(p);
  const making = mkRate * mkW;
  const parts = [];
  /* THE BREAKDOWN LINE PRINTS WEIGHTS AT FULL STORED PRECISION (3dp), never at the shop's
     DISPLAY precision. The display setting exists so a tray of two-decimal figures scans
     cleanly; this line exists so the jeweller can reproduce the total in his head. Printing
     «3.81» beside a total computed from 3.813 makes the two disagree by 94 dram — small, and
     fatal, because the ONE promise this line makes is that its own numbers give its own answer. */
  parts.push('<b>' + gramTxt(p.netG, 3) + t('u_g') + '</b>'
    + '<span class="op">&times;</span>' + '<b>' + sr.toLocaleString('en-US') + '</b>'
    + '<span class="op">&times;</span>' + '<b>' + f + '/999</b>');
  if(stones) parts.push('<b>' + stones.toLocaleString('en-US') + '</b>');
  if(mkRate) parts.push('<b>' + mkRate.toLocaleString('en-US') + '</b><span class="op">&times;</span><b>'
    + gramTxt(mkW, 3) + t('u_g') + '</b>');
  const why = [];
  why.push(t(S.cfg.makingBase === 'net' ? 'pr_base_net' : 'pr_base_gross'));
  why.push(fmt('pr_margin_note', { p: pctTxt(S.cfg.marginPct) }));
  return '<div class="brk">' + parts.join('<span class="op">+</span>')
    /* ROUNDED ONCE, ON THE SUM — not per term. Rounding metal and making separately and then
       adding them made the line's own printed total disagree with the price printed directly
       above it by 1 ֏ on about a quarter of real 3dp weights. The one promise this line makes
       is that its own operands give its own answer AND that its answer is the price shown, so
       it must round exactly where priceOf() rounds. */
    + '<span class="eq">=</span><b>' + Math.round(metal + stones + making).toLocaleString('en-US') + ' ֏</b>'
    + '<span class="why">' + escH(why.join(' · ')) + '</span></div>';
}
function buyBreakdown(netG, fineness, metal, stonesAmd){
  /* WITHOUT A DISCOUNT THERE IS NO BUY RATE, so there is no line to print. Printing one anyway
     would put «x 0 =» in front of a customer, which is worse than saying the setting is missing. */
  if(!buyDiscSet()) return '<div class="notice bad">' + escH(t('by_needrate')) + '</div>';
  const br = buyRate(metal), f = safeInt(fineness,0), fr = buyFineRate(f, metal);
  const st = safeAmd(stonesAmd, 0);
  const paid = buyPriceOf(netG, fineness, metal) + st;
  /* THE WHY-LINE IS PROSE, SO IT USES PROSE STRINGS. It used to splice in `w_buydisc`, which is a
     SETTINGS FIELD LABEL — «Գնման զեղչ %» — beside a value that already carries its own «%», so
     the customer read «Գնման զեղչ % 12%»; and when the stones were valued it substituted
     `by_stones_lbl` «Քարերի գումարը (֏)», a form label complete with its unit in brackets,
     dropped into an explanatory sentence. */
  const why = [ st ? t('pr_buy_stones') : t('pr_buy_nostones'),
                fmt('pr_buy_disc', { p: pctTxt(S.cfg.buyDiscPct) }) ];
  /* TWO STAGES, EACH OF WHICH FOOTS. The first reduces the 999 buy rate to this fineness and is
     the exact number the act's «1 գ գին» column prints; the second multiplies it by the weight
     and is the exact row the act prints. Folded into one line, the printed per-gram figure and
     the printed total came from two different roundings and disagreed by up to half a dram per
     gram — on the one document the customer checks in his head. */
  return '<div class="brk">'
    + '<b>' + br.toLocaleString('en-US') + '</b>'
    + '<span class="op">&times;</span><b>' + f + '/999</b>'
    + '<span class="eq">=</span><b>' + fr.toLocaleString('en-US') + ' ֏/' + t('u_g') + '</b>'
    + '</div>'
    + '<div class="brk"><b>' + gramTxt(netG, 3) + t('u_g') + '</b>'
    + '<span class="op">&times;</span><b>' + fr.toLocaleString('en-US') + '</b>'
    + (st ? '<span class="op">+</span><b>' + st.toLocaleString('en-US') + '</b>' : '')
    + '<span class="eq">=</span><b>' + paid.toLocaleString('en-US') + ' ֏</b>'
    + '<span class="why">' + escH(why.join(' · ')) + '</span></div>';
}

/* the valuation of a quantity of metal is computed money, so it gets a breakdown line too:
   pure grams, the 999 rate, the product. One helper, used by the tray group headers, the
   pure-metal total and the bulk pool sheet, so the three can never drift apart. */
function valBreakdown(terms){
  /* rounded once, on the sum — same rule as breakdown(), and the same reason: valuation()
     rounds once too, and a KPI that disagrees with the line under it by 1 ֏ is a KPI nobody
     trusts. */
  const total = Math.round(terms.reduce((a,x) => a + x.pure * x.rate, 0));
  return '<div class="brk">'
    /* each operand carries its metal: two metals' 999 rates appear in one sum and «999 գին»
       is singular, so without the label the line does not stand alone. */
    + terms.map(x => (x.metal ? '<span class="mn">' + escH(metalLabel(x.metal)) + '</span>' : '')
        + '<b>' + gramTxt(x.pure,3) + t('u_g') + '</b><span class="op">&times;</span><b>'
        + safeAmd(x.rate,0).toLocaleString('en-US') + '</b>').join('<span class="op">+</span>')
    + '<span class="eq">=</span><b>' + total.toLocaleString('en-US') + ' \u058F</b>'
    + '<span class="why">' + escH(t('brk_val')) + '</span></div>';
}

/* ---- the 80%-of-fair-value warning (spec 2.3) ----
   A sale at or below 80% of fair value is recalculated by the tax authority at 80% of fair value.
   So a discount deeper than 20% is not a commercial decision, it is a tax event. This is a
   WARNING, NEVER A BLOCK: blocking a customer at the counter over a tax rule is not acceptable
   behaviour in a shop, and the jeweller may have a reason. Both figures are returned so the sale
   record can carry them for the accountant. */
function fairValueWarn(computed, manual){
  const c = safeAmd(computed,0), m = safeAmd(manual,0);
  /* THE THRESHOLD IS THE FIGURE THE WARNING ITSELF PRINTS. The sub-line reads
     «Հաշվարկված՝ 303,197 ֏ · 80% = 242,558 ֏ · Ձեր գինը՝ …», so 242,558 is the number the
     jeweller is being asked to compare against and it must be the number that trips the warning.
     Testing against the unrounded c*0.8 instead let a price typed at the printed floor pass in
     silence whenever c*0.8 rounded DOWN — 265,301 prints a floor of 212,241 and 212,241 is above
     212,240.8, so the one price the sheet had just told him was the limit raised nothing.
     AT OR BELOW, not below: spec 2.3 opens «A sale at or below 80% of fair value is
     recalculated», so a sale exactly at the floor is the case the rule exists for. */
  const floor = Math.round(c * 0.8);
  if(!c || !m || m > floor) return null;
  /* FLOOR THE PERCENTAGE, NEVER ROUND IT. Math.round put every price in [0.795c, 0.8c) at «80%»,
     so the headline asserted that the very figure it was warning about was not below the
     threshold — a ~1,500 ֏ wide band on a 300,000 ֏ piece where the warning contradicted its own
     stated reason. */
  /* THE PERCENTAGE IS TAKEN AGAINST THE PRINTED FLOOR, NOT AGAINST c. Flooring m*100/c is right
     for the wider band, but at the floor itself it left a ~1 ֏ window where the headline said
     «79%» directly above a sub-line calling the identical figure 80%: the sheet names 232,038 as
     the floor, and floor(232038*100/290048) is 79. A price AT the printed floor is, by the
     document's own arithmetic, 80%. */
  const pct = m >= floor ? 80 : Math.floor(m*100/c);
  return { computed:c, floor: floor, manual:m, pct: pct };
}

/* =====================================================================================
   MIGRATION (spec 4, 9)
   Idempotent and STRICTLY ADDITIVE. It runs on EVERY adoption path — first boot, reload, a
   restored last-known-good, and (when sync lands) every state adopted from a room — so a device
   running an older build can never white-screen this one. It defaults and clamps every key.

   THE ONE THING IT MUST NOT DO is round a weight with an integer function. ArmTrade's migrate()
   does exactly that at line 3349 (`safeInt` on the on-hand cache) and a shop with 12.35 g on hand
   loses 0.35 g on every load; the ledger then disagrees with the cache for ever. Here the cache
   goes through LEDGER.clamp, which is round3.
   ===================================================================================== */
function migrate(st){
  if(!st || typeof st !== 'object') return freshState();

  st.v = Math.max(0, safeInt(st.v, 0));
  st.seq = Math.max(1, safeInt(st.seq, 1));
  st.today = safeInt(st.today, Date.UTC(2026,7,19));

  /* ---- settings ---- */
  const d = freshCfg();
  if(!st.cfg || typeof st.cfg !== 'object') st.cfg = {};
  st.cfg.shopName = String(st.cfg.shopName == null ? d.shopName : st.cfg.shopName).slice(0,80);
  st.cfg.tin = String(st.cfg.tin == null ? d.tin : st.cfg.tin).replace(/[^0-9]/g,'').slice(0,12);
  st.cfg.marginPct = Math.max(0, Math.min(200, num(st.cfg.marginPct != null ? st.cfg.marginPct : d.marginPct)));
  /* null means UNSET and must survive migration as null; 0 means "we pay spot", which is a
     different (and legitimate) answer. Collapsing the two would invent the number this setting
     exists to avoid inventing. */
  st.cfg.buyDiscPct = (st.cfg.buyDiscPct == null || st.cfg.buyDiscPct === '' || !isFinite(+st.cfg.buyDiscPct))
    ? null : Math.max(0, Math.min(90, num(st.cfg.buyDiscPct)));
  st.cfg.makingBase = st.cfg.makingBase === 'net' ? 'net' : 'gross';
  st.cfg.gramDp = st.cfg.gramDp === 3 ? 3 : 2;
  st.cfg.hmDays = Math.max(1, Math.min(365, safeInt(st.cfg.hmDays != null ? st.cfg.hmDays : d.hmDays, 14)));
  st.cfg.hmOffice = String(st.cfg.hmOffice == null ? d.hmOffice : st.cfg.hmOffice).slice(0,60);
  st.cfg.regime = ['micro','turnover','vat'].indexOf(st.cfg.regime) >= 0 ? st.cfg.regime : '';
  /* NO TAX RATE SHIPS. The retail turnover rate is single-sourced at 10% against a long-standing
     5%, and the producer VAT floor is a genuine conflict between two sources. The owner types a
     number his accountant gave him, or the reports say nothing. A wrong tax number would be far
     worse than none. */
  st.cfg.taxRate = Math.max(0, Math.min(100, num(st.cfg.taxRate)));

  /* ---- the rate ---- */
  if(!st.rate || typeof st.rate !== 'object') st.rate = {};
  st.rate.base999 = safeAmd(st.rate.base999, 0);
  st.rate.silver999 = safeAmd(st.rate.silver999, 0);
  st.rate.at = Math.max(0, safeInt(st.rate.at, 0));
  st.rate.src = st.rate.src === 'cb' ? 'cb' : 'manual';
  st.rate.by = String(st.rate.by || 'shop').slice(0,24);

  const arr = k => { if(!Array.isArray(st[k])) st[k] = []; };
  ['models','pieces','pools','lots','moves','sales','buys','counts','repairs','hmSends',
   'sups','bills','pays'].forEach(arr);

  /* ---- models: catalogue rows, no quantity, never in the ledger ---- */
  st.models = st.models.filter(m => m && m.id).map(m => ({
    id: String(m.id).slice(0,24),
    cat: CATS.indexOf(m.cat) >= 0 ? m.cat : 'other',
    metal: METALS.indexOf(m.metal) >= 0 ? m.metal : 'au',
    fineness: safeInt(m.fineness, 585),
    name: String(m.name || '').slice(0,60),
    code: String(m.code || '').slice(0,24),
    makingG: safeAmd(m.makingG, 0),
    note: String(m.note || '').slice(0,200)
  }));

  /* ---- pieces ---- */
  st.pieces = st.pieces.filter(p => p && p.id).map(p => {
    const metal = METALS.indexOf(p.metal) >= 0 ? p.metal : 'au';
    const w = deriveWeights({
      weighedAs: p.weighedAs === 'net' ? 'net' : 'gross',
      grossG: p.grossG, stoneG: p.stoneG, netG: p.netG
    });
    const acq = p.acq && typeof p.acq === 'object' ? p.acq : {};
    const hm = p.hallmark && typeof p.hallmark === 'object' ? p.hallmark : {};
    const date = Math.max(0, safeInt(acq.date, 0));
    return {
      id: String(p.id).slice(0,24),
      model: p.model ? String(p.model).slice(0,24) : null,
      code: String(p.code || '').slice(0,24),
      metal: metal,
      fineness: safeInt(p.fineness, 585),
      grossG: w.grossG, stoneG: w.stoneG, netG: w.netG, weighedAs: w.weighedAs,
      stonesAmd: safeAmd(p.stonesAmd, 0),
      makingG: safeAmd(p.makingG, 0),
      priceManual: p.priceManual ? safeAmd(p.priceManual, 0) : 0,
      acq: {
        costAmd: safeAmd(acq.costAmd, 0),
        stoneCost: safeAmd(acq.stoneCost, 0),
        date: date,
        /* STORED, NOT DERIVED. A device clock change, a timezone bug or a later legal change must
           not be able to silently reclassify old stock into the other tax treatment. It is
           back-filled from the date only when the flag is genuinely absent. */
        preJul26: acq.preJul26 === true || acq.preJul26 === false
                    ? !!acq.preJul26 : (date > 0 && date < JUL26),
        docType: ['invoice','buyact','customs','opening','none'].indexOf(acq.docType) >= 0 ? acq.docType : 'none',
        docRef: String(acq.docRef || '').slice(0,40),
        source: String(acq.source || 'opening').slice(0,32),
        known: acq.known !== false
      },
      hallmark: {
        origin: ['am_assay','eaeu','exempt_weight','exempt_scrap','exempt_other','none'].indexOf(hm.origin) >= 0 ? hm.origin : 'none',
        makerMark: !!hm.makerMark,
        sentTs: Math.max(0, safeInt(hm.sentTs, 0)),
        backTs: Math.max(0, safeInt(hm.backTs, 0)),
        docRef: String(hm.docRef || '').slice(0,40),
        office: String(hm.office || '').slice(0,60),
        /* WHERE THE PIECE CAME FROM when it was handed over. A return used to put every piece in
           the tray unconditionally, which silently moved safe stock into the display case — and
           then changed what a Ցուցափեղկ-scoped count expected to find. Defaults to the tray for
           records written before this field existed, which is what those builds did anyway. */
        from: ['tray','safe','workshop'].indexOf(hm.from) >= 0 ? hm.from : 'tray'
      },
      /* CUSTODY, NOT A MOVEMENT. Changing this never touches the ledger. */
      location: ['tray','safe','assay','workshop','out'].indexOf(p.location) >= 0 ? p.location : 'tray',
      /* WHEN the piece left the shop. The count act and the hallmarking screen both have to answer
         «how long has this been out», and hallmark.sentTs only answers it for the assay office. */
      locTs: Math.max(0, safeInt(p.locTs, safeInt((p.hallmark||{}).sentTs, 0))),
      cat: CATS.indexOf(p.cat) >= 0 ? p.cat : 'other',
      atg: String(p.atg || '').replace(/[^0-9]/g,'').slice(0,10),
      note: String(p.note || '').slice(0,200),
      addedTs: Math.max(0, safeInt(p.addedTs, 0))
    };
  }).filter(p => weightsValid(p));

  /* ---- bulk pools: a registry only. THEIR WEIGHT IS WHAT THE LEDGER SAYS IT IS. ---- */
  st.pools = st.pools.filter(b => b && b.id).map(b => ({
    id: String(b.id).slice(0,24),
    metal: METALS.indexOf(b.metal) >= 0 ? b.metal : 'au',
    fineness: safeInt(b.fineness, 585),
    cat: CATS.indexOf(b.cat) >= 0 ? b.cat : 'scrap',
    note: String(b.note || '').slice(0,200)
  }));

  /* ---- lots: cost basis layered on a pool, consumed FIFO by acquisition date ---- */
  st.lots = st.lots.filter(l => l && l.id && l.subject).map(l => {
    const acq = l.acq && typeof l.acq === 'object' ? l.acq : {};
    const date = Math.max(0, safeInt(acq.date, 0));
    return {
      id: String(l.id).slice(0,32),
      subject: String(l.subject).slice(0,40),
      inG: Math.max(0, LEDGER.clamp(l.inG)),
      leftG: Math.max(0, LEDGER.clamp(l.leftG)),
      acq: {
        costAmd: safeAmd(acq.costAmd, 0), stoneCost: safeAmd(acq.stoneCost, 0), date: date,
        preJul26: acq.preJul26 === true || acq.preJul26 === false ? !!acq.preJul26 : (date > 0 && date < JUL26),
        docType: ['invoice','buyact','customs','opening','none'].indexOf(acq.docType) >= 0 ? acq.docType : 'none',
        docRef: String(acq.docRef || '').slice(0,40),
        source: String(acq.source || 'opening').slice(0,32),
        known: acq.known !== false
      }
    };
  });

  /* ---- the log. Append-only, so migration MAY NOT drop a row it does not understand; it may
     only default and clamp the fields it knows. The dq clamp is round3 — never safeInt. ---- */
  st.moveSeq = Math.max(0, safeInt(st.moveSeq, 0));
  const seen = {};
  st.moves = st.moves.filter(m => m && m.subject && m.type && m.uuid && !seen[m.uuid] && (seen[m.uuid] = 1)).map(m => ({
    n: Math.max(0, safeInt(m.n, 0)),
    uuid: String(m.uuid).slice(0,48),
    ts: safeInt(m.ts, st.today),
    rts: Math.max(0, safeInt(m.rts, 0)),
    subject: String(m.subject).slice(0,40),
    type: LEDGER.types.indexOf(m.type) >= 0 ? m.type : 'adjust',
    dq: LEDGER.clamp(m.dq),
    cost: safeAmd(m.cost, 0),
    ref: String(m.ref || '').slice(0,40),
    reason: String(m.reason || '').slice(0,32),
    actor: String(m.actor || 'shop').slice(0,24),
    note: String(m.note || '').slice(0,200),
    lot: String(m.lot || '').slice(0,32)
  }));
  st.moves.forEach(m => { if(m.n > st.moveSeq) st.moveSeq = m.n; });

  /* ---- the on-hand cache. Clamped with round3, NEVER safeInt. ---- */
  if(!st.stock || typeof st.stock !== 'object' || Array.isArray(st.stock)) st.stock = {};
  Object.keys(st.stock).forEach(k => {
    const v = LEDGER.clamp(st.stock[k]);
    if(isFinite(v)) st.stock[k] = v; else delete st.stock[k];
  });

  /* ---- the two counter-flow records. Neither is the ledger - the ledger is S.moves - but both
     are what the accountant reads later, so they are defaulted and clamped like everything else.
     The 80% warning's two figures are kept BECAUSE they were kept: a sale record that dropped
     them would leave the counter's own reasoning unreconstructable. ---- */
  st.sales = st.sales.filter(x => x && x.id).map(x => ({
    id: String(x.id).slice(0,40),
    ts: safeInt(x.ts, st.today),
    pieceId: String(x.pieceId || '').slice(0,24),
    code: String(x.code || '').slice(0,24),
    name: String(x.name || '').slice(0,60),
    metal: METALS.indexOf(x.metal) >= 0 ? x.metal : 'au',
    fineness: safeInt(x.fineness, 585),
    netG: Math.max(0, LEDGER.clamp(x.netG)),
    price: safeAmd(x.price, 0), computed: safeAmd(x.computed, 0), manual: safeAmd(x.manual, 0),
    warn: (x.warn && typeof x.warn === 'object')
      ? { computed: safeAmd(x.warn.computed,0), floor: safeAmd(x.warn.floor,0),
          manual: safeAmd(x.warn.manual,0), pct: Math.max(0, Math.min(100, safeInt(x.warn.pct,0))) }
      : null,
    hdmRef: String(x.hdmRef || '').slice(0,40),
    acqKnown: x.acqKnown !== false,
    acqCost: safeAmd(x.acqCost, 0)
  })).slice(-500);
  st.buys = st.buys.filter(x => x && x.id).map(x => {
    const sl = (x.seller && typeof x.seller === 'object') ? x.seller : {};
    return {
      id: String(x.id).slice(0,40),
      ts: safeInt(x.ts, st.today),
      metal: METALS.indexOf(x.metal) >= 0 ? x.metal : 'au',
      fineness: safeInt(x.fineness, 585),
      grossG: Math.max(0, LEDGER.clamp(x.grossG)),
      stoneG: Math.max(0, LEDGER.clamp(x.stoneG)),
      netG: Math.max(0, LEDGER.clamp(x.netG)),
      weighedAs: x.weighedAs === 'net' ? 'net' : 'gross',
      rate: safeAmd(x.rate, 0), fineRate: safeAmd(x.fineRate, 0),
      metalAmd: safeAmd(x.metalAmd, 0), stonesAmd: safeAmd(x.stonesAmd, 0),
      paid: safeAmd(x.paid, 0),
      pay: x.pay === 'bank' ? 'bank' : 'cash',
      dest: x.dest === 'resale' ? 'resale' : 'scrap',
      subject: String(x.subject || '').slice(0,40),
      pieceId: String(x.pieceId || '').slice(0,24),
      lotId: String(x.lotId || '').slice(0,32),
      seller: { name: String(sl.name || '').slice(0,80),
                passport: String(sl.passport || '').slice(0,40),
                ssn: String(sl.ssn || '').slice(0,20) }
    };
  }).slice(-500);

  /* ---- the OPEN count session (spec 5.4). It lives in the state rather than in a module-level
     variable for one reason: a count is a person walking round a cabinet with a phone, and the
     phone WILL lock, the tab WILL be reloaded, and the jeweller WILL step away to serve a
     customer. A session that did not survive that would be a session nobody finishes. ---- */
  st.count = cnMigrateSession(st.count, st);

  /* ---- finished count acts ---- */
  st.counts = st.counts.filter(x => x && x.id).map(c => ({
    id: String(c.id).slice(0,40),
    ts: safeInt(c.ts, st.today),
    scope: CN_SCOPES.indexOf(c.scope) >= 0 ? c.scope : 'all',
    counter: String(c.counter || '').slice(0,80),
    mrp: String(c.mrp || '').slice(0,80),
    rows: Array.isArray(c.rows) ? c.rows.map(r => ({
      metal: METALS.indexOf(r.metal) >= 0 ? r.metal : 'au',
      fineness: safeInt(r.fineness, 0),
      bookPcs: safeInt(r.bookPcs,0), actPcs: safeInt(r.actPcs,0),
      bookG: LEDGER.clamp(r.bookG), actG: LEDGER.clamp(r.actG),
      dPcs: safeInt(r.dPcs,0), dG: LEDGER.clamp(r.dG), amd: safeInt(r.amd,0)
    })) : [],
    out: Array.isArray(c.out) ? c.out.map(o => ({
      code: String(o.code||'').slice(0,24), name: String(o.name||'').slice(0,60),
      location: String(o.location||'out').slice(0,16), days: Math.max(0, safeInt(o.days,0)),
      metal: METALS.indexOf(o.metal) >= 0 ? o.metal : 'au',
      fineness: safeInt(o.fineness,0), netG: LEDGER.clamp(o.netG)
    })) : [],
    cust: Array.isArray(c.cust) ? c.cust.map(x => ({
      name: String(x.name||'').slice(0,80), descr: String(x.descr||'').slice(0,120),
      grossG: LEDGER.clamp(x.grossG), fineness: safeInt(x.fineness,0),
      metal: METALS.indexOf(x.metal) >= 0 ? x.metal : 'au'
    })) : [],
    skipped: Array.isArray(c.skipped) ? c.skipped.map(x => ({
      code: String(x.code||'').slice(0,24), name: String(x.name||'').slice(0,60),
      kind: x.kind === 'pool' ? 'pool' : 'piece',
      metal: METALS.indexOf(x.metal) >= 0 ? x.metal : 'au', fineness: safeInt(x.fineness,0),
      bookG: LEDGER.clamp(x.bookG)
    })) : [],
    /* the uncounted half of the act, subtotalled by metal and հարգ (spec 5.4). An act drawn by
       an older build has none, and openCountAct falls back to the flat name list for it. */
    unc: Array.isArray(c.unc) ? c.unc.map(u => ({
      metal: METALS.indexOf(u.metal) >= 0 ? u.metal : 'au', fineness: safeInt(u.fineness,0),
      pcs: Math.max(0, safeInt(u.pcs,0)), g: LEDGER.clamp(u.g)
    })) : [],
    /* subjects whose books moved between the weighing and the act */
    moved: Array.isArray(c.moved) ? c.moved.map(m => ({
      code: String(m.code||'').slice(0,24), name: String(m.name||'').slice(0,60),
      metal: METALS.indexOf(m.metal) >= 0 ? m.metal : 'au', fineness: safeInt(m.fineness,0),
      atG: LEDGER.clamp(m.atG), nowG: LEDGER.clamp(m.nowG), refused: m.refused ? 1 : 0
    })) : [],
    rate: { au: safeAmd((c.rate||{}).au, 0), ag: safeAmd((c.rate||{}).ag, 0) }
  })).slice(-200);

  /* ---- suppliers and the two books. A balance is NEVER stored, so migration has nothing to
     reconcile: it defaults and clamps rows, and the figure is derived at read time. ---- */
  st.sups = st.sups.filter(x => x && x.id).map(x => ({
    id: String(x.id).slice(0,32), name: String(x.name || '').slice(0,80),
    tin: String(x.tin || '').replace(/[^0-9]/g,'').slice(0,12),
    phone: String(x.phone || '').slice(0,32), note: String(x.note || '').slice(0,200)
  }));
  const bookRow = x => ({
    id: String(x.id).slice(0,40), sup: String(x.sup || '').slice(0,32),
    ts: safeInt(x.ts, st.today), amd: safeAmd(x.amd, 0),
    ref: String(x.ref || '').slice(0,40), note: String(x.note || '').slice(0,200)
  });
  st.bills = st.bills.filter(x => x && x.id && x.sup).map(bookRow).slice(-1000);
  st.pays  = st.pays .filter(x => x && x.id && x.sup).map(bookRow).slice(-1000);

  /* ---- hand-over lists. A list that cannot be reprinted is a list the shop cannot produce when
     the assay office asks which items it holds. ---- */
  st.hmSends = st.hmSends.filter(x => x && x.id).map(h => ({
    id: String(h.id).slice(0,40),
    ts: safeInt(h.ts, st.today),
    office: String(h.office || '').slice(0,60),
    items: (Array.isArray(h.items) ? h.items : []).map(i => ({
      id: String(i.id||'').slice(0,24), code: String(i.code||'').slice(0,24),
      name: String(i.name||'').slice(0,60),
      metal: METALS.indexOf(i.metal) >= 0 ? i.metal : 'au',
      fineness: safeInt(i.fineness,0), netG: Math.max(0, LEDGER.clamp(i.netG))
    }))
  })).slice(-200);

  /* ---- the repair custody register (spec 8). THE CUSTOMER'S METAL, NEVER THE SHOP'S STOCK:
     no id here is ever a ledger subject, nothing here posts a movement, and nothing here reaches
     a valuation or a count total. Getting that wrong inflates the jeweller's inventory — and his
     tax position — with metal he does not own. ---- */
  st.repairs = st.repairs.filter(r => r && r.id).map(r => ({
    id: String(r.id).slice(0,40),
    custName: String(r.custName || '').slice(0,80),
    custPhone: String(r.custPhone || '').slice(0,32),
    inTs: safeInt(r.inTs, st.today),
    dueTs: Math.max(0, safeInt(r.dueTs, 0)),
    outTs: Math.max(0, safeInt(r.outTs, 0)),
    descr: String(r.descr || '').slice(0,200),
    metal: METALS.indexOf(r.metal) >= 0 ? r.metal : 'au',
    fineness: safeInt(r.fineness, 0),
    grossG: Math.max(0, LEDGER.clamp(r.grossG)),
    photoNote: String(r.photoNote || '').slice(0,200),
    /* FREE-FORM (spec 8, 11). How repairs are priced in Armenian practice is unverified, so the
       product ships no quoting formula and the jeweller types his own number. */
    priceAmd: safeAmd(r.priceAmd, 0),
    paid: safeAmd(r.paid, 0),
    status: ['in','ready','out'].indexOf(r.status) >= 0 ? r.status : 'in'
  })).slice(-500);
  return st;
}

/* every adoption path goes through here: migrate, then re-derive the cache from the log, because
   the log is the truth and the cache is only a cache. */
function adopt(st){
  const s = migrate(st);
  const prev = S; S = s;
  try{ healLedger(); } finally { if(!S) S = prev; }
  return s;
}

/* =====================================================================================
   SEED DATA
   A tray a jeweller would recognise: several finenesses INCLUDING 583 (the Soviet standard, which
   is legal, distinct, and sits next to 585 in a real cabinet), pieces with stones and pieces
   without, stock acquired either side of 1 July 2026, one piece with no documented cost, one
   piece out at the assay office, silver alongside gold, and a scrap pool with two lots at
   different cost bases.

   IT IS ENTERED THROUGH postMove(), not written into S.stock. Seed data that bypassed the ledger
   would be seed data whose invariant had never been tested.
   ===================================================================================== */
function seedState(){
  const st = freshState();
  const D = (y,m,d) => Date.UTC(y, m-1, d);
  st.today = D(2026,8,19);
  /* the 999 rate on 18 August 2026 per b24.am, sourced to the Central Bank. Entered by hand,
     which is what the product supports; the age and provenance are shown on the rate card. */
  st.rate = { base999: 51738, silver999: 620, at: st.today + 9*3600000 + 14*60000, src:'cb', by:'shop' };
  /* the demo shop's own markup. It is named on EVERY breakdown line the product renders, so it
     is visible and adjustable rather than baked in — which is the whole reason the margin is a
     setting. The buy-in discount stays null even here: see freshCfg(). */
  st.cfg.marginPct = 4;
  st.cfg.shopName = 'Ոսկերչական խանութ';
  st.cfg.tin = '02710459';

  st.models = [
    { id:'m1', cat:'chain', metal:'au', fineness:585, name:'Բիսմարկ', code:'BIS-585', makingG:4500, note:'' },
    { id:'m2', cat:'ring',  metal:'au', fineness:585, name:'Դասական մատանի', code:'RNG-585', makingG:5200, note:'' },
    { id:'m3', cat:'pendant', metal:'au', fineness:750, name:'Կախազարդ քարով', code:'PND-750', makingG:6800, note:'' },
    { id:'m4', cat:'cross', metal:'au', fineness:585, name:'Խաչ', code:'CRS-585', makingG:5000, note:'' },

  ];

  const mkAcq = (cost, date, docType, docRef, source, known) => ({
    costAmd: cost, stoneCost: 0, date: date,
    preJul26: date < JUL26,             /* STORED at the movement that brought the metal in */
    docType: docType, docRef: docRef, source: source, known: known !== false
  });

  st.pieces = [
    /* the spec's own worked example: gross 5.80, stones 0.38, net 5.42, 45,000 of stones,
       4,500/g of making. Open it in the tray and the breakdown line reads exactly as the
       specification writes it. */

      grossG:8.420, stoneG:0, netG:0, stonesAmd:0, makingG:4500, cat:'chain',
      acq: mkAcq(212000, D(2026,3,12), 'invoice', 'ՀԱ-2026-0088', 'sup:s1'),
      hallmark:{ origin:'am_assay', makerMark:true, docRef:'ՀԴ-3902', office:'Երևան' },
      location:'tray', note:'', addedTs: D(2026,3,12) },

    { id:'i3', model:'m2', code:'Մ-3308', metal:'au', fineness:585, weighedAs:'gross',
      grossG:4.100, stoneG:0.620, netG:0, stonesAmd:38000, makingG:5200, cat:'ring',
      acq: mkAcq(129000, D(2026,8,2), 'invoice', 'ՀԱ-2026-0344', 'sup:s1'),
      hallmark:{ origin:'am_assay', makerMark:true, docRef:'ՀԴ-4488', office:'Երևան' },

    { id:'i4', model:null, code:'Մ-9004', metal:'au', fineness:583, weighedAs:'gross',

    { id:'i8', model:'m5', code:'Ա-5501', metal:'ag', fineness:925, weighedAs:'gross',
      grossG:14.200, stoneG:0, netG:0, stonesAmd:0, makingG:900, cat:'chain',
      acq: mkAcq(9800, D(2026,6,9), 'invoice', 'ՀԱ-2026-0202', 'sup:s2'),
      hallmark:{ origin:'am_assay', makerMark:true, docRef:'ՀԴ-4210', office:'Երևան' },

      acq: mkAcq(238000, D(2026,8,6), 'invoice', 'ՀԱ-2026-0351', 'sup:s1'),

      location:'assay', locTs: D(2026,8,10), note:'', addedTs: D(2026,8,6) },

    /* NO DOCUMENTED COST. Allowed — a missing cost never blocks a sale — but the piece, the sale
       record and the alerts all say so, because under the margin scheme the tax is then computed
       on the whole price and the jeweller must know that before he sets one. */
    { id:'i10', model:'m1', code:'Շ-0009', metal:'au', fineness:585, weighedAs:'gross',
      grossG:6.700, stoneG:0, netG:0, stonesAmd:0, makingG:4500, cat:'chain',
      acq: { costAmd:0, stoneCost:0, date: D(2025,11,3), preJul26:true,
             docType:'none', docRef:'', source:'opening', known:false },
      hallmark:{ origin:'am_assay', makerMark:false },
      location:'tray', note:'', addedTs: D(2025,11,3) }
  ];

  /* the two wholesalers the seed pieces name in acq.source, with their books. One is part paid
     and one is settled, so the derived balance has both cases to show. */
  st.sups = [
    { id:'s1', name:'Ոսկերչական մեծածախ «Անի»', tin:'01234567', phone:'010 55 44 33', note:'' },
    { id:'s2', name:'Իմպորտ «ԵԱՏՄ Գոլդ»', tin:'07654321', phone:'010 22 11 00', note:'' }
  ];
  st.bills = [
    { id:'bl1', sup:'s1', ts: D(2026,7,28), amd: 186000, ref:'ՀԱ-2026-0311', note:'' },
    { id:'bl2', sup:'s1', ts: D(2026,8,2),  amd: 129000, ref:'ՀԱ-2026-0344', note:'' },
    { id:'bl3', sup:'s1', ts: D(2026,8,6),  amd: 238000, ref:'ՀԱ-2026-0351', note:'' },
    { id:'bl4', sup:'s2', ts: D(2026,6,9),  amd:   9800, ref:'ՀԱ-2026-0202', note:'' }
  ];
  st.pays = [
    { id:'py1', sup:'s1', ts: D(2026,8,5),  amd: 186000, ref:'ՎՃ-0091', note:'' },
    { id:'py2', sup:'s1', ts: D(2026,8,12), amd: 100000, ref:'ՎՃ-0104', note:'' },
    { id:'py3', sup:'s2', ts: D(2026,6,30), amd:   9800, ref:'ՎՃ-0077', note:'' }
  ];

  st.pools = [
    { id:'b:au:585', metal:'au', fineness:585, cat:'scrap', note:'' },
    { id:'b:au:750', metal:'au', fineness:750, cat:'scrap', note:'' },
    { id:'b:ag:925', metal:'ag', fineness:925, cat:'scrap', note:'' }
  ];

  /* ---- now build the ledger. Every gram in this shop arrives through postMove(). ---- */
  const prev = S; S = st;
  try{
    st.pieces.forEach(p => {
      const w = deriveWeights(p);
      p.grossG = w.grossG; p.stoneG = w.stoneG; p.netG = w.netG; p.weighedAs = w.weighedAs;
      postMove({
        subject: pieceSubj(p.id),
        type: p.acq.source === 'public' ? 'buyin' : (p.acq.docType === 'opening' || !p.acq.known ? 'open' : 'receipt'),
        dq: p.netG, ts: p.acq.date || st.today, cost: p.acq.costAmd,
        ref: p.acq.docRef, actor:'shop'
      });
    });

    /* the scrap pool, with two lots at different cost bases so FIFO-by-acquisition-date has
       something real to consume. Its weight is the sum of these movements and nothing else. */
    const lot = (id, subject, g, cost, date, docType, ref, source) => {
      st.lots.push({ id, subject, inG: round3(g), leftG: round3(g),
        acq:{ costAmd:cost, stoneCost:0, date, preJul26: date < JUL26, docType, docRef:ref, source, known:true } });
      postMove({ subject, type: source === 'public' ? 'buyin' : 'receipt', dq: g, ts: date,
                 cost, ref, lot: id, actor:'shop' });
    };
    lot('l1', 'b:au:585', 74.600, 1_880_000, D(2026,4,18), 'buyact', 'ԳԱ-2026-0016', 'public');
    lot('l2', 'b:au:585', 53.800, 1_452_000, D(2026,7,22), 'buyact', 'ԳԱ-2026-0033', 'public');
    lot('l3', 'b:au:750', 18.240, 632_000,   D(2026,8,4),  'buyact', 'ԳԱ-2026-0038', 'public');
    lot('l4', 'b:ag:925', 240.500, 128_000,  D(2026,6,30), 'buyact', 'ԳԱ-2026-0029', 'public');

    /* a real shop's log is not all receipts. One sale of a whole piece, one write-off of a few
       grams of scrap sent to melt, and one adjustment — so the invariant is exercised by the seed
       itself rather than only by the tests. */
    postMove({ subject:'b:au:585', type:'melt_out', dq:-12.400, ts: D(2026,8,14),
               reason:'melt', ref:'ՁՁ-2026-0004', actor:'shop' });
    postMove({ subject:'b:au:999', type:'melt_in', dq: 7.180, ts: D(2026,8,14),
               reason:'melt', ref:'ՁՁ-2026-0004', actor:'shop' });
    /* THE REFINING LOSS IS NOT A SECOND DEDUCTION (spec 2.5, whose worked example annotates this
       very row «-0.000  <- not a second deduction»). melt_out already removed the WHOLE physical
       weight from the source pool: 12.400 g left the shop for the melter and 12.400 g is what
       came off the pool. The loss is documented by the GAP between melt_out and melt_in —
       12.400 x 0.585 = 7.254 g of pure metal went out and 7.180 g of fine metal came back, so
       0.074 g did not — and it is posted as a zero-delta movement so the loss is visible and
       NAMED («Կորուստ») without the ledger removing metal a second time.
       Deducting it again understated the pool by 0.127 g, understated lot l1's remaining basis
       by the same, and verifyLedger() reported clean throughout — because cache-equals-log is
       not the invariant that catches it. The invariant that does is spec 1.3's: the sum of a
       subject's movements equals what is PHYSICALLY at that subject's location. */
    postMove({ subject:'b:au:585', type:'loss', dq:0, ts: D(2026,8,14),
               reason:'melt', ref:'ՁՁ-2026-0004', actor:'shop' });
    postMove({ subject:'b:ag:925', type:'adjust', dq:-0.350, ts: D(2026,8,17),
               reason:'short', note:'կշեռքի ճշգրտում', actor:'shop' });
  } finally { S = prev; }

  if(!st.pools.some(b => b.id === 'b:au:999'))
    st.pools.push({ id:'b:au:999', metal:'au', fineness:999, cat:'scrap', note:'' });
  return st;
}

/* =====================================================================================
   AGGREGATION
   Purity is never summed away. There are exactly TWO aggregate presentations and they are never
   mixed:
     - GRAMS BY FINENESS      the counting view (what a tray lists, what a count act reports)
     - PURE-METAL GRAMS       the valuation view, netG x fineness / 1000
   THERE IS NO THIRD AGGREGATE. A screen that shows a bare gram total across finenesses is a bug,
   not a shortcut — 10 g of 585 and 10 g of 750 are not 20 g of anything.
   ===================================================================================== */
function pieceRows(){
  return (S.pieces||[]).map(p => ({ p, subject: pieceSubj(p.id), on: onHand(pieceSubj(p.id)) }))
    .filter(x => x.on > EPS);
}
function poolRows(){
  return (S.pools||[]).map(b => ({ b, subject: b.id, on: onHand(b.id) }))
    .filter(x => x.on > EPS);
}
/* grouped by metal AND fineness — the key of the counting view */
function trayGroups(){
  const g = {};
  const put = (metal, fineness, k, v) => {
    const key = metal + ':' + fineness;
    if(!g[key]) g[key] = { metal, fineness: safeInt(fineness,0), pieces:[], pools:[], grams:0, stones:0, pcs:0 };
    g[key][k].push(v);
  };
  pieceRows().forEach(x => {
    put(x.p.metal, x.p.fineness, 'pieces', x);
    const key = x.p.metal + ':' + x.p.fineness;
    g[key].grams = round3(g[key].grams + x.on);
    g[key].stones = round3(g[key].stones + num(x.p.stoneG));
    g[key].pcs++;
  });
  poolRows().forEach(x => {
    put(x.b.metal, x.b.fineness, 'pools', x);
    const key = x.b.metal + ':' + x.b.fineness;
    g[key].grams = round3(g[key].grams + x.on);
  });
  return Object.keys(g).map(k => g[k]).sort((a,b) =>
    (a.metal === b.metal ? b.fineness - a.fineness : (a.metal === 'au' ? -1 : 1)));
}
/* pure metal, PER METAL. Gold and silver are not added together either — that would be the same
   mistake one level up. */
function pureByMetal(){
  const out = {};
  trayGroups().forEach(g => {
    out[g.metal] = round3((out[g.metal]||0) + pureG(g.grams, g.fineness));
  });
  return out;
}
function valuation(){
  const pm = pureByMetal(); let v = 0;
  Object.keys(pm).forEach(m => { v += pm[m] * metalRate999(m); });
  return Math.round(v);
}
const pieceCount = () => pieceRows().length;

/* =====================================================================================
   RATE PROVENANCE
   The 999 rate is never shown without saying where it came from and how old it is. A stale rate
   is STATED, not hidden: hiding it would leave the jeweller quoting yesterday's gold today.
   ===================================================================================== */
function rateAgeMs(){
  const at = safeInt(S.rate.at, 0);
  if(!at) return -1;
  const now = Math.max(Date.now(), S.today);
  return Math.max(0, now - at);
}
function rateAgeTxt(){
  const ms = rateAgeMs();
  if(ms < 0) return '';
  if(ms < 3600000) return t('rate_age_now');
  if(ms < DAY) return fmt('rate_age_h', { n: Math.floor(ms/3600000) });
  return fmt('rate_age_d', { n: Math.floor(ms/DAY) });
}
const rateStale = () => { const ms = rateAgeMs(); return ms < 0 || ms > DAY; };
function fdate(ts){
  const d = new Date(safeInt(ts,0));
  if(!safeInt(ts,0)) return '—';
  const p = n => (n<10?'0':'') + n;
  return p(d.getUTCDate()) + '.' + p(d.getUTCMonth()+1) + '.' + d.getUTCFullYear();
}
function ftime(ts){
  const d = new Date(safeInt(ts,0)); const p = n => (n<10?'0':'') + n;
  return p(d.getUTCHours()) + ':' + p(d.getUTCMinutes());
}

/* =====================================================================================
   NAVIGATION
   ArmTrade's navPlan(), unchanged in mechanism: it measures each label at 600 14px IN THE ACTIVE
   LANGUAGE and spills the remainder into «Ավելին». That is exactly why the Armenian labels are
   allowed to be as long as the trade's real words are — the bar adapts, the vocabulary does not
   get shortened to fit a grid.
   ===================================================================================== */
const NAV_KEYS = ['home','sell','buy','tray','count','recv','mark','debts','repair','data'];
/* order of surrender: the daily loop is the last to leave the bar */
const NAV_PRIO = ['home','sell','buy','tray','count','recv','mark','debts','repair','data'];
const NAV_ICON = { home:'', sell:'', buy:'', tray:'', recv:'', count:'',
                   mark:'', repair:'', debts:'', data:'' };
let NAVMC = null;
function navTextW(txt){
  try{
    if(!NAVMC) NAVMC = document.createElement('canvas').getContext('2d');
    NAVMC.font = '600 14px ' + getComputedStyle(document.body).fontFamily;
    return NAVMC.measureText(String(txt)).width;
  }catch(e){ return String(txt).length * 8; }
}
/* the horizontal padding the active cell gets in CSS. Kept beside the measurement it feeds so
   the two cannot drift: if one changes, the bar either overflows or wastes a cell. */
const NAV_ACT_PAD = 10;
function navPlan(W){
  const labels = {}; NAV_KEYS.forEach(k => labels[k] = t('tab_'+k));
  const moreW = navTextW(t('more_tab'));
  const active = NAV_PRIO.indexOf(U.tab) >= 0 ? U.tab : null;
  for(let k = NAV_KEYS.length; k >= 1; k--){
    let keys = NAV_PRIO.slice(0,k);
    /* "you are here" may never be hidden: the open tab buys its way in at the bottom's expense */
    if(active && keys.indexOf(active) < 0){
      keys = keys.slice(0, Math.max(1, k-1)); keys.push(active);
    }
    const cells = k + (k < NAV_KEYS.length ? 1 : 0);
    /* THE ACTIVE CELL IS NOT MEASURED AGAINST THE SHARED WIDTH. It takes exactly the room its own
       word needs (see the CSS beside nav button.active) and the remaining cells divide the rest,
       so a long Armenian label costs one cell instead of collapsing the bar. Nothing is
       ellipsised and nothing is shrunk — the strip gives, as it already did. */
    const actW = active && keys.indexOf(active) >= 0 ? navTextW(labels[active]) + NAV_ACT_PAD : 0;
    const rest = cells - (actW ? 1 : 0);
    if(rest < 1){ if(actW && actW <= W) return keys; continue; }
    const cw = ((W - actW) / rest) - 4;
    if(cw < 40) continue;
    const ok = keys.every(kk => kk === active || navTextW(labels[kk]) <= cw)
      && (k >= NAV_KEYS.length || moreW <= cw);
    if(ok) return keys;
  }
  return active ? [active] : [NAV_PRIO[0]];
}
let NAV_HIDDEN = [];
function renderNav(){
  const nv = document.getElementById('nav');
  nv.style.display = 'flex';
  const W = nv.clientWidth || window.innerWidth || 390;
  const keys = navPlan(W);
  NAV_HIDDEN = NAV_KEYS.filter(k => keys.indexOf(k) < 0);
  nv.innerHTML = keys.map(k =>
    '<button class="' + (U.tab===k ? 'active' : '') + '" aria-label="' + escH(t('tab_'+k)) + '"'
    + ' onclick="setTab(' + jsArg(k) + ')">'
    + '<span class="icw">' + NAV_ICON[k] + '</span><span>' + escH(t('tab_'+k)) + '</span></button>').join('')
    + (NAV_HIDDEN.length ? '<button aria-label="' + escH(t('menu_title')) + '" onclick="openMoreNav()">'
        + '<span class="icw"></span><span>' + escH(t('more_tab')) + '</span></button>' : '');
}
function openMoreNav(){
  const rows = NAV_HIDDEN.map(k =>
    '<button class="morerow' + (U.tab===k ? ' active' : '') + '" onclick="closeModal();setTab(' + jsArg(k) + ')">'
    + '<span class="mrico">' + NAV_ICON[k] + '</span><span class="mrnm">' + escH(t('tab_'+k)) + '</span></button>').join('');
  /* Once inside the app there was no way back to the explainer or to the other programs — a
     director being shown three products had to retype the address. These are links, not tabs:
     they leave the app, so they sit under a rule, below the destinations. */
  const away = '<div style="border-top:var(--bw) solid var(--sep);margin:14px 0 4px"></div>'
    + '<a class="morerow" href="/armvoski/about/"><span class="mrico"></span><span class="mrnm">' + escH(t('what_is_this')) + '</span></a>'
    + '<a class="morerow" href="/"><span class="mrico"></span><span class="mrnm">' + escH(t('all_products')) + '</span></a>';
  openModal('<h3>' + escH(t('menu_title')) + '</h3>' + rows + away
    + '<button class="btn ghost full" style="margin-top:16px" onclick="closeModal()">' + escH(t('close')) + '</button>');
}
function setTab(k){

function openModal(inner){
  const r = document.getElementById('modalRoot');
  /* keep the reader where they were: a repaint driven by a display-convention change (language,
     gram decimals, making base) must not throw the sheet back to its top. */
  const prev = r.querySelector('.modal');
  const y = prev ? prev.scrollTop : 0;
  r.innerHTML =
    '<div class="modal" onclick="if(event.target===this)closeModal()">'
    + '<div class="mbody"><div class="grabber"></div>' + inner + '</div></div>';
  if(y){ try{ r.querySelector('.modal').scrollTop = y; }catch(e){} }
}
function closeModal(){ MODAL_RE = null; document.getElementById('modalRoot').innerHTML = ''; }

/* ---- AN OPEN SHEET IS PART OF THE SCREEN, so a global repaint must repaint it too ----
   renderAll() rebuilds #top, #app and #nav and never touched #modalRoot, so switching the
   language with a sheet open left «Իրի վաճառք» sitting in Armenian over an English screen — and,
   worse, any in-sheet control that changes a DISPLAY CONVENTION (the gram decimal setting, the
   making-charge base) left the sheet showing the old formatting of numbers the jeweller was
   about to act on. Every sheet is drawn by a function that reads its state from a module global
   rather than from the DOM, so re-invoking that function with the same arguments is a faithful
   redraw; the wrapper records the call, closeModal() forgets it, and a redraw that throws
   forgets itself rather than looping. */
let MODAL_RE = null;
function repaintSheet(){
  const re = MODAL_RE;
  if(!re) return;
  if(!document.getElementById('modalRoot').innerHTML){ MODAL_RE = null; return; }
  try{ re(); }catch(e){ MODAL_RE = null; }
}
/* a modal dismisses on Escape. The product targets a phone, where the backdrop tap and the Փակել
   button are the exits — but the ԳՆՄԱՆ ԱԿՏ and the hand-over lists are read and closed on a
   keyboard-attached device at the counter, and a sheet that swallows Escape reads as stuck. The
   sheet drafts are dropped with it, exactly as the Չեղարկել button drops them. */
function escClose(){
  const r = document.getElementById('modalRoot');
  if(!r || !r.innerHTML) return false;
  NI = null; SL = null; CN_SHEET = null; RP = null; RP_SHEET = null; HM_SHEET = null;
  DBF = null; DB_SHEET = null;
  closeModal();
  return true;
}
let TOAST_T = 0;
function toast(msg){
  const el = document.getElementById('toast');
  el.className = 'show'; el.textContent = String(msg||'');
  clearTimeout(TOAST_T); TOAST_T = setTimeout(() => { el.className = ''; }, 2600);
}

/* ---- the rate card. Provenance, age and THE METAL, always.

   call sellRate() and buyRate() with NO ARGUMENT — both silently answered for gold, while the

function rateMetalBlock(metal){

    + '<div class="rrow">'
      + '<div class="rsub"><div class="l">' + escH(t('w_sellrate') + nm) + ' (+' + pctTxt(S.cfg.marginPct) + '%)</div>'
        + '<div class="v">' + (b ? sellRate(metal).toLocaleString('en-US') + '<span class="cur">֏</span>' : '—')
        + '</div></div>'
      + '<div class="rsub"><div class="l">' + escH(t('w_buyrate') + nm)

              + (buyDiscSet() ? '' : '<div class="mlbl">' + escH(t('buydisc_unset')) + '</div>')) + '</div>'
    + '</div>';

function rateCard(){
  const b = base999(), stale = rateStale();

     soon as it has a rate, because a shop that holds silver prices silver. */
  const ag = silver999();
