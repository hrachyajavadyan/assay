const PROP_ST_CLASS = { draft:'b-neutral', active:'b-green', reserved:'b-gold', sold:'b-cyan',
  leased:'b-cyan', withdrawn:'b-neutral', archived:'b-neutral' };
const STAGE_CLASS = { agreed:'b-neutral', deposit:'b-gold', notary:'b-gold', registered:'b-cyan',
  invoiced:'b-cyan', settled:'b-green', paid:'b-green' };

/* THE FEE'S PROVENANCE, as one sentence under the figure. §8: never show a number you cannot
   explain in one sentence under it. This is the sentence for the most contested number in the
   product — «2% վաճառքի գնից · վճարում՝ վաճառողը · վաստակած՝ պետական գրանցումից». */
/* the label separator: Armenian uses ՝ where English and Russian use a colon. One helper, so a
   sentence built in three languages does not carry an Armenian mark into the Russian one. */
const sepC = () => lang === 'hy' ? '՝ ' : ': ';
function feeWhy(deal){
  const tm = deal && deal.terms;
  if(!termsComplete(tm)) return null;
  const rate = tm.mode === 'pct' ? bpTxt(tm.bp) + ' ' + basisLabel(tm.basis)
    : tm.mode === 'flat' ? t('cm_mode_flat')
    : monthsTxt(tm.monthsBp) + ' ' + t('cm_months_u');
  const who = t('cm_payer') + sepC() + payerLabel(tm.payer);
  const when = t('cm_trigger') + sepC() + triggerLabel(tm.trigger);
  return [rate, who, when].join(' · ');
}

/* =====================================================================================
   TODAY — the owner's screen, and the only question it answers is
   «Ի՞նչ է այսօր ինձնից կախված» — what today depends on me.
   At most six cards, each one a single sentence and a single button, in a priority order that
   puts money out first and reporting nowhere. Properties, clients and contracts are tabs, not
   the front page — the sibling product's hardest lesson was that capability without focus reads
   as complexity.
   ===================================================================================== */
function homeCards(){
  const out = [];

  /* 1 — MONEY OUT. Commission received, agents not paid. */
  const owing = activeAgents().map(a => ({ a:a, m:agentMoney(a.id) })).filter(x => x.m.payable > 0);
  if(owing.length){
    const total = owing.reduce((n,x) => n + x.m.payable, 0);
    out.push({ k:'payout', tone:'', icon:'💳', title:t('c_payout'),
      body: fmt('c_payout_b', {n:owing.length}) + ' · ' + amdTxt(total) + ' ֏', tab:'payouts' });
  }

  /* 2 — MONEY IN. Earned, and the agency has not invoiced it. */
  const uninvoiced = (S.deals||[]).filter(d => !d.void && isEarned(d) && DEAL_RANK[d.stage] < DEAL_RANK.invoiced);
  if(uninvoiced.length){
    let sum = 0; uninvoiced.forEach(d => { const al = allocation(d); if(al) sum += al.fee; });
    out.push({ k:'invoice', tone:'', icon:'🧾', title:t('c_invoice'),
      body: fmt('c_invoice_b', {n:uninvoiced.length}) + ' · ' + amdTxt(sum) + ' ֏', tab:'deals' });
  }

  /* 3 — A LEGAL CLOCK RUNNING OUT. The 30-working-day cadastre filing deadline first, because
     missing it is the one that costs the client money rather than the agency face. */
  (S.deals||[]).forEach(d => {
    if(d.void || !d.dates.notaryTs || d.dates.filedTs) return;
    const left = workingDaysLeft(d.dates.notaryTs, S.cfg.filingDays, S.today);
    if(left > 7) return;
    out.push({ k:'filing:'+d.id, tone:'bad', icon:'⏳', title:t('c_clock'),
      body: propAddr(propById(d.propertyId)) + ' · ' + fmt('d_filing_left', {n:left}), tab:'deals' });
  });
  (S.mandates||[]).forEach(m => {
    const left = exclLeft(m);
    if(left == null || left > 14) return;
    out.push({ k:'excl:'+m.id, tone:'', icon:'📄', title:t('c_excl'),
      body: clientName(m.clientId) + ' · ' + fmt('c_excl_b', {n:Math.max(0,left)}), tab:'docs' });
  });
  activeAgents().forEach(a => {
    const to = a.qual && a.qual.insuranceTo;
    if(!to) return;
    const left = daysBetween(S.today, to);
    if(left > 30) return;
    out.push({ k:'ins:'+a.id, tone:'', icon:'🛡', title:t('c_ins'),
      body: a.name + ' · ' + fmt('c_ins_b', {n:Math.max(0,left)}), tab:'agents' });
  });

  /* 4 — A DEAL STUCK, with the stage NAMED. "Stalled" without a stage is a nag, not a fact. */
  (S.deals||[]).forEach(d => {
    if(d.void || DEAL_RANK[d.stage] >= DEAL_RANK.paid) return;
    const idle = daysBetween(d.stageTs, S.today);
    if(idle < S.cfg.stuckDays) return;
    out.push({ k:'stuck:'+d.id, tone:'', icon:'🐌', title:t('c_stuck'),
      body: propAddr(propById(d.propertyId)) + ' · ' + stageLabel(d.stage) + ' · ' + fmt('c_stuck_b',{n:idle}), tab:'deals' });
  });

  /* 5 — TERMS MISSING. A deal at stage 0 with no commission terms cannot advance, and a human
     has to type a number. There is no default to fall back on and that is deliberate. */
  (S.deals||[]).filter(d => !d.void && !termsComplete(d.terms)).forEach(d => {
    out.push({ k:'terms:'+d.id, tone:'bad', icon:'✍', title:t('c_terms'),
      body: propAddr(propById(d.propertyId)) + ' · ' + t('c_terms_b'), tab:'deals' });
  });

  /* 6 — FROM THE FIELD. An unsigned viewing sheet is an unenforceable fee claim, which is the
     one piece of paper this product exists to make sure gets signed. */
  const unsigned = (S.viewings||[]).filter(v => !v.signedTs);
  if(unsigned.length){
    out.push({ k:'unsigned', tone:'', icon:'🔑', title:t('c_unsigned'),
      body: fmt('c_unsigned_b', {n:unsigned.length}), tab:'views' });
  }
  return out;
}

function monthKPIs(){
  const d = new Date(S.today);
  const from = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1);
  let closed = 0, earned = 0, received = 0, owed = 0;
  (S.deals||[]).forEach(x => {
    if(!x.void && x.dates.settledTs >= from) closed++;
    if(!x.void && x.dates.settledTs >= from){ const al = allocation(x); if(al) received += al.fee; }
  });
  (S.rows||[]).forEach(r => {
    if(r.ts < from) return;
    if(r.type === 'earn' || r.type === 'reverse' || r.type === 'adjust') earned += r.amt;
  });
  activeAgents().forEach(a => { owed += agentMoney(a.id).owed; });
  return { closed:closed, earned:earned, received:received, owed:owed };
}

  } else {

    + '<div class="kpi"><div class="l">' + escH(t('kpi_earned')) + '</div><div class="v">' + amdTxt(k.earned) + '<span class="cur">֏</span></div></div>'
    + '<div class="kpi"><div class="l">' + escH(t('kpi_received')) + '</div><div class="v">' + amdTxt(k.received) + '<span class="cur">֏</span></div></div>'
    + '<div class="kpi"><div class="l">' + escH(t('kpi_owed')) + '</div><div class="v">' + amdTxt(k.owed) + '<span class="cur">֏</span></div></div>'

let PROP_F = { q:'', deal:'', status:'' };
function setPropF(k, v){ PROP_F[k] = (PROP_F[k] === v ? '' : v); renderAll(); }
function setPropQ(v){ PROP_F.q = String(v||''); renderPropList(); }

function propMatches(p){
  if(p.archivedTs) return false;
  if(PROP_F.deal && p.deal !== PROP_F.deal) return false;
  if(PROP_F.status && p.status !== PROP_F.status) return false;
  const q = PROP_F.q.trim().toLowerCase();
  if(!q) return true;
  const hay = [propAddr(p), p.cadCode, clientName(p.ownerClientId), agentName(p.agentId),
               kindLabel(p.kind)].join(' ').toLowerCase();
  return hay.indexOf(q) >= 0;
}

/* THE HONEST CONVERSION METRIC. Viewings with a RECORDED outcome are the denominator, so a
   viewing the owner never followed up is UNMEASURABLE rather than a failure. An agent's number
   must never be worsened by the office's missing data, and under n<3 the screen says «չափելի
   չէ» instead of printing a percentage off two events. */
function agentConversion(agentId){
  const vs = (S.viewings||[]).filter(v => v.agentId === agentId);
  const measurable = vs.filter(v => ['interested','declined','held'].indexOf(v.outcome) >= 0);
  if(measurable.length < 3) return { n:measurable.length, pct:null };
  const converted = measurable.filter(v =>
    (S.offers||[]).some(o => o.propertyId === v.propertyId && o.clientId === v.clientId
      && ['accepted','sent'].indexOf(o.status) >= 0)).length;
  return { n:measurable.length, pct: Math.round(converted * 100 / measurable.length) };
}

       NAME keeps the full column width; a name squeezed beside a badge wraps mid-syllable. */
    + '<div class="badgerow" style="margin-top:10px">' + (a.defaultShareBp == null

/* =====================================================================================
   DEALS
   ===================================================================================== */
let DEAL_F = '';
function setDealF(v){ DEAL_F = (DEAL_F === v ? '' : v); renderAll(); }

function stageBar(deal){
  const upto = DEAL_RANK[deal.stage];
  return '<div class="stg">' + DEAL_STAGES.map((s,i) =>
    '<i class="' + (!stageApplies(deal,s) ? 'na' : i <= upto ? 'on' : '') + '" title="'
    + escH(stageLabel(s)) + '"></i>').join('') + '</div>';
}
function nextStage(deal){
  const upto = DEAL_RANK[deal.stage];
  for(let i = upto+1; i < DEAL_STAGES.length; i++){
    if(stageApplies(deal, DEAL_STAGES[i])) return DEAL_STAGES[i];
  }
  return null;
}

/* the four states, for ONE deal and ONE agent — the sentence an agent actually asks for */
function dealMoneyState(deal){
  if(deal.void && deal.void.ts) return 'void';
  if(!termsComplete(deal.terms)) return 'noterms';
  if(!isEarned(deal)) return 'expected';
  if(DEAL_RANK[deal.stage] >= DEAL_RANK.paid) return 'paid';
  return gateOpen(deal) ? 'payable' : 'earned';
}
const DEAL_STATE_BADGE = { void:'b-rose', noterms:'b-gold', expected:'b-neutral',
  earned:'b-cyan', payable:'b-green', paid:'b-green' };
const dealStateLabel = s => s === 'void' ? t('d_void') : s === 'noterms' ? t('cm_none') : t('st_'+s);

function dealCard(d){
  const p = propById(d.propertyId);
  const al = allocation(d);
  const why = feeWhy(d);
  const st = dealMoneyState(d);
  const ns = nextStage(d);
  return '<div class="card' + (st === 'noterms' ? ' rail rail-bad' : '') + '">'
    + '<div class="sug" style="border-bottom:none;padding:0">'
      + '<div class="pav">' + (p ? (KIND_EM[p.kind]||'🏠') : '🏠') + '</div>'
      + '<div class="info"><div class="addr">' + escH(p ? propAddr(p) : '—') + '</div>'
        + '<div class="muted">' + escH((d.kind === 'lease' ? t('d_landlord') : t('d_seller')) + sepC()
          + clientName(d.sellerClientId) + ' · ' + (d.kind === 'lease' ? t('d_tenant') : t('d_buyer')) + sepC()
          + clientName(d.buyerClientId)) + '</div></div>'
    + '</div>'
    + stageBar(d)
    + '<div class="row"><span class="stgname">' + escH(stageLabel(d.stage)) + '</span>'
      + '<div class="badgerow">' + badge(STAGE_CLASS[d.stage]||'b-neutral', stageLabel(d.stage))
        + badge(DEAL_STATE_BADGE[st], dealStateLabel(st)) + '</div></div>'
    + '<div style="margin-top:12px">'
      + (al ? amdBig(al.fee) : '<div class="nofig">' + escH(t('cm_none')) + '</div>')
      + '<div class="prov' + (why ? '' : ' warn') + '">' + escH(why || t('cm_none_b')) + '</div>'
    + '</div>'
    + (al ? '<div class="badgerow" style="margin-top:10px">' + al.rows.map(r =>
        badge('b-neutral', agentEm(r.agentId) + ' ' + agentName(r.agentId) + ' · ' + bpTxt(r.shareBp))).join('') + '</div>' : '')
    + (d.void ? '<div class="notice bad">' + escH('✖ ' + t('d_void') + ': ' + d.void.reason
        + ' · ' + fdate(d.void.ts)) + '</div>' : '')
    + '<div class="row" style="margin-top:14px">'
      + '<button class="btn ghost small" onclick="openDeal(' + jsArg(d.id) + ')">' + escH(t('c_open')) + '</button>'
      /* THE FORWARD BUTTON IS LABELLED WITH THE NEXT STAGE'S ACTUAL NAME — «Նշել նոտարական
         վավերացումը» — never "advance". The agent knows what happened; the app should use the
         same word they would. */
      /* AND IT IS ABSENT WHEN THE DEAL CANNOT MOVE. Offering a forward button on a deal with no
         commission terms, only to refuse the tap with a toast, teaches the owner that the
         product's buttons lie. The card's red rail and its sentence are the answer instead. */
      + (ns && !d.void && termsComplete(d.terms)
          ? '<button class="btn small primary" onclick="advanceDeal(' + jsArg(d.id) + ')">'
            + escH(fmt('d_mark', {s:stageLabel(ns)})) + '</button>' : '')
    + '</div>'
    + '</div>';
}

function dealsView(){
  let h = secTitle('🤝', t('deals_title'));
  h += '<div class="chips"><button class="' + (!DEAL_F ? 'active' : '') + '" onclick="setDealF('
    + jsArg('') + ')">' + escH(t('p_all')) + '</button>'

  const list = (S.deals||[]).filter(d => !DEAL_F || d.stage === DEAL_F)

  h += list.length ? list.map(dealCard).join('') : emptyCard(t('d_none'), '');
  return h;
}

/* ADVANCE. The stage is a monotone rank and it only ever goes forward; the row that records it
   carries the rank, so a merge is max() and two devices cannot disagree about where a deal is.
   Crossing the trigger mints the money — on the owner's device, from the owner's own code. */
function advanceDeal(id){
  const d = dealById(id);
  if(!d || d.void) return;
  if(!termsComplete(d.terms)){ toast(t('cm_none')); openDeal(id); return; }
  const ns = nextStage(d);
  if(!ns) return;
  d.stage = ns; d.stageTs = S.today;
  const key = { deposit:'depositTs', notary:'notaryTs', registered:'registeredTs',
                invoiced:'invoicedTs', settled:'settledTs' }[ns];
  if(key && !d.dates[key]) d.dates[key] = S.today;
  postRow({ agent:AGENCY, type:'stage', amt:0, ts:S.today, deal:d.id, prop:d.propertyId,
            reason:ns, rank:DEAL_RANK[ns], actor:'owner' });
  const minted = mintEarnings(d);
  saveState(); renderAll();
  toast(stageLabel(ns) + (minted ? ' · ' + t('st_earned') : ''));
}

/* ---------- the deal sheet: where the split has to reconcile in front of the owner ---------- */
function openDeal(id){
  const d = dealById(id);
  if(!d) return;
  const p = propById(d.propertyId);
  const al = allocation(d);
  const ps = al ? payerSplit(d.terms, al.fee) : null;

  let h = '<h3>' + (p ? (KIND_EM[p.kind]||'🏠') : '🏠') + ' ' + escH(p ? propAddr(p) : '—') + '</h3>';
  h += '<div class="cad" style="margin-bottom:12px">' + escH(p ? p.cadCode : '') + '</div>';
  h += stageBar(d);
  h += '<div class="badgerow" style="margin-bottom:12px">'
    + badge(STAGE_CLASS[d.stage]||'b-neutral', stageLabel(d.stage))
    + badge('b-neutral', dealKindLabel(d.kind))
    + badge(DEAL_STATE_BADGE[dealMoneyState(d)], dealStateLabel(dealMoneyState(d))) + '</div>';

  h += '<div class="row"><span class="mlbl">' + escH(t('d_price')) + '</span>' + amd(d.price) + '</div>';

  /* ---- THE TERMS ---- */
  h += '<div class="sec">💼 ' + escH(t('cm_terms')) + '</div>';
  if(!termsComplete(d.terms)){
    h += '<div class="alert bad"><div class="t">' + escH(t('cm_none')) + '</div>'
      + '<div class="d">' + escH(t('cm_none_b')) + '</div></div>';
  } else {
    const tm = d.terms;
    const rate = tm.mode === 'pct' ? bpTxt(tm.bp)
      : tm.mode === 'flat' ? amdTxt(tm.flat) + ' ֏'
      : monthsTxt(tm.monthsBp) + ' ' + t('cm_months_u');
    h += '<div class="card" style="margin:0 0 12px">'
      + '<div class="row"><span class="mlbl">' + escH(t('cm_base')) + '</span><span>'
        + escH(basisLabel(tm.basis)) + ' · ' + amdTxt(tm.base) + ' ֏</span></div>'
      + '<div class="row"><span class="mlbl">' + escH(modeLabel(tm.mode)) + '</span><span class="num">'
        + escH(rate) + '</span></div>'
      + '<div class="row"><span class="mlbl">' + escH(t('cm_payer')) + '</span><span>'
        + escH(payerLabel(tm.payer)) + '</span></div>'
      + (tm.payer === 'split' && ps ? '<div class="row"><span class="mlbl">'
          + escH(t('cm_payer_seller') + ' / ' + t('cm_payer_buyer')) + '</span><span>'
          + amdTxt(ps.seller) + ' ֏ / ' + amdTxt(ps.buyer) + ' ֏</span></div>' : '')
      + '<div class="row"><span class="mlbl">' + escH(t('cm_trigger')) + '</span><span>'
        + escH(triggerLabel(tm.trigger)) + '</span></div>'
      + '<div class="row"><span class="mlbl">' + escH(t('cm_vat')) + '</span><span>'
        + escH(vatLabel(tm.vat)) + '</span></div>'
      + '<div class="prov">' + escH(t('cm_vat_note')) + '</div>'
      + (tm.setTs ? '<div class="prov">' + escH(t('cm_setby') + sepC() + (tm.setBy || '—') + ' · ' + fdate(tm.setTs)) + '</div>' : '')
      + '</div>';

    /* ---- THE SPLIT, WITH ITS RECONCILIATION LINE ---- */
    h += '<div class="sec">💰 ' + escH(t('cm_fee')) + '</div>';
    h += '<div class="card" style="margin:0 0 12px">' + amdBig(al.fee)
      + '<div class="prov">' + escH(feeWhy(d)) + '</div>'
      + (al.over ? '<div class="notice bad">' + escH('⚠ ' + t('cm_over')) + '</div>' : '')
      + '<table class="sp"><thead><tr><th>' + escH(t('tab_agents')) + '</th>'
        + '<th class="n">' + escH(t('cm_share')) + '</th><th class="n">' + escH(t('cm_amount')) + '</th></tr></thead><tbody>'
      + al.rows.map(r => '<tr><td>' + escH(agentEm(r.agentId) + ' ' + agentName(r.agentId))
          + '<div class="muted">' + escH(r.side ? t('ag_side_'+r.side) : '') + '</div></td>'
          + '<td class="n">' + escH(bpTxt(r.shareBp)) + '</td>'
          + '<td class="n">' + amdTxt(r.amount) + '</td></tr>').join('')
      + '<tr class="keep"><td>' + escH(t('cm_keep')) + '</td><td class="n">'
        + escH(bpTxt(Math.max(0, 10000 - al.sumBp))) + '</td><td class="n">' + amdTxt(al.agencyKeep) + '</td></tr>'
      + '<tr class="tot"><td>' + escH(t('total')) + '</td><td class="n">'
        + escH(bpTxt(al.sumBp + Math.max(0, 10000 - al.sumBp))) + '</td><td class="n">'
        + amdTxt(al.rows.reduce((x,r) => x + r.amount, 0) + al.agencyKeep) + '</td></tr>'
      + '</tbody></table>'
      + '<div class="prov">' + escH((assertReconciles(al) ? '✓ ' : '⚠ ') + t('cm_recon')) + '</div>'
      + '</div>';
  }

  /* ---- the two clocks and the checklist ---- */
  /* THE CLOSING CHECKLIST IS A SCREEN, NOT A DOCUMENT. It is a working aid — unified certificate
     pulled, consents obtained, the non-cash sentence said out loud, the notary, the filing
     deadline — and printing a to-do list is how a product signals it does not know what a
     document is for. */
  h += '<div class="sec">📌 ' + escH(t('d_checklist')) + '</div>';
  h += '<div class="card" style="margin:0 0 12px">';
  if(d.dates.notaryTs && !d.dates.filedTs && !d.void){
    const left = workingDaysLeft(d.dates.notaryTs, S.cfg.filingDays, S.today);

      /* A COUNTDOWN THAT CANNOT SAY WHAT CALENDAR IT USED IS A COUNTDOWN NOBODY TRUSTS. */
      + '<div class="prov">' + escH(t(holidayTableKnown(S.today) ? 'd_filing_src' : 'd_filing_src_unknown')) + '</div>';
  }
  if(DEAL_RANK[d.stage] >= DEAL_RANK.deposit && d.price > 300000 && !d.void){
    /* a NOTICE, not a blocker. The app is not the compliance officer; it is the thing that says
       the sentence out loud before the notary does. */
    h += '<div class="notice">' + escH('💳 ' + t('d_noncash')) + '</div>';
  }
  const consOk = d.consents.spouse && d.consents.coOwners;
  h += '<div class="row"><span class="mlbl">' + escH(t('d_consents')) + '</span>'
    + '<span>' + (consOk ? badge('b-green','✓') : badge('b-gold','!')) + '</span></div>'
    + '<div class="prov' + (consOk ? '' : ' warn') + '">'
      + escH((d.consents.spouse ? '✓ ' : '□ ') + t('d_cons_spouse') + ' · '
           + (d.consents.coOwners ? '✓ ' : '□ ') + t('d_cons_co')) + '</div>'
    + (d.unifiedCertTs ? '<div class="row"><span class="mlbl">' + escH(t('d_unified')) + '</span><span>'
        + escH(fdate(d.unifiedCertTs)) + '</span></div>' : '')
    + (d.notary.name ? '<div class="row"><span class="mlbl">' + escH(t('d_notary')) + '</span><span>'
        + escH(d.notary.name + (d.notary.actNo ? ' · № ' + d.notary.actNo : '')) + '</span></div>' : '')
    + (d.cert.no ? '<div class="row"><span class="mlbl">' + escH(t('d_cert')) + '</span><span>'
        + escH(d.cert.no + ' · ' + fdate(d.cert.ts)) + '</span></div>' : '')
    + (d.deposit.amount ? '<div class="row"><span class="mlbl">' + escH(t('dep_'+d.deposit.kind))
        + '</span>' + amd(d.deposit.amount) + '</div>'
      /* BOTH SENTENCES ARE PRINTED UNDER THE CHOSEN OPTION, in the document itself and not only
         in a tooltip: նախավճար is forfeit / returned double, կանխավճար is simply returned. */
      + '<div class="prov">' + escH(t(d.deposit.kind === 'nakh' ? 'dep_nakh_law' : 'dep_kankh_law')) + '</div>' : '')
    + '</div>';

  h += '<button class="btn ghost full" style="margin-top:8px" onclick="closeModal()">' + escH(t('close')) + '</button>';
  openModal(h);
}

  const a = agentById(agentId); if(!a) return;
  const m = agentMoney(agentId);
  const rows = moneyRowsFor(agentId).slice().sort((x,y) => x.ts - y.ts);
  let bal = 0;
  const body = rows.map(r => {
    bal += r.amt;

    return '<tr><td>' + escH(fdate(r.ts)) + '<div class="muted">' + escH(rowTypeLabel(r.type)
        + (r.trigger ? ' · ' + triggerLabel(r.trigger) : '')

      + (p ? '<div class="muted">' + escH(propAddr(p)) + '</div>' : '') + '</td>'
      + '<td class="n">' + (r.amt < 0 ? '−' : '') + amdTxt(Math.abs(r.amt)) + '</td>'
      + '<td class="n">' + amdTxt(bal) + '</td></tr>';

  openModal('<h3>' + escH(a.em + ' ' + a.name) + '</h3>'
    + '<div class="prov">' + escH(t('pay_derived')) + '</div>'
    + '<table class="sp"><thead><tr><th>' + escH(t('dt_ledger')) + '</th><th class="n">'
      + escH(t('cm_amount')) + '</th><th class="n">' + escH(t('pay_owed')) + '</th></tr></thead>'
    + '<tbody>' + (body || '<tr><td colspan="3" class="muted">—</td></tr>')
    + '<tr class="tot"><td>' + escH(t('pay_owed')) + '</td><td class="n"></td><td class="n">'
      + amdTxt(m.owed) + '</td></tr></tbody></table>'
    + '<button class="btn ghost full" style="margin-top:14px" onclick="closeModal()">' + escH(t('close')) + '</button>');

/* =====================================================================================
   CONTRACTS — the spine, per the research's first product implication
   ===================================================================================== */
const MS_CLASS = { draft:'b-neutral', signed:'b-cyan', active:'b-green', expired:'b-rose',
  terminated:'b-neutral', fulfilled:'b-cyan' };
function mandateCard(m){
  const left = exclLeft(m);
  const span = (m.exclusiveTo && m.exclusiveFrom) ? Math.max(1, daysBetween(m.exclusiveFrom, m.exclusiveTo)) : 0;
  const pct = span ? Math.max(0, Math.min(100, Math.round((span - Math.max(0,left||0)) * 100 / span))) : 0;
  const props = (m.propertyIds||[]).map(pid => propById(pid)).filter(Boolean);
  return '<div class="card">'
    + '<div class="poh"><div class="pav">📄</div>'
      + '<div class="pon"><div class="addr">' + escH(clientName(m.clientId)) + '</div>'
        + '<div class="muted">' + escH(t('mn_kind_'+m.kind) + (m.docNo ? ' · ' + m.docNo : '')) + '</div></div>'
      + '<div>' + badge(MS_CLASS[m.status]||'b-neutral', manStLabel(m.status)) + '</div></div>'
    + (props.length ? '<div class="pmeta">' + props.map(p => '<span>' + escH(propAddr(p)) + '</span>').join('') + '</div>' : '')
    + '<div class="row" style="margin-top:10px"><span class="mlbl">' + escH(t('mn_signed_on')) + '</span><span>'
      + escH(fdate(m.signedTs)) + '</span></div>'
    /* THE EXCLUSIVITY CLOCK IS FIRST-CLASS AND VISIBLE. An agency running an expired exclusive is
       exposed, and the point of a back office is to know that before the client's lawyer does.
       A CLOSED MANDATE GETS NO COUNTDOWN. exclLeft() returns null once the contract is fulfilled,
       terminated or expired, and printing «մնաց 0 օր» against a contract that is already finished
       says something false about a document somebody signed — it gets its date range instead. */
    + (m.exclusive
        ? (left != null
            ? '<div class="hbar" style="margin-top:8px"><i style="width:' + pct + '%"></i></div>'
              + '<div class="prov' + (left <= 14 ? ' warn' : '') + '">'
              + escH('🔒 ' + t('mn_exclusive') + ' · ' + t('p_excl_left') + ' ' + Math.max(0, left) + ' '
                + t('p_dom_d') + ' · ' + t('mn_excl_cap')) + '</div>'
            : '<div class="prov">' + escH('🔒 ' + t('mn_exclusive') + ' · '
                + fdate(m.exclusiveFrom) + ' — ' + fdate(m.exclusiveTo)) + '</div>')
        : '')
    + (m.retainUntil ? '<div class="prov">' + escH('🗄 ' + t('mn_retain') + ' ' + fdate(m.retainUntil)) + '</div>' : '')
    /* the platform field exists so the record is ready; it is greyed and says why. */
    + '<div class="prov">' + escH('🏛 ' + t('mn_platform') + ': ' + t('mn_platform_off')) + '</div>'
    + '</div>';
}

  let h = secTitle('📄', t('docs_title'));

/* =====================================================================================
   CSV
   Two non-obvious properties, both deliberate and both easy to lose in a rewrite:
   1. A UTF-8 BOM, because the accountant opens this in Windows Excel and without the BOM every
      Armenian character arrives as mojibake.
   2. A FORMULA-INJECTION GUARD. Client names, street names and notes are free text typed by a
      person, and a cell beginning = + - @ TAB or CR is executed as a formula when the file is
      opened. Prefixing an apostrophe is the fix; forgetting it turns an export into an attack
      surface aimed at the one person in the agency who handles the money.
   ArmEstate does NOT attempt to be an e-invoicing client — Armenia's հաշիվ-ապրանքագիր system
   needs digital certificates and prescribed machine-readable formats. It produces a clean line
   the accountant re-keys or imports. That boundary is a decision, not a gap.
   ===================================================================================== */
function csvCell(v){
  let x = v == null ? '' : String(v);
  if(/^[=+\-@\t\r]/.test(x)) x = "'" + x;
  return '"' + x.replace(/"/g, '""') + '"';
}
function downloadCSV(name, rows){
  const body = rows.map(r => r.map(csvCell).join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF' + body], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { try{ document.body.removeChild(a); URL.revokeObjectURL(url); }catch(e){} }, 0);
}
/* THE COMMISSION LINE. Exactly the columns an Armenian accountant needs to raise the invoice:
   client, property, cadastral code, service, base amount, rate AS TYPED, fee, VAT flag, date.
   No tax is computed — whether brokerage sits inside the professional-services turnover-tax
   exclusion is UNVERIFIED and is the agency accountant's question, not this product's. */
function exportCommission(){
  const rows = [[ t('cm_setby'), t('clients_title'), t('props_title'), t('p_cad'),
                  t('cm_mode_pct'), t('cm_base'), t('cm_fee'), t('cm_vat'), t('cm_trigger'), t('d_stage') ]];
  (S.deals||[]).forEach(d => {
    const al = allocation(d); if(!al) return;
    const p = propById(d.propertyId);
    const tm = d.terms;
    const rate = tm.mode === 'pct' ? bpTxt(tm.bp)
      : tm.mode === 'flat' ? amdTxt(tm.flat) : monthsTxt(tm.monthsBp) + ' ' + t('cm_months_u');
    rows.push([ fdate(d.stageTs), clientName(tm.payer === 'buyer' ? d.buyerClientId : d.sellerClientId),
      p ? propAddr(p) : '', p ? p.cadCode : '', rate, tm.base, al.fee, vatLabel(tm.vat),
      triggerLabel(tm.trigger), stageLabel(d.stage) + (d.void ? ' · ' + t('d_void') : '') ]);
  });
  downloadCSV('armestate-commission-' + fdate(S.today).replace(/\./g,'-') + '.csv', rows);
}
/* THE WHOLE LOG. The draft law would require ten-year retention, and every document this product
   makes is re-derivable from these rows — so retention is a property of the log, and an export
   that carries it out of the browser is the cheapest possible insurance against that. */
function exportLedger(){
  const rows = [['uuid','ts','agent','type','amt','deal','prop','client','trigger','reason','actor','rank','note']];
  (S.rows||[]).slice().sort((a,b) => a.ts - b.ts).forEach(r => {
    rows.push([r.uuid, fdate(r.ts), agentName(r.agent) || r.agent, rowTypeLabel(r.type), r.amt,
      r.deal, r.prop, r.client, r.trigger, r.reason, r.actor, r.rank, r.note]);
  });
  downloadCSV('armestate-ledger-' + fdate(S.today).replace(/\./g,'-') + '.csv', rows);
}

/* the Cyrillic face sits behind a unicode-range, so an Armenian-only install never fetches it and
   sw.js deliberately does not precache it. A RUSSIAN reader needs it offline from the first run,
   so when the language IS ru the page asks the worker for it by name. One hard-coded subset — no
   path travels from here into the cache. */
function swWantCyrillic(){
  try{
    if(lang !== 'ru' || !navigator.serviceWorker) return;
    navigator.serviceWorker.ready.then(r => {
      if(r && r.active) r.active.postMessage({ type:'shellfont', subset:'cyrillic' });
    }).catch(() => {});
  }catch(e){}
}

/* =====================================================================================
   SELF-TEST
   Run estateSelfTest() from the console, or press the button on Տվյալներ. It runs on a CLONE —
   a test that could damage an agency's books is a test nobody will run — and it hammers the one
   thing this product cannot get wrong: a split that does not reconcile to the dram.
   ===================================================================================== */
function estateSelfTest(){
  const out = []; let pass = 0, fail = 0;
  const ok = (name, cond, extra) => { if(cond){ pass++; out.push('ok   ' + name); }
    else { fail++; out.push('FAIL ' + name + (extra ? ' — ' + extra : '')); } };
  const real = S;
  try{
    S = adopt(JSON.parse(JSON.stringify(seedState())));

    /* ---- the ledger ---- */
    ok('seed ledger verifies', verifyLedger().length === 0, JSON.stringify(verifyLedger()));
    ok('every row has a uuid', (S.rows||[]).every(r => !!r.uuid));
    ok('no row carries an `order` field', (S.rows||[]).every(r => !('order' in r)));
    ok('evidence rows carry amount 0',
       (S.rows||[]).filter(r => EVIDENCE_TYPES.indexOf(r.type) >= 0).every(r => r.amt === 0));
    ok('money rows are integers',
       (S.rows||[]).filter(isMoneyRow).every(r => r.amt === Math.round(r.amt)));

    /* THE FOLD IS COMMUTATIVE. Shuffle the log and the answer must not move — this is the
       property that lets two devices merge by uuid and agree without a sort. */
    ok('the fold is commutative', (() => {
      /* compared as a SORTED list of pairs, not as a stringified object: shuffling the log
         changes the key insertion order of the result, and an object's key order is not part of
         what the fold means. */
      const flat = o => Object.keys(o).sort().map(k => k + '=' + o[k]).join('|');
      const before = flat(rebuildOwed());
      const rows = S.rows.slice();
      for(let i = rows.length-1; i > 0; i--){ const j = (i*7919+13) % (i+1); const x = rows[i]; rows[i] = rows[j]; rows[j] = x; }
      S.rows = rows;
      return flat(rebuildOwed()) === before;
    })());

    /* A REPLAY OF THE SAME ROW IS A NO-OP. This is what a merge does: it carries the uuid, and
       a uuid already in the log is dropped. R17 — same content, same id. */
    ok('a replayed row dedupes', (() => {
      const n = S.rows.length;
      const r = S.rows.find(x => x.type === 'earn');
      postRow({ uuid:r.uuid, agent:r.agent, type:'earn', amt:r.amt, ts:r.ts, deal:r.deal,
                prop:r.prop, trigger:r.trigger, rank:r.rank, actor:r.actor });
      return S.rows.length === n;
    })());
    /* ...and two GENUINELY DISTINCT rows that happen to look identical stay two rows. The
       ordinal is the count of rows already carrying the same identity, derived from the log
       itself, so there is no device-local counter to desynchronise. */
    ok('two identical-looking rows stay two rows', (() => {
      const n = S.rows.length;
      const mk = () => postRow({ agent:'a1', type:'adjust', amt:1000, ts:S.today, deal:'d2',
        actor:'owner', note:'x' });
      const u1 = mk(), u2 = mk();
      const grew = S.rows.length === n + 2 && u1 !== u2;
      S.rows = S.rows.filter(x => x.uuid !== u1 && x.uuid !== u2);
      S.owed = rebuildOwed();
      return grew;
    })());

    /* an evidence row may not carry money, and it is refused rather than silently zeroed */
    ok('an evidence row with money is refused', (() => {
      const n = S.rows.length;
      const r = postRow({ agent:'a1', type:'view', amt:5000, ts:S.today, prop:'p1', client:'c1' });
      return r === null && S.rows.length === n;
    })());

    /* ---- THE COMMISSION MODEL ---- */
    ok('an empty terms object yields NO fee, not zero', feeOf(null) === null && feeOf({}) === null);
    ok('a deal with no terms shows no figure', feeOf(dealById('d4').terms) === null);
    ok('the product ships no default rate',
       S.cfg.termsTemplate === null && (S.deals||[]).every(d => !d.terms || d.terms.setTs > 0));

    ok('2% of 76,000,000 is 1,520,000', feeOf(dealById('d1').terms) === 1520000,
       String(feeOf(dealById('d1').terms)));
    ok('half a month of 320,000 rent is 160,000', feeOf(dealById('d3').terms) === 160000,
       String(feeOf(dealById('d3').terms)));

    ok('every seeded split reconciles',
       (S.deals||[]).every(d => { const al = allocation(d); return al == null || assertReconciles(al); }));

    /* THE FUZZ TEST. Every combination of a wide band of rates against a wide band of prices,
       split between two and three agents whose shares do not divide evenly, plus the payer
       split — and in every single case the parts must sum to the whole EXACTLY. This is the
       test that stands between the product and paying somebody one dram less than they earned. */
    ok('commission splits reconcile to the dram, over many rates and prices', (() => {
      const prices = [1, 7, 99, 333333, 1000001, 12345678, 27900001, 46500003, 78000000, 999999999];
      const rates  = [1, 7, 33, 100, 133, 175, 200, 225, 250, 299, 300, 999, 1234, 3333, 10000];
      const shareSets = [[3333,3333,3333],[5000,5000],[2500,2500],[1,1,1],[4000,3000,2500],
                         [10000],[0,10000],[6667,3333],[1234,4321,999],[0,0],[9999]];
      let n = 0;
      for(let i=0;i<prices.length;i++) for(let j=0;j<rates.length;j++) for(let k=0;k<shareSets.length;k++){
        const tm = normTerms({ basis:'price', base:prices[i], mode:'pct', bp:rates[j],
          payer:'split', splitBp:{seller:3333, buyer:6667}, vat:'none', trigger:'registered' });
        const fee = feeOf(tm);
        if(fee == null) return false;
        const shares = shareSets[k];
        const al = allocBp(fee, shares);
        /* the parts plus the remainder are the whole, exactly */
        if(al.parts.reduce((a,b) => a+b, 0) + al.rest !== fee) return false;
        /* every part is an integer */
        if(!al.parts.every(x => x === Math.round(x))) return false;
        /* no agent is more than one dram from their true share */
        for(let q=0;q<shares.length;q++){
          if(Math.abs(al.parts[q] - fee*shares[q]/10000) > 1.0000001) return false;
        }
        /* the payer split reconciles too */
        const ps = payerSplit(tm, fee);
        if(ps.seller + ps.buyer !== fee) return false;
        /* and the whole allocation object, through the real path */
        const deal = { terms:tm, agents:shares.map((s,x) => ({agentId:'a'+x, side:'listing', shareBp:s, joinedTs:x})) };
        const full = allocation(deal);
        if(!assertReconciles(full)) return false;
        n++;
      }
      return n === prices.length * rates.length * shareSets.length;
    })());

    /* months-of-rent, the other basis, gets the same hammering */
    ok('months-of-rent splits reconcile to the dram', (() => {
      const rents = [1, 55555, 123457, 320000, 450001, 900000, 3333333];
      const mo    = [1, 2500, 5000, 7500, 10000, 15000, 20000];
      for(let i=0;i<rents.length;i++) for(let j=0;j<mo.length;j++){
        const tm = normTerms({ basis:'rent_month', base:rents[i], mode:'months', monthsBp:mo[j],
          payer:'split', splitBp:{seller:5000, buyer:5000}, vat:'none', trigger:'funds' });
        const fee = feeOf(tm);
        const al = allocBp(fee, [3333,3333,3334]);
        if(al.parts.reduce((a,b)=>a+b,0) + al.rest !== fee) return false;
        const ps = payerSplit(tm, fee);
        if(ps.seller + ps.buyer !== fee) return false;
      }
      return true;
    })());

    /* a flat fee is a flat fee: no rounding at all can touch it */
    ok('a flat fee is returned untouched', (() => {
      const tm = normTerms({ mode:'flat', flat:250000, payer:'seller', trigger:'signed', base:0 });
      return feeOf(tm) === 250000;
    })());

    /* shares over 100% of the commission are FLAGGED, not silently clipped */
    ok('shares over 100% are flagged', (() => {
      const deal = { terms: normTerms({basis:'price', base:10000000, mode:'pct', bp:200,
        payer:'seller', trigger:'registered'}),
        agents:[{agentId:'a1',shareBp:7000,joinedTs:1},{agentId:'a2',shareBp:6000,joinedTs:2}] };
      const al = allocation(deal);
      return al.over === true && al.sumBp === 13000;
    })());

    /* the allocation is a pure function of the SET, not of the array order */
    ok('the allocation does not depend on array order', (() => {
      const tm = normTerms({basis:'price', base:78000001, mode:'pct', bp:233, payer:'seller', trigger:'registered'});
      const a = [{agentId:'a1',side:'listing',shareBp:2500,joinedTs:100},
                 {agentId:'a2',side:'selling',shareBp:2500,joinedTs:200}];
      const x = JSON.stringify(allocation({terms:tm, agents:a}));
      const y = JSON.stringify(allocation({terms:tm, agents:a.slice().reverse()}));
      return x === y;
    })());

    /* ---- earned / payable / paid ---- */
    ok('an expected deal is NOT owed', (() => {
      const m = agentMoney('a3');
      return m.expected === 40000 && m.earned === 0 && m.payable === 0;
    })(), JSON.stringify(agentMoney('a3')));
    ok('earned is not payable until the gate opens', (() => {
      const d1 = dealById('d1');
      return isEarned(d1) && !gateOpen(d1) && S.cfg.payWhen === 'received';
    })());
    ok('opening the gate makes earned payable', (() => {
      S.cfg.payWhen = 'earned';
      const on = agentMoney('a2').payable;
      S.cfg.payWhen = 'received';
      const off = agentMoney('a2').payable;
      return on > 0 && off === 0;
    })());
    ok('a reversal leaves both lines and nets to zero', (() => {
      const rows = rowsOfDeal('d5');
      const earn = rows.filter(r => r.type === 'earn').reduce((a,r) => a+r.amt, 0);
      const rev  = rows.filter(r => r.type === 'reverse').reduce((a,r) => a+r.amt, 0);
      return earn > 0 && rev === -earn && rows.filter(r => r.type === 'earn').length > 0;
    })());
    ok('owed = earned − paid, from two books', (() => {
      const m = agentMoney('a1');
      return m.owed === m.earned - m.paid && m.paid === 200000;
    })(), JSON.stringify(agentMoney('a1')));
    ok('a payout moves the balance by exactly the payout', (() => {
      const before = agentMoney('a1').owed;
      postRow({ agent:'a1', type:'payout', amt:-50000, ts:S.today, deal:'d2', actor:'owner' });
      const after = agentMoney('a1').owed;
      S.rows = S.rows.filter(r => !(r.type === 'payout' && r.amt === -50000));
      S.owed = rebuildOwed();
      const back = agentMoney('a1').owed;
      return after === before - 50000 && back === before;
    })());

    /* the whole fee lands somewhere: agents plus the agency, per deal */
    ok('every dram of every earned fee is attributed', (() => {
      return (S.deals||[]).every(d => {
        const al = allocation(d);
        if(!al || !isEarned(d)) return true;
        const earn = rowsOfDeal(d.id).filter(r => r.type === 'earn').reduce((a,r) => a+r.amt, 0);
        return earn === al.fee;
      });
    })());

    /* ---- stage as a monotone rank on the row ---- */
    ok('the stage on the deal equals the max rank in the log',
       (S.deals||[]).every(d => rankFromLog(d.id) === DEAL_RANK[d.stage]),
       (S.deals||[]).map(d => d.id + ':' + rankFromLog(d.id) + '/' + DEAL_RANK[d.stage]).join(' '));
    ok('a lease never offers the cadastre stage',
       !stageApplies(dealById('d3'), 'registered') && stageApplies(dealById('d1'), 'registered'));

    /* ---- migrate ---- */
    ok('migrate is idempotent', (() => {
      const a = JSON.stringify(migrate(JSON.parse(JSON.stringify(S))));
      const b = JSON.stringify(migrate(JSON.parse(a)));
      return a === b;
    })());
    ok('migrate survives garbage', (() => {
      const s = migrate({ agents:[null,{},{id:'x',defaultShareBp:'abc'}], props:'nope',
        deals:[{id:'d', stage:'☠', agents:[{agentId:'x', shareBp:-5}]}], rows:[{type:'nope'}],
        cfg:{payWhen:'☠', stuckDays:-4} });
      return s.props.length === 0 && s.cfg.payWhen === 'received' && s.cfg.stuckDays === 1
        && s.deals[0].stage === 'agreed' && s.deals[0].agents[0].shareBp === 0
        && s.agents.find(a => a.id === 'x').defaultShareBp === 0 && s.rows.length === 0;
    })());
    ok('migrate never invents a commission rate', (() => {
      const s = migrate({ deals:[{ id:'d', terms:{ base:1000000 } }] });
      return feeOf(s.deals[0].terms) === null;
    })());
    ok('the state survives a round trip through adopt', (() => {
      const snap = JSON.parse(JSON.stringify(S));
      const before = JSON.stringify(activeAgents().map(a => agentMoney(a.id)));
      S = adopt(snap);
      return JSON.stringify(activeAgents().map(a => agentMoney(a.id))) === before;
    })());

    /* ---- provenance ---- */
    ok('days on market names its source',
       (S.props||[]).every(p => { const d = daysOnMarket(p); return !d || ['listed','mandate','created'].indexOf(d.src) >= 0; }));
    ok('the fee always carries its sentence',
       (S.deals||[]).every(d => !termsComplete(d.terms) || (feeWhy(d) || '').length > 0));

    /* ---- trilingual parity ---- */
    const hk = Object.keys(T.hy);
    const missEn = hk.filter(k => T.en[k] == null), missRu = hk.filter(k => T.ru[k] == null);
    const extraEn = Object.keys(T.en).filter(k => T.hy[k] == null);
    const extraRu = Object.keys(T.ru).filter(k => T.hy[k] == null);
    ok('EN parity', missEn.length === 0 && extraEn.length === 0, missEn.concat(extraEn).join(','));
    ok('RU parity', missRu.length === 0 && extraRu.length === 0, missRu.concat(extraRu).join(','));
    ok('every ledger row type has a label',
       ROW_TYPES.every(x => T.hy['lt_'+x] && T.en['lt_'+x] && T.ru['lt_'+x]));
    ok('every deal stage has a label',
       DEAL_STAGES.every(x => T.hy['dst_'+x] && T.en['dst_'+x] && T.ru['dst_'+x]));
    ok('every property status has a label',
       PROP_STATUS.every(x => T.hy['ps_'+x] && T.en['ps_'+x] && T.ru['ps_'+x]));
    ok('every district has a label',
       YER_DISTRICTS.every(x => T.hy['dis_'+x] && T.en['dis_'+x] && T.ru['dis_'+x]));
    ok('every nav key has a label and an icon',
       NAV_KEYS.every(x => T.hy['tab_'+x] && T.en['tab_'+x] && T.ru['tab_'+x] && NAV_ICON[x]));

    /* ---- the storage namespace ---- */
    ok('every key is estate_*', Object.keys(K).every(k => String(K[k]).indexOf('estate_') === 0));
    ok('no assay_*, voski_* or armtrade key',
       Object.keys(K).every(k => !/^(assay_|voski_|at_|armtrade)/.test(String(K[k]))));

    /* ---- escaping ---- */
    /* the export is aimed at the one person in the agency who handles the money */
    ok('the CSV guard neutralises a formula and keeps a plain cell',
       csvCell('=1+1') === '"\'=1+1"' && csvCell('@SUM(A1)') === '"\'@SUM(A1)"'
       && csvCell('Կոմիտաս 52') === '"Կոմիտաս 52"' && csvCell('a"b') === '"a""b"');
    ok('escH neutralises a quote and a bracket',
       escH('<b x="1">\'&') === '&lt;b x=&quot;1&quot;&gt;&#39;&amp;');
    ok('jsArg survives an apostrophe', jsArg("O'Brien") === '&#39;O\\&#39;Brien&#39;');
  } catch(e){
    fail++; out.push('FAIL threw — ' + (e && e.message || e));
  } finally { S = real; }
  out.push((fail ? 'FAILED ' : 'PASSED ') + pass + '/' + (pass+fail));
  console.log(out.join('\n'));
  return { pass:pass, fail:fail, lines:out };
}

/* =====================================================================================
   BOOT
   ===================================================================================== */
function boot(){
  loadU(); lang = U.lang;
  const stored = loadState();
  S = adopt(stored || seedState());        /* migrate() on EVERY adoption path */
  if(!stored) saveState();
  /* the invariant is asserted at boot, not assumed. If the cache and the fold disagree, the fold
     wins — the log is the truth and the cache is only a cache. */
  const bad = verifyLedger();
  if(bad.length){
    console.warn('ArmEstate: the owed cache disagreed on', bad.length, 'subjects — rebuilding from the log');
    healLedger(); saveState();
  }
  renderAll();
  swWantCyrillic();
  window.addEventListener('resize', () => { try{ renderNav(); }catch(e){} });
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape' || e.key === 'Esc'){ try{ if(escClose()) e.preventDefault(); }catch(err){} }
  });
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
}
try{ boot(); }catch(e){ try{ renderRecovery(e); }catch(e2){ console.error(e, e2); } }
</script>
