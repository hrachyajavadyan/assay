/* =====================================================================================
   SELF-TEST
   Run estateSelfTest() from the console, or press the button on Տվյալներ. It runs on a CLONE —
   a test that could damage an agency's books is a test nobody will run — and it hammers the one
   thing this product cannot get wrong: a split that does not reconcile to the dram.
   ===================================================================================== */
function estateSelfTest(){
  const out = []; let pass = 0, fail = 0;
  const ok = (name, cond, extra) => { if(cond){ pass++; out.push('ok   ' + name); }
    else { fail++; out.push('FAIL ' + name + (extra ? ' — ' + extra : '')); } };
  const real = S;
  try{
    S = adopt(JSON.parse(JSON.stringify(seedState())));

    /* ---- the ledger ---- */
    ok('seed ledger verifies', verifyLedger().length === 0, JSON.stringify(verifyLedger()));
    ok('every row has a uuid', (S.rows||[]).every(r => !!r.uuid));
    ok('no row carries an `order` field', (S.rows||[]).every(r => !('order' in r)));
    ok('evidence rows carry amount 0',
       (S.rows||[]).filter(r => EVIDENCE_TYPES.indexOf(r.type) >= 0).every(r => r.amt === 0));
    ok('money rows are integers',
       (S.rows||[]).filter(isMoneyRow).every(r => r.amt === Math.round(r.amt)));

    /* THE FOLD IS COMMUTATIVE. Shuffle the log and the answer must not move — this is the
       property that lets two devices merge by uuid and agree without a sort. */
    ok('the fold is commutative', (() => {
      /* compared as a SORTED list of pairs, not as a stringified object: shuffling the log
         changes the key insertion order of the result, and an object's key order is not part of
         what the fold means. */
      const flat = o => Object.keys(o).sort().map(k => k + '=' + o[k]).join('|');
      const before = flat(rebuildOwed());
      const rows = S.rows.slice();
      for(let i = rows.length-1; i > 0; i--){ const j = (i*7919+13) % (i+1); const x = rows[i]; rows[i] = rows[j]; rows[j] = x; }
      S.rows = rows;
      return flat(rebuildOwed()) === before;
    })());

    /* A REPLAY OF THE SAME ROW IS A NO-OP. This is what a merge does: it carries the uuid, and
       a uuid already in the log is dropped. R17 — same content, same id. */
    ok('a replayed row dedupes', (() => {
      const n = S.rows.length;
      const r = S.rows.find(x => x.type === 'earn');
      postRow({ uuid:r.uuid, agent:r.agent, type:'earn', amt:r.amt, ts:r.ts, deal:r.deal,
                prop:r.prop, trigger:r.trigger, rank:r.rank, actor:r.actor });
      return S.rows.length === n;
    })());
    /* ...and two GENUINELY DISTINCT rows that happen to look identical stay two rows. The
       ordinal is the count of rows already carrying the same identity, derived from the log
       itself, so there is no device-local counter to desynchronise. */
    ok('two identical-looking rows stay two rows', (() => {
      const n = S.rows.length;
      const mk = () => postRow({ agent:'a1', type:'adjust', amt:1000, ts:S.today, deal:'d2',
        actor:'owner', note:'x' });
      const u1 = mk(), u2 = mk();
      const grew = S.rows.length === n + 2 && u1 !== u2;
      S.rows = S.rows.filter(x => x.uuid !== u1 && x.uuid !== u2);
      S.owed = rebuildOwed();
      return grew;
    })());

    /* an evidence row may not carry money, and it is refused rather than silently zeroed */
    /* THE PROBE CLEANS UP THE REJECT IT DELIBERATELY CAUSED. It did not, and the Data screen's
       integrity panel then reported «⚠ Մատյանը մերժել է տողեր: 1 · evidence_amount» for the rest
       of the session — the app's own integrity display crying wolf, triggered by the app's own
       test button. The fractional-money probe below already snapshots and restores; so does this. */
    ok('an evidence row with money is refused', (() => {
      const n = S.rows.length, rj = LEDGER_REJECTS.length;
      const r = postRow({ agent:'a1', type:'view', amt:5000, ts:S.today, prop:'p1', client:'c1' });
      const refused = r === null && S.rows.length === n
        && LEDGER_REJECTS.length === rj + 1
        && LEDGER_REJECTS[LEDGER_REJECTS.length-1].why === 'evidence_amount';
      LEDGER_REJECTS.length = rj;
      return refused;
    })());

    /* ---- THE COMMISSION MODEL ---- */
    ok('an empty terms object yields NO fee, not zero', feeOf(null) === null && feeOf({}) === null);
    ok('a deal with no terms shows no figure', feeOf(dealById('d4').terms) === null);
    ok('the product ships no default rate',
       S.cfg.termsTemplate === null && (S.deals||[]).every(d => !d.terms || d.terms.setTs > 0));

    ok('2% of 76,000,000 is 1,520,000', feeOf(dealById('d1').terms) === 1520000,
       String(feeOf(dealById('d1').terms)));
    ok('half a month of 320,000 rent is 160,000', feeOf(dealById('d3').terms) === 160000,
       String(feeOf(dealById('d3').terms)));

    ok('every seeded split reconciles',
       (S.deals||[]).every(d => { const al = allocation(d); return al == null || assertReconciles(al); }));

    /* ---- THE DEAL THAT FALLS THROUGH ----
       The product must be able to say it, the money must come back, and nothing may be deleted. */
    ok('voiding a deal reverses every earn row and leaves nothing payable', (() => {
      const before = agentMoney('a1');
      const d = dealById('d2');
      const earnRows = dealEarnRows('d2').length;
      d.void = { ts:S.today, reason:'test', by:'owner' };
      const n = postVoidReversals(d, S.today, 'test');
      const after = agentMoney('a1');
      const okk = n > 0 && earnRows > 0
        && after.payable === 0                       /* nothing is left to pay */
        && after.earned === before.earned - 385000   /* a1's 40% of 962,500 = 385,000, reversed */
        && dealEarnRows('d2').length === earnRows;   /* the original rows STAY */
      /* idempotent: a second run finds nothing left to reverse */
      const again = postVoidReversals(d, S.today, 'test');
      /* unwind the probe so the rest of the suite sees the seed it expects */
      S.rows = S.rows.filter(r => !(r.deal === 'd2' && r.type === 'reverse'));
      d.void = null; S.owed = rebuildOwed();
      return okk && again === 0;
    })());
    ok('a void with no reversal rows still closes the payout gate', (() => {
      const d = dealById('d2');
      d.void = { ts:S.today, reason:'test', by:'owner' };
      const shut = gateOpen(d) === false && agentMoney('a1').payable === 0;
      d.void = null;
      return shut && gateOpen(dealById('d2')) === true;
    })());
    ok('the seeded fallen-through deal nets to zero for its agent', (() => {
      let n = 0;
      rowsOfDeal('d5').forEach(r => { if(isMoneyRow(r)) n += r.amt; });
      return n === 0 && dealById('d5').void != null;
    })());

    /* THE FUZZ TEST. Every combination of a wide band of rates against a wide band of prices,
       split between two and three agents whose shares do not divide evenly, plus the payer
       split — and in every single case the parts must sum to the whole EXACTLY. This is the
       test that stands between the product and paying somebody one dram less than they earned. */
    ok('commission splits reconcile to the dram, over many rates and prices', (() => {
      const prices = [1, 7, 99, 333333, 1000001, 12345678, 27900001, 46500003, 78000000, 999999999];
      const rates  = [1, 7, 33, 100, 133, 175, 200, 225, 250, 299, 300, 999, 1234, 3333, 10000];
      const shareSets = [[3333,3333,3333],[5000,5000],[2500,2500],[1,1,1],[4000,3000,2500],
                         [10000],[0,10000],[6667,3333],[1234,4321,999],[0,0],[9999]];
      let n = 0;
      for(let i=0;i<prices.length;i++) for(let j=0;j<rates.length;j++) for(let k=0;k<shareSets.length;k++){
        const tm = normTerms({ basis:'price', base:prices[i], mode:'pct', bp:rates[j],
          payer:'split', splitBp:{seller:3333, buyer:6667}, vat:'none', trigger:'registered' });
        const fee = feeOf(tm);
        if(fee == null) return false;
        const shares = shareSets[k];
        const al = allocBp(fee, shares);
        /* the parts plus the remainder are the whole, exactly */
        if(al.parts.reduce((a,b) => a+b, 0) + al.rest !== fee) return false;
        /* every part is an integer */
        if(!al.parts.every(x => x === Math.round(x))) return false;
        /* no agent is more than one dram from their true share */
        for(let q=0;q<shares.length;q++){
          if(Math.abs(al.parts[q] - fee*shares[q]/10000) > 1.0000001) return false;
        }
        /* the payer split reconciles too */
        const ps = payerSplit(tm, fee);
        if(ps.seller + ps.buyer !== fee) return false;
        /* and the whole allocation object, through the real path */
        const deal = { terms:tm, agents:shares.map((s,x) => ({agentId:'a'+x, side:'listing', shareBp:s, joinedTs:x})) };
        const full = allocation(deal);
        if(!assertReconciles(full)) return false;
        n++;
      }
      return n === prices.length * rates.length * shareSets.length;
    })());

    /* months-of-rent, the other basis, gets the same hammering */
    ok('months-of-rent splits reconcile to the dram', (() => {
      const rents = [1, 55555, 123457, 320000, 450001, 900000, 3333333];
      const mo    = [1, 2500, 5000, 7500, 10000, 15000, 20000];
      for(let i=0;i<rents.length;i++) for(let j=0;j<mo.length;j++){
        const tm = normTerms({ basis:'rent_month', base:rents[i], mode:'months', monthsBp:mo[j],
          payer:'split', splitBp:{seller:5000, buyer:5000}, vat:'none', trigger:'funds' });
        const fee = feeOf(tm);
        const al = allocBp(fee, [3333,3333,3334]);
        if(al.parts.reduce((a,b)=>a+b,0) + al.rest !== fee) return false;
        const ps = payerSplit(tm, fee);
        if(ps.seller + ps.buyer !== fee) return false;
      }
      return true;
    })());

    /* a flat fee is a flat fee: no rounding at all can touch it */
    ok('a flat fee is returned untouched', (() => {
      const tm = normTerms({ mode:'flat', flat:250000, payer:'seller', trigger:'signed', base:0 });
      return feeOf(tm) === 250000;
    })());

    /* shares over 100% of the commission are FLAGGED, not silently clipped */
    ok('shares over 100% are flagged', (() => {
      const deal = { terms: normTerms({basis:'price', base:10000000, mode:'pct', bp:200,
        payer:'seller', trigger:'registered'}),
        agents:[{agentId:'a1',shareBp:7000,joinedTs:1},{agentId:'a2',shareBp:6000,joinedTs:2}] };
      const al = allocation(deal);
      return al.over === true && al.sumBp === 13000;
    })());

    /* the allocation is a pure function of the SET, not of the array order */
    ok('the allocation does not depend on array order', (() => {
      const tm = normTerms({basis:'price', base:78000001, mode:'pct', bp:233, payer:'seller', trigger:'registered'});
      const a = [{agentId:'a1',side:'listing',shareBp:2500,joinedTs:100},
                 {agentId:'a2',side:'selling',shareBp:2500,joinedTs:200}];
      const x = JSON.stringify(allocation({terms:tm, agents:a}));
      const y = JSON.stringify(allocation({terms:tm, agents:a.slice().reverse()}));
      return x === y;
    })());

    /* ---- earned / payable / paid ---- */
    ok('an expected deal is NOT owed', (() => {
      const m = agentMoney('a3');
      return m.expected === 40000 && m.earned === 0 && m.payable === 0;
    })(), JSON.stringify(agentMoney('a3')));
    ok('earned is not payable until the gate opens', (() => {
      const d1 = dealById('d1');
      return isEarned(d1) && !gateOpen(d1) && S.cfg.payWhen === 'received';
    })());
    ok('opening the gate makes earned payable', (() => {
      S.cfg.payWhen = 'earned';
      const on = agentMoney('a2').payable;
      S.cfg.payWhen = 'received';
      const off = agentMoney('a2').payable;
      return on > 0 && off === 0;
    })());
    ok('a reversal leaves both lines and nets to zero', (() => {
      const rows = rowsOfDeal('d5');
      const earn = rows.filter(r => r.type === 'earn').reduce((a,r) => a+r.amt, 0);
      const rev  = rows.filter(r => r.type === 'reverse').reduce((a,r) => a+r.amt, 0);
      return earn > 0 && rev === -earn && rows.filter(r => r.type === 'earn').length > 0;
    })());
    ok('owed = earned − paid, from two books', (() => {
      const m = agentMoney('a1');
      return m.owed === m.earned - m.paid && m.paid === 200000;
    })(), JSON.stringify(agentMoney('a1')));
    ok('a payout moves the balance by exactly the payout', (() => {
      const before = agentMoney('a1').owed;
      postRow({ agent:'a1', type:'payout', amt:-50000, ts:S.today, deal:'d2', actor:'owner' });
      const after = agentMoney('a1').owed;
      S.rows = S.rows.filter(r => !(r.type === 'payout' && r.amt === -50000));
      S.owed = rebuildOwed();
      const back = agentMoney('a1').owed;
      return after === before - 50000 && back === before;
    })());

    /* the whole fee lands somewhere: agents plus the agency, per deal */
    ok('every dram of every earned fee is attributed', (() => {
      return (S.deals||[]).every(d => {
        const al = allocation(d);
        if(!al || !isEarned(d)) return true;
        const earn = rowsOfDeal(d.id).filter(r => r.type === 'earn').reduce((a,r) => a+r.amt, 0);
        return earn === al.fee;
      });
    })());

    /* ---- stage as a monotone rank on the row ---- */
    ok('the stage on the deal equals the max rank in the log',
       (S.deals||[]).every(d => rankFromLog(d.id) === DEAL_RANK[d.stage]),
       (S.deals||[]).map(d => d.id + ':' + rankFromLog(d.id) + '/' + DEAL_RANK[d.stage]).join(' '));
    ok('a lease never offers the cadastre stage',
       !stageApplies(dealById('d3'), 'registered') && stageApplies(dealById('d1'), 'registered'));

    /* ---- THE 30-WORKING-DAY CADASTRE CLOCK ----
       Counted Mon–Fri minus the shipped Armenian holiday table. 20 April 2026 is a Monday;
       the weekdays after it up to and including Monday 27 April are 21, 22, 23, 24 and 27 — five
       — of which 24 April is a shipped non-working day, so four are used and 26 remain. */
    ok('the filing clock skips weekends and shipped holidays',
       workingDaysLeft(D(2026,4,20), 30, D(2026,4,27)) === 26,
       String(workingDaysLeft(D(2026,4,20), 30, D(2026,4,27))));
    /* AND IT IS ALLOWED TO GO PAST ZERO. A deal one day before the cadastre deadline and one
       thirty days past it rendered identically — «0 աշխատանքային օր», no overdue state — on the
       most urgent card the owner's Today screen can carry. */
    ok('the filing clock runs past zero and says how far', (() => {
      const over = workingDaysLeft(D(2026,1,1), 5, D(2026,6,1));
      return over < 0 && filingLeftText(over) === fmt('d_filing_over', {n:-over})
        && filingLeftText(3) === fmt('d_filing_left', {n:3});
    })());
    /* the provenance line has to be true of the WHOLE window, not only of its first day */
    ok('an unknown year degrades to weekdays AND SAYS SO',
       !holidayTableCovers(D(2031,4,20), 30) && holidayTableCovers(D(2026,4,20), 30)
       && !holidayTableCovers(D(2026,12,10), 30) && holidayTableKnownStart(D(2026,12,10)));

    /* ---- ten years is ten years ---- */
    ok('the retention date is ten CALENDAR years, leap days included',
       plusYears(D(2026,5,13), 10) === D(2036,5,13)
       && plusYears(D(2024,2,29), 10) === D(2034,2,28)
       && plusYears(0, 10) === 0);

    /* ---- migrate ---- */
    ok('migrate is idempotent', (() => {
      const a = JSON.stringify(migrate(JSON.parse(JSON.stringify(S))));
      const b = JSON.stringify(migrate(JSON.parse(a)));
      return a === b;
    })());
    ok('migrate survives garbage', (() => {
      const s = migrate({ agents:[null,{},{id:'x',defaultShareBp:'abc'}], props:'nope',
        deals:[{id:'d', stage:'☠', agents:[{agentId:'x', shareBp:-5}]}], rows:[{type:'nope'}],
        cfg:{payWhen:'☠', stuckDays:-4} });
      return s.props.length === 0 && s.cfg.payWhen === 'received' && s.cfg.stuckDays === 1
        && s.deals[0].stage === 'agreed' && s.deals[0].agents[0].shareBp === 0
        && s.agents.find(a => a.id === 'x').defaultShareBp === null && s.rows.length === 0;
    })());
    ok('migrate never invents a commission rate', (() => {
      const s = migrate({ deals:[{ id:'d', terms:{ base:1000000 } }] });
      return feeOf(s.deals[0].terms) === null;
    })());
    ok('the state survives a round trip through adopt', (() => {
      const snap = JSON.parse(JSON.stringify(S));
      const before = JSON.stringify(activeAgents().map(a => agentMoney(a.id)));
      S = adopt(snap);
      return JSON.stringify(activeAgents().map(a => agentMoney(a.id))) === before;
    })());

    /* ---- provenance ---- */
    ok('days on market names its source',
       (S.props||[]).every(p => { const d = daysOnMarket(p); return !d || ['listed','mandate','created'].indexOf(d.src) >= 0; }));
    ok('the fee always carries its sentence',
       (S.deals||[]).every(d => !termsComplete(d.terms) || (feeWhy(d) || '').length > 0));

    /* ---- WHO PAYS: the second axis with no default ----
       Inventing a payer split is the same class of error as inventing a rate, and it was live:
       {seller:50%, buyer:30%} silently charged the buyer the unallocated 20%, and normTerms' own
       {0,0} fallback charged the buyer 100% of a fee nobody said they owed. */
    ok('an unset payer split is null, not a buyer split', (() => {
      const tm = normTerms({ basis:'price', base:76000000, mode:'pct', bp:200,
        payer:'split', trigger:'registered' });
      return tm.splitBp === null && payerSplit(tm, feeOf(tm)) === null && !termsComplete(tm);
    })());
    ok('a split that does not total 100% is refused', (() => {
      const tm = normTerms({ basis:'price', base:76000000, mode:'pct', bp:200, payer:'split',
        splitBp:{seller:5000, buyer:3000}, trigger:'registered' });
      return payerSplit(tm, feeOf(tm)) === null && !termsComplete(tm);
    })());
    ok('a balanced split reconciles to the dram, for every share', (() => {
      for(let sb = 0; sb <= 10000; sb += 137){
        const tm = normTerms({ basis:'price', base:76000001, mode:'pct', bp:225, payer:'split',
          splitBp:{seller:sb, buyer:10000-sb}, trigger:'registered' });
        const fee = feeOf(tm), ps = payerSplit(tm, fee);
        if(!ps || ps.seller + ps.buyer !== fee) return false;
      }
      return true;
    })());
    ok('a single-side payer owes the whole fee and nothing is left over', (() => {
      const mk = p => normTerms({ basis:'price', base:38500000, mode:'pct', bp:250, payer:p,
        trigger:'registered' });
      const a = payerSplit(mk('seller'), feeOf(mk('seller')));
      const b = payerSplit(mk('buyer'),  feeOf(mk('buyer')));
      return a.seller === 962500 && a.buyer === 0 && b.buyer === 962500 && b.seller === 0;
    })());

    /* ---- the ledger refuses fractional money instead of rounding it in silence ---- */
    ok('a fractional money row is refused, with a reason', (() => {
      const n = S.rows.length, rj = LEDGER_REJECTS.length;
      const r = postRow({ agent:'a1', type:'adjust', amt:1234.56, ts:500, deal:'d1', actor:'owner' });
      const refused = r === null && S.rows.length === n
        && LEDGER_REJECTS.length === rj + 1
        && LEDGER_REJECTS[LEDGER_REJECTS.length-1].why === 'fractional_amount';
      LEDGER_REJECTS.length = rj;
      return refused;
    })());
    ok('an integer money row still posts', (() => {
      const n = S.rows.length;
      const u = postRow({ agent:'a1', type:'adjust', amt:-1235, ts:501, deal:'d1', actor:'owner', note:'t' });
      const okk = !!u && S.rows.length === n + 1;
      S.rows = S.rows.filter(x => x.uuid !== u); S.owed = rebuildOwed();
      return okk;
    })());

    /* ---- THE STAGE THE LEDGER IS ALLOWED TO CONTRADICT ---- */
    ok('a deal cannot claim «paid out» while an agent is still owed', (() => {
      const d = dealById('d2');
      const before = stageBlock(d);                 /* settled, next is paid, a1 owed 185,000 */
      const blocked = !!before && before.left === 185000 && nextStage(d) === 'paid';
      const u = postRow({ agent:'a1', type:'payout', amt:-185000, ts:S.today, deal:'d2',
        actor:'owner', note:'probe' });
      const clear = stageBlock(dealById('d2')) === null;
      S.rows = S.rows.filter(r => r.uuid !== u); S.owed = rebuildOwed();
      return blocked && clear;
    })());
    /* a lump sum with no deal on it still settles the deals it was owed against */
    ok('an unattributed payout is applied to the gate-open deals, oldest first', (() => {
      const before = dealOutstanding('d2','a1');
      const u = postRow({ agent:'a1', type:'payout', amt:-185000, ts:S.today, actor:'owner',
        note:'probe, no deal' });
      const settled = dealOutstanding('d2','a1') === 0 && before === 185000
        && stageBlock(dealById('d2')) === null
        /* and it did not reach a deal whose gate is still shut */
        && dealOutstanding('d1','a1') === 380000;
      S.rows = S.rows.filter(r => r.uuid !== u); S.owed = rebuildOwed();
      return settled;
    })());
    ok('a payout can name the deal it pays for', (() => {
      const ds = payableDealsOf('a1');
      return ds.length === 1 && ds[0].deal.id === 'd2' && ds[0].left === 185000
        && dealOutstanding('d2','a1') === 185000;
    })());

    /* ---- THE AGENT'S SHARE, AT BOTH LEVELS ---- */
    ok('an agent share is a share of the COMMISSION and is editable at both levels', (() => {
      const a = agentById('a1');
      const keep = a.defaultShareBp;
      a.defaultShareBp = null;                       /* «not agreed yet» is a legitimate value */
      const counted = activeAgents().filter(x => x.defaultShareBp == null).length === 1
        && navBadge('agents') === 1;
      a.defaultShareBp = keep;
      /* the per-deal number is frozen on the deal: raising the standing share must not move it */
      const d = dealById('d2');
      const perDeal = d.agents[0].shareBp;
      a.defaultShareBp = 9000;
      const frozen = dealById('d2').agents[0].shareBp === perDeal
        && allocation(d).rows[0].amount === 385000;
      a.defaultShareBp = keep;
      return counted && frozen && typeof openAgent === 'function' && typeof openDealAgents === 'function';
    })());
    ok('the shares on a deal may not promise away more than the commission', (() => {
      const d = dealById('d1');
      const over = allocation({ agents:[{agentId:'a1',shareBp:7000,joinedTs:1},
                                        {agentId:'a2',shareBp:5000,joinedTs:2}], terms:d.terms });
      return over.over === true && over.sumBp === 12000 && mintEarnings({
        id:'zzz', stage:'registered', stageTs:S.today, propertyId:'p1', terms:d.terms,
        agents:[{agentId:'a1',shareBp:7000,joinedTs:1},{agentId:'a2',shareBp:5000,joinedTs:2}] }) === 0;
    })());

    /* ---- the accountant's file ---- */
    ok('the commission export bills each paying side separately', (() => {
      const rows = commissionRows();
      const d1 = rows.filter(r => r[0] === dealNoOf('d1'));
      /* d1 is 76,000,000 at 2% = 1,520,000, split 50/50: two lines of 760,000, not one of the lot */
      return d1.length === 2 && d1[0][9] === 760000 && d1[1][9] === 760000
        && d1[0][9] + d1[1][9] === d1[0][8] && d1[0][10] === 760000;
    })());
    ok('a deal with no terms still gets a line', (() => {
      const rows = commissionRows();
      return rows.filter(r => r[0] === dealNoOf('d4')).length === 1
        && (S.deals||[]).every(d => rows.some(r => r[0] === dealDocNo(d)));
    })());
    ok('every commission header names its own column', (() => {
      const h = commissionRows()[0];
      return h[1] === t('csv_date') && h[7] === t('cm_rate') && h[3] === t('csv_side')
        && h[0] === t('csv_deal') && h[10] === t('cm_due_now') && h.length === 15;
    })());
    /* THE ACCOUNTANT MUST NOT BE HANDED AN INVOICE THAT SHOULD NOT EXIST. A reversed fee and a
       fee whose trigger has not fired both read as zero due, with the state column saying which. */
    ok('a fallen-through deal exports nothing as due, and carries its reversal', (() => {
      const rows = commissionRows().filter(r => r[0] === dealNoOf('d5'));
      const due = rows.reduce((n,r) => n + (typeof r[10] === 'number' ? r[10] : 0), 0);
      const rev = rows.filter(r => typeof r[9] === 'number' && r[9] < 0);
      /* one reversal per subject that earned: the agent's 30% and the agency's keep, summing to
         the whole fee — the file reconciles to zero the way the books do. */
      const sum = rev.reduce((n,r) => n + r[9], 0);
      return due === 0 && rows.length === 3 && rev.length === 2 && sum === -930000;
    })());
    ok('a deal whose trigger has not fired exports nothing as due', (() => {
      const rows = commissionRows().filter(r => r[0] === dealNoOf('d3'));
      return rows.length === 2 && rows.every(r => r[10] === 0)
        && rows.every(r => r[11] === t('csv_notyet'));
    })());
    /* a lease bills the landlord and the tenant — the words on the card, in the file */
    ok('a lease export names the landlord and the tenant, not the seller and the buyer', (() => {
      const rows = commissionRows().filter(r => r[0] === dealNoOf('d3'));
      return rows[0][3].indexOf(t('cm_payer_landlord')) === 0
        && rows[1][3].indexOf(t('cm_payer_tenant')) === 0;
    })());
    /* the deal's own number, on every document and in the export — never the array key */
    ok('a deal document number is quotable and unique', (() => {
      const ns = (S.deals||[]).map(dealDocNo);
      return ns.every(x => /^Գ-\d{4}-\d{3}$/.test(x)) && new Set(ns).size === ns.length;
    })());

    /* ---- the viewing is the evidence, and it is in the log ---- */
    ok('every viewing has its evidence row',
       (S.viewings||[]).every(v => (S.rows||[]).some(r => r.type === 'view'
         && r.prop === v.propertyId && r.client === v.clientId && r.ts === v.ts)));
    ok('a viewing document number is unique and quotable', (() => {
      const ns = (S.viewings||[]).map(viewDocNo);
      return ns.every(x => /^ՑԹ-\d{4}-\d{3}$/.test(x)) && new Set(ns).size === ns.length;
    })());
    ok('a deal names the viewing that supports its claim',
       supportingViewings(dealById('d1')).length > 0);

    /* ---- the statement is the fold, not a second book ---- */
    ok('the statement closes on exactly what the fold says is owed',
       activeAgents().every(a => {
         const rows = moneyRowsFor(a.id);
         let bal = 0; rows.forEach(r => bal += r.amt);
         return bal === agentMoney(a.id).owed;
       }));

    /* ---- the amount in words, in Armenian, on every language ---- */
    ok('the amount in words is Armenian and matches the figure',
       amWords(0) === 'զրո դրամ'
       && amWords(1520000) === 'միլիոն հինգ հարյուր քսան հազար դրամ'
       && amWords(-200000) === 'մինուս երկու հարյուր հազար դրամ'
       && amWords(2000000) === 'երկու միլիոն դրամ'
       && amWords(472500) === 'չորս հարյուր յոթանասուներկու հազար հինգ հարյուր դրամ');

    /* ---- a rate typed by a person becomes integer basis points and nothing else ---- */
    ok('a typed rate quantises to basis points',
       bpFromPct('2') === 200 && bpFromPct('2.25') === 225 && bpFromPct('2,25') === 225
       && bpFromPct('') === null && bpFromPct('abc') === null && bpFromPct('-1') === null
       && bpFromMonths('0.5') === 5000 && bpFromMonths('1') === 10000);

    /* ---- the terms form cannot produce terms the engine would refuse ---- */
    ok('the terms form and the engine agree on what is complete', (() => {
      TF = { deal:'d4', mandate:'', basis:'price', base:'27000000', mode:'pct', pct:'2.25',
             flat:'', months:'', payer:'split', sellerPct:'50', buyerPct:'30', vat:'none',
             trigger:'registered', note:'' };
      const bad = termsComplete(tfTerms());
      TF.buyerPct = '50';
      const good = termsComplete(tfTerms()) && feeOf(tfTerms()) === 607500;
      TF = null;
      return !bad && good;
    })());

    /* ---- trilingual parity ---- */
    const hk = Object.keys(T.hy);
    const missEn = hk.filter(k => T.en[k] == null), missRu = hk.filter(k => T.ru[k] == null);
    const extraEn = Object.keys(T.en).filter(k => T.hy[k] == null);
    const extraRu = Object.keys(T.ru).filter(k => T.hy[k] == null);
    ok('EN parity', missEn.length === 0 && extraEn.length === 0, missEn.concat(extraEn).join(','));
    ok('RU parity', missRu.length === 0 && extraRu.length === 0, missRu.concat(extraRu).join(','));
    ok('every ledger row type has a label',
       ROW_TYPES.every(x => T.hy['lt_'+x] && T.en['lt_'+x] && T.ru['lt_'+x]));
    ok('every deal stage has a label',
       DEAL_STAGES.every(x => T.hy['dst_'+x] && T.en['dst_'+x] && T.ru['dst_'+x]));
    ok('every property status has a label',
       PROP_STATUS.every(x => T.hy['ps_'+x] && T.en['ps_'+x] && T.ru['ps_'+x]));
    ok('every district has a label',
       YER_DISTRICTS.every(x => T.hy['dis_'+x] && T.en['dis_'+x] && T.ru['dis_'+x]));
    ok('every nav key has a label and an icon',
       NAV_KEYS.every(x => T.hy['tab_'+x] && T.en['tab_'+x] && T.ru['tab_'+x] && NAV_ICON[x]));

    /* ---- the storage namespace ---- */
    ok('every key is estate_*', Object.keys(K).every(k => String(K[k]).indexOf('estate_') === 0));
    ok('no assay_*, voski_* or armtrade key',
       Object.keys(K).every(k => !/^(assay_|voski_|at_|armtrade)/.test(String(K[k]))));

    /* ---- escaping ---- */
    /* the export is aimed at the one person in the agency who handles the money */
    ok('the CSV guard neutralises a formula and keeps a plain cell',
       csvCell('=1+1') === '"\'=1+1"' && csvCell('@SUM(A1)') === '"\'@SUM(A1)"'
       && csvCell('Կոմիտաս 52') === '"Կոմիտաս 52"' && csvCell('a"b') === '"a""b"');
    ok('escH neutralises a quote and a bracket',
       escH('<b x="1">\'&') === '&lt;b x=&quot;1&quot;&gt;&#39;&amp;');
    ok('jsArg survives an apostrophe', jsArg("O'Brien") === '&#39;O\\&#39;Brien&#39;');
  } catch(e){
    fail++; out.push('FAIL threw — ' + (e && e.message || e));
  } finally { S = real; }
  out.push((fail ? 'FAILED ' : 'PASSED ') + pass + '/' + (pass+fail));
  console.log(out.join('\n'));
  return { pass:pass, fail:fail, lines:out };
}

/* =====================================================================================
   BOOT
   ===================================================================================== */
function boot(){
  loadU(); lang = U.lang;
  const stored = loadState();
  S = adopt(stored || seedState());        /* migrate() on EVERY adoption path */
  if(!stored) saveState();
  /* the invariant is asserted at boot, not assumed. If the cache and the fold disagree, the fold
     wins — the log is the truth and the cache is only a cache. */
  const bad = verifyLedger();
  if(bad.length){
    console.warn('ArmEstate: the owed cache disagreed on', bad.length, 'subjects — rebuilding from the log');
    healLedger(); saveState();
  }
  /* §1.9 — the money rows are DERIVED on the owner's device. A deal that arrives marked void from
     a restored backup or an agent's contribution carries no reversal with it, and until one is
     posted the payouts screen would offer «Վճարել» against a fee that no longer exists. */
  try{ if(reconcileVoids()) saveState(); }catch(e){ console.warn('ArmEstate: void reconcile', e); }
  renderAll();
  swWantCyrillic();
  window.addEventListener('resize', () => { try{ renderNav(); }catch(e){} });
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape' || e.key === 'Esc'){ try{ if(escClose()) e.preventDefault(); }catch(err){} }
  });
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
}
try{ boot(); }catch(e){ try{ renderRecovery(e); }catch(e2){ console.error(e, e2); } }
</script>
