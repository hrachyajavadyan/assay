/* keyed to the AUTHOR, not to "me": the same message is the same colour on both devices */
.msg.byshop .bub{background:var(--acc-tint);border-color:var(--acc-line)}
/* R7 · 14px, not the 12px --fs-caps token. These were the only two texts in the new UI under
   14px, and "who said this and when" is exactly what a 55-year-old reader checks in bad light. */
.msg .who{
  display:flex;align-items:center;gap:var(--s1);margin-bottom:2px;
  font-size:var(--fs-micro);font-weight:var(--fw-caps);letter-spacing:var(--ls-caps);color:var(--dim);
}
.msg .when{font-size:var(--fs-micro);color:var(--dim);margin-top:var(--s1);text-align:right}
.pccomp{display:flex;gap:var(--s2);align-items:stretch}
.pccomp .search{margin:0;flex:1;min-width:0}
.pccomp .btn{flex:0 0 auto}

/* ================= PRINT =================
   MUST be the last block in the sheet. Declared earlier it lost every property that a later
   same-specificity rule redeclared (.modal, .mbody), which pinned the գույքագրման ակտ to the
   bottom of the sheet on a dark canvas. !important covers the theme rules (body.light .mbody),
   which outrank a bare .mbody selector wherever they sit. */
@media print{
  @page{margin:14mm}
  html,body{background:#fff !important;color:#111 !important}
  body::before,body::after{display:none !important}
  #top,#app,nav,#toast,.noprint,.grabber{display:none !important}
  .modal{position:static !important;inset:auto !important;background:#fff !important;display:block !important;
         align-items:flex-start !important;backdrop-filter:none !important;-webkit-backdrop-filter:none !important;animation:none !important}
  .mbody{background:#fff !important;color:#111 !important;border:none !important;box-shadow:none !important;
         max-height:none !important;height:auto !important;overflow:visible !important;border-radius:0 !important;
         max-width:none !important;width:100% !important;padding:0 !important;backdrop-filter:none !important;
         -webkit-backdrop-filter:none !important;animation:none !important}
  .mbody .muted{color:#555 !important}
  .mbody .big,.mbody .osum{color:#111 !important}
  .tblwrap,.spwrap{max-height:none !important;overflow:visible !important;background:none !important;
                   margin:0 !important;padding:0 !important}
  .tbl{table-layout:auto !important}
  .tbl th,.tbl td{width:auto !important;display:table-cell !important;white-space:normal !important}
  .tblsub{display:none !important}
  /* data, not a fold — see the .subkeep note above */
  .subkeep{display:block !important;color:#333 !important;font-size:11px !important}
  /* the dram sign is INSIDE the .num it belongs to, so the td colour rule never reached it and
     it printed 8px light-grey on both documents. On paper every mark is ink. */
  .cur{color:#111 !important;font-size:max(.72em,12px) !important;font-weight:600 !important}
  .doclbl,.mlbl{color:#333 !important;font-size:11px !important;letter-spacing:0 !important;
                text-transform:none !important}
  /* the կադաստրային ծածկագիր is what the contract, the վկայական and the future state platform
     all key on — it is the identity of the thing being sold, not a caption, so it prints as ink
     rather than in the quiet on-screen grey. */
  .cad{color:#111 !important}
  .prov{color:#444 !important}
  .telbtn{color:#111 !important;min-height:0 !important;padding:0 !important}
  .tbl{page-break-inside:auto}
  .tbl tr{page-break-inside:avoid}
  .tbl th{color:#555 !important;border-color:#ccc !important}
  .tbl td{border-color:#ddd !important;color:#111 !important}
  .badge{border:1px solid #999 !important;color:#111 !important;background:none !important}
  /* rules and signature lines are drawn with the THEME stroke colour, which is a near-white
     translucent in dark mode and vanishes on paper: force ink for print. */
  .mbody hr,.actrule,.actsep{border-color:#bbb !important}
  .actsignline{border-bottom:1px solid #333 !important}
  /* the act keeps all seven columns on paper — the narrow-screen column hiding is screen-only */
  .acttbl th,.acttbl td{display:table-cell !important}
  .acttbl .actsub{display:none !important}
  .thlong{display:inline !important}
  .thshort{display:none !important}
}

/* ================= ArmVoski additions to the ArmTrade design system =================
   Everything above is ArmTrade's system verbatim, so the two products are siblings: same
   tokens, same components, same 4px rhythm, same 44px tap floor, same accent (--acc:#F0A93B,
   which is already gold). What follows is only what the gold trade needs and the shop system
   does not have a class for. Nothing here introduces a second accent or a size below 14px. */

/* ---------- weight ----------
   WEIGHT IS MONEY. At 51,738 ֏ per gram of 999, 0.01 g is 517 ֏ — more than a cup of coffee —
   so a gram figure gets exactly the treatment a dram figure gets: tabular lining figures, a
   quiet unit mark riding inside the number, never a mid-figure line break. `.g` is `.cur` for
   grams and inherits its 14px floor for the same reason: a unit mark that reads as a smudge is
   the one thing a unit mark may never do. */
.g{
  font-size:max(.7em,14px);font-weight:600;color:var(--muted);
  margin-left:.22em;letter-spacing:0;font-variant-numeric:normal;
}
.badge .g{font-size:1em;font-weight:700;color:inherit;margin-left:.15em}

/* ---------- the breakdown line ----------
   The single best thing in ARMGOLD: the whole formula with the actual numbers substituted, so
   the jeweller can check it against the number in his head. No computed money appears anywhere
   in this product without one. It wraps rather than scrolls — a formula the reader has to drag
   sideways is a formula he will not read — and its operators are dimmer than its operands so
   the shape of the arithmetic survives the wrap. */
.brk{
  margin-top:var(--s2);padding:var(--s2) var(--s3);
  background:var(--surface-2);border:var(--bw) solid var(--sep);border-radius:var(--r-xs);
  font-size:var(--fs-micro);line-height:1.7;color:var(--ink);
  font-variant-numeric:tabular-nums lining-nums;
  overflow-wrap:break-word;
}
/* the operands are atomic. `overflow-wrap:break-word` on the container is what lets a long
   formula wrap at all, and without this it happily split «6,523,251» across two lines — a money
   figure broken mid-figure is not a wrap, it is a misread number. */
.brk b{white-space:nowrap}
/* the metal an operand belongs to. The valuation line adds gold grams and silver grams in one
   sum under a single caption; without naming each metal beside its own rate the line cannot be
   re-done in the reader's head, which is the only job it has. */
.brk .mn{color:var(--dim);font-weight:600;margin-right:.3em;white-space:nowrap}
.brk .op{color:var(--dim);font-weight:600;padding:0 .15em}
.brk .eq{color:var(--dim);font-weight:600;padding:0 .2em}
.brk b{font-weight:700}
.brk .why{
  display:block;margin-top:var(--s1);
  font-size:var(--fs-micro);line-height:var(--lh-micro);color:var(--dim);font-weight:500;
  font-variant-numeric:normal;
}

/* ---------- the rate card ----------
   The 999 rate is the number every other number in the product is derived from, so it is never
   shown without its provenance and its age. A stale rate is stated, not hidden: hiding it would
   leave the jeweller quoting yesterday's gold at today's counter. */
.ratecard{
  background:var(--acc-tint);border:var(--bw-strong) solid var(--acc-line);
  border-radius:var(--r);padding:var(--s4);margin-bottom:var(--s3);
}
.ratecard .rv{
  font-size:var(--fs-display-m);font-weight:var(--fw-display-m);
  line-height:var(--lh-display-m);letter-spacing:var(--ls-display-m);
  color:var(--ink);font-variant-numeric:tabular-nums lining-nums;
}
.ratecard .rprov{
  margin-top:var(--s1);font-size:var(--fs-micro);line-height:var(--lh-micro);
  color:var(--acc-text);font-weight:600;
}
.ratecard .rprov.stale{color:var(--danger);font-weight:700}
.ratecard .rrow{display:flex;gap:var(--s3);flex-wrap:wrap;margin-top:var(--s3)}
.ratecard .rsub{flex:1 1 130px;min-width:0}
.ratecard .rsub .l{
  font-size:var(--fs-caps);font-weight:var(--fw-caps);line-height:var(--lh-caps);
  color:var(--dim);
}
.ratecard .rsub .v{font-size:var(--fs-body-l);font-weight:700;color:var(--ink);
  font-variant-numeric:tabular-nums lining-nums}

/* ---------- fineness chip ----------
   Հարգ is the dimension of the quantity, not a decoration, so it reads as a figure: tabular,
   bold, boxed, never smaller than the label beside it. 583 and 585 sit next to each other in a
   real shop's tray and must be distinguishable at a glance. */
.harg{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:46px;min-height:26px;padding:2px var(--s2);
  border-radius:var(--r-xs);border:var(--bw) solid var(--stroke2);
  background:var(--surface-2);color:var(--ink);
  font-size:var(--fs-label);font-weight:700;line-height:1.2;
  font-variant-numeric:tabular-nums lining-nums;flex:0 0 auto;
}
.harg.au{background:var(--acc-tint);border-color:var(--acc-line);color:var(--acc-text)}
.harg.ag{background:var(--info-tint);border-color:var(--info-line);color:var(--info)}

/* ---------- a fineness group in the tray ----------
   Grams are NEVER summed across finenesses (10 g of 585 and 10 g of 750 are not 20 g of
   anything), so the tray's arithmetic happens inside these groups and the only figure that
   crosses them is pure metal. The group header carries its own subtotal so the reader never has
   to hold one in his head while scrolling. */
.fgrp{margin-bottom:var(--s3)}
.fgrp>.fhead{
  display:block;
  padding:var(--s3);background:var(--surface-2);
  border:var(--bw) solid var(--stroke);border-radius:var(--r) var(--r) 0 0;
}
/* the identity of the group on one line, its weight on the same line's right edge. The two
   figures never run together: the weight is a block, so a wrap puts it on its own line rather
   than butting it against the label. */
.fgrp>.fhead .frow{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
.fgrp>.fhead .frow .w{
  margin-left:auto;font-size:var(--fs-body-l);font-weight:700;color:var(--ink);
  font-variant-numeric:tabular-nums lining-nums;white-space:nowrap;
}
.fgrp>.fhead .brk{margin-top:var(--s2);background:var(--surface);}
.fgrp>.fbody{
  border:var(--bw) solid var(--stroke);border-top:none;border-radius:0 0 var(--r) var(--r);
  background:var(--surface);overflow:hidden;
}

/* a piece row: tap target is the whole row, never an icon inside it */
.prow{
  display:flex;align-items:center;gap:var(--s3);width:100%;
  padding:var(--s3);min-height:56px;
  background:transparent;border:none;border-bottom:var(--bw) solid var(--sep);
  border-radius:0;font-family:var(--font);color:var(--ink);text-align:left;cursor:pointer;
  transition:background var(--dur-1) var(--ease);
}
.prow:last-child{border-bottom:none}
.prow:active{background:var(--surface-2)}
.prow:focus-visible{outline:none;box-shadow:var(--focus)}
.prow .pi{flex:1 1 auto;min-width:0}
/* Wrap to two lines, NOT ellipsis — the same call this file already makes for .sug .nm and for
   the same reason. At 320px «Կախազարդ քարով» clipped to «Կախազարդ քա…» and, worse, «Ջարդոն ·
   Արծաթ» clipped to «Ջարդոն · Արծ…», where the truncated word is the metal name and the metal
   name is the row's whole identity. */
.prow .pnm{font-size:var(--fs-body-l);font-weight:600;line-height:1.3;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow-wrap:break-word}
.prow .psub{font-size:var(--fs-micro);line-height:var(--lh-micro);color:var(--muted);
  margin-top:2px;display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center}
/* A LOCATION IS A PHRASE, NOT A FIGURE. «Հարգորոշման տեսչությունում» is one badge and badges are
   white-space:nowrap by design, so at 320px it ran 92px past the row's info column and was
   clipped — on the sell list, where «the ring is across town» is exactly the thing the row exists
   to say. Inside a row's sub-line a badge may break between words rather than be cut; the same
   call .badgerow already makes, for the same reason. Figures are untouched: only the sub-line's
   badges are affected, and nothing in a sub-line is a number. */
.prow .psub .badge,.cnrow .cnnm .s .badge{white-space:normal;text-align:left}
.prow .psub>span,.cnrow .cnnm .s>span{min-width:0;overflow-wrap:anywhere}
.prow .pw{flex:0 0 auto;text-align:right}
.prow .pw .a{font-size:var(--fs-body-l);font-weight:700;
  font-variant-numeric:tabular-nums lining-nums;white-space:nowrap}
.prow .pw .b{font-size:var(--fs-micro);color:var(--muted);white-space:nowrap;
  font-variant-numeric:tabular-nums lining-nums}

/* the pure-metal total. ONE honest single number for "how much gold is in this shop", and the
   only figure in the product allowed to cross a fineness boundary. */
.puretot{
  background:var(--surface);border:var(--bw-strong) solid var(--acc-line);
  border-radius:var(--r);padding:var(--s4);margin-bottom:var(--s3);
}
.puretot .l{font-size:var(--fs-caps);font-weight:var(--fw-caps);color:var(--dim);
  line-height:var(--lh-caps)}
.puretot .v{font-size:var(--fs-display-m);font-weight:var(--fw-display-m);
  line-height:var(--lh-display-m);letter-spacing:var(--ls-display-m);color:var(--ink);
  font-variant-numeric:tabular-nums lining-nums;margin-top:2px}

/* ArmTrade hides its wordmark below 461px because its demo header carries SEVEN controls and
   a 320px row cannot hold them plus a brand. This product's header carries three, so the brand
   stays down to 361px: without it a phone screen opens on a bare date chip and two icons, which
   reads as chrome that failed to load rather than as a product. Its DESCRIPTOR goes first (a
   clipped subtitle says less than no subtitle), and at 320px the wordmark itself goes rather
   than render as «ԱրմՈ…» — a truncated brand is worse than an absent one. */
@media (max-width:460px){ #top .logo{display:flex} #top .logo small{display:none} }
/* `>div` matched the logomark too — it is itself a div child of .logo — so .logo collapsed to
   0x0 and 320/360 got exactly the bare date chip and two icons the comment above says must not
   happen. 360dp is the most common Android width. Only the WORDMARK goes. */
@media (max-width:360px){ #top .logo>div:not(.logomark){display:none} }

/* A DERIVED FIELD MUST LOOK DERIVED. `disabled` alone renders almost identically to an editable
   input in this design system, so the jeweller reaching for the third weight finds a box that
   simply does not respond — which reads as a broken field, not as an answer the app computed.
   It gets the quiet fill, a dashed edge and a dimmer ink: visibly a readout, not an input.
   Contrast stays above AA because --muted is 5.8:1 on the light fill and 8.8:1 on the dark. */
input:disabled{
  background:var(--surface-2) !important;border-style:dashed !important;
  border-color:var(--stroke2) !important;color:var(--muted) !important;
  cursor:default;opacity:1;
}

/* a definition list inside a sheet: label above, figure below, on the 4px grid */
.dl{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin:var(--s3) 0}
.dl>div{min-width:0}
.dl .l{font-size:var(--fs-caps);font-weight:var(--fw-caps);line-height:var(--lh-caps);
  color:var(--dim)}
.dl .v{font-size:var(--fs-body-l);font-weight:700;color:var(--ink);margin-top:2px;
  font-variant-numeric:tabular-nums lining-nums;overflow-wrap:break-word}
@media (max-width:339px){ .dl{grid-template-columns:1fr} }

/* ---------- Գույքագրում — the count row (spec 5.4) ----------
   A piece is confirmed present or absent with ONE TAP: re-weighing every ring is not what a
   count is. So the row carries its own two 44px targets rather than opening a sheet, and the
   name itself is a third target for the optional re-weigh. Nothing on the row shows the book
   figure — the count is blind until the act. */
.cnrow{display:flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s3);
  border-bottom:var(--bw) solid var(--stroke);min-height:56px}
.cnrow:last-child{border-bottom:none}
.cnrow .cnnm{flex:1 1 auto;min-width:0;text-align:left;background:none;border:none;padding:0;
  font-family:var(--font);color:var(--ink);cursor:pointer;min-height:44px}
.cnrow .cnnm .n{font-size:var(--fs-body-l);font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.cnrow .cnnm .s{font-size:var(--fs-micro);color:var(--muted);margin-top:2px;
  display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cnact{display:flex;gap:6px;flex:0 0 auto}
.cnact button{min-width:48px;min-height:44px;padding:0 var(--s2);border-radius:var(--r-xs);
  border:var(--bw) solid var(--stroke2);background:var(--surface);color:var(--muted);
  font-family:var(--font);font-size:var(--fs-label);font-weight:var(--fw-label);cursor:pointer}
.cnact button:active{transform:scale(.96)}
.cnact button.on.yes{background:var(--success-tint);color:var(--success);
  border-color:var(--success-line);border-width:var(--bw-strong);font-weight:700}
.cnact button.on.no{background:var(--danger-tint);color:var(--danger);
  border-color:var(--danger-line);border-width:var(--bw-strong);font-weight:700}
.cnrow .cnw{flex:0 0 108px;min-width:0}
.cnrow .cnw input{margin:0;min-height:44px;text-align:right}
.cnprog{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s2)}
.cnprog .bar{flex:1 1 auto;height:8px;border-radius:var(--r-pill);background:var(--surface-2);
  overflow:hidden;border:var(--bw) solid var(--stroke)}
.cnprog .bar i{display:block;height:100%;background:var(--acc);border-radius:var(--r-pill)}
.cnprog .n{flex:0 0 auto;font-size:var(--fs-label);font-weight:700;color:var(--ink);
  font-variant-numeric:tabular-nums lining-nums}

/* «this screen is not built yet» — an honest empty state, never a fake one. It names what will
   be here and what to use instead, because a jeweller who taps a tab and gets a blank panel
   assumes the app is broken. */
.stub{
  border:var(--bw) dashed var(--stroke2);border-radius:var(--r);
  padding:var(--s6) var(--s4);text-align:center;background:var(--surface);
}
.stub .se{font-size:30px;line-height:1;margin-bottom:var(--s3)}
.stub h4{margin:0 0 var(--s2);font-size:var(--fs-title);font-weight:var(--fw-title)}
.stub p{margin:0;color:var(--muted);font-size:var(--fs-body);line-height:1.5}

/* ---------- the counter flows: sell and buy-in ----------
   Two screens where a figure is read ACROSS a counter, not down at arm's length, so the price
   and the arithmetic under it get the display size the rate card gets. Nothing here introduces
   a second accent: the one accent-filled button on each screen is the commit. */
.pricebox{
  background:var(--surface);border:var(--bw-strong) solid var(--acc-line);
  border-radius:var(--r);padding:var(--s4);margin:var(--s3) 0;
}
.pricebox .l{font-size:var(--fs-caps);font-weight:var(--fw-caps);line-height:var(--lh-caps);color:var(--dim)}
.pricebox .v{
  font-size:var(--fs-display-m);font-weight:var(--fw-display-m);
  line-height:var(--lh-display-m);letter-spacing:var(--ls-display-m);color:var(--ink);
  font-variant-numeric:tabular-nums lining-nums;margin-top:2px;
}
.pricebox .brk{background:var(--surface-2)}

/* the buy act's own column fold. The seven-column act is ~520px wide and a 390px phone is the
   normal case, so below 560px the four reference columns fold into a sub-line under the row
   number and the four figures the customer is looking at — zuyt, rate, sum — stay on screen.
   PRINT ALWAYS CARRIES ALL EIGHT: the @media print block forces every .acttbl cell back to
   table-cell with !important, which outranks these selectors however specific they are. */
@media screen and (max-width:560px){
  .acttbl.buyact th:nth-child(4),.acttbl.buyact td:nth-child(4),
  .acttbl.buyact th:nth-child(5),.acttbl.buyact td:nth-child(5){display:none}
}

/* ================= ArmEstate supplement =================
   Everything above is ArmTrade's / ArmVoski's shipped design system, copied verbatim so the
   three products are siblings rather than cousins. Only the classes below are new, and each
   one exists because a real screen in this product needed a shape the shared kit did not have. */

/* the fee, and under it the sentence that explains it. Rule §8: never show a number you cannot
   explain in one sentence under it. This class IS that rule, made structural. */
.prov{font-size:var(--fs-micro);line-height:var(--lh-micro);color:var(--muted);margin-top:2px}
.prov.warn{color:var(--acc-text)}

/* the seven-stage pipeline, drawn as a rank rather than a row of tabs: what has happened is
   filled, what has not is a hairline, what does not apply to this deal kind is struck. */
.stg{display:flex;gap:3px;align-items:center;margin:var(--s2) 0 var(--s1)}
.stg i{flex:1 1 0;height:6px;border-radius:3px;background:var(--surface-3);font-style:normal}
.stg i.on{background:var(--acc)}
.stg i.na{background:repeating-linear-gradient(135deg,var(--surface-3) 0 3px,transparent 3px 6px)}
.stgname{font-size:var(--fs-caps);font-weight:var(--fw-caps);color:var(--dim)}

/* a split table: agent, share, amount. Tabular figures, and the last row is the reconciliation
   line — it is present on every split because a split that cannot show its own total is the
   thing this product exists to prevent. */
.sp{width:100%;border-collapse:collapse;margin-top:var(--s2)}
.sp td,.sp th{padding:6px 0;text-align:left;font-size:var(--fs-body);border-bottom:var(--bw) solid var(--sep)}
.sp th{font-size:var(--fs-caps);font-weight:var(--fw-caps);color:var(--dim)}
/* THE NUMERIC COLUMNS ARE SEPARATED BY PADDING, NOT BY LUCK. Both money columns are
   right-aligned and nowrap; with zero horizontal padding the Armenian and Russian description
   column squeezed column 2 to exactly its widest number and the statement printed
   «380,000380,000» — the screen that answers «what do I owe this agent» was unreadable in the
   primary language. English survived only because its description column was narrower. */
.sp td.n,.sp th.n{text-align:right;font-variant-numeric:tabular-nums lining-nums;
  white-space:nowrap;padding-left:10px}
.sp td.n:first-child,.sp th.n:first-child{padding-left:0}
/* A MONEY TABLE MAY NOT PUSH THE SHEET SIDEWAYS. Two right-aligned nowrap money columns plus
   their gap have a hard minimum width, and at 320px in Armenian — «Գործակալությանը» beside
   «1,520,000» — that minimum is 9px wider than the card it sits in. The table scrolls inside its
   own box rather than dragging the document with it; the sheet itself never scrolls sideways. */
.spwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 calc(-1 * var(--s1));padding:0 var(--s1)}
.sp tr.tot td{border-bottom:none;border-top:var(--bw-strong) solid var(--stroke2);font-weight:700}
.sp tr.keep td{color:var(--muted)}

/* the payout row: one agent, four states, the payable figure large because it is the only one
   that is a debt. */
.poh{display:flex;align-items:flex-start;gap:var(--s3)}
.poh .pon{flex:1 1 auto;min-width:0}
.pofour{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s2);margin-top:var(--s3)}
.pofour>div{background:var(--surface-2);border:var(--bw) solid var(--stroke);border-radius:var(--r-sm);padding:var(--s2) var(--s3)}
.pofour .l{font-size:var(--fs-caps);font-weight:var(--fw-caps);color:var(--dim);line-height:1.2}
.pofour .v{font-size:var(--fs-body-l);font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums lining-nums}
.pofour .v.big2{font-size:var(--fs-display-s)}

/* THE ABSENCE OF A FIGURE IS NOT A FIGURE. Where a fee would be, a deal with no terms shows a
   sentence — and it is set at title size, not at the 26px display size the money uses, because
   rendering «Պայմանները լրացված չեն» as a hero number is exactly the confusion between a value
   and its absence that this product refuses to make. */
.nofig{font-size:var(--fs-title);font-weight:var(--fw-title);line-height:var(--lh-title);
  color:var(--acc-text)}

/* A CHOICE WITH ITS CONSEQUENCE UNDER IT. The payout gate is two whole sentences, not two
   words, so it cannot be a chip row: a chip is white-space:nowrap by design and one of these
   sentences is 44 characters of Armenian, which overflowed the viewport at 320px. Two full-width
   rows instead, each carrying the consequence of choosing it in the line beneath. */
.pick{display:block;width:100%;text-align:left;background:var(--surface-2);
  border:var(--bw) solid var(--stroke2);border-radius:var(--r-sm);
  padding:var(--s3);margin-top:var(--s2);color:var(--ink);font-family:inherit;
  font-size:var(--fs-body-l);font-weight:600;line-height:1.35;min-height:44px;cursor:pointer}
.pick:active{background:var(--surface-3)}
.pick:focus-visible{outline:none;box-shadow:var(--focus)}
.pick.on{border-color:var(--acc);background:var(--acc-tint);color:var(--acc-text);border-width:var(--bw-strong)}
.pick .pd{display:block;font-size:var(--fs-micro);font-weight:400;color:var(--muted);
  margin-top:3px;line-height:var(--lh-micro)}
.pick.on .pd{color:var(--acc-text)}

/* A PHONE NUMBER IS A CONTROL, NOT A CAPTION. On the Clients screen the tel: links were the
   only interactive thing on the page and they measured 124x17 — the product's user is standing
   outside a building holding a phone in one hand, and a 17px-tall target is a mis-tap. This is
   a 44px row with the dial affordance in it. */
.telbtn{
  display:inline-flex;align-items:center;gap:var(--s2);min-height:44px;
  padding:var(--s1) var(--s3) var(--s1) 0;margin-top:2px;
  color:var(--acc-text);font-size:var(--fs-body);font-weight:600;text-decoration:none;
  font-variant-numeric:tabular-nums lining-nums;
}
.telbtn:active{opacity:.6}
.telbtn:focus-visible{outline:none;box-shadow:var(--focus);border-radius:var(--r-xs)}

/* the property tile is 44px like every other avatar in the suite */
.pmeta{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s3);margin-top:var(--s1)}
.pmeta span{font-size:var(--fs-micro);color:var(--muted);white-space:nowrap}
/* one exception, and it is a sentence rather than a figure: the conversion line carries its own
   denominator («Показ → предложение: 33% · измерено по 3») and at 320px in Russian it was a
   308px unbroken span that pushed the document 5px wide and clipped its last figure. A sentence
   wraps; only the FIGURES in it are atomic. */
.pmeta span.wrapok{white-space:normal;overflow-wrap:break-word}
/* break-word, NOT anywhere. `anywhere` broke «Անի Հարությունյան» into «Անի Հարությունյ / ան»
   whenever a badge shared the line — a person's name split mid-syllable is the single most
   careless-looking thing a back office can print. `break-word` only breaks a token that cannot
   fit on a line of its own, which is what a long cadastral code needs and a name never does. */
.addr{font-size:var(--fs-body-l);font-weight:var(--fw-body-l);line-height:var(--lh-body-l);color:var(--ink);
  overflow-wrap:break-word}
.cad{font-family:var(--mono);font-size:var(--fs-micro);color:var(--dim);letter-spacing:.2px}
</style>
</head>
<body class="light">
<div id="top"></div>
<div id="app"></div>
<nav id="nav" style="display:none"></nav>
<div id="toast"></div>
<div id="modalRoot"></div>

<script>
/* =====================================================================================
   ԱրմԷստեյտ / ArmEstate — an Armenian real-estate agency's BACK OFFICE.
   Not a portal. list.am and myrealty.am own distribution and that fight was never ours.
   What nothing local serves is the office behind the listings: the contracts, the viewings
   that make a fee claim defensible, the deal from handshake to պետական գրանցում, and — the
   thing the owner named first — exactly what each agent is owed, why, and since when.

   THIS FILE IS THE FOUNDATION. Present: the shell, the trilingual table, the six entities with
   their state machines, the commission engine, the append-only ledger, the properties list, the
   agent list, the deal list and the payout view. Absent and named honestly rather than faked
   (see stubView): sync and pairing, the printable documents, the viewing capture flow, clients,
   mandates as an editable object, and the agent's own three-screen product.

   FIVE INVARIANTS. Everything below depends on them.

   1. THERE IS NO DEFAULT COMMISSION RATE, anywhere, ever. Three of the highest-traffic Armenian
      agency sites publish no figure; the third-party numbers (1–3%, "~2% each side", 1.5–2.5%)
      do not agree with each other; rentals are quoted both as "up to 50% of the first month,
      split" and as "a full month". That disagreement IS the finding. A deal cannot leave stage 0
      until a human has typed the terms. Inventing a rate would be the worst thing this product
      could do, so `feeOf()` returns null — not zero — when the terms are unset.
   2. MONEY IS SIGNED INTEGER DRAM. No float touches a money field. Every rate is integer basis
      points: 2% is 200, not 0.02. Money is ROUNDED in exactly THREE sanctioned places and they
      are named here so a reviewer can check the claim rather than trust it:
        · feeOf()  — the fee from a rate and a base;
        · allocBp() — the cumulative allocator, which is the only thing that DIVIDES money;
        · safeInt() — the boundary normaliser, reached by safeAmd/clampAmd, which turns a value
          arriving from storage or a merge into an integer. It is a boundary, not arithmetic.
      Beyond the boundary nothing rounds, because beyond the boundary nothing is fractional:
      postRow() REFUSES a money row carrying a fractional amount rather than rounding it in
      silence. A fourth money-rounding site in this file is a bug.
   3. A SPLIT RECONCILES TO THE DRAM. Whenever one amount is divided, the last part is the whole
      minus the parts already taken, never its own rounded share. allocBp() is that rule, and
      assertReconciles() asserts it at every mint and in the fuzz test.
   4. THE LEDGER IS THE TRUTH. S.rows is append-only, postRow() is its only writer, `owed` is a
      cache that rebuildOwed() re-derives and verifyLedger() checks at boot. The fold is `+`, it
      is commutative, and there is no `order` field on a row and there never will be — deal stage
      rides on the row as a monotone RANK, which merges with max().
   5. THE VIEWING IS THE FEE-TRIGGERING EVENT, not the listing. Aparto's own published terms say
      the client pays "only for the property that you have visited with us and subsequently
      purchased". So a viewing is an immutable evidence row in the same log as the money, with
      amount 0 — not a calendar entry that can be edited after the fact.

   THE DRAFT LAW. A Law on Realtor Activity was approved by government on 29 May 2025 and sent to
   parliament: state registration, a qualification exam, a written contract per client registered
   in a state platform within 3 days, 10-year retention, professional liability insurance,
   exclusivity capped at 6 months. IT IS NOT VERIFIED AS ENACTED and nothing here is built as if
   it were law. Where a cheap design choice keeps the door open — a contract record, an
   exclusivity end date, a `qual` block, an export that survives ten years — it is taken, and the
   comment beside it says so. Where it would cost real work (platform integration), it is not.
   ===================================================================================== */

   currency is converted ONCE, by a person, and the dram figure is what this product stores. */
const MAX_AMD = 9999999999;          /* ֏10bn — a Yerevan tower, not a flat. A guard, not a limit. */
const LEDGER_CAP = 1000000000000;    /* ledger clamp, per §6 */

const PROP_KINDS   = ['flat','house','land','commercial'];
const DEAL_KINDS   = ['sale','lease'];

   falls through. Rather than invent a non-commutative fold, status is a STAMPED field: value plus
   timestamp, latest wins, ties broken by device id. That primitive already exists in the suite. */
const PROP_STATUS  = ['draft','active','reserved','sold','leased','withdrawn','archived'];

/* Mandate status IS forward-only after `signed`, so it is a monotone rank and merges with max().
   The three terminal states share the top rank; a set-once `closedAs` breaks the tie. */
const MANDATE_RANK = { draft:0, signed:1, active:2, expired:3, terminated:3, fulfilled:3 };
const MANDATE_STATUS = ['draft','signed','active','expired','terminated','fulfilled'];

/* THE PIPELINE. Seven forward stages, verified end to end against the Armenian deal flow:
   միասնական տեղեկանք → նախնական պայմանագիր with a deposit → notarised առուվաճառքի պայմանագիր
   (mandatory, Civil Code 562) → non-cash payment above AMD 300,000 → պետական գրանցում at the
   Cadastre within 30 working days → վկայական. The last three stages are the agency's own money
   and are missing from every generic CRM, which is the whole point of this product.
   monotoneRank: the rank rides on the ledger row, max() merges it, and FAILURE IS NOT A STAGE —
   a fallen deal keeps the rank it reached and carries a set-once `void`. */
const DEAL_STAGES = ['agreed','deposit','notary','registered','invoiced','settled','paid'];
const DEAL_RANK = {}; DEAL_STAGES.forEach((s,i) => { DEAL_RANK[s] = i; });

/* Stages 1 and 3 do not apply to every deal: a short lease has no նախավճար and no cadastral
   registration of a transfer. The rank still works — the UI simply never offers a stage that
   does not apply, and the deal card strikes it through with «չի կիրառվում». */
const STAGE_NA = { lease: ['registered'] };

/* THE TRIGGER → STAGE MAP. terms.trigger is per deal and is printed on the commission statement,
   because "why is this money mine now" is the question a payout has to survive. The four options
   are the draft brokerage-contract checklist's own — signing / registration / funds received —
   which is the source telling us there is NO custom, so this is a choice, never a default.
   MODELLING NOTE, stated rather than hidden: 'funds' is read as the moment the AGENCY has the
   commission (stage `settled`), because that is the only funds event this product observes. It
   does not watch the buyer's bank. */
const TRIGGER_STAGE = { signed:'deposit', notarised:'notary', registered:'registered', funds:'settled' };
const TRIGGERS = ['signed','notarised','registered','funds'];

const TERM_MODES = ['pct','flat','months'];
const TERM_BASES = ['price','rent_month'];
const PAYERS     = ['seller','buyer','split'];
const VAT_FLAGS  = ['incl','excl','none'];

const VIEW_OUTCOMES = ['held','noshow','interested','declined'];
const OFFER_STATUS  = ['sent','accepted','rejected','expired','withdrawn'];
const CLIENT_ROLES  = ['seller','buyer','landlord','tenant'];
const DEPOSIT_KINDS = ['nakh','kankh'];   /* նախավճար · կանխավճար — see §2.6, legally different */

/* Yerevan's twelve administrative districts, plus the marzes, as the address dimension. This is
   a list of place names, not an assumption about the market. */
const YER_DISTRICTS = ['kentron','arabkir','ajapnyak','avan','davtashen','erebuni',
  'kanaker','malatia','nornork','norkmarash','nubarashen','shengavit'];

/* The money rows and the evidence rows share one log and one fold. Evidence rows carry amt 0 and
   fold harmlessly through the same arithmetic — this is not a trick to reuse a ledger, it is the
   correct structure for the problem: an append-only, deduplicated, timestamped record that a
   thing happened. The draft law's ten-year retention duty lands on exactly this object. */
const MONEY_TYPES    = ['earn','payout','reverse','adjust'];
const EVIDENCE_TYPES = ['view','mandate','offer','stage','doc','consent'];
const ROW_TYPES      = MONEY_TYPES.concat(EVIDENCE_TYPES);

const AGENCY = 'agency';   /* the agency is a subject in the ledger like any agent */

/* =====================================================================================
   NUMERIC EDGE
   Money is integer dram. Rates are integer basis points. Nothing here rounds money except the
   two functions named in invariant 2.
   ===================================================================================== */
const safeInt = (v,d) => { const n = Math.round(+v); return isFinite(n) ? n : (d||0); };
const num = v => { const n = +v; return isFinite(n) ? n : 0; };
/* a price, a rent, a fee — non-negative integer dram */
const safeAmd = (v,d) => Math.max(0, Math.min(MAX_AMD, safeInt(v, d||0)));
/* a LEDGER amount — signed, because a payout and a reversal are negative and the fold is `+` */
const clampAmd = v => Math.max(-LEDGER_CAP, Math.min(LEDGER_CAP, safeInt(v,0)));
/* basis points. 10000 = 100%. Clamped to a sane band: a 0 share is legal (an agent on a deal for
   the record but not for the money); a share over 100% of the commission is not. */
const safeBp = (v,d) => Math.max(0, Math.min(100000, safeInt(v, d==null?0:d)));
/* THE LEDGER'S EQUALITY TEST IS EXACT. Everything in it is an integer, so `===` means something
   here in a way it never could in a product that holds fractional money. */
const eqAmd = (a,b) => (a|0) === (b|0);

/* ================= html ================= */
/* every user-authored string that reaches a template goes through this: client names, street
   addresses, cadastral codes, viewing notes, the note on a commission adjustment. All typed. */
const escH = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* an id crossing into an inline handler passes TWO parsers: the HTML attribute parser decodes
   the entity references and the JS parser reads what is left. JSON.stringify is the wrong tool —
   it emits DOUBLE quotes, which close the attribute, and a previous build in this suite shipped
   `onclick="setTab("props")"` so that EVERY TAP IN THE PRODUCT was a syntax error. Nothing
   caught it because the tests drove the app through page.evaluate, which never goes near the
   attribute. Build the JS literal first, then HTML-escape the whole literal. */
function jsArg(v){
  const lit = "'" + String(v==null?'':v)
    .replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\r?\n/g,'\\n') + "'";
  return escH(lit);
}

/* money: integer dram, tabular, the mark riding INSIDE the number so `.7em` resolves against the
   amount and never against whatever container the pair landed in. */
const amdTxt = n => safeInt(n,0).toLocaleString('en-US');
const amd = n => '<span class="num">' + (n<0?'−':'') + amdTxt(Math.abs(safeInt(n,0)))
  + '<span class="cur">֏</span></span>';
const amdBig = n => '<span class="num big">' + (n<0?'−':'') + amdTxt(Math.abs(safeInt(n,0)))
  + '<span class="cur">֏</span></span>';
/* a rate, from basis points. 200 → «2%», 225 → «2.25%». The trailing zeros go; the precision
   the owner typed does not. */
function bpTxt(bp){
  const v = safeBp(bp,0) / 100;
  return (Math.round(v*100)/100).toLocaleString('en-US', {maximumFractionDigits:2}) + '%';
}
/* months of rent, from basis points of a month. 10000 → «1», 5000 → «0.5». */
function monthsTxt(bp){
  const v = safeBp(bp,0) / 10000;
  return (Math.round(v*100)/100).toLocaleString('en-US', {maximumFractionDigits:2});
}

/* =====================================================================================
   CONTENT-ADDRESSED IDS
   A row's id is derived from what the row IS, so two devices that recorded the same viewing
   agree on its id and a replay is a no-op rather than a duplicate; two devices that recorded
   DIFFERENT viewings keep both. The ordinal is the count of rows already in the log carrying the
   same identity, derived from the log itself — no device-local counter to desynchronise.
   ===================================================================================== */
const KSEP = String.fromCharCode(31);
function h32(s, seed){
  let h = (seed>>>0) || 2166136261;
  for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}
const b36 = n => (n>>>0).toString(36);
function contentId(prefix, key, ord){
  const o = ord||0;
  return prefix + b36(h32(key,0)) + b36(h32(key+KSEP+o, 0x9e3779b1)) + (o ? 'x'+o.toString(36) : '');
}
/* the identity of a ledger row. `rts` (when did THIS device write it) is deliberately out — two
   devices recording the same event at different clock instants must still agree on the id. */
function rowKey(r){
  return [r.agent, r.type, clampAmd(r.amt), r.ts, r.deal||'', r.prop||'', r.client||'',
          r.trigger||'', r.reason||'', r.actor||'', r.note||''].join(KSEP);
}

/* =====================================================================================
   DATES
   ===================================================================================== */
const D = (y,m,d) => Date.UTC(y, m-1, d);
function fdate(ts){
  const t2 = safeInt(ts,0); if(!t2) return '—';
  const d = new Date(t2);
  const p = n => (n<10?'0':'') + n;
  return p(d.getUTCDate()) + '.' + p(d.getUTCMonth()+1) + '.' + d.getUTCFullYear();
}
const daysBetween = (a,b) => Math.floor((safeInt(b,0) - safeInt(a,0)) / DAY);
/* THE TIME OF DAY IS PART OF THE EVIDENCE. «This client saw this property with this agent on this
   date» is what a viewing sheet proves, and when two agencies both claim the same showing the
   hour is what separates them — §4 doc 2 asks for date AND time. A timestamp that happens to sit
   on midnight carries no time, and the sheet says so rather than printing «00:00». */
const minsOfDay = ts => { const d = new Date(safeInt(ts,0));
  return d.getUTCHours()*60 + d.getUTCMinutes(); };
const ftime = ts => { const d = new Date(safeInt(ts,0)); const q = n => (n<10?'0':'') + n;
  return q(d.getUTCHours()) + ':' + q(d.getUTCMinutes()); };
const fdatetime = ts => fdate(ts) + (minsOfDay(ts) ? ' · ' + ftime(ts) : '');
const dayStart = ts => Math.floor(safeInt(ts,0) / DAY) * DAY;
/* TEN YEARS IS TEN YEARS, NOT 3,650 DAYS. 10*365 days loses the 2028/2032/2036 leap days and
   printed a statutory retention date three days early on a signed contract — and the draft law's
   ten-year duty is the entire reason the field exists. Calendar arithmetic, with 29 February
   clamped back to the 28th so the date is always real. */
function plusYears(ts, n){
  const d = new Date(safeInt(ts,0));
  if(!safeInt(ts,0)) return 0;
  const y = d.getUTCFullYear() + n, m = d.getUTCMonth(), day = d.getUTCDate();
  const last = new Date(Date.UTC(y, m+1, 0)).getUTCDate();
  return Date.UTC(y, m, Math.min(day, last), d.getUTCHours(), d.getUTCMinutes());
}

/* THE 30-WORKING-DAY CADASTRE CLOCK. Counted Mon–Fri minus a shipped Armenian public-holiday
   table, which is DATA, refreshed yearly — and the countdown states its own provenance, because
   a countdown that cannot say what calendar it used is a countdown nobody trusts.
   RA non-working holidays (Law on Holidays and Commemoration Days). 2026 dates only; a year
   this table does not cover degrades to a plain weekday count AND SAYS SO. */
const HOLIDAYS = {
  2026: ['01-01','01-02','01-03','01-04','01-05','01-06','01-28','03-08','04-24','05-01',
         '05-09','05-28','07-05','09-21','12-31']
};
const HOLIDAY_YEARS = Object.keys(HOLIDAYS).map(Number);
function isWorkingDay(ts){
  const d = new Date(ts), wd = d.getUTCDay();
  if(wd === 0 || wd === 6) return false;
  const y = d.getUTCFullYear();
  const list = HOLIDAYS[y];
  if(!list) return true;                 /* unknown year: weekdays only, and the label says so */
  const p = n => (n<10?'0':'') + n;
  return list.indexOf(p(d.getUTCMonth()+1) + '-' + p(d.getUTCDate())) < 0;
}
/* working days remaining out of `span`, counted forward from `fromTs`.
   THE RESULT IS SIGNED AND IT IS ALLOWED TO GO NEGATIVE. Clamped at zero, one day before the
   cadastre deadline and thirty days after it rendered identically — «0 աշխատանքային օր», no
   escalation, on the single most urgent thing that can be on the owner's Today screen. */
function workingDaysLeft(fromTs, span, nowTs){
  let used = 0, cur = safeInt(fromTs,0) + DAY;
  const now = safeInt(nowTs,0);
  let guard = 0;
  while(cur <= now && guard++ < 4000){ if(isWorkingDay(cur)) used++; cur += DAY; }
  return safeInt(span,0) - used;
}
/* THE TABLE HAS TO COVER THE WHOLE WINDOW, NOT ONLY ITS FIRST DAY. A window opened in December
   spends most of its days in the following year, and testing only the notarisation year let the
   countdown claim «2026 թ. տոնական օրերի ցանկով» while counting 2027 days as plain weekdays. */
function holidayTableCovers(fromTs, span){
  const from = safeInt(fromTs,0);
  if(!from) return false;
  const end = from + Math.ceil(safeInt(span,0) * 7 / 5 + 21) * DAY;
  for(let y = new Date(from).getUTCFullYear(); y <= new Date(end).getUTCFullYear(); y++){
    if(HOLIDAY_YEARS.indexOf(y) < 0) return false;
  }
  return true;
}
const holidayTableKnownStart = ts => HOLIDAY_YEARS.indexOf(new Date(safeInt(ts,0)).getUTCFullYear()) >= 0;
/* the countdown as a sentence: how many working days are left, or how far past the deadline it is */
const filingLeftText = n => n < 0 ? fmt('d_filing_over', {n:-n}) : fmt('d_filing_left', {n:n});

/* =====================================================================================
   THE LEDGER
   One log. Two classes of row. One commutative fold.

   Money rows (earn, payout, reverse, adjust) carry a signed integer amount, the deal, the
   trigger that made it earned, the actor and a note. Evidence rows (view, mandate, offer, stage,
   doc, consent) carry amt 0 and fold harmlessly through the same arithmetic — they exist for
   what they are: an immutable, timestamped, content-addressed record that a thing happened. A
   viewing log whose rows can be edited after the fact is worth nothing in a dispute.

   `order` DOES NOT EXIST HERE and never will. The fold is `+`, which commutes, so mergeRows()
   can union by uuid and re-fold in any order and two devices holding the same rows render the
   same statement byte for byte. Deal stage rides on the row as `rank`, a monotone integer that
   merges with max().
   ===================================================================================== */
const LEDGER = {
  cacheKey: 'owed',
  subject:  r => r.agent,                   /* an agent id, or 'agency' */
  delta:    r => clampAmd(r.amt),           /* SIGNED INTEGER DRAM. never a float. */
  zero:     0,
  fold:     (acc, d) => acc + d,
  eq:       (a, b) => a === b,              /* exact: everything here is an integer */
  clamp:    clampAmd,
  identity: ['agent','type','amt','ts','deal'],
  order:    null,                           /* commutative — and that IS the point */
  types:    ROW_TYPES,
  /* RETENTION. Every document this product makes is re-derivable from this log, so retention is
     a property of the log rather than a folder of PDFs — and the draft law's ten-year duty lands
     here. The compaction watermark must never touch a money row or an evidence row. Stated,
     not left to a default. */
  neverCompact: true
};

const isMoneyRow = r => MONEY_TYPES.indexOf(r && r.type) >= 0;

function rowUuid(r){
  const key = rowKey(r);
  let ord = 0;
  const rs = S.rows || [];
  for(let i=0;i<rs.length;i++){ if(rs[i] && rs[i].key === key) ord++; }
  return contentId('r', key, ord);
}

/* THE ONE WRITER. Nothing else appends to S.rows — not the seed, not a screen, not a merge.
   It normalises, validates, refuses with a reason, mints a content-addressed id, appends, and
   moves the cache by exactly the delta it appended. */
function postRow(r){
  if(!r || ROW_TYPES.indexOf(r.type) < 0){
    LEDGER_REJECTS.push({ r:r, why:'type' }); return null;
  }
  const money = MONEY_TYPES.indexOf(r.type) >= 0;
  const rawAmt = +r.amt;
  if(money && !isFinite(rawAmt)){ LEDGER_REJECTS.push({ r:r, why:'nonfinite' }); return null; }
  /* A MONEY ROW CARRYING A FRACTION IS REFUSED, NOT ROUNDED. The guard on the line above shouts
     about a rule violation and the ledger clamp would have quietly turned 1234.56 into 1235 —
     an asymmetry in the one function standing between the books and bad input. Dram has no
     circulating subunit, so a fractional amount is not a precision question, it is a caller
     that computed money with a float, and the caller has to hear about it. */
  if(money && Math.floor(rawAmt) !== rawAmt){
    LEDGER_REJECTS.push({ r:r, why:'fractional_amount' }); return null;
  }
  /* AN EVIDENCE ROW CARRIES NO MONEY. A viewing that could move a balance would make the
     evidence log a second, unaudited books. Refuse rather than silently zero it. */
  if(!money && safeInt(rawAmt,0) !== 0){ LEDGER_REJECTS.push({ r:r, why:'evidence_amount' }); return null; }
  const agent = String(r.agent || AGENCY);
  if(money && agent !== AGENCY && !agentById(agent)){
    LEDGER_REJECTS.push({ r:r, why:'unknown_agent' }); return null;
  }
  const row = {
    agent: agent,
    type: r.type,
    amt: money ? clampAmd(rawAmt) : 0,
    ts: Math.max(0, safeInt(r.ts, 0)),
    deal: String(r.deal || ''),
    prop: String(r.prop || ''),
    client: String(r.client || ''),
    trigger: String(r.trigger || ''),
    reason: String(r.reason || ''),
    actor: String(r.actor || ''),
    note: String(r.note || ''),
    /* the deal's stage as a MONOTONE RANK, on the row. This is the field that lets a merge use
       max() instead of last-write-wins, and it is why this product never takes the
       non-commutative risk. -1 means "no deal". */
    rank: r.rank == null ? -1 : Math.max(-1, Math.min(DEAL_STAGES.length-1, safeInt(r.rank,-1)))
  };
  row.key = rowKey(row);
  const uuid = r.uuid || rowUuid(row);
  if((S.rows||[]).some(x => x && x.uuid === uuid)) return uuid;   /* replay: a no-op, by design */
  row.uuid = uuid;
  (S.rows = S.rows || []).push(row);
  S.owed = S.owed || {};
  S.owed[row.agent] = clampAmd((S.owed[row.agent] || 0) + row.amt);
  return uuid;
}

/* the fold, from scratch. `+` over signed integers, in whatever order the rows happen to sit. */
function rebuildOwed(){
  const c = {};
  (S.rows||[]).forEach(r => {
    if(!r) return;
    const s = LEDGER.subject(r);
    c[s] = LEDGER.fold(c[s] === undefined ? LEDGER.zero : c[s], LEDGER.delta(r));
  });
  return c;
}
/* the invariant, asserted rather than assumed. If the cache and the fold disagree, the fold wins
   and the app says so — a silent heal is how a books product loses a user's trust. */
function verifyLedger(){
  const rb = rebuildOwed(), out = [], subs = {};
  Object.keys(rb).forEach(k => subs[k] = 1);
  Object.keys(S.owed || {}).forEach(k => subs[k] = 1);
  Object.keys(subs).forEach(sub => {
    const cached = safeInt((S.owed||{})[sub], 0);
    const rebuilt = safeInt(rb[sub], 0);
    if(!LEDGER.eq(cached, rebuilt)) out.push({ subject:sub, cached:cached, rebuilt:rebuilt });
  });
  return out;
}
function healLedger(){ S.owed = rebuildOwed(); }

const rowsFor = agentId => (S.rows||[]).filter(r => r && r.agent === agentId);
const moneyRowsFor = agentId => rowsFor(agentId).filter(isMoneyRow);
const rowsOfDeal = dealId => (S.rows||[]).filter(r => r && r.deal === dealId);

/* the stage a deal reached, READ FROM THE LOG. Nothing in the product decides where a deal is
   from this — deal.stage is the monotone rank and this is its audit twin — but the two must
   agree, and estateSelfTest() asserts they do. max() over the rows: commutative, order-free. */
function rankFromLog(dealId){
  let m = -1;
  rowsOfDeal(dealId).forEach(r => { if(safeInt(r.rank,-1) > m) m = safeInt(r.rank,-1); });
  return m;
}
