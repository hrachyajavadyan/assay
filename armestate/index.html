const MS_CLASS = { draft:'b-neutral', signed:'b-cyan', active:'b-green', expired:'b-rose',
  terminated:'b-neutral', fulfilled:'b-cyan' };
function mandateCard(m){
  const left = exclLeft(m);
  const span = (m.exclusiveTo && m.exclusiveFrom) ? Math.max(1, daysBetween(m.exclusiveFrom, m.exclusiveTo)) : 0;
  const pct = span ? Math.max(0, Math.min(100, Math.round((span - Math.max(0,left||0)) * 100 / span))) : 0;
  const props = (m.propertyIds||[]).map(pid => propById(pid)).filter(Boolean);
  return '<div class="card">'
    + '<div class="poh"><div class="pav">📄</div>'
      + '<div class="pon"><div class="addr">' + escH(clientName(m.clientId)) + '</div>'
        + '<div class="muted">' + escH(t('mn_kind_'+m.kind) + (m.docNo ? ' · ' + m.docNo : '')) + '</div></div>'
      + '<div>' + badge(MS_CLASS[m.status]||'b-neutral', manStLabel(m.status)) + '</div></div>'
    + (props.length ? '<div class="pmeta">' + props.map(p => '<span>' + escH(propAddr(p)) + '</span>').join('') + '</div>' : '')
    + '<div class="row" style="margin-top:10px"><span class="mlbl">' + escH(t('mn_signed_on')) + '</span><span>'
      + escH(fdate(m.signedTs)) + '</span></div>'
    /* THE EXCLUSIVITY CLOCK IS FIRST-CLASS AND VISIBLE. An agency running an expired exclusive is
       exposed, and the point of a back office is to know that before the client's lawyer does.
       A CLOSED MANDATE GETS NO COUNTDOWN. exclLeft() returns null once the contract is fulfilled,
       terminated or expired, and printing «մնաց 0 օր» against a contract that is already finished
       says something false about a document somebody signed — it gets its date range instead. */
    + (m.exclusive
        ? (left != null
            ? '<div class="hbar" style="margin-top:8px"><i style="width:' + pct + '%"></i></div>'
              + '<div class="prov' + (left <= 14 ? ' warn' : '') + '">'
              /* SAY IT ONCE. It read «🔒 Բացառիկ · բացառիկ՝ մնաց 81 օր» — the word twice in one
                 line, because the property card's standalone phrase was reused after a label
                 that already carries it. */
              + escH('🔒 ' + t('mn_exclusive') + ' · ' + fmt('c_excl_b', {n:Math.max(0, left)})
                + ' · ' + t('mn_excl_cap')) + '</div>'
            : '<div class="prov">' + escH('🔒 ' + t('mn_exclusive') + ' · '
                + fdate(m.exclusiveFrom) + ' — ' + fdate(m.exclusiveTo)) + '</div>')
        : '')
    + (m.retainUntil ? '<div class="prov">' + escH('🗄 ' + t('mn_retain') + ' ' + fdate(m.retainUntil)) + '</div>' : '')
    /* the platform field exists so the record is ready; it is greyed and says why. */
    + '<div class="prov">' + escH('🏛 ' + t('mn_platform') + sepC()
        + (m.platformRegTs ? fdate(m.platformRegTs) : t('mn_platform_off'))) + '</div>'
    + '<div class="row" style="margin-top:12px"><button class="btn ghost small" onclick="openMandateDoc('
      + jsArg(m.id) + ')">🖨 ' + escH(t('doc_mn_print')) + '</button>'
    + (termsComplete(m.terms) ? '' : '<button class="btn small ghost" onclick="openMandateTerms('
        + jsArg(m.id) + ')">' + escH(t('cm_fill')) + '</button>') + '</div>'
    + '</div>';
}

       carrying money, an unknown agent, a non-finite amount — and the count of those refusals is
       on screen with its reason, because a books product that discards a row without saying so is
       a books product nobody should trust. */
    + (LEDGER_REJECTS.length ? '<div class="notice bad">' + escH('⚠ ' + t('dt_refused') + ': '
        + LEDGER_REJECTS.length + ' · ' + LEDGER_REJECTS.map(x => x.why).join(', ')) + '</div>' : '')
    + '</div>';

  /* the privacy card: exactly what an agent's device can and cannot see. Written as a promise the
     code keeps, not as a reassurance. */
  h += '<div class="card"><h3>🔒 ' + escH(t('dt_priv')) + '</h3>'
    + '<div class="muted">' + escH(t('dt_priv_b')) + '</div></div>';

  h += '<div class="card"><h3>🎨 ' + escH(t('dt_theme')) + '</h3><div class="chips wrap">'
    + ['light','dark'].map(v => '<button class="' + (U.theme === v ? 'active' : '') + '" onclick="setTheme('
        + jsArg(v) + ')">' + escH(t(v === 'light' ? 'dt_light' : 'dt_dark')) + '</button>').join('')
    + '</div><h3 style="margin-top:16px">🌐 ' + escH(t('dt_lang')) + '</h3><div class="chips wrap">'
    + [['hy','Հայերեն'],['en','English'],['ru','Русский']].map(x => '<button class="'
        + (lang === x[0] ? 'active' : '') + '" onclick="setLang(' + jsArg(x[0]) + ')">' + escH(x[1]) + '</button>').join('')
    + '</div></div>';

  h += '<div class="card"><h3>⬇ ' + escH(t('dt_export')) + '</h3>'
    + '<button class="btn ghost full" onclick="exportCommission()">' + escH(t('dt_export_comm')) + '</button>'
    + '<button class="btn ghost full" style="margin-top:10px" onclick="exportViewings()">' + escH(t('dt_export_views')) + '</button>'
    + '<button class="btn ghost full" style="margin-top:10px" onclick="exportLedger()">' + escH(t('dt_export_ledger')) + '</button>'
    + '<div class="prov">' + escH(t('dt_export_b')) + '</div></div>';

  h += '<div class="card"><h3>♻ ' + escH(t('dt_reset')) + '</h3>'
    + '<div class="muted">' + escH(t('dt_reset_b')) + '</div>'
    + '<button class="btn danger full" style="margin-top:10px" onclick="startFresh()">' + escH(t('dt_reset')) + '</button></div>';
  return h;
}

/* =====================================================================================
   THE AMOUNT IN WORDS, IN ARMENIAN
   Written in Armenian on EVERY language of the UI, because that is the language the document
   is signed in. Copied from the sibling products so the three make the same paper.
   ===================================================================================== */
const AM_U   = ['','մեկ','երկու','երեք','չորս','հինգ','վեց','յոթ','ութ','ինը'];
const AM_TEEN= ['տասը','տասնմեկ','տասներկու','տասներեք','տասնչորս','տասնհինգ','տասնվեց','տասնյոթ','տասնութ','տասնինը'];
const AM_TENS= ['','','քսան','երեսուն','քառասուն','հիսուն','վաթսուն','յոթանասուն','ութսուն','իննսուն'];
function amWords3(x){
  const out = [], h = Math.floor(x/100), r = x%100;
  if(h) out.push((h>1 ? AM_U[h]+' ' : '') + 'հարյուր');
  if(r < 10){ if(r) out.push(AM_U[r]); }
  else if(r < 20) out.push(AM_TEEN[r-10]);
  else out.push(AM_TENS[Math.floor(r/10)] + (r%10 ? AM_U[r%10] : ''));
  return out.join(' ');
}
/* [?] ONE CONVENTION, FLAGGED. A leading single unit is dropped — 1,000,000 is written
   «միլիոն դրամ» rather than «մեկ միլիոն դրամ», the same way «հազար դրամ» is written for 1,000.
   That is the convention the sibling products in this suite already print, and three products
   that disagree about how to write the same number on the same accountant's desk would be worse
   than either choice on its own. It joins the practitioner-check list in §10 rather than being
   quietly changed here. */
function amWords(n){
  /* the argument is already an integer number of dram — nothing here rounds money, it only
     names it. safeInt is the boundary and it ran long before this. */
  let v = Math.abs(safeInt(n, 0));
  const neg = safeInt(n,0) < 0;
  if(v === 0) return 'զրո դրամ';
  const parts = [];
  const bil = Math.floor(v/1000000000); v %= 1000000000;
  const mil = Math.floor(v/1000000);    v %= 1000000;
  const th  = Math.floor(v/1000);       v %= 1000;
  if(bil) parts.push((bil>1 ? amWords3(bil)+' ' : '') + 'միլիարդ');
  if(mil) parts.push((mil>1 ? amWords3(mil)+' ' : '') + 'միլիոն');
  if(th)  parts.push((th>1  ? amWords3(th)+' '  : '') + 'հազար');
  if(v)   parts.push(amWords3(v));
  return (neg ? 'մինուս ' : '') + parts.join(' ') + ' դրամ';
}

/* =====================================================================================
   THE DOCUMENT FURNITURE
   Two parties each with a ՀՎՀՀ, a stated date, the amount in words in Armenian, signature
   rules and a footnote — the same shape the sibling products' ակտ and հաշվարկ carry, so an
   accountant who has seen one of these has seen all three. The print stylesheet is the last
   block in the sheet and every control in a document carries `noprint`.

function docParty(title, name, sub){

const docTin = tin => t('doc_tin') + ' ' + (tin || '—');
function docSign(label){

function docFoot(note){

/* every printable sheet closes the same way: one accent-filled print button, one ghost close,

function docTail(){

/* =====================================================================================
   THE VIEWING — capture, history, evidence
   Invariant 5: the VIEWING, not the listing, is the fee-triggering event. Aparto's own
   published terms say the client pays "only for the property that you have visited with us and
   subsequently purchased", so this is the record a contested claim stands on. Capture is four
   taps because the agent doing it is standing outside a building holding a phone; everything
   after capture is append-only because a record that can be edited six weeks later proves
   nothing.
   ===================================================================================== */
const viewingsOfProp   = pid => (S.viewings||[]).filter(v => v.propertyId === pid).sort((a,b) => b.ts - a.ts);
const viewingsOfClient = cid => (S.viewings||[]).filter(v => v.clientId === cid).sort((a,b) => b.ts - a.ts);
/* WHICH VIEWING SUPPORTS THE CLAIM. A deal's fee is defensible when the agency can show it
   showed THIS property to THIS buyer before the deal existed. Earliest first: the first showing
   is the one that made the introduction, and the introduction is what is being charged for. */
function supportingViewings(deal){
  if(!deal) return [];
  return (S.viewings||[])
    .filter(v => v.propertyId === deal.propertyId
      && (v.clientId === deal.buyerClientId || v.clientId === deal.sellerClientId)
      && v.ts <= safeInt(deal.dates && deal.dates.agreedTs, deal.stageTs) + DAY)
    .sort((a,b) => a.ts - b.ts);
}

/* THE DOCUMENT NUMBER. The row uuid is content-addressed and therefore stable, which is what
   the log needs and exactly what a person reading a signed sheet down a telephone does not:
   «ՑԹ-2026-004» is quotable, «v1tqo0aj1ez7ucg» is not. Derived from the position of this
   viewing in the year's own chronology, so it is a pure function of the data and two devices
   holding the same viewings print the same number. */
function viewDocNo(v){
  if(!v) return '';
  const y = new Date(safeInt(v.ts,0)).getUTCFullYear();
  const yr = (S.viewings||[]).filter(x => new Date(safeInt(x.ts,0)).getUTCFullYear() === y)
    .sort((a,b) => (a.ts - b.ts) || (a.id < b.id ? -1 : 1));
  const i = yr.findIndex(x => x.id === v.id) + 1;
  return 'ՑԹ-' + y + '-' + (i < 100 ? ('00' + i).slice(-3) : i);
}

let VW = null;   /* the capture draft. Nothing reaches the log until saveViewing(). */
function openNewViewing(pref){
  const ags = activeAgents();
  const now = new Date();
  const q = n => (n<10?'0':'') + n;
  VW = { prop:(pref && pref.prop) || '', client:(pref && pref.client) || '',
         agent: ags.length === 1 ? ags[0].id : '', outcome:'held', ts:S.today,
         /* prefilled from the device clock, because the agent recording this is standing at the
            door and the hour they are standing there is the one that goes on the sheet */
         time: q(now.getHours()) + ':' + q(now.getMinutes()),
         note:'', pq:'', cq:'', nc:false, ncName:'', ncPhone:'' };
  drawNewViewing();
}
function vwPick(k, v){ if(!VW) return; VW[k] = v; drawNewViewing(); }
/* a text field writes STRAIGHT into the draft and does NOT redraw — a redraw on every keystroke
   takes the caret away from a person typing a name with one thumb. */
function vwField(k, v){ if(VW) VW[k] = String(v == null ? '' : v); }
/* a search field redraws ONLY its own list, for the same reason */
function vwSearch(k, v, listId){
  if(!VW) return;
  VW[k] = String(v || '');
  const el = document.getElementById(listId);
  if(el) el.innerHTML = (listId === 'vwPropList' ? vwPropRows() : vwClientRows());
}
function vwDate(v){
  if(!VW) return;
  const ms = Date.parse(String(v || '') + 'T00:00:00Z');
  VW.ts = isFinite(ms) ? ms : S.today;
  echoDate('vwDateEcho', vwStamp());
}
function vwTime(v){
  if(!VW) return;
  VW.time = String(v || '');
  echoDate('vwDateEcho', vwStamp());
}
/* the date and the time as one instant. The minutes ride on the timestamp, which is what the
   ledger row and the printed sheet both read. */
function vwStamp(){
  const base = dayStart(safeInt(VW.ts, S.today));
  const m = /^(\d{1,2}):(\d{2})$/.exec(String(VW.time || ''));
  if(!m) return base;
  const hh = Math.max(0, Math.min(23, parseInt(m[1],10)));
  const mm = Math.max(0, Math.min(59, parseInt(m[2],10)));
  return base + hh*3600000 + mm*60000;
}
const isoDate = ts => new Date(safeInt(ts,0)).toISOString().slice(0,10);

/* RECENT FIRST. The property an agent is standing in front of is almost always one they touched
   recently, so the list is ordered by the last thing that happened to it and the search is there
   for the exception rather than for the rule. */
function vwPropRows(){
  const q = (VW.pq || '').trim().toLowerCase();
  const lastTouch = p => Math.max(safeInt(p.listedTs,0), safeInt(p.statusTs,0),
    (viewingsOfProp(p.id)[0] || {ts:0}).ts);
  let list = (S.props||[]).filter(p => !p.archivedTs);
  if(q) list = list.filter(p => [propAddr(p), p.cadCode, kindLabel(p.kind)].join(' ').toLowerCase().indexOf(q) >= 0);
  list = list.sort((a,b) => lastTouch(b) - lastTouch(a));
  const show = list.slice(0, 6);
  return show.map(p => '<button class="pick' + (VW.prop === p.id ? ' on' : '') + '" onclick="vwPick('
      + jsArg('prop') + ',' + jsArg(p.id) + ')">' + (KIND_EM[p.kind] || '🏠') + ' ' + escH(propAddr(p))
      + '<span class="pd">' + escH(kindLabel(p.kind) + ' · ' + dealKindLabel(p.deal)) + '</span></button>').join('')
    + (list.length > show.length ? '<div class="prov">' + escH(fmt('vw_more', {n:list.length - show.length})) + '</div>' : '')
    + (list.length ? '' : '<div class="prov">' + escH(t('p_none_b')) + '</div>');
}
function vwClientRows(){
  const q = (VW.cq || '').trim().toLowerCase();
  const lastTouch = c => (viewingsOfClient(c.id)[0] || {ts:0}).ts || safeInt(c.createdTs,0);
  let list = (S.clients||[]).filter(c => !c.archivedTs);
  if(q) list = list.filter(c => [c.name, c.phone].join(' ').toLowerCase().indexOf(q) >= 0);
  list = list.sort((a,b) => lastTouch(b) - lastTouch(a));
  const show = list.slice(0, 6);
  return show.map(c => '<button class="pick' + (VW.client === c.id ? ' on' : '') + '" onclick="vwPick('
      + jsArg('client') + ',' + jsArg(c.id) + ')">👤 ' + escH(c.name)
      + '<span class="pd">' + escH(c.phone || '—') + '</span></button>').join('')
    + (list.length > show.length ? '<div class="prov">' + escH(fmt('vw_more', {n:list.length - show.length})) + '</div>' : '');
}

function drawNewViewing(){
  if(!VW) return;
  MODAL_RE = drawNewViewing;
  const ready = !!(VW.prop && (VW.client || (VW.nc && VW.ncName.trim())) && VW.agent);
  let h = '<h3>🔑 ' + escH(t('vw_new')) + '</h3>';
  h += '<div class="prov">' + escH(t('vw_locked')) + '</div>';

  /* A PICKER THAT HAS BEEN ANSWERED COLLAPSES TO ITS ANSWER. Three open lists of six rows each
     is 18 rows of scrolling between the agent and the button they came here to press; an answered
     question is one row with a «change» beside it. This is the difference between four taps and
     four screens. */
  const chosen = (secEm, secLbl, txt, sub, clearKey) =>
    '<div class="sec">' + secEm + ' ' + escH(secLbl) + '</div>'
    + '<div class="row"><div style="min-width:0"><b>' + escH(txt) + '</b>'
      + (sub ? '<div class="muted">' + escH(sub) + '</div>' : '') + '</div>'
    + '<button class="btn ghost small" onclick="vwPick(' + jsArg(clearKey) + ',' + jsArg('') + ')">'
      + escH(t('vw_change')) + '</button></div>';

  const pp = VW.prop ? propById(VW.prop) : null;
  h += pp
    ? chosen('🏠', t('vw_prop'), (KIND_EM[pp.kind] || '🏠') + ' ' + propAddr(pp),
        kindLabel(pp.kind) + ' · ' + dealKindLabel(pp.deal), 'prop')
    : '<div class="sec">🏠 ' + escH(t('vw_prop')) + '</div>'
      + '<input class="search" type="text" placeholder="' + escH(t('vw_search_p')) + '" value="'
        + escH(VW.pq) + '" oninput="vwSearch(' + jsArg('pq') + ',this.value,' + jsArg('vwPropList') + ')">'
      + '<div id="vwPropList">' + vwPropRows() + '</div>';

  const cc = VW.client ? clientById(VW.client) : null;
  if(cc){ h += chosen('👤', t('vw_client'), cc.name, cc.phone, 'client'); }
  else {
  h += '<div class="sec">👤 ' + escH(t('vw_client')) + '</div>';
  if(VW.nc){
    h += '<input type="text" placeholder="' + escH(t('vw_nc_name')) + '" value="' + escH(VW.ncName)
      + '" oninput="vwField(' + jsArg('ncName') + ',this.value)">'
      + '<input type="text" style="margin-top:8px" placeholder="' + escH(t('vw_nc_phone')) + '" value="'
      + escH(VW.ncPhone) + '" oninput="vwField(' + jsArg('ncPhone') + ',this.value)">'
      + '<button class="btn ghost small" style="margin-top:10px" onclick="vwPick(' + jsArg('nc') + ',false)">'
      + escH(t('cancel')) + '</button>';
  } else {
    h += '<input class="search" type="text" placeholder="' + escH(t('vw_search_c')) + '" value="'
      + escH(VW.cq) + '" oninput="vwSearch(' + jsArg('cq') + ',this.value,' + jsArg('vwClientList') + ')">'
      + '<div id="vwClientList">' + vwClientRows() + '</div>'
      /* «name and phone only» — everything else about a client can wait; the viewing cannot */
      + '<button class="btn ghost full" style="margin-top:10px" onclick="vwPick(' + jsArg('nc') + ',true)">'
      + escH(t('vw_newclient')) + '</button>';
  }
  }

  const aa = VW.agent ? agentById(VW.agent) : null;
  h += aa
    ? chosen('🧑‍💼', t('vw_agent'), aa.em + ' ' + aa.name, aa.phone, 'agent')
    : '<div class="sec">🧑‍💼 ' + escH(t('vw_agent')) + '</div>'
      + activeAgents().map(a => '<button class="pick" onclick="vwPick('
          + jsArg('agent') + ',' + jsArg(a.id) + ')">' + escH(a.em + ' ' + a.name) + '</button>').join('');

  h += '<div class="sec">✅ ' + escH(t('vw_outcome')) + '</div>'
    + '<div class="chips wrap">' + VIEW_OUTCOMES.map(o => '<button class="' + (VW.outcome === o ? 'active' : '')
        + '" onclick="vwPick(' + jsArg('outcome') + ',' + jsArg(o) + ')">' + escH(outcomeLabel(o))
        + '</button>').join('') + '</div>';

  h += '<div class="sec">🗓️ ' + escH(t('vw_when')) + '</div>'
    + '<input type="date" value="' + escH(isoDate(VW.ts)) + '" onchange="vwDate(this.value)">'
    + '<div class="fieldlbl" style="margin-top:10px">' + escH(t('vw_time')) + '</div>'
    + '<input type="time" value="' + escH(VW.time || '') + '" onchange="vwTime(this.value)">'
    /* the app formats every other date itself as DD.MM.YYYY; the native control is painted in the
       BROWSER's locale and cannot be restyled, so the app states the instant it actually holds. */
    + dateEcho('vwDateEcho', vwStamp());

  h += '<div class="sec">✍️ ' + escH(t('vw_note')) + '</div>'
    + '<textarea rows="2" oninput="vwField(' + jsArg('note') + ',this.value)">' + escH(VW.note) + '</textarea>';

  h += '<button class="btn primary full" style="margin-top:16px"' + (ready ? '' : ' disabled')
    + ' onclick="saveViewing()">' + escH(t('vw_save')) + '</button>'
    + (ready ? '' : '<div class="prov warn">' + escH(t('vw_need')) + '</div>')
    + '<button class="btn ghost full" style="margin-top:9px" onclick="closeModal()">' + escH(t('cancel')) + '</button>';
  openModal(h);
}

function saveViewing(){
  if(!VW) return;
  let cid = VW.client;
  if(VW.nc && VW.ncName.trim()){
    const p = propById(VW.prop);
    /* the role follows from what is happening: a person being shown a property to buy is a
       գնորդ, a person being shown one to rent is a վարձակալ. Nothing else is assumed. */
    const role = (p && p.deal === 'lease') ? 'tenant' : 'buyer';
    const nm = VW.ncName.trim(), ph = VW.ncPhone.trim();
    const exist = (S.clients||[]).find(c => c.name === nm && c.phone === ph);
    if(exist) cid = exist.id;
    else {
      cid = contentId('c', nm + KSEP + ph, (S.clients||[]).length);
      S.clients.push({ id:cid, name:nm, phone:ph, email:'', kind:[role], tin:'',
        passport:{series:'',no:''}, source:'', note:'', agentId:VW.agent,
        createdTs:S.today, archivedTs:0 });
    }
  }
  if(!VW.prop || !cid || !VW.agent) return;
  const ts = Math.max(0, vwStamp());
  const note = String(VW.note || '');
  /* THE EVIDENCE ROW IS WRITTEN FIRST and the viewing takes its identity from it, so two devices
     that recorded the same viewing agree on the id and a replay is a no-op rather than a
     duplicate. postRow() returns the EXISTING uuid on a replay, which is how the duplicate is
     detected here rather than silently doubling the evidence. */
  const uuid = postRow({ agent:VW.agent, type:'view', amt:0, ts:ts, prop:VW.prop, client:cid,
    reason:VW.outcome, actor:VW.agent, note:note });
  if(!uuid){ toast(t('vw_dup')); return; }
  const id = 'v' + uuid.slice(1);
  if((S.viewings||[]).some(v => v.id === id)){ toast(t('vw_dup')); return; }
  S.viewings.push({ id:id, propertyId:VW.prop, clientId:cid, agentId:VW.agent, ts:ts,
    outcome:VW.outcome, signedTs:0, signedBy:'', note:note, uuid:uuid });
  VW = null;
  saveState(); closeModal(); renderAll(); toast(t('vw_saved'));
  /* straight to the sheet the client has to sign — an unsigned sheet is an unenforceable claim
     and the moment to get a signature is while the client is still standing there. */
  openViewingSheet(id);
}

/* SET-ONCE. A signature happened or it did not; `firstWrite` semantics, and the sheet says so. */
function signViewing(id){
  const v = (S.viewings||[]).find(x => x.id === id);
  if(!v || v.signedTs) return;
  v.signedTs = S.today;
  v.signedBy = v.clientId;
  postRow({ agent:v.agentId, type:'doc', amt:0, ts:S.today, prop:v.propertyId, client:v.clientId,
    reason:'view_signed', actor:'owner', note:v.id });
  saveState(); renderAll(); repaintSheet(); toast(t('vw_signed_on'));
}

/* ---------- DOCUMENT 1 · Ցուցադրության թերթիկ ----------
   The evidence that supports the fee. Property with its կադաստրային ծածկագիր, client, agent,
   date, and the sentence that makes the fee owed, printed in Armenian on every language of the
   UI because that is the language it is signed in. One client signature line, one agent line. */
function openViewingSheet(id){
  const v = (S.viewings||[]).find(x => x.id === id);
  if(!v) return;
  MODAL_RE = () => openViewingSheet(id);
  const p = propById(v.propertyId), c = clientById(v.clientId), a = agentById(v.agentId);
  const ag = S.agency || {};
  let h = '<h3>🔑 ' + escH(t('doc_view_title')) + '</h3>'
    + '<div class="muted">' + escH(t('doc_no') + ' ' + viewDocNo(v) + ' · ' + fdate(v.ts)) + '</div>'
    + '<hr class="actrule">'
    + '<div class="row" style="align-items:flex-start;gap:14px;flex-wrap:wrap">'
      + docParty(t('doc_agency'), ag.name, docTin(ag.tin))
      + docParty(t('doc_client'), c ? c.name : '—', c ? c.phone : '')
    + '</div>'
    + '<div class="sec">🏠 ' + escH(t('doc_prop')) + '</div>'
    + '<div class="row"><span class="mlbl">' + escH(t('props_title')) + '</span><span>'
      + escH(p ? propAddr(p) : '—') + '</span></div>'
    + '<div class="row"><span class="mlbl">' + escH(t('p_cad')) + '</span><span class="cad">'

/* =====================================================================================
   CREATING THINGS — the way into the product
   Everything in this block exists because the product could not be STARTED. Five deals came out
   of the seed and there was no way to record a property, a client, a service contract or an
   offer, so the offer → deal step of the end-to-end path — the step §2.7 says creates a deal —
   could not be exercised at all. Each form asks for the minimum a person standing in an agency
   actually types, each one writes its evidence row, and none of them invents a number.
   ===================================================================================== */

/* ONE PICKER, FOUR FORMS. A search box over a recent-first list, six rows and a count of the
   rest — the shape the viewing capture already uses, because someone who has learned one list in
   this product should not have to learn a second. The handler is a function NAME and the id goes
   through jsArg(), so an apostrophe in a street name cannot end up as a syntax error in an
   inline handler. */
function pickPropRows(q, sel, fn, only){
  const qq = String(q||'').trim().toLowerCase();
  let list = (S.props||[]).filter(p => !p.archivedTs && (!only || p.deal === only));
  if(qq) list = list.filter(p => [propAddr(p), p.cadCode, kindLabel(p.kind)].join(' ').toLowerCase().indexOf(qq) >= 0);
  list = list.sort((a,b) => Math.max(safeInt(b.listedTs,0), safeInt(b.createdTs,0))
                          - Math.max(safeInt(a.listedTs,0), safeInt(a.createdTs,0)));
  const show = list.slice(0, 6);
  return show.map(x => '<button class="pick' + (sel === x.id ? ' on' : '') + '" onclick="' + fn
      + '(' + jsArg(x.id) + ')">' + (KIND_EM[x.kind] || '🏠') + ' ' + escH(propAddr(x))
      + '<span class="pd">' + escH((x.cadCode || '—') + ' · ' + dealKindLabel(x.deal)) + '</span></button>').join('')
    + (list.length > show.length ? '<div class="prov">' + escH(fmt('vw_more', {n:list.length - show.length})) + '</div>' : '')
    + (list.length ? '' : '<div class="prov">' + escH(t('p_none_b')) + '</div>');
}
function pickClientRows(q, sel, fn){
  const qq = String(q||'').trim().toLowerCase();
  let list = (S.clients||[]).filter(c => !c.archivedTs);
  if(qq) list = list.filter(c => [c.name, c.phone].join(' ').toLowerCase().indexOf(qq) >= 0);
  list = list.sort((a,b) => safeInt(b.createdTs,0) - safeInt(a.createdTs,0));
  const show = list.slice(0, 6);
  return show.map(c => '<button class="pick' + (sel === c.id ? ' on' : '') + '" onclick="' + fn
      + '(' + jsArg(c.id) + ')">👤 ' + escH(c.name)
      + '<span class="pd">' + escH(c.phone || '—') + '</span></button>').join('')
    + (list.length > show.length ? '<div class="prov">' + escH(fmt('vw_more', {n:list.length - show.length})) + '</div>' : '');
}
function pickAgentChips(sel, fn){
  return '<div class="chips wrap">' + activeAgents().map(a => '<button class="'
    + (sel === a.id ? 'active' : '') + '" onclick="' + fn + '(' + jsArg(a.id) + ')">'
    + escH(a.em + ' ' + a.name) + '</button>').join('') + '</div>';
}

function npOwner(id){ if(NP){ NP.owner = (NP.owner === id ? '' : id); drawNewProp(); } }
function npAgent(id){ if(NP){ NP.agent = (NP.agent === id ? '' : id); drawNewProp(); } }
function npSearch(v){

function saveNewProp(){

  S.props.push({ id:id, cadCode:cad, kind:NP.kind, deal:NP.deal,

  saveState(); closeModal(); renderAll(); toast(t('p_saved'));

/* ---------- a service contract ----------
   The spine of the system: the draft law would make a written contract per client mandatory, and
   the object is built now so the record is ready the day it passes. The six-month exclusivity cap
   is printed as information beside the dates and never enforced as a limit — the law is not in
   force, and a product that enforces an unenacted rule is lying about which is which. */
let NM = null;
function nextMandateNo(){
  const y = new Date(S.today).getUTCFullYear();
  const n = (S.mandates||[]).filter(m => new Date(safeInt(m.signedTs,0)).getUTCFullYear() === y).length + 1;
  return 'ԾՄՊ-' + y + '-' + ('00' + n).slice(-3);
}
function openNewMandate(pref){
  NM = { client:(pref && pref.client) || '', cq:'', kind:'sell', prop:(pref && pref.prop) || '', pq:'',
         signed:S.today, end:0, exclusive:false, from:S.today, to:0, docNo:nextMandateNo() };
  drawNewMandate();
}
function nmPick(k, v){ if(NM){ NM[k] = v; drawNewMandate(); } }
function nmClient(id){ if(NM){ NM.client = (NM.client === id ? '' : id); drawNewMandate(); } }
function nmProp(id){ if(NM){ NM.prop = (NM.prop === id ? '' : id); drawNewMandate(); } }
function nmField(k, v){ if(NM) NM[k] = String(v == null ? '' : v); }
function nmSearch(k, v){
  if(!NM) return;
  NM[k] = String(v || '');
  if(k === 'cq'){ const el = document.getElementById('nmClientList');

function setOfferStatus(id, st){

    reason:st, actor:'owner', note:amdTxt(o.price) + ' ֏' });
  if(st === 'accepted'){
    const d = dealFromOffer(o);
    saveState(); closeModal(); renderAll(); toast(t('of_accepted_deal'));

/* THE DEAL IS BORN HERE, and it is born with NO TERMS. §2.7: an accepted offer creates the deal;
   §1.1: it cannot leave the first stage until a human has typed the commission. The agent's share
   is SEEDED from their standing share and frozen on the deal from this instant. */
function dealFromOffer(o){
  const pr = propById(o.propertyId);
  const exists = (S.deals||[]).find(d => d.propertyId === o.propertyId && d.buyerClientId === o.clientId
    && !(d.void && d.void.ts));
  if(exists) return exists;
  const id = contentId('d', o.propertyId + KSEP + o.clientId + KSEP + o.ts, (S.deals||[]).length);
  const ag = agentById(o.agentId);
  const kind = (pr && pr.deal === 'lease') ? 'lease' : 'sale';
  const d = { id:id, propertyId:o.propertyId,
    buyerClientId:o.clientId, sellerClientId:(pr && pr.ownerClientId) || '',
    mandateId:(pr && pr.mandateId) || '', kind:kind, price:safeAmd(o.price,0),
    agents: o.agentId ? [{ agentId:o.agentId, side:'selling',
      shareBp: (ag && ag.defaultShareBp != null) ? ag.defaultShareBp : 0, joinedTs:S.today }] : [],
    terms:null, stage:'agreed', stageTs:S.today,
    dates:{ agreedTs:S.today, depositTs:0, notaryTs:0, filedTs:0, registeredTs:0, invoicedTs:0, settledTs:0 },
    deposit:{ kind:o.depositKind || '', amount:safeAmd(o.depositAmount,0), ts:o.depositAmount ? S.today : 0 },
    notary:{ name:'', addr:'', actNo:'' }, cert:{ no:'', ts:0 },
    consents:{ spouse:false, coOwners:false, checkedTs:0 },
    unifiedCertTs:0, void:null, docs:[], note:'' };
  S.deals.push(d);
  postRow({ agent:AGENCY, type:'stage', amt:0, ts:S.today, deal:id, prop:d.propertyId,
    reason:'agreed', rank:0, actor:'owner' });
  /* the property is off the market while the deal runs — stamped, and it comes back if the deal
     falls through, which is exactly why status is stamped rather than monotone. */
  if(pr && ['sold','leased'].indexOf(pr.status) < 0){
    pr.status = 'reserved'; pr.statusTs = S.today; pr.statusBy = 'owner';
  }
  return d;
}

/* =====================================================================================
   THE COMMISSION TERMS FORM
   §1.1 made operable. There is no default rate in this product and there never will be — three
   of the highest-traffic Armenian agency sites publish no figure and the third-party numbers
   contradict each other — so this form is the ONLY way a fee gets a number, and it ships empty.
   The one concession to daily use is «usual terms»: a PREFILL, applied by a button the owner
   pressed, stamped with who set it and when, never applied on its own. A prefill somebody
   pressed is a decision; a default is a lie about the market.
   ===================================================================================== */

/* PARSING A RATE IS NOT ROUNDING MONEY. These two turn what a person typed into integer basis
   points, which is the unit every rate in this file is stored in — «2.25» becomes 225 and «0.5
   ամիս» becomes 5000. Nothing downstream ever sees 0.0225. Invariant 2 governs MONEY, and no
   money passes through here. */
function bpFromPct(v){
  const n = parseFloat(String(v == null ? '' : v).replace(',', '.'));
  if(!isFinite(n) || n < 0) return null;
  return Math.max(0, Math.min(100000, Math.round(n * 100)));
}
function bpFromMonths(v){
  const n = parseFloat(String(v == null ? '' : v).replace(',', '.'));
  if(!isFinite(n) || n < 0) return null;
  return Math.max(0, Math.min(100000, Math.round(n * 10000)));
}
const pctText = bp => bp == null ? '' : String(Math.round(safeBp(bp,0)) / 100);
const monthsText = bp => bp == null ? '' : String(Math.round(safeBp(bp,0)) / 10000);

let TF = null;
function tfFrom(tm, basis, base){
  return {
    basis: (tm && tm.basis) || basis,
    base:  String(tm && tm.base != null ? tm.base : (base || '')),
    mode:  (tm && tm.mode) || null,
    pct:    tm && tm.bp != null ? pctText(tm.bp) : '',
    flat:   tm && tm.flat != null ? String(tm.flat) : '',
    months: tm && tm.monthsBp != null ? monthsText(tm.monthsBp) : '',
    payer: (tm && tm.payer) || null,
    sellerPct: tm && tm.splitBp ? pctText(tm.splitBp.seller) : '',
    buyerPct:  tm && tm.splitBp ? pctText(tm.splitBp.buyer)  : '',
    vat:  (tm && tm.vat) || 'none',
    trigger: (tm && tm.trigger) || null,
    note: (tm && tm.note) || ''
  };
}
function openTerms(dealId){
  const d = dealById(dealId); if(!d) return;
  TF = tfFrom(d.terms, d.kind === 'lease' ? 'rent_month' : 'price', safeAmd(d.price, 0));
  TF.deal = dealId; TF.mandate = '';
  drawTerms();
}
/* THE SAME FORM SERVES THE MANDATE. The fee a client agreed to when they signed the service
   contract has exactly the shape of §1.3 — the draft law's own contract checklist requires the
   contract to state the fee structure and the payment terms — so it is the same object, the same
   validation and the same «no default» rule, not a second half-built editor. */
function openMandateTerms(mid){
  const m = mandateById(mid); if(!m) return;
  const p = propById((m.propertyIds||[])[0]);
  const lease = ['let','rent'].indexOf(m.kind) >= 0;
  TF = tfFrom(m.terms, lease ? 'rent_month' : 'price', p ? propPrice(p) : 0);
  TF.deal = ''; TF.mandate = mid;
  drawTerms();
}
/* THE TERMS AS THEY CURRENTLY STAND IN THE FORM. Pure: it reads the draft and returns a terms
   object, so the preview, the save button's enabled state and the saved value are all computed
   by the same function and cannot disagree. */
function tfTerms(){
  if(!TF) return null;
  const split = (TF.payer === 'split' && (String(TF.sellerPct).trim() !== '' || String(TF.buyerPct).trim() !== ''))
    ? { seller: bpFromPct(TF.sellerPct) || 0, buyer: bpFromPct(TF.buyerPct) || 0 } : null;
  return normTerms({
    basis: TF.basis, base: TF.base, mode: TF.mode,
    bp:       TF.mode === 'pct'    ? bpFromPct(TF.pct)       : null,
    flat:     TF.mode === 'flat'   ? (String(TF.flat).trim() === '' ? null : safeAmd(TF.flat,0)) : null,
    monthsBp: TF.mode === 'months' ? bpFromMonths(TF.months) : null,
    payer: TF.payer, splitBp: split, vat: TF.vat, trigger: TF.trigger, note: TF.note
  });
}
/* the kind of thing being priced — a deal's own kind, or the mandate's translated into one.
   The commission words follow it, so a lease never bills «the seller». */
function tfKind(){
  if(!TF) return 'sale';
  const d = TF.deal ? dealById(TF.deal) : null;
  if(d) return d.kind;
  const mn = TF.mandate ? mandateById(TF.mandate) : null;
  return mn ? mandateDealKind(mn.kind) : 'sale';
}
function tfPick(k, v){ if(!TF) return; TF[k] = v; drawTerms(); }
function tfInput(k, v){ if(!TF) return; TF[k] = String(v == null ? '' : v); tfPaint(); }
function tfPaint(){
  const el = document.getElementById('tfPreview'); if(el) el.innerHTML = tfPreviewHtml();
  const b = document.getElementById('tfSave'); if(b) b.disabled = !termsComplete(tfTerms());
}

function tfPreviewHtml(){
  const tm = tfTerms();

  h += '<div class="prov">' + escH([rate, t('cm_payer') + sepC() + payerLabelK(kd, tm.payer),

    }

  /* WHAT EACH AGENT TAKES, before the owner commits. An agent's share is a share of the AGENCY'S
     COMMISSION, not of the price, and this is where the owner sees that in dram. */
  if(d){

    if(al && !al.over){
      h += '<div class="spwrap"><table class="sp"><tbody>'
        + al.rows.map(r => '<tr><td>' + escH(agentEm(r.agentId) + ' ' + agentName(r.agentId))
            + '</td><td class="n">' + escH(bpTxt(r.shareBp)) + '</td><td class="n">'
            + amdTxt(r.amount) + '</td></tr>').join('')
        + '<tr class="keep"><td>' + escH(t('cm_keep')) + '</td><td class="n">'
          + escH(bpTxt(Math.max(0, 10000 - al.sumBp))) + '</td><td class="n">'
          + amdTxt(al.agencyKeep) + '</td></tr>'
        + '</tbody></table></div>'
        + '<div class="prov">' + escH((assertReconciles(al) ? '✓ ' : '⚠️ ') + t('cm_recon')) + '</div>';
    } else if(al && al.over){
      h += '<div class="notice bad">' + escH('⚠️ ' + t('cm_over')) + '</div>';
    }
  }
  return h;
}

function drawTerms(){
  if(!TF) return;
  MODAL_RE = drawTerms;
  const d = TF.deal ? dealById(TF.deal) : null;
  const mn = TF.mandate ? mandateById(TF.mandate) : null;
  if(!d && !mn) return;
  const p = d ? propById(d.propertyId) : propById((mn.propertyIds||[])[0]);
  const tpl = S.cfg.termsTemplate;
  const modes = TF.basis === 'rent_month' ? ['months','pct','flat'] : ['pct','flat'];
  const ok = termsComplete(tfTerms());

  let h = '<h3>💼 ' + escH(t('cm_terms')) + '</h3>'
    + '<div class="muted">' + escH(p ? propAddr(p) : '') + '</div>'
    /* THE SENTENCE THAT JUSTIFIES THE EMPTY FORM, at the top, every time. */
    + '<div class="notice">' + escH('⚖️ ' + t('cm_no_default')) + '</div>';

  /* «usual terms» — a prefill with a name on it, never a silent default */
  h += tpl
    ? '<button class="btn ghost full" onclick="applyUsualTerms()">' + escH(t('cm_tpl_apply')) + '</button>'
      + '<div class="prov">' + escH(fmt('cm_tpl_set', {by: actorName(tpl.setBy), d: fdate(S.cfg.termsTemplateTs)})) + '</div>'

  h += '<div class="sec">🧮 ' + escH(t('cm_base_lbl')) + '</div>'
    + '<div class="prov">' + escH(basisLabel(TF.basis)) + '</div>'
    + '<input type="text" inputmode="numeric" value="' + escH(TF.base) + '" oninput="tfInput('
      + jsArg('base') + ',this.value)">'
    + '<div class="prov">' + escH(t('cm_base_help')) + '</div>';

  h += '<div class="sec">📐 ' + escH(t('cm_mode_q')) + '</div>'
    + '<div class="chips wrap">' + modes.map(m => '<button class="' + (TF.mode === m ? 'active' : '')
        + '" onclick="tfPick(' + jsArg('mode') + ',' + jsArg(m) + ')">' + escH(modeLabel(m))
        + '</button>').join('') + '</div>';
  if(TF.mode === 'pct'){
    h += '<div class="fieldlbl">' + escH(t('cm_pct_lbl')) + '</div>'
      + '<input type="text" inputmode="decimal" placeholder="' + escH(t('cm_pct_ph')) + '" value="'
        + escH(TF.pct) + '" oninput="tfInput(' + jsArg('pct') + ',this.value)">';
  } else if(TF.mode === 'flat'){
    h += '<div class="fieldlbl">' + escH(t('cm_flat_lbl')) + '</div>'
      + '<input type="text" inputmode="numeric" value="' + escH(TF.flat) + '" oninput="tfInput('
        + jsArg('flat') + ',this.value)">';
  } else if(TF.mode === 'months'){
    h += '<div class="fieldlbl">' + escH(t('cm_months_lbl')) + '</div>'
      + '<input type="text" inputmode="decimal" placeholder="' + escH(t('cm_months_ph')) + '" value="'
        + escH(TF.months) + '" oninput="tfInput(' + jsArg('months') + ',this.value)">';
  }

  const kind = tfKind();
  h += '<div class="sec">💳 ' + escH(t('cm_payer_q')) + '</div>'
    + PAYERS.map(x => '<button class="pick' + (TF.payer === x ? ' on' : '') + '" onclick="tfPick('
        + jsArg('payer') + ',' + jsArg(x) + ')">' + escH(payerLabelK(kind, x))
        + (x === 'split' ? '<span class="pd">' + escH(t('cm_split_help')) + '</span>' : '')
        + '</button>').join('');
  if(TF.payer === 'split'){
    h += '<div class="fieldlbl">' + escH(splitLabelK(kind, 'seller')) + '</div>'
      + '<input type="text" inputmode="decimal" value="' + escH(TF.sellerPct) + '" oninput="tfInput('
        + jsArg('sellerPct') + ',this.value)">'
      + '<div class="fieldlbl">' + escH(splitLabelK(kind, 'buyer')) + '</div>'
      + '<input type="text" inputmode="decimal" value="' + escH(TF.buyerPct) + '" oninput="tfInput('
        + jsArg('buyerPct') + ',this.value)">';
  }

  h += '<div class="sec">⏱ ' + escH(t('cm_trigger_q')) + '</div>'
    + TRIGGERS.map(x => '<button class="pick' + (TF.trigger === x ? ' on' : '') + '" onclick="tfPick('
        + jsArg('trigger') + ',' + jsArg(x) + ')">' + escH(triggerLabel(x))
        + '<span class="pd">' + escH(fmt('cm_trigger_at', {s: stageLabel(TRIGGER_STAGE[x])})) + '</span>'
        + '</button>').join('');

  h += '<div class="sec">🧾 ' + escH(t('cm_vat_q')) + '</div>'
    + '<div class="chips wrap">' + VAT_FLAGS.map(v => '<button class="' + (TF.vat === v ? 'active' : '')
        + '" onclick="tfPick(' + jsArg('vat') + ',' + jsArg(v) + ')">' + escH(vatLabel(v))
        + '</button>').join('') + '</div>'
    + '<div class="prov">' + escH(t('cm_vat_note')) + '</div>';

  h += '<div class="sec">👁 ' + escH(t('cm_preview')) + '</div>'
    + '<div class="card" style="margin:0 0 12px" id="tfPreview">' + tfPreviewHtml() + '</div>';

  h += '<button class="btn primary full" id="tfSave"' + (ok ? '' : ' disabled')
      + ' onclick="saveTerms()">' + escH(t('cm_save')) + '</button>'
    + '<button class="btn ghost full" style="margin-top:9px"' + (ok ? '' : ' disabled')
      + ' onclick="saveUsualTerms()">' + escH(t('cm_tpl_save')) + '</button>'
    + '<button class="btn ghost full" style="margin-top:9px" onclick="closeModal()">' + escH(t('cancel')) + '</button>';
  openModal(h);
}

/* the prefill is APPLIED BY A BUTTON and lands as a filled-in editable form the owner still has
   to confirm. The base is NOT taken from the template — the base belongs to this deal. */
function applyUsualTerms(){
  const tpl = S.cfg.termsTemplate; if(!tpl || !TF) return;
  const base = TF.base, basis = TF.basis, deal = TF.deal;
  TF = tfFrom(tpl, basis, base);
  TF.basis = basis; TF.base = base; TF.deal = deal;
  drawTerms();
}
function saveUsualTerms(){
  const tm = tfTerms();
  if(!termsComplete(tm)) return;
  tm.setBy = 'owner'; tm.setTs = Date.now();
  S.cfg.termsTemplate = normTerms(tm);
  S.cfg.termsTemplateTs = Date.now();   /* stamped, so two devices agree on which prefill is current */
  saveState(); drawTerms(); toast(t('cm_tpl_saved'));
}
function saveTerms(){
  if(!TF) return;
  const tm = tfTerms();
  if(!termsComplete(tm)) return;
  if(TF.mandate){
    const mn = mandateById(TF.mandate); if(!mn) return;
    tm.setBy = 'owner'; tm.setTs = Date.now();
    mn.terms = normTerms(tm);
    postRow({ agent:AGENCY, type:'mandate', amt:0, ts:S.today, client:mn.clientId,
      prop:(mn.propertyIds||[])[0] || '', reason:'terms_set', actor:'owner',
      note: rateAsTyped(mn.terms) + ' · ' + payerLabel(mn.terms.payer) });
    const mid = TF.mandate; TF = null;
    saveState(); closeModal(); renderAll(); toast(t('cm_saved'));
    openMandateDoc(mid);
    return;
  }
  const d = dealById(TF.deal); if(!d) return;
  tm.setBy = 'owner'; tm.setTs = Date.now();   /* it is a negotiated number and it carries a name */
  d.terms = normTerms(tm);
  /* an evidence row, so the terms are in the append-only log with the rest of the deal's history */
  postRow({ agent:AGENCY, type:'doc', amt:0, ts:S.today, deal:d.id, prop:d.propertyId,
    reason:'terms_set', rank:DEAL_RANK[d.stage], actor:'owner',
    note: rateAsTyped(d.terms) + ' · ' + payerLabel(d.terms.payer) + ' · ' + triggerLabel(d.terms.trigger) });
  /* THE DEAL MAY ALREADY BE PAST ITS TRIGGER. Terms typed onto a deal that has already reached
     the stage they name make the fee earned at that instant, and mintEarnings() is idempotent. */
  const minted = mintEarnings(d);
  TF = null;
  saveState(); closeModal(); renderAll();
  toast(t('cm_saved') + (minted ? ' · ' + t('st_earned') : ''));
  openDeal(d.id);
}

/* =====================================================================================
   THE DEPOSIT — նախավճար or կանխավճար, chosen explicitly
   The two are legally different and agents use both words loosely, so this screen makes the
   choice and prints the consequence under each option rather than in a tooltip:
     · նախավճար  — written form required. Payer walks → the seller keeps it. SELLER walks →
                   the seller repays DOUBLE.
     · կանխավճար — no written-form requirement. On non-performance it is simply returned.
   Note the collision the research flags: կանխավճար is also the word for a mortgage down payment,
   and a large share of Armenian purchases are mortgage-financed — so in this context the label
   is «Կանխավճար (առաջարկի)» and never the bare word.
   ===================================================================================== */
let DP = null;
function openDeposit(dealId){
  const d = dealById(dealId); if(!d) return;
  DP = { deal:dealId,
         kind: (d.deposit && d.deposit.kind) || '',
         amount: String((d.deposit && d.deposit.amount) || ''),
         ts: (d.deposit && d.deposit.ts) || S.today };
  drawDeposit();
}
function dpPick(k, v){ if(!DP) return; DP[k] = v; drawDeposit(); }
function dpInput(v){
  if(!DP) return;
  DP.amount = String(v == null ? '' : v);
  const el = document.getElementById('dpNote');
  if(el) el.innerHTML = dpNoticeHtml();
  const b = document.getElementById('dpSave');
  if(b) b.disabled = !(DP.kind && safeAmd(DP.amount, 0) > 0);
}
function dpDate(v){
  /* the app's own DD.MM.YYYY under a control the browser paints in its own locale */
  if(!DP) return;
  const ms = Date.parse(String(v || '') + 'T00:00:00Z');
  DP.ts = isFinite(ms) ? ms : S.today;
  echoDate('dpDateEcho', DP.ts);
}
function dpNoticeHtml(){
  const amt = safeAmd(DP.amount, 0);
  /* A NOTICE, NOT A BLOCKER. Any payment over AMD 300,000 must be non-cash. The app is not the
     compliance officer; it is the thing that says the sentence out loud before the notary does. */
  return amt > 300000 ? '<div class="notice">' + escH('💳 ' + t('d_noncash')) + '</div>' : '';
}
function drawDeposit(){
  if(!DP) return;
  MODAL_RE = drawDeposit;
  const d = dealById(DP.deal); if(!d) return;
  const p = propById(d.propertyId);
  const ok = !!(DP.kind && safeAmd(DP.amount, 0) > 0);
  let h = '<h3>🤝 ' + escH(t('dep_title')) + '</h3>'
    + '<div class="muted">' + escH(p ? propAddr(p) : '') + '</div>'
    /* THE CONFIRMATION HAS TO BE TRUE. Recording a deposit on a deal with no commission terms
       said «Գրանցվեց» and silently left the pipeline where it was; the sheet now says so BEFORE
       the tap, and the toast says what did and did not happen after it. */
    + (termsComplete(d.terms) ? '' : '<div class="notice bad">' + escH('⚠️ ' + t('dep_noterms')) + '</div>')
    + '<div class="sec">⚖️ ' + escH(t('dep_kind_q')) + '</div>'
    + '<div class="prov">' + escH(t('dep_diff')) + '</div>'
    + DEPOSIT_KINDS.map(k => '<button class="pick' + (DP.kind === k ? ' on' : '') + '" onclick="dpPick('
        + jsArg('kind') + ',' + jsArg(k) + ')">' + escH(t('dep_' + k))
        + '<span class="pd">' + escH(t('dep_' + k + '_law')) + '</span></button>').join('')
    + '<div class="fieldlbl" style="margin-top:12px">' + escH(t('dep_amount')) + '</div>'
    + '<input type="text" inputmode="numeric" value="' + escH(DP.amount) + '" oninput="dpInput(this.value)">'
    + '<div id="dpNote">' + dpNoticeHtml() + '</div>'
    + '<div class="fieldlbl" style="margin-top:12px">' + escH(t('dep_when')) + '</div>'
    + '<input type="date" value="' + escH(isoDate(DP.ts)) + '" onchange="dpDate(this.value)">'
    + dateEcho('dpDateEcho', DP.ts)
    + '<button class="btn primary full" id="dpSave" style="margin-top:16px"' + (ok ? '' : ' disabled')
      + ' onclick="saveDeposit()">' + escH(t('dep_save')) + '</button>'
    + '<button class="btn ghost full" style="margin-top:9px" onclick="closeModal()">' + escH(t('cancel')) + '</button>';
  openModal(h);
}
function saveDeposit(){
  if(!DP) return;
  const d = dealById(DP.deal); if(!d) return;
  const amt = safeAmd(DP.amount, 0);
  if(!DP.kind || amt <= 0) return;
  d.deposit = { kind:DP.kind, amount:amt, ts:Math.max(0, safeInt(DP.ts, S.today)) };
  if(!d.dates.depositTs) d.dates.depositTs = d.deposit.ts;
  /* an evidence row naming WHICH instrument — the distinction whose consequence is forfeiture
     versus double repayment does not survive being recorded as "deposit". */
  postRow({ agent:AGENCY, type:'doc', amt:0, ts:d.deposit.ts, deal:d.id, prop:d.propertyId,
    reason:'deposit_' + DP.kind, rank:DEAL_RANK[d.stage], actor:'owner',
    note: t('dep_' + DP.kind) + ' · ' + amdTxt(amt) + ' ֏' });
  /* A DEPOSIT TAKEN IS THE նախնական պայմանագիր EVENT, so it moves the deal — when the deal is
     allowed to move. When it is not, nothing is invented and the toast names the stage the deal
     is still in rather than implying a change that did not happen. */
  let moved = '';
  if(termsComplete(d.terms) && DEAL_RANK[d.stage] < DEAL_RANK.deposit && stageApplies(d, 'deposit')){
    d.stage = 'deposit'; d.stageTs = d.deposit.ts || S.today;
    postRow({ agent:AGENCY, type:'stage', amt:0, ts:d.stageTs, deal:d.id, prop:d.propertyId,
      reason:'deposit', rank:DEAL_RANK.deposit, actor:'owner' });
    mintEarnings(d);
    moved = stageLabel('deposit');
  }
  const id = d.id;
  DP = null;
  saveState(); closeModal(); renderAll();
  toast(moved ? fmt('dep_saved_moved', {s:moved}) : fmt('dep_saved_stay', {s:stageLabel(d.stage)}));
  openDeal(id);
}


/* =====================================================================================
   RECORDING A PAYOUT, AND CORRECTING ONE
   §1.8. `owed` is Σ(earn) − Σ(payout) over one book and there is no counter anywhere; paying an
   agent is therefore not an update, it is one more row. Partial payouts are normal, which is why
   the sheet opens prefilled with the payable figure and editable DOWN rather than locked to it.
   Corrections never mutate and never delete: an adjustment is a second row carrying a mandatory
   reason, and both lines show on the agent's statement, because an agent whose money moved is
   owed the explanation as much as the money.
   ===================================================================================== */
let PO = null;
/* the agent's deals that still owe them something, most recent first. This is what makes a
   payout row attributable: a statement line reading «Վճարում» with nothing under it has no
   basis, while the seed's own payouts carried the deal, the rate and the share — the document
   looked LESS complete the more the owner used the app. */
function payableDealsOf(agentId){
  return (S.deals||[])
    .map(d => ({ deal:d, left: dealOutstanding(d.id, agentId) }))
    .filter(x => x.left > 0 && gateOpen(x.deal))
    .sort((a,b) => safeInt(b.deal.stageTs,0) - safeInt(a.deal.stageTs,0));
}
function openPayout(agentId){
  const a = agentById(agentId); if(!a) return;
  const m = agentMoney(agentId);
  const ds = payableDealsOf(agentId);
  PO = { agent:agentId, amount:String(m.payable || ''), note:'',
         /* one open deal is the overwhelmingly common case and it prefills itself */
         deal: ds.length === 1 ? ds[0].deal.id : '' };
  drawPayout();
}
function poDeal(id){
  if(!PO) return;
  PO.deal = (PO.deal === id ? '' : id);
  if(PO.deal){
    const m = agentMoney(PO.agent);
    PO.amount = String(Math.min(m.payable, dealOutstanding(PO.deal, PO.agent)));
  }
  drawPayout();
}
function poInput(k, v){
  if(!PO) return;
  PO[k] = String(v == null ? '' : v);
  poPaint();
}
function poSet(v){ if(!PO) return; PO.amount = String(v); drawPayout(); }
function poPaint(){
  const m = agentMoney(PO.agent);
  /* the input is parsed at the BOUNDARY: dram has no subunit, so a typed «123.5» is a mistyping
     rather than a precision, and safeAmd normalises it before it can reach the ledger — where
     postRow() would refuse a fraction outright. */
  const amt = safeAmd(PO.amount, 0);
  const over = amt > m.payable;
  const el = document.getElementById('poNote');
  if(el) el.innerHTML = over
    ? '<div class="notice bad">' + escH('⚠️ ' + fmt('pay_over', {n: amdTxt(m.payable)})) + '</div>' : '';
  const b = document.getElementById('poSave');
  if(b) b.disabled = !(amt > 0 && !over);
}
function drawPayout(){
  if(!PO) return;
  MODAL_RE = drawPayout;
  const a = agentById(PO.agent); if(!a) return;
  const m = agentMoney(PO.agent);
  const ds = payableDealsOf(PO.agent);
  const amt = safeAmd(PO.amount, 0);
  const ok = amt > 0 && amt <= m.payable;
  let h = '<h3>💳 ' + escH(a.em + ' ' + a.name) + '</h3>'
    + '<div class="mlbl">' + escH(t('st_payable')) + '</div>' + amdBig(m.payable)
    + '<div class="prov">' + escH(t('st_payable_b')) + '</div>';
  if(!m.payable){
    h += '<div class="notice">' + escH(t('pay_nothing')) + '</div>'
      + '<div class="prov">' + escH(t('pay_gate') + sepC() + t('pay_gate_' + (S.cfg.payWhen || 'received'))) + '</div>';
  } else {
    h += '<div class="fieldlbl" style="margin-top:14px">' + escH(t('pay_amount')) + '</div>'
      + '<input type="text" inputmode="numeric" value="' + escH(PO.amount) + '" oninput="poInput('
        + jsArg('amount') + ',this.value)">'
      + '<div class="chips wrap" style="margin-top:8px">'

function savePayout(){
  if(!PO) return;
  const m = agentMoney(PO.agent);
  const amt = safeAmd(PO.amount, 0);
  if(amt <= 0 || amt > m.payable) return;
  /* NEGATIVE, because the fold is one `+` over one book: an earn adds, a payout subtracts, and
     `owed` is the sum. There is no second table and no counter to keep in step. */
  const d = PO.deal ? dealById(PO.deal) : null;
  postRow({ agent:PO.agent, type:'payout', amt:-amt, ts:S.today, actor:'owner', note:PO.note,
    deal: d ? d.id : '', prop: d ? d.propertyId : '',
    trigger: d && d.terms ? d.terms.trigger : '' });

  saveState(); closeModal(); renderAll(); toast(t('pay_done'));

/* =====================================================================================
   CSV
   Two non-obvious properties, both deliberate and both easy to lose in a rewrite:
   1. A UTF-8 BOM, because the accountant opens this in Windows Excel and without the BOM every
      Armenian character arrives as mojibake.
   2. A FORMULA-INJECTION GUARD. Client names, street names and notes are free text typed by a
      person, and a cell beginning = + - @ TAB or CR is executed as a formula when the file is
      opened. Prefixing an apostrophe is the fix; forgetting it turns an export into an attack
      surface aimed at the one person in the agency who handles the money.
   ArmEstate does NOT attempt to be an e-invoicing client — Armenia's հաշիվ-ապրանքագիր system
   needs digital certificates and prescribed machine-readable formats. It produces a clean line
   the accountant re-keys or imports. That boundary is a decision, not a gap.
   ===================================================================================== */
function csvCell(v){
  let x = v == null ? '' : String(v);
  if(/^[=+\-@\t\r]/.test(x)) x = "'" + x;
  return '"' + x.replace(/"/g, '""') + '"';
}
function downloadCSV(name, rows){
  const body = rows.map(r => r.map(csvCell).join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF' + body], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { try{ document.body.removeChild(a); URL.revokeObjectURL(url); }catch(e){} }, 0);
}
/* THE COMMISSION LINE. Exactly the columns an Armenian accountant needs to raise the invoice:
   client, property, cadastral code, service, base amount, rate AS TYPED, fee, VAT flag, date.
   No tax is computed — whether brokerage sits inside the professional-services turnover-tax
   exclusion is UNVERIFIED and is the agency accountant's question, not this product's. */
/* the rate exactly as the owner typed it — a percentage, a flat dram figure, or months of rent.
   Never normalised into one of the three, because «0.5 ամիս» under a column headed «percentage»
   is a mislabelled cell in the one artefact this product hands to an accountant. */
function rateAsTyped(tm){
  if(!tm) return '';
  return tm.mode === 'pct'  ? bpTxt(tm.bp)
       : tm.mode === 'flat' ? amdTxt(tm.flat) + ' ֏'
       : monthsTxt(tm.monthsBp) + ' ' + t('cm_months_u');
}
/* WHAT THIS DEAL IS, IN ONE WORD, FOR THE ONE ARTEFACT THAT LEAVES THE BUILDING. An accountant
   importing the export raises invoices from it, so a fee that has been reversed and a fee whose
   trigger has not fired must not read as an amount due. The whole fee stays in its own column —
   it is the negotiated figure and the accountant may want it — and «due now» answers the only
   question the file is actually asked. */
function dealCsvState(d){
  if(d.void && d.void.ts) return t('csv_void_note');
  if(!termsComplete(d.terms)) return t('csv_noterms');
  if(!isEarned(d)) return t('csv_notyet');
  return t('st_earned');
}
const dealCollectable = d => !!(d && !(d.void && d.void.ts) && termsComplete(d.terms) && isEarned(d));

function commissionRows(){
  const rows = [[ t('csv_deal'), t('csv_date'), t('csv_party'), t('csv_side'), t('props_title'),
                  t('p_cad'), t('cm_base'), t('cm_rate'), t('cm_fee_total'), t('cm_side_share'),
                  t('cm_due_now'), t('csv_state'), t('cm_vat'), t('cm_trigger'), t('d_stage') ]];
  (S.deals||[]).forEach(d => {
    const p = propById(d.propertyId);
    const addr = p ? propAddr(p) : '';
    const cad = p ? p.cadCode : '';
    const stage = stageLabel(d.stage) + (d.void ? ' · ' + t('d_void') : '');
    const state = dealCsvState(d);
    const due = dealCollectable(d);
    const al = allocation(d);
    /* A DEAL WITH NO TERMS STILL GETS A LINE. Dropping it exported five deals as four and left
       the accountant to notice the absence; the line says what is missing instead. */
    if(!al || !termsComplete(d.terms)){
      rows.push([ dealDocNo(d), fdate(d.stageTs), '', '', addr, cad, '', t('csv_noterms'), '', '',
                  '', state, '', '', stage ]);
      return;
    }
    const tm = d.terms;
    const ps = payerSplit(tm, al.fee);
    /* ONE LINE PER PAYING SIDE. A split-payer deal owes TWO invoices, and a single line naming
       the seller for the whole fee overcharged the seller by exactly the buyer's half — in the
       file whose comment promises the accountant the columns they need to raise the invoice. */
    const sides = [];
    if(ps.seller) sides.push({ side:'seller', cid:d.sellerClientId, amt:ps.seller, bp:ps.sellerBp });
    if(ps.buyer)  sides.push({ side:'buyer',  cid:d.buyerClientId,  amt:ps.buyer,  bp:ps.buyerBp });
    if(!sides.length) sides.push({ side:tm.payer, cid:d.sellerClientId, amt:0, bp:0 });
    sides.forEach(x => {
      rows.push([ dealDocNo(d), fdate(d.stageTs), clientName(x.cid),
        /* a lease bills the LANDLORD and the TENANT. The card says so; so does this file. */
        payerLabelK(d.kind, x.side) + (tm.payer === 'split' ? ' · ' + bpTxt(x.bp) : ''),
        addr, cad, tm.base, rateAsTyped(tm), al.fee, x.amt,
        due ? x.amt : 0, state,
        vatLabel(tm.vat), triggerLabel(tm.trigger), stage ]);
    });
    /* THE REVERSAL IS IN THE FILE, NOT ONLY IN THE LEDGER. A collapsed deal exported its fee as
       collectable and left the word «Տապալված» appended to the stage cell as the only trace; the
       reversal now has its own line with a negative amount, so the file reconciles to zero the
       way the books do. */
    if(d.void && d.void.ts){
      rowsOfDeal(d.id).filter(r => r.type === 'reverse').forEach(r => {
        rows.push([ dealDocNo(d), fdate(r.ts), agentName(r.agent), rowTypeLabel(r.type),
          addr, cad, '', '', '', r.amt, 0, t('csv_void_note'), '', '',
          stage + (d.void.reason ? ' · ' + d.void.reason : '') ]);
      });
    }
  });
  return rows;
}

/* THE WHOLE LOG. The draft law would require ten-year retention, and every document this product
   makes is re-derivable from these rows — so retention is a property of the log, and an export
   that carries it out of the browser is the cheapest possible insurance against that. */
function exportLedger(){
  /* the raw row id and the raw deal key STAY — this file is the log, and a log that renames its
     own keys cannot be joined back to the state it came from. The quotable deal number rides
     beside it, because the commission export and the signed statement both speak that one and an
     accountant reconciling three files needs the join to exist in at least one of them. */
  const rows = [['uuid','ts','agent','type','amt','deal','deal_no','prop','client','trigger',
                 'reason','actor','rank','note']];
  (S.rows||[]).slice().sort((a,b) => a.ts - b.ts).forEach(r => {
    rows.push([r.uuid, fdate(r.ts), agentName(r.agent) || r.agent, rowTypeLabel(r.type), r.amt,
      r.deal, r.deal ? dealNoOf(r.deal) : '', r.prop, r.client, r.trigger, r.reason, r.actor,
      r.rank, r.note]);
  });
  downloadCSV('armestate-ledger-' + fdate(S.today).replace(/\./g,'-') + '.csv', rows);
}

/* the Cyrillic face sits behind a unicode-range, so an Armenian-only install never fetches it and
   sw.js deliberately does not precache it. A RUSSIAN reader needs it offline from the first run,
   so when the language IS ru the page asks the worker for it by name. One hard-coded subset — no
   path travels from here into the cache. */
function swWantCyrillic(){
  try{

    navigator.serviceWorker.ready.then(r => {

    }).catch(() => {});
  }catch(e){}
}
