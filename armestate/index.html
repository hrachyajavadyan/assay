/* =====================================================================================
   THE COMMISSION ENGINE
   Everything in this product is scaffolding around this block.
   ===================================================================================== */

/* THE FEE. Returns null — NOT ZERO — when the terms are unset, because zero is a number a
   person typed and null is the absence of a decision. Every caller must handle null, and the
   screens do: they show «Պայմանները լրացված չեն» and a button, never a figure.
   MATH.ROUND #1 OF 2 IN THIS FILE. */
function feeOf(terms){
  if(!terms || TERM_MODES.indexOf(terms.mode) < 0) return null;
  if(terms.mode === 'flat'){
    return terms.flat == null ? null : safeAmd(terms.flat, 0);
  }
  const bp = terms.mode === 'pct' ? terms.bp : terms.monthsBp;
  if(bp == null) return null;
  return Math.round(safeAmd(terms.base, 0) * safeBp(bp, 0) / 10000);
}

/* THE CUMULATIVE ALLOCATOR — the single most important function in this product.
   Every partial sum is rounded exactly once; each part is the difference of two exact partial
   sums; so the parts sum to round(total·Σbp/10000) BY CONSTRUCTION, on every device, for every
   input, and no part is more than one dram from its true share. The remainder is whatever is
   left of `total` after the parts, and it is returned to the caller to assign DELIBERATELY AND
   VISIBLY — it is never dropped.
   MATH.ROUND #2 OF 2 IN THIS FILE. There is no third and a review that finds one has found a bug. */
function allocBp(total, bps){
  const T2 = safeInt(total, 0);
  let acc = 0, cum = 0;
  const out = [];
  for(let i=0;i<bps.length;i++){
    cum += safeBp(bps[i], 0);
    const upto = Math.round(T2 * cum / 10000);
    out.push(upto - acc);
    acc = upto;
  }
  return { parts: out, taken: acc, rest: T2 - acc };
}

/* WHO PAYS. Three options, chosen per deal, with two amounts when split — because the sources
   disagree: "~2% from each side" implies double-siding is normal, the expat guide declines to
   say, and whether this agency double-sides is UNVERIFIED. So it is a field, not a setting, and
   it has no default. */
function payerSplit(terms, fee){
  if(fee == null) return null;
  if(terms.payer === 'buyer')  return { seller:0, buyer:fee, sellerBp:0,     buyerBp:10000 };
  if(terms.payer === 'seller') return { seller:fee, buyer:0, sellerBp:10000, buyerBp:0 };
  if(terms.payer !== 'split') return null;
  /* AN UNSET SPLIT IS NOT A 100% BUYER SPLIT. splitBp absent — or present and not summing to
     100% — is the absence of a decision on the who-pays axis, and inventing one contradicts
     invariant 1 exactly as inventing a rate would. feeOf() answers null for an unset rate; this
     answers null for an unset payer split, and termsComplete() refuses the terms outright.
     Before this, {seller:50%, buyer:30%} charged the buyer the unallocated 20% and
     {seller:0, buyer:0} — normTerms' own fallback for an absent splitBp — charged the buyer the
     whole fee nobody said they owed. */
  if(!terms.splitBp) return null;
  const sb = safeBp(terms.splitBp.seller, 0);
  const bb = safeBp(terms.splitBp.buyer, 0);
  if(sb + bb !== 10000) return null;
  const a = allocBp(fee, [sb, bb]);
  /* the last part absorbs the remainder by construction: buyer = fee − seller, so the two
     invoices sum to the fee to the dram */
  return { seller: a.parts[0], buyer: a.parts[1] + a.rest, sellerBp: sb, buyerBp: bb };
}
/* the split as a sum that reconciles: seller + buyer === fee, asserted rather than assumed */
function payerReconciles(terms, fee){
  const ps = payerSplit(terms, fee);
  return !ps || (safeInt(ps.seller,0) + safeInt(ps.buyer,0)) === safeInt(fee,0);
}

/* THE AGENT ALLOCATION.
   An agent's share is A SHARE OF THE AGENCY'S COMMISSION, NOT OF THE PROPERTY PRICE. That
   distinction is visible everywhere in the UI, because "my two percent" is ambiguous and the
   ambiguity is where arguments start.
   The sort is (joinedTs, agentId) — a total order and a pure function of the set — so two
   devices holding the same deal compute byte-identical amounts.
   Allocation runs on the WHOLE fee, never on each payer's half: who pays is a fact about the
   client; what an agent earns is a fact about the deal. */
function allocation(deal){
  const fee = feeOf(deal && deal.terms);
  if(fee == null) return null;
  const ags = (deal.agents||[]).slice().sort((a,b) =>
    (safeInt(a.joinedTs,0) - safeInt(b.joinedTs,0)) ||
    (a.agentId < b.agentId ? -1 : a.agentId > b.agentId ? 1 : 0));
  const al = allocBp(fee, ags.map(a => safeBp(a.shareBp, 0)));
  const rows = ags.map((a,i) => ({
    agentId: a.agentId, side: a.side || '', shareBp: safeBp(a.shareBp,0), amount: al.parts[i]
  }));
  const sumBp = ags.reduce((x,a) => x + safeBp(a.shareBp,0), 0);
  return {
    fee: fee,
    rows: rows,
    /* the agency keeps the remainder — computed as the whole minus the parts already taken,
       which is what makes the split reconcile to the dram rather than to a rounding policy. */
    agencyKeep: al.rest,
    sumBp: sumBp,
    /* a UI that lets the sum exceed 10000 is a UI that lets the owner promise away more than the
       agency earns. The terms sheet blocks it with a plain sentence, not a validation icon. */
    over: sumBp > 10000
  };
}

/* THE ASSERTION. Called at every mint and hammered by the fuzz test. A split that does not
   reconcile is not a rounding preference, it is a defect, and the product refuses to mint from
   it rather than paying somebody one dram less than they earned. */
function assertReconciles(al){
  if(!al) return true;
  const sum = al.rows.reduce((x,r) => x + safeInt(r.amount,0), 0) + safeInt(al.agencyKeep,0);
  return sum === safeInt(al.fee,0);
}

/* the stage this deal must reach for the fee to be earned, and whether it has */
const triggerStage = terms => TRIGGER_STAGE[(terms && terms.trigger) || ''] || null;
/* HAS THE TRIGGER FIRED? A void does NOT un-fire it. The fee was earned at the moment the deal
   crossed its trigger, and a deal that collapses afterwards is answered with a REVERSAL row, not
   with a retroactive edit to history — an agent whose money moved is owed both lines. */
function isEarned(deal){
  const ts = triggerStage(deal && deal.terms);
  if(!ts) return false;
  return DEAL_RANK[deal.stage] >= DEAL_RANK[ts];
}
/* THE PAYOUT GATE, per §1.7. Two values, in plain language, with the consequence under each. */
function gateOpen(deal){
  /* A VOIDED DEAL HAS NO OPEN GATE. voidDeal() posts the reversal rows, so the arithmetic nets to
     zero on a deal this device voided — but a payload adopted from another device, or a restored
     backup, can carry the void without them, and the payouts screen must not offer «Վճարել»
     against money that has been reversed or is about to be. The reversal is the record; this is
     the guard, and the two agree. */
  if(deal && deal.void && deal.void.ts) return false;
  if(!isEarned(deal)) return false;
  if((S.cfg.payWhen || 'received') === 'earned') return true;
  return DEAL_RANK[deal.stage] >= DEAL_RANK.settled;
}

/* WHO MAY MINT MONEY. Only the owner's device writes earn / payout / reverse / adjust. An
   agent's device contributes viewings, offers and stage advances through the contribution
   channel; the money rows are DERIVED on the owner's device when a contributed stage advance
   crosses the deal's trigger. The asymmetry is the same one the suite already enforces — there,
   the shop's margin is the private half; here, it is the money. */
function mintEarnings(deal){
  if(!deal || !isEarned(deal)) return 0;
  const al = allocation(deal);
  if(!al || al.over) return 0;
  if(!assertReconciles(al)){ LEDGER_REJECTS.push({ r:{deal:deal.id}, why:'unreconciled_split' }); return 0; }
  /* already minted? the earn rows for this deal exist and the log is append-only */
  if(rowsOfDeal(deal.id).some(r => r.type === 'earn')) return 0;
  const rank = DEAL_RANK[deal.stage];
  let n = 0;
  al.rows.forEach(r => {
    if(!r.amount) return;
    if(postRow({ agent:r.agentId, type:'earn', amt:r.amount, ts:deal.stageTs || S.today,
      deal:deal.id, prop:deal.propertyId, trigger:deal.terms.trigger, rank:rank,
      actor:'owner' })) n++;
  });
  if(al.agencyKeep){
    if(postRow({ agent:AGENCY, type:'earn', amt:al.agencyKeep, ts:deal.stageTs || S.today,
      deal:deal.id, prop:deal.propertyId, trigger:deal.terms.trigger, rank:rank,
      actor:'owner' })) n++;
  }
  return n;
}

/* WHAT THE AGENCY OWES — DERIVED, NEVER COUNTED.
   owed(agent) = Σ(earn) + Σ(reverse) + Σ(adjust) + Σ(payout), where payouts and reversals carry
   NEGATIVE amounts, so the whole thing is one `+` over one book. A `S.owed[agentId]` field
   incremented on each event would drift the first time two devices merged; a running counter
   cannot merge by row id, and two books can. */
function agentMoney(agentId){
  let earned = 0, paid = 0, payableGross = 0;
  moneyRowsFor(agentId).forEach(r => {
    if(r.type === 'payout'){ paid += -r.amt; return; }
    earned += r.amt;
    const d = r.deal ? dealById(r.deal) : null;
    if(d && gateOpen(d)) payableGross += r.amt;
  });
  /* EXPECTED is not in the ledger and must not be: nothing has happened yet. It is derived from
     the deals that have terms and have not reached their trigger. A pipeline number and a debt
     are different kinds of thing, and a back office that adds them together is the reason owners
     keep the real numbers in a private spreadsheet. */
  let expected = 0;
  (S.deals||[]).forEach(d => {
    if(!d || (d.void && d.void.ts) || isEarned(d)) return;
    const al = allocation(d);
    if(!al || al.over) return;
    al.rows.forEach(r => { if(r.agentId === agentId) expected += r.amount; });
  });
  /* payouts are applied against open-gate earnings; if an agent was paid more than that, the
     surplus is an ADVANCE and is labelled as one rather than shown as a negative debt. */
  const payable = payableGross - paid;
  return {
    expected: expected, earned: earned, paid: paid,
    payable: Math.max(0, payable),
    advance: payable < 0 ? -payable : 0,
    owed: earned - paid
  };
}

/* WHAT THIS DEAL STILL OWES ITS AGENTS, from the deal's own rows.
   Stage 6 is defined in the specification as «every agent on the deal is paid», which is the one
   stage in the pipeline the ledger can contradict — and it did: the card read «Վճարված» while the
   payouts screen showed 202,500 «Վճարման ենթակա» for the same money with an active «Վճարել»
   button. Two screens of one product disagreeing about whether a person has been paid.
   The fold is the same `+` as everywhere: earn and adjust add, payout and reverse subtract, and
   what is left above zero is what is still owed on THIS deal. */
/* AN UNATTRIBUTED PAYOUT STILL PAYS FOR SOMETHING. The payout sheet offers the deal and does not
   require it, because an agency pays a round sum against a running balance and the ledger is right
   to tolerate that — so a payout carrying no deal is applied against that agent's earned deals
   OLDEST FIRST when the question is «is this particular deal settled with its agents».
   This is a DERIVATION over the log, not a second book: nothing is written, the order is a total
   order on (stageTs, id), and two devices holding the same rows compute the same answer. */
function agentDealBalances(agentId){
  const per = Object.create(null);   /* never {} — '__proto__' as a deal id would be truthy */
  let loose = 0;
  (S.rows||[]).forEach(r => {
    if(!isMoneyRow(r) || r.agent !== agentId) return;
    if(r.deal) per[r.deal] = (per[r.deal] || 0) + safeInt(r.amt, 0);
    else loose += safeInt(r.amt, 0);
  });
  /* DEALS WHOSE PAYOUT GATE IS OPEN COME FIRST, then oldest first inside each group. A lump sum
     handed to an agent is money the agency owed, and what it owed is precisely the gate-open
     earnings; allocating it against a deal that is not payable yet would leave a settled deal
     reading as unpaid while an unsettled one read as paid. */
  Object.keys(per).sort((a,b) => {
    const x = dealById(a), y = dealById(b);
    return ((gateOpen(x) ? 0 : 1) - (gateOpen(y) ? 0 : 1))
      || (safeInt(x && x.stageTs, 0) - safeInt(y && y.stageTs, 0)) || (a < b ? -1 : 1);
  }).forEach(id => {
    if(loose >= 0 || per[id] <= 0) return;    /* only a NEGATIVE loose balance pays anything */
    const take = Math.min(per[id], -loose);
    per[id] -= take; loose += take;
  });
  return per;
}
const dealOutstanding = (dealId, agentId) => safeInt(agentDealBalances(agentId)[dealId], 0);
function dealUnpaid(deal){
  if(!deal) return 0;
  const seen = Object.create(null);
  let n = 0;
  rowsOfDeal(deal.id).forEach(r => {
    if(!isMoneyRow(r) || r.agent === AGENCY || seen[r.agent]) return;
    seen[r.agent] = 1;
    const left = dealOutstanding(deal.id, r.agent);
    if(left > 0) n += left;
  });
  return n;
}
/* the forward button withholds the one stage the owner is not entitled to assert. Everything
   else in the pipeline records something that happened outside the app and the owner is the
   witness; «all agents paid» is a claim about this product's own books. */
function stageBlock(deal){
  if(!deal || nextStage(deal) !== 'paid') return null;
  const left = dealUnpaid(deal);
  return left > 0 ? { stage:'paid', left:left } : null;
}

/* the per-deal explanation of an agent's number — «why is this money mine, and since when» */
function agentDeals(agentId){
  return (S.deals||[]).filter(d => d && (d.agents||[]).some(a => a.agentId === agentId));
}

/* =====================================================================================
   MIGRATE
   Runs on EVERY adoption path — boot, last-known-good restore, a fresh seed, a self-test clone,
   and (when sync lands) every payload adopted from a room. Every key is defaulted and clamped
   here, so nothing downstream has to ask whether a field exists.

   ONE HAZARD FIXED ON THE WAY IN, because the sibling product got it wrong: its migrate rounded
   the on-hand cache with an integer function, which was harmless for counts and destroyed
   fractional weights. Here the cache IS integers, so the normaliser is the ledger's own clamp
   rather than a hardcoded rounder — the domain supplies the normaliser, migrate does not assume
   one.
   ===================================================================================== */
function migrate(st){
  if(!st || typeof st !== 'object') st = {};
  const f = freshState();

  st.v = safeInt(st.v, 1);
  st.today = Math.max(0, safeInt(st.today, Date.now()));

  /* ---- agency identity: free text, never trusted into a template unescaped ---- */
  const ag = (st.agency && typeof st.agency === 'object') ? st.agency : {};
  st.agency = { name:String(ag.name||''), tin:String(ag.tin||''),
                addr:String(ag.addr||''), phone:String(ag.phone||'') };

  /* ---- config ---- */
  const c = (st.cfg && typeof st.cfg === 'object') ? st.cfg : {};
  const d = freshCfg();
  st.cfg = {
    payWhen: c.payWhen === 'earned' ? 'earned' : 'received',
    payWhenTs: Math.max(0, safeInt(c.payWhenTs, 0)),
    /* the template is null until a human sets it. It is NEVER defaulted into a rate. */
    termsTemplate: c.termsTemplate ? normTerms(c.termsTemplate) : null,
    termsTemplateTs: Math.max(0, safeInt(c.termsTemplateTs, 0)),
    stuckDays: Math.max(1, Math.min(365, safeInt(c.stuckDays, d.stuckDays))),
    filingDays: Math.max(1, Math.min(365, safeInt(c.filingDays, d.filingDays)))
  };

  const arr = k => { if(!Array.isArray(st[k])) st[k] = []; };
  ['agents','clients','props','mandates','viewings','offers','deals','rows','events'].forEach(arr);

  /* ---- agents ---- */
  st.agents = st.agents.filter(a => a && a.id).map(a => ({
    id: String(a.id),
    name: String(a.name || ''),
    phone: String(a.phone || ''),
    /* CODE POINTS, NOT UTF-16 UNITS. «👩‍💼» is five UTF-16 units — two surrogate pairs joined by
       a zero-width joiner — so a .slice(0,4) cut it mid-pair and every agent avatar in the
       product rendered as a woman followed by a replacement diamond. Array.from() iterates code
       points, which is what "one emoji" actually means. */
    em: Array.from(String(a.em || '🧑')).slice(0, 5).join(''),
    /* NO DEFAULT SHARE. null means "the owner has not set it yet" and the agent card shows an
       amber «Բաժինը նշված չէ» rather than a number nobody agreed to. AN UNPARSEABLE VALUE IS
       ALSO AN ABSENCE: safeBp('abc', 0) would have turned a corrupted adopted payload into a
       confident «0%» badge, which is the no-default rule coerced into a number — the one thing
       this file must never do. Only a value that survives Number() becomes a share. */
    defaultShareBp: (a.defaultShareBp == null || !isFinite(+a.defaultShareBp))
      ? null : safeBp(a.defaultShareBp, 0),
    joinedTs: Math.max(0, safeInt(a.joinedTs, 0)),
    leftTs: Math.max(0, safeInt(a.leftTs, 0)),
    /* the draft law's registration, exam and professional liability insurance. Recorded, with an
       expiry countdown. Integrated with nothing — the law is not enacted and the platform it
       describes does not exist. */
    qual: {
      regNo: String((a.qual && a.qual.regNo) || ''),
      examTs: Math.max(0, safeInt(a.qual && a.qual.examTs, 0)),
      insurerName: String((a.qual && a.qual.insurerName) || ''),
      insuranceTo: Math.max(0, safeInt(a.qual && a.qual.insuranceTo, 0))
    },
    rid: String(a.rid || '')
  }));

  /* ---- clients ---- */
  st.clients = st.clients.filter(x => x && x.id).map(x => ({
    id: String(x.id), name: String(x.name||''), phone: String(x.phone||''), email: String(x.email||''),
    kind: (Array.isArray(x.kind) ? x.kind : []).filter(k => CLIENT_ROLES.indexOf(k) >= 0),
    tin: String(x.tin||''),
    passport: { series:String((x.passport&&x.passport.series)||''), no:String((x.passport&&x.passport.no)||'') },
    source: String(x.source||''), note: String(x.note||''), agentId: String(x.agentId||''),
    createdTs: Math.max(0, safeInt(x.createdTs,0)), archivedTs: Math.max(0, safeInt(x.archivedTs,0))
  }));

  /* ---- properties. Natural key: the կադաստրային ծածկագիր. ---- */
  st.props = st.props.filter(x => x && x.id).map(x => {
    const a = (x.addr && typeof x.addr === 'object') ? x.addr : {};
    return {
      id: String(x.id),
      cadCode: String(x.cadCode || ''),
      kind: PROP_KINDS.indexOf(x.kind) >= 0 ? x.kind : 'flat',
      deal: DEAL_KINDS.indexOf(x.deal) >= 0 ? x.deal : 'sale',
      addr: { marz:String(a.marz||''), city:String(a.city||''), district:String(a.district||''),
              street:String(a.street||''), no:String(a.no||'') },
      area: Math.max(0, Math.min(1000000, num(x.area))),
      rooms: Math.max(0, Math.min(99, safeInt(x.rooms,0))),
      floor: safeInt(x.floor,0), floors: Math.max(0, safeInt(x.floors,0)),
      built: Math.max(0, Math.min(2200, safeInt(x.built,0))),
      askPrice: safeAmd(x.askPrice, 0),
      askTs: Math.max(0, safeInt(x.askTs,0)),
      priceHist: (Array.isArray(x.priceHist)?x.priceHist:[]).map(h => ({
        ts:Math.max(0,safeInt(h&&h.ts,0)), price:safeAmd(h&&h.price,0), by:String((h&&h.by)||'') })),
      ownerClientId: String(x.ownerClientId||''),
      mandateId: String(x.mandateId||''),
      agentId: String(x.agentId||''),
      /* STAMPED, not monotone: a withdrawn property genuinely comes back to the market and a
         reserved one falls through. Value plus timestamp, latest wins. */
      status: PROP_STATUS.indexOf(x.status) >= 0 ? x.status : 'draft',
      statusTs: Math.max(0, safeInt(x.statusTs,0)),
      statusBy: String(x.statusBy||''),
      listedTs: Math.max(0, safeInt(x.listedTs,0)),
      createdTs: Math.max(0, safeInt(x.createdTs,0)),
      photos: (Array.isArray(x.photos)?x.photos:[]).slice(0,12).map(String),
      note: String(x.note||''),
      /* set-once: an archive is a one-way door, and that is what makes it merge-safe */
      archivedTs: Math.max(0, safeInt(x.archivedTs,0))
    };
  });

  /* ---- mandates ---- */
  st.mandates = st.mandates.filter(x => x && x.id).map(x => {
    const b = (x.brief && typeof x.brief === 'object') ? x.brief : {};
    const signed = Math.max(0, safeInt(x.signedTs,0));
    return {
      id: String(x.id), clientId: String(x.clientId||''),
      kind: ['sell','buy','let','rent'].indexOf(x.kind) >= 0 ? x.kind : 'sell',
      propertyIds: (Array.isArray(x.propertyIds)?x.propertyIds:[]).map(String),
      brief: { minPrice:safeAmd(b.minPrice,0), maxPrice:safeAmd(b.maxPrice,0),
               rooms:Math.max(0,safeInt(b.rooms,0)), marz:String(b.marz||''), note:String(b.note||'') },
      signedTs: signed,
      endTs: Math.max(0, safeInt(x.endTs,0)),
      exclusive: !!x.exclusive,
      exclusiveFrom: Math.max(0, safeInt(x.exclusiveFrom,0)),
      exclusiveTo: Math.max(0, safeInt(x.exclusiveTo,0)),
      terms: x.terms ? normTerms(x.terms) : null,
      status: MANDATE_STATUS.indexOf(x.status) >= 0 ? x.status : 'draft',
      statusTs: Math.max(0, safeInt(x.statusTs,0)),
      closedAs: MANDATE_STATUS.indexOf(x.closedAs) >= 0 ? x.closedAs : '',
      platformRegTs: Math.max(0, safeInt(x.platformRegTs,0)),
      docTs: Math.max(0, safeInt(x.docTs,0)), docNo: String(x.docNo||''),
      /* ten years, per the draft law's retention duty. Cheap to record now, impossible to
         reconstruct later. */
      retainUntil: plusYears(signed, 10)
    };
  });

  /* ---- viewings: the evidence. outcome and signedTs are SET-ONCE. ---- */
  st.viewings = st.viewings.filter(x => x && x.id).map(x => ({
    id: String(x.id), propertyId: String(x.propertyId||''), clientId: String(x.clientId||''),
    agentId: String(x.agentId||''), ts: Math.max(0, safeInt(x.ts,0)),
    outcome: VIEW_OUTCOMES.indexOf(x.outcome) >= 0 ? x.outcome : 'held',
    signedTs: Math.max(0, safeInt(x.signedTs,0)), signedBy: String(x.signedBy||''),
    note: String(x.note||''), uuid: String(x.uuid||'')
  }));

  /* ---- offers ---- */
  st.offers = st.offers.filter(x => x && x.id).map(x => ({
    id: String(x.id), propertyId: String(x.propertyId||''), clientId: String(x.clientId||''),
    agentId: String(x.agentId||''), ts: Math.max(0, safeInt(x.ts,0)),
    price: safeAmd(x.price,0),
    /* նախավճար and կանխավճար are legally DIFFERENT and the UI never collapses them into one
       word: one is forfeit if the buyer walks and returned double if the seller does, the other
       is simply returned. */
    depositKind: DEPOSIT_KINDS.indexOf(x.depositKind) >= 0 ? x.depositKind : 'kankh',
    depositAmount: safeAmd(x.depositAmount,0),
    validTo: Math.max(0, safeInt(x.validTo,0)),
    status: OFFER_STATUS.indexOf(x.status) >= 0 ? x.status : 'sent',
    statusTs: Math.max(0, safeInt(x.statusTs,0)), note: String(x.note||'')
  }));

  /* ---- deals ---- */
  st.deals = st.deals.filter(x => x && x.id).map(x => {
    const dt = (x.dates && typeof x.dates === 'object') ? x.dates : {};
    const dp = (x.deposit && typeof x.deposit === 'object') ? x.deposit : {};
    const nt = (x.notary && typeof x.notary === 'object') ? x.notary : {};
    const ce = (x.cert && typeof x.cert === 'object') ? x.cert : {};
    const cs = (x.consents && typeof x.consents === 'object') ? x.consents : {};
    const vd = (x.void && typeof x.void === 'object' && safeInt(x.void.ts,0)) ? x.void : null;
    return {
      id: String(x.id), propertyId: String(x.propertyId||''),
      buyerClientId: String(x.buyerClientId||''), sellerClientId: String(x.sellerClientId||''),
      mandateId: String(x.mandateId||''),
      kind: DEAL_KINDS.indexOf(x.kind) >= 0 ? x.kind : 'sale',
      price: safeAmd(x.price,0),
      agents: (Array.isArray(x.agents)?x.agents:[]).filter(a => a && a.agentId).map(a => ({
        agentId: String(a.agentId),
        side: ['listing','selling'].indexOf(a.side) >= 0 ? a.side : 'listing',
        /* SEEDED from the agent's standing share and thereafter FROZEN ON THE DEAL. Raising an
           agent from 40% to 50% changes their next deal and nothing else — a stored percentage
           that reached backwards would make every past commission statement a fiction. */
        shareBp: safeBp(a.shareBp, 0),
        joinedTs: Math.max(0, safeInt(a.joinedTs,0))
      })),
      terms: x.terms ? normTerms(x.terms) : null,
      stage: DEAL_STAGES.indexOf(x.stage) >= 0 ? x.stage : 'agreed',
      /* EVERY KEY IS DEFAULTED AND CLAMPED HERE — including this one. An absent stageTs fell
         through to the epoch and the Today screen reported a deal «20685 օր առանց շարժի». It
         falls back to the deal's own agreement date, and failing that to today. */
      stageTs: Math.max(0, safeInt(x.stageTs,0)) || Math.max(0, safeInt(dt.agreedTs,0))
               || Math.max(0, safeInt(st.today, 0)),
      dates: {
        agreedTs:Math.max(0,safeInt(dt.agreedTs,0)), depositTs:Math.max(0,safeInt(dt.depositTs,0)),
        notaryTs:Math.max(0,safeInt(dt.notaryTs,0)), filedTs:Math.max(0,safeInt(dt.filedTs,0)),
        registeredTs:Math.max(0,safeInt(dt.registeredTs,0)), invoicedTs:Math.max(0,safeInt(dt.invoicedTs,0)),
        settledTs:Math.max(0,safeInt(dt.settledTs,0))
      },
      deposit: { kind: DEPOSIT_KINDS.indexOf(dp.kind) >= 0 ? dp.kind : '',
                 amount: safeAmd(dp.amount,0), ts: Math.max(0,safeInt(dp.ts,0)) },
      notary: { name:String(nt.name||''), addr:String(nt.addr||''), actNo:String(nt.actNo||'') },
      cert: { no:String(ce.no||''), ts:Math.max(0,safeInt(ce.ts,0)) },
      consents: { spouse: !!cs.spouse, coOwners: !!cs.coOwners, checkedTs: Math.max(0,safeInt(cs.checkedTs,0)) },
      unifiedCertTs: Math.max(0, safeInt(x.unifiedCertTs,0)),
      /* FAILURE IS NOT A STAGE. Set-once, so a fallen deal shows as Տապալված with its reason and
         its date while the stage still records how far it got — which is what the owner needs
         when the same buyer comes back in three weeks. */
      void: vd ? { ts:Math.max(0,safeInt(vd.ts,0)), reason:String(vd.reason||''), by:String(vd.by||'') } : null,
      docs: (Array.isArray(x.docs)?x.docs:[]).map(String),
      note: String(x.note||'')
    };
  });

  /* ---- THE LEDGER. Rows are normalised but never reordered and never dropped for being out of
     sequence: the fold is commutative, so sequence is not a property this log has. A row with an
     unknown type IS dropped, because a row nothing can fold is not a row. ---- */
  /* Object.create(null), never {} — a bare object literal makes '__proto__' a truthy key, which
     is how a sibling product in this suite grew a supplier nobody hired. Here it would let a row
     whose uuid is the string '__proto__' claim to have been seen before any row was read. */
  const seen = Object.create(null);
  st.rows = st.rows.filter(r => r && ROW_TYPES.indexOf(r.type) >= 0 && r.uuid)
    .filter(r => { if(seen[r.uuid]) return false; seen[r.uuid] = 1; return true; })
    .map(r => {
      const money = MONEY_TYPES.indexOf(r.type) >= 0;
      const row = {
        uuid: String(r.uuid), agent: String(r.agent || AGENCY), type: r.type,
        amt: money ? LEDGER.clamp(r.amt) : 0,
        ts: Math.max(0, safeInt(r.ts,0)),
        deal:String(r.deal||''), prop:String(r.prop||''), client:String(r.client||''),
        trigger:String(r.trigger||''), reason:String(r.reason||''), actor:String(r.actor||''),
        note:String(r.note||''),
        rank: r.rank == null ? -1 : Math.max(-1, Math.min(DEAL_STAGES.length-1, safeInt(r.rank,-1)))
      };
      row.key = rowKey(row);
      return row;
    });

  /* the cache is rebuilt from the log on adoption, not carried across. A cache that survives a
     migration is a cache nobody checked. */
  st.owed = {};
  st.events = st.events.filter(e => e && e.uuid).slice(-100);
  return st;
}

/* terms normalisation, shared by the deal, the mandate and the saved template. NOTHING here
   supplies a rate: an absent bp stays absent, and feeOf() answers null for it. */
function normTerms(x){
  if(!x || typeof x !== 'object') return null;
  /* AN ABSENT splitBp STAYS ABSENT. Defaulting it to {0,0} looked harmless and was not: it made
     «nobody has said who pays» indistinguishable from «the seller pays nothing», and payerSplit()
     handed the whole fee to the buyer. Absence is a value here, exactly as a null rate is. */
  const sp = (x.splitBp && typeof x.splitBp === 'object') ? x.splitBp : null;
  return {
    basis: TERM_BASES.indexOf(x.basis) >= 0 ? x.basis : 'price',
    base: safeAmd(x.base, 0),
    mode: TERM_MODES.indexOf(x.mode) >= 0 ? x.mode : null,
    bp: x.bp == null ? null : safeBp(x.bp, 0),
    flat: x.flat == null ? null : safeAmd(x.flat, 0),
    monthsBp: x.monthsBp == null ? null : safeBp(x.monthsBp, 0),
    payer: PAYERS.indexOf(x.payer) >= 0 ? x.payer : null,
    splitBp: sp ? { seller: safeBp(sp.seller, 0), buyer: safeBp(sp.buyer, 0) } : null,
    vat: VAT_FLAGS.indexOf(x.vat) >= 0 ? x.vat : 'none',
    trigger: TRIGGERS.indexOf(x.trigger) >= 0 ? x.trigger : null,
    setBy: String(x.setBy || ''), setTs: Math.max(0, safeInt(x.setTs, 0)),
    note: String(x.note || '')
  };

/* COMPLETE MEANS EVERY AXIS IS DECIDED, not just the rate. A `split` payer with no splitBp, or
   one whose halves do not sum to 100%, leaves the who-pays axis undecided, and the product's
   answer to an undecided axis is always the same: say so and offer the form, never guess. */
const termsComplete = tm => !!(tm && tm.mode && tm.payer && tm.trigger && feeOf(tm) != null
  && (tm.payer !== 'split' || payerSplit(tm, feeOf(tm)) != null));

  const s = migrate(st);
  const prev = S; S = s;
  try{ S.owed = rebuildOwed(); }catch(e){ S = prev; throw e; }
  return s;
}

/* which stages apply to this deal. A short lease has no cadastral registration of a transfer;
   the rank still works, the UI simply never offers a stage that does not apply and the deal card
   strikes it through with «չի կիրառվում». */
function stageApplies(deal, stage){
  const na = STAGE_NA[deal && deal.kind] || [];
  return na.indexOf(stage) < 0;
}
function stageTsOf(deal, stage){
  const d = (deal && deal.dates) || {};
  return safeInt({ agreed:d.agreedTs, deposit:d.depositTs, notary:d.notaryTs, registered:d.registeredTs,
                   invoiced:d.invoicedTs, settled:d.settledTs, paid:0 }[stage], 0);

/* =====================================================================================
   NAVIGATION
   Nine destinations for the owner, measured at 14px in the CURRENT language and spilled into
   «Ավելին» with their badges intact. The bar is INVARIANT: the same nine live in the same order
   on every screen, and «you are here» may never be hidden — the open tab buys its way in at the
   bottom's expense.
   ===================================================================================== */
const NAV_KEYS = ['home','deals','payouts','props','agents','clients','views','docs','data'];
/* the order of surrender. The daily loop is the last to leave the bar; Տվյալներ is the first. */
const NAV_PRIO = ['home','deals','payouts','props','agents','views','clients','docs','data'];
const NAV_ICON = { home:'📋', deals:'🤝', payouts:'💳', props:'🏠', agents:'🧑‍💼',
                   clients:'👥', views:'🔑', docs:'📄', data:'📈' };

/* the badge on each destination is a COUNT OF THINGS THAT NEED A PERSON, never a count of rows.
   A badge that only says "there are records here" trains the user to ignore badges. */
function navBadge(k){
  if(!S) return 0;
  if(k === 'home')    return homeCards().length;
  if(k === 'deals')   return (S.deals||[]).filter(d => !d.void && !termsComplete(d.terms)).length;
  if(k === 'payouts') return activeAgents().filter(a => agentMoney(a.id).payable > 0).length;
  if(k === 'props')   return (S.props||[]).filter(p => !p.archivedTs && !mandateOfProp(p.id)).length;
  if(k === 'agents')  return activeAgents().filter(a => a.defaultShareBp == null).length;
  if(k === 'views')   return (S.viewings||[]).filter(v => !v.signedTs).length;
  if(k === 'docs')    return (S.mandates||[]).filter(m => exclLeft(m) != null && exclLeft(m) <= 14).length;
  return 0;
}
function exclLeft(m){
  if(!m || !m.exclusive || !m.exclusiveTo) return null;
  if(['expired','terminated','fulfilled'].indexOf(m.status) >= 0) return null;
  return daysBetween(S.today, m.exclusiveTo);
}

let NAVMC = null;
function navTextW(txt){
  try{
    if(!NAVMC) NAVMC = document.createElement('canvas').getContext('2d');
    NAVMC.font = '600 14px ' + getComputedStyle(document.body).fontFamily;
    return NAVMC.measureText(String(txt)).width;
  }catch(e){ return String(txt).length * 8; }
}
const NAV_ACT_PAD = 10;
/* and a floor, because the CSS gives the active cell min-width:44px and a plan that measured
   "Data" at 41.6px would disagree with the paint. Nothing under 44x44 anywhere. */
const NAV_ACT_MIN = 44;
function navPlan(W){
  const labels = {}; NAV_KEYS.forEach(k => labels[k] = t('tab_'+k));
  const moreW = navTextW(t('more_tab'));
  const active = NAV_PRIO.indexOf(U.tab) >= 0 ? U.tab : null;
  for(let k = NAV_KEYS.length; k >= 1; k--){
    let keys = NAV_PRIO.slice(0,k);
    if(active && keys.indexOf(active) < 0){
      keys = keys.slice(0, Math.max(1, k-1)); keys.push(active);
    }
    const cells = k + (k < NAV_KEYS.length ? 1 : 0);
    /* the ACTIVE cell is not measured against the shared width: it takes exactly the room its own
       word needs and the remaining cells divide the rest, so a long Armenian label costs one cell
       instead of collapsing the bar. Nothing is ellipsised and nothing is shrunk. */
    const actW = active && keys.indexOf(active) >= 0
      ? Math.max(NAV_ACT_MIN, navTextW(labels[active]) + NAV_ACT_PAD) : 0;
    const rest = cells - (actW ? 1 : 0);
    if(rest < 1){ if(actW && actW <= W) return keys; continue; }
    const cw = ((W - actW) / rest) - 4;
    if(cw < 40) continue;
    const ok = keys.every(kk => kk === active || navTextW(labels[kk]) <= cw)
      && (k >= NAV_KEYS.length || moreW <= cw);
    if(ok) return keys;
  }
  return active ? [active] : [NAV_PRIO[0]];
}

let MODAL_RE = null;
function openModal(inner){
  const r = document.getElementById('modalRoot');
  /* keep the reader where they were: a repaint driven by a display-convention change (the
     language, the theme) must not throw an open sheet back to its top. */
  const prev = r.querySelector('.modal');
  const y = prev ? prev.scrollTop : 0;
  r.innerHTML = '<div class="modal" onclick="if(event.target===this)closeModal()">'
    + '<div class="mbody"><div class="grabber"></div>' + inner + '</div></div>';
  if(y){ try{ r.querySelector('.modal').scrollTop = y; }catch(e){} }
}
function closeModal(){ MODAL_RE = null; document.getElementById('modalRoot').innerHTML = ''; }
/* AN OPEN SHEET IS PART OF THE SCREEN, so a global repaint must repaint it too. Every sheet is
   drawn by a function that reads its state from its arguments, so re-invoking it with the same
   arguments is a faithful redraw; the wrapper records the call, closeModal() forgets it, and a
   redraw that throws forgets itself rather than looping. */
function repaintSheet(){
  const re = MODAL_RE;
  if(!re) return;
  if(!document.getElementById('modalRoot').innerHTML){ MODAL_RE = null; return; }
  try{ re(); }catch(e){ MODAL_RE = null; }
}
function escClose(){
  const r = document.getElementById('modalRoot');
  if(!r || !r.innerHTML) return false;
  closeModal();
  return true;
}
let TOAST_T = 0;
function toast(msg){
  const el = document.getElementById('toast');
  el.className = 'show'; el.textContent = String(msg||'');
  clearTimeout(TOAST_T); TOAST_T = setTimeout(() => { el.className = ''; }, 2600);
}

/* THE FEE'S PROVENANCE, as one sentence under the figure. §8: never show a number you cannot
   explain in one sentence under it. This is the sentence for the most contested number in the
   product — «2% վաճառքի գնից · վճարում՝ վաճառողը · վաստակած՝ պետական գրանցումից». */
/* the label separator: Armenian uses ՝ where English and Russian use a colon. One helper, so a
   sentence built in three languages does not carry an Armenian mark into the Russian one. */
const sepC = () => lang === 'hy' ? '՝ ' : ': ';
function feeWhy(deal){
  const tm = deal && deal.terms;
  if(!termsComplete(tm)) return null;
  const rate = tm.mode === 'pct' ? bpTxt(tm.bp) + ' ' + basisLabel(tm.basis)
    : tm.mode === 'flat' ? t('cm_mode_flat')
    : monthsTxt(tm.monthsBp) + ' ' + t('cm_months_u');
  const who = t('cm_payer') + sepC() + payerLabelK(deal.kind, tm.payer);
  const when = t('cm_trigger') + sepC() + triggerLabel(tm.trigger);
  return [rate, who, when].join(' · ');
}

/* =====================================================================================
   TODAY — the owner's screen, and the only question it answers is
   «Ի՞նչ է այսօր ինձնից կախված» — what today depends on me.
   At most six cards, each one a single sentence and a single button, in a priority order that
   puts money out first and reporting nowhere. Properties, clients and contracts are tabs, not
   the front page — the sibling product's hardest lesson was that capability without focus reads
   as complexity.
   ===================================================================================== */
/* a card body joins the parts that EXIST. A property whose row is missing from an adopted
   payload used to leave the sentence starting with a bare «·». */
const cardBody = parts => parts.filter(x => x != null && String(x).trim() !== '').join(' · ');
function homeCards(){
  const out = [];

  /* 1 — MONEY OUT. Commission received, agents not paid. */
  const owing = activeAgents().map(a => ({ a:a, m:agentMoney(a.id) })).filter(x => x.m.payable > 0);
  if(owing.length){
    const total = owing.reduce((n,x) => n + x.m.payable, 0);
    /* `html` rather than `body`: money on the highest-traffic screen in the product goes
       through amd() like money everywhere else, so the figure keeps its tabular figures and the
       dram mark rides INSIDE the number instead of breaking onto its own line at 320px. */
    out.push({ k:'payout', tone:'', icon:'💳', title:t('c_payout'), btn:t('c_btn_pay'),
      html: escH(fmt('c_payout_b', {n:owing.length})) + ' · ' + amd(total), tab:'payouts' });
  }

  /* 2 — MONEY IN. Earned, and the agency has not invoiced it. */
  const uninvoiced = (S.deals||[]).filter(d => !d.void && isEarned(d) && DEAL_RANK[d.stage] < DEAL_RANK.invoiced);
  if(uninvoiced.length){
    let sum = 0; uninvoiced.forEach(d => { const al = allocation(d); if(al) sum += al.fee; });
    out.push({ k:'invoice', tone:'', icon:'🧾', title:t('c_invoice'), btn:t('c_btn_deals'),
      html: escH(fmt('c_invoice_b', {n:uninvoiced.length})) + ' · ' + amd(sum), tab:'deals' });
  }

  /* 3 — A LEGAL CLOCK RUNNING OUT. The 30-working-day cadastre filing deadline first, because
     missing it is the one that costs the client money rather than the agency face. */
  (S.deals||[]).forEach(d => {
    if(d.void || !d.dates.notaryTs || d.dates.filedTs) return;
    const left = workingDaysLeft(d.dates.notaryTs, S.cfg.filingDays, S.today);
    if(left > 7) return;
    /* A MISSED DEADLINE IS NOT THE SAME CARD AS A DEADLINE APPROACHING, and it goes to the top. */
    out.push({ k:'filing:'+d.id, tone:'bad', icon:'⏳', prio: left < 0 ? -1 : 0,
      title: left < 0 ? t('c_clock_over') : t('c_clock'),
      body: cardBody([propAddr(propById(d.propertyId)), filingLeftText(left)]),
      tab:'deals', btn:t('c_btn_deal'), act:'openDeal(' + jsArg(d.id) + ')' });
  });
  (S.mandates||[]).forEach(m => {
    const left = exclLeft(m);
    if(left == null || left > 14) return;
    out.push({ k:'excl:'+m.id, tone:'', icon:'📄', title:t('c_excl'), btn:t('c_btn_contract'),
      body: clientName(m.clientId) + ' · ' + fmt('c_excl_b', {n:Math.max(0,left)}), tab:'docs' });
  });
  activeAgents().forEach(a => {
    const to = a.qual && a.qual.insuranceTo;
    if(!to) return;
    const left = daysBetween(S.today, to);
    if(left > 30) return;
    /* THE CAVEAT TRAVELS WITH THE CARD. Professional liability insurance is a DRAFT-law duty,
       not an enacted one, and this card sits in the same stack as the 30-working-day cadastre
       deadline — a clock that is genuinely legal. The disclaimer at the foot of the agents screen
       is two screens away from a card that reads like an obligation. */
    out.push({ k:'ins:'+a.id, tone:'', icon:'🛡️', title:t('c_ins'), btn:t('c_btn_agent'),
      body: a.name + ' · ' + fmt('c_ins_b', {n:Math.max(0,left)}) + ' · ⚖️ ' + t('ag_law_note'),
      tab:'agents', act:'openAgent(' + jsArg(a.id) + ')' });
  });

  /* 4 — A DEAL STUCK, with the stage NAMED. "Stalled" without a stage is a nag, not a fact. */
  (S.deals||[]).forEach(d => {
    if(d.void || DEAL_RANK[d.stage] >= DEAL_RANK.paid) return;
    /* A DEAL WITH NO stageTs IS NOT A DEAL STUCK SINCE 1970. migrate() now defaults it, but a
       card that would have to say «20685 օր» is a card that has nothing true to say. */
    if(!d.stageTs) return;
    const idle = daysBetween(d.stageTs, S.today);
    if(idle < S.cfg.stuckDays) return;
    out.push({ k:'stuck:'+d.id, tone:'', icon:'🐌', title:t('c_stuck'), btn:t('c_btn_deal'),
      body: cardBody([propAddr(propById(d.propertyId)), stageLabel(d.stage), fmt('c_stuck_b',{n:idle})]),
      tab:'deals', act:'openDeal(' + jsArg(d.id) + ')' });
  });

  /* 5 — TERMS MISSING. A deal at stage 0 with no commission terms cannot advance, and a human
     has to type a number. There is no default to fall back on and that is deliberate. */
  (S.deals||[]).filter(d => !d.void && !termsComplete(d.terms)).forEach(d => {
    out.push({ k:'terms:'+d.id, tone:'bad', icon:'✍️', title:t('c_terms'), btn:t('cm_fill'),
      body: cardBody([propAddr(propById(d.propertyId)), t('c_terms_b')]), tab:'deals',
      act:'openTerms(' + jsArg(d.id) + ')' });
  });

  /* 6 — FROM THE FIELD. An unsigned viewing sheet is an unenforceable fee claim, which is the
     one piece of paper this product exists to make sure gets signed. */
  const unsigned = (S.viewings||[]).filter(v => !v.signedTs);
  if(unsigned.length){
    out.push({ k:'unsigned', tone:'', icon:'🔑', title:t('c_unsigned'), btn:t('c_btn_sheets'),
      body: fmt('c_unsigned_b', {n:unsigned.length}), tab:'views' });
  }
  /* an overdue legal deadline outranks everything, including money out: it is the one item on
     this screen that costs the CLIENT money rather than the agency face. */
  return out.sort((a,b) => (a.prio || 0) - (b.prio || 0));
}

function monthKPIs(){
  const d = new Date(S.today);
  const from = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1);
  let closed = 0, earned = 0, received = 0, owed = 0;
  (S.deals||[]).forEach(x => {
    if(!x.void && x.dates.settledTs >= from) closed++;
    if(!x.void && x.dates.settledTs >= from){ const al = allocation(x); if(al) received += al.fee; }
  });
  (S.rows||[]).forEach(r => {
    if(r.ts < from) return;
    if(r.type === 'earn' || r.type === 'reverse' || r.type === 'adjust') earned += r.amt;
  });
  activeAgents().forEach(a => { owed += agentMoney(a.id).owed; });
  return { closed:closed, earned:earned, received:received, owed:owed };
}

    + '<div class="kpi"><div class="l">' + escH(t('kpi_received')) + '</div><div class="v">' + amdTxt(k.received) + '<span class="cur">֏</span></div></div>'
    + '<div class="kpi"><div class="l">' + escH(t('kpi_owed')) + '</div><div class="v">' + amdTxt(k.owed) + '<span class="cur">֏</span></div></div>'
    + '</div>';
  return h;
}

/* =====================================================================================
   AGENTS — the feature the owner named first
   ===================================================================================== */

/* THE HONEST CONVERSION METRIC. Viewings with a RECORDED outcome are the denominator, so a
   viewing the owner never followed up is UNMEASURABLE rather than a failure. An agent's number
   must never be worsened by the office's missing data, and under n<3 the screen says «չափելի
   չէ» instead of printing a percentage off two events. */
function agentConversion(agentId){
  const vs = (S.viewings||[]).filter(v => v.agentId === agentId);
  const measurable = vs.filter(v => ['interested','declined','held'].indexOf(v.outcome) >= 0);
  if(measurable.length < 3) return { n:measurable.length, pct:null };
  const converted = measurable.filter(v =>
    (S.offers||[]).some(o => o.propertyId === v.propertyId && o.clientId === v.clientId
      && ['accepted','sent'].indexOf(o.status) >= 0)).length;
  return { n:measurable.length, pct: Math.round(converted * 100 / measurable.length) };
}

function agentCard(a){
  const m = agentMoney(a.id);
  const conv = agentConversion(a.id);
  const deals = agentDeals(a.id).filter(d => !d.void && DEAL_RANK[d.stage] >= DEAL_RANK.registered).length;
  const views = (S.viewings||[]).filter(v => v.agentId === a.id).length;
  const insLeft = a.qual.insuranceTo ? daysBetween(S.today, a.qual.insuranceTo) : null;
  return '<div class="card">'
    + '<div class="poh">'
      + '<div class="pav">' + escH(a.em) + '</div>'
      + '<div class="pon"><div class="addr">' + escH(a.name) + '</div>'
        + '<div class="muted">' + escH(a.phone) + '</div></div>'
    + '</div>'
    /* «Միջնորդավճարի X%» — X% OF THE COMMISSION, never a bare X%. "My two percent" is ambiguous
       and the ambiguity is where arguments start. The badge sits on its own line so the agent's
       NAME keeps the full column width; a name squeezed beside a badge wraps mid-syllable. */
    + '<div class="badgerow" style="margin-top:10px">' + (a.defaultShareBp == null

/* =====================================================================================

let DEAL_F = '';
function setDealF(v){ DEAL_F = (DEAL_F === v ? '' : v); renderAll(); }

function stageBar(deal){
  const upto = DEAL_RANK[deal.stage];
  return '<div class="stg">' + DEAL_STAGES.map((s,i) =>
    '<i class="' + (!stageApplies(deal,s) ? 'na' : i <= upto ? 'on' : '') + '" title="'
    + escH(stageLabel(s)) + '"></i>').join('') + '</div>';
}
function nextStage(deal){
  const upto = DEAL_RANK[deal.stage];
  for(let i = upto+1; i < DEAL_STAGES.length; i++){
    if(stageApplies(deal, DEAL_STAGES[i])) return DEAL_STAGES[i];
  }
  return null;
}

/* THE DEAL'S DOCUMENT NUMBER. Every other document in this file mints a quotable number —
   ԾՄՊ-2026-014 for a contract, ՑԹ-2026-001 for a viewing sheet, ՄՀ-2026-08-A1 for a statement —
   and a deal was printing «d1», the localStorage array key, on a signed commission statement and
   in the first column of the accountant's export. Derived from the deal's position in its own
   year's chronology, so it is a pure function of the data and two devices print the same number.
   THE RAW ID IS STILL THE JOIN KEY IN THE LEDGER EXPORT — that file is the log, not a document. */
function dealDocNo(d){
  if(!d) return '';
  const key = x => safeInt((x.dates && x.dates.agreedTs) || x.stageTs, 0);
  const y = new Date(key(d)).getUTCFullYear();
  const yr = (S.deals||[]).filter(x => new Date(key(x)).getUTCFullYear() === y)
    .sort((a,b) => (key(a) - key(b)) || (a.id < b.id ? -1 : 1));
  const i = yr.findIndex(x => x.id === d.id) + 1;
  return 'Գ-' + y + '-' + (i < 100 ? ('00' + i).slice(-3) : i);
}
const dealNoOf = id => dealDocNo(dealById(id));

/* the four states, for ONE deal and ONE agent — the sentence an agent actually asks for */
function dealMoneyState(deal){
  if(deal.void && deal.void.ts) return 'void';
  if(!termsComplete(deal.terms)) return 'noterms';
  if(!isEarned(deal)) return 'expected';
  if(DEAL_RANK[deal.stage] >= DEAL_RANK.paid) return 'paid';
  return gateOpen(deal) ? 'payable' : 'earned';
}
const DEAL_STATE_BADGE = { void:'b-rose', noterms:'b-gold', expected:'b-neutral',
  earned:'b-cyan', payable:'b-green', paid:'b-green' };
const dealStateLabel = s => s === 'void' ? t('d_void') : s === 'noterms' ? t('cm_none') : t('st_'+s);

function dealCard(d){
  const p = propById(d.propertyId);
  const al = allocation(d);
  const why = feeWhy(d);
  const st = dealMoneyState(d);
  const ns = nextStage(d);
  return '<div class="card' + (st === 'noterms' ? ' rail rail-bad' : '') + '">'
    + '<div class="sug" style="border-bottom:none;padding:0">'
      + '<div class="pav">' + (p ? (KIND_EM[p.kind]||'🏠') : '🏠') + '</div>'
      + '<div class="info"><div class="addr">' + escH(p ? propAddr(p) : '—') + '</div>'
        + '<div class="muted">' + escH((d.kind === 'lease' ? t('d_landlord') : t('d_seller')) + sepC()
          + clientName(d.sellerClientId) + ' · ' + (d.kind === 'lease' ? t('d_tenant') : t('d_buyer')) + sepC()
          + clientName(d.buyerClientId)) + '</div></div>'
    + '</div>'
    + stageBar(d)
    /* THE STAGE IS SAID ONCE. It read «Նախնական պայմանագիր / Նախնական պայմանագիր» stacked, the
       plain span and the badge carrying the same word; the span now carries the deal's quotable
       number, which is the thing that was missing from every document instead. */
    + '<div class="row"><span class="stgname">' + escH(dealDocNo(d)) + '</span>'
      + '<div class="badgerow">' + badge(STAGE_CLASS[d.stage]||'b-neutral', stageLabel(d.stage))
        + badge(DEAL_STATE_BADGE[st], dealStateLabel(st)) + '</div></div>'
    + '<div style="margin-top:12px">'
      + (al ? amdBig(al.fee) : '<div class="nofig">' + escH(t('cm_none')) + '</div>')
      + '<div class="prov' + (why ? '' : ' warn') + '">' + escH(why || t('cm_none_b')) + '</div>'
    + '</div>'
    + (al ? '<div class="badgerow" style="margin-top:10px">' + al.rows.map(r =>
        badge('b-neutral', agentEm(r.agentId) + ' ' + agentName(r.agentId) + ' · ' + bpTxt(r.shareBp))).join('') + '</div>' : '')
    + (d.void ? '<div class="notice bad">' + escH('✖️ ' + t('d_void') + sepC() + d.void.reason
        + ' · ' + fdate(d.void.ts)) + '</div>' : '')
    + '<div class="row" style="margin-top:14px">'
      + '<button class="btn ghost small" onclick="openDeal(' + jsArg(d.id) + ')">' + escH(t('c_open')) + '</button>'
      /* THE FORWARD BUTTON IS LABELLED WITH THE NEXT STAGE'S ACTUAL NAME — «Նշել նոտարական
         վավերացումը» — never "advance". The agent knows what happened; the app should use the
         same word they would. */
      /* AND IT IS ABSENT WHEN THE DEAL CANNOT MOVE. Offering a forward button on a deal with no
         commission terms, only to refuse the tap with a toast, teaches the owner that the
         product's buttons lie. The card's red rail and its sentence are the answer instead. */
      + (ns && !d.void && termsComplete(d.terms) && !stageBlock(d)
          ? '<button class="btn small primary" onclick="advanceDeal(' + jsArg(d.id) + ')">'
            + escH(fmt('d_mark', {s:stageLabel(ns)})) + '</button>'
        : (stageBlock(d) && !d.void)
          ? '<button class="btn small ghost" onclick="setTab(' + jsArg('payouts') + ')">💳 '
            + escH(t('c_btn_pay')) + '</button>' : '')
    + '</div>'
    /* and it says WHY, on the card, rather than refusing the tap with a toast */
    + (stageBlock(d) && !d.void ? '<div class="prov warn">' + escH(t('d_paid_block') + sepC()
        + amdTxt(stageBlock(d).left) + ' ֏') + '</div>' : '')
    + '</div>';
}

function dealsView(){
  let h = secTitle('🤝', t('deals_title'));
  /* THE OFFER IS WHERE A DEAL COMES FROM. §2.7: a deal exists when an offer is accepted and not
     one moment before — so the offers sit above the deals on this screen, the open ones first,
     and accepting one is the tap that creates the deal. */
  h += '<button class="btn ghost full" style="margin-bottom:12px" onclick="openNewOffer()">📝 '
    + escH(t('of_new')) + '</button>';
  const open = (S.offers||[]).filter(o => o.status === 'sent')
    .sort((a,b) => safeInt(b.ts,0) - safeInt(a.ts,0));
  if(open.length){
    h += secTitle('📝', t('of_title')) + open.map(offerRow).join('');
    h += secTitle('🤝', t('deals_title'));
  }
  h += '<div class="chips"><button class="' + (!DEAL_F ? 'active' : '') + '" onclick="setDealF('
    + jsArg('') + ')">' + escH(t('p_all')) + '</button>'
    + DEAL_STAGES.map(s => '<button class="' + (DEAL_F === s ? 'active' : '') + '" onclick="setDealF('
      + jsArg(s) + ')">' + escH(stageLabel(s)) + '</button>').join('') + '</div>';
  const list = (S.deals||[]).filter(d => !DEAL_F || d.stage === DEAL_F)
    .sort((a,b) => safeInt(b.stageTs,0) - safeInt(a.stageTs,0));
  h += list.length ? list.map(dealCard).join('') : emptyCard(t('d_none'), '');
  return h;
}

/* ADVANCE. The stage is a monotone rank and it only ever goes forward; the row that records it
   carries the rank, so a merge is max() and two devices cannot disagree about where a deal is.
   Crossing the trigger mints the money — on the owner's device, from the owner's own code. */
function advanceDeal(id){
  const d = dealById(id);
  if(!d || d.void) return;
  if(!termsComplete(d.terms)){ toast(t('cm_none')); openDeal(id); return; }
  const ns = nextStage(d);
  if(!ns) return;
  /* checked again HERE and not only where the button is drawn: a sheet left open while a payout
     was recorded on another screen must not be able to assert a stage the books contradict. */
  const blk = stageBlock(d);
  if(blk){ toast(t('d_paid_block')); openDeal(id); return; }
  d.stage = ns; d.stageTs = S.today;
  const key = { deposit:'depositTs', notary:'notaryTs', registered:'registeredTs',
                invoiced:'invoicedTs', settled:'settledTs' }[ns];
  if(key && !d.dates[key]) d.dates[key] = S.today;
  postRow({ agent:AGENCY, type:'stage', amt:0, ts:S.today, deal:d.id, prop:d.propertyId,
            reason:ns, rank:DEAL_RANK[ns], actor:'owner' });
  const minted = mintEarnings(d);
  saveState(); renderAll();
  toast(stageLabel(ns) + (minted ? ' · ' + t('st_earned') : ''));
}

/* ---------- the deal sheet: where the split has to reconcile in front of the owner ---------- */
function openDeal(id){
  const d = dealById(id);
  if(!d) return;
  MODAL_RE = () => openDeal(id);
  const p = propById(d.propertyId);
  const al = allocation(d);
  const ps = al ? payerSplit(d.terms, al.fee) : null;

  let h = '<h3>' + (p ? (KIND_EM[p.kind]||'🏠') : '🏠') + ' ' + escH(p ? propAddr(p) : '—') + '</h3>';
  h += '<div class="muted">' + escH(t('csv_deal') + ' ' + dealDocNo(d)) + '</div>';
  h += '<div class="cad" style="margin-bottom:12px">' + escH(p ? p.cadCode : '') + '</div>';
  h += stageBar(d);
  h += '<div class="badgerow" style="margin-bottom:12px">'
    + badge(STAGE_CLASS[d.stage]||'b-neutral', stageLabel(d.stage))
    + badge('b-neutral', dealKindLabel(d.kind))
    + badge(DEAL_STATE_BADGE[dealMoneyState(d)], dealStateLabel(dealMoneyState(d))) + '</div>';

  h += '<div class="row"><span class="mlbl">' + escH(t('d_price')) + '</span>' + amd(d.price) + '</div>';

  if(d.void && d.void.ts){
    h += '<div class="notice bad" style="margin-top:10px">' + escH('✖️ ' + t('d_void') + sepC()
      + d.void.reason + ' · ' + fdate(d.void.ts)) + '</div>';
  }

  /* ---- WHO IS ON THIS DEAL, AND FOR WHAT SHARE ----
     §1.5. The per-deal number is seeded from the agent's standing share and thereafter frozen on
     the deal; it is editable here until the fee is earned, and after that the product refuses and
     names the instrument that exists for it rather than rewriting history. */
  h += '<div class="sec">🧑‍💼 ' + escH(t('d_agents')) + '</div>';
  h += '<div class="card" style="margin:0 0 12px">'
    + ((d.agents||[]).length
        ? (d.agents||[]).map(a => '<div class="row"><span>' + escH(agentEm(a.agentId) + ' '
            + agentName(a.agentId)) + '<div class="muted">' + escH(a.side ? t('ag_side_'+a.side) : '')
            + '</div></span><span class="num">' + escH(bpTxt(safeBp(a.shareBp,0))) + '</span></div>').join('')
        : '<div class="notice">' + escH(t('d_agents_none')) + '</div>')
    + '<div class="prov">' + escH(t('ag_share_help')) + '</div>'
    + (isEarned(d)
        ? '<div class="prov warn">' + escH(t('d_agents_locked')) + '</div>'
        : '<button class="btn ghost full" style="margin-top:10px" onclick="openDealAgents('
          + jsArg(d.id) + ')">' + escH(t('d_agents_edit')) + '</button>')
    + '</div>';

  /* ---- THE TERMS ---- */
  h += '<div class="sec">💼 ' + escH(t('cm_terms')) + '</div>';
  if(!termsComplete(d.terms)){
    /* THE DEAL THAT CANNOT MOVE, AND THE BUTTON THAT MOVES IT. Stating the problem honestly and
       then offering only «Close» was a product that could not do the thing it is for. */
    h += '<div class="alert bad"><div class="t">' + escH(t('cm_none')) + '</div>'
      + '<div class="d">' + escH(t('cm_none_b')) + '</div>'
      + '<div class="act"><button class="btn primary" onclick="openTerms(' + jsArg(d.id) + ')">'
        + escH(t('cm_fill')) + '</button></div></div>';
  } else {
    const tm = d.terms;
    const rate = rateAsTyped(tm);
    h += '<div class="card" style="margin:0 0 12px">'
      + '<div class="row"><span class="mlbl">' + escH(t('cm_base')) + '</span><span>'
        + escH(basisLabel(tm.basis)) + ' · ' + amdTxt(tm.base) + ' ֏</span></div>'
      + '<div class="row"><span class="mlbl">' + escH(modeLabel(tm.mode)) + '</span><span class="num">'
        + escH(rate) + '</span></div>'
      + '<div class="row"><span class="mlbl">' + escH(t('cm_payer')) + '</span><span>'
        + escH(payerLabelK(d.kind, tm.payer)) + '</span></div>'
      /* THE TWO INVOICES, EACH WITH THE PERCENTAGE THAT PRODUCED IT. A split-payer deal owes
         two invoices, so the sheet prints both amounts beside both shares rather than a bare
         pair of figures the owner has to trust. */
      + (tm.payer === 'split' && ps ? '<div class="row"><span class="mlbl">'
          + escH(payerLabelK(d.kind,'seller')) + ' · ' + escH(bpTxt(ps.sellerBp)) + '</span>'
          + amd(ps.seller) + '</div>'
        + '<div class="row"><span class="mlbl">'
          + escH(payerLabelK(d.kind,'buyer')) + ' · ' + escH(bpTxt(ps.buyerBp)) + '</span>'
          + amd(ps.buyer) + '</div>' : '')
      + '<div class="row"><span class="mlbl">' + escH(t('cm_trigger')) + '</span><span>'
        + escH(triggerLabel(tm.trigger)) + '</span></div>'
      + '<div class="row"><span class="mlbl">' + escH(t('cm_vat')) + '</span><span>'
        + escH(vatLabel(tm.vat)) + '</span></div>'
      + '<div class="prov">' + escH(t('cm_vat_note')) + '</div>'
      + (tm.setTs ? '<div class="prov">' + escH(t('cm_setby') + sepC() + actorName(tm.setBy) + ' · ' + fdate(tm.setTs)) + '</div>' : '')
      + '</div>';

    /* ---- THE SPLIT, WITH ITS RECONCILIATION LINE ---- */
    h += '<div class="sec">💰 ' + escH(t('cm_fee')) + '</div>';
    h += '<div class="card" style="margin:0 0 12px">' + amdBig(al.fee)
      + '<div class="prov">' + escH(feeWhy(d)) + '</div>'
      /* AN OVER-ALLOCATED DEAL GETS THE WARNING AND NOTHING ELSE. When Σ shareBp exceeds 10000
         the numbers are known to be wrong — mintEarnings() refuses to post from them — and the
         table printed anyway showed a NEGATIVE agency keep beside a «0%» share and a «130%»
         total, with the ✓ reconciliation line under it because the assertion is true by
         construction. A table that reconciles arithmetically while describing an impossible
         agreement is worse than no table. */
      + (al.over ? '<div class="notice bad">' + escH('⚠️ ' + t('cm_over')) + '</div>'
          + '<div class="prov warn">' + escH(fmt('cm_over_b', {n:bpTxt(al.sumBp)})) + '</div>'
        : '<div class="spwrap"><table class="sp"><thead><tr><th>' + escH(t('tab_agents')) + '</th>'
        + '<th class="n">' + escH(t('cm_share')) + '</th><th class="n">' + escH(t('cm_amount')) + '</th></tr></thead><tbody>'
      + al.rows.map(r => '<tr><td>' + escH(agentEm(r.agentId) + ' ' + agentName(r.agentId))
          + '<div class="muted">' + escH(r.side ? t('ag_side_'+r.side) : '') + '</div></td>'
          + '<td class="n">' + escH(bpTxt(r.shareBp)) + '</td>'
          + '<td class="n">' + amdTxt(r.amount) + '</td></tr>').join('')
      + '<tr class="keep"><td>' + escH(t('cm_keep')) + '</td><td class="n">'
        + escH(bpTxt(Math.max(0, 10000 - al.sumBp))) + '</td><td class="n">' + amdTxt(al.agencyKeep) + '</td></tr>'
      + '<tr class="tot"><td>' + escH(t('total')) + '</td><td class="n">'
        + escH(bpTxt(al.sumBp + Math.max(0, 10000 - al.sumBp))) + '</td><td class="n">'
        + amdTxt(al.rows.reduce((x,r) => x + r.amount, 0) + al.agencyKeep) + '</td></tr>'
      + '</tbody></table></div>'
      + '<div class="prov">' + escH((assertReconciles(al) ? '✓ ' : '⚠️ ') + t('cm_recon')) + '</div>')
      + '<button class="btn ghost full" style="margin-top:12px" onclick="openTerms(' + jsArg(d.id) + ')">'
        + escH(t('cm_edit')) + '</button>'
      + '</div>';
  }

  /* ---- WHICH VIEWING SUPPORTS THIS CLAIM ----
     Invariant 5, made answerable. The agency's claim to a fee rests on having shown this
     property to this client, so the deal names the viewing that did it, with its date, its agent
     and whether the client signed the sheet. A deal with no supporting viewing is not a
     data-entry gap, it is an unsupported claim, and the sheet says exactly that. */
  h += '<div class="sec">🔑 ' + escH(t('vw_support')) + '</div>';
  const sv = supportingViewings(d);
  h += '<div class="card" style="margin:0 0 12px">'
    + '<div class="prov">' + escH(t('vw_support_b')) + '</div>'
    + (sv.length
        ? sv.map(v => '<button class="pick" onclick="openViewingSheet(' + jsArg(v.id) + ')">'
            + escH(fdate(v.ts) + ' · ' + clientName(v.clientId))
            + '<span class="pd">' + escH(agentEm(v.agentId) + ' ' + agentName(v.agentId) + ' · '
              + outcomeLabel(v.outcome) + ' · '
              + (v.signedTs ? t('vw_signed') + ' ' + fdate(v.signedTs) : t('vw_unsigned')))
            + '</span></button>').join('')
        : '<div class="notice bad">' + escH('⚠️ ' + t('vw_support_none')) + '</div>')
    + '</div>';

  /* ---- the two clocks and the checklist ---- */
  /* THE CLOSING CHECKLIST IS A SCREEN, NOT A DOCUMENT. It is a working aid — unified certificate
     pulled, consents obtained, the non-cash sentence said out loud, the notary, the filing
     deadline — and printing a to-do list is how a product signals it does not know what a
     document is for. */
  h += '<div class="sec">📌 ' + escH(t('d_checklist')) + '</div>';
  h += '<div class="card" style="margin:0 0 12px">';
  if(d.dates.notaryTs && !d.dates.filedTs && !d.void){
    const left = workingDaysLeft(d.dates.notaryTs, S.cfg.filingDays, S.today);
    h += '<div class="row"><span class="mlbl">' + escH(t('d_filing')) + '</span><span class="num">'
      + escH(filingLeftText(left)) + '</span></div>'
      + (left < 0 ? '<div class="notice bad">' + escH('⏳ ' + t('c_clock_over')) + '</div>' : '')
      /* A COUNTDOWN THAT CANNOT SAY WHAT CALENDAR IT USED IS A COUNTDOWN NOBODY TRUSTS. */
      + '<div class="prov' + (left < 0 ? ' warn' : '') + '">'
      + escH(t(holidayTableCovers(d.dates.notaryTs, S.cfg.filingDays) ? 'd_filing_src'
            : holidayTableKnownStart(d.dates.notaryTs) ? 'd_filing_src_partial' : 'd_filing_src_unknown')) + '</div>';
  }
  if(DEAL_RANK[d.stage] >= DEAL_RANK.deposit && d.price > 300000 && !d.void){
    /* a NOTICE, not a blocker. The app is not the compliance officer; it is the thing that says
       the sentence out loud before the notary does. */
    h += '<div class="notice">' + escH('💳 ' + t('d_noncash')) + '</div>';
  }
  const consOk = d.consents.spouse && d.consents.coOwners;
  h += '<div class="row"><span class="mlbl">' + escH(t('d_consents')) + '</span>'
    + '<span>' + (consOk ? badge('b-green','✓') : badge('b-gold','!')) + '</span></div>'
    + '<div class="prov' + (consOk ? '' : ' warn') + '">'

/* =====================================================================================
   THE DEAL THAT FELL THROUGH — §2.7 and §1.8
   Failure is not a stage. The stage still records how far the deal got, which is what the owner
   needs when the same buyer comes back in three weeks; `void` is a SET-ONCE object carrying the
   reason and the date. And if the fee was already earned, the earn rows STAY: a REVERSAL is
   derived against each of them, negative, naming `deal_void`, so nothing is left payable and the
   agent's statement shows both lines. Nothing is deleted and nothing is mutated — an agent whose
   money moved is owed the second line as much as the money.
   ===================================================================================== */
const dealEarnRows = dealId => rowsOfDeal(dealId).filter(r => r.type === 'earn');
function reversedFor(dealId, agent){
  return rowsOfDeal(dealId).filter(r => r.type === 'reverse' && r.agent === agent)
    .reduce((n,r) => n + safeInt(r.amt,0), 0);
}
/* THE REVERSAL IS DERIVED FROM THE LOG, NEVER TYPED. One row per subject that earned on this
   deal, for whatever of their earnings is not already reversed — so running it twice finds
   nothing left to reverse, and a device that adopts a payload carrying a void without its
   reversals derives exactly the rows the other device already has. */
function postVoidReversals(deal, ts, note){
  if(!deal) return 0;
  /* Object.create(null), never {} — a bare literal would make the string '__proto__' a truthy
     agent id, which is how a sibling product in this suite grew a supplier nobody hired. */
  const by = Object.create(null);
  dealEarnRows(deal.id).forEach(r => { by[r.agent] = (by[r.agent] || 0) + safeInt(r.amt,0); });
  let n = 0;
  Object.keys(by).forEach(ag => {
    const left = by[ag] + reversedFor(deal.id, ag);
    if(!left) return;
    if(postRow({ agent:ag, type:'reverse', amt:-left, ts:ts, deal:deal.id, prop:deal.propertyId,
      reason:'deal_void', actor:'owner', note:note })) n++;
  });
  return n;
}
/* run at boot on the owner's device: any deal marked void whose earnings have not been reversed
   gets its reversal now. The money rows are DERIVED on this device, per §1.9 — an agent's device
   may contribute the collapse, never the row that unwinds the money. */
function reconcileVoids(){
  let n = 0;
  (S.deals||[]).forEach(d => {
    if(d && d.void && d.void.ts) n += postVoidReversals(d, d.void.ts, d.void.reason || '');
  });
  return n;
}

let VD = null;
function openVoid(dealId){
  const d = dealById(dealId); if(!d) return;
  if(d.void && d.void.ts){ toast(t('d_void_already')); return; }
  VD = { deal:dealId, reason:'' };
  drawVoid();
}
function vdInput(v){
  if(!VD) return;
  VD.reason = String(v == null ? '' : v);
  const b = document.getElementById('vdSave');
  if(b) b.disabled = !VD.reason.trim();
}
function drawVoid(){
  if(!VD) return;
  MODAL_RE = drawVoid;
  const d = dealById(VD.deal); if(!d) return;
  const pr = propById(d.propertyId);
  const al = allocation(d);
  const earned = dealEarnRows(d.id).reduce((n,r) => n + safeInt(r.amt,0), 0)
    + rowsOfDeal(d.id).filter(r => r.type === 'reverse').reduce((n,r) => n + safeInt(r.amt,0), 0);
  openModal('<h3>✖️ ' + escH(t('d_void_title')) + '</h3>'
    + '<div class="muted">' + escH((pr ? propAddr(pr) : '') + ' · ' + dealDocNo(d)) + '</div>'
    + '<div class="prov">' + escH(t('d_void_help')) + '</div>'
    /* WHAT IS ABOUT TO BE REVERSED, IN DRAM, BEFORE THE OWNER COMMITS. A void that silently
       unwinds a six-figure fee is a void the owner should have been warned about. */
    + (earned ? '<div class="notice bad" style="margin-top:10px">' + escH('⚠️ ' + t('lt_reverse')
        + sepC() + amdTxt(earned) + ' ֏') + '</div>' : '')
    + (al && !earned ? '<div class="prov">' + escH(t('st_expected') + sepC() + amdTxt(al.fee) + ' ֏') + '</div>' : '')
    + '<div class="fieldlbl" style="margin-top:12px">' + escH(t('d_void_reason')) + '</div>'
    + '<textarea rows="3" oninput="vdInput(this.value)">' + escH(VD.reason) + '</textarea>'
    + '<div class="prov warn">' + escH(t('d_void_reason_req')) + '</div>'
    + '<button class="btn danger full" id="vdSave" style="margin-top:14px"'
      + (VD.reason.trim() ? '' : ' disabled') + ' onclick="saveVoid()">'
      + escH(t('d_void_do')) + '</button>'
    + '<button class="btn ghost full" style="margin-top:9px" onclick="closeModal()">' + escH(t('cancel')) + '</button>');
}
function saveVoid(){
  if(!VD) return;
  const d = dealById(VD.deal); if(!d) return;
  const reason = String(VD.reason || '').trim();
  if(!reason) return;
  if(d.void && d.void.ts) return;          /* SET-ONCE: firstWrite, here as in the merge rule */
  d.void = { ts:S.today, reason:reason, by:'owner' };
  /* the collapse itself is evidence, and it is in the log with everything else that happened */
  postRow({ agent:AGENCY, type:'doc', amt:0, ts:S.today, deal:d.id, prop:d.propertyId,
    reason:'deal_void', rank:DEAL_RANK[d.stage], actor:'owner', note:reason });
  const n = postVoidReversals(d, S.today, reason);
  const id = d.id; VD = null;
  saveState(); closeModal(); renderAll();
  toast(t('d_void_saved') + (n ? ' · ' + fmt('d_void_rev', {n:n}) : ''));
  openDeal(id);
}

   stored percentage that reached backwards would make every past commission statement a fiction.

   routing to a screen that offered no way to set one.

const AGENT_EMS = ['🧑','👩','👨','🧕','🙋','🧑‍💼','👩‍💼','👨‍💼','🧔','👱'];

function saveAgent(){
  if(!AG) return;
  const name = String(AG.name || '').trim();
  if(!name){ toast(t('ag_need_name')); return; }
  /* AN EMPTY SHARE STAYS EMPTY. null is «not agreed yet» and 0 is «this agent gets nothing» —
     collapsing the two would be the same mistake as inventing a commission rate. */
  const raw = String(AG.share).trim();
  const bp = raw === '' ? null : Math.max(0, Math.min(10000, bpFromPct(raw) == null ? 0 : bpFromPct(raw)));
  const phone = String(AG.phone || '').trim();
  let a = AG.id ? agentById(AG.id) : null;
  if(!a){
    const id = contentId('a', name + KSEP + phone, (S.agents||[]).length);
    a = { id:id, name:name, phone:phone, em:AG.em || '🧑', defaultShareBp:null,
          joinedTs:S.today, leftTs:0, qual:{regNo:'', examTs:0, insurerName:'', insuranceTo:0}, rid:'' };
    (S.agents = S.agents || []).push(a);

  a.name = name; a.phone = phone; a.em = AG.em || '🧑';
  a.defaultShareBp = bp;

             insurerName:String(AG.insurer || ''), insuranceTo:safeInt(AG.insTo,0) };

  saveState(); closeModal(); renderAll(); toast(t('ag_saved'));

/* ---------- the per-deal shares ----------
   Editable per deal by the owner, and only BEFORE the fee is earned. After it is earned the
   product refuses the edit and names the instrument that exists for it — an adjustment row with
   a mandatory note (§1.8) — because rewriting a share that has already been paid against turns a
   past commission statement into a fiction. */
let DA = null;
function openDealAgents(dealId){
  const d = dealById(dealId); if(!d) return;
  DA = { deal:dealId, rows:(d.agents||[]).map(a => ({ agentId:a.agentId, side:a.side || 'listing',
          pct: pctText(safeBp(a.shareBp,0)), joinedTs: safeInt(a.joinedTs, 0) || S.today })) };
  drawDealAgents();
}
function daInput(i, v){
  if(!DA || !DA.rows[i]) return;
  DA.rows[i].pct = String(v == null ? '' : v);
  const el = document.getElementById('daSum');
  if(el) el.innerHTML = daSumHtml();
  const b = document.getElementById('daSave');
  if(b) b.disabled = daSumBp() > 10000;
}
function daSide(i, v){ if(DA && DA.rows[i]){ DA.rows[i].side = v; drawDealAgents(); } }
function daRemove(i){ if(DA){ DA.rows.splice(i,1); drawDealAgents(); } }
function daAdd(agentId){
  if(!DA) return;
  if(DA.rows.some(r => r.agentId === agentId)) return;
  const a = agentById(agentId);
  DA.rows.push({ agentId:agentId, side:'selling',
    pct: (a && a.defaultShareBp != null) ? pctText(a.defaultShareBp) : '', joinedTs:S.today });
  drawDealAgents();
}
const daSumBp = () => (DA ? DA.rows.reduce((n,r) => n + (bpFromPct(r.pct) || 0), 0) : 0);
function daSumHtml(){
  const sum = daSumBp();
  const d = dealById(DA.deal);

function drawDealAgents(){
  if(!DA) return;

        + escH(a.em + ' ' + a.name) + '<span class="pd">' + escH(a.defaultShareBp == null

function saveDealAgents(){
  if(!DA) return;

/* =====================================================================================
   PAYOUTS — the owner's answer to "what do I owe"
   ===================================================================================== */
function payoutsView(){
  const rows = activeAgents().map(a => ({ a:a, m:agentMoney(a.id) }));
  const tot = rows.reduce((acc,x) => ({
    expected: acc.expected + x.m.expected, earned: acc.earned + x.m.earned,
    payable: acc.payable + x.m.payable, paid: acc.paid + x.m.paid
  }), {expected:0, earned:0, payable:0, paid:0});

  let h = secTitle('💳', t('pay_title'));
  h += '<div class="card"><div class="mlbl">' + escH(t('st_payable')) + '</div>' + amdBig(tot.payable)
    + '<div class="pofour">'
      + '<div><div class="l">' + escH(t('st_expected')) + '</div><div class="v">' + amdTxt(tot.expected) + '<span class="cur">֏</span></div></div>'
      + '<div><div class="l">' + escH(t('st_earned')) + '</div><div class="v">' + amdTxt(tot.earned) + '<span class="cur">֏</span></div></div>'
      + '<div><div class="l">' + escH(t('st_paid')) + '</div><div class="v">' + amdTxt(tot.paid) + '<span class="cur">֏</span></div></div>'
      + '<div><div class="l">' + escH(t('pay_owed')) + '</div><div class="v">' + amdTxt(tot.earned - tot.paid) + '<span class="cur">֏</span></div></div>'
    + '</div>'
    /* THE FOUR TOTALS ARE NEVER ADDED TOGETHER. A pipeline number and a debt are different kinds
       of thing, and a back office that blurs them is why owners keep the real figures in a
       private spreadsheet. */
    + '<div class="prov">' + escH(t('pay_derived')) + '</div></div>';

/* the agent's own book — every earn and payout row with its deal and its trigger. This is the
   commission statement REBUILT FROM THE LOG rather than stored, so two devices holding the same
   rows render the same statement. */
/* ---------- DOCUMENT 2 · Միջնորդավճարի հաշվարկ (to the agent) ----------
   The monthly statement: period, opening balance, every earn / payout / reverse / adjust row
   with its deal, its basis and its trigger, closing balance, the amount in words in Armenian,
   and two signature rules. REBUILT FROM THE LOG rather than stored, so two devices holding the
   same rows render the same statement byte for byte — which is the whole reason `owed` is a
   fold and not a counter. */
let STMT_P = 'all';
function setStmtPeriod(agentId, p){ STMT_P = p; openStatement(agentId); }
function stmtDocNo(agentId, from){
  const d = new Date(safeInt(from, 0));
  const p = n => (n < 10 ? '0' : '') + n;
  return 'ՄՀ-' + d.getUTCFullYear() + '-' + p(d.getUTCMonth()+1) + '-' + String(agentId).toUpperCase();
}
function openStatement(agentId){
  const a = agentById(agentId); if(!a) return;
  MODAL_RE = () => openStatement(agentId);
  const m = agentMoney(agentId);
  const all = moneyRowsFor(agentId).slice().sort((x,y) => (x.ts - y.ts) || (x.uuid < y.uuid ? -1 : 1));
  const now = new Date(S.today);
  const monthFrom = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), 1);
  const from = STMT_P === 'month' ? monthFrom : (all.length ? all[0].ts : S.today);
  /* THE OPENING BALANCE IS THE FOLD OVER EVERYTHING BEFORE THE PERIOD — the same `+` as the
     closing balance, over the same book. A statement whose opening figure came from anywhere
     else is a statement that can disagree with itself. */
  let bal = 0;
  all.forEach(r => { if(r.ts < from) bal += r.amt; });
  const opening = bal;
  const inPeriod = all.filter(r => r.ts >= from);

  const body = inPeriod.map(r => {
    bal += r.amt;
    const d = r.deal ? dealById(r.deal) : null;
    const p = d ? propById(d.propertyId) : null;
    const mine = d ? (d.agents||[]).find(x => x.agentId === agentId) : null;
    /* the BASIS, per the brief: which deal, what rate, which share of it, and what made it
       earned — «why is this money mine now» is the question a payout has to survive. */
    const basis = [
      p ? propAddr(p) : '',
      d && d.terms ? rateAsTyped(d.terms) : '',
      mine ? t('cm_share') + ' ' + bpTxt(mine.shareBp) : '',
      r.trigger ? triggerLabel(r.trigger) : '',
      r.reason === 'deal_void' ? t('rsn_deal_void') : '',
      r.reason === 'negotiated' ? t('adj_open') : ''
    ].filter(Boolean).join(' · ');
    return '<tr><td>' + escH(fdate(r.ts)) + '<div class="muted">' + escH(rowTypeLabel(r.type))
        + (d ? ' · ' + escH(dealDocNo(d)) : '') + '</div>'
      + (basis ? '<div class="muted">' + escH(basis) + '</div>' : '')
      + (r.note ? '<div class="muted">' + escH(r.note) + '</div>' : '') + '</td>'
      + '<td class="n">' + (r.amt < 0 ? '−' : '') + amdTxt(Math.abs(r.amt)) + '</td>'
      + '<td class="n">' + (bal < 0 ? '−' : '') + amdTxt(Math.abs(bal)) + '</td></tr>';
  }).join('');

  const ag = S.agency || {};
  const to = S.today;
  let h = '<h3>📄 ' + escH(t('stmt_title')) + '</h3>'
    + '<div class="muted">' + escH(t('doc_no') + ' ' + stmtDocNo(agentId, from) + ' · ' + fdate(to)) + '</div>'
    + '<hr class="actrule">'
    + '<div class="row" style="align-items:flex-start;gap:14px;flex-wrap:wrap">'
      + docParty(t('doc_agency'), ag.name, docTin(ag.tin))
      + docParty(t('doc_agent'), a.em + ' ' + a.name, a.phone)
    + '</div>'
    /* the period selector is a control, not part of the document */
    + '<div class="chips wrap noprint" style="margin-top:10px">'
      + [['month', t('stmt_month')], ['all', t('stmt_all')]].map(x =>
          '<button class="' + (STMT_P === x[0] ? 'active' : '') + '" onclick="setStmtPeriod('
          + jsArg(agentId) + ',' + jsArg(x[0]) + ')">' + escH(x[1]) + '</button>').join('')
    + '</div>'
    + '<div class="row" style="margin-top:10px"><span class="mlbl">' + escH(t('stmt_period'))
      + '</span><b>' + escH(fdate(from) + ' — ' + fdate(to)) + '</b></div>'
    + '<div class="row"><span class="mlbl">' + escH(t('stmt_open')) + '</span>' + amd(opening) + '</div>'
    + '<div class="spwrap"><table class="sp"><thead><tr><th>' + escH(t('doc_col')) + '</th><th class="n">'
      + escH(t('amount_col')) + '</th><th class="n">' + escH(t('balance')) + '</th></tr></thead>'
    + '<tbody>' + (body || '<tr><td colspan="3" class="muted">' + escH(t('stmt_none')) + '</td></tr>')
    + '<tr class="tot"><td>' + escH(t('stmt_close')) + '</td><td class="n"></td><td class="n">'
      + (bal < 0 ? '−' : '') + amdTxt(Math.abs(bal)) + '</td></tr></tbody></table></div>'
    /* THE AMOUNT IN WORDS IS WRITTEN IN ARMENIAN ON EVERY LANGUAGE OF THE UI, because that is
       the language the document is signed in. */
    + '<div class="muted" style="margin-top:8px">' + escH(t('stmt_words')) + sepC() + '<b>'
      + escH(amWords(bal)) + '</b></div>'
    + '<div class="muted" style="margin-top:8px">' + escH(bal === 0 ? t('stmt_settled')
        : bal > 0 ? t('stmt_owed') : t('stmt_credit')) + '</div>'
    + '<div class="row" style="margin-top:10px"><span class="mlbl">' + escH(t('st_payable'))
      + '</span>' + amd(m.payable) + '</div>'
    + '<div style="display:flex;gap:20px;margin-top:22px;flex-wrap:wrap">'
      + docSign(t('doc_sign_agency') + (ag.name ? ' · ' + ag.name : ''))
      + docSign(t('doc_sign_agent') + ' · ' + a.name) + '</div>'
    + docFoot(t('stmt_note'))
    + '<div class="prov noprint">' + escH(t('pay_derived')) + '</div>'
    + '<button class="btn ghost full noprint" style="margin-top:12px" onclick="openAdjust('
      + jsArg(agentId) + ')">⚖️ ' + escH(t('adj_open')) + '</button>'
    + docTail();
  openModal(h);
}

/* THE EVIDENCE LOG HAS TO BE REACHABLE. This is the screen an owner opens when a client
   disputes a fee and one row has to be found — the row proving this client saw this property

  if(VIEW_F.unsigned && v.signedTs) return false;

function viewList(){
